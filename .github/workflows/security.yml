name: Security analysis

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions:
  # CodeQL reads the workflow run on private repositories.
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-review:
    # Dependency review needs GitHub Advanced Security on private repositories.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven
      - name: Build
        run: ./mvnw -B -DskipTests package
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          # Code scanning cannot be enabled on this private repository, so the
          # results are kept as a run artifact instead of uploaded as alerts,
          # and the database upload (which would fail and retry) is skipped.
          upload: never
          upload-database: false
          output: sarif-results
      - name: Upload SARIF
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: sarif-results
      - name: Summarize findings
        run: |
          sarif=sarif-results/java.sarif
          {
            echo "## CodeQL: $(jq '[.runs[].results[]] | length' "$sarif") result(s)"
            echo
            echo "Full details are in the \`codeql-sarif\` artifact."
            echo
            echo "| Rule | Results |"
            echo "| --- | --- |"
            jq -r '[.runs[].results[].ruleId] | group_by(.) | sort_by(-length)[] | "| \(.[0]) | \(length) |"' "$sarif"
          } >> "$GITHUB_STEP_SUMMARY"
