name: Build and test
# master is the P0nk/Cosmic line; BotStory is pushed (through the scrub script) as feat/companion-manager, the
# default branch of Incluwin/BotStory, so both are built.
on:
  push:
    branches:
      - master
      - feat/companion-manager
  pull_request:
    branches:
      - master
      - feat/companion-manager

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'corretto'
        cache: maven
    - name: Build with Maven (compile -> test -> package)
      run: ./mvnw -B verify
