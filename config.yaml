    DROP_SIM_ENABLED: true
    LIFECYCLE_ENABLED: true
    TREASURY_COLLECTION_ENABLED: true
    BUY_ORDERS_ENABLED: false
    #Population and spawning.
    BOT_POOL_SIZE: 200
