    MEMORY_EPISODES_MAX: 6
    MEMORY_TOTAL_MAX: 20000
    MEMORY_FORGET_DAYS: 60
    MEMORY_HALF_LIFE_DAYS: 10.0
    MEMORY_WARMTH_HALF_LIFE_DAYS: 14.0
    MEMORY_RETURN_AFTER_MINUTES: 180
    MEMORY_GREET_GAP_MS: 300000
    # Citizens learn where to train (docs/BOT_CONCEPT_PLAN.md F2.1). A loaded citizen's TRAIN stint on a field is booked
    # (EXP and deaths an hour per class line, level band and field) when it moves on, goes AFK, logs off or dies; one
    # shorter than SPOT_MIN_MS, one it left another way (its own shop trip) or an abstract one is not. Among the fields
    # that fit (mob level, room, the healer rule, the 60% human-map preference first) it then picks by what citizens
    # measured, plus a UCB bonus of SPOT_EXPLORE for fields measured less, less SPOT_CROWDING for a field full of loaded
    # citizens; drawn with weight exp((ucb - best) / SPOT_TEMPERATURE), never all to one map. false = the kill switch:
    # no stint booked and the uniform random pick, as before.
    # Technical: CitizenSpots.arms scores each field with BenchYieldModel citizen rows shrunk by BENCH_YIELD_PRIOR_SLICES toward BenchDutyChooser.fit; draw() samples by softmax.
    CITIZEN_SPOT_LEARNING_ENABLED: false
    CITIZEN_SPOT_EXPLORE: 0.3
    CITIZEN_SPOT_CROWDING: 0.5
    CITIZEN_SPOT_TEMPERATURE: 0.15
    CITIZEN_SPOT_MIN_MS: 300000
    # The needs board (docs/BOT_CONCEPT_PLAN.md F1): citizens ask for real things they lack and pay from their own
    # purse. SUPPLY: the potion it would buy for Balrog, short of the standard; SCROLL: a basket scroll for a piece it
    # wears, when it can pay the index price; GEAR (decision D4): GEAR_WANT_SHARE of its free gear upgrades become a want,
    # granted as before after GEAR_DEADLINE_HOURS; PARTY: its forming party is short. At most PER_CITIZEN item needs each;
    # SUPPLY and SCROLL end after EXPIRE_MIN..MAX_HOURS, and the same one is not asked again for REPOST_HOURS. It names the
    # real item, count and price in map chat (the random "B>" lines go), a share of the megaphones, and a whisper to a
    # player it likes on its map (one per WHISPER_GAP_MINUTES a player). Bulletin Boards in the FM and the main towns list
    # them; a player holds CLAIMS_PER_PLAYER requests for CLAIM_MINUTES each and hands the item over in person (double
    # click the citizen) or at a board (escrow until its next load). false = the kill switch: none of it.
    # Technical: NeedLedger keeps the open living_need rows in memory, derives at each citizen load and every REFRESH_MINUTES on the 60 s social lane, and moves item and mesos in one NEED_FULFILLED economy transaction.
    NEEDS_ENABLED: false
    NEEDS_PER_CITIZEN: 2
    NEEDS_EXPIRE_MIN_HOURS: 24
    NEEDS_EXPIRE_MAX_HOURS: 48
    NEEDS_GEAR_WANT_SHARE: 0.3
    NEEDS_GEAR_DEADLINE_HOURS: 48
    NEEDS_SCROLL_CHANCE: 0.15
    NEEDS_SUPPLY_PREMIUM: 1.15
    NEEDS_CLAIMS_PER_PLAYER: 3
    NEEDS_CLAIM_MINUTES: 60
    NEEDS_WHISPER_GAP_MINUTES: 60
    NEEDS_REFRESH_MINUTES: 15
    NEEDS_REPOST_HOURS: 12
    # Citizens run boss expeditions themselves (2026-10-25, docs/CITIZEN_EXPEDITIONS_PLAN.md): citizens Lv50+ of the
    # regions past Victoria go on outings to Mu Young (Sleepywood), form a party there as at a PQ lobby (inviting a
    # human who fits first), and their leader makes the Balrog expedition with her window. The others sign up through
    # it, a human of the party signs up by talking to her, and the leader starts it. The server moves Balrog, so they
    # fight it with or without a human, then play the reward room as players do (a human gets the first 7 s), loot
    # their share and go back to their day. Player first: never while a human leads a Balrog list or fight on that
    # channel, nor while a human Lv50+ outside their party stands in her room; a human may sign up on their list.
    # false = the kill switch: they only gather and invite there. BOSS_RUN_BOSSES: "easy_balrog", "balrog_normal"
    # (only bosses the server moves itself; Zakum and up need a human's client to fight back). BOSS_RUNS_MAX: citizen
    # expeditions at once in all (user 2026-10-25: 1). BOSS_RUN_SEATS: how many the party fills to (3..6).
    # BOSS_NORMAL_MIN_LEVEL: a party of 6 whose citizens are all this level or more goes Normal, else Easy.
    # BOSS_RUN_COOLDOWN_MS: no PQ or expedition plan for a citizen this long after its expedition.
    # BOSS_SIGNUP_WAIT_MS: how long the leader waits for a human of its party to sign up before it starts without.
    BOSS_RUNS_ENABLED: true
    BOSS_RUN_BOSSES: "easy_balrog,balrog_normal"
    BOSS_RUNS_MAX: 1
    BOSS_RUN_SEATS: 6
    BOSS_NORMAL_MIN_LEVEL: 80
    BOSS_RUN_COOLDOWN_MS: 3600000
    BOSS_SIGNUP_WAIT_MS: 120000

# Server knowledge: what bots know about this server's content (drops, shops, maps, routes, quests),
# from scripts/config/knowledge/server-knowledge.json (tools\knowledge-export.bat) plus the live
# drop/shop tables (docs/SERVER_KNOWLEDGE_PLAN.md). Independent of living_world. ASCII only.
knowledge:
    ENABLED: true
    CONTENT_DIR: scripts/config/knowledge
    CITIZENS: true
    COMPANIONS: true
    RESIDENTS: true
    HORIZON_LEVEL_SLACK: 10
    MAX_REPLY_CHARS: 70
    LOG_UNRESOLVED: true
    PERSONAL: true
    VETERAN_LEVEL: 70
    DECISIONS: true
    CITIZEN_GEAR: true
    GUIDES: true

# Server mods and the kaentake client's login feature handshake (docs/CLIENT_FEATURE_HANDSHAKE.md). ASCII only.
mods:
    # One switch per server mod (server.mods.ServerMods), read at boot; "!mods <id> on|off" flips one until the next
    # restart. A mod with no line here takes its own default. An environment variable MOD_<ID> (MOD_FUSION_ANVIL=on
    # in .env, or under environment: in docker-compose) wins over the line here.
    #   client_feature_policy  answer client feature lists from FEATURES below; off: every feature is allowed
    #   fusion_anvil           send each equip's Fusion Anvil id, which only the BotStory build of kaentake reads; any
    #                          other client closes on entering the game when it is on. Boot only (no !mods flip)
    #   botstory_wz            the clients have BotStory's WZ files: characters get the Evolving Ring and the Hunter's
    #                          Codex moves to the cash medal slot. A client on the Cosmic WZ files closes when it is on
    #   beginner_ap            a Beginner whose client has beginner_ap active keeps each level-up's AP to place;
    #                          off: USE_AUTOASSIGN_STARTERS_AP spends it for them
    #   set_items              a client with set_items active is sent its job's sets and what it wears of them, for
    #                          the equip tooltip; display only
    #   storage_bag            the Storage Bags (ores, scrolls, chairs, mounts) behind the client's storage_bag
    #                          window, allowed under FEATURES below; off: the window's requests are ignored
    #   cash_item_trade        two players may trade cash items (not pets or partner rings, never to a companion);
    #                          the client's cash_item_trade feature, allowed under FEATURES below, lifts its own
    #                          refusal; stores, merchants, Duey and drops still refuse cash items; off: trades too
    #   death_count            boss runs get the shared death budget DEATH_COUNTS below; each player death spends one,
    #                          dying with none left ends the run like its clock; companions never spend it
    #   shop_buyback           a client with shop_buyback active buys back its last 30 NPC shop sales of the session,
    #                          each for what its sale paid; off: the Buy Back button's requests are refused
    #   weather                day and night and each region's sky, sent once a minute and on map entry to a client
    #                          with weather active (docs/WEATHER.md); cosmetic; off: the clients render a plain noon
    #   cash_shop_window       a client with cash_shop_window active gets the Cash Shop window over the field from the
    #                          Cash Shop button (docs/CASH_SHOP_WINDOW.md): the stock shop's offers, prices and
    #                          durations, for NX Credit or Maple Points; its own button enters the stock Cash Shop
    #   repack_maps            the 579 maps only the Community Repack client has (Coke Town, Ninja Castle, Ulu City,
    #                          Lion King's Castle, the Future, Arcane River): an account that answered "Repack files"
    #                          goes in, any other is refused (docs/REPACK_IMPORT_PLAN.md); off: nobody goes in
    #   cryssea                Cryssea (iTCG card swap) stands in New Leaf City's Town Center. Every client needs her
    #                          Custom.wz look from the Masteria client patch first (docs/ITCG_MASTERIA_PLAN.md); a
    #                          client without it closes on entering New Leaf City. Boot only
    # fusion_anvil and botstory_wz ship off, for a client made from public files (docs/SETUP.md); the BotStory client
    # needs both on.
    SWITCHES:
        client_feature_policy: on
        fusion_anvil: off
        botstory_wz: off
        beginner_ap: off
        set_items: on
        storage_bag: on
        cash_item_trade: on
        death_count: on
        shop_buyback: on
        weather: on
        cash_shop_window: on
        repack_maps: on
        cryssea: off
    # What the server answers a client's feature list at login, by kaentake feature_list.h id:
    #   allow     the player's own switch decides
    #   deny      the client makes the feature inert (a feature that cannot go inert while the game runs stays
    #             off from the next start)
    #   require   the player is told when their client lacks the feature or has it switched off
    # A number after the word is the oldest feature version it holds for ("require 2"): an older version is denied
    # where the line allows it and counts as lacking where it requires it. "!mods feature <id> ..." changes a line
    # until the next restart. Gameplay features (free_addy: damage cap 999,999 and speed cap 250;
    # ext_chain_lightning: Chain Lightning range and no damage dropoff; beginner_ap: the stat window lets Beginners
    # place AP at level 10 and below, given AP by the beginner_ap switch above; crit_damage_mul: a critical hit
    # multiplies the damage line by the critical damage %, as companions crit) are server_gated in the client.
    FEATURES:
        free_addy: allow
        ext_chain_lightning: allow
        beginner_ap: allow
        storage_bag: allow
        crit_damage_mul: allow
        cash_item_trade: allow
    # The answer for a server_gated feature FEATURES does not name (allow or deny): a new gameplay mod waits for a
    # line here.
    # weather_footing (slippery snow and ice, the weather module's physics) has no line, so it is denied: the weather
    # ships cosmetic only.
    SERVER_GATED_DEFAULT: deny
    # The deaths one boss run may take while death_count is on, by expedition type (server.expeditions.ExpeditionType,
    # lower case). Only players count; a type with no line (or 0) is stock. Pink Bean keeps its own 5-deaths rule.
    # "!deathcount [n]" shows or changes the count of the run a GM is in.
    DEATH_COUNTS:
        zakum: 10
        chaos_zakum: 5
