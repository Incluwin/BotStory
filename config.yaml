    # set its potion percentages drinks at the owner's median point once MIN_DRINKS were kept (HP never below HP_FLOOR,
    # never in boss content); a drink within DEATH_WINDOW_MS before the owner died came too late and is never kept.
    # "What you pick up" loot (the default while on) skips at most LOOT_MAX_SKIPS categories the owner leaves at least
    # LOOT_SKIP_SHARE of over LOOT_MIN_SEEN drops, whose left drops sell for at most LOOT_MAX_PRICE: never a quest item.
    # An item sold on SELL_MIN_VISITS separate visits is vendored at a bench resupply instead of hauled. A map with
    # MAP_MIN_KILLS kills in a band, within MAP_BEST_SHARE of the owner's best EXP an hour there and at most MAP_MAX_DEATHS
    # deaths an hour, joins Your call with a CAMP_BONUS higher prior. A skill used SKILL_MIN_USES times that lands
    # SKILL_MIN_SHARE of the owner's damage in a job starts SKILL_PRIOR_BUMP higher in a companion's combat learner.
    # Technical: OwnerHabitBook watches online owners from memory (LivingWorldHooks), learns each minute on the contracts timer and writes living_owner_habit behind; OwnerHabits.Rules holds these gates.
    OWNER_HABITS_ENABLED: false
