    # Decision 19 (b): bench upkeep is 30 meso per level an hour (paid ahead as wages, else out of the haul; a hired
    # hand's hourly wage is the same number), but never more than BENCH_UPKEEP_MAX_SHARE of the meso an hour the
    # companion is predicted to pick up at its camp (what live slices measured there, shrunk toward the ledger's
    # prior). At the prior that share is never reached (30 of ~594 meso per level, about 5%); a camp measured to pay
    # less lowers the upkeep, e.g. a Lv20 whose camp measured 2,000 meso/h over 12 hunts pays 414 an hour, not 600
    # (and 300 once its hunts far outweigh the prior).
    BENCH_UPKEEP_MAX_SHARE: 0.15
