# Living world: resident bots with quest lines, contracts, roster and bench (docs/LIVING_RPG_PLAN.md).
# Content is read from living_world.CONTENT_DIR; hot reload with !world reload. ASCII only in this file.
living_world:
    ENABLED: true
    WORLD: 0
    CHANNEL: 1
    CONTENT_DIR: scripts/config/living-world
    RESIDENT_SLEEP_AFTER_MS: 300000
    RESIDENT_TICK_MS: 5000
    ROUTINE_ZONE: "America/New_York"
    ALWAYS_AWAKE_TOWNS: "lith-harbor"
    RESIDENT_BUBBLE_MAX_CHARS: 70
    # Mixed into each Resident's skin, face and hair (and gender where the persona sets none). 0 = the looks this
    # server's Residents have always had; set your own number for your own cast, then re-run
    # tools\living-world-client.bat so the portraits match.
    RESIDENT_LOOK_SEED: 0
    # true once the clients have the living-world Quest.wz entries (tools\living-world-client.bat on a client
    # folder, or tools\living-world-questlog.bat then MapleEdit/app/living_world_quests.py + deploy);
    # otherwise the client would list nameless quests
    QUEST_LOG_MIRROR: true
    # quest icons replayed over Residents, only for the player they concern: something to take / something to hand in.
    # The Custom.wz paths are head-height copies of the NPC icons (MapleEdit/app/living_world_markers.py). A client
    # without BotStory's Custom.wz draws none: docs/SETUP.md step 5 of the game client has the stock icons and lift.
    QUEST_MARKER_AVAILABLE: "Custom/UI/UIWindow.img/QuestMarker/available"
    QUEST_MARKER_READY: "Custom/UI/UIWindow.img/QuestMarker/ready"
    QUEST_MARKER_PULSE_MS: 1100
    QUEST_MARKER_REFRESH_MS: 10000
    # Clicking a marker opens the Resident's menu: an invisible NPC the icon's size (written with the portraits by
    # tools\living-world-client.bat or MapleEdit/app/living_world_portraits.py) is spawned under it for that
    # player only. 0 = not clickable.
    # The client hit-tests an NPC as standing on its position, so LIFT raises it from the feet to the icon.
    QUEST_MARKER_HITBOX_NPC: 9970999
    QUEST_MARKER_HITBOX_LIFT: 72
    QUEST_MARKER_HITBOX_TRACK_MS: 250
    JEV_PER_PLAYER_PER_DAY: 60
    JEV_PERSONA_COOLDOWN_MS: 3000
    JEV_ANSWER_CACHE_MS: 600000
    LEARNED_PHRASE_MIN_CONFIDENCE: 0.90
    LEARNED_PHRASE_MIN_HITS: 3
    LEARNED_PHRASE_TTL_DAYS: 30
    BOND_ACQUAINTED_POINTS: 25
    BOND_TRUSTED_POINTS: 75
    BOND_SWORN_POINTS: 150
    # Friendship: a 1-10 meter over the same bond points (Lv 7 Close friend, Lv 10 Best friend). Fame, gifts, party
    # quests and bosses cleared with a Resident in the party add points beside quests; the last three count this many
    # times a day per Resident (ROUTINE_ZONE days). Friendship armour (`gear` pools) is scrolled by the giver: per level
    # 1-10, the percent of slots its 60% and 10% scrolls take (0 = that grade not used yet; 100% scrolls always take).
    # A giver's own weapon follows its authored recipe instead, every scroll taking.
    FRIENDSHIP_LEVEL_POINTS: "1,25,50,75,110,150,200,260,330,400"
    FRIENDSHIP_FAME_POINTS: 8
    FRIENDSHIP_GIFT_POINTS: 2
    FRIENDSHIP_GIFT_FAVORITE_POINTS: 6
    FRIENDSHIP_GIFTS_PER_DAY: 1
    FRIENDSHIP_PQ_POINTS: 10
    FRIENDSHIP_PQ_PER_DAY: 3
    FRIENDSHIP_BOSS_POINTS: 15
    FRIENDSHIP_BOSS_PER_DAY: 3
    FRIENDSHIP_SCROLL_TAKES_60: "0,0,0,70,80,95,100,100,100,100"
    FRIENDSHIP_SCROLL_TAKES_10: "0,0,0,0,0,0,45,60,75,90"
    CONTRACT_OFFER_MINUTES: 10
    LEADER_OFFLINE_BENCH_MS: 1200000
    # Decision 3: AUTHORED (the contract hours, outlevelled, three leader deaths and bench tolerance end a
    # contract), PERMANENT_ON_ROSTER (none of them do; arcs and a dismissal still can, wages keep working) or
    # PERMANENT_AT_SWORN (authored terms until the bond is SWORN). A walk-out always waits for a run to end.
    ROSTER_CONTRACT_MODE: PERMANENT_ON_ROSTER
    ROSTER_MAX: 10
    BENCH_LEDGER_INTERVAL_MS: 600000
    BENCH_FARM_EFFICIENCY: 0.6
    BENCH_FARM_HOURS_PER_DAY: 16
    BENCH_LIVE_MAX: 4
    BENCH_LIVE_SLICE_MS: 900000
    HAUL_MAX_STACKS: 24
    PACE_GAP: 3
    MAX_LAG: 8
    CATCH_UP_MAX_MULTIPLIER: 3.0
    APPRENTICE_BONUS_PER_LEVEL: 0.15
    APPRENTICE_MAX_LEVELS: 6
    RECALL_WHISTLE_ITEM_ID: 0
    # Decision 7: a companion called from camp on the same continent arrives within this many ms; off-island
    # trips keep their 180 s.
    RECALL_MAX_ETA_MS: 60000
    # Adventurer's Roster: double-clicking this USE item in the inventory opens the Crew window; it is not used up.
