    # its own last slices that listed an item for its whole length and sold none of it takes BENCH_STALL_MARKDOWN_STEP
    # of the index off that item, down to SELL's 0.85 where browsing citizens buy (they buy only under 0.9; Ilse's stall
    # at the index sold nothing in 346 slices); a sale puts it back at the index (0 = always the index). A gatherer whose
    # camp has no monster dropping what its owner's quests need goes to the best field for it, where a round of kills
    # brings the most, as the ledger already credits (false = always its camp).
    BENCH_STALL_MARKDOWN_STEP: 0.05
