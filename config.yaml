    OWNER_HABIT_LOOT_MAX_SKIPS: 4
    OWNER_HABIT_SELL_MIN_VISITS: 2
    OWNER_HABIT_MAP_MIN_KILLS: 30
    OWNER_HABIT_MAP_BEST_SHARE: 0.8
    OWNER_HABIT_MAP_MAX_DEATHS: 1.0
    OWNER_HABIT_CAMP_BONUS: 0.15
    OWNER_HABIT_SKILL_MIN_USES: 30
