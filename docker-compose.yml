services:
  maplestory:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      # Login server
      - "8484:8484"
      # Channels.
      # Format: WWCC, where WW is 75 plus the world number and CC is 75 plus the channel number (both zero indexed).
      # In this case, world 1 channels 1-3.
      - "7575-7577:7575-7577"
    volumes:
      # Config changes can be reloaded without rebuilding the image.
      # Still requires a redeployment as they're sourced on startup.
      - ./config.yaml:/opt/server/config.yaml
      - ./scripts:/opt/server/scripts
      - ./wz:/opt/server/wz
      - ./logs:/opt/server/logs
    environment:
      DB_HOST: "db" ## Remember if this is present it will OVERRIDE the host in the config.yaml, if you put here anything other than db, you'll need to change the config.yaml jdbc string to port 3307, and not port 3306
      DB_USER: "${DB_USER:-root}"
      DB_PASS: "${DB_PASS:?DB_PASS is required - copy .env.example to .env and set a value}"
      # Addresses for players on other PCs (see .env.example); blank keeps config.yaml.
      SERVER_HOST: "${SERVER_HOST:-}"
      SERVER_LANHOST: "${SERVER_LANHOST:-}"
      SERVER_TAILSCALEHOST: "${SERVER_TAILSCALEHOST:-}"

  db:
    image: mysql:8.4.0
    environment:
      MYSQL_DATABASE: "cosmic"
      MYSQL_ROOT_PASSWORD: "${DB_PASS:?DB_PASS is required - copy .env.example to .env and set a value}"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./database/docker-db-data:/var/lib/mysql

  # Optional economy evidence database (!economy runs, economy dashboard): docker compose --profile economy up
  economy-db:
    image: postgres:16.4
    profiles: ["economy"]
    environment:
      POSTGRES_DB: "${ECONOMY_DB_NAME:-cosmic_economy}"
      POSTGRES_USER: "${ECONOMY_DB_USER:-economy}"
      POSTGRES_PASSWORD: "${ECONOMY_DB_PASSWORD:-}" # set ECONOMY_DB_PASSWORD in .env before using this profile
    ports:
      - "127.0.0.1:${ECONOMY_DB_PORT:-5433}:5432"
    volumes:
      - ./economy-database/docker-db-data:/var/lib/postgresql/data
      - ./economy-database/migrations:/docker-entrypoint-initdb.d:ro
