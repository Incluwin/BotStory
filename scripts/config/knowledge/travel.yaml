# NPC travel the portal graph cannot see: ships, planes, the subway, cranes, elevators and taxis.
# Each leg: board at `from` (the map where `npc` stands) and arrive at `to`. Ids are checked against
# server-knowledge.json at load; a leg naming an unknown map or NPC is dropped with a warning.
# kind: ship / plane / subway / crane / dolphin / elevator / boat / guide / world-tour / taxi / cab. Routes (WorldKnowledge.route)
# use every kind except taxi, which is a shortcut, not the way; taxis are listed for answers and for travel. A cab is a
# taxi that is the only way somewhere (the NLC Taxi to the Haunted House), so routes take it.
# A guide or elevator hop counts like walking through one map; every other ride like walking ten.
# cost: the fare in mesos from the NPC or ticket script (0 = free or ticket only). Sources: scripts/npc/*.js,
# cross-checked with tmp/agent-llm-catalog/generated_travel_service_catalog.json.
