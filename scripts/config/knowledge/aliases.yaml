# Player names for game entities (docs/SERVER_KNOWLEDGE_PLAN.md 5.2), read by server.knowledge.NameIndex.
# Started from tmp/knowledge-research/aliases.draft.yaml (every id checked against String.wz); every id
# here is checked again against server-knowledge.json at load and by AliasCatalogTest.
#
# alias: what players type (matched after normalization: lowercase, no punctuation, singular tokens).
# kind:  item | mob | map | npc | region (several maps) | pq (lobby map first; npc + levels) | role (an NPC
#        job such as the potion shop, found by func / name token / an item its shop sells).
# ids:   canonical id first. say: the spoken name bots use (default: the first alias). wz: the String.wz name.
# Short or chat-like aliases (pe, cs, fm, ht) only resolve inside a typed question slot, never in free text.
# The `jobs` list maps class words to the branch and its advancement instructors (1st/2nd, 3rd, 4th).
