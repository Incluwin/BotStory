# Bot guild generator (plan 4.1): a pattern by weight, slot lists, mottos, and emblem palettes.
patterns:
  - { pattern: "{Adj}{Noun}", weight: 30 }
  - { pattern: "{Noun}s", weight: 10 }
  - { pattern: "{Adj}", weight: 8 }
  - { pattern: "{Noun}Of{Place}", weight: 8 }
  - { pattern: "The{Noun}", weight: 6 }
  - { pattern: "{Word}", weight: 20 }
lists:
  Adj: [Eternal, Silent, Crimson, Golden, Shadow, Frozen, Sacred, Rising, Fallen, Lunar, Solar, Wild, Iron, Velvet, Noble, Chaos, Divine, Ancient]
  Noun: [Legacy, Knights, Wolves, Phoenix, Dragons, Blade, Order, Guard, Legion, Empire, Haven, Crusade, Storm, Valor, Union, Circle, Pact, Court]
  Place: [Henesys, Ellinia, Perion, Orbis, Ludi, Victoria, Ossyria, Sleepywood]
  Word: [Legacy, Reborn, Serenity, Equinox, Zenith, Vanguard, Nostalgia, Genesis, Infinity, Exile, Harmony, Ascend, Remedy, Solace, Insomnia, Fable, Aurora, Nexus]
mottos:
  - "active and friendly, all levels welcome"
  - "we do PQs every night"
  - "no drama, just maple"
  - "lv30+ please"
  - "casual guild, come chill"
  - "recruiting mages and clerics"
  - "old school players welcome back"
  - "help each other, that's it"
# Bot guild alliances (docs/BOT_GUILD_ALLIANCES_PLAN.md): a name from these patterns over the lists above (no spaces and
# at most 12 letters, as Lenario asks; a longer draw is drawn again), and what citizens say. Slots: {guild} the
# speaker's guild, {other} the other guild, {alliance} the alliance. founded, welcome and leave go to alliance chat;
# accept, decline and invite are whispers to a player guild's master.
alliances:
  patterns:
    - { pattern: "{Adj}Pact", weight: 30 }
    - { pattern: "{Adj}Union", weight: 30 }
    - { pattern: "{Adj}Oath", weight: 15 }
    - { pattern: "{Place}Pact", weight: 15 }
    - { pattern: "{Word}Pact", weight: 10 }
  lines:
    founded:
      - "{alliance} is official, {other} and {guild} stick together now"
      - "welcome to {alliance} everyone! been running with {other} forever anyway"
      - "{guild} + {other} = {alliance}. see u all in pqs"
    welcome:
      - "welcome to {alliance}, {other}!"
      - "hey {other}, glad ur with us"
      - "{other} joined, nice. ask in here if u need a party"
    leave:
      - "{guild} is heading its own way. good luck all"
      - "we barely see anyone from {alliance} anymore, so {guild} is going solo. take care"
      - "leaving {alliance}, no hard feelings. {guild} out"
    accept:
      - "sure, {guild} is in. we've had good runs with ur people"
      - "accepted! {guild} is happy to join {alliance}"
    decline:
      - "sorry, {guild} doesn't really know {other} yet. run with us a while and ask again?"
      - "we'd rather get to know {other} first. maybe later"
    invite:
      - "ur guild's been great to run with, sent {other} an invite to {alliance}"
      - "{alliance} could use {other}. invite's in ur alliance window if u want it"
# Emblems are real GuildMark.img art from the client's UI.wz: a background shape (1000-1029) in one of 16 colours under
# a mark in another (animals 2000-2020, plants 3000-3006, patterns 4000-4021, letters A-Z 5000-5025, digits 5026-5035,
# symbols 9000-9025). A bot guild reads its emblem off its own name (GuildEmblems): the head word with marks (the words
# before "Of", else the whole name) gives the mark, the first word with colours the mark's colour, and a name with no
# mark word wears its initial. The background colour is one whose fill stands out from the mark's ink by at least
# minContrast (WCAG contrast ratio on the colours below, each the mean opaque pixel of that colour's art in UI.wz).
emblems:
  minContrast: 3.0
  colors:
    1: { name: red, background: "#eb1616", mark: "#b32323" }
    2: { name: orange, background: "#e18638", mark: "#bb6315" }
    3: { name: gold, background: "#ebd416", mark: "#bba625" }
    4: { name: cream, background: "#ebe6bc", mark: "#b9b087" }
    5: { name: brown, background: "#8d5647", mark: "#703e34" }
    6: { name: olive, background: "#4d5f41", mark: "#3a4a2e" }
    7: { name: green, background: "#168e55", mark: "#007c42" }
    8: { name: lime, background: "#7fa65f", mark: "#75b722" }
    9: { name: teal, background: "#56a799", mark: "#0a9c7b" }
    10: { name: sky, background: "#23a6d3", mark: "#1893b7" }
    11: { name: blue, background: "#162feb", mark: "#102eb5" }
    12: { name: steel, background: "#6885b8", mark: "#4a6db2" }
    13: { name: purple, background: "#654793", mark: "#5c37b9" }
    14: { name: pink, background: "#944391", mark: "#b750b0" }
    15: { name: white, background: "#ebebeb", mark: "#a4a4a4" }
    16: { name: black, background: "#161616", mark: "#141414" }
  # plain shapes that read well under a mark: square, framed and lined squares, rounded square, circle, diamond, oval
  backgrounds: [1000, 1001, 1002, 1010, 1016, 1017, 1018, 1024, 1028, 1029]
  # the mark's colour when no word in the name has colours
  defaultColors: [red, orange, gold, green, teal, sky, blue, steel, purple, pink, white, black]
  # per word (matched without case, a trailing "s" either way): marks to choose from, colours for the mark, a shape
  words:
    # adjectives colour the mark
    Eternal: { colors: [purple, teal] }
    Silent: { colors: [steel, white] }
    Crimson: { colors: [red] }
    Golden: { colors: [gold] }
    Shadow: { colors: [black, purple] }
    Frozen: { colors: [sky, white] }
    Sacred: { colors: [white, gold] }
    Rising: { colors: [orange, gold] }
    Fallen: { colors: [black, brown] }
    Lunar: { colors: [white, steel] }
    Solar: { colors: [orange, gold] }
    Wild: { colors: [green, lime] }
    Iron: { colors: [steel, black] }
    Velvet: { colors: [purple, pink] }
    Noble: { colors: [purple, gold] }
    Chaos: { colors: [red, black] }
    Divine: { colors: [white, gold] }
    Ancient: { colors: [brown, olive] }
    # nouns give the mark (9004/9023 crowns, 9005 shield, 9003 sword, 9016 paw print, 2000 eagle, 9018 fire,
    # 2003/2004/2006 dragons, 4002/4013/4017 crosses, 9006 flag, 2001 dove, 3003 tree, 9009 lightning, 9017 medal,
    # 4015 four-leaf clover, 9001 heart, 4008 winged circle, 4005 key, 4018 spade)
    Legacy: { marks: [9004, 9023], colors: [gold, purple] }
    Knights: { marks: [9005, 9003], colors: [steel, blue] }
    Wolves: { marks: [9016], colors: [steel, black, brown] }
