# Field bosses (docs/WORLD_SYSTEMS_PLAN.md N6): the bosses that stand on ordinary maps, with no event instance. Their
# kills are records (living_clear, quest = key) while population.FIELD_BOSS_RECORDS_ENABLED is on, citizens post
# bounties on them (BOUNTIES_ENABLED) and citizen parties camp them (CITIZEN_FIELD_BOSS_ENABLED).
#
# key: the records' quest name (living_clear.quest, at most 32 characters; never an event script's name).
# label / aliases: as in rivals.yaml (the records page, "@records mano").
# mobs: every mob id that is this boss (a boss with two forms or two halves lists both).
# maps: where it spawns. levels: [lowest, highest] level of a citizen that hunts it or posts a bounty on it.
# respawn: how it comes back here, settled in N6.0 from the code (not changed by N6):
#   script  - scripts/event/AreaBoss<name>.js: every channel checks every 3 h from its boot and spawns the boss only
#             when it is not on the map, so it is back 0 to 3 h after a death, even on an empty map.
#   life    - map life with a WZ mobTime. config.yaml server.MOB_RESPAWN_TIME_OVERRIDE_SECONDS (10) replaces every
#             mobTime, and SpawnPoint waits mobTime / 5 after its last mob died, so it is back about 2 to 4 s after
#             a death, but only while a player is on the map (MapleMap.respawn skips empty maps). The WZ mobTime
#             (1800 to 129600 s) does not apply.
# COMPANION_BOSSING_P13.md decision 20 ("about 10 s") is the config value, not the delay; its "every 3 hours" holds for
# the script bosses only. Sources: the AreaBoss scripts, Map.wz life, boss-rules.json fieldBosses, P13 and P16.
