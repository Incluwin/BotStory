# The town paper's words (docs/WORLD_SYSTEMS_PLAN.md N1, server.living.population.paper). Read at any Bulletin Board
# ("The paper"), one page a section. sections: print order and titles; a section with no story this week is left out.
# stories: one entry per story key ("<section>.<story>", what PaperDesk.file and the desk's own sections file), with
# several voices of each part. The week picks the voice, so the same week reads the same. {slot} takes the story's
# slot; a voice naming a slot the story lacks is passed over. headline: the page's bold line. body: one or two plain
# sentences under it. gist: lower case, how a citizen in town says it ("paper says {gist}", chatter/paper.yaml).
#
# Slots by story (what the desk fills in):
#   arena.champion        bracket, champion, runner_up       arena.climb    name, bracket, points
#   arena.champion.alone  bracket, champion (no final played)
#   records.first         quest, names                        records.record / records.fastest   quest, time, names
#   records.rival         crew, quest, time
#   records.race          name, crew, quest, time (a player beat their rival crew's time)
#   town.friends          name, partner (two citizens became friends in a run)
#   town.grudge           name, partner (a coliseum match between rivals; name won)
#   market.riser / market.faller   item, percent
#   town.wedding          name, partner                       town.guild     guild, leader
#   town.alliance         alliance, names (its guilds)        town.job       name, job
#   town.level            name, level                         town.guildgoal guild, goal
#   market.bargains       items, percent (market day)         notices.marketday  when
#   town.festival         name, place, count                  town.festival.quiet  place
#   town.meet             name, place (a festival's climb)    notices.festival   when, place
#   town.invasion.held / .overrun  place, town                town.invasion.heroes  place, town, names
#   notices.invasion      when, place
# title: the masthead. Players are named like citizens (decision D2, as the records board does). ASCII only, no '#' (NPC window codes).

title: "The Henesys Herald"

sections:
  - { id: arena, title: "Arena" }
  - { id: records, title: "Records" }
  - { id: town, title: "Town" }
  - { id: market, title: "Market" }
  - { id: notices, title: "Notices" }

# The note a player logging in gets when an issue they have not seen is out (once per issue; at most 200 characters,
# {title} and {headline}, the issue's top story). sender: who the note is from (at most 13 characters).
sender: "Paperboy"
letters:
  - "{title} is out! Top story: {headline}. Read it at any Bulletin Board."
  - "Extra, extra: {headline}. This week's {title} is up on every Bulletin Board."
  - "Fresh off the press: {title}. {headline}, and more at any Bulletin Board."

quiet:
  - "A quiet week in the Maple World. Nothing made the paper."
  - "Nothing to report this week. Even the slimes were well behaved."
  - "No news this week. Get out there and make some."

stories:
  - key: arena.champion
    headlines:
      - "{champion} wins the {bracket} tournament"
      - "{bracket} crown goes to {champion}"
      - "{champion} takes the {bracket} title"
    bodies:
      - "{champion} beat {runner_up} in Saturday's final at the coliseum in Ariant."
      - "Cesar handed the medal to {champion} after a final against {runner_up}."
      - "It came down to {champion} and {runner_up}. {champion} walked out with the medal."
    gists:
      - "{champion} won the {bracket} tournament"
      - "{champion} beat {runner_up} in the {bracket} final"
      - "{champion} took the {bracket} tourney"

  - key: arena.champion.alone
    headlines:
      - "{champion} wins the {bracket} tournament"
      - "{bracket} crown goes to {champion}"
    bodies:
      - "{champion} came out on top of Saturday's {bracket} bracket at the coliseum."
      - "Cesar handed the {bracket} medal to {champion}."
    gists:
