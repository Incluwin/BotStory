# Careers: the job path a citizen follows and the gear it wears by level (plan 3.4). `job` is the final
# job in the legal advancement chain (ResidentShaper.job names). `popularity` weights births.
# `levelCap` is where a casual citizen of this career plateaus. Loadout ids come from the living-world
# loadouts.yaml; `maxLevel` picks the first band the citizen's level fits.
careers:
  - id: warrior-fighter
    job: FIGHTER
    popularity: 18
    levelCap: 75
    loadouts:
      - { maxLevel: 9, loadout: beginner-townsfolk }
      - { maxLevel: 29, loadout: dock-worker }
