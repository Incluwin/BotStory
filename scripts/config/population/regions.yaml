# Regions citizens live in (plan 3.3 / 8). `levels` is the band a citizen's level must fall in to call the
# region home; towns are the main town maps (sub-maps in fields.yaml are ignored); lobbies are where
# party-quest parties form; `fm` is the Free Market entrance. A region with a TownLife profile gets
# ambient visits; the others use standing spots from portals. Optional `townWeights` (one per town) makes
# hub towns draw more of the region's town life; absent = uniform.
regions:
  - id: victoria
    levels: { min: 1, max: 45 }
    # Florina Beach (Pason's boat from Lith Harbor) counts as Victoria.
    towns: [100000000, 101000000, 102000000, 103000000, 104000000, 105040300, 120000000, 110000000]
    # Hubs draw the crowd: Henesys and Kerning City carry most of Victoria's town life, like a real server.
    townWeights: [40, 10, 8, 30, 4, 4, 4, 3]
    lobbies:
      # Henesys Park: Tory's HPQ for lv10-20 (its admission takes 10+); KPQ for 21-30.
      - { id: hpq, mapId: 100000200, levels: { min: 10, max: 20 }, name: "HPQ" }
      - { id: kpq, mapId: 103000000, levels: { min: 21, max: 30 }, name: "KPQ" }
    fm: 910000000
    weight: 60
  - id: orbis
    levels: { min: 40, max: 70 }
    towns: [200000000]
    lobbies:
      - { id: opq, mapId: 200080101, levels: { min: 51, max: 70 }, name: "OPQ" }
    fm: 910000000
    weight: 10
  - id: ludibrium
    # Omega Sector (on foot past Eos Tower) and Korean Folk Town (Helios Tower elevator); Eos Tower lowers the floor.
    levels: { min: 25, max: 65 }
    towns: [220000000, 221000000, 222000000]
    townWeights: [70, 20, 10]
    lobbies:
      - { id: lpq, mapId: 221024500, levels: { min: 35, max: 50 }, name: "LPQ" }
    fm: 910000000
    weight: 12
  - id: el-nath
    levels: { min: 45, max: 90 }
    towns: [211000000]
    lobbies: []
    fm: 910000000
    weight: 6
  - id: aquarium
    levels: { min: 50, max: 80 }
    towns: [230000000]
    lobbies: []
    fm: 910000000
    weight: 4
  - id: ariant
    # Magatia (on foot through Sahel, or the camel cab); its fields reach the 70s.
    levels: { min: 35, max: 85 }
    towns: [260000000, 261000000]
    townWeights: [50, 50]
    lobbies: []
    fm: 910000000
    weight: 3
  - id: mu-lung
    # Herb Town (on foot, or the crane from Mu Lung).
    levels: { min: 45, max: 90 }
    towns: [250000000, 251000000]
    townWeights: [70, 30]
    lobbies: []
    fm: 910000000
    weight: 3
  - id: leafre
    levels: { min: 70, max: 120 }
    towns: [240000000]
    lobbies: []
    fm: 910000000
    weight: 2
  - id: new-leaf-city
    # The subway from Kerning City.
    levels: { min: 20, max: 55 }
    towns: [600000000]
    lobbies: []
    fm: 910000000
    weight: 4
  - id: crimsonwood
    # NLC taxi to the Haunted House, then on foot through Phantom Forest.
    levels: { min: 70, max: 110 }
    towns: [610030000]
    lobbies: []
    fm: 910000000
    weight: 1
  - id: zipangu
    # Spinel's world tour from Henesys or Lith Harbor; Showa Town is on foot from the Shrine.
    levels: { min: 25, max: 60 }
    towns: [800000000, 801000000]
    townWeights: [55, 45]
    lobbies: []
    fm: 910000000
    weight: 4
  - id: singapore
    # The plane from Kerning City; Boat Quay Town is on foot from CBD.
    levels: { min: 25, max: 70 }
    towns: [540000000, 541000000]
    townWeights: [60, 40]
    lobbies: []
    fm: 910000000
    weight: 3
  - id: malaysia
    # Audrey's flight from CBD or Spinel from Boat Quay; Kampung Village is on foot from Kuala Lumpur.
    levels: { min: 45, max: 95 }
    towns: [550000000, 551000000]
    townWeights: [55, 45]
    lobbies: []
    fm: 910000000
    weight: 2
  - id: amoria
    # Thomas Swift in Henesys.
    levels: { min: 30, max: 70 }
    towns: [680000000]
    lobbies: []
    fm: 910000000
    weight: 2
  - id: ellin-forest
    # The Time Control Room portal above Helios Tower's 100th floor (Ludibrium).
    levels: { min: 40, max: 60 }
    towns: [300000000]
    lobbies: []
    fm: 910000000
    weight: 1
  - id: ereve
    # The sky ferry from Ellinia or Orbis. The Cygnus Knights' home: while their careers are on only Knights live here,
    # and a Noblesse below Lv10 lives nowhere else (CitizenLines). Min 2 keeps an Explorer's level-1 newborns in
    # Victoria when the switch is off; fill it with !citizens seed ereve <count>.
    line: cygnus
    levels: { min: 2, max: 15 }
    towns: [130000000]
    lobbies: []
    fm: 910000000
    weight: 1
  - id: rien
    # Puro's boat from Lith Harbor. The Aran's home: while the careers are on only Arans live here, and a Legend below
    # Lv10 lives nowhere else (CitizenLines). Min 2 keeps an Explorer's level-1 newborns in Victoria when the switch
    # is off; fill it with !citizens seed rien <count>.
    line: aran
    levels: { min: 2, max: 15 }
    towns: [140000000]
    lobbies: []
    fm: 910000000
    weight: 1
