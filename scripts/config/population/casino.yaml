# The gachapon show (SoloMapling's GachaBot) in Henesys Market (100000100): a citizen pays GACHA_BOX_PRICE, a box
# (reactor 2202004) springs open beside it and sprays `size` drops: each is mesos (one of `mesos`) unless a fillerChance
# roll makes it a filler item (type by typeWeights, tier by tierWeights), and one in prizeChance boxes holds a prize.
gacha:
  mapId: 100000100
  spot: [366, 154]
  reactor: 2202004
  size: 10
  fillerChance: 0.30
  prizeChance: 0.02
  mesos: [10, 10, 10, 10, 10, 69, 69, 69, 69, 420, 420, 420, 1337]
  typeWeights: { useables: 50, ores: 20, jewels: 20, crystals: 10 }
  tierWeights: { s: 20, a: 30, b: 50 }
  filler:
    useables: { s: [2000005], a: [2000004, 2012000, 2012002, 2020014, 2020015], b: [2001000, 2001001, 2001002, 2020012, 2020013] }
    ores: { s: [4010005, 4010006], a: [4010002, 4010003, 4010004], b: [4010000, 4010001] }
    jewels: { s: [4020007, 4020008], a: [4020004, 4020005, 4020006], b: [4020000, 4020001, 4020002, 4020003] }
    crystals: { s: [4004004], a: [4004003], b: [4004000, 4004001, 4004002] }
  prizes:
    - { id: 1082223, weight: 2 }
    - { id: 1102041, weight: 3 }
    - { id: 2049100, weight: 5 }
    - { id: 2340000, weight: 10 }
