# The casino and the other SoloMapling venues citizens run (docs/SOLOMAPLING_PORT.md, CitizenCasino). Spots are map
# coordinates; a citizen walks to the ground below one. Lines are in chatter/casino.yaml.
#
# Henesys Game Park (100000203). The five blackjack tables are SoloMapling's: the dealer stands at the middle of a
# table's upper platform, two seats beside it and three on the platform below. Aramia (9000055) is the chip cashier;
# the bar host and the dice host have their own spots near the middle. drinks: what the bar host serves (it buys them
# at their WZ price first): Orange Juice, Grape Juice, Maple Cola, Pure Water.
gamePark:
  mapId: 100000203
  cashier: [1321, 214]
  bar: [503, 250]
  dice: [716, 254]
  drinks: [2020009, 2020010, 2022035, 2022000]
  tables:
    - { dealer: [-559, 64], seats: [[-818, 64], [-300, 64], [-795, 274], [-545, 274], [-295, 274]] }
    - { dealer: [-546, -296], seats: [[-808, -296], [-284, -296], [-806, -116], [-544, -116], [-282, -116]] }
    - { dealer: [581, -296], seats: [[344, -296], [818, -296], [345, -116], [582, -116], [819, -116]] }
    - { dealer: [-530, -656], seats: [[-795, -656], [-265, -656], [-822, -476], [-554, -476], [-286, -476]] }
    - { dealer: [575, -656], seats: [[344, -656], [806, -656], [340, -476], [581, -476], [822, -476]] }
