# The rival crew (docs/BOT_CONCEPT_PLAN.md F7, server.living.population.rivals.RivalCrews): a player's crew of citizens
# near their main's level. Said only while population.RIVALS_ENABLED is on. Slots: {name} the player, {crew} the crew's
# name (also its guild's), {quest} a party quest or boss as the records page names it, {time} the crew's or the
# player's new time, {theirs} the other side's best it beat (m:ss). rival.beat is a megaphone (one slot of the shared
# hourly cap): every rival.beat intent must be on the smega channel (RivalsContentTest). Whisper lines are only ever
# composed for a whisper.
intents:
  # a crew member on the player's map, once every RIVALS_BANTER_GAP_MINUTES
  - id: rival.banter.map
    trigger: rival.banter
    where: any
    channel: map
    weight: 10
    cooldownMs: 600000
    lines:
      - "oh look its {name} again"
      - "{name}! still chasing us? :P"
      - "hey {name}, {crew} says hi lol"
      - "{name} ur getting close to us, gotta go grind"
      - "lol {name} we keep running into u"
      - "sup {name}. done any {quest} lately?"
      - "{name} race u to the next level"
    styles:
      quiet-practical-v1:
        - "hey {name}"
        - "{name}. back again"
      playful-social-v1:
        - "{name}!!! we meet again :D"
        - "oh noo its {name} lol"
        - "{name} hiii, {crew} is gonna win this race :P"
  # the crew beat one of the player's times: a megaphone while the player is online
  - id: rival.beat.smega
    trigger: rival.beat
    where: any
    channel: smega
    weight: 10
    cooldownMs: 0
    lines:
      - "{crew} just did {quest} in {time}!! ur move {name} :P"
      - "{quest} in {time}, gg {crew}. beat that {name}"
      - "new {crew} record: {quest} {time}. sorry {name} lol"
      - "{name} ur {quest} time ({theirs}) is history, {time} now :)"
  # the megaphone cap was full: the same news, whispered
  - id: rival.beat.whisper
    trigger: rival.beat.whisper
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "{name} we just did {quest} in {time} :P ur {theirs} is beat"
      - "guess who beat ur {quest} time lol. {time}"
      - "{quest} {time}! ur turn {name}"
  # the player beat the crew's time
  - id: rival.congrats.whisper
    trigger: rival.congrats
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "{time} on {quest}?? ok {name} that was fast, gg"
      - "gz {name}, {time} beats our {theirs}. we'll get it back"
      - "{name} nice {quest} time lol. {crew} is not happy"
      - "wow {time}. gg {name}"
    styles:
      quiet-practical-v1:
        - "gg on {quest}. {time} is good"
  # a member who joins the crew, in its guild chat
  - id: rival.join.guild
    trigger: rival.join
    where: any
    channel: guild
    weight: 10
    cooldownMs: 0
    lines:
      - "hey all, thx for the invite"
      - "hi guys :)"
      - "yo {crew}"
      - "hey! happy to be here"
  # a member now too far below the player's main leaves, in guild chat first
  - id: rival.leave.behind.guild
    trigger: rival.leave.behind
    where: any
    channel: guild
    weight: 10
    cooldownMs: 0
    lines:
      - "u guys level too fast for me lol, gonna do my own thing"
      - "cant keep up anymore, gl guys"
      - "im too far behind now, gonna go grind solo for a while"
      - "gonna leave the guild, ur all way ahead of me. cya around"
  # a member now too far above the player's main leaves
  - id: rival.leave.ahead.guild
    trigger: rival.leave.ahead
    where: any
    channel: guild
    weight: 10
    cooldownMs: 0
    lines:
      - "gonna head off and train somewhere else, gl all"
      - "time for new places, thx for the runs guys"
      - "leaving the guild, gonna find ppl my level. cya"
  - id: rival.leave.behind.whisper
    trigger: rival.leave.behind.whisper
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "{name} im out of {crew}, too slow for u guys lol. gl"
      - "hey {name}, left {crew}. u level way too fast"
  - id: rival.leave.ahead.whisper
    trigger: rival.leave.ahead.whisper
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "{name} im leaving {crew}, gonna train elsewhere. gl catching up"
      - "hey {name}, left {crew}. cya at the top lol"
  # the player whispered back to a crew member (a boast, a congratulation, a help request)
  - id: rival.reply.whisper
    trigger: rival.reply
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "lol"
      - "hehe we'll see {name}"
      - ":P"
      - "gl {name}, ur gonna need it lol"
      - "haha ya"
  - id: rival.reply.yes.whisper
    trigger: rival.reply.yes
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "nice! see u at the door to zakum"
      - "sweet, we'll wait at el nath"
      - "yay ok, meet at the zakum door"
  - id: rival.reply.no.whisper
    trigger: rival.reply.no
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "np, next time"
      - "aw ok, another day then"
      - "all good {name}, gl"
  # the crew reached Zakum and needs a player's client to fight it (F7.4)
  - id: rival.help.whisper
    trigger: rival.help
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "hey {name}, {crew} wants to try {quest}. come with us? meet at the door to zakum"
      - "{name} wanna do {quest} with us? cant do it without u lol. door to zakum in el nath"
      - "{name}! we're doing {quest}, need u along. el nath, zakum door"
  # a duel challenge (docs/PVP_PLAN.md V3, rivals.RivalChallenges): the leader asks out loud on the player's field, the
  # player says yes or no (map chat, a whisper, @duel yes|no). Fighters say nothing mid-duel; watchers heckle.
  - id: rival.challenge.map
    trigger: rival.challenge
    where: any
    channel: map
    weight: 10
    cooldownMs: 0
    lines:
      - "{name}! saw ur {quest} time. cute. fight us?"
      - "yo {name}. {crew} vs u, right here. u in?"
      - "{name} we been looking for u. duel? or u scared lol"
      - "hey {name}, think u can take us?"
      - "{name}. us, u, a fair fight. whatcha say?"
    styles:
      quiet-practical-v1:
        - "{name}. a duel. you in?"
  - id: rival.accept.map
    trigger: rival.accept
    where: any
    channel: map
    weight: 10
    cooldownMs: 0
    lines:
      - "lets gooo"
      - "ok dont cry after lol"
      - "finally. {crew}, lets go"
      - "bet. no potions spam ok? jk"
  - id: rival.decline.map
    trigger: rival.decline
    where: any
    channel: map
    weight: 10
    cooldownMs: 0
    lines:
      - "lol ok. figured"
      - "{name} is scared, {crew}. lets go"
      - "aw. next time then"
      - "ok ok. we'll be around {name}"
  - id: rival.win.map
    trigger: rival.win
    where: any
    channel: map
    weight: 10
    cooldownMs: 0
    lines:
      - "gg {name} :P better luck next time"
      - "{crew} wins lol"
      - "ez. jk gg {name}"
      - "told u. gg"
  - id: rival.lose.map
    trigger: rival.lose
    where: any
    channel: map
    weight: 10
    cooldownMs: 0
    lines:
      - "ugh. gg {name}"
      - "ok u got us. this time"
      - "lucky lol. gg"
      - "gg {name}. we'll be back"
  - id: rival.draw.map
    trigger: rival.draw
    where: any
    channel: map
    weight: 10
    cooldownMs: 0
    lines:
      - "huh. a draw? we'll settle it later {name}"
      - "lol nobody won. again sometime"
  - id: rival.heckle.map
    trigger: rival.heckle
    where: any
    channel: map
    weight: 10
    cooldownMs: 0
    lines:
      - "get em!!"
      - "lol {name} watch out"
      - "cmon cmon"
      - "ooh that hurt"
      - "dont let {name} heal lol"
  # V3.4 (docs/PVP_PLAN.md): the head-to-head record, quoted. {record} is the score with the leader first ("3-1"); the
  # trigger says who leads: ahead = the crew, behind = the player, even = tied.
  - id: rival.challenge.ahead.map
    trigger: rival.challenge.ahead
    where: any
    channel: map
    weight: 10
    cooldownMs: 0
    lines:
      - "{name}! {record} to us. wanna make it worse?"
      - "yo {name}. {record} {crew}. again?"
      - "{name} back for more? its {record} lol"
    styles:
      quiet-practical-v1:
        - "{name}. {record} to us. again?"
  - id: rival.challenge.behind.map
    trigger: rival.challenge.behind
    where: any
    channel: map
    weight: 10
    cooldownMs: 0
    lines:
      - "{name}. {record} to u. not for long. fight?"
      - "{name} we owe u one. {record} wont stay like that"
      - "ok {name}, {record} to u. we been practicing. u in?"
    styles:
      quiet-practical-v1:
        - "{name}. {record} to you. rematch?"
  - id: rival.challenge.even.map
    trigger: rival.challenge.even
    where: any
    channel: map
    weight: 10
    cooldownMs: 0
    lines:
      - "{name}! {record}. tiebreaker?"
      - "{record}, {name}. time to settle it"
  - id: rival.record.ahead.map
    trigger: rival.record.ahead
    where: any
    channel: map
    weight: 10
    cooldownMs: 600000
    lines:
      - "oh its {name}. {record} to us btw :P"
      - "{name}! still {record}, still ours lol"
      - "hey {name}, {crew} {record}. just saying"
  - id: rival.record.behind.map
    trigger: rival.record.behind
    where: any
    channel: map
    weight: 10
    cooldownMs: 600000
    lines:
      - "{name}. {record} to u. not for long"
      - "dont get comfy {name}, {record} wont last"
      - "{name}! we're coming for that {record}"
  - id: rival.record.even.map
    trigger: rival.record.even
    where: any
    channel: map
    weight: 10
    cooldownMs: 600000
    lines:
      - "{name}! {record}. we should settle that"
      - "{record}, {name}. next one decides it"
  # a crew that won a duel tells everyone (one slot of the shared megaphone cap)
  - id: rival.win.smega
    trigger: rival.win.smega
    where: any
    channel: smega
    weight: 10
    cooldownMs: 0
    lines:
      - "{crew} just beat {name} in a duel!! gg :P"
      - "duel won vs {name}. {crew} on top lol"
      - "gg {name}, {crew} takes this one"
  # a crew that lost a duel offers a rematch later; a yes brings them the next time the player is on a field
  - id: rival.rematch.whisper
    trigger: rival.rematch
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "rematch {name}? still salty about that duel lol"
      - "{name} we want a rematch. u in?"
      - "hey {name}, {crew} wants that duel back. rematch?"
  - id: rival.rematch.yes.whisper
    trigger: rival.rematch.yes
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "bet. go train somewhere, we'll find u"
      - "ok!! next time ur on a field we're coming"
  - id: rival.rematch.no.whisper
    trigger: rival.rematch.no
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "lol scared. fine"
      - "ok ok. another time {name}"
  - id: rival.rematch.later.whisper
    trigger: rival.rematch.later
    where: any
    channel: whisper
    weight: 10
    cooldownMs: 0
    lines:
      - "ok but we're beat for today. tmrw?"
      - "tmrw then. we're done for the day lol"
