# What citizens say while they run or play the casino (CitizenCasino, docs/SOLOMAPLING_PORT.md; SoloMapling's
# BlackjackDealerBot, DiceBot, GameZoneHostBot, DropGameBot and its spectators, GachaBot and NXMerchantBot). Every
# trigger here is said only when its table or post calls for it, never picked as idle chat; a call a table waits on
# goes past the map's line budget. The dealer's and hosts' calls carry the game's state in slots, so keep each slot a
# line uses: {name} is the player it is said to, {total} a hand's value, {card} the dealer's face-up card, {bets} and
# {results} lists the table builds, {max} and {price} meso amounts, {bet} a chip count, {a} {b} the two dice, {side}
# cho or han, {drinks} the bar's menu, {drink} the one served, {fees} the drop game's tiers, {tier} the one paid for,
# {item} a dropped item's name, {nx} the code's NX. A line with a slot nobody filled is never said.
# casino.drop.rules/slow/wrong/locked and casino.nx.wrong/thanks go to the trade window's chat; casino.nx.code is
# whispered before the code itself (which is sent as typed, never through a voice). Per-style lines (`styles`)
# override `lines` for that voice style.
