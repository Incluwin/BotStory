# Citizens' idle town fidgets (TownFidgets, docs/SOLOMAPLING_PORT.md; SoloMapling's SocialHotPotatoManager): the text a
# citizen in town writes on its chalkboard (town.chalkboard, at most 80 characters, never said), and the avatar
# megaphones it sends now and then (town.avatar, split over the megaphone's four lines; they share the hourly
# megaphone cap with every other citizen megaphone). Chat itself is ChatterEngine's own (towns.yaml, social.yaml).
