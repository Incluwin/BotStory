# Clear records and the rival crew (docs/BOT_CONCEPT_PLAN.md F7, server.living.population.records / .rivals).
# quests: the event scripts (scripts/event file names without .js) whose clears are recorded in living_clear and shown
# on the records page (a Bulletin Board's "Records", @records). A clear of a script not listed here (a job quest's
# instance, a wedding, a boat) is not a record and is not stored. label: how the page names it; aliases: what a player
# may type after @records ("@records balrog"); kind: pq or boss. RivalsContentTest checks that every
# living_world.BOSS_EVENT_SCRIPTS entry and every quest citizens run themselves (KerningPQ, HenesysPQ) is listed.
