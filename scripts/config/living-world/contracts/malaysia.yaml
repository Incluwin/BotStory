# Malaysia contracts (docs/ROUTES_MALAYSIA_PLAN.md section 5): a night guard's kill proof on his intro quest's
# Galloperas, a bodyguard's day rate, a ranger's item price in the Viking ship's helmets, and a boat-builder who asks
# only that the player has rung his bell with him and heard Rohani on him.
- id: iskandar-the-night-watch
  offerWhen:
    bondStage: ACQUAINTED
    flags: [iskandar.intro.done]
  price:
    meso: 30000
    proof: { killMobs: { mobIds: [9420540], count: 60 } }
  terms:
    durationHours: 8
    maxLevelGap: 15
    lootShare: OWN_DROPS
    ownDropsPercent: 10
    leavesOn: [DISMISS, LEADER_OFFLINE_20M, CONTRACT_END]
    cooldownHoursAfterLeave: 4
    rejoinPrice: { meso: 18000 }

