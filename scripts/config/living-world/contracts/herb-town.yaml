    bondStage: ACQUAINTED
    flags: [taejin.intro.done]
  price:
    meso: 20000
    items: [{ itemId: 4000293, count: 30 }]
  terms:
    durationHours: 10
    maxLevelGap: 15
    lootShare: OWN_DROPS
    ownDropsPercent: 10
    leavesOn: [DISMISS, LEADER_OFFLINE_20M, CONTRACT_END]
