# Sleepywood contracts.
- id: thane-guides-fee
  offerWhen:
    bondStage: TRUSTED
    flags: [thane.walked.down]
    arcChapterAtLeast: { arc: thane-last-descent, chapter: chapter-2 }
  price:
    meso: 30000
  terms:
    durationHours: 6
    maxLevelGap: 15
    lootShare: OWN_DROPS
    ownDropsPercent: 10
    leavesOn: [DISMISS, LEADER_OFFLINE_20M, CONTRACT_END]
    cooldownHoursAfterLeave: 6
    rejoinPrice: { meso: 15000 }

- id: orrin-the-deep-claim
  offerWhen:
