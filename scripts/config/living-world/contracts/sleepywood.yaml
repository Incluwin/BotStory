  terms:
    durationHours: 0
    maxLevelGap: 12
    lootShare: OWN_DROPS
    ownDropsPercent: 20
    leavesOn: [DISMISS, LEADER_OFFLINE_20M]
    cooldownHoursAfterLeave: 3
    rejoinPrice: { meso: 5000 }

- id: magna-day-rate
