# Magatia contracts: a Zenumist alchemist with a day rate, an Alcadno watchman paid partly in steel for the lab locks.
- id: vael-day-rate
  offerWhen:
    bondStage: ACQUAINTED
    flags: [vael.intro.done]
  price:
    meso: 80000
  terms:
    durationHours: 24
    maxLevelGap: 15
    lootShare: OWN_DROPS
    ownDropsPercent: 10
    leavesOn: [DISMISS, LEADER_OFFLINE_20M, CONTRACT_END]
    cooldownHoursAfterLeave: 4
    rejoinPrice: { meso: 30000 }

- id: kipp-the-steel-share
  offerWhen:
    bondStage: ACQUAINTED
    flags: [kipp.intro.done]
  price:
    meso: 20000
    items: [{ itemId: 4000357, count: 30 }]
  terms:
    durationHours: 10
    maxLevelGap: 15
    lootShare: OWN_DROPS
    ownDropsPercent: 10
    leavesOn: [DISMISS, LEADER_OFFLINE_20M, CONTRACT_END]
    cooldownHoursAfterLeave: 4
    rejoinPrice: { meso: 12000 }
