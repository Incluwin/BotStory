# New Leaf City contracts (wave 3). Seven ways in: item prices (Hollis, Brody; Vance once he's been overheard), kill
# proofs counted after the offer (Lou, Delphine), day rates (Moxie, Duke). Every item or kill is from a field near the
# Resident's intro quest's level.
- id: hollis-the-trail-share
  offerWhen:
    bondStage: ACQUAINTED
    flags: [hollis.intro.done]
  price:
    meso: 15000
    items: [{ itemId: 4032022, count: 20 }]
  terms:
    durationHours: 10
    maxLevelGap: 15
    lootShare: OWN_DROPS
    ownDropsPercent: 10
    leavesOn: [DISMISS, LEADER_OFFLINE_20M, CONTRACT_END]
    cooldownHoursAfterLeave: 4
    rejoinPrice: { meso: 9000 }

