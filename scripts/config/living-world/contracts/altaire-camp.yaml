# Altaire Camp contracts (wave 4): a huntress's kill proof on her intro quest's primitive boars, a stone-breaker's day rate.
- id: maelis-the-mountain-share
  offerWhen:
    bondStage: ACQUAINTED
    flags: [maelis.intro.done]
  price:
    meso: 30000
    proof: { killMobs: { mobIds: [5250002], count: 60 } }
  terms:
    durationHours: 8
    maxLevelGap: 15
    lootShare: OWN_DROPS
    ownDropsPercent: 10
    leavesOn: [DISMISS, LEADER_OFFLINE_20M, CONTRACT_END]
    cooldownHoursAfterLeave: 4
    rejoinPrice: { meso: 18000 }

