# Lith Harbor contracts.
- id: brannock-day-wage
  offerWhen:
    bondStage: ACQUAINTED
    flags: [brannock.crates.done]
  price:
    meso: 15000
  terms:
    durationHours: 4
    maxLevelGap: 12
    lootShare: OWN_DROPS
    ownDropsPercent: 10
    leavesOn: [DISMISS, LEADER_OFFLINE_20M, CONTRACT_END]
    cooldownHoursAfterLeave: 2
    rejoinPrice: { meso: 8000 }

- id: hadrik-last-voyage
  offerWhen:
    bondStage: TRUSTED
    flags: [hadrik.cutlass.whetted, hadrik.heard-confession]
    arcChapterAtLeast: { arc: hadrik-last-voyage, chapter: chapter-3 }
  price:
    meso: 30000
    items: [{ itemId: 1302008, count: 1, keep: true }]
  terms:
    durationHours: 6
    maxLevelGap: 10
    lootShare: OWN_DROPS
    ownDropsPercent: 15
    leavesOn: [DISMISS, LEADER_OFFLINE_20M, CONTRACT_END]
    cooldownHoursAfterLeave: 12
    rejoinPrice: { meso: 12000 }
