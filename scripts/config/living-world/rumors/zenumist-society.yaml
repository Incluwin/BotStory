  participants: [ines, phineas]
  where: { town: zenumist-society, spot: "venue:zenumist-hidden-room-door" }
  when:
    serverHours: [20, 21]
    everyDays: 1
  setsFlagOnListeners: zenumist.heard-ines
  lines:
    - { by: phineas, text: "late again, Ines. the door shuts at ten." }
    - { by: ines, text: "then i've an hour. Phineas, a traveller asked if i'd hunt with them. out in the desert." }
    - { by: phineas, text: "a Zenumist doesn't sell her fire. rule twenty-two." }
