# Sleepywood rumors.
- id: sleepywood-toll-of-the-tunnel
  participants: [thane, orrin]
  where: { town: sleepywood, spot: "venue:central-camp" }
  when:
    serverHours: [20, 21, 22]
    everyDays: 1
    requiresArc: { arc: thane-last-descent, chapterAtLeast: chapter-2 }
  lines:
    - { by: orrin, text: "tell them, Thane. tell the camp what the fourth tunnel cost." }
    - { by: thane, text: "it cost a party of five. i brought up one. you." }
