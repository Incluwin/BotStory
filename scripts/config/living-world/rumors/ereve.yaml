# Ereve rumors (wave 4). Each pair is awake together at its spot in those hours (personas/ereve.yaml).
- id: ereve-the-five-emblems
  participants: [isaura, celandine]
  where: { town: ereve, spot: "venue:by-cygnus" }
  when:
    serverHours: [18, 19, 20]
    everyDays: 1
  lines:
    - { by: celandine, text: "hold still, Isaura. your collar's crooked." }
    - { by: isaura, text: "it's been crooked since the spring. nobody in the library looks at collars." }
    - { by: celandine, text: "i do. five emblems inside every knight's collar, and not one cadet knows what they're for." }
    - { by: isaura, text: "five heroes. the record of the five is the oldest thing on my shelf." }
    - { by: celandine, text: "then you know what the fifth one is. the polearm on the snow. i've stitched it a thousand times." }
    - { by: isaura, text: "i know what the record says about it. there's always more to read." }

- id: ereve-the-night-watch
  participants: [caius, wynn]
  where: { town: ereve, spot: "venue:by-neinheart" }
  when:
    serverHours: [20, 21]
    everyDays: 2
  lines:
    - { by: wynn, text: "Caius! how do you walk without making any noise? i tried. i fell off the bridge." }
    - { by: caius, text: "you tried at noon, in boots, humming." }
    - { by: wynn, text: "i wasn't humming. much." }
    - { by: caius, text: "Eckhart says a Night Walker is a shadow that picked a side. you're a thunderclap that picked a side. both are fine." }
    - { by: wynn, text: "...was that a compliment?" }
    - { by: caius, text: "go to bed, cadet." }
