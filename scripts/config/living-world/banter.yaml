      - "let me price your loot next time. trust me"
    answer:
      - "fine, you do the selling then"
      - "you and your stall"
      - "ok, merchant, what's it worth"

  # ---- the crew camp (docs/WORLD_SYSTEMS_PLAN.md N7): benched companions idling together while their owner visits ----
  - id: camp.waiting
    ties: [crewmate, friend, rival, spouse, owes, owed]
    moments: [camp]
    call:
