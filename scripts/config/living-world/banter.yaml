    moments: [clear, town]
    stat: deaths
    weight: 15
    call:
      - "{trail} deaths in that {act}, dorran. i had {lead}. the treeline was right there"
      - "you went down {trail} times. i counted. i always count"
    answer:
      - "i was holding the line. someone had to"
      - "count your arrows instead"

  - id: dorran-fenna.deaths
    pair: [dorran, fenna]
    moments: [clear, town]
    stat: deaths
    weight: 15
    call:
      - "you dropped {trail} times in that {act}. i dropped {lead}"
      - "{trail} times, fenna. stay behind the blade"
    answer:
      - "you were standing in my line of fire"
      - "next time i shoot first"

  - id: fenna-dorran.damage
    pair: [fenna, dorran]
    moments: [clear, town]
    stat: damage
    weight: 15
    call:
      - "{lead} of the damage in that {act}. you had {trail}. who's carrying who?"
    answer:
      - "a blade does its work up close. you'll see"
      - "don't"

  - id: dorran-fenna.damage
    pair: [dorran, fenna]
    moments: [clear, town]
    stat: damage
    weight: 15
    call:
      - "{lead} of that {act}. you put in {trail}. arrows tickle"
    answer:
      - "tickled it to death, didn't i"
      - "next run, watch the numbers"

  - id: fenna-dorran.record
    pair: [fenna, dorran]
    moments: [town]
    stat: record
    weight: 15
    call:
      - "{act}: {lead}. you're on {trail}, dorran. the crest won't fix that"
    answer:
      - "the crest was never for fixing things"
      - "the season's young"

  - id: dorran-fenna.record
    pair: [dorran, fenna]
    moments: [town]
    stat: record
    weight: 15
    call:
      - "{act}: {lead}. yours reads {trail}, fenna"
    answer:
      - "the boars don't keep records. neither do i"
      - "give me a month"

  - id: fenna-dorran.aim
    pair: [fenna, dorran]
    moments: [town, walk]
    call:
      - "aim's steady today, dorran. yours?"
      - "still polishing that crest?"
    answer:
      - "steady enough"
      - "it doesn't shine anymore. i polish it anyway"

  - id: dorran-fenna.treeline
    pair: [dorran, fenna]
    moments: [town, walk]
    call:
      - "the guild could've used your aim"
      - "watch the treeline, fenna"
    answer:
      - "the guild could've used a lot of things"
      - "always do. watch your own back"

  # ---- companion traits (N9.2): only a caller with the trait calls these -------------------------------------
  - id: trait.veteran.teaches
    ties: [crewmate, friend, rival, spouse, owes, owed]
    traits: [veteran]
    moments: [town, walk]
    call:
      - "{answerer}, stick close to me next run. i know the tricks"
      - "watch where i stand next time, {answerer}. saves a lot of potions"
      - "want a tip? never stand where the big ones land"
    answer:
      - "ok ok, i'm listening"
      - "noted. thanks"
      - "you've done this way more than me, so sure"

  - id: trait.steady.calm
    ties: [crewmate, friend, spouse, owes, owed]
    traits: [steady]
    moments: [walk, clear]
    call:
      - "breathe, {answerer}. drink early, stay back, you'll be fine"
      - "no rush in there. slow and clean"
      - "you looked low back there. just pot sooner, it adds up"
    answer:
      - "easy for you to say"
      - "yeah. i'll try"
      - "how are you always so calm"

  - id: trait.shaken.rest
    ties: [crewmate, friend, spouse, owes, owed, rival]
    traits: [shaken]
    moments: [town]
    call:
      - "{owner} might let us rest a bit, right? i could use it"
      - "i keep going down lately. anyone else feel off?"
      - "is it just me or is everything hitting harder"
    answer:
      - "take it easy. we've got you"
      - "happens to everyone. stay behind me for a while"
      - "rest up. we'll cover"

  - id: trait.wary.warns
    ties: [crewmate, friend, spouse, owes, owed, rival]
    traits: [wary]
    moments: [town]
    call:
      - "if we're going back to that boss, i'm bringing extra potions"
      - "some places just don't sit right with me"
      - "remember that run that went bad? i still do"
    answer:
      - "bring extra for me too"
      - "fair. we'll be careful"
      - "yeah. me too"

  - id: trait.homebody.back
    ties: [crewmate, friend, spouse, owes, owed]
    traits: [homebody]
    moments: [walk]
    call:
