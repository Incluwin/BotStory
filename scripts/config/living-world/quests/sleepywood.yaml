# Sleepywood quest lines. Evil eye 2230100 (tail 4000007), curse eye 3230100 (tail 4000013), cold eye 4230100
# (tail 4000023), slime 210100 (bubble 4000010). Maps: ant tunnel I 105050000, II 105050100, IV 105050300,
# deep forest 105030000.
- id: thane-the-first-descent
  persona: thane
  title: "The First Descent"
  length: SHORT
  requires: { level: { min: 25 } }
  steps:
    - { id: talk, type: TALK }
    - { id: eyes, type: KILL_MOBS, mobIds: [2230100], count: 20, mapIds: [105050000, 105050100] }
    - { id: report, type: DELIVER, to: thane }
  rewards: { meso: 6000, exp: 3500, bondPoints: 25, flags: [thane.first.descent] }

- id: thane-walk-me-down
