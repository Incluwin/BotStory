  title: "Walk Me Down"
  length: MEDIUM
  requires: { level: { min: 28 }, questsCompleted: [thane-the-first-descent] }
  steps:
    - { id: talk, type: TALK }
    - { id: escort, type: ESCORT, persona: thane }
    - { id: tunnel, type: VISIT_MAP, mapIds: [105050100] }
    - { id: report, type: DELIVER, to: thane, say: ["you led. i followed. good."] }
  rewards: { meso: 8000, exp: 5000, bondPoints: 40, flags: [thane.walked.down] }
  onComplete: { arcAdvance: { arc: thane-last-descent, to: chapter-2 } }

