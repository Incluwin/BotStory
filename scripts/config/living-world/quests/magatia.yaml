# Alcadno institute: mithril mutae 4110302 (piece of mithril 4000359; area A-1 261020100, B-1 261020200), reinforced
# mithril mutae 5110300 (hardened piece of mithril 4000360; A-1), iron mutae 4110300 (piece of steel 4000357; B-3
