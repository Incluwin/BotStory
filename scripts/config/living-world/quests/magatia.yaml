# Off Magatia: Ariant jr. cactus 2100102 (cactus stem 4000329; outside the west entrance 260010000, young catthus desert
# 260010001), kiyo 3100102 (stiff feather 4003004 at 20%; north desert road 2 260020200, desert of red sand 260020300).
