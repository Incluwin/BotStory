# ---- Gilda, clockmaker of the Alcadno: her arc ----------------------------------------------------------------------

- id: gilda-mithril-for-the-clock
  persona: gilda
  title: "Six Minutes Slow"
  length: SHORT
  requires: { level: { min: 44 } }
  steps:
    - { id: talk, type: TALK }
    - { id: mutae, type: KILL_MOBS, mobIds: [4110302], count: 30, mapIds: [261020100, 261020200] }
    - { id: mithril, type: COLLECT_ITEM, itemId: 4000359, count: 15 }
    - { id: springs, type: DELIVER, to: gilda, take: { itemId: 4000359, count: 15 } }
  rewards: { meso: 14000, exp: 15000, bondPoints: 40 }
  onComplete: { arcAdvance: { arc: gilda-the-bench-between, to: chapter-2 } }

- id: gilda-the-other-door
  persona: gilda
  title: "Through the Other Door"
  length: SHORT
  requires: { level: { min: 44 }, flags: [magatia.heard-bench], questsCompleted: [gilda-mithril-for-the-clock] }
  steps:
    - { id: talk, type: TALK }
    - { id: aurel, type: TALK_TO, persona: aurel, say: ["did i mean it? i've meant it for twenty years. i only needed to say it where someone could hear. noon tomorrow. i'll wear my good coat. tell her to wear hers."] }
    - { id: report, type: DELIVER, to: gilda }
  rewards: { meso: 18000, exp: 20000, bondPoints: 60, items: [{ itemId: 2022001, count: 10 }], worldFlags: [magatia.bench.crossed] }

- id: gilda-mithril-scraps
  persona: gilda
  title: "Clock Springs"
  length: SHORT
  repeatable: true
  requires: { level: { min: 44 }, questsCompleted: [gilda-mithril-for-the-clock] }
  steps:
    - { id: talk, type: TALK }
    - { id: mithril, type: COLLECT_ITEM, itemId: 4000359, count: 15 }
    - { id: springs, type: DELIVER, to: gilda, take: { itemId: 4000359, count: 15 } }
  rewards: { meso: 9000, exp: 8000, bondPoints: 10 }

