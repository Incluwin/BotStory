- id: dohyun-ask-gyuwon
  persona: dohyun
  title: "Will They Come?"
  length: SHORT
  requires: { level: { min: 50 } }
  steps:
    - { id: talk, type: TALK }
    - { id: gyuwon, type: TALK_TO, persona: gyuwon, say: ["will they come for the root? not till it's ready. the captains don't know how to dig. they'd snap it like a carrot. tell the boy to dig first, and to dig properly. tell him i said properly."] }
    - { id: report, type: DELIVER, to: dohyun }
  rewards: { meso: 10000, exp: 10000, bondPoints: 30 }

