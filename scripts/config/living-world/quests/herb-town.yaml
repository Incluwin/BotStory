# ---- Oksun, keeper of the hundred-year garden: her arc --------------------------------------------------------------

- id: oksun-the-old-gardens
  persona: oksun
  title: "The Old Gardens"
  length: SHORT
  requires: { level: { min: 50 } }
  steps:
    - { id: talk, type: TALK }
    - { id: roots, type: KILL_MOBS, mobIds: [5120501], count: 30, mapIds: [251010101, 251010102] }
    - { id: bellflowers, type: COLLECT_ITEM, itemId: 4000293, count: 15 }
    - { id: kettle, type: DELIVER, to: oksun, take: { itemId: 4000293, count: 15 } }
  rewards: { meso: 16000, exp: 18000, bondPoints: 40 }
  onComplete: { arcAdvance: { arc: oksun-the-hundred-year-root, to: chapter-2 } }

- id: oksun-dig-the-root
  persona: oksun
  title: "A Hand's Width at a Time"
  length: MEDIUM
  requires: { level: { min: 54 }, flags: [herb-town.heard-root], notFlags: [herb-town.root.dug], questsCompleted: [oksun-the-old-gardens] }
  steps:
    - { id: talk, type: TALK }
    - { id: old-roots, type: KILL_MOBS, mobIds: [5120502], count: 30, mapIds: [251010200, 251010300] }
    - { id: flowers, type: COLLECT_ITEM, itemId: 4000294, count: 15 }
    - { id: dohyun, type: TALK_TO, persona: dohyun, say: ["it's time? ...all right. a hand's width at a time. ...there. it's up. it's up! it's the size of my arm. go tell her. no, i'll tell her. no, you tell her. i'm shaking."] }
    - { id: up, type: DELIVER, to: oksun, take: { itemId: 4000294, count: 15 } }
  rewards: { meso: 30000, exp: 36000, bondPoints: 60, items: [{ itemId: 2022001, count: 20 }], worldFlags: [herb-town.root.dug] }

- id: oksun-bellflower-beds
  persona: oksun
  title: "Bellflower Beds"
  length: SHORT
  repeatable: true
  requires: { level: { min: 50 }, questsCompleted: [oksun-the-old-gardens] }
  steps:
    - { id: talk, type: TALK }
    - { id: bellflowers, type: COLLECT_ITEM, itemId: 4000293, count: 15 }
    - { id: beds, type: DELIVER, to: oksun, take: { itemId: 4000293, count: 15 } }
  rewards: { meso: 10000, exp: 10000, bondPoints: 10 }

