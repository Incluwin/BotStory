# ---- Nadira, water-seller of the market: her arc --------------------------------------------------------------------

- id: nadira-empty-sacks
  persona: nadira
  title: "Damp Sacks"
  length: SHORT
  requires: { level: { min: 32 } }
  steps:
    - { id: talk, type: TALK }
    - { id: dwarves, type: KILL_MOBS, mobIds: [3100101], count: 30, mapIds: [260020200, 260020300] }
    - { id: sacks, type: COLLECT_ITEM, itemId: 4000334, count: 15 }
    - { id: look, type: DELIVER, to: nadira, take: { itemId: 4000334, count: 15 } }
  rewards: { meso: 9000, exp: 8000, bondPoints: 40 }
  onComplete: { arcAdvance: { arc: nadira-the-dry-well, to: chapter-2 } }

- id: nadira-the-tunnel-mouth
  persona: nadira
  title: "Under the Giant's Feet"
  length: MEDIUM
  requires: { level: { min: 36 }, questsCompleted: [nadira-empty-sacks] }
  steps:
    - { id: talk, type: TALK }
    - { id: dwarves, type: KILL_MOBS, mobIds: [3110301], count: 25, mapIds: [260020610, 260020620] }
    - { id: sand, type: COLLECT_ITEM, itemId: 4000352, count: 10 }
    - { id: giant, type: VISIT_MAP, mapIds: [260020401] }
    - { id: report, type: DELIVER, to: nadira, take: { itemId: 4000352, count: 10 } }
  rewards: { meso: 14000, exp: 14000, bondPoints: 45, worldFlags: [ariant.well.traced] }

- id: nadira-a-new-spring
  persona: nadira
  title: "A Pump and a Still"
  length: MEDIUM
  requires: { level: { min: 44 }, flags: [ariant.heard-well, magatia.bench.crossed], notFlags: [ariant.well.flowing], questsCompleted: [nadira-the-tunnel-mouth] }
  steps:
    - { id: talk, type: TALK }
    - { id: gilda, type: TALK_TO, persona: gilda, say: ["a pump for Ariant's old well? to bring the vein back up? ...an Alcadno pump with a Zenumist still on top. it's never been done. that's the best reason i've heard all year. tell her yes."] }
    - { id: aurel, type: TALK_TO, persona: aurel, say: ["a still for the water, over Gilda's pump? the two together? ...tell her yes. tell her we'll carry it down the Sahel road ourselves. both of us. in daylight."] }
    - { id: report, type: DELIVER, to: nadira }
  rewards: { meso: 24000, exp: 26000, bondPoints: 60, items: [{ itemId: 2000002, count: 30 }], worldFlags: [ariant.well.flowing] }

- id: nadira-sack-count
  persona: nadira
  title: "Still Digging"
  length: SHORT
  repeatable: true
  requires: { level: { min: 32 }, questsCompleted: [nadira-empty-sacks] }
  steps:
    - { id: talk, type: TALK }
    - { id: sacks, type: COLLECT_ITEM, itemId: 4000334, count: 15 }
    - { id: count, type: DELIVER, to: nadira, take: { itemId: 4000334, count: 15 } }
  rewards: { meso: 7000, exp: 6000, bondPoints: 10 }

