# Zipangu quests (wave 3). Fields: Mountain of Cloud Fox 800010001 (cloud fox 9400002 cloud foxtail 4000066), Crow Forest
# 800020000/800020101 (crow 9400000 crow feather 4000064), A Night in the Forest 800020110 (paper lantern ghost 9400011 worn
# paper lantern 4000222, big cloud fox 9400004 dark cloud foxtail 4000077), A Desolate Cemetery 800020200 (big cloud fox),
# Vanished Village 800020120 (samiho 5100004 three-tailed foxtail 4000172), Encounter with the Buddha 800020130 (dreamy
# ghost 9400013 kimono piece 4000225, black crow 9400014 sabots 4000224), WanWan Spa of Hell 800020400 (bain 8140500 spiked
# collar 4000080), Forest of Animals 800030000 (fire raccoon 9400001 raccoon firewood 4000065). Showa: the secret spas
# 801000110/801000210 (firebomb 5100002 flame 4000081), Showa Street 1 801010000 (extra A 9400100 badge 4000089), Street 2
# 801020000 (leader A 9400110, leader B 9400111 charm 4000093), Street 3 801030000 (leader A, male boss 9400120 pomade
# 4000094); the hideout (Konpei, open to anyone; only the Boss's top room is once a day): parking lot 801040001 (extra D
# 9400103), parlor 801040003 (female boss 9400121). Those two and the Buddha's clearing are forced-return maps the farm-site
# picker skips, so steps there are kill-only; Leader A (9400110) wears the shades 4000092. The armory 801040004 is avoided.

# ---- Chiyo: the shrine bell (arcs/zipangu.yaml) ----
- id: chiyo-the-shrine-lanterns
  persona: chiyo
  title: "The Old Shrine Lanterns"
  length: SHORT
  requires: { level: { min: 40 } }
  steps:
    - { id: talk, type: TALK }
    - { id: ghosts, type: KILL_MOBS, mobIds: [9400011], count: 25, mapIds: [800020110] }
    - { id: lanterns, type: COLLECT_ITEM, itemId: 4000222, count: 10 }
    - { id: steps, type: DELIVER, to: chiyo, take: { itemId: 4000222, count: 10 } }
  rewards: { meso: 9000, exp: 10000, bondPoints: 30, items: [{ itemId: 2022023, count: 10 }] }

- id: chiyo-the-silent-bell
  persona: chiyo
  title: "The Bell Without a Voice"
  length: SHORT
  requires: { level: { min: 42 }, questsCompleted: [chiyo-the-shrine-lanterns], notFlags: [zip.clapper.traced] }
  steps:
    - { id: talk, type: TALK }
    - { id: daichi, type: TALK_TO, persona: daichi, say: ["the shrine keeper sent you. she said kindly? she would. i took it. the clapper. the Boss sent me up the steps one night, my first job. he wears it round his neck like a trophy, walking the third street. i've been sorry every day since. tell her that. please."] }
    - { id: told, type: DELIVER, to: chiyo }
  rewards: { meso: 11000, exp: 12000, bondPoints: 40, items: [{ itemId: 2000002, count: 20 }], worldFlags: [zip.clapper.traced] }

- id: chiyo-the-bell-rings
  persona: chiyo
  title: "The Bell Rings"
  length: MEDIUM
  requires: { level: { min: 42 }, questsCompleted: [chiyo-the-shrine-lanterns], flags: [zip.clapper.recovered], notFlags: [zip.bell.rings] }
  steps:
    - { id: talk, type: TALK }
    - { id: daichi, type: TALK_TO, persona: daichi, say: ["she's not angry? she said that? ...here. the clapper. carry it up for me. carry it level. and tell her... no. i'll tell her myself. one day. soon."] }
    - { id: bell, type: DELIVER, to: chiyo }
  rewards: { meso: 20000, exp: 22000, bondPoints: 60, items: [{ itemId: 2000005, count: 10 }], worldFlags: [zip.bell.rings] }

