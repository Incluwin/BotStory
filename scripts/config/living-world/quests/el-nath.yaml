# El Nath quest lines (docs/REGIONAL_RESIDENTS_PLAN.md). Every id is from the server's own data:
# jr. yeti 5100000 (skin 4000048, icy path 211010000/211020000), hector 5130104 (tail 4000051, cold field 211030000/
# 211040000), white fang 5140000 (white pang tail 4000052, icy cold field 211050000, wolf territory III-V 211040800-
# 211041000), yeti 6300000 (horn 4000049, ice valley 211040100/211040200), yeti and pepe 7130102 (211040200, valley of
# snowman 211040101), Snowman 8220001 (valley of snowman), dark jr. yeti 5130105 (skin 4000055, sharp cliff 211040300/
# 211040400, dangerous cliff 211040700), dark yeti 6400000 (horn 4000056), dark yeti and pepe 8140100 (dark pepe beak
# 4000057, dangerous cliff), werewolf 7130200 (toenail 4000053, leather 4000021, wolf territory I/II 211040500/
# 211040600), lycanthrope 8140000 (toenail 4000054, wolf territory III-V), coolie zombie 5130107 (lost tooth 4000069,
# forest of dead trees 211041100-211041400), miner zombie 5130108 (gold tooth 4000082, dead mine 211041500-211041800),
# flyeye 4230107 (wing 4000076, dead mine and the passage 211041900), jr. cerebes 4230108 (tooth 4000078), cerebes
# 7130001 (tooth 4000079), firebomb 5100002 (flame 4000081), bain 8140500 (spiky collar 4000080), cave of trial
# 211042000/211042100/211042200, cave within the cave 211042101, the door to zakum 211042300; Snow Witch 6090001 (ice
# tear 4000415, icy path and icy cold field). Off El Nath: Ludibrium master death teddy 7130300 (binding bridle
# 4000148, lost time 220070201).
# Gear: Sigrun's two-handed swords Doombringer 1402012 L70 / Blue Screamer 1402004 L80 / Berzerker 1402005 L90; Bjarke's
# spears Redemption 1432007 L70 / Omega Spear 1432010 L80 / Fairfrozen 1432011 L90. Ulla's gloves and Oskar's shoes for
# the player's class (warrior, magician, bowman, thief, pirate): gloves L60/L70/L80, shoes L70/L80/L90.

# ---- Edric, snowfield sentry: the unwritten letter (recruitable through his arc) ---------------------------------

- id: edric-the-watch
  persona: edric
  title: "The Watch"
  length: SHORT
  requires: { level: { min: 50 } }
  steps:
    - { id: talk, type: TALK }
    - { id: hectors, type: KILL_MOBS, mobIds: [5130104], count: 30, mapIds: [211030000, 211040000] }
    - { id: report, type: DELIVER, to: edric }
  rewards: { meso: 22000, exp: 20000, bondPoints: 30 }

- id: edric-the-unwritten-letter
  persona: edric
  title: "The Unwritten Letter"
  length: MEDIUM
  requires: { level: { min: 50 }, questsCompleted: [corliss-the-unclosed-page, edric-the-watch] }
  steps:
    - { id: talk, type: TALK }
    - { id: ottilie, type: TALK_TO, persona: ottilie, say: ["from El Nath? from... oh. oh, that's his hand. he always crossed his sevens. ...he walked down the mountain? the silly thing. the silly, silly thing. tell him his step's swept. tell him to come and sit on it."] }
    - { id: back, type: DELIVER, to: edric }
  rewards: { meso: 35000, exp: 30000, bondPoints: 50, flags: [edric.letter.delivered], worldFlags: [edric.letter.delivered] }
  onComplete: { arcAdvance: { arc: edric-the-unwritten-letter, to: chapter-3 } }

- id: edric-steady-hands
  persona: edric
  title: "Steady Hands"
  length: SHORT
  repeatable: true
  requires: { level: { min: 50 }, questsCompleted: [edric-the-watch] }
  steps:
    - { id: talk, type: TALK }
    - { id: yetis, type: KILL_MOBS, mobIds: [5100000], count: 25, mapIds: [211010000, 211020000] }
    - { id: report, type: DELIVER, to: edric }
  rewards: { meso: 12000, exp: 11000, bondPoints: 10 }

