# ---- Isaura: the record of the five (arcs/ereve.yaml) ----
- id: isaura-the-overdue-books
  persona: isaura
  title: "Books in the Grass"
  length: SHORT
  requires: { level: { min: 4 } }
  steps:
    - { id: talk, type: TALK }
    - { id: timus, type: KILL_MOBS, mobIds: [100122], count: 25, mapIds: [130010100, 130010110] }
    - { id: report, type: DELIVER, to: isaura }
  rewards: { meso: 1800, exp: 500, bondPoints: 25, items: [{ itemId: 2000001, count: 15 }] }

- id: isaura-the-blank-page
  persona: isaura
  title: "The Record of the Five"
  length: SHORT
  requires: { level: { min: 8 } }
  steps:
    - { id: talk, type: TALK }
    - { id: celandine, type: TALK_TO, persona: celandine, say: ["the five? every knight's collar has five emblems stitched inside it, the same as the very first coats. the pattern book calls the fifth one 'the one who stayed in the snow'. a polearm, on a field of white. tell Isaura the thread's blue. it's always been blue."] }
    - { id: fintan, type: TALK_TO, persona: fintan, say: ["the hatchery's egg-book? the first page is older than Kiridu. it says the first mounts were bred 'the spring after the five went by sea, from the island of snow'. that's all it says about them. the rest is eggs."] }
    - { id: report, type: DELIVER, to: isaura }
  rewards: { meso: 3000, exp: 1200, bondPoints: 40, items: [{ itemId: 2000002, count: 10 }], worldFlags: [ereve.record.searched] }

- id: isaura-in-her-words
  persona: isaura
  title: "In Her Words"
  length: MEDIUM
  requires: { level: { min: 12 }, questsCompleted: [isaura-the-blank-page], flags: [rien.copy.read], notFlags: [ereve.page.written] }
  steps:
    - { id: talk, type: TALK }
    - { id: eira, type: TALK_TO, persona: eira, say: ["sit down, dear, and listen, and say it back to her exactly. grandmother said it was a grey morning. four of them went down to the shore and into the boat, and didn't look back, because they couldn't bear to. the fifth went up the hill into the ice, because somebody had to be here when the dark came back. and the one on the hill looked back once. grandmother said that's the part that matters."] }
    - { id: written, type: DELIVER, to: isaura }
  rewards: { meso: 6000, exp: 3000, bondPoints: 50, items: [{ itemId: 2000002, count: 20 }], worldFlags: [ereve.page.written] }

