# Forest III 130010200, Tiguru's Forest 130010210.
- id: aldric-tiru-patrol
  persona: aldric
  title: "The Tiru Patrol"
  length: SHORT
  requires: { level: { min: 7 } }
  steps:
    - { id: talk, type: TALK }
