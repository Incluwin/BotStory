# Twilight Perion quests (Repack Residents, docs/REPACK_RESIDENTS_PLAN.md section 3.3). The Future's fields round the town
# start at lv190: the Deserted Southern Ridge 273010000 west of town (swollen stump 8620000) on the road to the Six Path
# Crossway Ruins 271010500 and Henesys Ruins; east of town the Desolate Hills 273020000 (swollen stump) and the Desolate
# Rocky Road 273020100 (swollen stump, swollen dark stump 8620001), the Lonely and Weathered Rocky Roads and the Tempest
# Grave (swollen axe stump 8620002), the Fiery Ravine and the boar plateaus 273030000-273030300 (pillaging boars
# 8620003-8620005), the Forsaken Excavation Sites 273040000-273040300 (sinister masks) north to the Tribal Refugee Camp.
# No step of a quest below level 180 enters those lv190+ maps: Cobie 2142112 takes the guarded road to the camp and back,
# the door by Claudine 2142107 goes back to Three Doors, and the recruits' last tier is fought on the lv163-168 fields of
# Dark Ereve and Henesys Ruins' hills (quests/henesys-ruins.yaml header). Future mobs drop only their donors' potions
# and scrolls: collect steps carry the present, either the Temple of Time's roads (quests/three-doors.yaml header; the
# Road to Oblivion's fourth stretch 270030400 holds the chief oblivion guardian 8200012, red heart 4000458) or the
# present Perion whose mobs these ones became (wild boar 2230102 wild boar tooth 4000020, axe stump 1130100 firewood
# 4000018). Heddwyn's thread (arcs/twilight-perion.yaml) waits on the camp's
# old fire (camp.fire.lit, quests/tribal-refugee-camp.yaml).

# ---- Heddwyn: the last story (arcs/twilight-perion.yaml) ----
- id: heddwyn-a-boar-that-was-a-boar
  persona: heddwyn
  title: "A Boar That Was a Boar"
  length: SHORT
  requires: { level: { min: 120 } }
  steps:
    - { id: talk, type: TALK }
    - { id: teeth, type: COLLECT_ITEM, itemId: 4000020, count: 15 }
    - { id: show, type: DELIVER, to: heddwyn, take: { itemId: 4000020, count: 15 } }
  rewards: { meso: 60000, exp: 200000, bondPoints: 30, items: [{ itemId: 2000005, count: 20 }] }

- id: heddwyn-the-sun-on-the-rocks
  persona: heddwyn
  title: "The Sun on the Rocks"
  length: MEDIUM
  requires: { level: { min: 130 }, questsCompleted: [heddwyn-a-boar-that-was-a-boar] }
  steps:
    - { id: talk, type: TALK }
    - { id: perion, type: VISIT_MAP, mapIds: [102000000] }
    - { id: moss, type: TALK_TO, persona: moss, say: ["a storyteller from the years to come wants to know how the sun falls on our rocks? ...slowly. it takes the whole day to cross the town, and the rocks keep it after it's gone. touch one at dusk. warm. tell him the rocks remember the sun. they're slow. they remember."] }
    - { id: tell, type: DELIVER, to: heddwyn }
  rewards: { meso: 90000, exp: 320000, bondPoints: 40, items: [{ itemId: 2000005, count: 20 }], worldFlags: [tperion.story.before] }

- id: heddwyn-the-last-story
  persona: heddwyn
  title: "The Last Story"
  length: LONG
  requires: { level: { min: 150 }, questsCompleted: [heddwyn-the-sun-on-the-rocks], flags: [camp.fire.lit], notFlags: [tperion.story.told] }
  steps:
    - { id: talk, type: TALK }
    - { id: solveig, type: TALK_TO, persona: solveig, say: ["a story for the end of days, from a storyteller who's never seen our years? ...tell him this. there's a cairn in the Past of the Verdure, where the roads begin. every pilgrim leaves a stone. nobody knows where the roads end. every morning the stones are still there, and somebody walks on. tell him that's how it is here. nobody knows what's coming. we walk anyway."] }
    - { id: kasper, type: TALK_TO, persona: kasper, say: ["the old fire's lit! the whole camp's round it. Ama's made a supper you could stand a spoon in. tell him hurry. tell him i've saved him the rock nearest the fire, and i'll shout at anybody who talks."] }
    - { id: told, type: DELIVER, to: heddwyn }
  rewards: { meso: 180000, exp: 600000, bondPoints: 60, items: [{ itemId: 2050004, count: 10 }], worldFlags: [tperion.story.told] }

# ---- Ashe ----
- id: ashe-wood-that-burns
  persona: ashe
  title: "Wood That Burns"
  length: SHORT
  requires: { level: { min: 120 } }
  steps:
    - { id: talk, type: TALK }
    - { id: wood, type: COLLECT_ITEM, itemId: 4000018, count: 20 }
    - { id: yona, type: TALK_TO, persona: yona, say: ["a smith from the years to come wants to know how i bank my fire? under ash, at night, a hand deep, with one corner open so it breathes. a fire you bank is a fire you keep. tell her that. and tell her the anvil doesn't care what year it is."] }
    - { id: fire, type: DELIVER, to: ashe, take: { itemId: 4000018, count: 20 } }
  rewards: { meso: 60000, exp: 200000, bondPoints: 30, items: [{ itemId: 2000005, count: 20 }] }

