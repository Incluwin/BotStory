# Lith Harbor quest lines. Mobs: snail 100100, blue snail 100101, red snail 130101, stump 130100,
# shroom 120100, orange mushroom 1210102. Maps: 3-way road 104010000, forest west of henesys 104020000,
# hill west of henesys 104030000, pig beach 104010001.
- id: olwen-snail-tally
  persona: olwen
  title: "The Snail Tally"
  length: SHORT
  requires: { level: { min: 5 } }
  steps:
    - { id: talk, type: TALK }
    - { id: cull, type: KILL_MOBS, mobIds: [100100, 100101], count: 15, mapIds: [104010000, 104000000] }
    - { id: report, type: DELIVER, to: olwen, say: ["fifteen. noted."] }
  rewards: { meso: 1500, exp: 400, bondPoints: 15, flags: [olwen.tally.done] }

- id: olwen-lost-manifest
  persona: olwen
  title: "The Lost Manifest"
  length: SHORT
  requires: { level: { min: 6 }, questsCompleted: [olwen-snail-tally] }
  steps:
    - { id: talk, type: TALK }
    - { id: shells, type: COLLECT_ITEM, itemId: 4000000, count: 5 }
    - { id: return, type: DELIVER, to: olwen, take: { itemId: 4000000, count: 5 } }
  rewards: { meso: 3000, exp: 700, bondPoints: 20, items: [{ itemId: 2000001, count: 15 }], flags: [olwen.manifest.done] }

