# Florina Beach quests (wave 4). Fields: the look-out shed 110010000 and Lorang Lorang 110020000 (lupin 3210800 lupin
# doll 4000026 / lupin's banana 4000029, lorang 3230102 lorang claw 4000043); the lorangs' cove 110020001 (lorang);
# Lorang and Clang 110030000 (lorang, clang 4230104 clang claw 4000044); Clang and Lorang 110030001 (lorang, clang,
# tortie 4130101 tortie shell 4000045); the Hot Sand 110040000 (tortie, clang). The thread's first beat is Marisol's
# bottle (open to every player); its Amoria beats are in quests/amoria.yaml. The recruits give earrings and capes in
# the beach's band (37-48).

# ---- Marisol: the sealed bottle (arcs/florina-beach.yaml, with arcs/amoria.yaml) ----
- id: marisol-the-sealed-bottle
  persona: marisol
  title: "The Sealed Bottle"
  length: SHORT
  requires: { level: { min: 35 } }
  steps:
    - { id: talk, type: TALK }
    - { id: lorangs, type: KILL_MOBS, mobIds: [3230102], count: 30, mapIds: [110020000, 110020001] }
    - { id: wade, type: DELIVER, to: marisol }
  rewards: { meso: 8000, exp: 8000, bondPoints: 30, items: [{ itemId: 2000002, count: 15 }], worldFlags: [florina.bottle.found] }

- id: marisol-to-the-chapel-steps
  persona: marisol
  title: "To the Chapel Steps"
  length: MEDIUM
  requires: { level: { min: 35 }, questsCompleted: [marisol-the-sealed-bottle] }
  steps:
    - { id: talk, type: TALK }
    - { id: pernille, type: TALK_TO, persona: pernille, say: ["read it to me, would you, dear? my eyes aren't what they were. ...'Pernille. the storm's on us and i'm late. i meant to ask you on the chapel steps this spring. i'm asking now. lay a flower there if it's yes. Aurelio.' ...he wrote. forty springs, and he wrote. bless whoever found it."] }
  rewards: { meso: 10000, exp: 10000, bondPoints: 40, items: [{ itemId: 2000002, count: 20 }], worldFlags: [amoria.letter.read] }

- id: marisol-what-the-clangs-dig-up
  persona: marisol
  title: "What the Clangs Dig Up"
  length: SHORT
  requires: { level: { min: 44 }, questsCompleted: [marisol-the-sealed-bottle] }
  steps:
    - { id: talk, type: TALK }
    - { id: clangs, type: KILL_MOBS, mobIds: [4230104], count: 30, mapIds: [110040000] }
    - { id: bucket, type: DELIVER, to: marisol }
  rewards: { meso: 12000, exp: 13000, bondPoints: 35, items: [{ itemId: 2000004, count: 5 }] }

