# Crimsonwood Keep quest lines (docs/ITCG_MASTERIA_PLAN.md section 6). Every id is from the server's own data:
# Crimsonwood Mountain: crimson tree 9400586 (crimson wood 4032004 at 20%; lower ascent 610020002, path of strength
# 610020003), windraider 9400576 (lower ascent, tornado corridor 610030011), stormbreaker 9400581 (lower ascent,
# stormhall 610030014), firebrand 9400577 (inferno chamber 610030012, cavern of fear 610020010), nightshadow 9400579
# (wrath of night 610030013, cavern of honour 610020013, cavern of valour 610020015), elderwraith 9400580 (elder ashes
# 4032010 at 20%; path of strength, haunted hill 610010001, evil rising 610010012, the evil dead 610010013), crimson
# guardian 9400582 (crimson heart 4032012 at 20%; the keep gate road 610020006, eternal vigilance 610030015); the
# cavern of fortitude 610020014, the upper ascent 610020005.
# Phantom Forest: phantom tree 9400588 (phantom seed 4032003 at 15%; bent tree 610010000, haunted hill, swamp bog
# 610010002, crossroads 610010200), Bigfoot 9400575 and the headless horseman 9400549 (field bosses).
# MesoGears: jr. yeti 5100000 (jr. yeti skin 4000048 at 60%; ice chamber 600020500).
# The Inner Sanctum is CWKPQ (scripts/event/CWKPQ.js; the Battle Statue's clearPQ names the script).
# Gear: Ivor's spears Pinaka 1432030 L100 / Dragon Faltizan 1432038 L110 / Reverse Alchupiz 1432049 L120; Ragna's
# two-handed swords Stonetooth Sword 1402037 L100 / Dragon Claymore 1402036 L110 / Reverse Nibleheim 1402047 L120;
# Fennick's claws Red Craven 1472053 L100 / Dragon Green Sleve 1472051 L110 / Reverse Lampion 1472071 L120.
# iTCG goods: Ancient Helm 4031897, Ancient Armor 4031898, Ancient Gi 4031919, Ergoth's Jawbone 4031904 (nothing drops
# it), Ridley's Book of Rituals 4031900, Ridley's Stone 4032026, the Blue Husky 5000037 (a real pet, RewardItems).

# ---- Aldwin, keeper of the sixth plinth: his arc ----------------------------------------------------------------------

- id: aldwin-the-empty-plinth
  persona: aldwin
  title: "The Sixth Plinth"
  length: MEDIUM
  requires: { level: { min: 74 } }
  steps:
    - { id: talk, type: TALK }
    - { id: trees, type: KILL_MOBS, mobIds: [9400586], count: 40, mapIds: [610020002, 610020003] }
    - { id: wood, type: COLLECT_ITEM, itemId: 4032004, count: 10 }
    - { id: plinth, type: DELIVER, to: aldwin, take: { itemId: 4032004, count: 10 } }
  rewards: { meso: 60000, exp: 90000, bondPoints: 40, items: [{ itemId: 4031897, count: 1 }] }
  onComplete: { arcAdvance: { arc: aldwin-the-sixth-banner, to: chapter-2 } }

- id: aldwin-into-the-sanctum
  persona: aldwin
  title: "Into the Sanctum"
  length: LONG
  requires: { level: { min: 90 }, flags: [cwk.heard-entry], questsCompleted: [aldwin-the-empty-plinth] }
  steps:
    - { id: talk, type: TALK }
    - { id: sanctum, type: PARTY_QUEST_CLEAR, to: CWKPQ }
    - { id: report, type: DELIVER, to: aldwin }
  rewards: { meso: 150000, exp: 250000, bondPoints: 60, items: [{ itemId: 4031904, count: 1 }] }
  onComplete: { arcAdvance: { arc: aldwin-the-sixth-banner, to: chapter-3 } }

