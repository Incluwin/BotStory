- id: fennimore-a-sign-for-the-door
  persona: fennimore
  title: "A Sign for the Door"
  length: SHORT
  requires: { level: { min: 90 } }
  steps:
    - { id: talk, type: TALK }
    - { id: briar, type: TALK_TO, persona: briar, say: ["a sign. 'go away'. ...there. i carved it. you watched me. look at it. it says 'go away'. ...look again, in this light. (it says 'come in') my hands don't believe him. give it to him. tell him i tried. tell him the wood didn't."] }
    - { id: hung, type: DELIVER, to: fennimore }
  rewards: { meso: 26000, exp: 50000, bondPoints: 40, items: [{ itemId: 2022000, count: 15 }] }
