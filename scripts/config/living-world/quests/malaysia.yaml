# Malaysia quests (docs/ROUTES_MALAYSIA_PLAN.md section 5). Fields, east of Kuala Lumpur and on through Kampung Village:
# the Outskirts of Muddy Banks 550000100 (chlorotrap 9420527 coconut husk 4000465, emo slime 9420528 rebab 4000466),
# Muddy Banks 1 550000200 (dark fission 9420529 yellow wig 4000467, oly oly 9420530 somebody's tire 4000468), Muddy
# Banks 2 550000300 (rodeo 9420533 rodeo's master 4000471), Muddy Banks 3 550000400 (charmer 9420534 charmer's flute
# 4000472); past the kampung, Hibiscus Road 1 551000100 (rodeo, charmer) and 2 551000200 (scaredy scarlion 9420531
# scarf 4000469, ratatula 9420532 tall hat 4000470); Fantasy Theme Park 1 551010000 (jester scarlion 9420535 dented
# barrel 4000473, froscola 9420536 lucky hat 4000474), 2 551020000 (yabber doo 9420537 lucky bus ticket 4000475,
# booper scarlion 9420538 toy plane 4000476), 3 551030000 (vikerola 9420539 viking helmet 4000477); the Entrance to the
# Spooky World 551030100 (gallopera 9420540 wooden pony tail 4000478). Every drop above is the mob's own 30% etc item.
# The Longest Ride on ByeBye Station (551030001-551030019) is the third park's mini-dungeon (scripts/portal/MD_high.js
# opens the first free of its 19 copies; 551030020 is never used), so its steps list all nineteen. Scarlion and Targa
# (Aldol's expedition in the Spooky World) are script-spawned boss-event mobs, so no quest counts them.

# ---- Farah: the opening-night tape (arcs/malaysia.yaml) ----
- id: farah-the-muddy-banks-footage
  persona: farah
  title: "Sunset on the Muddy Banks"
  length: SHORT
  requires: { level: { min: 46 } }
  steps:
    - { id: talk, type: TALK }
    - { id: outskirts, type: VISIT_MAP, mapIds: [550000100] }
    - { id: slimes, type: KILL_MOBS, mobIds: [9420528], count: 20, mapIds: [550000100] }
    - { id: shot, type: DELIVER, to: farah }
  rewards: { meso: 9000, exp: 10000, bondPoints: 30, items: [{ itemId: 2000002, count: 20 }] }

- id: farah-the-opening-night
  persona: farah
  title: "The Opening Night Tape"
  length: MEDIUM
  requires: { level: { min: 58 }, questsCompleted: [farah-the-muddy-banks-footage], notFlags: [kl.tape.mended] }
  steps:
    - { id: talk, type: TALK }
    - { id: lim, type: TALK_TO, persona: lim, say: ["a tape? from the archive? give it here. ...'opening night'. aiyo. i nearly didn't open the box. there, that's the carousel. listen. that hum is my motor. and the horses are Tok Awang's, from the kampung. forty of them. the one in front with the star is Bintang. it's mended. tell her to play it loud."] }
    - { id: scarlions, type: KILL_MOBS, mobIds: [9420531], count: 20, mapIds: [551000200] }
    - { id: gates, type: VISIT_MAP, mapIds: [551010000] }
    - { id: footage, type: DELIVER, to: farah }
  rewards: { meso: 16000, exp: 18000, bondPoints: 40, items: [{ itemId: 2000004, count: 10 }], worldFlags: [kl.tape.mended] }

- id: farah-the-carousel-turns
  persona: farah
  title: "One Turn of the Carousel"
  length: LONG
  requires: { level: { min: 80 }, questsCompleted: [farah-the-muddy-banks-footage], flags: [kampung.bintang.home], notFlags: [my.carousel.turns] }
  steps:
    - { id: talk, type: TALK }
    - { id: boopers, type: KILL_MOBS, mobIds: [9420538], count: 30, mapIds: [551020000] }
    - { id: vikerolas, type: KILL_MOBS, mobIds: [9420539], count: 20, mapIds: [551030000] }
    - { id: awang, type: TALK_TO, persona: awang, say: ["the city wants to turn my carousel. for its camera. ...tell her yes. Bintang's ready. tell her the kampung's children ride free. that's my condition. it was always the deal. the city forgot it. we didn't."] }
    - { id: lim, type: TALK_TO, persona: lim, say: ["he said yes? Awang said yes? ...then the motor's ready. it's been ready thirty years. tell her tonight. i'll bring the key."] }
    - { id: turns, type: DELIVER, to: farah }
  rewards: { meso: 60000, exp: 70000, bondPoints: 60, items: [{ itemId: 2000005, count: 20 }], worldFlags: [my.carousel.turns] }

