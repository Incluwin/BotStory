  persona: dalja
  title: "The Festival Round"
  length: SHORT
  requires: { level: { min: 20 } }
  steps:
    - { id: talk, type: TALK }
    - { id: okja, type: TALK_TO, persona: okja, say: ["Dalja's rice cakes. warm. give me your hand while i eat it. ...a long road, good friends, and a hot meal at the end. you'll get the meal first. she's waiting."] }
    - { id: jiho, type: TALK_TO, persona: jiho, say: ["oh. a rice cake. from Dalja? she'll ask if i ate it. ...i'm eating it. look. i'm eating it. tell her chapter nine says thank you."] }
    - { id: round, type: DELIVER, to: dalja }
  rewards: { meso: 4000, exp: 4000, bondPoints: 30, items: [{ itemId: 2022037, count: 2 }] }

