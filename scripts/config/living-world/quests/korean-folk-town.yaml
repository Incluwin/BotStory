# Korean Folk Town quests (wave 3). Fields: the foot of Black Mountain 222010000-222010002 (dark axe stump 2130100,
# moon bunny 4230300 pounder 4000169); the pond and Tiger Forest 222010100-222010200 (hodori 5100003 tiger stamp
# 4000170, hogul 5100005 tiger skin 4000171); the valley and Fox Ridge 222010201-222010310 (samiho 5100004 three-tailed
# foxtail 4000172, scholar ghost 6090003 hat 4000416 on 222010300); the top of Black Mountain 222010400 (blin
# 6130201) and the goblin house 222010402; the Helios Tower 222020100-222020300 (retz 3210208 sunflower seed 4000168).
# The recruits' tiers are in Ludibrium's clock tower: dark klock 8140300 evil spirit 4000146 (220070100), ghost
# pirate 7140000 key 4000132 (220060200), spirit viking 8141000 (220060300), death teddy 7130010 (220070200), phantom
# watch 8142000 (220070300), grim phantom watch 8143000 (220070301), gatekeeper 8160000 (220060400), thanatos 8170000
# (220070400).

# ---- Bomi: her father's radio (arcs/korean-folk-town.yaml) ----
- id: bomi-the-persimmon-tree
  persona: bomi
  title: "Luck for the Persimmon Tree"
  length: SHORT
  requires: { level: { min: 22 } }
  steps:
    - { id: talk, type: TALK }
    - { id: stumps, type: KILL_MOBS, mobIds: [2130100], count: 20, mapIds: [222010000, 222010001] }
    - { id: magpies, type: DELIVER, to: bomi }
  rewards: { meso: 3500, exp: 3500, bondPoints: 30, items: [{ itemId: 2020005, count: 5 }] }

- id: bomi-the-hissing-radio
  persona: bomi
  title: "The Radio That Hisses"
  length: MEDIUM
  requires: { level: { min: 42 }, questsCompleted: [bomi-the-persimmon-tree] }
  steps:
    - { id: talk, type: TALK }
    - { id: petra, type: TALK_TO, persona: petra, say: ["a gray receiver for a radio, from Korean Folk Town. i'll keep it going as long as she needs it. the coil's burnt out, and only the zeta grays' little ships carry one. take her ten with it. the coil clicks in. she can do it herself and watch it hum."] }
    - { id: grays, type: KILL_MOBS, mobIds: [4230117], count: 25, mapIds: [221040100, 221040200] }
    - { id: ships, type: COLLECT_ITEM, itemId: 4000118, count: 10 }
    - { id: mended, type: DELIVER, to: bomi, take: { itemId: 4000118, count: 10 } }
  rewards: { meso: 12000, exp: 14000, bondPoints: 40, items: [{ itemId: 2000004, count: 10 }], worldFlags: [kft.radio.mended] }

- id: bomi-the-first-answer
  persona: bomi
  title: "The Voice on the Radio"
  length: MEDIUM
  requires: { level: { min: 45 }, questsCompleted: [bomi-the-hissing-radio], flags: [omega.channel.answered], notFlags: [kft.answer.heard] }
  steps:
    - { id: talk, type: TALK }
    - { id: lyra, type: TALK_TO, persona: lyra, say: ["you're her friend? Bomi's? i know all about the persimmons. and the magpies. and her dad. tell her i'm Lyra. tell her i'll be on at nine. tell her i'm not her dad, but i'm listening, and i always will be."] }
    - { id: told, type: DELIVER, to: bomi }
  rewards: { meso: 20000, exp: 22000, bondPoints: 50, items: [{ itemId: 2000005, count: 5 }], worldFlags: [kft.answer.heard] }

