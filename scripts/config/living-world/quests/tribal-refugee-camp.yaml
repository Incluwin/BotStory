# Tribal Refugee Camp quests (Repack Residents, docs/REPACK_RESIDENTS_PLAN.md section 3.3). The camp 273050000 is reached
# by the guarded road: Three Doors, the Temple Keeper's door to Twilight Perion, and Cobie 2142112, who stands in both
# towns, takes travellers the safe way to the camp and back. The walk itself (the Desolate Hills, the rocky roads and the
# Forsaken Excavation Site 1 273040000, lv190-194) and the Spirit Zone Limbo 273060000 east of the camp (lv196) are never
# step targets below level 180; the scouts' last tier is fought on the lv163-168 fields of Dark Ereve and Henesys
# Ruins' hills (quests/henesys-ruins.yaml header). Future mobs drop only their
# donors' potions and scrolls: collect steps carry the present, the Temple of Time's roads (quests/three-doors.yaml
# header; the Road to Oblivion's second stretch 270030200 holds the oblivion monk trainee 8200010, red cone hat 4000455)
# or present Victoria (orange mushroom 1210102, orange mushroom cap 4000001). The camp carries the middle of both Future
# threads: Kasper finds where Ama's letters went (camp.answers.found, arcs/henesys-ruins.yaml) and Ama lights the old
# fire for Heddwyn's story (camp.fire.lit, arcs/twilight-perion.yaml).

# ---- Ama ----
- id: ama-mushrooms-from-before
  persona: ama
  title: "Mushrooms That Don't Bite"
  length: SHORT
  requires: { level: { min: 125 } }
  steps:
    - { id: talk, type: TALK }
    - { id: caps, type: COLLECT_ITEM, itemId: 4000001, count: 20 }
    - { id: soup, type: DELIVER, to: ama, take: { itemId: 4000001, count: 20 } }
  rewards: { meso: 70000, exp: 240000, bondPoints: 30, items: [{ itemId: 2000005, count: 20 }] }

- id: ama-a-supper-for-the-story
  persona: ama
  title: "A Supper for the Story"
  length: MEDIUM
  requires: { level: { min: 135 }, questsCompleted: [ama-mushrooms-from-before], flags: [tperion.story.before] }
  steps:
    - { id: talk, type: TALK }
    - { id: heddwyn, type: TALK_TO, persona: heddwyn, say: ["a supper by the old fire? tell her yes. tell her i'll come. i always come for her suppers and stay too late. by that fire, i'll stay later."] }
    - { id: lit, type: DELIVER, to: ama }
  rewards: { meso: 110000, exp: 400000, bondPoints: 45, items: [{ itemId: 2000005, count: 25 }], worldFlags: [camp.fire.lit] }

# ---- Kasper (the middle of Edda's letters, arcs/henesys-ruins.yaml) ----
- id: kasper-the-fast-way
  persona: kasper
  title: "Race You"
  length: SHORT
  requires: { level: { min: 130 } }
  steps:
    - { id: talk, type: TALK }
    - { id: perion, type: VISIT_MAP, mapIds: [273000000] }
    - { id: doors, type: VISIT_MAP, mapIds: [270000000] }
    - { id: ruins, type: VISIT_MAP, mapIds: [271010000] }
    - { id: home, type: DELIVER, to: kasper }
  rewards: { meso: 80000, exp: 280000, bondPoints: 30, items: [{ itemId: 2000004, count: 20 }] }

- id: kasper-the-door-goes-everywhere
  persona: kasper
  title: "The Door Goes Everywhere"
  length: MEDIUM
  requires: { level: { min: 135 }, flags: [ruins.letter.carried], notFlags: [camp.answers.found] }
  steps:
    - { id: talk, type: TALK }
    - { id: doors, type: VISIT_MAP, mapIds: [270000000] }
    - { id: osmund, type: TALK_TO, persona: osmund, say: ["letters? ...yes. every month something comes through the Temple Keeper's door that isn't a traveller. a boot, once. a hat. a very confused goat. and a letter, addressed 'Edda, Henesys Ruins'. Henesys is not in ruins. i filed them under 'not yet'. twelve. ...a boy sends them? then take them back to the boy. a door only goes where it's told. tell him that too."] }
    - { id: found, type: DELIVER, to: kasper }
  rewards: { meso: 120000, exp: 420000, bondPoints: 50, items: [{ itemId: 2000005, count: 20 }], worldFlags: [camp.answers.found] }

