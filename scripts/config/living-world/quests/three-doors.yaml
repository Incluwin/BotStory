# ---- Ilsabet ----
- id: ilsabet-the-unruled-line
  persona: ilsabet
  title: "The Unruled Line"
  length: SHORT
  requires: { level: { min: 80 } }
  steps:
    - { id: talk, type: TALK }
    - { id: corliss, type: TALK_TO, persona: corliss, say: ["the night ship to Leafre, thirty years back? before my time. the old ledgers are in the back room. ...here. 'Ilsabet, of Ellinia, green hat. boarded.' and nothing after. nobody ever ruled it off. i'll do it now. 'disembarked: the Temple of Time.' there. a closed line. tell her."] }
    - { id: elsk, type: TALK_TO, persona: elsk, say: ["a lady asleep in the hold, thirty years back? the old porters tell that one. nobody could wake her, so they let her be, and in the morning she wasn't there. they said the temple had her. ...that's her? tell her she's famous. tell her the porters still leave a lamp on in the hold."] }
    - { id: back, type: DELIVER, to: ilsabet }
  rewards: { meso: 20000, exp: 30000, bondPoints: 30, items: [{ itemId: 2000004, count: 15 }] }

- id: ilsabet-thirty-years-behind
  persona: ilsabet
  title: "Thirty Years Behind"
  length: MEDIUM
  requires: { level: { min: 90 }, questsCompleted: [ilsabet-the-unruled-line] }
  steps:
    - { id: talk, type: TALK }
    - { id: trainees, type: KILL_MOBS, mobIds: [8200002], count: 25, mapIds: [270010200] }
    - { id: felt, type: COLLECT_ITEM, itemId: 4000445, count: 10 }
    - { id: mirelle, type: TALK_TO, persona: mirelle, say: ["felt from the temple? lovely stuff. here, a pattern: a hat about twenty years behind. tell her to sew it herself. a hat you've sewn holds your wits better. and tell her hers will come back. they always do."] }
    - { id: hat, type: DELIVER, to: ilsabet, take: { itemId: 4000445, count: 10 } }
  rewards: { meso: 25000, exp: 45000, bondPoints: 35, items: [{ itemId: 2000005, count: 5 }] }

