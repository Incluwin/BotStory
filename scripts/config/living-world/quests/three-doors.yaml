# Temple of Time quests (wave 4). Fields behind Three Doors: Memory Lane 270010100-270010500 (eye of time 8200000
# cracked hourglass 4000443 everywhere; memory monk 8200001 green cloth 4000444 on 270010100; memory monk trainee
# 8200002 green cone hat 4000445 on 270010200; memory guardian 8200003 green helmet 4000447 on 270010300-270010400;
# chief memory guardian 8200004 green heart 4000448 on 270010400-270010500; Dodo 8220004 whale's helmet 4000460 at
# 270010500); the Road of Regrets 270020100-270020500 (qualm monk 8200005 blue cloth 4000449; trainee 8200006 blue cone
# hat 4000450; qualm guardian 8200007 blue helmet 4000452; chief 8200008 blue heart 4000453); the Road to Oblivion
# 270030100-270030500 (oblivion monk 8200009 red cloth 4000454; trainee 8200010; oblivion guardian 8200011). Resting
# spots 270010110/210/310/410 and 270020110...; the temple is reached from the Orbis-Leafre ship.

# ---- Solveig: the Road of Regrets (arcs/three-doors.yaml) ----
- id: solveig-the-pilgrims-cairn
  persona: solveig
  title: "The Pilgrim's Cairn"
  length: SHORT
  requires: { level: { min: 82 } }
  steps:
    - { id: talk, type: TALK }
    - { id: eyes, type: KILL_MOBS, mobIds: [8200000], count: 25, mapIds: [270020100, 270020200] }
    - { id: cairn, type: VISIT_MAP, mapIds: [270020110] }
    - { id: laid, type: DELIVER, to: solveig }
  rewards: { meso: 22000, exp: 30000, bondPoints: 30, items: [{ itemId: 2000004, count: 20 }] }

- id: solveig-the-song-in-the-glass
  persona: solveig
  title: "A Song in the Glass"
  length: MEDIUM
  requires: { level: { min: 84 }, questsCompleted: [solveig-the-pilgrims-cairn] }
  steps:
    - { id: talk, type: TALK }
    - { id: eyes, type: KILL_MOBS, mobIds: [8200000], count: 30, mapIds: [270010300, 270010400] }
    - { id: glasses, type: COLLECT_ITEM, itemId: 4000443, count: 12 }
    - { id: listen, type: DELIVER, to: solveig, take: { itemId: 4000443, count: 12 } }
  rewards: { meso: 26000, exp: 40000, bondPoints: 40, items: [{ itemId: 2000005, count: 10 }], worldFlags: [temple.song.found] }

- id: solveig-the-girl-at-the-gate
  persona: solveig
  title: "The Girl at the Gate"
  length: MEDIUM
  requires: { level: { min: 84 }, questsCompleted: [solveig-the-song-in-the-glass], flags: [neo.harbor.heard], notFlags: [temple.song.traced] }
  steps:
    - { id: talk, type: TALK }
    - { id: augustin, type: TALK_TO, persona: augustin, say: ["a harbor? the gate opens on Midnight Harbor, in the year 2099, on some nights. a girl came out of it this spring. Calla. she's by the gate now. ...a song, you say. ask her. i'll say no more. it's not my line to read."] }
    - { id: calla, type: TALK_TO, persona: calla, say: ["a song from a glass? hum it. ...hm hm hmm. hm hmm. i know the next bit! i don't know how i know it. it's gran's. it's my gran's song. i'd forgotten i'd forgotten it. tell her. tell the pilgrim."] }
    - { id: told, type: DELIVER, to: solveig }
  rewards: { meso: 40000, exp: 60000, bondPoints: 60, items: [{ itemId: 2000005, count: 10 }], worldFlags: [temple.song.traced] }

