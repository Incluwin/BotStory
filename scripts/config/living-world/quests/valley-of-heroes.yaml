# Valley of Heroes quest lines (docs/ITCG_MASTERIA_PLAN.md section 6). The valley (610020000) has no mobs; every hunt is
# up the mountain or down in the forest. Ids from the server's own data: windraider 9400576 and crimson tree 9400586
# (crimson wood 4032004 at 20%) on the lower ascent 610020002; firebrand 9400577 (cavern of fear 610020010, cavern of
# shame 610020012, path of strength 610020003); typhon 9400574 (path of peril 610020004); nightshadow 9400579 (upper
# ascent 610020005, path of strength); stormbreaker 9400581 (upper ascent, cavern of valour 610020015); crimson
# guardian 9400582 (crimson heart 4032012 at 20%; eternal vigilance 610030015, the keep gate road 610020006); phantom
# tree 9400588 (phantom seed 4032003 at 15%; bent tree 610010000, haunted hill 610010001, swamp bog 610010002); Valley
# of Heroes 2 610020001; the cavern of pain 610020011 (Jack).
# Gear: Osgar's two-handed blunts Golden Smith Hammer 1422027 L100 / Dragon Flame 1422028 L110 / Reverse Bellocce
# 1422038 L120; Elspeth's swords Sparta 1302056 L100 / Dragon Carabella 1302059 L110 / Reverse Executioners 1302086 L120.
# iTCG goods: Ancient Greaves 4031899, Ancient Faceguard 4031918, Taru Totem 4031755, Taru Spirit Feather 4031936, Taru
# Spirit Cape 1102165, the Orange Tiger 5000044 (a real pet, RewardItems).

# ---- Bertil, carver of the valley stones: the last beat of the sixth banner -------------------------------------------

- id: bertil-clear-the-ascent
  persona: bertil
  title: "The Stones Lean"
  length: SHORT
  requires: { level: { min: 70 } }
  steps:
    - { id: talk, type: TALK }
    - { id: raiders, type: KILL_MOBS, mobIds: [9400576], count: 40, mapIds: [610020002] }
    - { id: report, type: DELIVER, to: bertil }
  rewards: { meso: 30000, exp: 50000, bondPoints: 35, items: [{ itemId: 4031899, count: 1 }] }

- id: bertil-the-sixth-name
  persona: bertil
  title: "The Sixth Name"
  length: SHORT
  requires: { level: { min: 90 }, notFlags: [masteria.banner.carved], questsCompleted: [aldwin-into-the-sanctum] }
  steps:
    - { id: talk, type: TALK }
    - { id: aldwin, type: TALK_TO, persona: aldwin, say: ["the words? i've had them forty years. 'Leofric, Banner Master. he carried it in.' that's all. not 'he fell'. nobody saw him fall. somebody saw where he carried it. tell Bertil. tell him exactly."] }
    - { id: carve, type: DELIVER, to: bertil }
  rewards: { meso: 120000, exp: 200000, bondPoints: 60, items: [{ itemId: 1102165, count: 1 }], worldFlags: [masteria.banner.carved] }

