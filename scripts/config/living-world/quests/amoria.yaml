# Amoria quests (wave 4). Fields: the purple plains 680010000/680010100 (blue snail 100101 blue snail shell 4000000, red
# snail 130101 red snail shell 4000016, slime 210100 squishy liquid 4000004, orange mushroom 1210102 orange mushroom
# cap 4000001, dark stump 1110101 leaf 4000005 on 680010100 only); Purplewood Forest 670000100/670000200 and the plains
# (sakura cellion 9400509 cellion tail 4000070 at 20%); Purplewood only (indigo eye 9400515, crystal boar 9400516: kill
# only, no usable drops). Henesys fields past Thomas Swift: Monkey Forest 100040101-100040110 (lupin 3210800 lupin doll
# 4000026 / lupin's banana 4000029 / stiff feather 4003004 at 20% on 100040101-100040103 and 100040110, zombie lupin
# 4230101 cursed doll 4000031 on 100040101, 100040103-100040106) and the Forest of Evil 100040105/100040106 (malady
# 5300100 malady's experimental frog 4000041). The thread's Amoria beats: Pernille's errand to Hadrik in Lith Harbor
# and her answer, sent from Florina's look-out shed 110010000; both happen once per server. The recruits give gloves
# and hats made for the player's class in Amoria's band (30-50).

# ---- Pernille: forty springs (arcs/amoria.yaml, with arcs/florina-beach.yaml) ----
- id: pernille-garlands-for-the-steps
  persona: pernille
  title: "Garlands for the Chapel Door"
  length: SHORT
  requires: { level: { min: 10 } }
  steps:
    - { id: talk, type: TALK }
    - { id: stumps, type: KILL_MOBS, mobIds: [1110101], count: 20, mapIds: [680010100] }
    - { id: leaves, type: COLLECT_ITEM, itemId: 4000005, count: 15 }
    - { id: garland, type: DELIVER, to: pernille, take: { itemId: 4000005, count: 15 } }
  rewards: { meso: 1500, exp: 1200, bondPoints: 30, items: [{ itemId: 2000001, count: 15 }] }

- id: pernille-what-the-sea-said
  persona: pernille
  title: "What the Sea Said"
  length: MEDIUM
  requires: { level: { min: 30 }, questsCompleted: [pernille-garlands-for-the-steps], flags: [amoria.letter.read], notFlags: [amoria.gull.remembered] }
  steps:
    - { id: talk, type: TALK }
    - { id: hadrik, type: TALK_TO, persona: hadrik, say: ["the Silver Gull. i was a boy on her deck. spring storm off Florina, forty years back. she went down. i went over the side first. the bosun came in after me. Aurelio. he got me to a spar. he didn't get one for himself. ...tell her that."] }
    - { id: back, type: DELIVER, to: pernille }
  rewards: { meso: 12000, exp: 12000, bondPoints: 40, items: [{ itemId: 2000002, count: 20 }], worldFlags: [amoria.gull.remembered] }

- id: pernille-forty-years-late
  persona: pernille
  title: "Forty Years Late"
  length: LONG
  requires: { level: { min: 35 }, questsCompleted: [pernille-garlands-for-the-steps], flags: [amoria.gull.remembered, amoria.heard-steps], notFlags: [florina.answer.sent] }
  steps:
    - { id: talk, type: TALK }
    - { id: marisol, type: TALK_TO, persona: marisol, say: ["a letter for the sea? from Pernille? ...oh. i know the tide for it. the evening ebb runs out past the point, right where the Gull went down. come up to the look-out shed with me. we'll send it together."] }
    - { id: shed, type: VISIT_MAP, mapIds: [110010000] }
    - { id: gone, type: DELIVER, to: pernille }
  rewards: { meso: 20000, exp: 20000, bondPoints: 50, items: [{ itemId: 2000004, count: 5 }], worldFlags: [florina.answer.sent] }

