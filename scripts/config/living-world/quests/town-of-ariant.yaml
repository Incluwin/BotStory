    meso: 150000
    exp: 150000
    bondPoints: 60
    gear:
      - { pool: [1132013], scrolls: [{ success: 10, count: 2 }, { success: 60 }] }

- id: kasim-my-fathers-rule
  persona: kasim
  title: "My Father's Rule"
  length: SHORT
  requires: { level: { min: 30 } }
  steps:
    - { id: talk, type: TALK }
    - { id: sefa, type: TALK_TO, persona: sefa, say: ["Kasim's father? ...two years he rode with us. never took a cup of water off anyone. not even when we were dry. tell the boy that. and tell him i see him on the roofs. i'm watching. he knows."] }
    - { id: report, type: DELIVER, to: kasim }
  rewards: { meso: 7000, exp: 6000, bondPoints: 35 }
