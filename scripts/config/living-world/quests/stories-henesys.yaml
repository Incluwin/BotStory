# The pilots' story chapters (docs/BOT_CONCEPT_PLAN.md F6; stories/henesys.yaml). These quests are in no persona's
# questLines: only the story offers them, from the companion's card, to its owner. A chapter starts with its
# conversation (the TALK step) and ends with its last step's say line in the closing window; the capstone's SCENE step
# is played in a private copy of a map (scenes/henesys.yaml). Each one's reward sets the story's done flag.

- id: fenna-story-1
  persona: fenna
  title: "The Long Road: Why the Road"
  requires: { friendship: 3 }
  steps:
    - { id: talk, type: TALK, say: ["thanks for hearing it. i don't say it twice."] }
  rewards: { bondPoints: 10, flags: [story.fenna-long-road.one] }

- id: fenna-story-2
  persona: fenna
  title: "The Long Road: The Shot"
  requires: { friendship: 6, questsCompleted: [fenna-story-1] }
  steps:
    - { id: talk, type: TALK, say: ["i've never said that out loud. don't make it a thing."] }
  rewards: { bondPoints: 10, flags: [story.fenna-long-road.two] }

- id: fenna-story-3
  persona: fenna
  title: "The Long Road: The Old Blind"
  requires: { friendship: 9, questsCompleted: [fenna-story-2] }
  steps:
    - { id: talk, type: TALK }
    - { id: blind, type: SCENE, scene: fenna-old-blind, say: ["thanks for standing on the ridge with me. the road's lighter now."] }
  rewards: { bondPoints: 20, flags: [story.fenna-long-road.three] }

