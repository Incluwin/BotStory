# Singapore quests (wave 3). Fields: the central way 540000100-540000300 (biner 9420502 waste paper 4000366, batoo
# 9420506 broken wing 4000368, stopnow 9420500 stop sign 4000369 / metal pole 4000370, nospeed 9420503 metal pole);
# the suburban area 540020000 (freezer 9420501 fire extinguisher 4000372) and 540020100 (trucker 9420507 headlight
# 4000374, tires 4000375, batteries 4000376, wires 4000364); the mysterious path 541000100 (tippo red 9420504 small
# poop 4000377, tippo blue 9420505 big poop 4000378), 541000200 (octobunny 9420508 ink 4000373, pac pinky 9420509
# pink essence 4000380), 541000300 (slimy 9420510 green essence 4000379, selkie jr. 9420511 blue essence 4000382);
# the ghost ship 541010000 (pac pinky), 541010010 (slimy), 541010040 (selkie jr.), 541010050 (mr. anchor 9420512 red
# essence 4000383). The recruits carry armour: earrings and capes in Singapore's band (55-75).

# ---- Rosnah: lanterns for the crew (arcs/singapore.yaml) ----
- id: rosnah-the-lantern-glass
  persona: rosnah
  title: "Glass for the Lanterns"
  length: SHORT
  requires: { level: { min: 46 } }
  steps:
    - { id: talk, type: TALK }
    - { id: truckers, type: KILL_MOBS, mobIds: [9420507], count: 25, mapIds: [540020100] }
    - { id: headlights, type: COLLECT_ITEM, itemId: 4000374, count: 10 }
    - { id: glass, type: DELIVER, to: rosnah, take: { itemId: 4000374, count: 10 } }
  rewards: { meso: 12000, exp: 13000, bondPoints: 30, items: [{ itemId: 2000002, count: 20 }] }

- id: rosnah-the-ghost-ship
  persona: rosnah
  title: "Are the Lanterns Lit?"
  length: MEDIUM
  requires: { level: { min: 56 }, questsCompleted: [rosnah-the-lantern-glass] }
  steps:
    - { id: talk, type: TALK }
    - { id: look, type: VISIT_MAP, mapIds: [541010000] }
    - { id: pinkies, type: KILL_MOBS, mobIds: [9420509], count: 25, mapIds: [541010000] }
    - { id: lit, type: DELIVER, to: rosnah }
  rewards: { meso: 18000, exp: 20000, bondPoints: 40, items: [{ itemId: 2000004, count: 10 }], worldFlags: [sg.ship.seen] }

- id: rosnah-the-lantern-home
  persona: rosnah
  title: "Halim's Lantern"
  length: MEDIUM
  requires: { level: { min: 56 }, questsCompleted: [rosnah-the-ghost-ship], flags: [aqua.lantern.raised], notFlags: [sg.lantern.home] }
  steps:
    - { id: talk, type: TALK }
    - { id: delmar, type: TALK_TO, persona: delmar, say: ["you know her? the lantern's on my bench. still lit. Halim's name on the handle. take it to her. carry it level. it's burned twenty years. it can burn a few more days."] }
    - { id: home, type: DELIVER, to: rosnah }
  rewards: { meso: 25000, exp: 26000, bondPoints: 60, items: [{ itemId: 2000005, count: 10 }], worldFlags: [sg.lantern.home] }

