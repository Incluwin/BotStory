# Labyrinth of Suffering quests (Repack Residents, docs/REPACK_RESIDENTS_PLAN.md section 3.4). No mob spawns on Arcane
# River: errands. Walkable from the Crash Site 450011120: Labyrinth of Suffering Interior 3 450011400 and Interior 1
# 450011420 (Interior 2 450011410 past them), and the portal down to White Spear Deck 3 450009300. Carried in: small
# spaceship 4000118 (zeta gray 4230117, Kulan Field II/III 221040100/221040200), clock spring 4000113 (tick 3210207,
# Crossroad of Time 220040200), mechanical heart 4000112 (master robo 4230112, Toy Factory Process 1 Zone 1 220020000),
# kentaurus's flame 4000232 (red kentaurus 8140102, The Area of Red Kentaurus 240020000). Cassius's last flight chart
# sets arcane.page.labyrinth for Ottoline's River Atlas (Nameless Town).

# ---- Cassius: the ship that came down (the River Atlas page) ----
- id: cassius-gyros-from-kulan
  persona: cassius
  title: "Gyros from Kulan Field"
  length: MEDIUM
  requires: { level: { min: 90 } }
  steps:
    - { id: talk, type: TALK }
    - { id: ships, type: COLLECT_ITEM, itemId: 4000118, count: 10 }
    - { id: sorcha, type: TALK_TO, persona: sorcha, say: ["toy spaceships. off the grays. ...hm. hm. the gyros are better than ours. i hate that. tell him yes. tell him i frowned."] }
    - { id: gyros, type: DELIVER, to: cassius, take: { itemId: 4000118, count: 10 } }
  rewards: { meso: 38000, exp: 95000, bondPoints: 35, items: [{ itemId: 2000005, count: 8 }] }

- id: cassius-the-last-flight-chart
  persona: cassius
  title: "The Last Flight Chart"
  length: LONG
  requires: { level: { min: 100 }, questsCompleted: [cassius-gyros-from-kulan] }
  steps:
    - { id: talk, type: TALK }
    - { id: deck, type: VISIT_MAP, mapIds: [450009300] }
    - { id: roof, type: VISIT_MAP, mapIds: [450011420] }
    - { id: tilde, type: TALK_TO, persona: tilde, say: ["the night he came down? i was lighting the lamp at the first turning. a falling star, i thought, with somebody singing in it, very loud and not very well. then it hit the roof. tell him he was singing. tell him the lamp stayed lit."] }
    - { id: chart, type: DELIVER, to: cassius }
  rewards: { meso: 70000, exp: 180000, bondPoints: 50, items: [{ itemId: 2000005, count: 15 }], worldFlags: [arcane.page.labyrinth] }

