# Bigger Ben Lobby quest lines (docs/ITCG_MASTERIA_PLAN.md section 6). The lobby (600020000) has no mobs; MesoGears is
# below it. Ids from the server's own data: killa bee 9400540 (deity room 600020100, soul corridor 600020200), fire tusk
# 9400542 (deity room, fire chamber 600020400), firebomb 5100002 (fire chamber), jr. yeti 5100000 (jr. yeti skin 4000048
# at 60%; ice chamber 600020500), electrophant 9400543 (diferium fuel cell 4032022 and t-1 socket adapter 4032025 at 20%; ice chamber), wolf spider
# 9400545 (wolf spider cavern 600020300), the enigma chamber 600020600 (the Tombstone 9201073); I.AM.ROBOT 9400546
# (jumper cable 4032024 at 20%; the mountain slopes 600010400).
# iTCG goods: the Porcupine 5000039 (a real pet, RewardItems), Triferium Fuel Cell 4032021, Blinking Dingbat 4031752,
# Mystic Astrolabe 4031756, and Darcy's crate for Adonis (Set 5): Miner's Hat 1002856, El Nathian Cape 1102191, Crystal
# Blade 1302106, Stone Denari 4032134.

# ---- Agatha, cartographer of the first crew: her arc ------------------------------------------------------------------

- id: agatha-the-map-of-mesogears
  persona: agatha
  title: "Is the Map Still True?"
  length: SHORT
  requires: { level: { min: 45 } }
  steps:
    - { id: talk, type: TALK }
    - { id: bees, type: KILL_MOBS, mobIds: [9400540], count: 30, mapIds: [600020200] }
    - { id: fire, type: VISIT_MAP, mapIds: [600020400] }
    - { id: ice, type: VISIT_MAP, mapIds: [600020500] }
    - { id: report, type: DELIVER, to: agatha }
  rewards: { meso: 15000, exp: 18000, bondPoints: 40 }
  onComplete: { arcAdvance: { arc: agatha-the-last-verse, to: chapter-2 } }

- id: agatha-the-enigma-chamber
  persona: agatha
  title: "The Last Verse"
  length: MEDIUM
  requires: { level: { min: 45 }, flags: [bb.heard-song], notFlags: [bigger-ben.enigma.answered], questsCompleted: [agatha-the-map-of-mesogears] }
  steps:
    - { id: talk, type: TALK }
    - { id: yetis, type: KILL_MOBS, mobIds: [5100000], count: 20, mapIds: [600020500] }
    - { id: door, type: VISIT_MAP, mapIds: [600020600] }
    - { id: report, type: DELIVER, to: agatha }
  rewards: { meso: 60000, exp: 70000, bondPoints: 60, items: [{ itemId: 4031756, count: 1 }], worldFlags: [bigger-ben.enigma.answered] }

