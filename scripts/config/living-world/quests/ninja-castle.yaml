# Outside Ninja Castle quests (docs/REPACK_RESIDENTS_PLAN.md section 3.2). The walkable route: Outside Ninja Castle
# 800040000 -> Inside the Castle Gate 800040100 (genin 9400400) -> the Castle Corridors in order, called first to eighth
# in the dialogue: 800040200 (genin), 800040201 (genin, ashigaru 9400404), 800040202 (chunin 9400401), 800040203
# (chunin, kunoichi 9400406), 800040204 (genin, chunin, jonin 9400402), 800040205 (genin, chunin, jonin, kunoichi),
# 800040206 (jonin, ninto 9400403), 800040207 (genin, chunin, jonin, ninto; its portal leads back to the gate). The
# Phantom's Rooms hold a handful of mobs each and 800040210 is not reached on foot, so no step uses them. Ninja Castle
# mobs drop no etc of their own: steps there are kill counts, and collect steps use Zipangu's fields (quests/zipangu.yaml
# header: crow 9400000 crow feather 4000064 at Crow Forest 800020000/800020101, cloud fox 9400002 cloud foxtail 4000066
# at The Mountain of Cloud Fox 800010001). Perry 9110000 carries players between the Mushroom Shrine and the gate.

# ---- Oharu: the boy who went in (arcs/ninja-castle.yaml); its three beats happen once per server ----
- id: oharu-a-cup-sent-in
  persona: oharu
  title: "A Cup Sent In"
  length: SHORT
  requires: { level: { min: 25 } }
  steps:
    - { id: talk, type: TALK }
    - { id: gate, type: VISIT_MAP, mapIds: [800040100] }
    - { id: genin, type: KILL_MOBS, mobIds: [9400400], count: 20, mapIds: [800040100] }
    - { id: set-down, type: DELIVER, to: oharu }
  rewards: { meso: 4000, exp: 4500, bondPoints: 30, items: [{ itemId: 2022001, count: 10 }] }

- id: oharu-the-crooked-hem
  persona: oharu
  title: "The Crooked Hem"
  length: MEDIUM
  requires: { level: { min: 50 }, questsCompleted: [oharu-a-cup-sent-in], notFlags: [nc.headband.found] }
  steps:
    - { id: talk, type: TALK }
    - { id: chunin, type: KILL_MOBS, mobIds: [9400401], count: 30, mapIds: [800040202, 800040203] }
    - { id: found, type: DELIVER, to: oharu }
  rewards: { meso: 13000, exp: 14000, bondPoints: 40, items: [{ itemId: 2000002, count: 20 }], worldFlags: [nc.headband.found] }

- id: oharu-the-one-who-walked-out
  persona: oharu
  title: "The One Who Walked Out"
  length: MEDIUM
  requires: { level: { min: 55 }, questsCompleted: [oharu-a-cup-sent-in], flags: [nc.headband.found], notFlags: [nc.sota.known] }
  steps:
    - { id: talk, type: TALK }
    - { id: hayate, type: TALK_TO, persona: hayate, say: ["the headband with the crooked hem. i know it. Sota. two winters under me. he made chunin the spring before i walked out. he hangs her cups on a peg in the fourth corridor and drinks them cold, after the drills. he wore a fox mask under his hood, the kind they carve at the shrine, too small for him even then. ask the carver. i can't tell her myself. i walked out. Sota stayed."] }
    - { id: isamu, type: TALK_TO, persona: isamu, say: ["Oharu's boy, from the castle road? ...yes. i carved him a fox when he was small. his mother paid. a terrible mask. last spring a young man in a hood came to my bench after dark and asked for the same fox, bigger. paid in throwing stars. i carved the name inside it, same as the first. Sota. tell her it's still a terrible mask. tell her he wanted it anyway."] }
    - { id: told, type: DELIVER, to: oharu }
  rewards: { meso: 18000, exp: 20000, bondPoints: 50, items: [{ itemId: 2000004, count: 10 }], worldFlags: [nc.sota.known] }

- id: oharu-a-note-comes-out
  persona: oharu
  title: "Under the Saucer"
  length: LONG
  requires: { level: { min: 95 }, questsCompleted: [oharu-a-cup-sent-in], flags: [nc.sota.known], notFlags: [nc.note.out] }
  steps:
    - { id: talk, type: TALK }
    - { id: jonin, type: KILL_MOBS, mobIds: [9400402], count: 25, mapIds: [800040206] }
    - { id: the-turn, type: VISIT_MAP, mapIds: [800040207] }
    - { id: ninto, type: KILL_MOBS, mobIds: [9400403], count: 15, mapIds: [800040207] }
    - { id: home, type: DELIVER, to: oharu }
  rewards: { meso: 120000, exp: 130000, bondPoints: 60, items: [{ itemId: 2000005, count: 20 }], worldFlags: [nc.note.out] }

