# terraces brown teddy 3000005 (cotton 4000106), pink teddy 3110101 (yellow ribbon 4000107), toy trojan 3230305 (toy
# trojan sword 4000110, cloud terrace 5-3 220010000/220010100/220010200), roloduck 3210204 (toy duckling 4000109),
# panda teddy 3210203 (panda doll 4000108, sky terrace 5 220011000, toy factory 220020200/220020300). Toy factory robo
# 4230111 (cheap battery 4000111, 220020400/220020500/220030400), master robo 4230112 (mechanical heart 4000112,
# 220020000/220030000). Path of time platoon chronos 4230114 (220040000, lost time 1 220050000), chronos 3230306
# (cog 4000115, 220040100/220040300), tick 3210207 (clock spring 4000113) and tick-tock 4230113 (table clock 4000114) at
# the crossroad of time 220040200 and whirlpool of time 220050100, master chronos 4230115 (220040400, lost time 2
# 220050200). Warped path of time buffy 6130200 (buffy hat 4000128) and lazy buffy 6230300 (marble 4000129) 220060000,
# buffoon 6300100 (grandpa clock 4000130, 220060100/220060200), ghost pirate 7140000 (key 4000132, 220060200), dual
# ghost pirate 7160000 (propeller 4000133, unbalanced time 220060201), spirit viking 8141000 (viking sail 4000134,
# 220060300), gigantic spirit viking 8141100 (gigantic viking hat 4000135, twisted time 220060301). Forgotten path of
# time soul teddy 6230400 (zombie teddy bear 4000143) and master soul teddy 6230500 (free spirit 4000144) 220070000,
# death teddy 7130010 (sealed teddy bear 4000147, 220070200), phantom watch 8142000 (sealed bottle 4000149, 220070300),
# grim phantom watch 8143000 (ice piece 4000150, forbidden time 220070301).
# Gear: Saskia's claws Sapphire Gigantic 1472024 L60 / Blue Scarab 1472028 L70 / Black Mamba 1472031 L80; Jasper's guns
# Burning Hell 1492008 L60 / Abyss Shooter 1492009 L70 / Infinity's Wrath 1492010 L80. Della's coats for the player's
# class (an overall where the class wears robes, else a top; male and female pieces) L70/L80/L90. Marlow's capes Blue
# Giles 1102034 L85, Turquoise Musketeer 1102047 L95, Ludibrium Cape 1102057 L100.

# ---- Ignatz, clockwinder: the lost hour -------------------------------------------------------------------------

- id: ignatz-oil-for-the-gears
  persona: ignatz
  title: "Oil for the Gears"
  length: SHORT
  requires: { level: { min: 35 } }
  steps:
    - { id: talk, type: TALK }
    - { id: ticks, type: KILL_MOBS, mobIds: [3210207], count: 25, mapIds: [220040200] }
    - { id: springs, type: COLLECT_ITEM, itemId: 4000113, count: 15 }
    - { id: gears, type: DELIVER, to: ignatz, take: { itemId: 4000113, count: 15 } }
  rewards: { meso: 12000, exp: 11000, bondPoints: 30 }

- id: ignatz-eleven-strikes
  persona: ignatz
  title: "Eleven Strikes"
  length: MEDIUM
  requires: { level: { min: 40 }, questsCompleted: [ignatz-oil-for-the-gears] }
  steps:
    - { id: talk, type: TALK }
    - { id: ticktocks, type: KILL_MOBS, mobIds: [4230113], count: 30, mapIds: [220040200, 220050100] }
    - { id: clocks, type: COLLECT_ITEM, itemId: 4000114, count: 15 }
    - { id: listen, type: DELIVER, to: ignatz, take: { itemId: 4000114, count: 15 } }
  rewards: { meso: 18000, exp: 16000, bondPoints: 40 }
  onComplete: { arcAdvance: { arc: ignatz-the-lost-hour, to: chapter-2 } }

- id: ignatz-the-twelfth-strike
  persona: ignatz
  title: "The Twelfth Strike"
  length: MEDIUM
  requires: { level: { min: 45 }, flags: [ludibrium.heard-hour], questsCompleted: [ignatz-eleven-strikes] }
  steps:
    - { id: talk, type: TALK }
    - { id: prue, type: TALK_TO, persona: prue, say: ["stop the line? for an hour? ...fine. one hour. tell him one. tell him i'm doing it because he's right, and tell him i'll deny i said that."] }
    - { id: chronos, type: KILL_MOBS, mobIds: [4230115], count: 30, mapIds: [220040400, 220050200] }
    - { id: midnight, type: DELIVER, to: ignatz }
  rewards: { meso: 30000, exp: 26000, bondPoints: 50, items: [{ itemId: 2000006, count: 20 }], worldFlags: [ludibrium.hour.found] }

- id: ignatz-cogs
  persona: ignatz
