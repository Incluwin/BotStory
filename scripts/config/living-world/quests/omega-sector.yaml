# Omega Sector quests (wave 3). Fields: Kulan Field 221040000-221040400 (barnard gray 4230116 space food 4000117,
# zeta gray 4230117 small spaceship 4000118, ultra gray 4230118 receiving apparatus 4000119, chief gray 4240000);
# Boswell Field 221030100-221030601 (plateon 4230120 helmet 4000121, mecateon 4230121 laser gun 4000122, mt-09
# 5120100 fuel 4000126 at 221030601); Eos Tower 221020000-221024400 (trixter 2230103 on 221021900-221022100, ratz
# 3110102 / black ratz 3210205 rat trap 4000095 on 221024100-221024200, block golem 4230109 yellow toy block 4000101,
# king block golem 4230110 blue toy block 4000102 on 221020400 and the hidden tower 221020701, rombot 4130103 memory
# card 4000124 at 221020701, planey 3230304 plane controller 4000105 on 221021100/221021400/221021500). The recruits'
# tiers are in Ludibrium's clock tower: buffoon 6300100 grandpa clock 4000130 and deep buffoon 6400100 rock piece
# 4000131 (220060100), dual ghost pirate 7160000 (220060201), gigantic spirit viking 8141100 (220060301), gatekeeper
# 8160000 armband 4000151 (220060400), master death teddy 7130300 bridle 4000148 (220070201), grim phantom watch
# 8143000 (220070301), thanatos 8170000 strap 4000152 (220070400).

# ---- Lyra: the quiet channel (arcs/omega-sector.yaml) ----
- id: lyra-the-antenna
  persona: lyra
  title: "A Bearing for the Antenna"
  length: SHORT
  requires: { level: { min: 36 } }
  steps:
    - { id: talk, type: TALK }
    - { id: planeys, type: KILL_MOBS, mobIds: [3230304], count: 20, mapIds: [221021100, 221021400, 221021500] }
    - { id: controllers, type: COLLECT_ITEM, itemId: 4000105, count: 10 }
    - { id: antenna, type: DELIVER, to: lyra, take: { itemId: 4000105, count: 10 } }
  rewards: { meso: 7000, exp: 8000, bondPoints: 30, items: [{ itemId: 2000002, count: 20 }] }

- id: lyra-the-dead-channel
  persona: lyra
  title: "The Dead Channel"
  length: MEDIUM
  requires: { level: { min: 42 } }
  steps:
    - { id: talk, type: TALK }
    - { id: grays, type: KILL_MOBS, mobIds: [4230118], count: 25, mapIds: [221040300, 221040400] }
    - { id: receivers, type: COLLECT_ITEM, itemId: 4000119, count: 10 }
    - { id: wired, type: DELIVER, to: lyra, take: { itemId: 4000119, count: 10 } }
  rewards: { meso: 12000, exp: 14000, bondPoints: 40, items: [{ itemId: 2000004, count: 10 }], worldFlags: [omega.channel.heard] }

- id: lyra-the-trace
  persona: lyra
  title: "Somebody's Listening"
  length: MEDIUM
  requires: { level: { min: 45 }, questsCompleted: [lyra-the-dead-channel], flags: [kft.radio.mended], notFlags: [omega.channel.answered] }
  steps:
    - { id: talk, type: TALK }
    - { id: mountain, type: VISIT_MAP, mapIds: [222010001] }
    - { id: bomi, type: TALK_TO, persona: bomi, say: ["you came from the base under the tower? the radio lady wants to talk to me? ...tell her yes. tell her i'm here at nine. every night. tell her about the persimmons."] }
    - { id: answer, type: DELIVER, to: lyra }
  rewards: { meso: 20000, exp: 22000, bondPoints: 50, items: [{ itemId: 2000005, count: 5 }], worldFlags: [omega.channel.answered] }

