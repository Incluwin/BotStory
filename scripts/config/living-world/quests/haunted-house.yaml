# ---- Cornelius, the last Prendergast: his arc -------------------------------------------------------------------------

- id: cornelius-sophilias-room
  persona: cornelius
  title: "Sophilia's Room"
  length: SHORT
  requires: { level: { min: 45 } }
  steps:
    - { id: talk, type: TALK }
    - { id: dolls, type: KILL_MOBS, mobIds: [9400559, 9400560], count: 25, mapIds: [682000301, 682000303, 682000403, 682000400] }
    - { id: report, type: DELIVER, to: cornelius }
  rewards: { meso: 15000, exp: 20000, bondPoints: 40 }
  onComplete: { arcAdvance: { arc: cornelius-where-are-you, to: chapter-2 } }

- id: cornelius-a-party-at-last
  persona: cornelius
  title: "A Party at Last"
  length: MEDIUM
  requires: { level: { min: 45 }, flags: [hh.heard-birthday], notFlags: [haunted-house.party.held], questsCompleted: [cornelius-sophilias-room, winnie-the-party-dress] }
  steps:
    - { id: talk, type: TALK }
    - { id: barty, type: TALK_TO, persona: barty, say: ["invitations? done. i've given one to everyone off every taxi for a week. 'a birthday party at the Prendergast house, all welcome, no tickets'. no tickets! i've never said those words. they tasted strange. they tasted nice."] }
    - { id: dex, type: TALK_TO, persona: dex, say: ["the candles! i've got them! all of them! nine! she was going to be nine! i counted! tell Cornelius i didn't drop a single one. i dropped two. i picked them up."] }
    - { id: room, type: VISIT_MAP, mapIds: [682000301] }
    - { id: report, type: DELIVER, to: cornelius }
  rewards: { meso: 60000, exp: 80000, bondPoints: 60, items: [{ itemId: 2022195, count: 10 }], worldFlags: [haunted-house.party.held] }

