# Excavation Site quests (wave 4). The dig sites back along the road toward Perion: Ghost Stump 1140100 and Smirking
# Ghost Stump 1140130 (Seedling 4000195) on Excavation Site I-II 101030101/101030102, Wooden Mask 2230110 (Wooden Board
# 4000196) on 101030101-101030103, Rocky Mask 2230111 (Slate 4000197) on 101030102/101030103. On past the camp
# (101030104), the Remains <Tomb>: Skeledog 4230125 (Skeledog's Bone 4000204) and Mummydog 4230126 (Dirty Bandage
# 4000205) on 101030105-101030107, Skeleton Soldier 5150001 (Rib 4000206) on 101030106/101030107 and Camp 1-3
# 101030110-101030112, Officer Skeleton 6230602 (Pelvic Bone 4000207) on 101030108, the Remains <Cliff> 101030109 and
# the camps (Commander Skeleton 7130103 on 101030108/101030109). Nell's bananas: Lupin 3210800 (Lupin's Banana 4000029)
# on Sleepy Dungeon I 105040301 and Tree Dungeon, Monkey Forest I 100040102. Ossa (Perion) answers the Victoria errand.

# ---- Edmund: the buried name (arcs/excavation-camp.yaml) ----
- id: edmund-slate-for-the-board
  persona: edmund
  title: "Slate for the Board"
  length: SHORT
  requires: { level: { min: 22 } }
  steps:
    - { id: talk, type: TALK }
    - { id: masks, type: KILL_MOBS, mobIds: [2230111], count: 20, mapIds: [101030102, 101030103] }
    - { id: slate, type: COLLECT_ITEM, itemId: 4000197, count: 10 }
    - { id: board, type: DELIVER, to: edmund, take: { itemId: 4000197, count: 10 } }
  rewards: { meso: 4000, exp: 4000, bondPoints: 30, items: [{ itemId: 1022088, count: 1 }, { itemId: 2000002, count: 15 }] }

- id: edmund-the-chisel-marks
  persona: edmund
  title: "The Chisel Marks"
  length: MEDIUM
  requires: { level: { min: 48 }, questsCompleted: [edmund-slate-for-the-board] }
  steps:
    - { id: talk, type: TALK }
    - { id: stone, type: VISIT_MAP, mapIds: [101030107] }
    - { id: bandages, type: COLLECT_ITEM, itemId: 4000205, count: 15 }
    - { id: rubbings, type: DELIVER, to: edmund, take: { itemId: 4000205, count: 15 } }
  rewards: { meso: 14000, exp: 15000, bondPoints: 40, items: [{ itemId: 2000004, count: 10 }], worldFlags: [excav.marks.read] }

- id: edmund-ossas-stone
  persona: edmund
  title: "Ossa's Stone"
  length: MEDIUM
  requires: { level: { min: 50 }, questsCompleted: [edmund-the-chisel-marks], notFlags: [excav.name.found] }
  steps:
    - { id: talk, type: TALK }
    - { id: ossa, type: TALK_TO, persona: ossa, say: ["no. ...the stone with the scratches? why didn't you say so. came up face-down in the third site last spring. been holding my office door open since. take it. tell your scholar he owes me a door wedge. and get a hard hat."] }
    - { id: stone, type: DELIVER, to: edmund }
  rewards: { meso: 18000, exp: 20000, bondPoints: 45, items: [{ itemId: 2000004, count: 10 }], worldFlags: [excav.name.found] }

- id: edmund-the-name-said-aloud
  persona: edmund
  title: "The Name Said Aloud"
  length: LONG
  requires: { level: { min: 60 }, questsCompleted: [edmund-the-chisel-marks], flags: [excav.name.found, excav.heard-board], notFlags: [excav.name.restored] }
  steps:
    - { id: talk, type: TALK }
    - { id: cliff, type: VISIT_MAP, mapIds: [101030109] }
    - { id: officers, type: KILL_MOBS, mobIds: [6230602], count: 30, mapIds: [101030109] }
    - { id: board, type: DELIVER, to: edmund }
  rewards: { meso: 30000, exp: 35000, bondPoints: 60, items: [{ itemId: 2000005, count: 5 }], worldFlags: [excav.name.restored] }

