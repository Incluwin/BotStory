# Henesys Ruins quests (Repack Residents, docs/REPACK_RESIDENTS_PLAN.md section 3.3). The Future's fields: Henesys Ruins
# Market 271010100 and Park 271010200 (mutant snail 8600000 lv162); Hill North of Henesys Ruins 271010300 (mutant slime
# 8600002 lv166); Suspicious Hill 271010301 (mutant slime, mutant ribbon pig 8600003 lv168); Dark Spore Hill 271020000
# and Creepy Humming Forest Trail 271020100 (mutant orange mushroom 8600001 lv164); Dark Ereve 271000100/200/210 (mutant
# tino 8600004 lv163, tiru 8600005 lv165, tiguru 8600006 lv167) and the Ereve Forked Road 271000300. The way in is the
# Temple Keeper's door to the Gate to the Future 271000000 (a swim, then in00 to the town). The old road east over the
# Six Path Crossway Ruins 271010500 and the Deserted Southern Ridge 273010000 (lv190 stumps) is impassable in the story
# (Edda's letters) and no quest step uses it; Twilight Perion is reached by the Temple Keeper's other door.
# Future mobs drop only their donors' potions and scrolls, so collect steps carry the present: the Temple of Time's roads
# (quests/three-doors.yaml header; the Road to Oblivion's oblivion monk 8200009 red cloth 4000454 on 270030100), and
# present Henesys (blue snail 100101 blue snail shell 4000000; Henesys Market 100000100, Henesys Park 100000200).
# Edda's thread (arcs/henesys-ruins.yaml) runs through the camp: quests/tribal-refugee-camp.yaml sets camp.answers.found.

# ---- Edda: letters to the camp (arcs/henesys-ruins.yaml) ----
- id: edda-clean-bandages
  persona: edda
  title: "Cloth That Boils White"
  length: SHORT
  requires: { level: { min: 120 } }
  steps:
    - { id: talk, type: TALK }
    - { id: monks, type: KILL_MOBS, mobIds: [8200009], count: 25, mapIds: [270030100] }
    - { id: cloth, type: COLLECT_ITEM, itemId: 4000454, count: 15 }
    - { id: bandages, type: DELIVER, to: edda, take: { itemId: 4000454, count: 15 } }
  rewards: { meso: 60000, exp: 200000, bondPoints: 30, items: [{ itemId: 2000005, count: 20 }] }

- id: edda-a-letter-east
  persona: edda
  title: "A Letter East"
  length: MEDIUM
  requires: { level: { min: 130 }, questsCompleted: [edda-clean-bandages] }
  steps:
    - { id: talk, type: TALK }
    - { id: ama, type: TALK_TO, persona: ama, say: ["a letter from Edda! by hand! give it here. ...three lines. she writes like she's taking a pulse. i answer every month, you know. four pages. Kasper runs them west for me. tell her she's a goose. tell her i said it fondly. mostly."] }
    - { id: back, type: DELIVER, to: edda }
  rewards: { meso: 90000, exp: 300000, bondPoints: 40, items: [{ itemId: 2000005, count: 20 }], worldFlags: [ruins.letter.carried] }

- id: edda-a-year-of-letters
  persona: edda
  title: "A Year of Letters"
  length: LONG
  requires: { level: { min: 140 }, questsCompleted: [edda-a-letter-east], flags: [camp.answers.found], notFlags: [ruins.letters.read] }
  steps:
    - { id: talk, type: TALK }
    - { id: kasper, type: TALK_TO, persona: kasper, say: ["the letters? here. all twelve. i kept them in my shirt so nothing'd eat them. tell her sorry. tell her i ran fast every time. it was the door that was slow."] }
    - { id: ama, type: TALK_TO, persona: ama, say: ["you're taking them west? at last. tell her to read the March one first. it's got the stew in it. and tell her the November one's mostly about her, so she's to read that one sitting down."] }
    - { id: read, type: DELIVER, to: edda }
  rewards: { meso: 160000, exp: 500000, bondPoints: 60, items: [{ itemId: 2050004, count: 10 }], worldFlags: [ruins.letters.read] }

