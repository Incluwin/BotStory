  title: "A Blanket of Furballs"
  length: SHORT
  requires: { level: { min: 68 } }
  steps:
    - { id: talk, type: TALK }
    - { id: rashes, type: KILL_MOBS, mobIds: [7130500], count: 30, mapIds: [240010000, 240010101] }
    - { id: furballs, type: COLLECT_ITEM, itemId: 4000226, count: 15 }
