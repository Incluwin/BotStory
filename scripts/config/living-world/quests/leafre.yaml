  length: SHORT
  requires: { level: { min: 72 }, questsCompleted: [arlo-beetle-horns] }
  steps:
    - { id: talk, type: TALK }
    - { id: mirelle, type: TALK_TO, persona: mirelle, say: ["a riding cap for Arlo? with flaps. ...tell him when he's taller. tell him i've already cut the felt, and that he's not to know that."] }
    - { id: report, type: DELIVER, to: arlo }
  rewards: { meso: 14000, exp: 16000, bondPoints: 35 }

