# Friendship quests (docs/LIVING_WORLD_GUIDE.md "Friendship"). One Resident per town offers four:
#   Lv 4  a piece of armour for the player's class (`pool`: one piece per job), scrolled by friendship
#         (living_world.FRIENDSHIP_SCROLL_TAKES_60/_10 at the moment it is handed over);
#   Lv 5  the lower tier of the Resident's own weapon: 7 x 100% scrolls, every one taken;
#   Lv 7  the mid tier: 7 x 60%, every one taken;
#   Lv 10 the final tier: 2 x 10% and 5 x 60%, every one taken.
# A weapon is `{ itemId, scrolls }`: the giver's own piece, made for its class, given whatever the player's class.
#
# Ids: pig 1210100 (leather 4000021), stiff feather 4003004, curse eye 3230100 (tail 4000013), zombie mushroom 2230101
# (charm of the undead 4000008), zombie lupin 4230101 (cursed doll 4000031), jr. wraith 3230101, wraith 4230102,
# ligator 3110100 (skin 4000032), drake skull 4000014, copper drake 4130100, drake 5130100, stone golem 5130101,
# dark stone golem 5130102 (rubble 4000025), lorang 3230102 (claw 4000043), clang 4230104 (claw 4000044),
# wild kargo 6230100 (eye 4000027), cold eye 4230100 (tail 4000023), tauromacis 7130100 (horn 4000028),
# orange mushroom 1210102, horny mushroom 2110200, wild boar 2230102, stirge 2300100, mano 2220000, stumpy 3220000,
# king clang 5220000.
# Maps: land of wild boar 101040001, excavation 101030101-3, deep forest hunting grounds 105040100/105040200, line 1/2
# 103000103/103000104/103000200, kerning subway 103000100/103000101/103000900, drake's meal table 105090300 / wild
# cargo's area 105090301, sanctuary entrance 105090500-105090800.
#
# Armour pools: gloves L15 (warrior, magician, bowman, thief, pirate), shoes L25, gloves L30, helmets L35, shoes L35,
# Gold Earrings L25, Red Napoleon L50.
# Weapons (lower / mid / final): Brannock 1h blunt Iron Mace L20 / War Hammer L30 / Jacker L40; Fenna bow Battle Bow
# L25 / Red Viper L35 / Olympus L50; Casse wand Ice Wand L23 / Wizard Wand L33 / Cromi L48; Vex dagger Cass L30 /
# Bazlud L40 / Sai L50; Garrick 1h sword Traus L40 / Jeweled Katar L50 / Neocora L60; Kettle knuckle Neozard L40 /
# Fury Claw L50 / Psycho Claw L60; Thane 1h axe Buck L50 / Hawkhead L60 / Mikhail L70.

