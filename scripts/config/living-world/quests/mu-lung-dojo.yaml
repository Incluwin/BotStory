    - { id: suyin, type: TALK_TO, persona: suyin, say: ["Lianhua sent you? hands up. ...no, higher. (a short, hard jab, which you catch) huh. tell her yes. tell her it's the only yes i've got. and tell her one of these days we're going to find out."] }
    - { id: belt, type: DELIVER, to: lianhua }
  rewards:
    meso: 130000
    exp: 130000
    bondPoints: 60
    gear:
      - { pool: [1132004], scrolls: [{ success: 10, count: 2 }, { success: 60 }] }
