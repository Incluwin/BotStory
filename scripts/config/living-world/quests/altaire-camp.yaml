- id: larkin-do-they-still-sing
  persona: larkin
  title: "Do They Still Sing?"
  length: MEDIUM
  requires: { level: { min: 40 } }
  steps:
    - { id: talk, type: TALK }
    - { id: thessaly, type: TALK_TO, persona: thessaly, say: ["do they still sing? ...every dusk, at the top of the tree. i've counted them for years. i lose count every time. tell whoever asked: they never stopped. not once."] }
    - { id: report, type: DELIVER, to: larkin }
  rewards: { meso: 10000, exp: 9000, bondPoints: 35 }

