# Altaire Camp quest lines (wave 4, docs/REGIONAL_RESIDENTS_PLAN.md section 10). Every id is from the server's own data:
# Ellin Forest mossy snail 4250000 (moss snail shell 4000436; mossy tree forest entrance 300010000, western region 1
# 300010100, eastern region 300030000), tree rod 4250001 (tree trunk 4000438; western regions 1-2 300010100/300010200,
# mossy tree forest trail 300010300), stone bug 5250001 (rubble 4000439; the trail, southern regions 1-2
# 300020000/300020100), mossy mushroom 5250000 (black mushroom spore 4000437; southern region 2, mushroom hill entrance
# 300020200), primitive boar 5250002 (tough leather 4000440; Boulder Mountain entrance 300010400). Ellin's glade is the
# deep fairy forest 300030100. One Victoria errand: Larkin asks Thessaly in Ellinia (personas/ellinia.yaml).
# Gear: Rosalind's earrings Moonstar 1032044 L45 / Altair 1032060 L50 / Glittering Altaire 1032061 L50; Maelis's capes
# Icarus Cape (1) 1102054 / (2) 1102055 / (3) 1102056, all L42.

# ---- Ottavia, cartographer of the expedition: her arc ----------------------------------------------------------------

- id: ottavia-the-walking-trees
  persona: ottavia
  title: "Trees That Walk"
  length: SHORT
  requires: { level: { min: 44 } }
  steps:
    - { id: talk, type: TALK }
    - { id: rods, type: KILL_MOBS, mobIds: [4250001], count: 30, mapIds: [300010100, 300010200, 300010300] }
    - { id: west, type: VISIT_MAP, mapIds: [300010400] }
    - { id: report, type: DELIVER, to: ottavia }
  rewards: { meso: 13000, exp: 14000, bondPoints: 40 }
  onComplete: { arcAdvance: { arc: ottavia-the-map-of-the-forest, to: chapter-2 } }

- id: ottavia-the-haze-line
  persona: ottavia
  title: "Drawn in Pencil"
  length: SHORT
  requires: { level: { min: 52 }, questsCompleted: [ottavia-the-walking-trees] }
  steps:
    - { id: talk, type: TALK }
    - { id: mushrooms, type: KILL_MOBS, mobIds: [5250000], count: 25, mapIds: [300020100, 300020200] }
    - { id: teodor, type: TALK_TO, persona: teodor, say: ["the haze line? this morning it stood at the foot of the mushroom hill, three paces further than yesterday. tell her to draw it in pencil. it'll move again by tonight."] }
    - { id: report, type: DELIVER, to: ottavia }
  rewards: { meso: 15000, exp: 16000, bondPoints: 40 }
  onComplete: { arcAdvance: { arc: ottavia-the-map-of-the-forest, to: chapter-3 } }

- id: ottavia-a-name-on-the-map
  persona: ottavia
  title: "A Name Across the Top"
  length: SHORT
  requires: { level: { min: 52 }, flags: [altaire.heard-haze], notFlags: [altaire.forest.named], questsCompleted: [ottavia-the-haze-line] }
  steps:
    - { id: talk, type: TALK }
    - { id: glade, type: VISIT_MAP, mapIds: [300030100] }
    - { id: larkin, type: TALK_TO, persona: larkin, say: ["you stood in the glade? then the leaves told you, even if you didn't catch it. Ellin's. the forest is Ellin's. it's been Ellin's since before there were trees to say it. tell Ottavia to write it big, across the top."] }
    - { id: report, type: DELIVER, to: ottavia }
  rewards: { meso: 20000, exp: 22000, bondPoints: 60, items: [{ itemId: 2050000, count: 10 }], worldFlags: [altaire.forest.named] }

- id: ottavia-green-ink
  persona: ottavia
  title: "Green That Doesn't Fade"
  length: SHORT
  repeatable: true
  requires: { level: { min: 40 }, questsCompleted: [ottavia-the-walking-trees] }
  steps:
    - { id: talk, type: TALK }
    - { id: shells, type: COLLECT_ITEM, itemId: 4000436, count: 15 }
    - { id: ink, type: DELIVER, to: ottavia, take: { itemId: 4000436, count: 15 } }
  rewards: { meso: 9000, exp: 8000, bondPoints: 10 }

