# Maple Island quests (wave 4), levels 1-10, two per Resident. Fields: Dangerous Forest 50000 (snail 100100 snail shell
# 4000019), the last field before Amherst; Entrance to Adventurer Training Center 1010000 (blue snail 100101 blue snail
# shell 4000000, shroom 120100 mushroom spore 4000011, orange mushroom 1210102 orange mushroom cap 4000001), out
# Amherst's east gate; the Split Road of Destiny 1020000 (the five job instructors). Kill steps also list the island's
# other fields for the same monster (Snail Hunting Ground II/III 40001/40002, Snail Garden 1000004, Tomato Field
# 1020001, Hunting Ground Middle of the Forest II 1000006, the Field West of Southperry 50001, and Mai's Adventurer
# Training Center 4 1010400 with its own orange mushroom 9500102), but on this server those fields have no portal in
# from the road, and the training center opens only during Mai's own quests, so every step can be done from 50000 and
# 1010000. The road from Mushroom Town (10000 -> 20000 -> 30000 -> 40000 -> 50000 -> Amherst) has no way back, so the
# Mushroom Town quests end away from their givers (a kill, a map or a word with an Amherst Resident; the giver's closing
# line is a note, a cabbage leaf or a spell). The ship from Southperry is one way too: Marta's leaving list ends at
# Olwen in Lith Harbor, and no quest needs the player back on the island.

# ---- Mushroom Town (level 1: both offered at once, neither needs the giver again) ----
- id: tilly-a-friend-in-amherst
  persona: tilly
  title: "A Friend in Amherst"
  length: SHORT
  requires: { level: { min: 1 } }
  steps:
    - { id: talk, type: TALK }
    - { id: bettina, type: TALK_TO, persona: bettina, say: ["Tilly sent you? then you're expected. she sends me every new face on the island and every one arrives smiling. here, a roll, still warm. welcome to Amherst, love. go and say hello to Lucas, our chief. he likes to know who's come."] }
  rewards: { meso: 100, exp: 15, bondPoints: 15, items: [{ itemId: 2000000, count: 5 }] }

