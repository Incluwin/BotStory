# ---- Southperry ----
- id: marta-pencil-names
  persona: marta
  title: "A Name in Pencil"
  length: SHORT
  requires: { level: { min: 6 } }
  steps:
    - { id: talk, type: TALK }
    - { id: elodie, type: TALK_TO, persona: elodie, say: ["Marta sent you? she keeps my name in pencil. ...i'm not scared of the sea. i'm scared of the other side. nobody comes back to tell you it's all right. you're going, aren't you? you'll be fine. you walked the whole road on your own."] }
    - { id: report, type: DELIVER, to: marta }
  rewards: { meso: 600, exp: 150, bondPoints: 25, items: [{ itemId: 2000000, count: 10 }] }

# The island's one Victoria tie: it ends at Olwen, since the ship never brings anyone back (QuestLedger completes a quest
# on its last step wherever that step happens, with the rewards and Marta's closing line).
- id: marta-the-leaving-list
  persona: marta
  title: "The Leaving List"
  length: MEDIUM
  requires: { level: { min: 8 } }
  steps:
    - { id: talk, type: TALK }
    - { id: level, type: REACH_LEVEL, level: 10 }
    - { id: olwen, type: TALK_TO, persona: olwen, say: ["Marta's list. ...there. your name, in ink, in her hand. ticked. one more off the boat, none back into the sea. welcome to Victoria Island. mind the ropes."] }
  rewards: { meso: 2000, exp: 500, bondPoints: 40, items: [{ itemId: 2000000, count: 20 }, { itemId: 2000003, count: 10 }] }

