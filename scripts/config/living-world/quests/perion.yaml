# Perion quest lines. Wild boar 2230102 (tooth 4000020), fire boar 3210100 (tooth 4000024),
# stone golem 5130101 (rubble 4000022), copper drake 4130100, drake 5130100 (skull 4000014),
# badge: leather strap 4000021 with a quest label, custom 15% drop from wild boars while the step is active. Maps: west domain 102030000, land of wild boar 101040001,
# excavation I 101030101.
- id: garrick-lost-badge
  persona: garrick
  title: "The Lost Badge"
  length: SHORT
  requires: { level: { min: 20 } }
  steps:
    - { id: talk, type: TALK }
    - { id: badge, type: COLLECT_ITEM, itemId: 4000021, count: 1, label: "Garrick's unit badge", dropFrom: { mobIds: [2230102], chance: 0.15 } }
    - { id: return, type: DELIVER, to: garrick, take: { itemId: 4000021, count: 1 } }
  rewards: { meso: 8000, exp: 1200, bondPoints: 25, items: [{ itemId: 2000002, count: 20 }], flags: [garrick.badge.returned] }
  onComplete: { arcAdvance: { arc: garrick-redemption, to: chapter-2 } }

- id: garrick-boar-cull
  persona: garrick
  title: "The Boar Cull"
  length: MEDIUM
  requires: { level: { min: 26 }, flags: [garrick.badge.returned] }
  steps:
    - { id: talk, type: TALK }
    - { id: boars, type: HUNT_WITH, persona: garrick, mobIds: [3210100], count: 40 }
    - { id: report, type: DELIVER, to: garrick, say: ["forty. we still count."] }
  rewards: { meso: 12000, exp: 6000, bondPoints: 40, flags: [garrick.cull.done] }

