# Aquarium quests (wave 3). The Aqua Road fields are swim maps (players swim; Residents stay indoors): Ocean I.C
# 230010000 and the penguin's playground 230010001 (scuba pepe 3210450 snorkle 4000153, jr. seal 3230405 toy baby seal
# 4000154, poopa 4230200 egg 4000158), crystal gorge 230010100 (jr. seal), red coral forest 230010200 (freezer 4230124
# seal skin 4000155), turban shell hill 230010300 and the west sea fork 230010400 (sparker 4230123), the East Sea fork
# 230020000 and the seaweed tower 230020100 (mask fish 3230104 hard needle 4000167, krip 3000006 shrimp meat 4000166),
# the hidden town 230020101 and sand castle playground 230020200 (flower fish 2230200 petal 4000165), big fish valley
# 230020300 (bubble fish 2230109 thoughts 4000164), the blue seaweed road 230030000-230030100 (seacle 2230105, cico
# 2230106). The deep: deep sea gorge 230040000/230040100 (bombing fish house 8140555, bone fish 8140600 lime powder
# bottle 4000182), dangerous sea gorge 230040200/230040300 (squid 8141300 ink bottle 4000183, risell squid 8142100
# butter-toasted squid 4000184), the Grave of a Wrecked Ship 230040400 (shark 8150100 denture 4000180, cold shark
# 8150101 frozen fin 4000181), the cave of Pianus 230040420 (8510000, 8520000; miniature Pianus 4000175).

