# 104040001/104040002; Stirge 2300100 (Stirge Wing 4000042) on the Kerning City Subway Transfer Area 103000102 and Line 1
# <Area 2> 103000103; Zombie Mushroom 2230101 (Charm of the Undead 4000008) on Ant Tunnel I-II 105050000/105050100;
# Ligator 3110100 (Ligator Skin 4000032) on the Swamp of Despair I-III 107000000-107000200; Jr. Wraith 3230101
# (Tablecloth 4000035) on Line 1 <Area 2-3> 103000103/103000104 and Line 2 <Area 1-2> 103000200/103000201; Lupin
# 3210800 (Lupin Doll 4000026) on Monkey Forest I-II 100040101/100040103; Drake 5130100 (Drake Skull 4000014) on the
# Drake Hunting Ground 105080000 and the Tunnel That Lost Light I-II 105090000/105090100; Shade 5090000 (Someone's Hat
# 4000413) on Line 1 <Area 4> 103000105 and Line 2 <Area 3> 103000202.

