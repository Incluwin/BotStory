- id: lioren-the-sealed-shelf
  persona: lioren
  title: "The Sealed Shelf"
  length: LONG
  requires: { level: { min: 28 }, flags: [lioren.ashes.read, wren.doll.found] }
  steps:
    - { id: talk, type: TALK }
    - { id: wren, type: TALK_TO, persona: wren, say: ["Lioren wants the shelf open. fine. take Casse. she should see what's inside before she decides who to become."] }
    - { id: casse, type: TALK_TO, persona: casse, say: ["the shelf? Wren said yes?! okay okay. tell Lioren i'm coming. i've always wanted to see it."] }
    - { id: guard, type: KILL_MOBS, mobIds: [4230101], count: 20 }
    - { id: report, type: DELIVER, to: lioren, say: ["burn the seal. now. before Wren changes her mind."] }
  rewards: { meso: 15000, exp: 9000, bondPoints: 50, flags: [lioren.shelf.open], worldFlags: [ellinia.shelf.open] }

