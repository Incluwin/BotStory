# Ellinia quest lines. Green mushroom 1110100 (spore 4000011), slime 210100 (bubble 4000010),
# lupin 3210800 (doll 4000026, banana 4000029), zombie lupin 4230101, zombie mushroom 2230101,
# horny mushroom 2110200 (cap 4000015), dark stump 1110101, stirge 2300100 (wing 4000042),
# fairy wing 4003003, sap of ancient tree 2012002. Maps: station 101000300, tree I 101010100.
- id: wren-shelf-of-spores
  persona: wren
  title: "Ink from Spores"
  length: SHORT
  requires: { level: { min: 10 } }
  steps:
    - { id: talk, type: TALK }
    - { id: spores, type: COLLECT_ITEM, itemId: 4000011, count: 20 }
    - { id: return, type: DELIVER, to: wren, take: { itemId: 4000011, count: 20 } }
  rewards: { meso: 2500, exp: 900, bondPoints: 20, flags: [wren.ink.done] }

- id: wren-the-missing-volume
