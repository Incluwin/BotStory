# Mu Lung quest lines (docs/REGIONAL_RESIDENTS_PLAN.md). Every id is from the server's own data:
# Sky Forest chipmunk 4230500, red porky 4230501 (thimble 4000277; entrance 250010000, the train 250010100), black porky
# 4230502 (needle pouch 4000278; 250010100, deep 250010200), blue flower serpent 4230503 (snake leather 4000281) and red
# flower serpent 4230504 (necki flower 4000279) in the snake area 250010300 and where the sky forest ends 250010400.
# Wild bear areas: grizzly 5120500 (yellow belt 4000284; 250010301, 250010302). Peach farms 1-3 250010500/250010600/
# 250010700: reindeer 5120505 (broken deer horn 4000288), peach monkey 6130207 (peach seed 4000282). Foggy forest
# 250010501 and virtuous forest 250010502: the book ghost 5120506 (old paper 4000298); sage cat 6130209 (cat doll
# 4000289; 250010502, goblin forests 250010503/250010504). Practice fields: straw target dummy 5120503 (straw doll
# 4000286; 250020000, 250020100), wooden target dummy 5120504 (wooden doll 4000287; 250020100-250020300).
# Off Mu Lung: Herb Town kru 6130208 (mark of the pirate 4000296; red-nose pirate dens 251010401/251010402); Leafre rash
# 7130500 (anesthetic powder 4000228; 240010000, 240010101), dark rash 7130501 (curse powder 4000230; 240010100,
# 240010101), blue kentaurus 8140103 (marrow 4000233; 240020300-240020500), blue wyvern 8150301 (gill 4000269; canyon
# crossroad 240040100, blue wyvern's nest 240040210, wyvern canyon 240040400), dark cornian 8150201 (skull shoulder pad
# 4000267; 240030101, 240030102, hidden dragon tomb II 240030104); Aqua Road bone fish 8140600 (lime powder bottle
# 4000182; deep sea gorge I/II 230040000/230040100).
# Gear: Baojun's polearms Skylar 1442010 L60 / The Gold Dragon 1442008 L70 / Eclipse 1442019 L80; Suyin's knuckles Beia
# Crash 1482009 L70 / Steelno 1482010 L80 / White Fangz 1482011 L90. Fengzi's gloves for the player's class (warrior,
# magician, bowman, thief, pirate) L90 / L100 / L110.

# ---- Meiwen, teacher of the forms: her arc --------------------------------------------------------------------------

- id: meiwen-the-first-pages
  persona: meiwen
  title: "The First Pages"
  length: SHORT
  requires: { level: { min: 55 } }
  steps:
    - { id: talk, type: TALK }
    - { id: ghosts, type: KILL_MOBS, mobIds: [5120506], count: 30, mapIds: [250010501, 250010502] }
    - { id: pages, type: COLLECT_ITEM, itemId: 4000298, count: 15 }
    - { id: forms, type: DELIVER, to: meiwen, take: { itemId: 4000298, count: 15 } }
  rewards: { meso: 20000, exp: 24000, bondPoints: 40 }
  onComplete: { arcAdvance: { arc: meiwen-the-book-of-forms, to: chapter-2 } }

- id: meiwen-the-library-card
  persona: meiwen
  title: "The Library Card"
  length: MEDIUM
  requires: { level: { min: 62 }, questsCompleted: [meiwen-the-first-pages] }
  steps:
    - { id: talk, type: TALK }
    - { id: cats, type: KILL_MOBS, mobIds: [6130209], count: 30, mapIds: [250010502, 250010503, 250010504] }
    - { id: qing, type: TALK_TO, persona: qing, say: ["the seventh form? here's the card. borrowed thirty years ago. 'Oksun, Herb Town. to wrap a root marker. will return.' ...she never did. tell Meiwen it wasn't lost. tell her gently."] }
    - { id: report, type: DELIVER, to: meiwen }
  rewards: { meso: 30000, exp: 40000, bondPoints: 45, worldFlags: [mu-lung.page.traced] }

- id: meiwen-the-seventh-form
  persona: meiwen
  title: "The Seventh Form"
  length: MEDIUM
  requires: { level: { min: 62 }, flags: [mu-lung.heard-page, herb-town.root.dug], questsCompleted: [meiwen-the-library-card] }
  steps:
    - { id: talk, type: TALK }
    - { id: oksun, type: TALK_TO, persona: oksun, say: ["the paper round my mother's marker? here. i borrowed it thirty years ago. i meant to bring it back the next spring. i'm sorry it took thirty springs. tell her the root's out of the ground. tell her the page kept it company."] }
    - { id: page, type: DELIVER, to: meiwen }
  rewards: { meso: 40000, exp: 50000, bondPoints: 60, items: [{ itemId: 2022001, count: 20 }], worldFlags: [mu-lung.forms.whole] }

- id: meiwen-paper-for-the-binding
  persona: meiwen
  title: "Paper for the Binding"
  length: SHORT
  repeatable: true
  requires: { level: { min: 55 }, questsCompleted: [meiwen-the-first-pages] }
  steps:
    - { id: talk, type: TALK }
    - { id: paper, type: COLLECT_ITEM, itemId: 4000298, count: 15 }
    - { id: binding, type: DELIVER, to: meiwen, take: { itemId: 4000298, count: 15 } }
  rewards: { meso: 12000, exp: 12000, bondPoints: 10 }

