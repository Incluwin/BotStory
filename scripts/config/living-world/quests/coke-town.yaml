# Coke Town quests (Repack Residents, docs/REPACK_RESIDENTS_PLAN.md section 3.1). Coke Town 219000000 (the Empty House
# 219000004 at the top of the hill) opens on the Coke Ski Camp through its lower west gate and on Coke Valley through the
# east end of its middle street. The Ski Camp runs 219010000 -> 219010100 -> 219010200 -> 219010300, each with a side
# slope (219010001, 219010101, 219010201): Coke Snail 9500144 lv10 (219010000), Coke Slime 9500151 lv15 (219010000/001),
# Coke Mushroom 9500152 lv20 (219010001/100), Coketump 9500153 lv25 (219010100/101/200/300), Coketump Lite 9500154 lv30
# (219010101/300), Coke Pig 9500143 lv35 (219010200/201). Coke Valley runs I 219020000 (Small Alley 219020001 off it)
# -> II 219020100 -> III 219020200 -> IV 219020300 (the valley's turn) -> the Forest of Coke Golem 219020301: Coke Seal
# 9500145 lv38 (219020000/001/100), Play Seal 9500146 lv42 (219020000/001), Igloo Turtle 9500148 lv45 (219020100/200),
# Coke Golem 9500149 lv50 (219020200), Yeti and Coketump 9500147 lv70 (219020300), Ice Golem 9500150 lv60 (219020301).
# The forest's only door is at the far end of Coke Valley IV (x=3310), past its twelve Yetis, so every quest with a
# forest step starts at L62.
# Etc drops (db/extensions/2026-11-08-coke-town-drops.xml, 60%): Coke Bottle Lid 4000221 (snail, slime), Coca-Cola Can
# 4000216 (mushroom, Coketump), Coca-Cola Light Can 4000217 (Coketump Lite), Coca-Cola Card 4000213 (pig), CokePLAY Cube
# 4000212 (both seals), Coke Ice Block 4000219 (Igloo Turtle, Ice Golem), Coca-Cola Cube 4000211 (Coke Golem), Coca-Cola
# Gem 4000214 (Yeti and Coketump). Gear: Inga's hats for the player's class L35 / L40 / L50; Aksel's capes Green
# Napoleon 1102000 L50 / Blue Magic Cape 1102015 L60 / Blue Gaia Cape 1102021 L65; Ylva's earrings Black Emerald
# 1032027 L50 / Crystal Flower 1032019 L55 / Pink-Flowered 1032014 L60.

# ---- Marit: the Empty House (arcs/coke-town.yaml) ----
- id: marit-the-weekly-sweep
  persona: marit
  title: "The Weekly Sweep"
  length: SHORT
  requires: { level: { min: 15 } }
  steps:
    - { id: talk, type: TALK }
    - { id: shutters, type: VISIT_MAP, mapIds: [219000004] }
    - { id: snails, type: KILL_MOBS, mobIds: [9500144, 9500151], count: 25, mapIds: [219010000, 219010001] }
    - { id: key, type: DELIVER, to: marit }
  rewards: { meso: 2500, exp: 2200, bondPoints: 30, items: [{ itemId: 2000001, count: 15 }] }

- id: marit-the-last-lamp
  persona: marit
  title: "The Clearest Ice"
  length: MEDIUM
  requires: { level: { min: 62 }, questsCompleted: [marit-the-weekly-sweep], flags: [coke.sled.found] }
  steps:
    - { id: talk, type: TALK }
    - { id: ylva, type: TALK_TO, persona: ylva, say: ["Ebbe? ...yes. eleven winters back, in the big storm, a man came up past my turn with a sled full of lamps, all wrapped. i told him to turn back. he laughed. he said his sister teased him that the lamp-maker's house was the dark one, so this year he'd cut the clearest lamp in the valley for his own window. for once. he went on up to the forest. i counted him up. i never counted him down. ...take her the ice. it's what he went up for."] }
    - { id: golems, type: KILL_MOBS, mobIds: [9500150], count: 20, mapIds: [219020301] }
    - { id: ice, type: COLLECT_ITEM, itemId: 4000219, count: 10 }
    - { id: lamp, type: DELIVER, to: marit, take: { itemId: 4000219, count: 10 } }
  rewards: { meso: 30000, exp: 34000, bondPoints: 45, items: [{ itemId: 2000004, count: 10 }], worldFlags: [coke.lamp.cut] }

- id: marit-the-house-lit
  persona: marit
  title: "The House Lit"
  length: MEDIUM
  requires: { level: { min: 62 }, questsCompleted: [marit-the-last-lamp], flags: [coke.lamp.cut], notFlags: [coke.house.lit] }
  steps:
    - { id: talk, type: TALK }
    - { id: inga, type: TALK_TO, persona: inga, say: ["the lamp? for Ebbe's window? oh, i knew it. i've had this ready eleven winters. here. a cosy for the walk up, so it doesn't crack in the cold. red, with a button off a can. don't tell Bartolo."] }
    - { id: toivo, type: TALK_TO, persona: toivo, say: ["Marit's lamp? give it here. ...no. you carry it. i'll walk beside you. both hands, knees bent, and don't look at the lamp, look at the step. that's how Ebbe taught me, every year. go on. i'm right here."] }
    - { id: window, type: VISIT_MAP, mapIds: [219000004] }
    - { id: lit, type: DELIVER, to: marit }
  rewards: { meso: 40000, exp: 46000, bondPoints: 60, items: [{ itemId: 2000005, count: 5 }], worldFlags: [coke.house.lit] }

