# ---- Eira: the day they left (arcs/rien.yaml) ----
- id: eira-the-hearth-shawl
  persona: eira
  title: "Grandmother's Shawl"
  length: SHORT
  requires: { level: { min: 5 } }
  steps:
    - { id: talk, type: TALK }
    - { id: fur, type: COLLECT_ITEM, itemId: 4000495, count: 12 }
    - { id: darned, type: DELIVER, to: eira, take: { itemId: 4000495, count: 12 } }
  rewards: { meso: 2000, exp: 600, bondPoints: 30, items: [{ itemId: 2000001, count: 15 }] }

- id: eira-the-copy-from-ereve
  persona: eira
  title: "What the Book Says"
  length: MEDIUM
  requires: { level: { min: 10 }, questsCompleted: [eira-the-hearth-shawl], flags: [ereve.record.searched], notFlags: [rien.copy.read] }
  steps:
    - { id: talk, type: TALK }
    - { id: isaura, type: TALK_TO, persona: isaura, say: ["somebody in Rien wants to hear the record? here's a fair copy, to the last line: 'and the fifth slept in the ice of Snow Island, and the others...' and then the leaf is blank. tell her i'd give the whole shelf for one line of what she knows."] }
    - { id: read, type: DELIVER, to: eira }
  rewards: { meso: 5000, exp: 2500, bondPoints: 50, items: [{ itemId: 2000002, count: 20 }], worldFlags: [rien.copy.read] }

- id: eira-on-rien-shelf
  persona: eira
  title: "On Rien's Shelf"
  length: MEDIUM
  requires: { level: { min: 12 }, questsCompleted: [eira-the-hearth-shawl], flags: [ereve.page.written], notFlags: [rien.book.shelved] }
  steps:
    - { id: talk, type: TALK }
    - { id: isaura, type: TALK_TO, persona: isaura, say: ["the copy for Rien. bound in blue, like the thread in the fifth emblem. tell Eira i didn't change a word. not one. i wanted to fix a comma. i didn't."] }
    - { id: shelf, type: VISIT_MAP, mapIds: [140000010] }
    - { id: home, type: DELIVER, to: eira }
  rewards: { meso: 8000, exp: 4000, bondPoints: 60, items: [{ itemId: 2022001, count: 10 }], worldFlags: [rien.book.shelved] }

