# Henesys quest lines. Pig 1210100, ribbon pig 1210101, orange mushroom 1210102 (cap 4000001),
# green mushroom 1110100 (cap 4000012), slime 210100 (bubble 4000010), wild boar 2230102 (tooth 4000020),
# octopus 1120100 (leg 4000006), evil eye 2230100 (tail 4000007), curse eye 3230100 (tail 4000013),
# stone golem 5130101 (rubble 4000022), mushmom 6130101, snails 100100/100101/130101.
# Maps: pig beach 104010001, hunting ground I 104040000, henesys market 100000100, land of wild boar 101040001.
- id: fenna-pig-problem
  persona: fenna
  title: "The Pig Problem"
  length: SHORT
  requires: { level: { min: 10 } }
  steps:
    - { id: talk, type: TALK }
    - { id: pigs, type: KILL_MOBS, mobIds: [1210100], count: 20 }
    - { id: ribbons, type: KILL_MOBS, mobIds: [1210101], count: 10 }
    - { id: report, type: DELIVER, to: fenna }
  rewards: { meso: 3000, exp: 1200, bondPoints: 25, flags: [fenna.pigs.done] }

