# sparkplug 4032023, diferium fuel cell 4032022; i.am.robot 9400546 jumper cable 4032024, mountain slopes 600010400;
# mighty maple eater 9400548; gryphon 9400544, cliffs 600010500 / highlands 600010600). MesoGears: lobby 600020000,
# deity room 600020100 (killa bee 9400540, fire tusk 9400542), soul corridor 600020200, wolf spider cavern 600020300
# (wolf spider 9400545, adapter 60%), fire chamber 600020400 (firebomb 5100002 flame 4000081), ice chamber 600020500
# (jr. yeti 5100000 skin 4000048, soft feather 4003005). Haunted House 682000000 by the NLC Taxi: foyer 682000100
# (glutton ghoul 9400556 coat hanger 4032027 / wad of gum 4032028 / duct tape 4032029, psycho jack box 9400557,
# sophilia doll ground 9400559), hallway 682000300, rooms 682000301-682000305 (psycho jack 9400558 loaded spring
# 4000399, mirror ghost 9400564), bedrooms 682000501/682000502 (voodoo 9400561, hoodoo 9400562), pumpkin vault
# 682000700, library 682000800 (twisted jester 9400640, rotting skeleton 9400638), clown's chimney 682010203.
# Phantom Forest 610010000-610010202 (jr. wraith 3230101 tablecloth 4000035, leprechaun 9400584, phantom tree 9400588
# seed 4032003 / firewood 4000018, windraider 9400576 badge 4032007, elderwraith 9400580 ashes 4032010 / rags 4032011,
# headless horseman 9400549 jack o'lantern 4031903, bigfoot 9400575 toe 4032013). Crimsonwood Mountain 610020002-
# 610020012 (stormbreaker 9400581 badge 4032006, crimson tree 9400586 wood 4032004, firebrand 9400577, nightshadow
# 9400579 badge 4032009, typhon 9400574 feather 4032005, crimson guardian 9400582 heart 4032012 at the Keep 610020006).

# ---- Monty: the Leaf Cup (arcs/new-leaf-city.yaml) ----
- id: monty-the-empty-prize-table
  persona: monty
  title: "The Empty Prize Table"
  length: MEDIUM
  requires: { level: { min: 22 } }
  steps:
    - { id: talk, type: TALK }
    - { id: ask, type: TALK_TO, persona: fergus, say: ["forge prizes for Monty's club? ...no. ...fine. if he brings me the drawings. Barricade's and Foxwit's. tell him i said no first."] }
    - { id: ghouls, type: KILL_MOBS, mobIds: [9400556], count: 20, mapIds: [682000100, 682000300] }
    - { id: hangers, type: COLLECT_ITEM, itemId: 4032027, count: 10 }
    - { id: banner, type: DELIVER, to: monty, take: { itemId: 4032027, count: 10 } }
  rewards: { meso: 9000, exp: 8000, bondPoints: 40, items: [{ itemId: 4031755, count: 1 }, { itemId: 4031756, count: 1 }], worldFlags: [nlc.prizes.promised] }

- id: monty-the-blueprints
  persona: monty
  title: "Barricade's Drawings"
  length: LONG
  requires: { level: { min: 30 }, questsCompleted: [monty-the-empty-prize-table], flags: [nlc.prizes.promised] }
  steps:
    - { id: talk, type: TALK }
    - { id: foxwit, type: TALK_TO, persona: theodora, say: ["the Professor's drawings for the club? he says it's good for drawings to be loved. here, the shield. the cape's still out in that house, i'll have it back one day. the cloak's pattern i gave to Hollis years ago. take these to Monty. he'll get them to Fergus, not to Delphine."] }
    - { id: barricade, type: TALK_TO, persona: ezra, say: ["Barricade's notes. i've kept them twenty years. ...for Monty's club. for a table with something on it. take them. don't tell him i went soft."] }
    - { id: bees, type: KILL_MOBS, mobIds: [9400540], count: 30, mapIds: [600020100, 600020200] }
    - { id: home, type: DELIVER, to: monty }
  rewards: { meso: 16000, exp: 15000, bondPoints: 50, items: [{ itemId: 4031757, count: 1 }, { itemId: 4031758, count: 1 }], worldFlags: [nlc.blueprints.found] }

- id: monty-cup-night
  persona: monty
  title: "Cup Night"
  length: SHORT
  requires: { level: { min: 30 }, questsCompleted: [monty-the-blueprints], flags: [nlc.blueprints.found], notFlags: [nlc.cup.held] }
  steps:
    - { id: talk, type: TALK }
    - { id: benji, type: TALK_TO, persona: benji, say: ["i'm in? I'M IN? i've had my deck in my pocket for a week! tell Monty i'm coming! i'm coming now!"] }
    - { id: ramona, type: TALK_TO, persona: ramona, say: ["the Leaf Cup? tonight? i'll bring the camera. 'Club Has Prizes'. finally a headline i like."] }
    - { id: deal, type: DELIVER, to: monty }
  rewards: { meso: 20000, exp: 20000, bondPoints: 60, items: [{ itemId: 2022305, count: 5 }], worldFlags: [nlc.cup.held] }

# ---- Ramona ----
- id: ramona-the-front-page
  persona: ramona
  title: "The Front Page"
  length: SHORT
  requires: { level: { min: 18 } }
  steps:
    - { id: talk, type: TALK }
    - { id: priya, type: TALK_TO, persona: priya, say: ["i couldn't possibly say. ...the Mayor wants a subway line out to the jungle. you didn't hear it from me. you didn't."] }
    - { id: mabel, type: TALK_TO, persona: mabel, say: ["news? forty years ago Barricade's cook boiled a boot because we'd run out of everything else. it wasn't bad. put that in her paper."] }
    - { id: story, type: DELIVER, to: ramona }
  rewards: { meso: 5000, exp: 4000, bondPoints: 30 }

- id: ramona-the-ghost-ship-story
  persona: ramona
  title: "The Ship That Waits"
  length: LONG
  requires: { level: { min: 55 }, friendship: 4, questsCompleted: [ramona-the-front-page] }
  steps:
    - { id: talk, type: TALK }
    - { id: rosnah, type: TALK_TO, persona: rosnah, say: ["a reporter from New Leaf City. ...my Halim sailed on that ship before it was a ghost. tell her he was kind. tell her the lanterns are still lit for them. that's all i'll say. it's enough."] }
    - { id: ship, type: VISIT_MAP, mapIds: [541010000] }
    - { id: copy, type: DELIVER, to: ramona }
  rewards: { meso: 40000, exp: 45000, bondPoints: 45 }

