# Kerning Square quests (wave 4). Fields: 1st/2nd floor 103040100-103040103 (cherry bubble tea 3400000 cherry bubble
# 4000539 20% on 103040100/101/103, mango bubble tea 3400001 mango bubble 4000541 60% on 103040101-103, melon bubble tea
# 3400002 melon bubble 4000540 20% on 103040102); 3rd/4th floor 103040200-103040203, kill only (yeti doll claw game
# 3400003 on 103040200, jr. pepe doll claw game 3400005 on 103040201, transformed doll claw game 3400007 on
# 103040202/203, blue/yellow/pink perfume 4300000/4300002/4300004); 5th/6th floor 103040300-103040303 (kid mannequin
# 4300006 bunny suit 4000525 on 103040300/301/303, female mannequin 4300007 wig 4000526 on 103040301/302, male mannequin
# 4300008 fedora 4000527 40% on 103040302/303); 7th/8th floor area A 103040400 (latest hits compilation 4300009 record
# 4000528, greatest oldies 4300010 record 4000529, also in the area B/C rooms 103040410-103040429). Spirit of Rock
# 4300013 is a boss (250,000 HP, one per room): the area D rooms 103040430-103040439 and the VIP area C rooms
# 103040460-103040469 are the RockSpirit event's copies, opened by June only while Blake's quests 2286-2288 run, so no
# quest here needs it: Bao's sign is behind the records of the open area A. The recruits give armour made for the
# player's class: Zara tops L35 / L40 / L50 (nothing exists at L41-47); Felix, whose intro is L44, bottoms L40 / L50 /
# L60 (an overall where the class has none: magicians L38 / L48 / L58; pirates the same L40 and L50 overalls as Zara,
# the only ones v83 has, and the Black Royal Barone at L60).

# ---- Bao: the night market (arcs/kerning-square.yaml) ----
- id: bao-the-noodle-cart
  persona: bao
  title: "Sauce for the Cart"
  length: SHORT
  requires: { level: { min: 35 } }
  steps:
    - { id: talk, type: TALK }
    - { id: teas, type: KILL_MOBS, mobIds: [3400001], count: 25, mapIds: [103040101, 103040102, 103040103] }
    - { id: bubbles, type: COLLECT_ITEM, itemId: 4000541, count: 10 }
    - { id: sauce, type: DELIVER, to: bao, take: { itemId: 4000541, count: 10 } }
  rewards: { meso: 6000, exp: 7000, bondPoints: 30, items: [{ itemId: 2020011, count: 5 }] }

- id: bao-the-old-sign
  persona: bao
  title: "The Old Sign"
  length: MEDIUM
  requires: { level: { min: 46 }, questsCompleted: [bao-the-noodle-cart] }
  steps:
    - { id: talk, type: TALK }
    - { id: hall, type: VISIT_MAP, mapIds: [103040400] }
    - { id: records, type: KILL_MOBS, mobIds: [4300009, 4300010], count: 30, mapIds: [103040400] }
    - { id: seen, type: DELIVER, to: bao }
  rewards: { meso: 18000, exp: 25000, bondPoints: 40, items: [{ itemId: 2000004, count: 10 }], worldFlags: [ksq.sign.found] }

- id: bao-the-poured-floor
  persona: bao
  title: "The Poured Floor"
  length: MEDIUM
  requires: { level: { min: 46 }, questsCompleted: [bao-the-old-sign], notFlags: [ksq.bell.found] }
  steps:
    - { id: talk, type: TALK }
    - { id: sadie, type: TALK_TO, persona: sadie, say: ["the noodle lady sent you? Bao. she stood in my wet concrete and shouted at my crew for a week. she was right. i pulled the market bell off its pole before the pour. it's been in my site hut nineteen years, under a tarp. here. tell her the floor's still level. i check."] }
    - { id: bell, type: DELIVER, to: bao }
  rewards: { meso: 20000, exp: 22000, bondPoints: 50, items: [{ itemId: 2000005, count: 5 }], worldFlags: [ksq.bell.found] }

- id: bao-the-lobby-corner
  persona: bao
  title: "Market Night"
  length: MEDIUM
  requires: { level: { min: 46 }, questsCompleted: [bao-the-old-sign], flags: [ksq.bell.found, ksq.heard-cart], notFlags: [ksq.market.back] }
  steps:
    - { id: talk, type: TALK }
    - { id: teas, type: KILL_MOBS, mobIds: [3400000], count: 20, mapIds: [103040100, 103040101, 103040103] }
    - { id: cherries, type: COLLECT_ITEM, itemId: 4000539, count: 10 }
    - { id: kiko, type: TALK_TO, persona: kiko, say: ["the bell? for me? grandma said i could ring it? ...okay. okay. dusk. i'll ring it at dusk. i've practised on a spoon my whole life."] }
    - { id: market, type: DELIVER, to: bao, take: { itemId: 4000539, count: 10 } }
  rewards: { meso: 25000, exp: 26000, bondPoints: 60, items: [{ itemId: 2020011, count: 10 }], worldFlags: [ksq.market.back] }

