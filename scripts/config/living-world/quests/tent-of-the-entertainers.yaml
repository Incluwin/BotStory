  persona: rafi
  title: "A Pinch, Never Two"
  length: SHORT
  requires: { level: { min: 28 } }
  steps:
    - { id: talk, type: TALK }
    - { id: vael, type: TALK_TO, persona: vael, say: ["a fire-eater from the tent wants my blue flame? ...black sand from the dark dwarves on the Sahel. a pinch, never two. and tell him to keep his mouth shut while it's lit. i mean that literally."] }
    - { id: report, type: DELIVER, to: rafi }
  rewards: { meso: 7000, exp: 6000, bondPoints: 35 }

- id: rafi-black-sand
  persona: rafi
  title: "Black Sand"
  length: SHORT
