# Tent of the Entertainers quest lines (wave 4, docs/REGIONAL_RESIDENTS_PLAN.md section 10). Every id is from the
# server's own data: ear plug plead 2100106 (earmuff 4000326; White Rock Desert 260010300, the Scorching Desert
# 260010400), royal cactus 2100104 (cactus' flower 4000331; cactus desert 2 260010200, royal catthus desert 260010201),
# scarf plead 2100107 (ragged scarf 4000327; dry desert 260010500, frilled field 260010501), dark sand dwarf 3110301
# (flaming desert 4000352; the desert of serenity 260020610, the desert of dreams 260020620), cactus 2100103 (cactus
# thorn 4000330; outside the west entrance 260010000, cactus desert 1/2 260010100/260010200).
# Gifts: Pepita's masks, Smiling Mask 1012108 and Crying Mask 1012109 (L25 face accessories, no slots).

# ---- Pepita, juggler ------------------------------------------------------------------------------------------------

- id: pepita-soft-things-to-juggle
  persona: pepita
  title: "Soft Things to Juggle"
  length: SHORT
  requires: { level: { min: 23 } }
  steps:
    - { id: talk, type: TALK }
    - { id: pleads, type: KILL_MOBS, mobIds: [2100106], count: 20, mapIds: [260010300, 260010400] }
    - { id: earmuffs, type: COLLECT_ITEM, itemId: 4000326, count: 12 }
    - { id: juggle, type: DELIVER, to: pepita, take: { itemId: 4000326, count: 12 } }
  rewards: { meso: 5000, exp: 4000, bondPoints: 30 }

- id: pepita-the-smiling-mask
  persona: pepita
  title: "The Smiling Mask"
  length: SHORT
  requires: { level: { min: 25 }, friendship: 4, questsCompleted: [pepita-soft-things-to-juggle] }
  steps:
    - { id: talk, type: TALK }
    - { id: zarek, type: TALK_TO, persona: zarek, say: ["Pepita wants to give you a mask from my trunk? ...the smiling one, yes. it's been waiting for a face. tell her the crying one stays in the trunk till she can do the sad part herself. she'll know what i mean. she won't like it."] }
    - { id: mask, type: DELIVER, to: pepita }
  rewards:
    meso: 5000
    exp: 4000
    bondPoints: 30
    gear:
      - { pool: [1012108] }

- id: pepita-the-crying-mask
  persona: pepita
  title: "The Sad Part"
  length: SHORT
  requires: { level: { min: 25 }, friendship: 7, questsCompleted: [pepita-the-smiling-mask] }
  steps:
    - { id: talk, type: TALK }
    - { id: royals, type: KILL_MOBS, mobIds: [2100104], count: 20, mapIds: [260010200, 260010201] }
    - { id: flowers, type: COLLECT_ITEM, itemId: 4000331, count: 10 }
    - { id: tear, type: DELIVER, to: pepita, take: { itemId: 4000331, count: 10 } }
  rewards:
    meso: 8000
    exp: 7000
    bondPoints: 40
    gear:
      - { pool: [1012109] }

