# Mushroom Castle quests (wave 4). Fields: the forest 106020100-106020300 (renegade spores 3300000 mutated spore 4000499,
# poison mushroom 3300001 poison mushroom cap 4000500 / poison spore 4000507 10%; poison mushrooms also on the split road
# 106020400 and steep downhill 1 106020401, past the vines, which open for a poison spore or quest 30000); the steep
# downhill 106020401/106020402 (intoxicated pig 3300002 pig tail 4000501); the castle towers, past the thorns (stock
# quest 2324): helmet pepe 3300003 destroyed helmet 4000502 on skyscrapers 1-4 106020700/106020800/106021000/106021100
# and the security room copies 106021001-106021010, royal guard pepe 3300004 broken spear 4000503 on skyscrapers 4-6
# 106021100/106021200/106021300; the castle wall edge 106020501 and On the Watch 106020601 (106020500 has no way in).
# gotocastle.js lets only a player with stock quest 2324 done (the Secretaries' chain, the court's Thorn Remover) past
# the thorns, so every tower or wall errand says so in its offer and accept lines. The recruits give armour in the
# castle's band: Percival shoes for the player's class (the King Pepe boots at L35, then L40 and L50), Fern no-job
# earrings (L30 / L35 / L40).

# ---- Wilmot: the kingdom's cake (arcs/mushroom-castle.yaml) ----
- id: wilmot-a-cake-for-no-one
  persona: wilmot
  title: "A Cake for No One"
  length: SHORT
  requires: { level: { min: 30 } }
  steps:
    - { id: talk, type: TALK }
    - { id: spores, type: KILL_MOBS, mobIds: [3300000], count: 25, mapIds: [106020100, 106020200, 106020300] }
    - { id: icing, type: COLLECT_ITEM, itemId: 4000499, count: 10 }
    - { id: oven, type: DELIVER, to: wilmot, take: { itemId: 4000499, count: 10 } }
  rewards: { meso: 5000, exp: 5500, bondPoints: 30, items: [{ itemId: 2000002, count: 15 }], worldFlags: [mc.cake.refused] }

- id: wilmot-caps-from-home
  persona: wilmot
  title: "Caps From Home"
  length: MEDIUM
  requires: { level: { min: 30 }, questsCompleted: [wilmot-a-cake-for-no-one], notFlags: [mc.caps.sent] }
  steps:
    - { id: talk, type: TALK }
    - { id: brisa, type: TALK_TO, persona: brisa, say: ["Wilmot? the baker at the mushroom castle? i send him caps every spring! orange ones, the squeaky ones, from the field behind the Empty House. he says they taste like being nine. here, the whole basket. tell him they squeaked the whole way. kidding. maybe."] }
    - { id: basket, type: DELIVER, to: wilmot }
  rewards: { meso: 8000, exp: 8000, bondPoints: 50, items: [{ itemId: 2000002, count: 20 }], worldFlags: [mc.caps.sent] }

- id: wilmot-the-kingdoms-cake
  persona: wilmot
  title: "The Kingdom's Cake"
  length: MEDIUM
  requires: { level: { min: 32 }, questsCompleted: [wilmot-a-cake-for-no-one], flags: [mc.caps.sent, mc.heard-kitchen], notFlags: [mc.cake.served] }
  steps:
    - { id: talk, type: TALK }
    - { id: pepes, type: KILL_MOBS, mobIds: [3300003], count: 20, mapIds: [106020700, 106020800] }
    - { id: wall, type: VISIT_MAP, mapIds: [106020501, 106020601] }
    - { id: faces, type: DELIVER, to: wilmot }
  rewards: { meso: 12000, exp: 14000, bondPoints: 60, items: [{ itemId: 2020002, count: 10 }], worldFlags: [mc.cake.served] }

