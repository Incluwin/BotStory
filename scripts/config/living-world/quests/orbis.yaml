# ---- Corliss, stationmaster: the unclosed page --------------------------------------------------------------------

- id: corliss-lamps-for-the-platform
  persona: corliss
  title: "Lamps for the Platform"
  length: SHORT
  requires: { level: { min: 30 } }
  steps:
    - { id: talk, type: TALK }
    - { id: sentinels, type: KILL_MOBS, mobIds: [5200000], count: 25, mapIds: [200080200, 200080300, 200080400] }
    - { id: shells, type: COLLECT_ITEM, itemId: 4000083, count: 15 }
    - { id: lamps, type: DELIVER, to: corliss, take: { itemId: 4000083, count: 15 } }
  rewards: { meso: 12000, exp: 9000, bondPoints: 30 }

- id: corliss-the-unclosed-page
  persona: corliss
  title: "The Unclosed Page"
  length: MEDIUM
  requires: { level: { min: 35 }, questsCompleted: [corliss-lamps-for-the-platform] }
  steps:
    - { id: talk, type: TALK }
    - { id: oda, type: TALK_TO, persona: oda, say: ["the evening ship, eleven years ago. i put eleven on it. i still have the manifest. one boy kept a green hat on the whole way through the gate. Edric. tell Corliss i remember the hat."] }
    - { id: report, type: DELIVER, to: corliss }
  rewards: { meso: 20000, exp: 16000, bondPoints: 40, worldFlags: [orbis.page.opened] }
  onComplete: { arcAdvance: { arc: corliss-the-unclosed-page, to: chapter-2 } }

- id: corliss-the-last-name
  persona: corliss
  title: "The Last Name"
  length: SHORT
  requires: { level: { min: 50 }, flags: [edric.letter.delivered], questsCompleted: [corliss-the-unclosed-page] }
  steps:
    - { id: talk, type: TALK }
    - { id: ottilie, type: TALK_TO, persona: ottilie, say: ["tell Corliss he can close it. tell him the boy got off his ship and walked all the way down the mountain and stayed there, the silly thing. tell him to use red."] }
    - { id: ledger, type: DELIVER, to: corliss }
  rewards: { meso: 30000, exp: 24000, bondPoints: 50, items: [{ itemId: 2022039, count: 10 }], worldFlags: [orbis.page.closed] }

- id: corliss-brass-rails
  persona: corliss
  title: "Brass Rails"
  length: SHORT
  repeatable: true
  requires: { level: { min: 30 }, questsCompleted: [corliss-lamps-for-the-platform] }
  steps:
    - { id: talk, type: TALK }
    - { id: shells, type: COLLECT_ITEM, itemId: 4000084, count: 15 }
    - { id: rails, type: DELIVER, to: corliss, take: { itemId: 4000084, count: 15 } }
  rewards: { meso: 9000, exp: 7000, bondPoints: 10 }

