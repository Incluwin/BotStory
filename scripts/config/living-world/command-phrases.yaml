# Companion command phrase packs (docs/LIVING_RPG_PLAN.md section 12).
#
# Matched after the built-in regexes miss and before the TypeSafe judge. A message is
# normalized (lowercase, punctuation and fillers removed), then matched as
#   prefix? alias tail*   with up to two unknown trailing words allowed.
# `canonical` must be a phrase the deterministic classifiers already accept as a whole
# command. `status: PLANNED` commands answer with `reply` deterministically instead of
# costing a judgment; wire the behaviour, then drop the status.
# Learned phrases (living_learned_phrase) are matched ahead of these packs.

