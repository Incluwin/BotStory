# Tera Forest Time Gate arc: a girl from Neo City's 2099 whose gran pushed her through the gate the night the overlords
# came. The gate kept her gran's face, name and song; the song turns up in an hourglass at the Temple of Time
# (arcs/three-doors.yaml). Its third chapter waits on the pilgrim's errand to the gate and its last beat happens once per
# server (quests/three-doors.yaml, quests/tera-forest-time-gate.yaml).
- id: calla-the-harbor-light
  persona: calla
  chapters:
    - id: chapter-1
      title: "The Girl at the Gate"
    - id: chapter-2
      title: "The Same Night"
      enterWhen: { flags: [neo.harbor.heard] }
      dialogueOverrides:
        greet: ["hi. i listened to the harbor again last night. same night. same foghorn.", "hello. i've got the listener on. shh. ...nothing new. hi."]
        who: ["Calla. i'm from Midnight Harbor, in 2099. i've a listener now. i can hear the harbor from here. it's always the night the overlords came. i listen for gran. i don't know what she sounds like."]
        idle: ["(holds a little wired box of radar dishes to her ear, eyes shut, listening)", "(turns the listener's dial a hair, frowns, and turns it back)"]
        smallTalk: ["there's a foghorn, and the overlords, and the water. there's a lamp somewhere. you can't hear a lamp. i know there's a lamp.", "Augustin says lost things go to the Temple of Time. memories too. he says the Eyes of Time keep them in hourglasses. maybe gran's in an hourglass. that's a silly thing to think. i think it anyway."]
        speakPlainly: ["plainly: a listener, and a night that won't change."]
        questOffer.calla-the-harbor-listener: ["the listener eats radar. the dishes burn out. twenty-five overlords at Midnight Harbor, eight radars, and it keeps listening. please?"]
        chapterEnter: ["(sets the listener down by the gate, very carefully, and sits beside it with her chin on her knees)"]
    - id: chapter-3
      title: "Somebody Has Gran's Song"
      enterWhen: { flags: [temple.song.traced] }
      dialogueOverrides:
        greet: ["hi! somebody at the temple has gran's song! in a glass! i hummed the next line and it was right!", "hello! i keep humming it so i don't lose it again. hm hm hmm. that's it."]
        who: ["Calla. i'm from Midnight Harbor, in 2099. a pilgrim at the Temple of Time found gran's song in an hourglass. i knew the next line. i didn't know i knew it. i still haven't got her face, or her name. but i've got a line."]
        idle: ["(hums three notes, stops, frowns, and hums them again more carefully)", "(holds the listener to her ear and hums along under the foghorn)"]
        smallTalk: ["the Eyes of Time had it. Augustin was right. lost things go to the temple. i want the rest back. the face. the name.", "the pilgrim made the song up herself, a long time ago, for her daughter. so how did gran know it? Augustin went very quiet when i asked. he got his old logbook out. he didn't open it."]
        speakPlainly: ["plainly: one line of a song, and the rest of it at the temple."]
        about.solveig: ["Solveig. she walks the Road of Regrets at the temple. she has gran's song in a glass. she made it up herself, for her daughter. i don't understand. i want to."]
        questOffer.calla-the-harbor-listener: ["the listener eats radar. the dishes burn out. twenty-five overlords at Midnight Harbor, eight radars, and it keeps listening. please?"]
        questComplete.calla-the-harbor-listener: ["eight. clipped in, where Bettany marked. it's listening again. same night. i'll keep listening anyway."]
        chapterEnter: ["(hums a line of a song under her breath, and grins, and hums it again)"]
    - id: chapter-4
      title: "Liv"
      enterWhen: { flags: [neo.gran.home] }
      dialogueOverrides:
        greet: ["hi! gran's name was Liv. i say it every morning now. Liv.", "hello! i wrote to Solveig. she's my great-gran. that's too long to say. i say gran's mum."]
        who: ["Calla. i'm from Midnight Harbor, in 2099. my gran was Liv. she came through this gate from the forest when she was seventeen, kept a lamp lit by the sea, and sang me her mother's song. her mother's at the Temple of Time. her name's Solveig. i've got family here."]
        idle: ["(hums a whole song through, all three lines, and smiles at the gate)", "(writes a letter on a logbook page, folds it small, and tucks it in her pocket for the next traveller going up to the temple)"]
        smallTalk: ["gran said the gate goes home. i thought she meant the harbor. she meant the forest. she meant here. she knew where she was sending me.", "i still listen to the harbor. same night. but now i listen for the lamp, and i know whose it is. it's Liv's. it's always lit."]
        speakPlainly: ["plainly: gran's name, gran's song, and gran's mum."]
        noWork: ["nothing today. i'm writing to gran's mum. it's a long letter. i keep starting in the middle."]
        about.solveig: ["Solveig. gran's mum. she's at the Temple of Time. we send letters with anybody going that way. she tells me about gran when she was little and wouldn't sleep. i tell her about gran when she was old and sang."]
        about.augustin: ["Augustin keeps the logbook. there's a line in one of his old ones: Liv, of Orbis, seventeen, through the gate. he showed me. he's written under it, very small: 'came home, in a way.'"]
        friend.best: ["if i ever get home, i'll tell everybody about you. and if i don't, i've got you here, and gran's mum. that's a lot."]
        questOffer.calla-the-harbor-listener: ["the listener eats radar. twenty-five overlords at Midnight Harbor, eight radars. i listen for gran's lamp now. it's always lit."]
        questComplete.calla-the-harbor-listener: ["eight. clipped in. listen. there's the lamp. there's Liv's lamp. thank you."]
        chapterEnter: ["(says 'Liv' out loud to the Time Gate, once, firmly, as if introducing someone)"]
