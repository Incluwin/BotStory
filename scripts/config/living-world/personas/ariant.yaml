    greetFirst: ["careful where you sit. it's Ariant. everything has thorns. even the chairs.", "a traveller! you'll want water. Nadira sells it. i grow cactus. cactus is water with patience."]
    greet: ["hello again. the cactus are growing. slowly. so am i.", "sit. not there. there. good."]
    idle: ["(picks a thorn out of his thumb, examines it, and flicks it away)", "(holds a pink cactus flower under his nose and closes his eyes)"]
    noWork: ["nothing today. the cactus are growing without me. they always do."]
    nothingDue: ["you owe me nothing. cactus don't keep accounts."]
    who: ["Imran. i farm cactus west of town. seventy years. my father farmed it before me. it's the only crop in Ariant that never asks for water. i respect that."]
    bye: ["don't hug anything green on the way out."]
    thanks: ["oh, you're a good one."]
    smallTalk: ["a cactus flower lasts one day. the cactus waits a year for it. i think about that a lot. i'm old.", "the royal cactus in the far desert grow flowers like crowns. Yasmin dyes with them. she makes scarves the colour of a desert sunset. i'd buy one if i ever went anywhere."]
    speakPlainly: ["plainly: cactus, thorns, an old man."]
    questOffer.imran-thorns-for-the-fence: ["the fence round my farm wants new thorns. the cactus monsters past the west entrance grow the sharpest. twenty-five of them, fifteen thorns?"]
    questAccept.imran-thorns-for-the-fence: ["the first cactus desert and the second. the plain ones. the royal ones are for later."]
    questWaiting.imran-thorns-for-the-fence: ["fifteen thorns. the goats are getting ideas."]
    questComplete.imran-thorns-for-the-fence: ["fifteen. the fence will hold. the goats will sulk."]
    questOffer.imran-cactus-flowers: ["Yasmin needs royal cactus flowers for her dye and my legs won't take me to the far desert any more. twenty-five royal cactus, fifteen flowers? she'll pay me in scarves. i'll pay you in thanks. it's a poor rate. i'm sorry."]
    questAccept.imran-cactus-flowers: ["the second cactus desert and the royal catthus desert past it. the big ones with the crowns."]
    questWaiting.imran-cactus-flowers: ["fifteen flowers. Yasmin's vats are waiting."]
    questComplete.imran-cactus-flowers: ["fifteen. lovely. Yasmin will make something that'll make the whole market stop. and i'll get a scarf. i'll wear it to the farm."]
    about.yasmin: ["Yasmin dyes with my cactus flowers. she pays me in scarves. i have forty scarves. i wear one. i keep the rest for the day i go somewhere."]
    about.nadira: ["Nadira's father and i drew water from the old well together, sixty years ago. she has his hands. careful with water, and generous with it. he was the same."]
    about.farid: ["Farid runs past my farm twice a day. i've started leaving a cup of cactus water on the fence for him. he thinks it's magic."]
    aboutUnknown: ["never bought a cactus from me."]
    friend.close: ["you can have a cactus. a little one. it'll outlive us both."]
    friend.best: ["when i'm gone, i'd like you to have my father's spade. it's dug every cactus on the farm."]
    famed: ["they speak well of you. good. good people should be spoken of."]
    defamed: ["they speak ill of you. well. so did they of my father. he was all right."]
    gift: ["oh, thank you."]
    gift.favorite: ["oh, you know what an old farmer likes."]
    gift.again: ["one's plenty for an old man."]

- id: yasmin
  name: Yasmin
  look: { gender: female }
  title: "Dyer of Sunset Scarves"
  job: BEGINNER
  level: { min: 26, max: 26 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: ariant
    routine:
      - { from: 7, to: 12, spot: "venue:by-ahmad", activity: LINGER }
      - { from: 12, to: 14, spot: "venue:lower-west-street", activity: REST }
      - { from: 14, to: 19, spot: "venue:middle-east-ledges", activity: SOCIALIZE }
      - { from: 19, to: 21, spot: "venue:lower-west-street", activity: SOCIALIZE }
      - { from: 21, to: 7, materialize: false }
  recruitable: false
  knows: [scarf plead, ear plug plead, ariant]
  questLines: [yasmin-ragged-scarves, yasmin-felt-for-the-vats]
  relationships:
    - { persona: imran, kind: TRADES_WITH }
    - { persona: sefa, kind: SOLD_A_RED_SASH_TO }
  giftItemIds: [4000327, 4000331]
  dialogue:
    greetFirst: ["oh, your colours are all wrong for the desert. sorry. it's my trade. you look like you're dressed for a different sky.", "hello! look at my hands. no, it's dye. it doesn't come off. nothing comes off in Ariant."]
    greet: ["hello! i've a new red. come and see.", "you're back! the vats are bubbling."]
    idle: ["(holds a dripping scarf up against the sky, comparing the colour)", "(wrings out a length of cloth and drapes it over a line to dry in the sun)"]
    noWork: ["nothing today. the dye's setting. you can't hurry red."]
    nothingDue: ["we're even!"]
    who: ["Yasmin. i dye scarves. sunset red from Imran's cactus flowers, sand gold, dusk blue. every scarf in the market is one of mine or a bad copy of one of mine."]
    bye: ["wear a scarf in the sand! over your mouth! any colour. well, not that colour."]
    thanks: ["oh, you're sweet."]
    smallTalk: ["the scarf pleads in the dry desert wear rags of old scarves. some of them are mine, years old. i'd know my red anywhere. it fades to pink. it never fades to nothing.", "Sefa bought a red sash from me the year she left the bandits. she's never worn it. she keeps it folded. i think it's a promise."]
    speakPlainly: ["plainly: dye, cloth, colour."]
    questOffer.yasmin-ragged-scarves: ["the scarf pleads in the dry desert wear old scarves to rags. i unpick the threads and dye them new. twenty-five of them, fifteen scarves? some will be mine. i'd like them home."]
    questAccept.yasmin-ragged-scarves: ["the dry desert and the frilled field. the ones with scarves. obviously."]
    questWaiting.yasmin-ragged-scarves: ["fifteen scarves! i've a red waiting for them."]
    questComplete.yasmin-ragged-scarves: ["fifteen! ...and that one's mine. look. pink. it never fades to nothing. i told you."]
    questOffer.yasmin-felt-for-the-vats: ["the ear plug pleads wear earmuffs. in the desert. i don't ask. the felt takes dye like nothing else. twenty-five of them, fifteen earmuffs?"]
    questAccept.yasmin-felt-for-the-vats: ["the scorching desert and the dry desert. they're the ones that look like they're ignoring you. they are."]
    questWaiting.yasmin-felt-for-the-vats: ["fifteen earmuffs! the vats are hungry."]
    questComplete.yasmin-felt-for-the-vats: ["fifteen! i'll make a felt scarf in dusk blue. the market won't know what hit it."]
    about.imran: ["Imran grows the cactus that makes my red. i pay him in scarves. he has forty. he wears one. i think he's saving them for something."]
    about.sefa: ["Sefa bought a red sash from me seven years ago. she's never worn it. she folds it every morning. i've never asked why. some colours mean something."]
    about.nadira: ["Nadira's scarf is one of mine. dusk blue. it's faded to grey. i've offered her a new one. she says the old one's been through the dry years with her."]
    about.zahra: ["Zahra sews in the quarter. she buys my reds and never says what they're for. i've a good idea. red sashes tear in very particular places."]
    aboutUnknown: ["never bought a scarf from me. tell them i'll do them a good price."]
    friend.close: ["i'm dyeing you a scarf. i won't say what colour. you'll know when you see it."]
    friend.best: ["i've named a colour after you. i won't tell you which. it's a good one."]
    famed: ["everyone's talking about you! good things! wear something bright!"]
    defamed: ["people are talking. wear something bright anyway."]
    gift: ["oh, thank you!"]
    gift.favorite: ["oh, that's lovely! that's going in the vats. well. near the vats."]
    gift.again: ["you've given me plenty today!"]

