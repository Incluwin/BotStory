  title: "Caravan Master of the Sahel Road"
  job: BEGINNER
  level: { min: 38, max: 38 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: ariant
    routine:
      - { from: 7, to: 12, spot: "venue:station-platform-entrance", activity: LINGER }
      - { from: 12, to: 18, materialize: false }
      - { from: 18, to: 22, spot: "venue:middle-central-street", activity: SOCIALIZE }
      - { from: 22, to: 7, materialize: false }
  recruitable: false
  knows: [scorpion, sand rat, magatia]
  questLines: [tariq-tent-pegs, tariq-the-sahel-road, tariq-a-word-with-hedda]
  rumors: [ariant-the-well-argument]
  relationships:
    - { persona: nadira, kind: SELLS_WATER_TO }
    - { persona: hedda, kind: BUYS_IRON_FROM }
  giftItemIds: [4000351, 2000002]
  dialogue:
    greetFirst: ["you're blocking the caravan road. no, it's fine, the camels will walk round you. they walk round everything. it's their whole philosophy.", "a traveller. going to Magatia? i leave at noon. i'll be back at dusk. i'm always back at dusk."]
    greet: ["the road's waiting. what do you need?", "camels are fed. i'm not. talk quickly."]
    idle: ["(writes something in a battered ledger, licks the pencil, and writes something else)", "(checks a camel's hoof, then his own boot, with the same expression)"]
    noWork: ["nothing today. the road's quiet. the camels are thinking."]
    nothingDue: ["we're square. i keep a ledger. you're square in it."]
    who: ["Tariq. i run the caravan up the Sahel road to Magatia and back every day. water, iron and glass from Magatia, cactus and cloth back. without the caravan Ariant would be a lot of sand with a palace in it."]
    bye: ["drink, cover your head, don't argue with the camel."]
    thanks: ["fine. it's in the ledger."]
    smallTalk: ["the scorpions on the Sahel road sting through boots. i carry a kit for it. i've used it on every one of my drivers and twice on a camel.", "Magatia has two societies. i deal with both. separately. at different hours. it's like running two caravans."]
    speakPlainly: ["plainly: a road, some camels, and two cities that need each other."]
    questOffer.tariq-tent-pegs: ["the tent pegs keep snapping. the sand rats on the Sahel road carry little wooden hammers. good hard wood. twenty-five rats, fifteen hammers?"]
    questAccept.tariq-tent-pegs: ["Sahel, the third stretch and the second. the rats. they're quick and rude."]
    questWaiting.tariq-tent-pegs: ["fifteen hammers. the tents are leaning."]
    questComplete.tariq-tent-pegs: ["fifteen. i'll cut them into pegs. the tents will stand like palaces."]
    questOffer.tariq-the-sahel-road: ["the scorpions on the Sahel road are thick this season. twenty-five of them off the road, and fifteen stings for the antivenom kit."]
    questAccept.tariq-the-sahel-road: ["Sahel one and two. the scorpions sit in the shade by the road. that's where you'll want to sit. don't."]
    questWaiting.tariq-the-sahel-road: ["fifteen stings. the kit's thin."]
    questComplete.tariq-the-sahel-road: ["fifteen. the kit's full. my drivers will sleep tonight."]
    questOffer.tariq-a-word-with-hedda: ["Hedda in Magatia sells me iron for the wheel rims. the last load was shorter than usual. she always keeps a little back. never this much. would you ask her? she'll tell you. she won't tell me. she says i haggle."]
    questAccept.tariq-a-word-with-hedda: ["Magatia, up the Sahel road. Hedda's by the east benches in the mornings and Rosen's in the evening. she builds birds. don't ask about the birds unless you've got an hour."]
    questWaiting.tariq-a-word-with-hedda: ["did Hedda say? was it short?"]
    questComplete.tariq-a-word-with-hedda: ["she kept some back for a bird's wing? ...a bird. of course. i'll pay for the whole load anyway. don't tell her. she'll make another bird."]
    about.nadira: ["Nadira and i have argued about the price of water for seven years. everyone hates the price. nobody hates Nadira. that's a skill."]
    about.hedda: ["Hedda sells the best iron in Magatia and puts the best of it into mechanical birds. none of them fly. she's very close, she says. she's been very close for fifteen years."]
    about.farid: ["the Farid boy wants to drive a caravan. i've told him he'll need to learn to sit still first. he's practising. it's painful to watch."]
    about.idris: ["Idris runs the quarter's post. he's at the station door every dusk before the camels have stopped. i've never once beaten him there. it's in the ledger."]
    aboutUnknown: ["not in the ledger."]
    friend.close: ["you can ride the caravan free. sit on the water. it's cool."]
    friend.best: ["if i ever stop driving, the road's yours. i'll leave you the camels. they won't care. they never do."]
    famed: ["you're in the ledger as a good one."]
    defamed: ["you're in the ledger. in pencil. fix it."]
    gift: ["fine. thank you. it's in the ledger."]
    gift.favorite: ["oh. that's useful. that's going on the caravan."]
    gift.again: ["one a day. the ledger's strict."]
