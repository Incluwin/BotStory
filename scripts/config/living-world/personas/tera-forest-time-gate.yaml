    greetFirst: ["ho there! keep your eyes up! that's my advice to everyone. nobody takes it.", "a traveller! good! did you see anything in the sky on your way? no? look harder next time."]
    greet: ["ho!", "there you are! sky's clear today.", "good to see you! eyes up!"]
    idle: ["(shades his eyes with one hand and stares up at the sky over the gate for a long time)", "(plants a spear in the ground, leans on it, and points at a cloud for nobody in particular)"]
    noWork: ["nothing today. the sky's empty. good news for Leafre and dull news for me."]
    nothingDue: ["square and fair!"]
    who: ["Dashiell. i scout the sky for Leafre. the dragons are gone, but things still fly, and somebody should know what. through that gate, in 2503, there's a ship the size of a town. i'm going to know everything about it."]
    bye: ["eyes up!"]
    thanks: ["ho! thank you!"]
    smallTalk: ["the air battleship in 2503 flies without a single wing. no wings! i've stared at it for a month. i'm going to work it out if it kills me. it might.", "Runa says i talk too loud for a scout. a scout should be heard coming, i say. then nobody's surprised. she says that isn't what scouting means."]
    speakPlainly: ["plainly: a spear, a sky, and a great many questions."]
    offer: ["a hundred and forty thousand for the day, and i'll scout ahead of you wherever you're going. sky or ground. i prefer sky."]
    join: ["ho! lead on! i'll watch above. something's always above."]
    bench: ["two days, then i'm back to the sky."]
    leave: ["back to the sky!"]
    refuse.bond: ["i don't scout for strangers. the sky's my business. you're not, yet."]
    refuse.flags: ["come up to the air battleship in 2503 with me first. see what i've been staring at. then ask."]
    refuseOwnErrand: ["the battleship first! come and look!"]
    questOffer.dashiell-the-ship-over-leafre: ["come aboard the air battleship in 2503. thirty imperial guards on the bow and area A, then the deck of area B. i want to know if you can keep your feet up there."]
    questAccept.dashiell-the-ship-over-leafre: ["through the gate, 2503, the Air Battleship. it's very high. don't look down. look up! there's more of it."]
    questWaiting.dashiell-the-ship-over-leafre: ["thirty guards and area B. eyes up."]
    questComplete.dashiell-the-ship-over-leafre: ["you kept your feet! ho! you'd make a scout. a quiet one. i'll do the talking."]
    questOffer.dashiell-what-keeps-it-up: ["the guards on the battleship carry vacuum tubes. i think that's what keeps the thing up. twenty-five guards, eight tubes. and show one to Runa on Leafre's canyon road. she knows wyverns. she'll know if it's anything like a wing."]
    questAccept.dashiell-what-keeps-it-up: ["2503 for the tubes. then Leafre, out to the canyon road. Runa's by the taxi in the mornings. she'll be rude. she's always rude. she's usually right."]
    questWaiting.dashiell-what-keeps-it-up: ["eight tubes and Runa's opinion. the opinion's the hard part."]
    questComplete.dashiell-what-keeps-it-up: ["'wyverns don't have any and fly fine'? ...ho! she's right! it isn't the tubes! back to staring. thank you!"]
    about.calla: ["Calla's from 2099. she's braver than me and she doesn't know it. i've told her. she said 'you're very loud'. she's right about that too."]
    about.tobiah: ["Tobiah picks over the years like a crow. i tease him. i've never once turned down a share. a scout eats too."]
    about.augustin: ["Augustin logs the gate. i log the sky. he says my handwriting's a disgrace and my eyes aren't. i'll take that."]
    about.bettany: ["Bettany falls over the gate about once a week. i've caught her four times. i've started standing nearer."]
    about.runa: ["Runa keeps the canyon road. she says i'm too loud for a scout. she's right. she's always right. it's exhausting."]
    about.arlo: ["Arlo wants to ride a dragon. i told him i'd teach him the sky without one. he said that isn't the same. he's right. it isn't."]
    aboutUnknown: ["never seen them from up high. i'll keep an eye out."]
    friend.close: ["you can carry the second spear. nobody carries the second spear."]
    friend.best: ["if anything ever comes at you out of the sky, it'll have to come past me. nothing gets past me. ho!"]
    famed: ["they say your name in Leafre! loudly! i've been saying it louder!"]
    defamed: ["somebody said something about you. i shouted at them from very high up. it echoes."]
    gift: ["ho! thanks!"]
    gift.favorite: ["now that's a scout's supper! ho! thank you!"]
    gift.again: ["one a day! a scout has to stay light."]
