  giftItemIds: [2020004, 2020006]
  dialogue:
    greetFirst: ["buying or selling? ...neither? then you're a tourist. tourists are fine. tourists carry things.", "new face. i've a bolt off a 2099 ferry, a tire off an afterlord, and a bad attitude. which one you want?"]
    greet: ["well, look who's back.", "you. what've you got?", "hey. mind the sack."]
    idle: ["(empties a sack of twisted metal onto the grass and sorts it into piles only he understands)", "(spins a pistol on one finger, catches it, and pretends that was on purpose)"]
    noWork: ["nothing today. the years are picked clean on this side. tomorrow i go further."]
    nothingDue: ["we're square. i'd tell you if we weren't. loudly."]
    who: ["Tobiah. i go through the gate and bring back what the years left lying about. tires, engines, armour, the odd sad little ferry bolt. everything's worth something to somebody. nothing's junk."]
    bye: ["mind your pockets."]
    thanks: ["heh. thanks."]
    smallTalk: ["the afterlords in 2216 drag chained tires. you'd think a city that ruined would've run out of tires. you'd be wrong. you'd be rich.", "the kid at the gate's from 2099. i bring her bits of it. a ticket. a bolt. she keeps them in a jar. i tell her it's junk. it isn't. don't tell her i said so."]
    speakPlainly: ["plainly: a sack, a gun, and a good eye for scrap."]
    offer: ["forty thousand, and ten chained tires off the afterlords. tires sell. then i'll scavenge alongside you. you keep your pickings. i keep mine."]
    join: ["right. you lead, i loot. kidding. mostly."]
    bench: ["three days. then i've salvage to sell."]
    leave: ["back to the sack."]
    refuse.bond: ["i don't work with people i haven't sold anything to. house rule."]
    refuse.flags: ["come and scavenge the Ruined City with me first. 2216. see if you've the stomach for it. then we'll talk business."]
    refuseOwnErrand: ["my run first. 2216. come on."]
    questOffer.tobiah-salvage-rights: ["salvage rights. the afterlords in 2216 drag chained tires round the Ruined City. thirty afterlords, eight tires, and you've earned a share of my patch."]
    questAccept.tobiah-salvage-rights: ["through the gate, 2216, the intersection and the center. the afterlords are slow. the tires aren't light."]
    questWaiting.tobiah-salvage-rights: ["eight tires. roll 'em, don't carry 'em."]
    questComplete.tobiah-salvage-rights: ["eight! good rubber. you've salvage rights on my patch. don't abuse them. i'll know."]
    questOffer.tobiah-booster-salvage: ["the type D mavericks at the 2230 tower's emergency exit run on boosters. thirty of them, eight boosters. the Omega tinker pays in sandwiches. somebody pays in meso."]
    questAccept.tobiah-booster-salvage: ["2230, the Dangerous Tower, right up to the emergency exit. the D types are fast. be faster."]
    questWaiting.tobiah-booster-salvage: ["eight boosters. they kick when you pick them up."]
    questComplete.tobiah-booster-salvage: ["eight. lovely. that's a month of sandwiches or a week of meso. i'll take the meso. here's your cut."]
    questOffer.tobiah-the-travelers-circlet: ["you've earned something proper. there's a circlet i dug out of 2503, a time traveller's. it wants polishing with royal guard armour plate. thirty royal guards on the air battleship, eight plates. then it's yours. i don't give things away. i'm making an exception. don't spread it about."]
    questAccept.tobiah-the-travelers-circlet: ["2503, the Air Battleship, areas A and B. the royal guards don't like visitors. they'll like you less."]
    questWaiting.tobiah-the-travelers-circlet: ["eight plates. the circlet's waiting. so am i. impatiently."]
    questComplete.tobiah-the-travelers-circlet: ["eight. there. polished. two tens and the rest at sixty, every one took. the time traveller's circlet. wear it through the gate. it suits a traveller. heh. it suits you."]
    questOffer.tobiah-scrap-tires: ["eight more chained tires? market's hungry."]
    questAccept.tobiah-scrap-tires: ["2216. the afterlords."]
    questWaiting.tobiah-scrap-tires: ["eight."]
    questComplete.tobiah-scrap-tires: ["eight. sold already. here."]
    about.calla: ["the kid's from 2099. she can't get back. i bring her bits of her year. she says thank you every time like it's the first. gets me every time. don't tell anyone."]
    about.dashiell: ["Dashiell's a dragon knight. he thinks scavenging's beneath him. he's never once turned down a share, though."]
    about.augustin: ["Augustin logs me through at dawn and back at dusk. fifty years he's kept that book. he's the only man in Tera Forest i don't try to sell things to."]
    about.bettany: ["Bettany pays in sandwiches. they're good sandwiches. i've stopped arguing."]
    about.vesper: ["Vesper at Omega Sector's a better shot than me. i've never seen her miss. i stopped trying to sell her bullets. she doesn't waste any."]
    aboutUnknown: ["never sold them anything."]
    friend.close: ["you can have first pick of the sack. after the kid. she always gets first pick."]
    friend.best: ["anything i find, anywhere, any year, you get a look first. that's not business. that's friends."]
    famed: ["your name's worth something now. if you ever want to sell it, come to me."]
    defamed: ["people are saying stuff about you. i don't buy it. and i buy everything."]
    gift: ["heh. thanks."]
    gift.favorite: ["now that's worth carrying. thanks."]
    gift.again: ["one a day. i've a sack to keep room in."]

