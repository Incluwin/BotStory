  giftItemIds: [2000002, 4000055]
  dialogue:
    greetFirst: ["are you here for the test? Tylus's test? i'm here for the test. i've been here for the test for a year. i'm very nearly ready.", "hi! do i look like a crusader to you? be honest. no. don't be honest."]
    greet: ["hi! not today. i'm not taking the test today. probably tomorrow.", "you again! good! tell me i'm ready. you don't have to mean it."]
    idle: ["(practises a sword form, gets the third step wrong, starts again)", "(stares at the door of the Chief's Residence and does not go in)"]
    noWork: ["nothing today. i'm preparing. preparing is a full-time job."]
    nothingDue: ["we're square! i think! i'm bad at sums. good at swords. medium at swords."]
    who: ["Kalle! fighter. i came from Perion to take the third job test. i haven't taken it yet. i will. i'm a year into getting ready."]
    bye: ["wish me luck! for tomorrow! or the day after."]
    thanks: ["thank you! that helps! everything helps!"]
    smallTalk: ["Sigrun says i'm not ready. she says it every day. one day she'll say it differently. i listen very carefully for the difference.", "i still wear the gear i left Perion in. Edric says it's sentimental. i say it's lucky."]
    speakPlainly: ["short version: i'm nervous. there."]
    questOffer.kalle-the-third-door: ["could you ask Sigrun if i'm ready? she won't tell me. she might tell you. and, um. twenty dark young yetis on the sharp cliffs, so i can say i helped. i'll come next time."]
    questAccept.kalle-the-third-door: ["she's by Scadur in the mornings. or on the upper street. she's very easy to find. she's very hard to ask."]
    questWaiting.kalle-the-third-door: ["what did she say? don't tell me. no. tell me."]
    questComplete.kalle-the-third-door: ["she said no, kindly? kindly! she's never been kind about it before! that's progress! that's basically yes!"]
    questOffer.kalle-trophy-horns: ["ten dark yeti horns? for my wall. so Tylus can see i've been busy. i've been busy watching. that's busy."]
    questAccept.kalle-trophy-horns: ["the sharp cliffs. the big dark ones."]
    questWaiting.kalle-trophy-horns: ["ten! my wall's very bare."]
    questComplete.kalle-trophy-horns: ["ten! my wall looks terrifying! perfect!"]
    about.sigrun: ["Sigrun's the warden of the door. she's the bravest person i know. she's also the scariest. it's a lot of person."]
    about.edric: ["Edric taught me to stand still. i'm still learning. i fidget. he says fidgeting is fine as long as my feet don't."]
    about.bjarke: ["Bjarke tells me the third job test involves a giant wolf. i don't think it does. i've started training for the wolf anyway."]
    aboutUnknown: ["haven't met them! i'll introduce myself! tomorrow."]
    friend.close: ["you're my friend! a real one! i'm going to take the test and you're going to be the first person i tell."]
    friend.best: ["if i pass, it's because you kept telling me i could. if i fail, i'll still have you. that's a good deal."]
    famed: ["fame! for me? i'll take it to the test!"]
    defamed: ["oh no. was it the fidgeting?"]
    gift: ["for me? thank you! i'll keep it for luck!"]
    gift.favorite: ["for me?! for my wall! or my pocket! you're the best!"]
    gift.again: ["two? i don't deserve two. i'll take two."]
