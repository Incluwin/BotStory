      - { from: 14, to: 20, spot: "venue:market-door", activity: SOCIALIZE }
      - { from: 20, to: 8, materialize: false }
  recruitable: false
  knows: [dead mine, el nath market]
  questLines: [oskar-light-soles, oskar-the-carzen-boots, oskar-wing-boots, oskar-the-last-last, oskar-resoling]
  relationships:
    - { persona: ulla, kind: SHARES_A_STALL_WITH }
    - { persona: maud, kind: RESOLES_FOR }
  giftItemIds: [4000021, 4000076]
  dialogue:
    greetFirst: ["feet! let me see. ...those are city boots. on this mountain? you poor thing.", "i trained under Gordon in the market. eight years. i make better boots than Gordon. don't tell Gordon. he knows."]
    greet: ["how are the feet?", "back! walking well, i see. i'll take the credit."]
    idle: ["(taps a boot heel with a tiny hammer, listening to it)", "(looks at everyone's feet as they pass, and sighs)"]
    noWork: ["no soles to stitch today. the mountain's being gentle with its feet."]
    nothingDue: ["nothing owed. your feet are paid up."]
    who: ["Oskar. bootmaker. the mountain kills you from the feet up, so i start at the feet. Gordon taught me that. then i improved on it."]
    bye: ["step soft. the snow's thinner than it looks."]
    thanks: ["mm! happy feet."]
    smallTalk: ["Gordon sews a boot to last. i sew a boot to walk. that's the whole argument. it's been going on for nine years.", "the miners in the dead mine wore boots i resoled. i'd recognise them. i try not to look."]
    speakPlainly: ["simply: boots. good ones. for you."]
    questOffer.oskar-light-soles: ["fly-eye wings make the lightest insoles there are. the flyeyes in the dead mine. twenty-five, fifteen wings."]
    questAccept.oskar-light-soles: ["the dead mine and the passage. look at the flyeyes, not the miners. trust me."]
    questWaiting.oskar-light-soles: ["fifteen wings. the lasts are waiting."]
    questComplete.oskar-light-soles: ["fifteen! light as nothing. walk on these and you'll forget you have feet. that's the dream."]
    questOffer.oskar-the-carzen-boots: ["a pair for you. made for how you move. the studs are teeth. the coolie zombies in the dead forest have plenty and don't need them. thirty, fifteen teeth. yes. teeth."]
    questAccept.oskar-the-carzen-boots: ["the forest of dead trees. they're slow. they're also everywhere."]
    questWaiting.oskar-the-carzen-boots: ["fifteen teeth. i've drilled the soles."]
    questComplete.oskar-the-carzen-boots: ["there. soled for how you move, every scroll took. try them on the ice. ...see? no slip. teeth. who knew."]
    questOffer.oskar-wing-boots: ["the next pair wants werewolf leather. the near territory. thirty werewolves, twenty pieces of leather. Bjarke will tell you how. don't let him."]
    questAccept.oskar-wing-boots: ["wolf territory, the first two. the leather's in the shoulders. the werewolves won't agree."]
    questWaiting.oskar-wing-boots: ["twenty leather."]
    questComplete.oskar-wing-boots: ["the second pair. built for your feet, every scroll took. you'll outrun a werewolf in these. you'll want to."]
    questOffer.oskar-the-last-last: ["the last pair. laced with binding bridles from the master death teddies in Ludibrium's lost time. it's a long way for laces. they're the best laces in the world. thirty teddies, fifteen bridles."]
    questAccept.oskar-the-last-last: ["Ludibrium, by the Orbis ship. the forgotten path, then the hidden room where time got lost. the teddies are not friendly. they are very soft."]
    questWaiting.oskar-the-last-last: ["fifteen bridles. i've cut the uppers. they're beautiful. they're lonely."]
    questComplete.oskar-the-last-last: ["the last pair. made to your stride, two tens and the rest sixties, every one took. Gordon couldn't make these. i'm going to show him. i'm going to show him and then i'm going to hide."]
    questOffer.oskar-resoling: ["fifteen fly-eye wings for resoling. the mountain eats soles."]
    questAccept.oskar-resoling: ["the dead mine. the flyeyes."]
    questWaiting.oskar-resoling: ["fifteen wings."]
    questComplete.oskar-resoling: ["fifteen. that's six pairs back on the road."]
    about.ulla: ["Ulla thinks hands matter more than feet. you can't walk on your hands. well. you can. it's not dignified."]
    about.maud: ["i resole Maud's boots every month. she walks the dead mine to the first gate every night to read the names. she wears out a pair a season."]
    about.edric: ["the sentry stands on the same spot every day. i can tell from his boots. the left heel's worn flat. eleven years of standing still."]
    about.agnetha: ["Agnetha! runs through soles like a wolf through a henhouse. i resole her every month and she still comes down the valley on her heels. jr. yeti skin's the only thing that holds on that ice. i keep telling her."]
    about.torsten: ["the night guard at Jeff's gate. stands still all night, so i line his boots twice. he's never said a word about them. that means they work."]
    aboutUnknown: ["never seen their feet."]
    friend.close: ["i've made you boots. i don't make just anyone boots. Gordon's made his wife two pairs. i'm catching up."]
    friend.best: ["i'd make you boots forever. i'd make you boots after forever. that's a promise from the feet up."]
    famed: ["ha! thank you! happy feet, happy face."]
    defamed: ["oh. blisters? i'll fix it."]
    gift: ["thank you! i'll put it on the bench."]
    gift.favorite: ["for the bench! you're a friend to feet."]
    gift.again: ["that's plenty. i'm not a shoe shop. i am. but."]

- id: maud
  name: Maud
  look: { gender: female }
  title: "Keeper of the Miners' Roll"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: el-nath
    routine:
      - { from: 6, to: 12, spot: "venue:lower-west-street-3", activity: LINGER }
      - { from: 12, to: 18, spot: "venue:market-door", activity: SOCIALIZE }
      - { from: 18, to: 22, spot: "venue:by-jade", activity: REST }
      - { from: 22, to: 6, materialize: false }
  recruitable: false
  knows: [dead mine, miner zombie]
  questLines: [maud-the-roll-of-the-mine, maud-gold-teeth]
  rumors: [el-nath-the-roll-call]
  relationships:
    - { persona: fitch, kind: TAKES_THE_POST_FROM }
    - { persona: bjarke, kind: TOLERATES }
    - { persona: oskar, kind: WEARS_BOOTS_BY }
  giftItemIds: [4000082, 2022001]
  dialogue:
    greetFirst: ["you're alive. good. i keep a roll of the ones who aren't. it's long enough.", "new face. i'll learn your name. i learn everyone's. it's a habit from the mine."]
    greet: ["still alive. good.", "evening. or near enough. the mine doesn't keep hours."]
    idle: ["(reads names from a long roll, lips moving)", "(sits very still, facing the way to the dead mine)"]
    noWork: ["nothing to be done today. the mine's quiet. the mine's always quiet. that's the trouble."]
    nothingDue: ["nothing owed. the roll's paid in names, not meso."]
    who: ["Maud. i keep the roll of the dead mine. every miner it kept. i read it out at night so the mountain knows we haven't forgotten."]
    bye: ["don't go into the mine without telling someone. tell me. i'll remember."]
    thanks: ["mm."]
    smallTalk: ["they dug for the red ore under the mountain. they dug too deep. something down there liked the company.", "the zombies in the mine still have their lamps. some of them still have their names stitched on."]
    speakPlainly: ["plainly: the mine kept them. i keep their names."]
    questOffer.maud-the-roll-of-the-mine: ["the miners in the dead mine aren't miners any more. thirty of them laid down. it's not cruelty. it's rest. they've been working ten years without a shift change."]
    questAccept.maud-the-roll-of-the-mine: ["the dead mine, all four stretches. they'll swing picks at you. they don't mean it. they don't mean anything any more."]
    questWaiting.maud-the-roll-of-the-mine: ["thirty. i'll read their names tonight, whichever thirty they were."]
    questComplete.maud-the-roll-of-the-mine: ["thirty laid down. i'll read the roll twice tonight. once for them and once for you, for going down there."]
    questOffer.maud-gold-teeth: ["some of the miners had gold teeth. it's how they kept their wages safe. three gold teeth, if you find them. they go back to the families."]
    questAccept.maud-gold-teeth: ["not every miner had one. most of them were too poor. that's the sad part. one of the sad parts."]
    questWaiting.maud-gold-teeth: ["three. the families don't know i'm doing this. i'd like to keep it that way."]
    questComplete.maud-gold-teeth: ["three. three families with a little gold and no explanation. that's the right amount of explanation."]
    about.fitch: ["the Orbis runner. he brings me letters for people who died ten years ago. their families still write. i read them to the mine."]
    about.bjarke: ["the loud hunter comes to the roll reading and sits at the back and cries. he thinks i don't see. i read his name at the end. it makes him laugh. that's why."]
    about.oskar: ["Oskar resoles my boots for nothing. he says it's for the walk to the mine. it is."]
    about.edric: ["Edric isn't on my roll. he's on somebody's. i can tell. people on rolls stand like that."]
    about.vigdis: ["the guide at the bottom of the road. she reads the names off their collars on her way past and brings them up to me. she's never got one wrong."]
    aboutUnknown: ["not on my roll. that's the good news."]
    friend.close: ["i've started reading your name on the roll of the living. it's a short roll. i made it for you."]
    friend.best: ["you're the name i read first, at the end of the night. so the mountain knows who's still coming back."]
    famed: ["...thank you. the miners would have liked you."]
    defamed: ["the mine's had worse said to it."]
    gift: ["thank you. that's kind."]
    gift.favorite: ["...thank you. the mine doesn't get kindness much. i'll pass it on."]
    gift.again: ["that's enough for one day. keep the rest."]

