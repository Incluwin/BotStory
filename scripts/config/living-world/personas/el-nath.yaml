      - { from: 22, to: 5, materialize: false }
  recruitable: true
  knows: [zakum, door to zakum, cerebes]
  contract: sigrun-the-door-watch
  questLines: [sigrun-the-trial-cave, sigrun-doombringer, sigrun-blue-screamer, sigrun-berzerker, sigrun-firebomb-watch]
  rumors: [el-nath-what-the-ship-took]
  benchToleranceDays: 2
  paceGap: 2
  relationships:
    - { persona: edric, kind: STANDS_WATCH_WITH }
    - { persona: kalle, kind: TESTS }
  giftItemIds: [4000079, 2000004]
  dialogue:
    greetFirst: ["you came to see the door. everyone does. most of them leave without opening it. that's the right answer.", "stop there. let me look at your grip. ...it'll do. for now."]
    greet: ["warden's watch. what is it.", "back from the cave? good. you're still in one piece."]
    idle: ["(drives the point of a greatsword into the snow and leans on the pommel)", "(watches the mountain the way other people watch a fire)"]
    noWork: ["nothing needs cutting. the door's shut. that's a good day."]
    nothingDue: ["you owe nothing. the mountain might. not me."]
    who: ["Sigrun. warden of the door. below El Nath there's a cave, and below the cave there's a door, and behind the door there's Zakum. i decide who gets that far."]
    bye: ["don't go past the cave without telling me."]
    thanks: ["good."]
    smallTalk: ["the cave of trial is called that because it tries people. some pass. some stay. the cerebes don't care which.", "Kalle asks me every day if he's ready. every day i say no. one day i'll say yes and he won't believe me.", "my husband talks to wolves before he shoots them. i guard a door and talk to nobody. between us it comes out about right."]
    speakPlainly: ["plainly: there's a door. i stand in front of it."]
    offer: ["sixty young cerebes in the cave, counted, and twenty thousand for the hours the door goes unwatched. then i'll swing beside you."]
    join: ["stand clear of the backswing. i won't say it twice."]
    bench: ["i'll be at the cave mouth. two days. the door doesn't like being left longer."]
    leave: ["the door needs me. you'll be fine. you've been tried."]
    refuse.bond: ["i don't leave the door for people i haven't tried."]
    refuse.flags: ["go through the cave of trial first. then ask me."]
    refuseOwnErrand: ["the door's mine to watch. you can watch it with me."]
    questOffer.sigrun-the-trial-cave: ["the cave of trial. thirty young cerebes, fifteen of their teeth, and then stand in front of the door to Zakum for a moment. just look at it. then come back."]
    questAccept.sigrun-the-trial-cave: ["past the dead mine, down. the young ones bite. the door doesn't. the door is worse."]
    questWaiting.sigrun-the-trial-cave: ["fifteen teeth, and the door. did you look at it?"]
    questComplete.sigrun-the-trial-cave: ["you looked, and you came back up. most people want to knock. you didn't. good."]
    questOffer.sigrun-doombringer: ["the Doombringer. my first greatsword. it wants cerebes teeth for the grip, from the grown ones. thirty, fifteen teeth."]
    questAccept.sigrun-doombringer: ["the cave of trial, deep. the big ones breathe fire. step through it, not back from it."]
    questWaiting.sigrun-doombringer: ["fifteen teeth. the grip's unwrapped."]
    questComplete.sigrun-doombringer: ["the Doombringer. seven safe scrolls, every one took. i swung it at the door every morning for a year. it never opened. it was never meant to."]
    questOffer.sigrun-blue-screamer: ["the Blue Screamer. a blade that screams when it's swung. the dark yetis and pepes on the dangerous cliff scream too. twenty pairs, fifteen of the dark beaks."]
    questAccept.sigrun-blue-screamer: ["the dangerous cliff, past the sharp cliffs. there aren't many of them. that's mercy."]
    questWaiting.sigrun-blue-screamer: ["fifteen beaks. the blade's quiet. it shouldn't be."]
    questComplete.sigrun-blue-screamer: ["the Blue Screamer. seven sixties, every one took. listen to it. that's the sound of something that won't be ignored."]
    questOffer.sigrun-berzerker: ["the Berzerker. the sword i'd carry through the door, if i ever went. bains in the deepest stretch of the cave, thirty, fifteen collars. and tell Edric where you're going. someone should know."]
    questAccept.sigrun-berzerker: ["cave of trial, the third stretch. the bains are fire on legs. Edric first."]
    questWaiting.sigrun-berzerker: ["fifteen collars. did you tell Edric?"]
    questComplete.sigrun-berzerker: ["the Berzerker. two tens, five sixties, every one took. i've never trusted a ten in my life. i trusted these, for you. it's the sword for the door. you carry it now."]
    questOffer.sigrun-firebomb-watch: ["the firebombs drift up out of the cave. fifteen of their flames and they stop drifting for a week."]
    questAccept.sigrun-firebomb-watch: ["the first and third stretches. don't stand under them."]
    questWaiting.sigrun-firebomb-watch: ["fifteen flames."]
    questComplete.sigrun-firebomb-watch: ["fifteen. the cave mouth's quiet."]
    about.edric: ["Edric doesn't freeze. he's told me that every morning for six years. one day he'll believe it."]
    about.kalle: ["Kalle wants the third door. Tylus's door, not mine. he's closer than he thinks. don't tell him i said that."]
    about.bjarke: ["Bjarke talks. it's how he tells the wolves he's coming. they come anyway. he's very good. i married him for the quiet bits in between."]
    about.hrafn: ["Hrafn. my second, at the bottom of the road. i decide who goes down; he counts who comes back. he's never once miscounted."]
    spouse.parted: ["{name} and i are done. the door's still here. so am i."]
    aboutUnknown: ["they haven't been tried."]
    friend.close: ["you've been tried, and you're still here. i'd stand at a door with you."]
    friend.best: ["if i ever open the door, you're the one i'd want beside me. that's the highest thing i know how to say."]
    famed: ["...accepted."]
    defamed: ["accepted. noted."]
    gift: ["thank you. useful."]
    gift.favorite: ["good. that's a gift from someone who's been in the cave. you've earned the door."]
    gift.again: ["one's enough."]

