# El Nath cast: what the mountain keeps. 7 residents, 3 recruitable (Sigrun the door warden for a kill proof, Bjarke
# the wolf hunter for a string of fang tails, Edric the sentry through his arc), 1 arc (Edric's unwritten letter, which
# closes Corliss's page in Orbis). Ids in quests/el-nath.yaml.
- id: edric
  name: Edric
  look: { gender: male }
  title: "Snowfield Sentry"
  job: WHITEKNIGHT
  level: { min: 70, max: 72 }
  strength: VETERAN
  loadout: el-nath-knight-l70
  personality: efficient-v1
  home:
    town: el-nath
    routine:
      - { from: 6, to: 14, spot: "venue:upper-east-street", activity: LINGER }
      - { from: 14, to: 20, spot: "venue:chiefs-residence-door", activity: SOCIALIZE }
      - { from: 20, to: 24, spot: "venue:middle-east-benches", activity: REST }
      - { from: 0, to: 6, materialize: false }
  recruitable: true
  knows: [el nath, cold field]
  contract: edric-sentrys-oath
  questLines: [edric-the-watch, edric-the-unwritten-letter, edric-steady-hands]
  arc: edric-the-unwritten-letter
  rumors: [el-nath-what-the-ship-took]
  benchToleranceDays: 6
  paceGap: 3
  relationships:
    - { persona: ottilie, kind: SON_OF }
    - { persona: sigrun, kind: STANDS_WATCH_WITH }
    - { persona: fitch, kind: AVOIDS_THE_POST }
  giftItemIds: [2022001, 4000049]
  dialogue:
    greetFirst: ["you came down the tower. i can see Orbis on you. it washes off.", "state your business. ...sorry. habit. welcome to El Nath."]
    greet: ["the road's clear.", "you again. good. the road likes company."]
    idle: ["(watches the road up toward Orbis without blinking)", "(checks the straps of a shield that does not need checking)"]
    noWork: ["the road's quiet. i'm not going to complain about that out loud."]
    nothingDue: ["nothing owed. the watch is square."]
    who: ["Edric. i stand where i can see the road. i've stood here eleven years. it's the only thing i'm sure i can do."]
    bye: ["stay on the road. the snow keeps what wanders off it."]
    thanks: ["mm."]
    smallTalk: ["the hectors come up the road at dusk. we count them. we always win the count.", "i don't take ships. i don't talk about why. the cold's honest. ships aren't."]
    speakPlainly: ["plainly: i watch. i don't freeze. not anymore."]
    offer: ["forty-five thousand for the sentry's fee, and i stand at your shield side as long as you'll have me. i owe a debt somewhere. it might as well be you."]
    join: ["i'll take the left. i always take the left."]
    bench: ["i'll be on the road. i'm always on the road."]
    leave: ["the watch is yours now. stand it well."]
    refuse.bond: ["i don't leave the road for strangers."]
    refuse.not-recruitable: ["not yet. there's a letter i haven't sent. i'm not leaving this road until i have."]
    refuse.flags: ["carry my letter up to Orbis first, if you haven't. and come by the chief's door some evening. there's something i should say out loud before i follow anyone."]
    refuseOwnErrand: ["that's my watch. you can stand it with me, not for me."]
    questOffer.edric-the-watch: ["thirty hectors on the cold field before dusk and the road sleeps easier. the sentries drill on them. so can you."]
    questAccept.edric-the-watch: ["the cold field is past the icy path. the hectors hunt in pairs. don't be the third."]
    questWaiting.edric-the-watch: ["thirty. the road's still loud."]
    questComplete.edric-the-watch: ["thirty. quiet road tonight. you don't freeze. i notice who freezes."]
    questOffer.edric-the-unwritten-letter: ["you've been to Orbis. you've met a stationmaster with a page he can't close. ...i'm the page. i was on that ship. i froze when the balrog came. then i ran. i got off in Orbis without my name being called and walked down the mountain. i've written this letter every winter for eleven years. take it to my mother. please."]
    questAccept.edric-the-unwritten-letter: ["Ottilie. she sits on the hill steps in the evening. she'll be sweeping one of them. the top one."]
    questWaiting.edric-the-unwritten-letter: ["did she read it? no. don't tell me yet. ...did she?"]
    questComplete.edric-the-unwritten-letter: ["she said that? 'silly thing.' she always said that. ...eleven years. i could have walked up that road any day. it's four thousand steps. Fitch says four thousand and twelve."]
    questOffer.edric-steady-hands: ["the young yetis on the icy path. twenty-five. it keeps the hands steady. mine, and the sentries'."]
    questAccept.edric-steady-hands: ["the icy path, both stretches. the ice is the dangerous part, not the yetis."]
    questWaiting.edric-steady-hands: ["twenty-five."]
    questComplete.edric-steady-hands: ["steady. good."]
    about.ottilie: ["...my mother. she sweeps the steps. she always swept the steps. don't tell her you've seen me. not until i've decided."]
    about.sigrun: ["Sigrun watches the door to Zakum. i watch the road. we watch each other's backs. it's the only conversation we've ever needed."]
    about.fitch: ["the letter runner. he looks at me every time he passes, like there's post for me. there's never post. i've made sure."]
    about.corliss: ["the stationmaster. he has my name on a page. i walked past him that night. he was writing. i didn't stop."]
    about.agnetha: ["the potion runner. she waves every morning on her way out. i wave back."]
    aboutUnknown: ["they haven't come up the road while i was on it."]
    friend.close: ["you're the first person i've told about the ship. you're the first person i'd want at my left."]
    friend.best: ["i spent eleven years not walking four thousand steps. i'd walk them for you."]
    famed: ["...thank you. i don't know what to do with that."]
    defamed: ["fair. i'm not easy."]
    gift: ["thank you. that's kind."]
    gift.favorite: ["...thank you. i don't get given things. i'll keep this one."]
    gift.again: ["that's enough. keep the rest for the road."]

- id: sigrun
  name: Sigrun
  look: { gender: female }
  spouse: bjarke
  title: "Warden of the Door"
  job: CRUSADER
  level: { min: 70, max: 73 }
  strength: ELITE
  loadout: el-nath-2h-sword-l70
  personality: efficient-v1
  home:
    town: el-nath
    routine:
      - { from: 5, to: 12, spot: "venue:by-scadur", activity: LINGER }
