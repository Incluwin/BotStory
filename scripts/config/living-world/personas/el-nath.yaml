      - { from: 23, to: 5, materialize: false }
  recruitable: true
  knows: [wolf territory, werewolf, lycanthrope]
  contract: bjarke-the-hunt-share
  questLines: [bjarke-the-fang-road, bjarke-redemption, bjarke-omega-spear, bjarke-fairfrozen, bjarke-wolf-tally]
  rumors: [el-nath-the-roll-call]
  benchToleranceDays: 4
  paceGap: 3
  relationships:
    - { persona: ansel, kind: HUNTED_WITH }
    - { persona: ulla, kind: SELLS_PELTS_TO }
