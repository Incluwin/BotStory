  giftItemIds: [4000052, 2022001]
  dialogue:
    greetFirst: ["ha! a new one! did you see the wolves on the way in? no? they saw you. they see everybody. it's their whole thing.", "come, sit, there's porridge. there's always porridge. Jade makes too much and i'm the solution."]
    greet: ["hey! back! good! tell me something. anything. i'll tell you about wolves.", "there you are. the snow's in a mood today."]
    idle: ["(tells a story to nobody, with gestures)", "(oils a spear head and hums something very loud)"]
    noWork: ["nothing to hunt. the wolves have taken the day off. so have i. technically."]
    nothingDue: ["we're square! we're always square. i forget what we owe."]
    who: ["Bjarke! i hunt Wolf Territory. werewolves, lycanthropes, the big white ones. Ansel says i talk too much for a hunter. Ansel's wrong. i talk exactly enough."]
    bye: ["don't feed the white fangs! they remember!"]
    thanks: ["ha! anytime."]
    smallTalk: ["the lycanthropes in the far territory walk on two legs when they think nobody's watching. i always watch.", "Ansel and i hunted the wolves one winter. he didn't say a word for a week. i said all of his words for him."]
    speakPlainly: ["fine, fine. short: wolves. spear. porridge."]
    offer: ["thirty thousand and thirty white fang tails, the proper ones. that's my share up front. then i hunt with you and i only talk half the time."]
    join: ["ha! let's go. stay behind the spear. it's long for a reason."]
    bench: ["i'll be at Jade's. the porridge waits for no one. neither do i. four days."]
    leave: ["good hunting! the best! i'll tell everyone. i'll exaggerate. you're welcome."]
    refuse.bond: ["ha. no. i like you already, but the wolves don't, yet."]
    refuse.flags: ["walk the fang road first. then we'll talk shares."]
    refuseOwnErrand: ["that's my hunt! you come with me. that's different."]
    questOffer.bjarke-the-fang-road: ["the white fangs are on the road again. thirty, and fifteen tails so Ulla stops asking me. she's been asking me since spring."]
    questAccept.bjarke-the-fang-road: ["the icy cold field and the far territory. they come in fives. you'll be fine. probably. i was."]
    questWaiting.bjarke-the-fang-road: ["fifteen tails! Ulla's counting. she counts like a tax."]
    questComplete.bjarke-the-fang-road: ["fifteen! ha! Ulla will be thrilled. she'll pretend she isn't. that's thrilled, for her."]
    questOffer.bjarke-redemption: ["the Redemption. my first real spear. i'd give it to you. but the werewolves in the near territory owe me a story first. thirty of them, fifteen toenails."]
    questAccept.bjarke-redemption: ["wolf territory, the first two. they howl before they jump. jump first."]
    questWaiting.bjarke-redemption: ["fifteen toenails. the spear's on the wall. it misses work."]
    questComplete.bjarke-redemption: ["the Redemption! seven safe scrolls, every one took! i've told this spear every story i know. it'll tell you some."]
    questOffer.bjarke-omega-spear: ["the Omega Spear. the lycanthropes in the far territory are the only thing i've ever been afraid of. thirty, fifteen toenails. i'll be honest. i'm still afraid of them."]
    questAccept.bjarke-omega-spear: ["the third, fourth, fifth territories. they stand up. don't let them stand up."]
    questWaiting.bjarke-omega-spear: ["fifteen. you're braver than me. don't let it go to your head. it'll go to mine."]
    questComplete.bjarke-omega-spear: ["the Omega Spear. seven sixties, every one took. i didn't say a word while the scrolls went on. first time in my life. Ulla was there. she'll confirm."]
    questOffer.bjarke-fairfrozen: ["the Fairfrozen. a spear that's been cold since before El Nath. ask Ulla about the snowman in the hidden valley. then put the snowman down, and thirty yeti and pepe pairs with him. the spear wants the valley quiet."]
    questAccept.bjarke-fairfrozen: ["ask Ulla first. she knows where the valley opens. she won't tell me. she says i'd tell everyone. i would."]
    questWaiting.bjarke-fairfrozen: ["the snowman, and thirty pairs. the valley's loud. i can hear it from here. i can't, but i can."]
    questComplete.bjarke-fairfrozen: ["the Fairfrozen. two tens and five sixties, every one took. ...i don't have a story for this one. i'll make one. it'll be about you."]
    questOffer.bjarke-wolf-tally: ["twenty-five werewolves for the tally! the hunters' board counts them. i want my column longer than Ansel's. he isn't even on it. i want it longer anyway."]
    questAccept.bjarke-wolf-tally: ["first and second territories."]
    questWaiting.bjarke-wolf-tally: ["twenty-five!"]
    questComplete.bjarke-wolf-tally: ["twenty-five! my column grows! well. yours. in my column."]
    about.ansel: ["Ansel! the quiet one in Orbis. best shot i know. worst conversationalist. i love him. don't tell him. he'd say nothing."]
    about.ulla: ["Ulla buys my pelts and tells me they're terrible. then she makes gloves from them that cost a fortune. we're very happy."]
    about.maud: ["Maud reads the miners' names at night. i go and listen. somebody should. she doesn't say thank you. she reads my name at the end, as a joke. i think it's a joke."]
    about.edric: ["Edric? the sentry. never laughs. i'm working on it. it's a long hunt."]
    about.sigrun: ["Sigrun! my wife. warden of the door. she says ten words a day and i get eight of them. lucky man."]
    spouse.parted: ["{name} and i... we're not together anymore. the snow's too quiet. i hate it."]
    aboutUnknown: ["never hunted with them! yet!"]
    friend.close: ["you're the friend i tell the true version of the stories to. the boring version. that's love, for me."]
    friend.best: ["i'd stop talking for you. a whole hunt. maybe two."]
    famed: ["ha! yes! thank you!"]
    defamed: ["ha. fair. probably the porridge."]
    gift: ["ha! for me? thanks!"]
    gift.favorite: ["a present! Ulla will think i earned it! i won't correct her."]
    gift.again: ["two in a day? i'll get spoiled. well, more."]

