  giftItemIds: [4000048, 4000021]
  dialogue:
    greetFirst: ["show me your hands. hm. cold already, and you've only just arrived. the cold gets in at the fingers first.", "you're not from the mountain. nobody from the mountain has hands like that."]
    greet: ["hands.", "cold today. colder tomorrow. that's El Nath."]
    idle: ["(works a pelt with a scraping stone, without looking at it)", "(holds two furs up side by side and frowns at both)"]
    noWork: ["nothing on the frame today. come back when the wind changes."]
    nothingDue: ["nothing owed. your fingers are your own."]
    who: ["Ulla. furrier. gloves mostly. a glove that doesn't keep the cold out is a lie you wear on your hands. i don't sell lies."]
    bye: ["gloves on before the cold field."]
    thanks: ["fine."]
    smallTalk: ["Bjarke brings me pelts and calls them perfect. they're never perfect. i make them perfect.", "Oskar and i share a stall. feet and hands. we never agree. it keeps the customers warm."]
    speakPlainly: ["plainly: gloves. warm ones. for you."]
    questOffer.ulla-skins-for-the-cold: ["the young yetis on the icy path. twenty-five, and fifteen skins. the soft ones. i'll know if they're not."]
    questAccept.ulla-skins-for-the-cold: ["the icy path, both stretches. mind the ice. i won't make gloves for a broken wrist."]
    questWaiting.ulla-skins-for-the-cold: ["fifteen skins."]
    questComplete.ulla-skins-for-the-cold: ["fifteen. good skins. better than Bjarke's. don't tell him. tell him."]
    questOffer.ulla-the-hector-pair: ["a pair for you. made for how you fight. hector tail lines the cuff. thirty hectors on the cold field, fifteen tails."]
    questAccept.ulla-the-hector-pair: ["the cold field. the tails are thickest at dusk. so are the hectors."]
    questWaiting.ulla-the-hector-pair: ["fifteen tails. the cuffs are cut."]
    questComplete.ulla-the-hector-pair: ["there. stitched to your grip, every scroll took. try them. ...good. your fingers will thank you on the cold field."]
    questOffer.ulla-dark-hide: ["the next pair is dark hide. the dark young yetis on the sharp cliffs. thirty, fifteen skins."]
    questAccept.ulla-dark-hide: ["the sharp cliffs, and the dangerous one past them. the dark ones throw. duck."]
    questWaiting.ulla-dark-hide: ["fifteen dark skins. they're stiffer. they have to be."]
    questComplete.ulla-dark-hide: ["the dark pair. cut to your hands, every scroll took. you'll never be cold again. you will. less."]
    questOffer.ulla-the-witchs-lining: ["the last pair i'll make you. the snow witch on the icy path weeps tears that never thaw. one tear lines both gloves. bring me one, and ask Bjarke for a lycanthrope pelt. he'll talk for an hour. let him."]
    questAccept.ulla-the-witchs-lining: ["the witch walks the icy path and the icy cold field. one of her at a time. she's cold. don't let her be colder than you."]
    questWaiting.ulla-the-witchs-lining: ["the tear, and Bjarke's pelt. i've cut the palms already."]
    questComplete.ulla-the-witchs-lining: ["the last pair. made for the way you fight, two tens and the rest sixties, every one took. there's a witch's tear in the lining. you'll feel it when it's cold. it's on your side now."]
    questOffer.ulla-mending: ["fifteen pieces of leather for mending. everything drops leather. find me fifteen good ones."]
    questAccept.ulla-mending: ["werewolves drop the best. yetis, if you're lazy."]
    questWaiting.ulla-mending: ["fifteen."]
    questComplete.ulla-mending: ["fifteen. a month of mending. the mountain wears through everything."]
    about.bjarke: ["Bjarke talks to the pelts while he skins them. they're better pelts for it. i'll never tell him."]
    about.oskar: ["Oskar thinks feet matter more than hands. he's wrong. he's a very good shoemaker."]
    about.edric: ["Edric's had the same gloves for six years. he won't let me make new ones. he says he doesn't deserve warm hands. i make him a new pair every winter anyway. they're in a box."]
    aboutUnknown: ["never measured their hands."]
    friend.close: ["your hands are the warmest on the mountain. i made sure of that. i'd do it again."]
    friend.best: ["i've made a lot of gloves. the ones i made for you, i think about."]
    famed: ["...thank you. warm of you."]
    defamed: ["cold. noted."]
    gift: ["thank you. i'll use it."]
    gift.favorite: ["soft and good. you know what i like."]
    gift.again: ["enough for today. go and keep your hands warm."]

