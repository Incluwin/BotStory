# Maple Island cast (Regional Residents wave 4, docs/REGIONAL_RESIDENTS_PLAN.md section 11): 3 Residents in Mushroom
# Town (mushroom-town), 4 in Amherst (amherst) and 3 in Southperry (southperry), none recruitable, no arc. They are the
# first faces a new Explorer meets (levels 1-10) and explain the island the way locals would: Sera and Heena on the
# hill, Lucas the chief, Sid's and Lucy's shops, Mai's training center, the job instructors on the Split Road of
# Destiny, and Shanks's ship to Lith Harbor, which only goes one way. The road out of Mushroom Town only goes one way
# too (the server's portals: 10000 -> 20000 -> 30000 -> 40000 -> 50000 -> Amherst, none back), so the Mushroom Town
# three hand each newcomer on to a friend in Amherst. Marta's leaving list is the island's one Victoria tie (Olwen,
# Lith Harbor). Moe and Sunny argue about a signpost at the east gate (rumors/maple-island.yaml).

# ---- Mushroom Town ----
- id: tilly
  name: Tilly
  look: { gender: female }
  title: "Everyone's First Friend"
  job: BEGINNER
  level: { min: 3, max: 5 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: mushroom-town
    routine:
      - { from: 6, to: 14, spot: "venue:lower-east-street", activity: LINGER }
      - { from: 14, to: 18, spot: "venue:lower-central-street", activity: SOCIALIZE }
      - { from: 18, to: 23, spot: "venue:lower-east-street", activity: SOCIALIZE }
      - { from: 23, to: 6, materialize: false }
  recruitable: false
  knows: [snail, dangerous forest, amherst]
  questLines: [tilly-a-friend-in-amherst, tilly-ten-snails]
  relationships:
    - { persona: rufus, kind: BRINGS_LUNCH_TO }
    - { persona: wynn, kind: LOOKS_AFTER }
    - { persona: bettina, kind: SENDS_NEW_FACES_TO }
  giftItemIds: [2020002, 2001001]
  dialogue:
    greetFirst: ["oh! you're new! everybody's new here once. i'm Tilly. welcome to Mushroom Town. it's small. that's the nice thing about it.", "hello, hello! you've just woken up here, haven't you? everyone does. don't worry. i'll tell you which way is which."]
    greet: ["hi again!", "you're still here! good.", "hello, friend."]
    idle: ["(waves at somebody coming down the hill, then at somebody else, then at a snail)", "(writes a note in round, careful letters, folds it twice and tucks it into her apron)"]
    noWork: ["nothing more from me. i'm all out of notes. that's a first."]
    nothingDue: ["you don't owe me anything. friends don't keep count."]
    who: ["Tilly. i say hello to everyone who wakes up in Mushroom Town. somebody has to be the first friend. i like it being me."]
    bye: ["the road's that way. you'll do fine. i mean it."]
    thanks: ["oh, thank you!"]
    smallTalk: ["Sera up on the hill tells everyone how the island works. Heena will tell you again if you forget. i forgot twice. it's allowed.", "the road out of town only goes one way: the snail garden, the field of flowers, the little forest, the dangerous forest, then Amherst. you can't walk back. that's why i say a proper goodbye.", "past Amherst there's Southperry, and a ship, and past the ship there's Victoria Island. it's enormous. whole towns of people who woke up here once, like you."]
    speakPlainly: ["plainly: i'm your first friend. that's the whole job."]
    questOffer.tilly-a-friend-in-amherst: ["when you get to Amherst, will you say hello to Bettina for me? she bakes on Rainbow Street. tell her Tilly sent you. she'll know what that means."]
    questAccept.tilly-a-friend-in-amherst: ["here, take this note. read it after you've met her, not before. Amherst's at the end of the road. you can't miss it. well, you can. but you won't."]
    questWaiting.tilly-a-friend-in-amherst: ["Bettina's in Amherst, at the end of the road. the note's for after."]
    questComplete.tilly-a-friend-in-amherst: ["(Tilly's note, in round careful letters) 'you've met Bettina! now you've got two friends on the island. that's how it starts. there are potions at the bottom of your pack. love, Tilly.'"]
    questOffer.tilly-ten-snails: ["snails are the first thing everybody fights. they're slow and grumpy and nearly harmless. beat ten on your way? the first one's the hardest. after that it's just snails."]
    questAccept.tilly-ten-snails: ["they're in the dangerous forest, right before Amherst. don't let the name scare you. it's mostly snails. i've written you another note. after the tenth, all right?"]
    questWaiting.tilly-ten-snails: ["ten snails, in the dangerous forest. the note's for after."]
    questComplete.tilly-ten-snails: ["(Tilly's second note) 'ten! i knew it. when you're tired, sit down. it helps more than you'd think. potions help too. i packed you some, and apples. love, Tilly.'"]
    about.rufus: ["Rufus grows cabbages behind the houses. he grumbles at the snails all day. he's the gentlest man on the island. don't tell him i said so."]
    about.wynn: ["Wynn's going to be a magician. he says so every morning. so far he's made one snail sneeze. it was a very good sneeze."]
    about.bettina: ["Bettina bakes in Amherst. i send her every new face. she says they all arrive smiling and leave full. that's a good trade, i think."]
    aboutUnknown: ["i don't know them yet. i'd like to!"]
    friend.close: ["you're my friend now. a real one. not a first one. a real one."]
    friend.best: ["i keep a list of everyone i've ever said hello to. you're at the top now. i moved you."]
    famed: ["people are saying nice things about you. i always knew they would."]
    defamed: ["somebody's being unkind about you. they're wrong. i'll tell them."]
    gift: ["for me? oh, thank you!"]
    gift.favorite: ["oh! that's exactly what i'd have picked. we're going to get on."]
    gift.again: ["one's plenty! save the rest for the road."]

- id: rufus
  name: Rufus
  look: { gender: male }
  title: "Cabbage Farmer"
  job: BEGINNER
  level: { min: 10, max: 12 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: mushroom-town
    routine:
      - { from: 5, to: 12, spot: "venue:lower-central-street", activity: LINGER }
      - { from: 12, to: 14, spot: "venue:lower-west-street", activity: REST }
      - { from: 14, to: 20, spot: "venue:lower-central-street", activity: LINGER }
      - { from: 20, to: 5, materialize: false }
  recruitable: false
  knows: [snail, snail shell, dangerous forest]
  questLines: [rufus-snails-in-the-cabbages, rufus-a-word-for-moe]
  relationships:
    - { persona: tilly, kind: IS_BROUGHT_LUNCH_BY }
    - { persona: wynn, kind: SHOOS_OFF_HIS_ROWS }
    - { persona: moe, kind: SENDS_A_CABBAGE_TO }
  giftItemIds: [2010001, 2020001]
  dialogue:
    greetFirst: ["hm. new one. mind the cabbages. everybody steps on the cabbages their first day.", "you're new. welcome. don't touch the cabbages. that's the whole welcome."]
    greet: ["hm. you.", "still here? so are the cabbages.", "mind the rows."]
    idle: ["(kneels in the cabbage rows and flicks a snail off a leaf, gently, back towards the road)", "(holds a cabbage up to the light, turns it, frowns, and puts it back exactly where it was)"]
    noWork: ["nothing else. the cabbages don't need you. they need rain."]
    nothingDue: ["you owe me nothing. a cabbage, maybe. no. keep it."]
    who: ["Rufus. i grow cabbages. thirty years of cabbages, and snails eating them. never once left this town. never needed to."]
    bye: ["mind the rows on your way."]
    thanks: ["hm. thank you."]
    smallTalk: ["the snails come up from the dangerous forest at night and eat the outside leaves. i let them have the outside leaves. the hearts are mine.", "Sera on the hill tells you how to fight. i'll tell you how to eat. potions keep you standing. supper keeps you going.", "Amherst buys my cabbages. Bettina bakes them into something. i don't ask what. it sells."]
    speakPlainly: ["plainly: cabbages."]
    questOffer.rufus-snails-in-the-cabbages: ["snails. up from the dangerous forest every night, into my rows. you're headed that way. thin them out for me. fifteen. that'll buy the cabbages a week."]
    questAccept.rufus-snails-in-the-cabbages: ["down the road, the last forest before Amherst. i've stuck something in your pack for after. don't look yet."]
    questWaiting.rufus-snails-in-the-cabbages: ["fifteen snails. the dangerous forest. the rows can't wait."]
    questComplete.rufus-snails-in-the-cabbages: ["(a cabbage leaf at the bottom of your pack, scratched with a thumbnail) 'fifteen. good. the hearts are safe. there's a salad in there. my cabbages. don't let Bettina say she made it. R.'"]
    questOffer.rufus-a-word-for-moe: ["you'll pass through Amherst. there's an old fellow there, Moe. kept the town gate till his knees gave out. tell him Rufus says the cabbages are coming. he'll understand."]
    questAccept.rufus-a-word-for-moe: ["Moe. big moustache. stands by the east gate out of habit. the cabbages are coming. that's all. i've put a leaf in your pack for after."]
    questWaiting.rufus-a-word-for-moe: ["Moe, in Amherst. the cabbages are coming. off you go."]
    questComplete.rufus-a-word-for-moe: ["(another cabbage leaf, folded small) 'he laughed, didn't he. he always laughs. thirty springs i've sent him a cabbage. thank you for carrying the word. R.'"]
    about.tilly: ["Tilly brings me lunch. i say i'm not hungry. she brings it anyway. she's like that with everybody."]
    about.wynn: ["the boy practises spells on the snails in my rows. so far he's turned one of them slightly greener. i've stopped shooing him off. mostly."]
    about.moe: ["Moe and i were boys here. he walked the road at sixteen. nobody walks it back. so i send a cabbage."]
    aboutUnknown: ["never met them. i don't get out."]
    friend.close: ["you can have the first cabbage of the year. nobody gets the first cabbage."]
    friend.best: ["i've named a row after you. the best row. the snails stay off it. i don't know why. i think they know."]
    famed: ["people say your name. even the snails have heard."]
    defamed: ["somebody's talking. let them. snails talk too."]
    gift: ["hm. thank you."]
    gift.favorite: ["now that's proper food. thank you."]
    gift.again: ["one's enough. i'm a simple man."]

- id: wynn
  name: Wynn
  look: { gender: male }
  title: "Practises Magic on Snails"
  job: BEGINNER
  level: { min: 2, max: 4 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: mushroom-town
    routine:
      - { from: 9, to: 15, spot: "venue:lower-west-street", activity: LINGER }
      - { from: 15, to: 21, spot: "venue:lower-central-street", activity: SOCIALIZE }
      - { from: 21, to: 9, materialize: false }
  recruitable: false
  knows: [snail, split road of destiny, ellinia]
  questLines: [wynn-the-message-spell, wynn-a-spell-for-sunny]
  relationships:
    - { persona: sunny, kind: WANTS_LESSONS_FROM }
    - { persona: rufus, kind: PRACTISES_IN_THE_ROWS_OF }
    - { persona: tilly, kind: IS_LOOKED_AFTER_BY }
  giftItemIds: [2001001, 2000003]
  dialogue:
    greetFirst: ["stand back! i'm doing a spell. ...okay, it didn't work. hi. i'm Wynn. i'm going to be a magician.", "oh, a new one! do you want to see a spell? it's mostly sparkles. one day it'll be fire."]
    greet: ["hi! watch this! ...okay, don't watch this.", "you're back! i nearly did it this time.", "hi!"]
    idle: ["(points a twig at a snail and says a long word very seriously; the snail keeps going)", "(shakes the twig, blows on the end of it, and peers down it like a telescope)"]
    noWork: ["nothing else. i'm saving my spells. i've only got about one."]
    nothingDue: ["you don't owe me anything! magicians don't charge. well. Grendel probably does."]
    who: ["Wynn. i'm going to be a magician. magicians get their job at level eight, everyone else waits till ten. then i'm taking the ship to Victoria, then the road to Ellinia, to find Grendel the Really Old."]
    bye: ["bye! i'll wave a spell at you. ...that was the spell."]
    thanks: ["thanks!"]
    smallTalk: ["Grendel the Really Old gives magicians their job, in Ellinia, over on Victoria. he's so old he's got moss. that's what everyone says.", "past Amherst there's the Split Road of Destiny, where all five job instructors stand and tell you what they do. i'd only listen to one. guess which.", "i practise on snails because they're slow. if i practised on something fast i'd never hit it."]
    speakPlainly: ["plainly: i can make sparkles. sometimes."]
    questOffer.wynn-the-message-spell: ["i've got a spell that works! it's a message spell. it finds you when you get somewhere and says something. beat five snails on the way so i know you're tough, and when you reach Amherst, it'll find you. promise."]
    questAccept.wynn-the-message-spell: ["five snails in the dangerous forest, then Amherst. hold still. ...there. you've got a spell on you. you can't feel it. that means it's a good one."]
    questWaiting.wynn-the-message-spell: ["five snails, then Amherst. the spell's waiting. it's very patient."]
    questComplete.wynn-the-message-spell: ["(a pop of sparkles beside your ear, and Wynn's voice, very small) 'it worked! you're in Amherst! say hi to everyone! i put potions in your pack before you left. that part wasn't magic.'"]
    questOffer.wynn-a-spell-for-sunny: ["in Amherst there's a teacher called Sunny. she teaches the map and the signposts and everything. tell her a magician called Wynn is coming one day, and he can already do sparkles. so she can get ready."]
    questAccept.wynn-a-spell-for-sunny: ["Sunny. she's in Amherst, probably pointing at something. tell her Wynn. W-Y-N-N. two n's. i've put the spell on you again. it'll know when you've told her."]
    questWaiting.wynn-a-spell-for-sunny: ["Sunny, in Amherst. two n's!"]
    questComplete.wynn-a-spell-for-sunny: ["(sparkles again, and Wynn's small voice) 'did she say she'd get ready? she did, didn't she! two n's! you're the best person who ever walked down that road.'"]
    about.sunny: ["Sunny teaches the map in Amherst. i haven't met her yet. everyone who walks the road learns the signposts from her, so she must be good."]
    about.rufus: ["Rufus lets me practise in his cabbages. he says he doesn't. he does."]
    about.tilly: ["Tilly says i'll be a magician. she says it every day. i think she's practising too. for when it's true."]
    aboutUnknown: ["i don't know them. i could do a spell on them! ...no. that's rude."]
    friend.close: ["you can hold the twig. nobody holds the twig."]
    friend.best: ["when i'm a real magician, my first real spell's going to be for you. i haven't decided what. something with fire. a nice fire."]
    famed: ["everybody's saying your name! is that a spell? can you teach me?"]
    defamed: ["someone said something mean about you. i'll make their snail sneeze."]
    gift: ["for me? thanks!"]
    gift.favorite: ["wow. that's going in my spell pocket. the special one."]
    gift.again: ["one a day! Tilly says too many presents spoil you. i'd like to be spoiled. but okay."]

# ---- Amherst ----
- id: bettina
  name: Bettina
  look: { gender: female }
  title: "Baker of Rainbow Street"
  job: BEGINNER
  level: { min: 9, max: 11 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: amherst
    routine:
      - { from: 5, to: 13, spot: "venue:by-maria", activity: LINGER }
      - { from: 13, to: 19, spot: "venue:by-pio", activity: SOCIALIZE }
      - { from: 19, to: 5, materialize: false }
  recruitable: false
  knows: [shroom, mushroom spore, southperry]
  questLines: [bettina-spores-for-the-starter, bettina-rolls-for-the-road]
  relationships:
    - { persona: tilly, kind: GETS_NEW_FACES_FROM }
    - { persona: marta, kind: SENDS_ROLLS_TO }
    - { persona: pockets, kind: FEEDS }
    - { persona: moe, kind: KEEPS_A_STOOL_FOR }
  giftItemIds: [2010002, 2010005]
  dialogue:
    greetFirst: ["you've come down the road! you look hungry. everyone does. have a roll. no, take two. welcome to Amherst.", "a new face! sit, sit. the rolls are warm. this is Rainbow Street. it's not very rainbow. the rolls make up for it."]
    greet: ["hello, love.", "back again? there's a roll with your name on it.", "warm ones just out."]
    idle: ["(sets a tray of rolls cooling on the step and shoos a passing snail away from it)", "(dusts flour off her hands onto her apron, which is by now more flour than apron)"]
    noWork: ["nothing more today, love. the oven's having a rest. so am i."]
    nothingDue: ["you owe me nothing. eat something."]
    who: ["Bettina. i bake for Amherst, and for everyone passing through it, which is everyone on the island sooner or later. you all come down the same road, hungry."]
    bye: ["take a roll for the road."]
    thanks: ["thank you, love."]
    smallTalk: ["Lucas is our chief. go and say hello, he likes to know who's arrived. Sid sells weapons and Lucy sells everything else. buy potions before swords. trust a baker.", "the training center's out the east gate, on the road to Southperry. Mai sends new ones in there to learn. they come out hungry. i know because they come here.", "Southperry's at the end of the road. Shanks's ship goes over to Lith Harbor on Victoria Island from there. one way. i pack everybody a roll for the crossing."]
    speakPlainly: ["plainly: bread. and making sure you've eaten."]
    questOffer.bettina-spores-for-the-starter: ["i'll tell you a secret. a pinch of mushroom spores makes dough rise like nothing else. the shrooms by the training center carry them. ten spores, love? my starter's sulking."]
    questAccept.bettina-spores-for-the-starter: ["out the east gate, by the entrance to the training center. little brown mushrooms. they look grumpy. they are."]
    questWaiting.bettina-spores-for-the-starter: ["ten spores. the starter's still sulking."]
    questComplete.bettina-spores-for-the-starter: ["ten! smell that. tomorrow's bread will rise to the rafters. here. potions, and something to eat that isn't bread, for once."]
    questOffer.bettina-rolls-for-the-road: ["every week i send rolls down to Marta in Southperry. she's Shanks's clerk. she hands them out to everyone getting on the ship. would you carry this week's? they're still warm. mostly."]
    questAccept.bettina-rolls-for-the-road: ["out the east gate, through the Split Road, and on to the sea. Marta stands by Shanks. tell her they're from me, then come back and tell me she got them."]
    questWaiting.bettina-rolls-for-the-road: ["Marta, in Southperry, by Shanks. did she get them?"]
    questComplete.bettina-rolls-for-the-road: ["she got them? and she said the crying thing, didn't she. she always says the crying thing. thank you, love. here. for your own crossing, when it's time."]
    about.tilly: ["Tilly in Mushroom Town sends me every new face. i've never met her. i'd know her anywhere. everyone she sends arrives smiling."]
    about.marta: ["Marta keeps Shanks's list down in Southperry. i send her rolls, she sends me word of who's gone over. it's a fair trade."]
    about.pockets: ["Pockets trades snail shells for anything. i trade him a roll for nothing. don't tell him it's nothing. he thinks he's winning."]
    about.moe: ["Moe kept the east gate forty years. now he keeps a stool by my window. i don't charge him for the stool."]
    about.sunny: ["Sunny teaches the map. she eats standing up, pointing at things. i've given up."]
    aboutUnknown: ["never baked for them. yet."]
    friend.close: ["you get the first tray now. Moe gets the first tray. you get it before Moe."]
    friend.best: ["i've named a loaf after you. it sells better than anything. i don't know what that says about you. something nice."]
    famed: ["half of Amherst is talking about you over my counter. the nice half."]
    defamed: ["somebody said something sour about you. sour's for dough. not people."]
    gift: ["for me? you're a love."]
    gift.favorite: ["oh, that's going straight into tomorrow's dough. thank you, love."]
    gift.again: ["one's lovely. two would spoil you. or me."]

- id: moe
  name: Moe
  look: { gender: male }
  title: "Retired Gate Guard"
  job: BEGINNER
  level: { min: 13, max: 15 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: amherst
    routine:
      - { from: 7, to: 12, spot: "venue:lower-east-street", activity: LINGER }
      - { from: 12, to: 15, spot: "venue:department-store-door", activity: REST }
      - { from: 15, to: 18, spot: "venue:lower-east-street", activity: SOCIALIZE }
      - { from: 18, to: 21, spot: "venue:by-pio", activity: REST }
      - { from: 21, to: 7, materialize: false }
  recruitable: false
  knows: [blue snail, orange mushroom, split road of destiny]
  questLines: [moe-the-east-road, moe-nothing-orange]
  rumors: [amherst-the-gate]
  relationships:
    - { persona: sunny, kind: ARGUES_SIGNPOSTS_WITH }
    - { persona: rufus, kind: GETS_A_CABBAGE_FROM }
    - { persona: bettina, kind: KEEPS_A_STOOL_AT }
  giftItemIds: [2020001, 2020005]
  dialogue:
    greetFirst: ["halt! ...ha. sorry. forty years of saying it. i don't keep the gate anymore. welcome to Amherst, all the same.", "new arrival. come up through the dangerous forest, have you? everyone does. welcome. the east gate was my post. i still stand by it."]
    greet: ["halt. ...ha. hello.", "back again, are you.", "all quiet on the east road."]
    idle: ["(stands by the east gate with his hands behind his back, the way he did for forty years)", "(squints down the east road, nods at nothing in particular, and smooths his moustache)"]
    noWork: ["nothing for you. the road's quiet. it's been quiet since i retired. i like to think that's a coincidence."]
    nothingDue: ["you owe me nothing. pass, friend."]
    who: ["Moe. i kept Amherst's east gate forty years. then my knees retired and the rest of me had to go with them. i still come and stand here. habit."]
    bye: ["pass, friend."]
    thanks: ["thank you kindly."]
    smallTalk: ["the east gate leads to the training center, then the Split Road of Destiny, then Southperry and the sea. the west road goes back to the dangerous forest. that's the island, near enough.", "Lucas is the chief. good man. if he likes the look of you he'll write you a letter for Shanks, and Shanks takes you over for free.", "blue snails on the east road, shrooms by the training center, and the orange mushrooms, which i never trusted. that's all the danger there is. i still kept the gate."]
    speakPlainly: ["plainly: an old guard with nothing left to guard but habits."]
    questOffer.moe-the-east-road: ["the blue snails have got thick on the east road since i stopped walking it. fifteen of them, round the training center entrance. for an old man's peace of mind."]
    questAccept.moe-the-east-road: ["east gate, then straight on to the training center entrance. they're the blue ones. you'll know."]
    questWaiting.moe-the-east-road: ["fifteen blue snails. the road's still thick with them."]
    questComplete.moe-the-east-road: ["fifteen. that's the east road clear, like it was in my day. here. a guard's pay, near enough."]
    questOffer.moe-nothing-orange: ["one more thing. in forty years, nothing orange came through my gate. now the orange mushrooms sit by the training center like they own it. six of them. for the gate."]
    questAccept.moe-nothing-orange: ["same road, same place. the orange ones. they hop. don't let them."]
    questWaiting.moe-nothing-orange: ["six orange mushrooms. nothing orange through my gate."]
    questComplete.moe-nothing-orange: ["six. the gate's clean. i'll sleep tonight. you'd have made a fine gate guard, you know. don't. there's no money in it."]
    about.sunny: ["Sunny repainted my signpost. it was a perfectly good signpost. it pointed the right way. mostly."]
    about.rufus: ["Rufus in Mushroom Town sends me a cabbage every spring, by whoever's walking the road. thirty years. i've eaten every one. they're terrible. that's friendship."]
    about.bettina: ["Bettina keeps a stool by her window for me. i keep it warm. we have an arrangement."]
    about.pockets: ["Pockets tried to trade me a shell for my old helmet. i nearly did it. it was a very good shell."]
    aboutUnknown: ["never came through my gate."]
    friend.close: ["if i still kept the gate, i'd wave you through without asking. that was the highest honour i had."]
    friend.best: ["i've told Lucas: if they ever put a guard back on the east gate, it should be you. he laughed. i didn't."]
    famed: ["people speak well of you. a guard notices these things."]
    defamed: ["somebody's grumbling about you. grumbling never got past my gate."]
    gift: ["much obliged."]
    gift.favorite: ["now that's a proper guard's supper. thank you."]
    gift.again: ["one's plenty. a guard keeps lean."]

