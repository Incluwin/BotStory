      - { from: 18, to: 22, spot: "venue:by-maria", activity: REST }
      - { from: 22, to: 8, materialize: false }
  recruitable: false
  knows: [split road of destiny, southperry, lith harbor]
  questLines: [sunny-where-the-roads-split, sunny-the-sea-on-the-map]
  rumors: [amherst-the-gate]
  relationships:
    - { persona: moe, kind: REPAINTED_THE_SIGNPOST_OF }
    - { persona: ned, kind: GETS_THE_SEA_FROM }
    - { persona: elodie, kind: DRAWS_MAPS_FOR }
  giftItemIds: [2010003, 2010004]
  dialogue:
    greetFirst: ["a new arrival! good. lesson one: you are here. lesson two: so is everything else, just further away. welcome to Amherst.", "ah, a fresh face. do you know where you are? that's lesson one. Amherst. the middle of the island. everything's either this way or that way."]
    greet: ["lesson three today.", "back for more? good.", "ah. my best pupil. today."]
    idle: ["(holds a hand-drawn map against the wall and points at it with a stick, though nobody is there)", "(redraws a signpost on her map with a stub of chalk, then adds a small, firm arrow)"]
    noWork: ["no lesson today. you know the island now. go and learn the rest of the world."]
    nothingDue: ["you owe me nothing. pass it on."]
    who: ["Sunny. i teach the map, and the signposts, and which way is east, to everyone who comes down the road. most of them knew which way was east. some of them didn't. those are my favourites."]
    bye: ["east is that way. always."]
    thanks: ["thank you. noted."]
    smallTalk: ["the whole island in one breath: Mushroom Town, the road, Amherst, the training center, the Split Road of Destiny, Southperry, the sea. the sea's the big part.", "at the Split Road of Destiny the five job instructors stand and tell you about their trades: warrior, magician, bowman, thief, pirate. you choose on Victoria. the Split Road just helps you think.", "Victoria Island has a town for each job and Lith Harbor where the ship comes in. i've drawn every one of them. i've seen none of them. a teacher doesn't have to."]
    speakPlainly: ["plainly: you are here. everything else is that way."]
    questOffer.sunny-where-the-roads-split: ["lesson two is a walk. out the east gate, past the training center, to the Split Road of Destiny. all five job instructors stand there. go and hear them out, then come and tell me which one you listened to longest."]
    questAccept.sunny-where-the-roads-split: ["east gate, the training center entrance, then keep going east. you'll know it. it's where the road gets ideas."]
    questWaiting.sunny-where-the-roads-split: ["the Split Road of Destiny. east, past the training center. then come back and tell me."]
    questComplete.sunny-where-the-roads-split: ["you listened to one longer than the others. everyone does. don't tell me which. keep it. you'll need it on Victoria. here. lesson two's prize."]
    questOffer.sunny-the-sea-on-the-map: ["my map has a hole in it: the sea. i've never been on it. Ned in Southperry fishes further out than anyone. would you ask him what's out there, so i can draw it right?"]
    questAccept.sunny-the-sea-on-the-map: ["Ned, on the pier at Southperry, past the Split Road. ask him what's between here and Lith Harbor. exactly. i'll want details."]
    questWaiting.sunny-the-sea-on-the-map: ["what did Ned say? exactly?"]
    questComplete.sunny-the-sea-on-the-map: ["east, a day's sail, gulls, then green cliffs. that's all? that's perfect. that's exactly how the sea goes on a map. here. you've earned it. so has Ned."]
    about.moe: ["Moe's signpost said 'sea' and pointed at the training center. the sea is past the training center. so is everything. i repainted it. he's still cross."]
    about.ned: ["Ned fishes further out than anyone on the island. on a clear morning he can see Victoria from his boat. he's the best source i've got for the sea."]
    about.elodie: ["i've drawn Elodie a stack of maps of Victoria. she keeps them under her pillow. the map's the easy part."]
    about.bettina: ["Bettina feeds me between lessons. i eat standing up. she sighs. it's our arrangement."]
    aboutUnknown: ["not on my map."]
    friend.close: ["i've put you on my map. a small dot. it means 'a friend came through here'."]
    friend.best: ["i'm drawing a new map with your route on it, every road you walked on the island, in red. i'll show it to every new pupil. 'this one made it,' i'll say."]
    famed: ["people are talking about you. i've marked it on the map."]
    defamed: ["someone's being unkind about you. i've crossed it off the map."]
    gift: ["oh, thank you."]
    gift.favorite: ["oh, lovely. that'll see me through the afternoon lesson."]
    gift.again: ["one's plenty. a teacher shouldn't take more than one of anything."]

- id: pockets
  name: Pockets
  look: { gender: male }
  title: "Snail-Shell Trader"
  job: BEGINNER
  level: { min: 4, max: 6 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: amherst
    routine:
      - { from: 9, to: 13, spot: "venue:by-pio", activity: LINGER }
      - { from: 13, to: 17, spot: "venue:weapon-store-door", activity: STROLL }
      - { from: 17, to: 20, spot: "venue:by-pio", activity: SOCIALIZE }
      - { from: 20, to: 9, materialize: false }
  recruitable: false
  knows: [snail shell, blue snail shell, red snail shell]
  questLines: [pockets-a-fair-trade, pockets-the-blue-ones]
  relationships:
    - { persona: bettina, kind: TRADES_WITH }
    - { persona: moe, kind: WANTS_THE_HELMET_OF }
    - { persona: elodie, kind: SOLD_A_LUCKY_SHELL_TO }
  giftItemIds: [2001001, 2010009]
  dialogue:
    greetFirst: ["psst. you came through the dangerous forest? got any snail shells? i trade. i trade anything. ask anyone. well, ask Bettina.", "hey! new face! new faces always have shells. want to trade? i'm Pockets. on account of the pockets."]
    greet: ["got shells?", "hey! trade?", "you again! good. i like regulars."]
    idle: ["(empties a pocket onto the step, counts snail shells into neat piles of ten, and puts them back in a different pocket)", "(holds a blue snail shell up to one eye and looks at the sky through it)"]
    noWork: ["nothing to trade right now. i'm all traded out. come back when i've got pockets again."]
    nothingDue: ["you don't owe me! i owe you. no, wait. we're square."]
    who: ["Pockets. my real name's something else. nobody uses it. i trade snail shells. i've got four hundred and twelve. and one with a crack, which is worth more."]
    bye: ["come back with shells!"]
    thanks: ["thanks! pleasure doing business."]
    smallTalk: ["plain snail shells come from the dangerous forest. blue ones from the east road by the training center. red ones you only get in Mai's training. i haven't got a red one. yet.", "everyone takes a shell when they leave on the ship. for luck. i sell them. well, i give them. well, i sell them cheap.", "Sid in the weapon store won't take shells. Lucy won't either. grown-ups don't understand money."]
    speakPlainly: ["plainly: shells."]
    questOffer.pockets-a-fair-trade: ["okay, here's the deal. ten snail shells, the plain ones, from the dangerous forest. i give you potions and something good. that's a fair trade. ask anyone."]
    questAccept.pockets-a-fair-trade: ["out the west road, the dangerous forest. the snails there have the plain ones. ten. no cracked ones. unless they're nice cracks."]
    questWaiting.pockets-a-fair-trade: ["ten plain shells. deal's still on."]
    questComplete.pockets-a-fair-trade: ["ten! nice ones too. here, like i said. potions, and an apple. a green one. green's rarer. that's a fair trade."]
    questOffer.pockets-the-blue-ones: ["you're good at this. okay, big deal. fifteen blue snail shells, from the east road. the leavers like the blue ones best. i'll make it worth it."]
    questAccept.pockets-the-blue-ones: ["out the east gate, by the training center. the blue snails. fifteen shells. don't tell anybody what i'm paying. it's too much. i'm generous."]
    questWaiting.pockets-the-blue-ones: ["fifteen blue ones. still waiting. patiently. mostly."]
    questComplete.pockets-the-blue-ones: ["fifteen blue! that's the biggest trade i've ever done. here. that's more than they're worth. don't tell Bettina. she'll say i've gone soft."]
    about.bettina: ["Bettina gives me a roll for nothing. i let her think i'm winning. we're both winning. that's a good trade."]
    about.moe: ["Moe's still got his old guard helmet. i offered him a cracked shell for it. he nearly said yes. i could tell."]
    about.elodie: ["Elodie in Southperry bought a lucky shell off me for the ship. two years ago. she hasn't gone yet. i don't do refunds."]
    aboutUnknown: ["never traded with them."]
    friend.close: ["you can see the cracked one. nobody sees the cracked one."]
    friend.best: ["you get first pick of every shell i get. forever. that's a lifetime deal. no take-backs."]
    famed: ["everyone's talking about you! your price just went up."]
    defamed: ["someone's bad-mouthing you. bad for business. i'll talk to them."]
    gift: ["for me? deal!"]
    gift.favorite: ["that's worth at least three shells. i'm keeping it."]
    gift.again: ["one a day. any more and i'd owe you."]

# ---- Southperry ----
- id: marta
  name: Marta
  look: { gender: female }
  title: "Shanks's Clerk, Keeper of the Leaving List"
  job: BEGINNER
  level: { min: 12, max: 14 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: southperry
    routine:
      - { from: 7, to: 19, spot: "venue:by-shanks", activity: LINGER }
      - { from: 19, to: 22, spot: "venue:lower-central-street-2", activity: SOCIALIZE }
      - { from: 22, to: 7, materialize: false }
  recruitable: false
  knows: [lith harbor, maple island]
  questLines: [marta-pencil-names, marta-the-leaving-list]
  relationships:
    - { persona: elodie, kind: KEEPS_IN_PENCIL }
    - { persona: olwen, kind: SENDS_THE_LIST_TO }
    - { persona: bettina, kind: HANDS_OUT_ROLLS_FOR }
    - { persona: ned, kind: SHARES_THE_PIER_WITH }
  giftItemIds: [2020009, 2020010]
  dialogue:
    greetFirst: ["name? ...sorry. habit. everyone who gets this far wants the ship. i'm Marta. i keep Shanks's list. welcome to Southperry. this is where the island ends.", "you've walked the whole road. well done. that's Shanks, with the ship. i'm his clerk. i write down everyone who goes."]
    greet: ["hello again.", "not on the ship yet?", "still here. good. the ship'll wait."]
    idle: ["(writes a name in a long ledger, blots it, and looks out at the ship)", "(runs a finger down a column of names, pauses at one written in pencil, and moves on)"]
    noWork: ["nothing more. the list's up to date. it's never up to date. it's up to date right now."]
    nothingDue: ["you owe me nothing. Shanks wants his 150 mesos. i just write things down."]
    who: ["Marta. Shanks's clerk. i keep the leaving list: every name that's gone over on his ship to Lith Harbor. it goes with every sailing, and Olwen on the other side ticks them off as they land. nobody's ever gone missing. i check."]
    bye: ["safe crossing, whenever it is."]
    thanks: ["thank you. truly."]
    smallTalk: ["Shanks's ship goes to Lith Harbor on Victoria Island. it doesn't bring passengers back. nobody's ever asked to come back. that's a good sign, i think.", "Lucas in Amherst writes a letter for the new ones he likes. show it to Shanks and you cross for free. otherwise it's 150 mesos. either way i write your name down.", "most go over around level ten. that's when the instructors on Victoria take you. magicians at eight. Shanks won't take anyone under level seven without Lucas's letter. good. i'd worry."]
    speakPlainly: ["plainly: names, in a book, and a ship."]
    questOffer.marta-pencil-names: ["most names on my list are in ink. one's in pencil. Elodie's. she's put her name down three times and rubbed it out three times. would you go and talk to her? not to talk her into anything. just talk."]
    questAccept.marta-pencil-names: ["mornings and evenings she's on the east side, watching the ship like it might bite. afternoons she sits with Biggs. be kind. you will be. then come and tell me how she is."]
    questWaiting.marta-pencil-names: ["did you find Elodie? how is she?"]
    questComplete.marta-pencil-names: ["'nobody comes back to tell you it's all right.' ...she's not wrong. but you walked the whole road anyway, and she watched you do it. maybe that's what she needed. thank you. here."]
    questOffer.marta-the-leaving-list: ["you're nearly ready, aren't you. i can always tell. when you're level ten, go over. i'll put your name on the list now, in ink, and it'll be in Olwen's hands at Lith Harbor before you are. find Olwen when you land, and get ticked off the list."]
    questAccept.marta-the-leaving-list: ["there. in ink. reach level ten, then take Shanks's ship. Olwen keeps the harbormaster's ledger at Lith Harbor; ask anyone on the dock. dry as a biscuit. you'll get on. i've written something on the back of the list for you. read it over there."]
    questWaiting.marta-the-leaving-list: ["level ten, then the ship, then Olwen at Lith Harbor. your name's in ink. it isn't going anywhere. you are."]
    questComplete.marta-the-leaving-list: ["(on the back of the leaving list, in Marta's neat hand) 'if Olwen's ticked you off, you made it. i've sent a great many names across. i've never gone myself. so go far, for me. M.'"]
    about.elodie: ["Elodie's is the only name i keep in pencil. i'll keep it that way as long as she needs. pencil means 'not yet', not 'never'."]
    about.olwen: ["Olwen keeps the harbormaster's ledger at Lith Harbor. we've never met. we've sent the list back and forth twenty years. not one name wrong, ever."]
    about.bettina: ["Bettina in Amherst sends rolls every week for the crossing. i hand them out at the gangplank. people cry less with bread in their hands."]
    about.ned: ["Ned fishes off the end of our pier. he's the last thing every passenger sees of the island. he waves at all of them."]
    aboutUnknown: ["not on my list."]
    friend.close: ["i've underlined your name. i don't underline names."]
    friend.best: ["i've written your name inside the front cover. that's where i keep the ones i'll remember. there are four. you're the fifth."]
    famed: ["your name keeps coming up at the gangplank. kindly. i'd have written it down anyway."]
    defamed: ["somebody's said something unkind. i don't write that sort of thing down."]
    gift: ["oh. thank you."]
    gift.favorite: ["that's kind. i'll have it at the rail once the ship's gone."]
    gift.again: ["one's plenty. i'd only have to write it down."]

- id: ned
  name: Ned
  look: { gender: male }
  title: "Fisherman of the Pier"
  job: BEGINNER
  level: { min: 14, max: 15 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: southperry
    routine:
      - { from: 4, to: 11, spot: "venue:upper-east-street-3", activity: LINGER }
      - { from: 11, to: 15, spot: "venue:middle-east-street-2", activity: REST }
      - { from: 15, to: 20, spot: "venue:lower-central-street", activity: SOCIALIZE }
      - { from: 20, to: 4, materialize: false }
  recruitable: false
  knows: [shroom, orange mushroom, lith harbor]
  questLines: [ned-spores-on-the-water, ned-mushroom-bobbers]
  relationships:
    - { persona: sunny, kind: TELLS_THE_SEA_TO }
    - { persona: marta, kind: WAVES_THE_SHIP_OFF_WITH }
    - { persona: elodie, kind: TAKES_OUT_IN_THE_BOAT }
  giftItemIds: [2022003, 2020007]
  dialogue:
    greetFirst: ["mind the nets. new, are you? walked the whole road? sit a minute. the sea's not going anywhere. that's the best thing about it.", "ahoy. no, i've never been a sailor. i just like saying it. welcome to Southperry."]
    greet: ["ahoy.", "the fish aren't biting. sit anyway.", "back on the pier, are you."]
    idle: ["(casts a line off the end of the pier, watches the float, and doesn't seem to mind that nothing happens)", "(mends a net with a wooden needle, humming something without a tune)"]
    noWork: ["nothing more. sit and fish, if you like. that's not work. that's the point."]
    nothingDue: ["you owe me nothing. a fish, if you catch one."]
    who: ["Ned. i fish off the end of the pier, and out past it in my little boat, further than anyone. on a clear morning you can see Victoria's cliffs from out there. green on top."]
    bye: ["fair winds."]
    thanks: ["thank you kindly."]
    smallTalk: ["i wave at every ship that goes. everybody on it waves back. you will too. you won't be able to help it.", "the shrooms by the training center shed spores like dust. the wind brings them all the way down here and the fish won't touch the water. not the shrooms' fault. it's mine for fishing downwind.", "Pan sells armour, Biggs gives advice, Shanks sells the crossing. i sell nothing. i'm the only one here who's rich."]
    speakPlainly: ["plainly: an old man, a pier, and some fish that won't bite."]
    questOffer.ned-spores-on-the-water: ["the shrooms by the training center are at it again. spores on the wind, all the way to the pier, and the fish won't bite. twenty shrooms, and the air clears for a week."]
    questAccept.ned-spores-on-the-water: ["back up the road, past the Split Road, at the training center entrance. little brown mushrooms. they won't mind. they don't mind much."]
    questWaiting.ned-spores-on-the-water: ["twenty shrooms. the water's still dusty."]
    questComplete.ned-spores-on-the-water: ["twenty? look at that. the water's gone clear already. that's a fisherman's thanks, and here's the rest of it."]
    questOffer.ned-mushroom-bobbers: ["a fisherman's secret: orange mushroom caps float better than any cork. five of them and i'll have bobbers for a year. the orange ones up by the training center."]
    questAccept.ned-mushroom-bobbers: ["same place as the shrooms. the orange ones. they're tougher. take a potion along."]
    questWaiting.ned-mushroom-bobbers: ["five caps. orange ones. my float's a cork and the cork's sinking."]
    questComplete.ned-mushroom-bobbers: ["five! look how they sit on the water. like little suns. here. and when you're on the ship, look out for my boat. i'll be the one waving."]
    about.sunny: ["Sunny in Amherst asks me what the sea looks like, for her map. i tell her water. she draws gulls. she's not wrong."]
    about.marta: ["Marta writes them down, i wave them off. between us, nobody leaves Southperry unnoticed."]
    about.elodie: ["i take Elodie out in the boat sometimes, far enough to see Victoria. she always asks to go back. one day she won't."]
    aboutUnknown: ["never fished with them."]
    friend.close: ["you can borrow my second-best rod. nobody borrows my second-best rod."]
    friend.best: ["when your ship goes, i'll row out after it as far as i can. i don't do that for anybody. i'll do it for you."]
    famed: ["word's come down the road about you. good word."]
    defamed: ["somebody's muttering about you. the sea's heard worse."]
    gift: ["ha. thank you."]
    gift.favorite: ["now that's a fisherman's supper. thank you kindly."]
    gift.again: ["one's enough. any more and i'd have to share with the gulls."]

- id: elodie
  name: Elodie
  look: { gender: female }
  title: "Wants to Leave"
  job: BEGINNER
  level: { min: 6, max: 8 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: southperry
    routine:
      - { from: 9, to: 13, spot: "venue:middle-east-street", activity: LINGER }
      - { from: 13, to: 18, spot: "venue:by-biggs", activity: SOCIALIZE }
      - { from: 18, to: 21, spot: "venue:upper-east-street-2", activity: LINGER }
      - { from: 21, to: 9, materialize: false }
  recruitable: false
  knows: [blue snail shell, ellinia, lith harbor]
  questLines: [elodie-a-map-of-victoria, elodie-a-shell-bracelet]
  relationships:
    - { persona: marta, kind: IS_KEPT_IN_PENCIL_BY }
    - { persona: ned, kind: IS_TAKEN_OUT_IN_THE_BOAT_BY }
    - { persona: sunny, kind: KEEPS_THE_MAPS_OF }
    - { persona: pockets, kind: BOUGHT_A_LUCKY_SHELL_FROM }
  giftItemIds: [2020002, 2001001]
  dialogue:
    greetFirst: ["oh. hi. you're going on the ship, aren't you. everyone who gets this far does. ...i'm Elodie. i'm not going. not yet.", "you came down the whole road? on your own? ...that's brave. i'm Elodie. i've lived here all my life. i've never been past the Split Road."]
    greet: ["oh. hi again.", "you're still here.", "hi. the ship's still there. i checked."]
    idle: ["(watches the ship from a little way off, takes one step towards it, and then takes it back)", "(unfolds a worn map of Victoria Island, traces a road with one finger, and folds it up very small)"]
    noWork: ["nothing else. you've done so much already. more than me."]
    nothingDue: ["you don't owe me anything. i owe you, i think."]
    who: ["Elodie. i want to go to Victoria. i've wanted to since i was small. i've put my name on Marta's list three times and rubbed it out three times. i'm not scared of the sea. i'm scared of the other side."]
    bye: ["bye. ...be careful. you will be. bye."]
    thanks: ["thank you. really."]
    smallTalk: ["there's a town on Victoria called Ellinia that's all trees. Sunny drew it for me. i've looked at it so long i could walk it with my eyes shut.", "everyone says 'it's only a boat'. it's not the boat. it's that you can't come back. once you're gone, you're gone. that's what everybody's so brave about.", "Pockets sold me a lucky shell for the crossing two years ago. i still carry it. it must be very full of luck by now."]
    speakPlainly: ["plainly: i want to go, and i haven't."]
    questOffer.elodie-a-map-of-victoria: ["Sunny in Amherst drew me a map of Victoria, but i've worn the fold right through Ellinia. would you ask her for another? she always says the same thing. i want to hear what she says to you."]
    questAccept.elodie-a-map-of-victoria: ["Sunny teaches the map in Amherst, back up the road. tell her it's for me. she'll sigh. she sighs nicely."]
    questWaiting.elodie-a-map-of-victoria: ["did Sunny say anything? what did she say?"]
    questComplete.elodie-a-map-of-victoria: ["'the map's the easy part.' she says it every time. she's right every time. ...thank you for asking her. here. i was saving these for the crossing. you'll get there before me."]
    questOffer.elodie-a-shell-bracelet: ["Pockets says leavers carry a blue snail shell for luck. i want to make a bracelet. five shells. but i want them from someone who's really going. would you? it's silly. it's not silly."]
    questAccept.elodie-a-shell-bracelet: ["the blue snails, by the training center, back up the road. five shells. i'll have the string ready."]
    questWaiting.elodie-a-shell-bracelet: ["five blue shells. the string's ready. so am i. nearly."]
    questComplete.elodie-a-shell-bracelet: ["five. ...look. it fits. it doesn't mean i'm going. it means i could. that's new. thank you. take these. you'll need them more than i do. for now."]
    about.marta: ["Marta keeps my name in pencil. she's never once asked me why. she just keeps the pencil sharp."]
    about.ned: ["Ned takes me out in his boat, far enough to see the cliffs of Victoria. i always ask to go back. he always says 'right you are'. he never says anything else."]
    about.sunny: ["Sunny draws me maps of Victoria. i've got a stack of them. the next one will be the one i take."]
    about.pockets: ["Pockets in Amherst sold me a lucky shell two years ago. i still haven't used it. he says it doesn't go off."]
    aboutUnknown: ["i don't know them. i don't know many people. i'd like to."]
    friend.close: ["when i go, if i go, you're the first person i'll look for over there."]
    friend.best: ["i asked Marta for her pen today. i didn't write anything. i just held it for a while. that's a start, isn't it? i think it's a start."]
    famed: ["people are saying such nice things about you. i'd like people to say things about me one day. nice things. or any things."]
    defamed: ["someone said something unkind about you. i don't believe it. you walked the whole road."]
    gift: ["for me? ...thank you."]
    gift.favorite: ["oh. that's my favourite. how did you know? ...thank you."]
    gift.again: ["one's plenty. really. you're very kind."]
