      - { from: 13, to: 16, materialize: false }
      - { from: 16, to: 21, spot: "venue:by-rosen", activity: SOCIALIZE }
      - { from: 21, to: 9, materialize: false }
  recruitable: false
  knows: [roid, kiyo, magatia]
  questLines: [hedda-a-mechanical-bird, hedda-feathers-for-the-bird]
  rumors: [magatia-the-sweepers-news]
  relationships:
    - { persona: mott, kind: GOSSIPS_WITH }
    - { persona: tariq, kind: SELLS_IRON_TO }
  giftItemIds: [4003004, 4000364]
  dialogue:
    greetFirst: ["oh, mind the wing. no, the left one. the right one's finished. the left one is very nearly finished. it has been for some time.", "a visitor! do you know anything about flight? no? nobody does. that's the trouble."]
    greet: ["hello! the bird nearly flew today.", "you're back. sit. careful of the springs."]
    idle: ["(adjusts a tiny brass wing joint with tweezers, then flaps it gently with one finger)", "(holds a little mechanical bird up and lets go; catches it immediately)"]
    noWork: ["nothing today. the bird's resting. i'm thinking about the bird."]
    nothingDue: ["you owe me nothing, dear."]
    who: ["Hedda. i was an Alcadno engineer for forty years. now i'm retired and i build mechanical birds. none of them fly. the Alcadno say it can't be done. i've stopped asking them."]
    bye: ["look up on the way. you never know."]
    thanks: ["oh, that's lovely of you."]
    smallTalk: ["the roids in area C-1 have wires that sing when they spark. i want that sound in a bird's throat. birds should sing.", "Tariq buys my iron for his wheels. i keep a little back for the wings. he pays for the whole load anyway. he thinks i don't know. i know."]
    speakPlainly: ["plainly: an old engineer and a bird that won't fly."]
    questOffer.hedda-a-mechanical-bird: ["the wires in the roids sing when they spark. i want the sound. twenty-five roids in area C-1, then go into the room behind it where they go wrong and listen. tell me what it sounds like."]
    questAccept.hedda-a-mechanical-bird: ["the Alcadno institute, area C-1, then the critical error room behind it. listen to it. that's the important part."]
    questWaiting.hedda-a-mechanical-bird: ["twenty-five, and the room. what did it sound like?"]
    questComplete.hedda-a-mechanical-bird: ["like a lot of small birds arguing? ...oh, that's perfect. that's exactly the sound. i'll wire it in tonight."]
    questOffer.hedda-feathers-for-the-bird: ["real feathers. i want to try real feathers on the wings. the kiyos on the north desert road drop stiff ones. twenty-five kiyos, eight feathers? they don't drop many. i'm patient."]
    questAccept.hedda-feathers-for-the-bird: ["Ariant's north desert road, the second stretch, and the red desert. the kiyos. the birds that shouldn't fly and do. i want to know their secret."]
    questWaiting.hedda-feathers-for-the-bird: ["eight feathers, dear. i'm patient. the bird's patient. it's very patient."]
    questComplete.hedda-feathers-for-the-bird: ["eight. stiff and light. ...i'll try them tomorrow. if it flies, you'll hear about it. the whole city will hear about it."]
    about.mott: ["Mott sweeps both houses. he's the only man in Magatia who knows everything and never tells. well. he tells me."]
    about.tariq: ["Tariq drives the caravan to Ariant. he buys my iron and pretends he hasn't noticed the short loads. he's a gentleman. don't tell him i said so."]
    about.gilda: ["Gilda was my apprentice, long ago. she builds clocks now. she's better than i ever was. she sits on a bench every evening. i don't ask. i built that bench."]
    aboutUnknown: ["never built anything with them."]
    friend.close: ["i've named a bird after you. it doesn't fly yet. neither did i, at first."]
    friend.best: ["if a bird ever flies, it's going to you first. it'll know the way. i'll make sure."]
    famed: ["they're saying lovely things about you, dear."]
    defamed: ["they're saying hard things. let them. birds don't listen to gossip."]
    gift: ["oh, thank you, dear."]
    gift.favorite: ["oh, that's just what the bird needs. how did you know?"]
    gift.again: ["one's plenty for today, dear."]
