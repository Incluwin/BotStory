  giftItemIds: [4000329, 2000002]
  dialogue:
    greetFirst: ["are you Alcadno? you don't look Alcadno. are you Zenumist? you don't look Zenumist. what do you look like? i'm writing this down.", "hello! i'm an apprentice. i'm learning the archive. i've learned the first shelf. there are nine hundred shelves."]
    greet: ["hello! i learned a new shelf!", "you're back! i've got a question. i've got lots of questions."]
    idle: ["(copies something from one notebook into another in very careful handwriting)", "(peers across the street toward the Alcadno door, then quickly pretends to be reading)"]
    noWork: ["nothing today! Aurel's locked the archive for lunch. i'm reading the door."]
    nothingDue: ["we're even!"]
    who: ["Pellam. apprentice to Aurel at the Zenumist archive. i'm learning every formula the society ever wrote. also i want to know why we don't talk to the Alcadno. nobody will tell me. so i'm asking the Alcadno."]
    bye: ["don't trip on the doors! they're higher than they look."]
    thanks: ["thank you! i'll write it down."]
    smallTalk: ["the Zenumist use cactus stems from Ariant for a tonic. nobody knows who first thought of it. i think it was someone very thirsty.", "Kipp says the Alcadno don't eat lunch. last week he said they eat lunch twice. i'm keeping a list. the list is very confusing."]
    speakPlainly: ["plainly: an apprentice with a lot of notebooks."]
    questOffer.pellam-cactus-stems: ["Aurel needs cactus stems for the tonic and i'm not allowed to go to Ariant by myself. the jr. cactus by the west entrance have the juiciest stems. twenty-five of them, fifteen stems? please?"]
    questAccept.pellam-cactus-stems: ["Ariant, down the Sahel road. out the west entrance, and the young catthus desert. the little ones. they're prickly. so is Aurel when he's out of tonic."]
    questWaiting.pellam-cactus-stems: ["fifteen stems! Aurel's very prickly."]
    questComplete.pellam-cactus-stems: ["fifteen! Aurel will be less prickly. i'll write down that you did it. in the archive. you'll be on a shelf."]
    questOffer.pellam-ask-kipp: ["would you ask Kipp if the Alcadno eat lunch? the real answer. he keeps telling me different things. he might tell you the truth. you look honest."]
    questAccept.pellam-ask-kipp: ["Kipp's by the weapon shop in the mornings and the Alcadno door at night. he's the one with the crossbow and the grin."]
    questWaiting.pellam-ask-kipp: ["did he say? do they eat lunch?"]
    questComplete.pellam-ask-kipp: ["they eat lunch at the same time as us, in the same square, on different benches? ...and nobody's ever said? i'm writing this down. i'm writing this down in red."]
    about.aurel: ["Aurel knows everything in the archive. he says he's still looking for one page. i asked which page. he said 'the one that explains us'. i don't know what that means yet."]
    about.kipp: ["Kipp's an Alcadno! he talks to me anyway. he says i'm too small to count as a Zenumist yet."]
    about.vael: ["Vael set my notebook on fire once. by accident. she bought me two new ones. i like her very much."]
    aboutUnknown: ["they're not in the archive! i'll add them!"]
    friend.close: ["you're on my favourite shelf. it's the first shelf. it's the only one i've learned."]
    friend.best: ["when i'm archivist, i'll give you a whole shelf. of your own. you can put anything on it."]
    famed: ["everyone's talking about you! i'm writing it down!"]
    defamed: ["people are saying things. i'm not writing those down."]
    gift: ["for me? thank you!"]
    gift.favorite: ["oh, that's perfect! how did you know? i'm writing that down."]
    gift.again: ["you already gave me something! i wrote it down."]

- id: mott
  name: Mott
  look: { gender: male }
  title: "Sweeper of Both Houses"
  job: BEGINNER
  level: { min: 32, max: 32 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: magatia
    routine:
      - { from: 5, to: 9, spot: "venue:lower-east-street", activity: STROLL }
      - { from: 9, to: 17, materialize: false }
      - { from: 17, to: 22, spot: "venue:lower-east-street-2", activity: SOCIALIZE }
      - { from: 22, to: 5, materialize: false }
  recruitable: false
  knows: [iron mutae, magatia, ariant]
  questLines: [mott-sweeping-the-labs, mott-the-fish-tile]
  rumors: [magatia-the-sweepers-news]
  relationships:
    - { persona: hedda, kind: GOSSIPS_WITH }
    - { persona: nadira, kind: KNEW_THE_FATHER_OF }
  giftItemIds: [4000357, 2022001]
  dialogue:
    greetFirst: ["mind the dust. no, the other dust. that's Zenumist dust. that's Alcadno. they're different. i'd know. i sweep both.", "hello! wipe your feet. both of them. on both sides."]
    greet: ["hello. both houses swept, or about to be.", "hello again. the dust is very political today."]
    idle: ["(leans on a broom and watches both society doors, one after the other)", "(sweeps a neat little pile of dust into a pan and squints at it, as if reading it)"]
    noWork: ["nothing today. the dust's resting. so am i."]
    nothingDue: ["you owe me nothing. i owe the dust everything."]
    who: ["Mott. i sweep the Zenumist institute in the morning and the Alcadno in the afternoon. i'm the only person in Magatia who's allowed in both. nobody thinks a sweeper's listening. i'm always listening."]
    bye: ["wipe your feet on the way out too. it's only polite."]
    thanks: ["oh, you're kind."]
    smallTalk: ["the Zenumist sweep left to right. the Alcadno sweep right to left. i sweep in a circle. nobody's ever complained.", "i was a boy in Ariant once. i swept the palace steps. there was a well in the market with a tile at the bottom shaped like a fish. i used to look down at it while i worked."]
    speakPlainly: ["plainly: a broom, two houses, a lot of gossip."]
    questOffer.mott-sweeping-the-labs: ["the iron mutae in the Alcadno labs shed filings everywhere. thirty of them out of my way in areas B-3 and A-3, then go and look at the Zenumist's unit one-oh-three. i want to know if their floor's as bad as ours."]
    questAccept.mott-sweeping-the-labs: ["Alcadno areas B-3 and A-3. the iron mutae. then over to the Zenumist, unit one-oh-three. look at the floor. just look."]
    questWaiting.mott-sweeping-the-labs: ["thirty, and the Zenumist floor. how bad was it?"]
    questComplete.mott-sweeping-the-labs: ["just as bad? ...good. i knew it. same dust, both houses. i've been saying so for thirty years."]
    questOffer.mott-the-fish-tile: ["you go to Ariant? ask Nadira the water-seller something for me. is the fish tile still at the bottom of the old well? i looked at it every day as a boy. i'd like to know it's there."]
    questAccept.mott-the-fish-tile: ["Ariant, down the Sahel road. Nadira sells water in the market. her father gave me a cup every morning when i was a boy. she'll know the tile."]
    questWaiting.mott-the-fish-tile: ["did she say? is it there?"]
    questComplete.mott-the-fish-tile: ["still there. ...good. i'm glad. that's silly. i'm glad anyway."]
    about.hedda: ["Hedda builds birds that don't fly. i sweep up the feathers. we talk every evening. she's the only one who asks how the dust is."]
    about.nadira: ["Nadira's father was a water-carrier in Ariant when i swept the palace. he gave me a cup every morning for nothing. i've never forgotten. i sweep a little slower when i think of him."]
    about.gilda: ["Gilda's Alcadno. she leaves the labs at seven every evening, exactly. i sweep past the bench at eight. there's a tin under it. i've never once swept it. some things you leave."]
    about.aurel: ["Aurel's Zenumist. he writes in green ink. there's green ink in the tin under the bench. i've never mentioned it. i sweep around it."]
    aboutUnknown: ["never swept up after them."]
    friend.close: ["i'd sweep for you. not the floor. the gossip. i'd sweep the bad gossip away."]
    friend.best: ["when i retire i'll leave you my broom. it's swept both houses. it's the only thing in Magatia that has."]
    famed: ["both houses are talking about you. i heard it in both dusts."]
    defamed: ["both houses are talking about you. i swept it under the rug. both rugs."]
    gift: ["oh, thank you."]
    gift.favorite: ["oh, that's thoughtful. that goes in my pocket. the good pocket."]
    gift.again: ["one's plenty. i've only got the one good pocket."]

- id: hedda
