  giftItemIds: [2020014, 2022009]
  dialogue:
    greetFirst: ["mind the basket. that's dinner. that one's medicine. that one's both.", "hello! you've a scrape on your elbow. no? you will. everyone does, round here."]
    greet: ["hello!", "you again. any cuts?", "hello. smell that? that's the hill."]
    idle: ["(sorts a basket of leaves into three piles, sniffs one, and moves it to a fourth)", "(dabs a little green paste on the back of her own hand, waits, and nods)"]
    noWork: ["nothing today. the jars are full and the knees are all salved. it's a good day for weeds."]
    nothingDue: ["nothing owed. it was only leaves."]
    who: ["Fumiko. i gather on the hill path between here and the shrine. salve for knees, tea for the gate, something green for anyone going into the castle. i've a cure for most things. not for wanting to go in."]
    bye: ["mind your knees."]
    thanks: ["oh, thank you!"]
    smallTalk: ["the cloud foxes on the mountain shed tails soft as smoke. i dust the pollen off flowers with them. a fox's tail never bruises a petal.", "Hayate leaves a throwing star on my sill when he's grateful. he doesn't say it. i've got forty-one stars. he's very grateful. he's very bad at saying so."]
    speakPlainly: ["plainly: leaves, jars, and other people's knees."]
    questOffer.fumiko-the-salve-round: ["my pollen brush is bald. the cloud foxes on the mountain carry tails like smoke. twenty-five foxes, ten tails. and on your way back, take this jar to Goro at the gate. he'll say he doesn't need it. he needs it."]
    questAccept.fumiko-the-salve-round: ["The Mountain of Cloud Fox, straight off the Mushroom Shrine. Perry takes you across. then Goro, out here. make him take the jar."]
    questWaiting.fumiko-the-salve-round: ["ten tails. did Goro take the jar?"]
    questComplete.fumiko-the-salve-round: ["ten! soft as anything. and he took it? and said it smelled? it does smell. it works. here. for your own knees, later. you'll want them."]
    about.hayate: ["Hayate came down my hill path three winters back bleeding from somewhere he wouldn't show me. i patched him anyway. he still won't say where. he leaves a star on my sill."]
    about.oharu: ["i blend Oharu's tea from the hill. she puts in too much sugar. i've told her. she says a boy likes sugar. i stopped telling her."]
    about.goro: ["Goro's knees carried forty years of rice. they've earned the salve. he says it smells. it does. he keeps it anyway."]
    about.kenta: ["Kenta falls off things. walls, carts, the tea stall. i salve his knees. he says ninjas don't need salve. he holds still for it."]
    about.shinobu: ["Shinobu goes into the castle with a brush. i give her something green first so she stays awake. she stays awake for two days. it's a strong green."]
    about.masaru: ["Masaru has hands like baskets. he carries mine up the hill and won't take a coin. he takes dumplings. i've stopped offering coins."]
    aboutUnknown: ["never salved them. give them time."]
    friend.close: ["you can have the first jar of every batch. it's the strongest. don't put it near your eyes."]
    friend.best: ["there's a tea i only make for three people. you're the fourth."]
    famed: ["people say your name on the hill path. the foxes don't. they're jealous."]
    defamed: ["there's a salve for most things. talk heals on its own."]
    gift: ["oh! thank you."]
    gift.favorite: ["oh, lovely. that's lunch on the hill."]
    gift.again: ["one a day. i'm only one herbalist."]

- id: hayate
  name: Hayate
  look: { gender: male }
  title: "Shinobi Who Walked Out of the Castle"
  job: HERMIT
  level: { min: 78, max: 80 }
  strength: ELITE
  loadout: ninja-claw-l70
  personality: efficient-v1
  home:
    town: ninja-castle
    routine:
      - { from: 5, to: 9, spot: "venue:middle-east-street", activity: LINGER }
      - { from: 9, to: 18, materialize: false }
      - { from: 18, to: 23, spot: "venue:middle-central-street", activity: LINGER }
      - { from: 23, to: 5, materialize: false }
  recruitable: true
  knows: [jonin, ninto, kunoichi]
  contract: hayate-the-night-wage
  questLines: [hayate-the-way-out, hayate-soft-soles, hayate-quiet-hands, hayate-a-cup-on-the-way-out, hayate-the-patrol]
  rumors: [nc-the-one-who-walked-out]
  benchToleranceDays: 3
  paceGap: 2
  relationships:
    - { persona: oharu, kind: DRINKS_THE_TEA_OF }
    - { persona: fumiko, kind: IS_PATCHED_UP_BY }
    - { persona: shinobu, kind: CORRECTS_THE_MAPS_OF }
    - { persona: masaru, kind: RESPECTS }
  giftItemIds: [2022022, 2000006]
  dialogue:
    greetFirst: ["you came up behind me. almost quietly. almost.", "hm. a traveller. don't stand between me and the road. stand anywhere else."]
    greet: ["hm.", "you.", "quiet morning."]
    idle: ["(sits with his back to the castle gate and his eyes on the road out, perfectly still)", "(turns a throwing star over in his fingers, sets it on the ground beside him, and doesn't pick it up again)"]
    noWork: ["nothing today. the castle's quiet. that's when it's busiest."]
    nothingDue: ["nothing owed."]
    who: ["Hayate. i was born to the clan. jonin at nineteen. i taught the genin to walk without a sound. three winters ago i walked out the front gate without one. nobody walks out. i'm told i'm nobody now. it suits me."]
    bye: ["walk quiet."]
    thanks: ["hm. thank you."]
    smallTalk: ["the kunoichi in the fourth and sixth corridors were my year. they'll know my step. they'll know yours by the time you've cleared twenty.", "the screens in the corridors turn at night. the clan says they don't. Shinobu's the only one outside the castle who's noticed. she's very good. don't tell her."]
    speakPlainly: ["plainly: a claw, and the road out."]
    offer: ["forty-five thousand for a day of my time. a day, not an hour. i don't do hours. you've walked out the way i did, and you've heard what Fumiko says. that'll do."]
    join: ["go. i'll be where you aren't looking."]
    bench: ["three days. then i go back to the road."]
    leave: ["back to the road."]
    refuse.bond: ["i don't walk with people i don't know. i walked with a clan for twenty years. look how that went."]
    refuse.flags: ["walk out the way i did first, from the kunoichi corridors back to the gate. and some evening on the middle central street, hear what Fumiko says about me. then ask."]
    refuseOwnErrand: ["the way out first."]
    questOffer.hayate-the-way-out: ["the kunoichi hold the fourth corridor and the sixth. thirty of them. then walk back out to the gate the way i did, without stopping. if you can walk out of there, i'll walk with you."]
    questAccept.hayate-the-way-out: ["in through the gate and the corridors to the kunoichi. then back out to Inside the Castle Gate, and don't look back. looking back is how they get you."]
    questWaiting.hayate-the-way-out: ["thirty, and out. no looking back."]
    questComplete.hayate-the-way-out: ["you walked out. good. most people only ever walk in. you can sit with me, if you like. back to the gate."]
    questOffer.hayate-soft-soles: ["your feet are loud. thirty kunoichi in the sixth corridor and fifteen jonin with them. you'll learn to walk soft or you'll learn to walk fast. either will do. there are soft soles in it for you."]
    questAccept.hayate-soft-soles: ["the sixth corridor. everything's awake there at once. listen for the jonin. they breathe out before they move."]
    questWaiting.hayate-soft-soles: ["thirty and fifteen. softer."]
    questComplete.hayate-soft-soles: ["softer. here. every safe scroll they'd take, every one took. walk in them a week. you won't hear yourself."]
    questOffer.hayate-quiet-hands: ["thirty jonin in the fifth and sixth corridors. the jonin were my rank. they'll come at you two at a time. keep your hands quiet. there's a pair of gloves for quiet hands."]
    questAccept.hayate-quiet-hands: ["the fifth, and the sixth past it. don't let the jonin get behind you. they'll try."]
    questWaiting.hayate-quiet-hands: ["thirty. quiet hands."]
    questComplete.hayate-quiet-hands: ["thirty. your hands are quieter. here. scrolled at sixty, every one took. don't clench them. clenching's loud."]
    questOffer.hayate-a-cup-on-the-way-out: ["the ninto stand at the deep end, in the seventh corridor and the eighth. twenty of them. then carry a message for me to Oharu at the tea stall. i've owed it to her three winters. i'll give you the words."]
    questAccept.hayate-a-cup-on-the-way-out: ["the seventh and the eighth. the ninto don't speak. don't speak back. then Oharu. tell her: the night i walked out, i drank one of her cups on the way. it was too sweet. it was the best one she ever sent in."]
    questWaiting.hayate-a-cup-on-the-way-out: ["twenty ninto. and Oharu. did you tell her?"]
    questComplete.hayate-a-cup-on-the-way-out: ["she said that? ...a pot to myself. no sugar. hm. here. the last of them. two tens and a sixty, every one took. i walked out with nothing. you'll walk out with these."]
    questOffer.hayate-the-patrol: ["twenty-five kunoichi in the fourth corridor? they're getting bold. i'd like them less bold."]
    questAccept.hayate-the-patrol: ["the fourth corridor."]
    questWaiting.hayate-the-patrol: ["twenty-five."]
    questComplete.hayate-the-patrol: ["twenty-five. less bold. thanks."]
    about.oharu: ["Oharu sends tea in with everyone. i drank her cups for years in there, cold, after the drills. the night i walked out i drank one on the way. she brings me tea now. i drink it facing the road."]
    about.fumiko: ["Fumiko patched me up three winters ago and didn't ask where i'd come from. she knew. she leaves the door unlatched. i leave a star on the sill."]
    about.shinobu: ["Shinobu maps the castle. her maps are better than the clan's. i fix them when she isn't looking. she knows. she leaves them out for me."]
    about.masaru: ["Masaru put his spear down in the second corridor. an ashigaru can. he was hired. i was born to it. we nod at each other. that's plenty."]
    about.kenta: ["Kenta followed me once. two steps. he's got good feet. i hope he never uses them for that."]
    about.goro: ["Goro carried rice through the corridors for forty years and never saw one of us. we saw him every time. he said good morning to the empty walls. we liked him for it."]
    aboutUnknown: ["don't know them. that's usually good."]
    friend.close: ["you can sit with me in the mornings. back to the gate. you don't have to talk. i won't."]
    friend.best: ["i walked out with nothing. i've got a friend now. that's more than the clan gave me in twenty years."]
    famed: ["people say your name on the road. loudly. you'll get used to it. i didn't."]
    defamed: ["talk is noise. noise tells me where people are."]
    gift: ["hm. thank you."]
    gift.favorite: ["hm. that's a good one. that's a whole night's watch."]
    gift.again: ["one. i travel light."]

- id: masaru
  name: Masaru
  look: { gender: male }
  title: "Ashigaru Who Threw Down His Spear"
  job: DRAGON_KNIGHT
  level: { min: 82, max: 84 }
  strength: VETERAN
  loadout: kft-polearm-l88
  personality: relaxed-v1
  home:
    town: ninja-castle
    routine:
      - { from: 7, to: 12, spot: "venue:middle-central-street-2", activity: REST }
