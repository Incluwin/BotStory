  recruitable: true
  knows: [ashigaru, chunin, ninto]
  contract: masaru-the-standing-oath
  questLines: [masaru-the-spear-under-the-bench, masaru-plain-armour, masaru-a-cloak-for-walking-out, masaru-all-the-way-in, masaru-the-drill]
  rumors: [nc-the-spear-lesson]
  benchToleranceDays: 4
  paceGap: 2
  relationships:
    - { persona: goro, kind: HAD_HIS_SPEAR_CARRIED_BY }
    - { persona: kenta, kind: IS_PESTERED_BY }
    - { persona: hayate, kind: RESPECTS }
    - { persona: fumiko, kind: CARRIES_THE_BASKETS_OF }
    - { persona: oharu, kind: WAS_GIVEN_TEA_BY }
  giftItemIds: [2022026, 2000005]
  dialogue:
    greetFirst: ["evening. or morning. i stopped keeping hours when i stopped keeping a spear.", "you're tall. good. i get tired of looking down."]
    greet: ["evening.", "you. sit. there's room.", "hm. hello."]
    idle: ["(sits on an upturned crate with his big hands open on his knees, looking up at the castle)", "(picks up a long stick, holds it like a spear out of habit, notices, and puts it down)"]
    noWork: ["nothing today. i'm resting. nine years of standing. i've a lot of sitting to catch up on."]
    nothingDue: ["we're even. i'd tell you."]
    who: ["Masaru. i was an ashigaru. hired. nine years in the second corridor with a spear. one night they told me to stop a genin running for the gate. he was ten. i put my spear down under the bench. he went back on his own. i didn't. i kept walking."]
    bye: ["evening."]
    thanks: ["thank you. that's kind."]
    smallTalk: ["the ashigaru in the second corridor still stand round my spear like it's a shrine. nobody's picked it up. i'd like somebody to. not me.", "Kenta wants me to teach him the spear. i told him i threw mine down. he wants me to teach him that. ...that's the only bit worth teaching."]
    speakPlainly: ["plainly: a big man who used to stand in a corridor."]
    offer: ["thirty thousand, and sixty chunin knocked down where i can count them. i stood nine years watching chunin go past. i'd like to see somebody stop them. then i'll stand beside you instead."]
    join: ["right. i'll stand at your shoulder. it's what i'm good for."]
    bench: ["four days. then i go and sit on my crate."]
    leave: ["back to my crate."]
    refuse.bond: ["i don't stand beside people i don't know. i did that nine years. look where it got me. a crate."]
    refuse.flags: ["go and see where i put my spear down first. the second corridor, under the bench. then ask."]
    refuseOwnErrand: ["the bench first. go and look."]
    questOffer.masaru-the-spear-under-the-bench: ["go to the second corridor. there's a bench by the far wall. under it there's a spear. mine. it isn't mine. look at it for me. twenty ashigaru stand round it. then go one corridor further than i ever went, and knock down thirty chunin. don't bring the spear back."]
    questAccept.masaru-the-spear-under-the-bench: ["through the gate and the first corridor. the second's the ashigaru. the third's chunin. i never went into the third. i stood at its door nine years."]
    questWaiting.masaru-the-spear-under-the-bench: ["is it still there? don't tell me. ...is it?"]
    questComplete.masaru-the-spear-under-the-bench: ["still there. good. ...no. i don't know. good. you went further than i ever did. sit, if you like. there's room on the crate."]
    questOffer.masaru-plain-armour: ["an ashigaru wears what the castle gives him. it's thin. twenty kunoichi in the fourth corridor and thirty chunin in the fifth, and i'll get you something better than thin. plain. good. plain's good."]
    questAccept.masaru-plain-armour: ["the fourth, then the fifth. the kunoichi come from above. the chunin come from everywhere. stand wide."]
    questWaiting.masaru-plain-armour: ["twenty and thirty. stand wide."]
    questComplete.masaru-plain-armour: ["here. plain, good. every safe scroll it would take, and every one took. it's better than anything the castle gave me. it's better than the castle."]
    questOffer.masaru-a-cloak-for-walking-out: ["i walked out at night with nothing on my back. i've thought about that cloak a lot since. the one i didn't have. thirty jonin in the fifth corridor, and it's yours."]
    questAccept.masaru-a-cloak-for-walking-out: ["the fifth corridor. the jonin are the clan's own. they don't hire. they don't quit. be careful."]
    questWaiting.masaru-a-cloak-for-walking-out: ["thirty jonin."]
    questComplete.masaru-a-cloak-for-walking-out: ["here. scrolled at sixty, every one took. dark, like a night you walk out in. you won't need it for that. i hope."]
    questOffer.masaru-all-the-way-in: ["thirty jonin in the seventh corridor. ten ninto in the eighth. then tell Goro at the gate you went all the way in, where he never carried and i never stood. i want him to hear it from somebody. the best armour i can find is yours after."]
    questAccept.masaru-all-the-way-in: ["the seventh, then the eighth. the ninto are the deep end. then Goro. he's on the west street in the mornings and by the tea stall after."]
    questWaiting.masaru-all-the-way-in: ["thirty, ten, and Goro."]
    questComplete.masaru-all-the-way-in: ["he said hips, not shoulders? he says that to everyone. he said it to me the day i came in. ...here. two tens and a sixty, every one took. you went all the way in, and you came all the way out. that's the bit that counts."]
    questOffer.masaru-the-drill: ["thirty chunin in the third corridor? i stood at its door nine years. i like to know it's quieter."]
    questAccept.masaru-the-drill: ["the third corridor."]
    questWaiting.masaru-the-drill: ["thirty."]
    questComplete.masaru-the-drill: ["thirty. quieter. thanks."]
    about.goro: ["Goro carried my spear in for me the day i came. i was fifteen. it was taller than me. he didn't say a word. he walked slow so i could keep up."]
    about.kenta: ["Kenta wants to learn the spear. i've taught him how to put one down. he says that's not a lesson. it's the only lesson."]
    about.hayate: ["Hayate walked out. a shinobi. i was hired; i could quit. he was born to it. we nod. that's enough for two men like us."]
    about.oharu: ["i walked out past Oharu's stall that night without my spear. she said 'evening, Masaru,' as if i did it every night, and gave me tea. i don't mention what happened next. neither does she."]
    about.fumiko: ["Fumiko's baskets weigh nothing. i carry them up the hill anyway. she pays in dumplings. i'd carry them for nothing. don't tell her."]
    about.shinobu: ["Shinobu asked me where my bench was. i showed her. she drew it. it's the only thing on her map that never moves."]
    aboutUnknown: ["never stood beside them."]
    friend.close: ["you can have the crate. i'll stand. i'm good at standing."]
    friend.best: ["nine years i stood beside people i didn't choose. i chose you. that's the difference."]
    famed: ["people say your name on the street. good things. i nod along."]
    defamed: ["people talk. i stood in a corridor nine years. i've heard worse said about walls."]
    gift: ["oh. thank you."]
    gift.favorite: ["oh, now that's a meal. that's a proper meal."]
    gift.again: ["one a day. i'm trying to stay the size of the crate."]
