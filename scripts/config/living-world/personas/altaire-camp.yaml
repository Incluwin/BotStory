# Altaire Camp cast (wave 4): the expedition out of Ossyria, camped in Ellin's forest long ago (travellers come and go
# by the time gate in the small forest). 7 residents, 2 recruitable (Maelis the huntress for a boar kill proof, Gaspard
# the stone-breaker for a day rate), 1 arc (Ottavia's map, whose last chapter writes the forest's name across its top,
# once per server). Ids in quests/altaire-camp.yaml.
- id: ottavia
  name: Ottavia
  look: { gender: female }
  title: "Cartographer of the Expedition"
  job: BEGINNER
  level: { min: 48, max: 48 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: altaire-camp
    routine:
      - { from: 6, to: 12, spot: "venue:upper-central-street", activity: LINGER }
      - { from: 12, to: 14, spot: "venue:by-mayoren", activity: REST }
      - { from: 14, to: 19, spot: "venue:tent-house-1-door", activity: SOCIALIZE }
      - { from: 19, to: 23, spot: "venue:lower-west-street", activity: SOCIALIZE }
      - { from: 23, to: 6, materialize: false }
  recruitable: false
  knows: [mossy tree forest trail, tree rod, deep fairy forest]
  questLines: [ottavia-the-walking-trees, ottavia-the-haze-line, ottavia-a-name-on-the-map, ottavia-green-ink]
  arc: ottavia-the-map-of-the-forest
  rumors: [altaire-the-haze-line]
  relationships:
    - { persona: teodor, kind: DRAWS_THE_LINE_WITH }
    - { persona: larkin, kind: ASKS_THE_WAY_OF }
    - { persona: gaspard, kind: MARKS_THE_CORNERS_WITH }
    - { persona: wren, kind: HEARD_OF }
  giftItemIds: [4000436, 4000438]
  dialogue:
    greetFirst: ["stand still. no, there. i'm pacing the camp and you're in the middle of a number.", "you came out of the time gate? then you've seen this forest later. don't tell me what it looks like. it'd ruin the map."]
    greet: ["hello. forty paces from the tent to the fire. i've counted it again. it's still forty.", "you again. good. a second pair of eyes for the western trees."]
    idle: ["(holds a pencil out at arm's length toward the treeline, squints, and writes down a number)", "(unrolls a long map across her knees, rubs out a tree, and draws it a little to the left)"]
    noWork: ["nothing today. the trees are where i drew them. for once."]
    nothingDue: ["we're square. i'd have written it down if we weren't."]
    who: ["Ottavia. i draw the map for the expedition. we came out of Ossyria with a cart, a lot of frightened people and no idea where we were. Athena wants somewhere to build. you can't build on a guess. so i draw."]
    bye: ["north is up. remember that. nobody in this forest does."]
    thanks: ["noted. in ink."]
    smallTalk: ["the trees in the west walk. you draw a tree, you turn round, it's moved. i've started drawing them with little feet.", "Kanderune keeps saying 'over the next hill'. i've drawn the next hill. there's another one behind it. there's always another one behind it."]
    speakPlainly: ["plainly: a map, a pencil, and a forest that won't hold still."]
    questOffer.ottavia-the-walking-trees: ["the western trees won't stay where i draw them. tree rods. they walk. thirty of them out of the way, then walk on to the mountain's foot at Boulder Mountain and tell me the west still ends where i say it does."]
    questAccept.ottavia-the-walking-trees: ["out the west road, through the mossy tree forest, both western regions and the trail. the tree rods. then on to the boulders. count your paces if you can. you won't. nobody does."]
    questWaiting.ottavia-the-walking-trees: ["thirty, and the mountain's foot. the west edge of the map is waiting on you."]
    questComplete.ottavia-the-walking-trees: ["the mountain's foot, right where i have it. ...good. the west holds. the trees can walk where they like inside it. the edge stays in ink."]
    questOffer.ottavia-the-haze-line: ["the haze has moved again. south, on the mushroom hill. thin out the mossy mushrooms on the way, twenty-five, and ask Teodor where the haze line stood this morning. he walks it every day. i don't."]
    questAccept.ottavia-the-haze-line: ["the southern mossy tree forest and the mushroom hill. the mossy mushrooms. then Teodor. by Duru in the morning, out the west street at night. he'll have it to the pace."]
    questWaiting.ottavia-the-haze-line: ["where did it stand? i need the number."]
    questComplete.ottavia-the-haze-line: ["three paces further than yesterday. in pencil, then. ...it's the only line on this map i draw in pencil. i hate it."]
    questOffer.ottavia-a-name-on-the-map: ["the map's nearly done and it has no name. 'the forest' isn't a name. Larkin says the fairies have one and the glade keeps it. go and stand in Ellin's glade, in the deep fairy forest, then ask Larkin what you heard. i'll write it across the top."]
    questAccept.ottavia-a-name-on-the-map: ["east, through the eastern mossy tree forest, to the deep fairy forest. stand in the glade. listen. then Larkin. he'll know what you heard even if you don't."]
    questWaiting.ottavia-a-name-on-the-map: ["the name. i've left the top of the map blank. it's the only blank left."]
    questComplete.ottavia-a-name-on-the-map: ["Ellin's. ...Ellin's forest. there. across the whole top, as big as the paper goes. one day somebody will build a town under that name and never know why. i'll know."]
    questOffer.ottavia-green-ink: ["the mossy snails' shells, crushed, make a green that doesn't fade. fifteen shells? i'm out of green and this forest is mostly green."]
    questAccept.ottavia-green-ink: ["the mossy snails at the forest entrance, the western region, the east. the shells with moss still on."]
    questWaiting.ottavia-green-ink: ["fifteen shells. i'm drawing trees in brown. it's wrong."]
    questComplete.ottavia-green-ink: ["fifteen. green again. the trees look like trees."]
    about.teodor: ["Teodor walks the haze line every morning and tells me where it is. i draw it in pencil. he says that's the most honest line on the map."]
    about.larkin: ["Larkin was born in this forest. he doesn't need a map. it's very annoying. i ask him the way and he says 'left of the loud tree'."]
    about.gaspard: ["Gaspard cuts my corner stones. one at each corner of the map, on the ground, so the map and the forest agree. he carves a north on every one. i asked him to."]
    about.ewan: ["Ewan feeds forty people out of one pot and knows everyone's portion by heart. i've drawn his kitchen. it's the only square thing in the camp."]
    about.rosalind: ["Rosalind learned her trade from the fairies and picked up their manners. she sits on my map when she wants attention. she's left a glitter where she sat. i've decided it's a landmark."]
    about.maelis: ["Maelis came down off Boulder Mountain and told me my west was wrong. she was right. she's never once said so twice."]
    about.wren: ["a traveller out of the time gate says that later there's a woman in a great tree who keeps every old paper this forest ever made. if my map lasts that long, i hope it's on her shelf. i hope she's rude about my lettering."]
    aboutUnknown: ["not on the map."]
    friend.close: ["i've drawn you on the map. a very small figure, by the fire. nobody else gets to be on it."]
    friend.best: ["when the map's copied for the expedition, your name goes in the corner. where the cartographer signs. beside mine."]
    famed: ["the camp speaks well of you. i've noted it. in ink."]
    defamed: ["the camp speaks ill of you. i've noted it. in pencil."]
    gift: ["oh. thank you. noted."]
    gift.favorite: ["oh, that's useful. that's going straight into the map case."]
    gift.again: ["one a day. the map case is full."]

- id: larkin
  name: Larkin
  look: { gender: male }
  title: "Fairy-born Forager"
  job: BEGINNER
  level: { min: 42, max: 42 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: altaire-camp
    routine:
      - { from: 5, to: 9, spot: "venue:lower-east-street", activity: STROLL }
      - { from: 9, to: 15, materialize: false }
      - { from: 15, to: 20, spot: "venue:by-yuris", activity: SOCIALIZE }
      - { from: 20, to: 23, spot: "venue:lower-east-street-2", activity: REST }
      - { from: 23, to: 5, materialize: false }
  recruitable: false
  knows: [mossy snail, moss snail shell, deep fairy forest]
  questLines: [larkin-dew-shells, larkin-do-they-still-sing]
  relationships:
    - { persona: rosalind, kind: TOOK_TO_THE_GLADE }
    - { persona: ottavia, kind: GIVES_DIRECTIONS_TO }
    - { persona: thessaly, kind: ASKED_AFTER }
  giftItemIds: [4000436, 4000437]
  dialogue:
    greetFirst: ["oh. you're from the gate. you smell of stone stairs. sit down, the moss is dry here.", "hello. don't step there, there's a fairy asleep under that leaf. the other leaf. thank you."]
    greet: ["hello. the forest says you walked in from the west. it's a terrible gossip.", "you're back. i saved you a mushroom. it's the safe kind. probably."]
    idle: ["(sits very still with a hand flat on the moss, as if listening for something under it)", "(sorts a basket of mushrooms into piles no one else could tell apart)"]
    noWork: ["nothing today. the forest's busy. i'm staying out of its way."]
    nothingDue: ["you owe me nothing. the forest doesn't keep accounts. neither do i."]
    who: ["Larkin. i was found in a ring of mushrooms when i was very small and raised by the fairies until i got too big for the glade. now i forage for the camp. i know where everything grows. i know where everything hides."]
    bye: ["walk soft. the moss remembers footprints."]
    thanks: ["the leaves say thank you. so do i."]
    smallTalk: ["the fairies drink the dew out of empty snail shells in the morning. a whole row of them, like cups. the camp folk walk right past. i don't blame them. you have to be small to notice.", "the haze makes the mushrooms on the south hill go black. the fairies won't touch them. i won't either. Teodor touches everything. he wears gloves."]
    speakPlainly: ["plainly: mushrooms, moss, and a lot of very small friends."]
    questOffer.larkin-dew-shells: ["the fairies need more dew cups. the mossy snails leave their shells about, but never where the fairies are. twenty-five snails, twelve shells? i'll set them out in a row before dawn."]
    questAccept.larkin-dew-shells: ["the mossy snails. by the forest entrance, the first western region, and the east. they're slow. you'll feel bad. it passes."]
    questWaiting.larkin-dew-shells: ["twelve shells. the fairies are sharing. they hate sharing."]
    questComplete.larkin-dew-shells: ["twelve. a whole row of cups. ...tomorrow there'll be a fairy asleep in every one of them. they never drink from them. they sleep in them."]
    questOffer.larkin-do-they-still-sing: ["you go back through the gate, don't you? to later. will you ask someone there something for me? the fairies here sing at dusk. i want to know if they still do, later. if anybody's still listening."]
    questAccept.larkin-do-they-still-sing: ["back through the gate and over to wherever this forest goes, later. the travellers call it Ellinia. they say there's a woman up the great tree there who watches the fairies. Thessaly. ask her."]
    questWaiting.larkin-do-they-still-sing: ["do they still sing? you can tell me if they don't. i'd rather know."]
    questComplete.larkin-do-they-still-sing: ["every dusk. never stopped. ...good. good. i'm going to go and sit in the glade for a while. don't come. it's not sad. it's the other thing."]
    about.rosalind: ["Rosalind came out of Ossyria with a box of stones and no idea. i took her down to the glade. the fairies laughed at her settings for an hour and then taught her properly. she was always going to be the shiny one."]
    about.ottavia: ["Ottavia asks me the way and then writes it down very carefully. then she asks me again. i like her. she listens to the answer."]
    about.ewan: ["Ewan cooks whatever i bring him and never asks what it is. that's trust. or hunger."]
    about.teodor: ["Teodor is the only big one who goes near the haze on purpose. the fairies think he's very brave or very silly. they haven't decided."]
    about.maelis: ["Maelis brings the boars down off the mountain. the fairies hide when she walks past. she walks very quietly for someone so loud."]
    about.gaspard: ["Gaspard breaks stones. the stones don't mind. i asked them."]
    about.thessaly: ["a woman who watches the fairies, in the forest's later days. the travellers say she loses count. that's how you know she's doing it right."]
    aboutUnknown: ["the forest hasn't mentioned them."]
    friend.close: ["the fairies know your footsteps now. they don't hide from you. that's rare. that's very rare."]
    friend.best: ["if you're ever lost in this forest, sit down and say my name to the moss. i'll hear. i always do."]
    famed: ["the forest's talking about you. nicely."]
    defamed: ["the forest's talking about you. it'll forget. forests do."]
    gift: ["oh. for me? thank you."]
    gift.favorite: ["oh, that's lovely. that's going under the leaf where i keep things."]
    gift.again: ["you've already given me something. the leaf's only small."]

- id: ewan
  name: Ewan
  look: { gender: male }
  title: "Cook of the Camp"
  job: BEGINNER
  level: { min: 46, max: 46 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: altaire-camp
    routine:
      - { from: 5, to: 10, spot: "venue:by-mayoren", activity: LINGER }
      - { from: 10, to: 14, spot: "venue:lower-east-street", activity: SOCIALIZE }
      - { from: 14, to: 17, materialize: false }
      - { from: 17, to: 22, spot: "venue:lower-east-street-2", activity: SOCIALIZE }
      - { from: 22, to: 5, materialize: false }
  recruitable: false
  knows: [tree rod, tree trunk, primitive boar]
  questLines: [ewan-firewood, ewan-supper-for-the-mountain, ewan-the-woodpile]
  rumors: [altaire-supper-talk]
  relationships:
    - { persona: gaspard, kind: SUPS_WITH }
    - { persona: maelis, kind: SENDS_SUPPER_TO }
    - { persona: larkin, kind: COOKS_FOR }
  giftItemIds: [4000438, 2022001]
  dialogue:
    greetFirst: ["you're new. you're thin. sit down. there's a bowl. no, that's Gaspard's, he'll notice. that one.", "a traveller from the gate. have you eaten? you haven't. nobody comes through that gate fed."]
    greet: ["you're back. the pot's on. the pot's always on.", "hello. stew. don't ask what's in it. eat first, argue after."]
    idle: ["(stirs an enormous pot with a paddle, tastes, frowns, and adds a pinch of something black)", "(counts the camp's bowls on a plank, loses one, and counts them again)"]
    noWork: ["nothing today. the pot's full. that's a good day."]
    nothingDue: ["you owe me nothing. you owe the pot a clean bowl."]
    who: ["Ewan. i cook for the camp. forty mouths out of one pot, three times a day, in a forest where the firewood walks off on its own. we brought a lot of things out of Ossyria. we forgot the salt."]
    bye: ["take a heel of bread. take two. you look like a two."]
    thanks: ["eat something. that's thanks enough."]
    smallTalk: ["the tree rods walk off with the firewood. i'm not joking. i stacked a pile last night. this morning it was halfway to the mountain.", "the fairies steal honey off the bread. i've stopped minding. Yuris says they think it's a gift. i suppose it is now."]
    speakPlainly: ["plainly: one pot, forty bowls, never enough salt."]
    questOffer.ewan-firewood: ["i need firewood that stays where i put it. the tree rods west of camp burn slow and steady once they've stopped walking. twenty-five of them, twelve good trunks?"]
    questAccept.ewan-firewood: ["the western mossy tree forest and the trail. the tree rods. they'll come at you. trees shouldn't do that. it's this forest."]
    questWaiting.ewan-firewood: ["twelve trunks. the fire's down to twigs and stubbornness."]
    questComplete.ewan-firewood: ["twelve. dry and heavy. ...that'll last the week. here. and take a bowl. take it. you're thin."]
    questOffer.ewan-supper-for-the-mountain: ["Maelis never comes in to eat. she's out on the mountain till dark and then she sits by Tess and forgets. take her supper. it's boar. she'll pretend she doesn't want it."]
    questAccept.ewan-supper-for-the-mountain: ["she's by Tess in the evening, out the west street at dawn. tall, quiet, smells of the mountain. you'll know."]
    questWaiting.ewan-supper-for-the-mountain: ["did she eat it? don't tell me she didn't. tell me she did."]
    questComplete.ewan-supper-for-the-mountain: ["she'll come in when the mountain's quiet. ...it's never quiet. i'll keep sending it."]
    questOffer.ewan-the-woodpile: ["fifteen trunks for the woodpile? it walks off again by the end of the week. it always does."]
    questAccept.ewan-the-woodpile: ["the tree rods, west of camp."]
    questWaiting.ewan-the-woodpile: ["fifteen. the pot's waiting."]
    questComplete.ewan-the-woodpile: ["fifteen. stacked. i've tied this lot down."]
    about.gaspard: ["Gaspard eats like a quarry. i love him for it. you cook for forty, you want one who finishes everything."]
    about.maelis: ["Maelis brings in the boars and never stays for them. i send her supper every night. the bowl comes back clean. she's never once said a word about it."]
    about.larkin: ["Larkin brings me mushrooms i've never seen and tells me which ones won't kill me. he's been right every time. i still taste them last."]
    about.ottavia: ["Ottavia measured my kitchen. said it was the only square thing in camp. i've been unbearable about it since."]
    about.teodor: ["Teodor won't eat anything from the south hill. neither will i. he looks at my spice tin like it's a patient."]
    about.rosalind: ["Rosalind steals the shiny spoons. all of them. i've started making wooden ones. she's furious."]
    aboutUnknown: ["never fed them. that's a shame. somebody should."]
    friend.close: ["you've got your own bowl now. it's got a notch on the rim. nobody else uses it."]
    friend.best: ["if this camp ever becomes a town, there'll be an inn. you'll eat there for nothing. i'll see to it."]
    famed: ["the whole camp's talking about you. over supper, which means it's true."]
    defamed: ["the camp's grumbling about you. over supper. they grumble about the stew too. eat up."]
    gift: ["oh, thank you. into the pot it goes. figuratively."]
    gift.favorite: ["oh, that's useful. that's going straight in the kitchen."]
    gift.again: ["one a day. the kitchen's small."]

- id: teodor
  name: Teodor
  look: { gender: male }
  title: "Herbalist of the Poison Haze"
  job: BEGINNER
  level: { min: 52, max: 52 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: altaire-camp
    routine:
      - { from: 7, to: 12, spot: "venue:by-duru", activity: LINGER }
      - { from: 12, to: 17, materialize: false }
      - { from: 17, to: 19, spot: "venue:tent-house-2-door", activity: SOCIALIZE }
      - { from: 19, to: 22, spot: "venue:lower-west-street", activity: SOCIALIZE }
      - { from: 22, to: 7, materialize: false }
  recruitable: false
  knows: [mossy mushroom, black mushroom spore, ellin forest pq]
  questLines: [teodor-spores-under-glass, teodor-leather-masks, teodor-more-spores]
  rumors: [altaire-the-haze-line]
  relationships:
    - { persona: ottavia, kind: WALKS_THE_LINE_FOR }
    - { persona: larkin, kind: TAKES_ADVICE_FROM }
    - { persona: isolde, kind: HEARD_OF }
  giftItemIds: [4000437, 2050000]
  dialogue:
    greetFirst: ["don't come closer. no, you're fine. it's me. i've been in the haze this morning. give it an hour.", "a traveller from the gate. you look healthy. hold still. ...yes. healthy. good. that's rarer here than it ought to be."]
    greet: ["hello. still breathing? good. so am i. we're doing well.", "you again. let me see your hands. fine. fine. carry on."]
    idle: ["(holds a blackened mushroom cap up to the light with tweezers and writes three words in a little book)", "(ties a leather mask over his face, unties it, and sniffs the air in the direction of the south hill)"]
    noWork: ["nothing today. the haze is quiet. i don't trust it when it's quiet."]
    nothingDue: ["you owe me nothing. i haven't treated you. let's keep it that way."]
    who: ["Teodor. i was a herbalist in Ossyria. here i'm the man who walks into the haze in the morning and writes down what it's done. something deep in the forest breathes it out. it's poisoning the fairies' glade. it's poisoning everything, slowly. i'm trying to be quicker."]
    bye: ["breathe through your nose. stay out of the south."]
    thanks: ["noted. i'll put it in the book. the good column."]
    smallTalk: ["the haze breathes in at dawn and out at dusk. like something asleep. i've written that down and crossed it out four times. it keeps being true.", "some go deep into the forest of poison haze in fives and sixes and come back with little bright pieces of something. Rosalind won't say what. she goes very quiet when she sees them."]
    speakPlainly: ["plainly: a sick forest, a little book, and a lot of gloves."]
    questOffer.teodor-spores-under-glass: ["the mossy mushrooms nearest the haze have gone black. i want their spores under glass. twenty-five mushrooms, twelve black spores. i'll learn what the haze is from what it does."]
    questAccept.teodor-spores-under-glass: ["the southern mossy tree forest and the mushroom hill. the mossy mushrooms. don't breathe on the spores. don't breathe near them."]
    questWaiting.teodor-spores-under-glass: ["twelve spores. under glass, please. not in your pocket."]
    questComplete.teodor-spores-under-glass: ["twelve. ...look at that. the black is on the outside only. it's a coat. the haze is coating them, not changing them. that's the first good news i've had in a month."]
    questOffer.teodor-leather-masks: ["the camp needs masks. leather, soaked in spore tea. the haze can't get through boar hide. the primitive boars at Boulder Mountain. twenty of them, ten tough hides."]
    questAccept.teodor-leather-masks: ["west, to Boulder Mountain's entrance. the primitive boars. Duru fought them barehanded. look at Duru. don't do that."]
    questWaiting.teodor-leather-masks: ["ten hides. the children are breathing through their sleeves."]
    questComplete.teodor-leather-masks: ["ten. i'll cut them tonight. every child in camp gets one first. then Ewan, because he won't ask."]
    questOffer.teodor-more-spores: ["fifteen more black spores? the haze changes. so does the book."]
    questAccept.teodor-more-spores: ["the mushroom hill. under glass."]
    questWaiting.teodor-more-spores: ["fifteen."]
    questComplete.teodor-more-spores: ["fifteen. thank you. the book grows."]
    about.ottavia: ["Ottavia asks me where the haze line is every evening and draws it in pencil. she hates the pencil. i think the pencil is the bravest thing on her map."]
    about.larkin: ["Larkin knows what the haze does to the fairies before the fairies do. i ask him first. it saves a morning."]
    about.ewan: ["Ewan feeds the whole camp and eats last. i've told him that's a symptom. he laughed. it is a symptom."]
    about.rosalind: ["Rosalind won't go near the south hill. the fairies taught her to feel bad air in her teeth. she pretends it's because the light's bad there."]
    about.maelis: ["Maelis brings Duru's boars down off the mountain one at a time. she won't say it's for him. it's for him."]
    about.gaspard: ["Gaspard's hands are made of stone dust and patience. he holds the jars for me when mine shake. mine shake."]
    about.isolde: ["a healer at the top of a great tree, the travellers say, later. people who swore they'd be careful. i'd like to leave her my notes on the haze. somebody should have them when i'm gone."]
    aboutUnknown: ["not in the book."]
    friend.close: ["i've cut you a mask. your size. hang it by the door. you'll never need it. hang it anyway."]
    friend.best: ["if the haze ever goes, you'll be the first i tell. before the book. that's a promise."]
    famed: ["the camp speaks well of you. good. that's a healthy sign."]
    defamed: ["the camp speaks ill of you. that's a symptom too. of what, i don't know yet."]
    gift: ["thank you. careful. thank you."]
    gift.favorite: ["oh, that's useful. that's going under glass. in a good way."]
    gift.again: ["one a day. i've only so much glass."]

