    greetFirst: ["oh, a new face. hold still. your ears. hm. your ears want something. i'll think about it.", "you came out of the gate. your buttons are dull. everybody from later has dull buttons. what happens to you people?"]
    greet: ["hello. turn to the light. no, the other way. better.", "you're back. i've been polishing. i'm always polishing. it's that or think."]
    idle: ["(holds a tiny stone up between two fingers and turns it slowly in the light, humming)", "(rubs a camp spoon on her sleeve until it shines, then tucks it into her apron with a guilty look)"]
    noWork: ["nothing today. the light's flat. you can't set a stone in flat light."]
    nothingDue: ["you owe me nothing. bring me something shiny sometime. that's not a debt. it's a hint."]
    who: ["Rosalind. i was a jeweller's girl in Ossyria. i came out with the expedition carrying a box of stones and no proper tools. the fairies in Ellin's glade watched me make a mess of it and showed me their way. now i set stones the fairy way, for anyone in camp who asks. it's a long way from home for all of us. a bright thing helps."]
    bye: ["mind your ears. i'll want them later."]
    thanks: ["mm. it suits you, being thankful."]
    smallTalk: ["one stone in a hundred that the stone bugs grind up has a glint in it. one. Gaspard brings me the rubble by the sack. we sit and sift. it's the best part of my week.", "the inside of a mossy snail's shell is the colour of the moon on water. the camp throws the shells away. i could weep."]
    speakPlainly: ["plainly: stones, light, and ears that want earrings."]
    questOffer.rosalind-a-glint-in-the-rubble: ["the stone bugs on the trail chew up stone and leave rubble. there's a glint in some of it. twenty-five bugs, twelve handfuls of rubble? i'll sift. you'll see."]
    questAccept.rosalind-a-glint-in-the-rubble: ["the mossy tree forest trail and the southern regions. the stone bugs. they're slow and crunchy. don't step on the glints."]
    questWaiting.rosalind-a-glint-in-the-rubble: ["twelve handfuls. i've a sieve ready. i've had it ready for days."]
    questComplete.rosalind-a-glint-in-the-rubble: ["twelve. ...there. and there. two glints. two in twelve is a very good day. hold out your hand. no. keep it. it's yours. it's tiny. it's yours."]
    questOffer.rosalind-moonstar-earrings: ["your ears have waited long enough. the Moonstar. a star of glint in a moon of shell. the mossy snails' shells, the insides. thirty snails, fifteen shells, and i'll set them tonight."]
    questAccept.rosalind-moonstar-earrings: ["the mossy snails, at the forest entrance, the western region, the east. bring the shells whole. a crack ruins the moon."]
    questWaiting.rosalind-moonstar-earrings: ["fifteen whole shells. whole. i'll know."]
    questComplete.rosalind-moonstar-earrings: ["there. Moonstar. a little moon, a little star, every charm i know poured in and every one took. turn your head. ...oh, yes. i knew your ears wanted something."]
    questOffer.rosalind-altair-earrings: ["the Altair next. a bright star wants amber behind it, and the only amber in this forest is in the heart of the walking trees. thirty tree rods, fifteen trunks. i'll split them for the amber."]
    questAccept.rosalind-altair-earrings: ["the western mossy tree forest and the trail. the tree rods. the heartwood is the gold bit. bring the whole trunk."]
    questWaiting.rosalind-altair-earrings: ["fifteen trunks. i can smell the amber in them from here."]
    questComplete.rosalind-altair-earrings: ["amber behind the star. the Altair. i charmed it as far as it would go and every charm held. it's warm, isn't it? it'll stay warm."]
    questOffer.rosalind-glittering-altaire-earrings: ["the last one. the Glittering Altaire. it wants a backing that never tears, boar hide from the mountain, and it wants the light from Ellin's glade in it, so it glitters for as long as there's a forest. thirty primitive boars, fifteen hides. then carry them through the glade."]
    questAccept.rosalind-glittering-altaire-earrings: ["west to Boulder Mountain for the boars. then east, all the way, to the deep fairy forest. stand in the glade with the hides in your pack. the light gets into everything there. then bring them to me."]
    questWaiting.rosalind-glittering-altaire-earrings: ["fifteen hides, and the glade. don't skip the glade. the glade is the glitter."]
    questComplete.rosalind-glittering-altaire-earrings: ["oh, look. the glade's still on them. ...the Glittering Altaire. i pushed two charms past where charms should go and they held, and the rest held after. i've never made anything better. i won't again. wear them where there's light."]
    about.larkin: ["Larkin took me down to the glade the first week we camped. the fairies laughed at my settings for an hour, then taught me properly. every stone i've set since, i owe him a little."]
    about.ewan: ["Ewan's spoons are the shiniest things in camp. were. he makes wooden ones now. i'm told it's my fault."]
    about.ottavia: ["Ottavia lets me sit on her map. i leave a little glitter where i sat. she's started drawing it in. that's a kind of love."]
    about.teodor: ["Teodor goes into the haze every morning. i can't. the fairies taught me to feel bad air, and the south hill is all bad air. i set him a little stone for luck. he wears it inside his glove. i checked."]
    about.maelis: ["Maelis wears nothing shiny. not one thing. she says the boars see it. i've offered her a stone the colour of mud. she's thinking about it."]
    about.gaspard: ["Gaspard brings me rubble by the sackful and sits with me while i sift. he never asks for the glints. he likes watching me find them."]
    about.perrin: ["a jeweller in a city in the clouds, later. a traveller wore his earrings through the gate. the stone was lovely. the setting was heavy. tell him a fairy-taught jeweller said so. he'll be furious. good."]
    aboutUnknown: ["never set a stone for them."]
    friend.close: ["i've set a tiny stone just for you. it's on my shelf. it's waiting until you need it. you'll know when."]
    friend.best: ["when i'm very old, every stone i ever set will still be shining somewhere. yours will be the brightest. i'll have made sure."]
    famed: ["they're saying lovely things about you. you sparkle a bit. it suits you."]
    defamed: ["they're saying dull things about you. dull things wash off. polish."]
    gift: ["oh! for me? thank you."]
    gift.favorite: ["oh, that's perfect. that's going straight under the lamp."]
    gift.again: ["one a day. the lamp's only so big."]

- id: maelis
  name: Maelis
  look: { gender: female }
  title: "Huntress of Boulder Mountain"
  job: HUNTER
  level: { min: 56, max: 58 }
  strength: VETERAN
  loadout: altaire-bow-l56
  personality: efficient-v1
  home:
    town: altaire-camp
    routine:
      - { from: 5, to: 9, spot: "venue:lower-west-street", activity: LINGER }
      - { from: 9, to: 17, materialize: false }
      - { from: 17, to: 21, spot: "venue:by-tess", activity: SOCIALIZE }
      - { from: 21, to: 5, materialize: false }
  recruitable: true
  knows: [primitive boar, tough leather, boulder mountain entrance]
  contract: maelis-the-mountain-share
  questLines: [maelis-the-boar-trail, maelis-icarus-cape-one, maelis-icarus-cape-two, maelis-icarus-cape-three, maelis-boar-hides]
  benchToleranceDays: 2
  paceGap: 3
  relationships:
    - { persona: ewan, kind: GETS_SUPPER_FROM }
    - { persona: ottavia, kind: CORRECTED_THE_MAP_OF }
    - { persona: gaspard, kind: HUNTS_BESIDE }
  giftItemIds: [4000440, 2060001]
  dialogue:
    greetFirst: ["you came through the gate. you walk like it. heavy. the boars will hear you a mile off.", "stranger. don't stand upwind of me. the mountain's on my clothes."]
    greet: ["you.", "back. the mountain's loud today."]
    idle: ["(checks the fletching on an arrow, one feather at a time, and sights down the shaft)", "(sits with her back to Tess's post, cape pulled round her, watching the west road)"]
    noWork: ["nothing today. the boars are bedded down. so's the mountain."]
    nothingDue: ["square."]
    who: ["Maelis. i hunt Boulder Mountain. i was up there before the camp came, and i'll be up there after. the boars came down on Duru and broke him. they don't come down anymore."]
    bye: ["walk light."]
    thanks: ["fine."]
    smallTalk: ["the primitive boars give up their hide six times in ten. tough leather. Teodor wants it for masks. Ewan wants the rest of them. i want them off the mountain.", "i jump off the boulders. a cape catches the wind if it's cut right. i've broken two ankles finding out how to cut it right."]
    speakPlainly: ["plainly: a bow, a mountain, and the boars on it."]
    offer: ["thirty thousand, and sixty of the mountain's boars down before we go. i don't walk with people who haven't."]
    join: ["fine. keep behind me. don't talk on the climb."]
    bench: ["two days. after that the mountain starts forgetting me. i won't have that."]
    leave: ["done. back to the mountain."]
    refuse.bond: ["i don't know you. the mountain doesn't either."]
    refuse.flags: ["walk the boar trail with me once. thirty primitive boars at Boulder Mountain's foot. then we'll talk."]
    refuseOwnErrand: ["my hunt. you can carry the arrows."]
    questOffer.maelis-the-boar-trail: ["thirty primitive boars on the mountain's foot. they've started coming down toward the camp again. walk the trail. come back. that's all."]
    questAccept.maelis-the-boar-trail: ["west, past the trail, to Boulder Mountain's entrance. they charge. step left. always left."]
    questWaiting.maelis-the-boar-trail: ["thirty. the trail's not walked till it's walked."]
    questComplete.maelis-the-boar-trail: ["thirty. ...you stepped left. good. the boars will stay up a while. Duru can sleep."]
    questOffer.maelis-icarus-cape-one: ["you want to come up the mountain properly, you need a cape that catches. ribs of light wood, like a bat's wing. the walking trees' trunks are the lightest wood here. thirty tree rods, fifteen trunks. i'll cut it."]
    questAccept.maelis-icarus-cape-one: ["the western mossy tree forest and the trail. the tree rods. straight trunks. crooked ones spin you."]
    questWaiting.maelis-icarus-cape-one: ["fifteen. straight ones."]
    questComplete.maelis-icarus-cape-one: ["there. ribs set, every stitch holding. the first one i ever cut that didn't drop me. don't jump off anything higher than a tent. yet."]
    questOffer.maelis-icarus-cape-two: ["the second cape wants a skin that won't tear in the wind. boar hide. thirty primitive boars, fifteen tough hides. you know the trail."]
    questAccept.maelis-icarus-cape-two: ["Boulder Mountain's entrance. you've done it. do it again. step left."]
    questWaiting.maelis-icarus-cape-two: ["fifteen hides. the wind's waiting."]
    questComplete.maelis-icarus-cape-two: ["skinned and stretched. it took more than half the stitching and held anyway. that'll catch a real gust. you could jump off the mountain's shoulder with that. i did."]
    questOffer.maelis-icarus-cape-three: ["the last one. black, so it drinks the sun and the warm air lifts it. the mossy mushrooms' black spores, boiled, give the only black that holds. thirty mushrooms, fifteen spores. then go and stand at the mountain's foot, at the drop where i first jumped. then come back."]
    questAccept.maelis-icarus-cape-three: ["the southern forest and the mushroom hill for the spores. mind the haze. then Boulder Mountain's entrance. stand where it drops. you'll know the place."]
    questWaiting.maelis-icarus-cape-three: ["fifteen spores, and the drop. both."]
    questComplete.maelis-icarus-cape-three: ["you stood at the drop. ...good. the third cape. two stitches i shouldn't have risked held, and the rest after them. that's the one i'd jump off the top in. you're the only other one who'll have it."]
    questOffer.maelis-boar-hides: ["fifteen tough hides? Teodor's out again. the camp's breathing through them."]
    questAccept.maelis-boar-hides: ["the mountain's foot."]
    questWaiting.maelis-boar-hides: ["fifteen."]
    questComplete.maelis-boar-hides: ["fifteen. to Teodor. go on."]
    about.ewan: ["Ewan sends my supper every night. i don't go in. i eat it on the mountain. the bowl goes back clean. that's thanks. he knows."]
    about.ottavia: ["Ottavia had the mountain three hundred paces too far east. i told her. she fixed it the same night. she's all right."]
    about.gaspard: ["Gaspard comes up the trail with me sometimes. he breaks the stones the boars hide behind. he's loud. the boars don't care. he's useful."]
    about.larkin: ["Larkin knows every bush on the mountain. he won't tell me where the boars bed down. says it's their business. he's not wrong."]
    about.teodor: ["Teodor makes masks out of my hides. he gives them to the children first. i bring him more."]
    about.rosalind: ["the jeweller wants to give me a stone. i don't wear shiny. she's found one the colour of mud. i might."]
    aboutUnknown: ["never seen them on the mountain."]
    friend.close: ["you can come up the mountain without me now. the boars know your step. so do i."]
    friend.best: ["if i ever don't come down off the mountain, the cape's yours. the real one. the one i jump in."]
    famed: ["they talk about you. fine."]
    defamed: ["they talk about you. the mountain doesn't."]
    gift: ["oh. thanks."]
    gift.favorite: ["that's useful. that goes in the pack."]
    gift.again: ["one's enough."]

- id: gaspard
  name: Gaspard
  look: { gender: male }
  title: "Stone-Breaker"
  job: PAGE
  level: { min: 53, max: 55 }
  strength: SEASONED
  loadout: altaire-2h-sword-l53
  personality: relaxed-v1
  home:
    town: altaire-camp
    routine:
      - { from: 6, to: 10, spot: "venue:by-perzen", activity: LINGER }
      - { from: 10, to: 16, materialize: false }
      - { from: 16, to: 21, spot: "venue:lower-east-street-2", activity: SOCIALIZE }
      - { from: 21, to: 6, materialize: false }
  recruitable: true
  knows: [stone bug, rubble, mossy tree forest trail]
  contract: gaspard-day-rate
  questLines: [gaspard-the-trail-stones, gaspard-a-north-for-the-stone, gaspard-rubble-for-perzen]
  rumors: [altaire-supper-talk]
  benchToleranceDays: 3
  paceGap: 3
  relationships:
    - { persona: ewan, kind: SUPS_WITH }
    - { persona: ottavia, kind: CUTS_CORNER_STONES_FOR }
    - { persona: rosalind, kind: SIFTS_RUBBLE_WITH }
  giftItemIds: [4000439, 4010001]
  dialogue:
    greetFirst: ["mind your head. no, it's fine. there's nothing above it. i just like saying it.", "a traveller. you've come out of the gate with a long face. everyone does. sit on this rock. it's a good rock. i checked."]
    greet: ["hello! i broke a big one this morning.", "you again. good. i was just talking to this stone. it's not much of a talker."]
    idle: ["(taps a boulder all over with a knuckle, listening, then nods at one spot and marks it with chalk)", "(leans on a great two-handed sword, its point resting on a split boulder, and watches the treeline with great contentment)"]
    noWork: ["nothing today. every stone in camp is the right size. that's never happened."]
    nothingDue: ["you owe me nothing. you owe the rock an apology. you sat on it funny."]
    who: ["Gaspard. i break stones. somebody has to, if we're going to build anything here. every stone's got a crack in it somewhere. you find it, you ask it nicely, with the flat of a big sword, and it opens up. people are the same. mostly without the sword."]
    bye: ["watch your toes. i'm swinging."]
    thanks: ["ha! go on. it was nothing. it was a rock."]
    smallTalk: ["the stone bugs on the trail eat the stone i cut. they think it's lunch. i think it's a wall. we've been arguing about it for a month.", "Perzen says he can turn rubble into something wonderful. i bring it by the sack. it's still rubble after. it hums now, though. i'll give him that."]
    speakPlainly: ["plainly: a big sword, a lot of stone, and a wall that isn't built yet."]
    offer: ["forty-five thousand a day. i'll break whatever's in your way. stones, mostly. other things, if they're rude."]
    join: ["ha! good. i'll walk in front. things bounce off me."]
    bench: ["three days. then i get restless and start breaking things that aren't mine."]
    leave: ["that's the day. i'll go and see if my stones missed me."]
    refuse.bond: ["i don't swing next to strangers. it's how you lose a stranger."]
    refuse.flags: ["walk the trail with me first. clear the stone bugs off my cut stone, thirty of them. then ask."]
    refuseOwnErrand: ["my stone. you can watch. it's very satisfying."]
    questOffer.gaspard-the-trail-stones: ["the stone bugs are eating my cut stone on the trail again. thirty of them, please. don't bring me anything. just bring my wall back."]
    questAccept.gaspard-the-trail-stones: ["the mossy tree forest trail and the southern regions. the stone bugs. they crunch. you get used to it. i got used to it."]
    questWaiting.gaspard-the-trail-stones: ["thirty. my wall's getting smaller."]
    questComplete.gaspard-the-trail-stones: ["thirty! ha. my wall's still there. most of it. that's the best news a wall's had all month."]
    questOffer.gaspard-a-north-for-the-stone: ["i've cut a corner stone for Ottavia's map. big one. she wants it on the ground somewhere so the forest and the map agree. ask her where. i'll carry it. i always carry it."]
    questAccept.gaspard-a-north-for-the-stone: ["Ottavia. high up on the top street in the mornings, by Sion's tent in the afternoon, out west at night. ask her where the stone goes."]
    questWaiting.gaspard-a-north-for-the-stone: ["where does it go? i'm holding it. i'm not holding it. but i'm ready to."]
    questComplete.gaspard-a-north-for-the-stone: ["where the trail bends to the mountain, with a north carved on it. ha! i like a stone with a job. i'll carve the north tonight. big. so the forest can read it."]
    questOffer.gaspard-rubble-for-perzen: ["fifteen sacks of rubble for Perzen? well, fifteen handfuls. he does magic on it. it hums."]
    questAccept.gaspard-rubble-for-perzen: ["the stone bugs on the trail. they leave rubble everywhere."]
    questWaiting.gaspard-rubble-for-perzen: ["fifteen."]
    questComplete.gaspard-rubble-for-perzen: ["fifteen. Perzen will be thrilled. the rubble won't."]
    about.ewan: ["Ewan makes the best stew in the forest. it's the only stew in the forest. it'd still be the best."]
    about.ottavia: ["Ottavia's map has my stones at its corners. i've never been on a map before. i'm on a map now. well, my stones are."]
    about.rosalind: ["Rosalind sifts my rubble for glints. she finds one, she lights up like a lamp. i'd break the whole mountain for that face. don't tell her."]
    about.maelis: ["Maelis lets me come up the trail with her if i'm quiet. i'm never quiet. she lets me anyway."]
    about.larkin: ["Larkin talks to stones. i asked him what they say. he said they say 'ow'. i've felt bad all week."]
    about.teodor: ["Teodor's hands shake after the haze. i hold his jars. he holds his breath. it's a system."]
    aboutUnknown: ["never broke a stone with them."]
    friend.close: ["i've cut a little stone with your name on it. it's in the wall. you're part of the wall now."]
    friend.best: ["if they ever build a town here, the first stone's got your name on the underside. nobody'll see it. i'll know."]
    famed: ["they're saying good things about you! loudly. like me."]
    defamed: ["they're saying hard things about you. hard things break. ask me."]
    gift: ["ha! thank you."]
    gift.favorite: ["oh, that's useful. that's going in the tool sack."]
    gift.again: ["one a day! the sack's heavy enough."]
