  dialogue:
    greetFirst: ["you're in my line of sight. that's fine. stay there.", "new. hm. most people forget this place. i don't."]
    greet: ["you.", "back. still remembered.", "hm. hello."]
    idle: ["(runs a thumb along a name scratched into the stock of her crossbow, and doesn't look at it)", "(sights down the street at the far door, holds, breathes out, lowers the bow)"]
    noWork: ["nothing today. the road's quiet. it's never quiet."]
    nothingDue: ["even."]
    who: ["Liesl. i hunt the roads past the far door, a little farther every year. the Road to Oblivion takes things. people. names. it's not taking any more while i'm watching."]
    bye: ["remember yourself."]
    thanks: ["hm. thanks."]
    smallTalk: ["the memory monks on Memory Lane's first stretch wear green cloth. i wind it round the stock. it keeps my grip if my hands shake. they don't shake.", "i had a brother. Anselm. he walked the Road to Oblivion. everybody in our village had forgotten him by spring. his name's on my crossbow so i can't."]
    speakPlainly: ["plainly: one crossbow, one name."]
    offer: ["fifty thousand, and twenty-five lengths of green cloth off the memory monks. i go through it. then i'll cover you as far as you like."]
