    bench: ["three days. then the road."]
    leave: ["back to the road."]
    refuse.bond: ["no. i don't know you yet. i keep the people i know. i'm careful who that is."]
    refuse.flags: ["walk Memory Lane's first stretch with me once. and some evening on the lower west street, hear what Caedmon says about me. then ask."]
    refuseOwnErrand: ["my road first. walk it with me."]
    questOffer.liesl-the-first-road: ["start where everyone starts. Memory Lane, the first stretch. thirty memory monks, twelve lengths of their green cloth for my grip. i'll see how you walk."]
    questAccept.liesl-the-first-road: ["the near door, through the Past of the Verdure. the monks are slow. you shouldn't be."]
    questWaiting.liesl-the-first-road: ["twelve lengths. keep walking."]
    questComplete.liesl-the-first-road: ["twelve. you walk well. you'd last on the far road. hm. good."]
    questOffer.liesl-rose-earrings: ["thirty monk trainees on Memory Lane's second stretch. then stop at the resting spot after it and sit a minute. hear nothing. it's the quietest place in time. then come back. i've a pair of rose earrings that want wearing."]
    questAccept.liesl-rose-earrings: ["Memory Lane, the second stretch, then the resting spot. sit. listen. you'll see."]
    questWaiting.liesl-rose-earrings: ["thirty, and the resting spot. don't skip the sitting."]
    questComplete.liesl-rose-earrings: ["you sat. good. the rose earrings. every safe scroll they'd take, every one took. Anselm bought them for a girl. she forgot him by spring and gave them back without knowing why she had them. they should be worn by somebody."]
    questOffer.liesl-sword-earrings: ["the qualm monks on the Road of Regrets' first stretch. thirty, and fifteen lengths of blue cloth. i'm making a sling for the long shots. there's a pair of sword earrings in it for you."]
    questAccept.liesl-sword-earrings: ["the far door, the Road of Regrets. the monks there carry what they're sorry for. it slows them. don't let it slow you."]
    questWaiting.liesl-sword-earrings: ["fifteen. blue."]
    questComplete.liesl-sword-earrings: ["fifteen. the sword earrings. scrolled at sixty, every one took. sharp. like you."]
    questOffer.liesl-one-line: ["walk the Road to Oblivion. thirty monks on the first stretch, twenty guardians past them. then ask Osmund one thing for me: is there a line in the records for Anselm. i've never asked. i can't. you can."]
    questAccept.liesl-one-line: ["the far door, past the Burning Past. the road will try to make you forget why you came. you came for Anselm. hold on to that."]
    questWaiting.liesl-one-line: ["did you ask him? don't tell me yet. finish the road first."]
    questComplete.liesl-one-line: ["'walked to the end of the road. remembered by one.' ...by one. that's me. that's enough to keep a line. the timeless earrings. two tens and the rest at sixty, every one took. wear them. remember him a little too. that makes two."]
    questOffer.liesl-the-grip: ["ten lengths of green cloth? the grip's worn."]
    questAccept.liesl-the-grip: ["Memory Lane, the first stretch."]
    questWaiting.liesl-the-grip: ["ten."]
    questComplete.liesl-the-grip: ["ten. good grip. thanks."]
    about.caedmon: ["Caedmon guards doors. he stands so still the Eyes of Time forget he's there. i asked him how. he said 'practice'. he doesn't know either."]
    about.solveig: ["Solveig has walked the Road of Regrets more than anyone. once she asked me what's at the end of mine. i said nobody knows. she said that's the trouble with roads."]
    about.osmund: ["Osmund writes down the names i bring him from the far road, so they're somewhere. he says it isn't his work. he does it every time."]
    about.ilsabet: ["Ilsabet talks. a lot. i don't mind. somebody should fill the quiet up here, and it's never going to be me."]
    about.runa: ["Runa keeps the canyon road in Leafre. we've shared a fire twice. nine words between us. it was a good evening."]
    aboutUnknown: ["never heard the name. i'll remember it, though."]
    friend.close: ["you're on my crossbow. not carved. i'm saying i'd cover you. that's what i mean."]
    friend.best: ["if the far road ever takes you, i'll remember you. i'll make everybody else remember too. i'm good at it."]
    famed: ["people say your name up here. good. say it louder. names last when they're said."]
    defamed: ["people say things. i stopped listening to people. i listen to the road."]
    gift: ["hm. thanks."]
    gift.favorite: ["that's a good one. i'll keep it for the far road."]
    gift.again: ["one. i travel light."]
