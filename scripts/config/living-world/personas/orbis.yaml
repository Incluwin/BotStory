# Orbis cast: the city that waits. 7 residents, 2 recruitable (Vesna the warden for a kill proof, Ansel the hunter for
# meso), 1 arc (Corliss's unclosed page, which runs on into El Nath through Ottilie's son Edric). Ids in quests/orbis.yaml.
- id: corliss
  name: Corliss
  look: { gender: male }
  title: "Stationmaster"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: orbis
    routine:
      - { from: 5, to: 12, spot: "venue:station-entrance-door", activity: LINGER }
      - { from: 12, to: 14, spot: "venue:middle-central-benches", activity: REST }
      - { from: 14, to: 19, spot: "venue:station-entrance-door", activity: LINGER }
      - { from: 19, to: 22, spot: "venue:top-of-the-hill-door", activity: SOCIALIZE }
      - { from: 22, to: 5, materialize: false }
  recruitable: false
  knows: [orbis, ellinia]
  questLines: [corliss-lamps-for-the-platform, corliss-the-unclosed-page, corliss-the-last-name, corliss-brass-rails]
  arc: corliss-the-unclosed-page
  rumors: [orbis-the-page-read-aloud]
  relationships:
    - { persona: ottilie, kind: OWES_AN_ANSWER }
    - { persona: fitch, kind: EMPLOYS }
    - { persona: oda, kind: OTHER_END_OF_THE_LINE }
  giftItemIds: [2022039, 4000059]
  dialogue:
    greetFirst: ["name? i write down everyone who comes through. it's not suspicion. it's the ledger.", "you came up from the station. i'd have seen you if you came any other way. i see everything that comes by air."]
    greet: ["you're in the ledger. you're always in the ledger.", "on time. one of us is."]
    idle: ["(runs a finger down a column of names, lips moving)", "(checks the sky, then a pocket watch, then the sky again)"]
    noWork: ["nothing to log but weather. weather doesn't sign."]
    nothingDue: ["your line's ruled off. square."]
    who: ["Corliss. stationmaster. every passenger that leaves or lands in Orbis has a line in my book. every line has an end. nearly every."]
    bye: ["mind the gap. there's quite a lot of it up here."]
    thanks: ["noted. in pencil. i'll ink it later."]
    smallTalk: ["the Ellinia ship is the oldest line. Oda keeps the other end. we've never met. we write.", "eleven years on this platform and the sky's never once been late. the ships are always late."]
    speakPlainly: ["plainly: people leave, people land. i write it down."]
    questOffer.corliss-lamps-for-the-platform: ["the platform lamps burn sentinel oil, and the sentinels in the tower keep it in their shells. twenty-five jr. sentinels on the top floors, and fifteen shellpieces?"]
    questAccept.corliss-lamps-for-the-platform: ["the tower entrance is past the park. the top floors are the twentieth down to the eighteenth. they count backwards. so does everything in that tower."]
    questWaiting.corliss-lamps-for-the-platform: ["fifteen shellpieces. the evening ship lands in the dark otherwise."]
    questComplete.corliss-lamps-for-the-platform: ["fifteen. the platform's lit for a month. i'll write your name next to the lamps. it's not official. it should be."]
    questOffer.corliss-the-unclosed-page: ["there's a page in my ledger i never ruled off. the evening ship from Ellinia, eleven years ago. the night the crimson balrog came aboard. ride to Ellinia and ask Oda who she put on it."]
    questAccept.corliss-the-unclosed-page: ["Oda keeps the Ellinia end. she'll have a manifest. she always has a manifest. we're alike that way."]
    questWaiting.corliss-the-unclosed-page: ["did Oda remember? she remembers everything. it's a burden for both of us."]
    questComplete.corliss-the-unclosed-page: ["eleven boarded in Ellinia. ten landed here, alive or carried. one name never arrived and was never found. Edric. Ottilie's boy. i've never been able to write 'lost' next to it."]
    questOffer.corliss-the-last-name: ["Ottilie came to the platform this morning with a letter in both hands. from El Nath. i need to hear it from her before i write anything. would you ask her for me? i can't."]
    questAccept.corliss-the-last-name: ["she'll be on the hill steps. she's always on the hill steps."]
    questWaiting.corliss-the-last-name: ["the pen's been out all day. i keep putting it down."]
    questComplete.corliss-the-last-name: ["'arrived, eleven years late.' in red. i've never used red. the page is closed. ...i thought it would feel like losing something."]
    questOffer.corliss-brass-rails: ["the brass rails on the platform want polishing, and nothing polishes like ice sentinel shell, ground fine. fifteen pieces?"]
    questAccept.corliss-brass-rails: ["ice sentinels keep to the thirteenth floor, mostly. cold creatures. good polish."]
    questWaiting.corliss-brass-rails: ["fifteen. the rails are dull. passengers notice dull."]
    questComplete.corliss-brass-rails: ["fifteen. the rails will shine by the evening ship."]
    about.ottilie: ["Ottilie meets the evening ship every night. she doesn't get on it. she doesn't expect anyone off it. she just meets it."]
    about.fitch: ["Fitch runs the post down to El Nath on foot. four thousand steps. i pay him by the letter. he'd do it for free. don't tell him."]
    about.oda: ["Oda keeps the Ellinia end of my line. her letters are shorter than mine. i've been trying to learn from that for nine years."]
    about.vesna: ["Vesna keeps the pixies off the platform. the pixies keep off Vesna. i've seen her count them out loud."]
    about.edric: ["Edric. it's a name in my ledger. it's on a page i couldn't close. ask Ottilie. no, don't. not unless she brings him up."]
    aboutUnknown: ["not in my ledger. they came by some other way."]
    friend.close: ["you have your own page in my ledger now. it has no end ruled under it. i like it that way."]
    friend.best: ["every name in the book is a name. yours is the one i look for when the ship comes in."]
    famed: ["...i'll log that. in ink."]
    defamed: ["logged. in pencil. pencil rubs out."]
    gift: ["thank you. it's going in the desk drawer, which means i like it."]
    gift.favorite: ["oh. for me. i'll keep it by the ledger for the evening ship. you noticed. people don't."]
    gift.again: ["one a day. i keep a ledger of those too."]

- id: ottilie
  name: Ottilie
  look: { gender: female }
  title: "Keeper of the Hill Steps"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: orbis
    routine:
      - { from: 7, to: 11, spot: "venue:by-moppie", activity: LINGER }
      - { from: 11, to: 17, spot: "venue:middle-central-benches", activity: REST }
      - { from: 17, to: 22, spot: "venue:top-of-the-hill-door", activity: LINGER }
      - { from: 22, to: 7, materialize: false }
  recruitable: false
  knows: [orbis]
  questLines: [ottilie-flowers-for-the-steps, ottilie-a-lamp-in-the-window]
  rumors: [orbis-the-page-read-aloud]
  relationships:
    - { persona: corliss, kind: WAITS_WITH }
    - { persona: edric, kind: MOTHER_OF }
    - { persona: aster, kind: FRIEND }
  giftItemIds: [4000058, 2022039]
  dialogue:
    greetFirst: ["oh, a new face on the steps. sit, if you like. the view's the only thing up here that's free.", "you've come a long way up. everyone has, here."]
    greet: ["there you are. i was hoping it'd be you.", "hello, dear. the evening ship's not in yet."]
    idle: ["(sweeps a step that is already clean)", "(watches the sky toward Ellinia, then smiles at no one)"]
    noWork: ["nothing needs doing that can't wait for tomorrow. most things can, up here."]
    nothingDue: ["you owe me nothing. a visit now and then, if you're passing."]
    who: ["Ottilie. i keep the hill steps tidy and i meet the evening ship. somebody ought to meet it."]
    bye: ["safe road, dear. write to someone."]
    thanks: ["oh, don't. it was nothing. it was lovely."]
    smallTalk: ["i plant flowers along the steps so the people coming up have something to look at besides the drop.", "the goddess on the tower sleeps, they say. i don't mind. i'm good at waiting for people to wake up."]
    speakPlainly: ["simply put: i wait. i'm good at it."]
    questOffer.ottilie-flowers-for-the-steps: ["the nependeaths on the strolling path carry the best seeds. they bite, mind. twenty-five of them and fifteen seeds, and the steps bloom by spring."]
    questAccept.ottilie-flowers-for-the-steps: ["the strolling path is below the cloud parks. you'll smell it before you see it."]
    questWaiting.ottilie-flowers-for-the-steps: ["fifteen seeds, dear. i've dug the holes already."]
    questComplete.ottilie-flowers-for-the-steps: ["fifteen. i'll put the first one at the top step. that's where he used to sit."]
    questOffer.ottilie-a-lamp-in-the-window: ["i keep a lamp in my window. star pixie pieces burn the longest. twelve of them, if you're in the cloud park anyway?"]
    questAccept.ottilie-a-lamp-in-the-window: ["the little ones in the first park. they don't mean any harm. they just like shiny things."]
    questWaiting.ottilie-a-lamp-in-the-window: ["twelve. the lamp's on its last one."]
    questComplete.ottilie-a-lamp-in-the-window: ["twelve. that's a month of evenings with a light on. thank you, dear."]
    about.corliss: ["Corliss writes everything down so he doesn't have to say it. we understand each other."]
    about.edric: ["my boy. he took the evening ship from Ellinia when he was seventeen. he'd like you.", "Edric sat on the top step and threw pebbles at the clouds. i keep his step swept."]
    about.aster: ["Aster made my boy a hat once. green, with a feather. far too big. he wore it anyway."]
    about.fitch: ["Fitch brings the post up from El Nath. he always stops on my step, post or no post. he's a kind boy."]
    aboutUnknown: ["i don't think they've come up the hill."]
    friend.close: ["you're on my steps more than anyone. i've started sweeping a second one."]
    friend.best: ["i've waited for a lot of people. you're one of the ones who comes."]
    famed: ["oh! well. thank you, dear."]
    defamed: ["oh. well. i expect you had a reason."]
    gift: ["for me? you shouldn't have. i'm glad you did."]
    gift.favorite: ["oh, you remembered. that goes on the top step with me tonight, dear."]
    gift.again: ["you've already brought me something today. keep the rest for yourself, dear."]

- id: fitch
  name: Fitch
  look: { gender: male }
  title: "Letter Runner"
  job: ASSASSIN
  level: { min: 44, max: 46 }
  strength: SEASONED
  loadout: kerning-thief-l35
  personality: relaxed-v1
  home:
    town: orbis
    routine:
      - { from: 6, to: 10, spot: "venue:lower-east-street", activity: STROLL }
      - { from: 10, to: 16, materialize: false }
      - { from: 16, to: 21, spot: "venue:by-trina", activity: SOCIALIZE }
      - { from: 21, to: 6, materialize: false }
  recruitable: false
  knows: [el nath, orbis]
  questLines: [fitch-the-road-down, fitch-pixie-post]
  relationships:
    - { persona: corliss, kind: WORKS_FOR }
    - { persona: maud, kind: DELIVERS_TO }
    - { persona: ottilie, kind: STOPS_FOR }
  giftItemIds: [2000002, 4003004]
  dialogue:
    greetFirst: ["four thousand and twelve steps from here to El Nath. i've counted. twice. got different numbers. took the higher one.", "you look like someone who's never run a letter. it's great. it's terrible. it's great."]
    greet: ["hey! nothing for you. there's never anything for anybody. i run anyway.", "back up the hill? me too. always."]
    idle: ["(re-ties a bootlace for the third time)", "(sorts a satchel of letters by a system only he understands)"]
    noWork: ["post's run. legs are run. both of us are done."]
    nothingDue: ["nothing owed. postage is on Corliss."]
    who: ["Fitch. i run the post between Orbis and El Nath, down Orbis Tower, past the snowfields and back. on foot. the ships don't go there."]
    bye: ["don't run the stairs. i mean it. i've seen it."]
    thanks: ["anytime! well. between ten and four i'm on the road. any other time!"]
    smallTalk: ["the pixies in the cloud park steal letters. they can't read. they just like the paper.", "every letter for El Nath goes to Maud first. she knows where everyone in the mountain lives. and who doesn't anymore."]
    speakPlainly: ["short version: letters, legs, stairs."]
    questOffer.fitch-the-road-down: ["i've got a satchel for Maud in El Nath and a knee that says no today. run it down for me? down the tower, out past the snow. she's at the market end."]
    questAccept.fitch-the-road-down: ["the tower, twenty floors, down and down, then it gets cold. when your eyelashes freeze you're nearly there."]
    questWaiting.fitch-the-road-down: ["did Maud get it? she'll have said something grim. she always does."]
    questComplete.fitch-the-road-down: ["delivered! you're a runner now. unofficially. very unofficially. don't tell Corliss, he'll pay you."]
    questOffer.fitch-pixie-post: ["the lunar pixies in the middle parks keep ambushing me for the paper. twenty-five fewer of them and my satchel stays shut."]
    questAccept.fitch-pixie-post: ["third and fourth parks. they're the purple ones. they giggle. it's upsetting."]
    questWaiting.fitch-pixie-post: ["twenty-five. they'll be back. they're always back. but later."]
    questComplete.fitch-pixie-post: ["twenty-five! i'll run the tower with my satchel open, just to feel brave."]
    about.corliss: ["Corliss pays me by the letter and pretends he doesn't care if they arrive. he cares. he checks."]
    about.maud: ["Maud reads every letter's name out loud before she takes it. half the names she says twice. the miners. you'll see."]
    about.ottilie: ["i stop on Ottilie's step every evening, post or no post. she thanks me every time, either way."]
    about.edric: ["there's an Edric in El Nath. a sentry. big, quiet, never gets post. never sends any either. odd thing to notice. i notice post."]
    aboutUnknown: ["never had a letter for them. that's how i know people."]
    friend.close: ["i'd run a letter for you through a blizzard. i have run letters through blizzards. this would be on purpose."]
    friend.best: ["if you ever need something carried, anywhere, i'll carry it. that's the whole of me, and it's yours."]
    famed: ["whoa. thanks! that's going in my satchel. metaphorically."]
    defamed: ["ouch. fair. probably fair."]
    gift: ["for me? the post doesn't usually go this direction."]
    gift.favorite: ["for the run! you get me. the knee says thank you too."]
    gift.again: ["you already gave me something today. my satchel's full of nice."]

- id: vesna
  name: Vesna
  look: { gender: female }
  spouse: ansel
  title: "Cloud Park Warden"
  job: IL_WIZARD
  level: { min: 60, max: 62 }
  strength: VETERAN
  loadout: orbis-wand-l58
  personality: efficient-v1
  home:
    town: orbis
    routine:
      - { from: 6, to: 12, spot: "venue:lower-west-street", activity: LINGER }
      - { from: 12, to: 18, spot: "venue:by-staff-sergeant-charlie", activity: SOCIALIZE }
      - { from: 18, to: 23, spot: "venue:lower-central-street", activity: SHOW_OFF }
      - { from: 23, to: 6, materialize: false }
  recruitable: true
  knows: [cloud park, lunar pixie, garden of darkness]
  contract: vesna-wardens-terms
  questLines: [vesna-the-pixie-count, vesna-evil-tale, vesna-angel-wings, vesna-phoenix-wand, vesna-moon-tally]
  rumors: [orbis-cloud-park-at-dusk]
  benchToleranceDays: 3
  paceGap: 3
  relationships:
    - { persona: ansel, kind: RIVAL }
    - { persona: corliss, kind: KEEPS_THE_PLATFORM_CLEAR_FOR }
  giftItemIds: [4000060, 2000006]
  dialogue:
    greetFirst: ["you came through the cloud park. how many pixies did you see? that's not small talk. i keep a count.", "stand still a moment. no, you're not a pixie. go on."]
    greet: ["two hundred and six this morning. lunar. you?", "warden's hours. what do you need?"]
    idle: ["(counts something in the sky under her breath)", "(turns a wand over and over without looking at it)"]
    noWork: ["the parks are quiet. the count's steady. nothing for you today."]
    nothingDue: ["nothing owed. you're square with the parks."]
    who: ["Vesna. i'm the warden of the cloud parks. i keep the pixies in the parks and out of the city. they'd say i'm the problem."]
    bye: ["count your steps on the clouds. they're softer than they look and the drop is longer."]
    thanks: ["fine. logged. carry on."]
    smallTalk: ["star pixies steal. lunar pixies steal and giggle. luster pixies steal and don't bother giggling. it's a ladder.", "the lucidas in the dark garden are pixies too. pixies that stopped being sorry."]
    speakPlainly: ["plainly: the pixies, the parks, me in the middle."]
    offer: ["show me you can hold a park. sixty luster pixies counted down, and thirty thousand for the hours i'm not on the clouds. then i'm yours for a shift."]
    join: ["fine. i'll count, you swing. try not to step on anything that glows."]
    bench: ["i'll be on the clouds. three days, then the count goes stale and so do i."]
    leave: ["shift's done. the parks will want me back. they always want me back."]
    refuse.bond: ["i don't leave the parks with strangers. the pixies notice when i'm gone."]
    refuse.flags: ["count with me once first. lunar pixies, the middle parks. then we'll talk about the clouds."]
    refuseOwnErrand: ["that's my count. you don't count for me. you count with me."]
    questOffer.vesna-the-pixie-count: ["the lunar count is wrong. thirty of them in the third and fourth parks, then go knock on the old man's door in park four and tell him the warden says hello. he taught me. he won't remember."]
    questAccept.vesna-the-pixie-count: ["the old man's house is the little door in park four. he likes visitors. he forgets them, but he likes them."]
    questWaiting.vesna-the-pixie-count: ["thirty, and the old man. he likes it when someone knocks."]
    questComplete.vesna-the-pixie-count: ["thirty. the count's right again. and he answered the door? good. that's the part i actually wanted."]
    questOffer.vesna-evil-tale: ["the luster pixies in parks five and six hoard sunpieces. thirty of them, fifteen pieces. i'll set them in the wand i carried my first year. Evil Tale. it's been sitting in a drawer."]
    questAccept.vesna-evil-tale: ["the luster ones hit harder than they look. so do i."]
    questWaiting.vesna-evil-tale: ["fifteen sunpieces. the wand's on the desk, waiting."]
    questComplete.vesna-evil-tale: ["Evil Tale. seven safe scrolls, every one took. i warded the parks with it for a year. ward something with it."]
    questOffer.vesna-angel-wings: ["the lucidas in the garden of darkness were pixies once. thirty of them, fifteen tails. Angel Wings wants something that was bright and isn't. i don't make the rules. i follow them."]
    questAccept.vesna-angel-wings: ["the stairway to the sky, then down into the dark garden. they hit hard. don't let them sing at you."]
    questWaiting.vesna-angel-wings: ["fifteen tails. i've counted the lucidas. i don't like the number."]
    questComplete.vesna-angel-wings: ["Angel Wings. seven sixties, every one took. i've never had that kind of luck. i had it for you."]
    questOffer.vesna-phoenix-wand: ["the Phoenix. my teacher's wand. it wants a fire that won't stay out. the coolie zombies in the dead forest below El Nath, thirty, and the lich Riche keeps a book that burns forever. bring me the book."]
    questAccept.vesna-phoenix-wand: ["the forest of dead trees, past El Nath. Riche walks one of the four. you'll know the one."]
    questWaiting.vesna-phoenix-wand: ["the book. one book. the fire's waiting for it."]
    questComplete.vesna-phoenix-wand: ["the Phoenix. two tens, five sixties, every one took. i held my breath through the tens. my teacher would have laughed at me. take it. it was always going to be someone's."]
    questOffer.vesna-moon-tally: ["fifteen moonpieces for the tally. i weigh them. the weight tells me how the parks are doing."]
    questAccept.vesna-moon-tally: ["lunar pixies, the middle parks."]
    questWaiting.vesna-moon-tally: ["fifteen. the scale's empty."]
    questComplete.vesna-moon-tally: ["fifteen. heavy month. the parks are healthy."]
    about.ansel: ["Ansel shoots the pixies i'm counting. we have words. the words are numbers. i married him anyway. the numbers were good."]
    spouse.parted: ["{name} and i are through. i still count the pixies. nobody shoots them now."]
    about.corliss: ["Corliss asks me for the pixie count before the evening ship. i don't know what he does with it. i think it goes in the ledger."]
    about.ottilie: ["Ottilie sweeps her steps every evening. the pixies leave her alone. they know."]
    aboutUnknown: ["not on the clouds. not in my count."]
    friend.close: ["i've started counting you. on purpose. that's a lot from me."]
    friend.best: ["two hundred pixies a morning and i only ever look for one person on the clouds. you."]
    famed: ["...noted. favourably."]
    defamed: ["noted. less favourably."]
    gift: ["thank you. it goes in the drawer with the warden's things."]
    gift.favorite: ["oh. the good kind. you've been counting with me."]
    gift.again: ["one's the count for today."]

