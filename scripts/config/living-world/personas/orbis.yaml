    leave: ["good hunting. the gardens need me back."]
    refuse.bond: ["i don't hunt with people i don't know. you shoot wrong when you're nervous."]
    refuse.flags: ["walk the colour gardens first. then we'll talk rates."]
    refuseOwnErrand: ["that's my hunt. you hunt beside me, not for me."]
    questOffer.ansel-the-colour-gardens: ["the young ones in the first gardens are getting bold. thirty of them, red, yellow, green, any, and fifteen of their horns."]
    questAccept.ansel-the-colour-gardens: ["the road to the gardens of three colours is out past the first park. the young ones hunt in threes. so should you."]
    questWaiting.ansel-the-colour-gardens: ["fifteen horns. they're solid. you'll know them."]
    questComplete.ansel-the-colour-gardens: ["fifteen. the gardeners can work tomorrow. you've got an eye."]
    questOffer.ansel-asianic-bow: ["the grown cellions in the red garden. thirty, and fifteen tails for the bow grip. it's an Asianic. it was my first. i'd like it to be somebody's."]
    questAccept.ansel-asianic-bow: ["garden of red, the deep half. they're fast. be faster or be somewhere else."]
    questWaiting.ansel-asianic-bow: ["fifteen tails. the grip's half wrapped."]
    questComplete.ansel-asianic-bow: ["the Asianic. seven safe scrolls, every one took. i learned to breathe with it. you will too."]
    questOffer.ansel-golden-hinkel: ["the Golden Hinkel wants dark yeti horn for its nocks. Sharp Cliff, down past El Nath. thirty dark yetis, fifteen horns. Bjarke says they're slower than they look. Bjarke lies."]
    questAccept.ansel-golden-hinkel: ["the cliffs are below the ice valleys. watch the edges. the yetis like edges."]
    questWaiting.ansel-golden-hinkel: ["fifteen horns. the nocks are carved and waiting."]
    questComplete.ansel-golden-hinkel: ["the Golden Hinkel. seven sixties, every one took. i've never strung a better bow. now i've given one away."]
    questOffer.ansel-marine-arund: ["my father's Marine Arund. it wants a string strung where the floor hums. the deep buffoons on Ludibrium's warped path stand right on the hum. forty of them. and ask Jasper where they stand. he shoots there."]
    questAccept.ansel-marine-arund: ["Ludibrium, the ship from the station. the warped path is past the clock. Jasper will be grumpy. that's normal."]
    questWaiting.ansel-marine-arund: ["forty, and Jasper. the string's soaking."]
    questComplete.ansel-marine-arund: ["the Marine Arund. two tens and five sixties, every one took. my father strung it for the sea. you string it for wherever you're going."]
    questOffer.ansel-fletching: ["twenty soft feathers for fletching. the grown garden beasts shed them. so do yetis."]
    questAccept.ansel-fletching: ["soft ones, not stiff. the stiff ones whistle."]
    questWaiting.ansel-fletching: ["twenty feathers."]
    questComplete.ansel-fletching: ["twenty. a quiver's worth. quiet ones."]
    about.vesna: ["Vesna counts the pixies. i shoot some of them. she counts that too. we're married. we're still working on it."]
    spouse.parted: ["{name} and i are done. the gardens are quiet. too quiet."]
    about.bjarke: ["Bjarke and i hunted Wolf Territory one winter. he talked the whole time. the wolves heard us coming for a week."]
    about.jasper: ["Jasper shoots ghosts in Ludibrium. says it's the same as hunting. it isn't. ghosts don't run."]
    about.corliss: ["Corliss logs me out every morning and in every night. i've never once told him where i'm going. he writes 'gardens'. he's right."]
    aboutUnknown: ["never hunted with them."]
    friend.close: ["i'd hunt with you without the rate. don't tell Vesna i said that."]
    friend.best: ["my father taught me to hunt alone. i've unlearned it for you."]
    famed: ["huh. thanks."]
    defamed: ["fair. i'll aim better."]
    gift: ["thanks. it'll get used."]
    gift.favorite: ["you notice what a hunter runs short of. that's most of hunting."]
    gift.again: ["that's enough for today."]

- id: aster
  name: Aster
  look: { gender: female }
  title: "Milliner"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: orbis
    routine:
      - { from: 8, to: 13, spot: "venue:weapon-store-door", activity: LINGER }
      - { from: 13, to: 19, spot: "venue:lower-central-street", activity: SOCIALIZE }
      - { from: 19, to: 22, spot: "venue:middle-central-benches", activity: REST }
      - { from: 22, to: 8, materialize: false }
  recruitable: false
  knows: [orbis tower, leatty]
  questLines: [aster-felt-from-the-tower, aster-yellow-plumes, aster-the-snow-brim, aster-the-crowning-hat, aster-ribbons]
  relationships:
    - { persona: ottilie, kind: FRIEND }
    - { persona: perrin, kind: SHARES_A_WINDOW_WITH }
  giftItemIds: [4000086, 4000107]
  dialogue:
    greetFirst: ["oh, stop. hold still. your head. it's a perfectly good head and you're wasting it.", "a hat is a promise you wear where everyone can see it. what are you promising? nothing? we can fix that."]
    greet: ["darling, your brim. no. never mind. yes. come here.", "hello! you're bareheaded again. i can tell from across the street."]
    idle: ["(turns a felt brim on her knee, pinching it into shape)", "(holds a feather up to the sky to judge the colour)"]
    noWork: ["no commissions today. i'm designing. designing looks like sitting."]
    nothingDue: ["we're square. your head, however, owes me nothing yet."]
    who: ["Aster. milliner. i make hats for heads that have somewhere to be, which in Orbis is every head."]
    bye: ["hat on when you leave. the wind up here takes them, so hold on."]
    thanks: ["oh, you. wear it well."]
    smallTalk: ["the wind takes a hat a day off this city. i make two a day. that's business.", "the best felt in the world grows on leatties in the tower. they don't know. they'd be insufferable."]
    speakPlainly: ["plainly: hats. good ones. for you."]
    questOffer.aster-felt-from-the-tower: ["i'm out of felt. the leatties in the tower grow it. twenty-five leatties, seventh floor down to fifth, and fifteen furballs, the fluffy ones."]
    questAccept.aster-felt-from-the-tower: ["the tower counts down from the top. seventh, sixth, fifth. they roll at you. it's adorable and it hurts."]
    questWaiting.aster-felt-from-the-tower: ["fifteen furballs, darling. the steamer's on."]
    questComplete.aster-felt-from-the-tower: ["fifteen! oh, these are lovely. three hats' worth. one of them is yours eventually. that's a threat."]
    questOffer.aster-yellow-plumes: ["a hat for you. a real one. it wants a plume, and the only yellow worth wearing is a grown lioner's tail. thirty lioners in the yellow garden, fifteen tails."]
    questAccept.aster-yellow-plumes: ["garden of yellow, the deep half. they're very proud of the tails. take them anyway."]
    questWaiting.aster-yellow-plumes: ["fifteen tails. the crown's blocked and waiting."]
    questComplete.aster-yellow-plumes: ["there. cut for how you fight, every scroll took, and the plume's the best i've ever set. hold still. perfect."]
    questOffer.aster-the-snow-brim: ["the next one wants a brim that holds in any wind. yeti down. thirty yetis in El Nath's ice valleys and twenty soft feathers, the downy ones."]
    questAccept.aster-the-snow-brim: ["the ice valleys, past the town. bring a scarf. bring two. one's for me."]
    questWaiting.aster-the-snow-brim: ["twenty feathers, darling. the brim's pinned."]
    questComplete.aster-the-snow-brim: ["there. the snow brim. shaped for your work. it won't move in a gale. i tested it off the station roof. don't ask."]
    questOffer.aster-the-crowning-hat: ["the last hat i'll make you is the one i've been sketching since we met. Ottilie has a pattern i need, from a hat i made long ago. ask her for it. then thirty yeti and pepe pairs in the ice valley, and fifteen pepe beaks for the crest."]
    questAccept.aster-the-crowning-hat: ["be gentle with Ottilie. the pattern is from her boy's hat. green, with a feather. far too big."]
    questWaiting.aster-the-crowning-hat: ["the pattern, and fifteen beaks. polished, they shine like nothing else."]
    questComplete.aster-the-crowning-hat: ["the crowning hat. cut for you, two tens and the rest sixties, every one took. cut from a pattern i made for a boy who went away. it fits you. i knew it would."]
    questOffer.aster-ribbons: ["dark leattie furballs dye the best black band. fifteen?"]
    questAccept.aster-ribbons: ["the dark ones, fifth floor down to third."]
    questWaiting.aster-ribbons: ["fifteen. the bands are waiting."]
    questComplete.aster-ribbons: ["fifteen. six black bands. very serious hats. very serious people buy them."]
    about.ottilie: ["Ottilie's my oldest customer. she hasn't bought a hat in eleven years. she comes to watch me make them."]
    about.perrin: ["Perrin and i share a window. he sets stones, i set feathers. we argue about the light. he's usually right. don't tell him."]
    about.vesna: ["Vesna wears a hat i'd never make and wears it perfectly. i hate it. i love it."]
    about.edric: ["i made a boy called Edric a green hat once, far too big. if you ever meet him, look at his head. i'd know my brim anywhere."]
    aboutUnknown: ["never measured their head."]
    friend.close: ["i've stopped looking at your hat and started looking at you. that's a milliner's highest compliment."]
    friend.best: ["every head in Orbis has worn one of my hats. yours is the one i'd make again and again."]
    famed: ["oh! darling. thank you."]
    defamed: ["well. it can't be the hat."]
    gift: ["for me? thank you! it's going on a hat. everything does."]
    gift.favorite: ["trimming! the good soft kind! you've been listening."]
    gift.again: ["you've spoiled me enough for today, darling."]

- id: perrin
  name: Perrin
  look: { gender: male }
  title: "Jeweller"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: orbis
    routine:
      - { from: 9, to: 15, spot: "venue:by-spiegelmann", activity: LINGER }
      - { from: 15, to: 21, spot: "venue:free-market-entrance", activity: BROWSE }
      - { from: 21, to: 9, materialize: false }
  recruitable: false
  knows: [orbis tower, klock]
  questLines: [perrin-sentinel-sparks, perrin-pink-petals, perrin-clock-silver, perrin-a-metal-heart, perrin-polishing-grit]
  relationships:
    - { persona: aster, kind: SHARES_A_WINDOW_WITH }
    - { persona: ignatz, kind: BUYS_SCRAP_FROM }
  giftItemIds: [4000061, 4020003]
  dialogue:
    greetFirst: ["hold your hand to the light. no, the other way. there. you've got a scar that catches it. most people don't.", "you came up into the light. everyone does, here. it's why i stay."]
    greet: ["good light today. come and see.", "hello. mind the tray, it's all small."]
    idle: ["(holds a loupe to one eye and a sunpiece to the sky)", "(sorts tiny stones into tinier piles)"]
    noWork: ["nothing needs setting. i'm watching the light change. it's work. it's slow work."]
    nothingDue: ["nothing owed. light's free up here."]
    who: ["Perrin. jeweller. i set light into things people can carry. stones mostly. sometimes pixie pieces. once, a shard of a clock."]
    bye: ["catch the light on the way down."]
    thanks: ["mm. you're welcome."]
    smallTalk: ["a stone's only as good as the light you give it. Orbis gives the best light in the world. so i'm here.", "Ludibrium's clocks are made of the finest metal anyone's ever forgotten. i buy the scrap from Ignatz. he thinks i'm mad."]
    speakPlainly: ["simply: shiny things, set well."]
    questOffer.perrin-sentinel-sparks: ["fire sentinels keep a spark in their shells. i set them like garnets. twenty-five fire sentinels, tower floors twelve and eleven, and twelve shellpieces?"]
    questAccept.perrin-sentinel-sparks: ["the eleventh and twelfth floors. warm floors. the spark's still in the shell for an hour after."]
    questWaiting.perrin-sentinel-sparks: ["twelve shellpieces. the setting's ready."]
    questComplete.perrin-sentinel-sparks: ["twelve. still warm. lovely. i'll have rings by the evening ship."]
    questOffer.perrin-pink-petals: ["earrings for you. pink-flowered. the petals are dark nependeath seeds, split and lacquered. thirty dark nependeaths on the second strolling path, fifteen seeds."]
    questAccept.perrin-pink-petals: ["the second strolling path, or the disposed flower garden. they bite harder than the light ones."]
    questWaiting.perrin-pink-petals: ["fifteen seeds. the lacquer's mixed."]
    questComplete.perrin-pink-petals: ["there. the pink-flowered pair, every scroll took. hold still. ...there. the light likes you."]
    questOffer.perrin-clock-silver: ["the next pair wants silver that rings when it's struck. the klocks in Ludibrium's forgotten path are made of it. thirty klocks, fifteen of their sealed grandpa clocks."]
    questAccept.perrin-clock-silver: ["the forgotten path of time, past the clock tower. they keep time badly. don't keep time with them."]
    questWaiting.perrin-clock-silver: ["fifteen clocks. i'll melt the cases. Ignatz will hate me."]
    questComplete.perrin-clock-silver: ["metal silver earrings. every scroll took. listen. tap one. ...that's the sound of time somebody forgot. now it's yours."]
    questOffer.perrin-a-metal-heart: ["the last pair. a heart, beating, in metal. the dark klocks hold evil spirits like a heart holds blood. thirty dark klocks and fifteen spirits. yes, it's grim. jewellery usually is."]
    questAccept.perrin-a-metal-heart: ["the forgotten path again, where the klocks go dark. the spirits come out of them easily. getting them into a jar is harder."]
    questWaiting.perrin-a-metal-heart: ["fifteen spirits. the hearts are cast and empty."]
    questComplete.perrin-a-metal-heart: ["the metal heart pair. two tens and the rest sixties, every one took. if you hold them to your ear you can hear them. that's not a figure of speech."]
    questOffer.perrin-polishing-grit: ["ten luster pixie sunpieces, ground, make the only polish worth using. ten?"]
    questAccept.perrin-polishing-grit: ["parks five and six."]
    questWaiting.perrin-polishing-grit: ["ten sunpieces."]
    questComplete.perrin-polishing-grit: ["ten. a jar of polish. the light thanks you."]
    about.aster: ["Aster thinks a hat can save a person. i think a stone can. we're both wrong and we both keep at it."]
    about.ignatz: ["Ignatz sells me the cases of clocks that stopped. he says each one's an hour somebody lost. he wraps them like they're breakable. they are."]
    about.corliss: ["Corliss bought a ring from me once. never wore it. keeps it in the ledger, between two pages. i've never asked which."]
    aboutUnknown: ["never set a stone for them."]
    friend.close: ["you catch the light the way a good stone does. i don't say that to people."]
    friend.best: ["i've set a lot of things that shine. you're the one i'd keep."]
    famed: ["oh. thank you. that caught the light."]
    defamed: ["hm. a flaw. everything has one."]
    gift: ["thank you. it'll go in the tray."]
    gift.favorite: ["a clear one. you have an eye. so do i. that's two of us."]
    gift.again: ["one's enough. the tray's small."]
