    questWaiting.taejin-the-swamp-path: ["thirty, and the swamp. a path's only a path if you've walked to the end."]
    questComplete.taejin-the-swamp-path: ["good. now you know my path. it's shorter than it feels."]
    questOffer.taejin-the-shining: ["The Shining. my first proper axe. the haft wants greasing, and nothing greases like bear. thirty pandas in the wild bear country on the Mu Lung road, fifteen bear feet."]
