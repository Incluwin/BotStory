    about.maren: ["Maren hunts pirates. i cut trees. she says pirates are harder. she's never met a swamp."]
    about.oksun: ["i cut the paths to Oksun's gardens. she gives me tea. i'd cut them for nothing. don't tell her."]
    about.gyuwon: ["Gyuwon was a pirate. now he grows radishes. i've cut him a path to his radishes. he's grateful. he's always grateful. it's suspicious."]
    aboutUnknown: ["never cut a path for them."]
    friend.close: ["i'd cut you a path anywhere. you'd only have to point."]
    friend.best: ["if the swamp ever takes me, walk my paths for me. once. that's all."]
    famed: ["hm. good things. keep it up."]
    defamed: ["hm. bad things. cut them back."]
    gift: ["hm. thanks."]
    gift.favorite: ["oh. that's useful. you noticed."]
    gift.again: ["one's plenty."]

