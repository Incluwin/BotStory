    questWaiting.sookja-ginseng-tea: ["fifteen bottles. the tired are piling up."]
    questComplete.sookja-ginseng-tea: ["fifteen! lovely. a cup for you, on the house. it's always on the house. that's the secret."]
    questOffer.sookja-a-jar-for-meiwen: ["Meiwen in Mu Lung sent back an empty jar with no note. that's not like her. would you ask her if the last jar was wrong? she'll say no. watch her face when she says it."]
    questAccept.sookja-a-jar-for-meiwen: ["Mu Lung, up the road past the peach farms. Meiwen's in the middle of town in the mornings, standing very still."]
    questWaiting.sookja-a-jar-for-meiwen: ["did she say? was it wrong?"]
    questComplete.sookja-a-jar-for-meiwen: ["'it was perfect, that's why there's nothing to say'? ...oh. well. that's the nicest note i've ever not been sent."]
    about.oksun: ["Oksun grows the best herbs on the coast. i make them taste like they're good for you. they are good for you. that's not the point of tea."]
    about.lai: ["Lai sends peaches over from Mu Lung. her cart's always missing a wheel. i've stopped asking which one."]
    about.meiwen: ["Meiwen buys my tea and sends back empty jars. we've never met. i'd know her by the jars."]
    about.maren: ["Maren drinks her tea standing up, facing the door. i've stopped offering her a chair."]
    about.bora: ["Bora from the pier brings me a pearl every month for a jar of peach tea. i keep them in the tea tin. a pearl's no use on a tea-maker's hands. it's a lovely thing in a tin."]
    aboutUnknown: ["never had a cup with them."]
    friend.close: ["you've got your own cup now. the blue one. nobody else drinks from it."]
    friend.best: ["when i'm too old to pour, i'll leave you the pot. you'll know what to do with it."]
    famed: ["the whole tea house is talking about you! good things!"]
    defamed: ["the tea house is talking about you. drink your tea and let it pass."]
    gift: ["oh, thank you!"]
    gift.favorite: ["oh, that's lovely. that's going straight in the pot."]
    gift.again: ["one's plenty, dear. you'll spoil me."]

- id: gyuwon
  name: Gyuwon
  look: { gender: male }
  title: "Radish Farmer, Formerly Red-Nosed"
  job: BEGINNER
  level: { min: 40, max: 40 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: herb-town
    routine:
      - { from: 6, to: 11, spot: "venue:middle-east-street-3", activity: LINGER }
      - { from: 11, to: 16, materialize: false }
      - { from: 16, to: 23, spot: "venue:middle-east-street", activity: SOCIALIZE }
      - { from: 23, to: 6, materialize: false }
  recruitable: false
  knows: [kru, mr. alli, old swamp]
  questLines: [gyuwon-the-alligator-path, gyuwon-the-old-crew]
  rumors: [herb-town-the-old-crew]
  relationships:
    - { persona: maren, kind: WATCHED_BY }
    - { persona: dohyun, kind: DISTRUSTED_BY }
  giftItemIds: [4000296, 2022001]
  dialogue:
    greetFirst: ["radish? no? they're good radishes. i grow them myself. that's new for me. i used to just take things.", "don't mind the hat. it's a gardening hat. it used to be red. i've let it fade."]
    greet: ["radishes are coming up.", "hello again. the radishes say hello too. they don't. but they would."]
    idle: ["(scrubs the dirt off a fat radish with his thumb and holds it up proudly to nobody)", "(glances toward the road to the swamp, then back down at his radishes)"]
    noWork: ["nothing today. just radishes. it's always just radishes now. i like that."]
    nothingDue: ["you owe me nothing. i owe a lot of people a lot. not you."]
    who: ["Gyuwon. i sailed with the red-nose pirates ten years. then one day i saw Oksun planting a root she'd never see grow. i went home and planted a radish. i've been planting since."]
    bye: ["stay out of the third den. trust me."]
    thanks: ["oh. thank you. people don't thank me much. fair enough."]
    smallTalk: ["the red-nose captains can't dig. they think you yank a root out like a tooth. Oksun's family digs a hand's width at a time. that's the whole difference between us.", "Maren watches me. i wave. she doesn't wave back. one day she'll wave. i'm patient now. radishes taught me."]
    speakPlainly: ["plainly: a radish farmer who used to be something worse."]
    questOffer.gyuwon-the-alligator-path: ["there's an old way into the first den, through the swamp. i used it for ten years. i want to know if it's still open, so i can tell Maren. twenty alligators cleared off it, then step through the den's door and straight back out."]
    questAccept.gyuwon-the-alligator-path: ["the old swamp and the isolated swamp. then through the first den's door and straight back out. don't stop for tea."]
    questWaiting.gyuwon-the-alligator-path: ["twenty, and the door. is it still there?"]
    questComplete.gyuwon-the-alligator-path: ["still there. ...ten years i went through that door. i'll draw it for Maren. she won't thank me. that's fine."]
    questOffer.gyuwon-the-old-crew: ["would you take this to Maren? it's a map of the dens. every way in. i drew it from memory. she won't take it from me. she might take it from you."]
    questAccept.gyuwon-the-old-crew: ["Maren's on the east street in the evenings, near me. near enough to watch. she'll know where it's from. tell her anyway."]
    questWaiting.gyuwon-the-old-crew: ["did she take it?"]
    questComplete.gyuwon-the-old-crew: ["she took it? and said thank you? ...through her teeth? that counts. that's the first one. i'm going to sit down."]
    about.maren: ["Maren hunts my old crew. she's right to. i'd help, but she'd never let me. i draw her maps instead."]
    about.oksun: ["Oksun planted a root for someone she'd never meet. that's the most un-pirate thing i've ever seen. it changed my life. i've never told her."]
    about.dohyun: ["Dohyun doesn't trust me. good boy. he shouldn't. not yet."]
    aboutUnknown: ["never sailed with them. never robbed them either. probably."]
    friend.close: ["you're the first friend i've made without lying first. i'm keeping track."]
    friend.best: ["if you ever need a way in somewhere, ask me. i know a lot of ways in. i'm only using them for good now."]
    famed: ["people are saying good things about you! i'd know. i listen to everything."]
    defamed: ["people are saying bad things. i know how that goes. plant something."]
    gift: ["oh. for me? thank you."]
    gift.favorite: ["oh, that's thoughtful. nobody gives me things. i used to just take them."]
    gift.again: ["one's plenty. i'm learning not to want more than one."]

