  title: "Apprentice Herbalist"
  job: BEGINNER
  level: { min: 20, max: 20 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: herb-town
    routine:
      - { from: 7, to: 12, spot: "venue:by-lan-ming", activity: STROLL }
      - { from: 12, to: 17, spot: "venue:upper-central-street", activity: STROLL }
      - { from: 17, to: 20, spot: "venue:lower-west-street-2", activity: SOCIALIZE }
      - { from: 20, to: 7, materialize: false }
  recruitable: false
  knows: [chipmunk, blue flower serpent, herb town]
  questLines: [aeri-acorn-flour, aeri-seed-caps]
  relationships:
    - { persona: oksun, kind: APPRENTICED_TO }
    - { persona: dohyun, kind: WORKS_WITH }
  giftItemIds: [4000276, 2000002]
  dialogue:
    greetFirst: ["why are you here? sorry. i ask why about everything. Oksun says i'll stop. i won't.", "hello! what's that? what are you carrying? why?"]
    greet: ["hello! why are you back? sorry. hello!", "hi! i learned a new herb today. ask me which. go on."]
    idle: ["(holds two near-identical leaves side by side, squinting, then writes something in a little book)", "(pulls a plant gently out of a pot, examines the roots, and puts it back exactly as it was)"]
    noWork: ["nothing today! i've run out of questions. no i haven't. why is moss green?"]
    nothingDue: ["we're even! i think. why do people keep count?"]
    who: ["Aeri. Oksun's apprentice. she's teaching me every herb in the gardens. there are three hundred and four. i know a hundred and nine. i want to know why all of them do what they do."]
    bye: ["don't eat anything purple! unless it's a plum. then it's fine. probably."]
    thanks: ["thank you! why do you help people? sorry. thank you!"]
    smallTalk: ["acorn flour makes the herb cakes stick together. nobody knows why. i'm going to find out.", "Oksun says a hundred-year root has to be dug, not pulled. i asked why. she said 'because'. that's not a reason. it's a door."]
    speakPlainly: ["plainly: herbs, questions, and more questions."]
    questOffer.aeri-acorn-flour: ["i need acorn flour for the herb cakes. the chipmunks at the edge of the sky forest hoard the acorns. twenty-five chipmunks, fifteen acorns? why do they hoard them? that's my second question."]
    questAccept.aeri-acorn-flour: ["the entrance to the sky forest, and the train past it. the chipmunks. they're quick. why are they quick? sorry."]
    questWaiting.aeri-acorn-flour: ["fifteen acorns! the cakes are falling apart."]
    questComplete.aeri-acorn-flour: ["fifteen! the cakes will hold. i still don't know why. i will."]
    questOffer.aeri-seed-caps: ["the blue serpents wear little swimming caps. they're waterproof. perfect for keeping seeds dry! twenty-five serpents, fifteen caps? why do snakes wear caps? i have so many questions."]
    questAccept.aeri-seed-caps: ["the snake area past the sky forest, and where it ends. the blue ones have caps. the red ones have flowers. why? i don't know. yet."]
    questWaiting.aeri-seed-caps: ["fifteen caps! my seeds are getting damp."]
    questComplete.aeri-seed-caps: ["fifteen! the seeds will stay dry all winter. thank you! ...do you know why snakes wear caps? no? me neither. we'll find out."]
    about.oksun: ["Oksun knows everything about plants. she only tells me half. she says the other half grows on you. why? sorry."]
    about.dohyun: ["Dohyun digs. i ask why. he says 'because it needs digging'. that's not an answer. he's very good at digging though."]
    about.sookja: ["Sookja makes tea out of everything. i asked why. she said 'because it's tea'. everyone here answers questions with the question."]
    aboutUnknown: ["i don't know them! why don't i know them?"]
    friend.close: ["you're my favourite person to ask why. you don't sigh."]
    friend.best: ["when i know all three hundred and four herbs, i'll name the next one after you. why? because."]
    famed: ["everyone says you're wonderful! why? i know why."]
    defamed: ["people are saying things. why? never mind. i don't believe them."]
    gift: ["for me? thank you!"]
    gift.favorite: ["oh, i love that! how did you know? why did you know?"]
    gift.again: ["you already gave me something today! why so kind? sorry. thank you."]
