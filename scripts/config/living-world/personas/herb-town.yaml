    questComplete.taejin-the-shining: ["fifteen. The Shining, greased. seven safe scrolls, every one took. it'll sing on the first swing. let it."]
    questOffer.taejin-chrono: ["Chrono. heavier. the grip wants alligator leather. thirty of Mr. Alli's kind in the old swamp, fifteen hides."]
    questAccept.taejin-chrono: ["the old swamp and the isolated swamp. they're patient. be less patient."]
    questWaiting.taejin-chrono: ["fifteen hides. the grip's bare."]
    questComplete.taejin-chrono: ["fifteen. Chrono. seven sixties, every one took. that's not luck. that's the leather."]
    questOffer.taejin-helios: ["Helios. my best. it wants something i can't get here. the birks in the forests under Leafre chew a grass that turns to wire when it dries. thirty birks, fifteen mouthfuls. i'll bind the head with it."]
    questAccept.taejin-helios: ["Leafre. the forest crossroad, the antelope valley, the sky nest's entrance. the birks. they chew. they charge. they chew again."]
    questWaiting.taejin-helios: ["fifteen. the head's loose without it."]
    questComplete.taejin-helios: ["fifteen. bound tight. Helios. two tens and five sixties, every one took. i'll cut with The Rising again. it's yours."]
    questOffer.taejin-leather-run: ["fifteen alligator hides? the grips wear through."]
