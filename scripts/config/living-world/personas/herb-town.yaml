    questWaiting.maren-gigantic-sledge: ["fifteen hats. the pile's short."]
    questComplete.maren-gigantic-sledge: ["fifteen. the pile's grown. the Gigantic Sledge. seven safe scrolls, every one took. it's heavy. that's the idea."]
    questOffer.maren-morningstar: ["the Morningstar. heavier. the ghost pirates on Ludibrium's warped path were a real crew once. thin out thirty of them, then ask Jasper the bounty hunter there what their ship was called. he knows. he was navy too, once. sort of."]
    questAccept.maren-morningstar: ["Ludibrium, the third stretch of the warped path. the ghost pirates. then Jasper, by the weapon store in the evenings. tell him Maren asked. he'll pretend not to know me."]
    questWaiting.maren-morningstar: ["thirty, and the ship's name. i want the name."]
