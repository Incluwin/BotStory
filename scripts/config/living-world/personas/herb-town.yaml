# Herb Town cast: the town that plants for people it will never meet. 7 residents, 2 recruitable (Taejin the woodcutter
# for a share of bellflowers, Maren the pirate-hunter for a day rate), 1 arc (Oksun's hundred-year root, whose marker
# is wrapped in Meiwen's lost page from Mu Lung). Ids in quests/herb-town.yaml.
- id: oksun
  name: Oksun
  look: { gender: female }
  title: "Keeper of the Hundred-Year Garden"
  job: BEGINNER
  level: { min: 45, max: 45 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: herb-town
    routine:
      - { from: 5, to: 11, spot: "venue:by-lan-ming", activity: LINGER }
      - { from: 11, to: 13, spot: "venue:middle-central-street", activity: REST }
      - { from: 13, to: 18, spot: "venue:lower-west-street", activity: LINGER }
      - { from: 18, to: 21, spot: "venue:middle-east-street-2", activity: SOCIALIZE }
      - { from: 21, to: 5, materialize: false }
  recruitable: false
  knows: [herb town, bellflower root, sr. bellflower root]
  questLines: [oksun-the-old-gardens, oksun-dig-the-root, oksun-bellflower-beds]
  arc: oksun-the-hundred-year-root
  rumors: [herb-town-dig-it-this-year]
  relationships:
    - { persona: dohyun, kind: GRANDMOTHER_OF }
    - { persona: aeri, kind: TEACHES }
    - { persona: meiwen, kind: OWES_A_PAGE_TO }
  giftItemIds: [4000293, 4000292]
  dialogue:
    greetFirst: ["mind your feet. there's always something growing where you're about to step.", "a traveller. sit, sit. you look like you've been walking in the wrong boots. have some tea. Sookja makes it. i grow it."]
    greet: ["you're back. good. the gardens like company.", "hello, child. everything's growing. slowly. that's the right speed."]
    idle: ["(kneels to press the soil around a seedling with two fingers, very gently)", "(holds a dry root up to the light and turns it, counting the rings)"]
    noWork: ["nothing today. sit and watch something grow. it takes a while. that's the point."]
    nothingDue: ["you owe me nothing, child."]
    who: ["Oksun. i keep the herb gardens. the ten-year garden, the fifty, the hundred. my mother planted a bellflower root in the hundred-year garden the spring i was born. it's nearly ready. so am i, they tell me. i tell them not yet."]
    bye: ["walk gently. the ground remembers."]
    thanks: ["oh, you're a good child."]
    smallTalk: ["you plant a hundred-year root for someone you'll never meet. my mother planted mine for me. i've been planting for people i'll never meet all my life. that's what a garden is.", "the red-nose pirates think a hundred-year root is worth a fortune. it is. but not the kind they can spend."]
    speakPlainly: ["plainly: roots, a lot of patience, and an old woman."]
    questOffer.oksun-the-old-gardens: ["the bellflower roots have overrun the sixty- and eighty-year gardens. thirty of them back to the soil, and fifteen bellflowers for my tea? i'll tell you about my mother's root while we wait for the kettle."]
    questAccept.oksun-the-old-gardens: ["the sixty-year garden and the eighty-year garden. the roots walk. don't be alarmed. they've always walked."]
    questWaiting.oksun-the-old-gardens: ["fifteen bellflowers, child. the kettle's on."]
    questComplete.oksun-the-old-gardens: ["lovely. ...my mother's root is in the hundred-year garden. it's been there since the spring i was born. the marker rotted thirty years ago, so i wrapped a new one in paper from the Mu Lung library. i meant to give the paper back. i'll give it back when the root's up. a promise is a root too."]
    questOffer.oksun-dig-the-root: ["you heard Dohyun and me. it's time. the old bellflowers crowd my mother's root. thirty of them cleared, fifteen of their hundred-year flowers to plant back around the hole, and then Dohyun will dig. he's been waiting all his life to dig it."]
    questAccept.oksun-dig-the-root: ["the hundred-year garden and the bellflower valley. the old ones. they're slow and they're stubborn. so am i. then find Dohyun."]
    questWaiting.oksun-dig-the-root: ["is it up? don't tell me. bring the flowers first. then tell me."]
    questComplete.oksun-dig-the-root: ["...it's up. a hundred springs. it's the size of my arm. my mother would laugh at me crying over a root. i'm crying over a root. the paper's here. it's a little muddy. it kept her company."]
    questOffer.oksun-bellflower-beds: ["fifteen bellflowers for the beds, child? the roots keep walking off with them."]
    questAccept.oksun-bellflower-beds: ["the sixty-year garden."]
    questWaiting.oksun-bellflower-beds: ["fifteen."]
    questComplete.oksun-bellflower-beds: ["fifteen. good child."]
    about.dohyun: ["Dohyun's my grandson. he's going to dig my mother's root. he's been practising on potatoes for ten years."]
    about.aeri: ["Aeri's my apprentice. she asks why about everything. i answer about half. the other half she'll find out."]
    about.sookja: ["Sookja makes my herbs into tea and sells it to everyone who passes. i think she's the reason Herb Town has a name."]
    about.meiwen: ["Meiwen of Mu Lung. i've never met her. i've had her paper thirty years. that's not a nice thing to say about yourself. it's true."]
    aboutUnknown: ["i don't know them, child. are they growing anything?"]
    friend.close: ["you'd make a good gardener. you've got patient hands. i don't say that to people who haven't."]
    friend.best: ["i'm planting a root this spring. it'll be ready in a hundred years. it's for you. well. it's for whoever's like you then."]
    famed: ["they speak well of you. a good name grows like anything else. tend it."]
    defamed: ["they speak ill of you. weeds come up. pull them, child."]
    gift: ["oh, thank you, child."]
    gift.favorite: ["oh, you know what an old gardener likes. sit down. tea's coming."]
    gift.again: ["one's plenty today, child."]

