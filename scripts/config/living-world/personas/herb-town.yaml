  giftItemIds: [4000291, 2000002]
  dialogue:
    greetFirst: ["careful, that's my spade. well, it's grandma's spade. well, it's grandma's mother's spade. it's a very old spade.", "hi! are you here for the gardens? everyone's here for the gardens. or the pirates. mostly the gardens."]
    greet: ["hi! still digging.", "you're back! i've been practising. on potatoes."]
    idle: ["(digs a careful little trench beside the path with a very old spade, then fills it back in)", "(holds a spade upright and studies the edge, frowning)"]
    noWork: ["nothing today. grandma's hidden the spade. i know where. i'm being good."]
    nothingDue: ["we're even!"]
    who: ["Dohyun. Oksun's grandson. i dig. potatoes, mostly, and holes. grandma made me practise my whole life for one root."]
    bye: ["mind the holes! some of them are mine."]
    thanks: ["thanks! i'll dig you something."]
    smallTalk: ["you don't pull a hundred-year root. you dig round it. a hand's width at a time. grandma made me do it on a potato a thousand times.", "Gyuwon used to be a pirate. now he grows radishes. he says the radishes are harder."]
    speakPlainly: ["plainly: a spade and a very old root."]
    questOffer.dohyun-pot-shards: ["the water jars in the ten-year garden are cracked and grandma won't throw them out. the jar monsters out there are made of the same clay. twenty-five jars, fifteen shards, and i'll patch them."]
    questAccept.dohyun-pot-shards: ["the ten-year garden and the fifty-year one. the jars hop. it's funnier than it is dangerous. mostly."]
    questWaiting.dohyun-pot-shards: ["fifteen shards! the jars are leaking on my boots."]
    questComplete.dohyun-pot-shards: ["fifteen! they'll hold water again. grandma will say they always did. they didn't."]
    questOffer.dohyun-ask-gyuwon: ["the pirates want the hundred-year root. Gyuwon was a pirate. ask him if they'll come for it? he'll tell you. he won't tell me. he says i ask too loud."]
    questAccept.dohyun-ask-gyuwon: ["Gyuwon's by the east street in the evenings. he grows radishes now. compliment the radishes."]
    questWaiting.dohyun-ask-gyuwon: ["did he say? will they come?"]
    questComplete.dohyun-ask-gyuwon: ["they won't dig till it's ready, because they don't know how? ...then we dig first. and properly. a hand's width at a time."]
    about.oksun: ["grandma's the best gardener in the world. she says that's not true. she's wrong about one thing a year and that's it."]
    about.gyuwon: ["Gyuwon was a red-nose pirate. now he's a radish farmer. i don't trust him. grandma does. grandma's usually right. usually."]
    about.aeri: ["Aeri asks why about everything. i just dig. we're a good team."]
    aboutUnknown: ["never dug with them."]
    friend.close: ["you can hold the spade. not dig. hold."]
    friend.best: ["you're the only big person i'd let hold grandma's spade. that's the biggest thing i've got."]
    famed: ["everyone says you're great! i knew!"]
    defamed: ["people are saying stuff about you. i dug a hole and said it back at them. into the hole."]
    gift: ["for me? thanks!"]
    gift.favorite: ["oh, that's brilliant! that's going next to the spade."]
    gift.again: ["you already gave me something today!"]

