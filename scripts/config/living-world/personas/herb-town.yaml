    questWaiting.maren-leomite: ["fifteen bottles. the head's unsealed."]
    questComplete.maren-leomite: ["fifteen. sealed. the Leomite. two tens and five sixties, every one took. i've kept it nine years for the day i could swing it. you swing it now. carry it nine years for me."]
    questOffer.maren-hat-count: ["fifteen captain's hats. i like a tall pile."]
    questAccept.maren-hat-count: ["the dens."]
    questWaiting.maren-hat-count: ["fifteen."]
    questComplete.maren-hat-count: ["fifteen. the pile's taller than i am now."]
    about.gyuwon: ["Gyuwon sailed with the red-noses for ten years. he says he's done. i believe him. i still watch him. both can be true."]
    about.taejin: ["Taejin talks about trees. i talk about the sea. we've been drinking together three years and neither of us has learned a thing. it's perfect."]
    about.jasper: ["Jasper in Ludibrium. ex-Nautilus. he says. we've never served together. we've drunk together. that's close enough for sailors."]
    about.oksun: ["Oksun's root is worth more than every hat in my pile. the pirates know it. i know they know it."]
    aboutUnknown: ["never sailed with them."]
    friend.close: ["i'd let you hold the line in a den. i don't let anyone hold the line."]
    friend.best: ["if i ever catch the Brine Widow's captain, i want you there. not to help. to see it."]
    famed: ["heard you're good. good."]
    defamed: ["heard you're trouble. pirates are trouble. don't be a pirate."]
    gift: ["mm. thanks."]
    gift.favorite: ["oh. that's a sailor's kind of gift. practical. i'll keep it."]
    gift.again: ["one's plenty."]

