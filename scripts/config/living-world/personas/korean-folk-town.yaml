    about.okja: ["Okja wants a drum roll for every fortune. every one. i've got very strong wrists."]
    about.gwang: ["Gwang won't give me a skin. hunt your own, he says. i'm going to give him a drum anyway. he'll pretend he doesn't like it."]
    about.dalja: ["Dalja pays me in rice cakes for the festival. i drum faster with rice cakes."]
    aboutUnknown: ["never drummed for them."]
    friend.close: ["you can play the big drum at the festival. one beat. it's the loudest beat."]
    friend.best: ["i've made a rhythm for you. it's the best one. i play it when you come into the village. listen."]
    famed: ["the village says your name in time with the drum. i taught them."]
    defamed: ["boo! i'll drum over it."]
    gift: ["boom! thanks!"]
