# Korean Folk Town cast (Regional Residents wave 3, docs/REGIONAL_RESIDENTS_PLAN.md section 9): 7 Residents, 2
# recruitable. The village at the foot of Black Mountain: tigers, foxes, goblins, a scholar's ghost, and a little girl
# who talks into her father's old radio every night (arcs/korean-folk-town.yaml). The radio is a gray receiver, and
# Omega Sector hears her (arcs/omega-sector.yaml). Two recruits carry the third tier of the polearm and bow lines,
# earned in Ludibrium's clock tower up the Helios Tower lift.
