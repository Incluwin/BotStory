      - { from: 21, to: 7, materialize: false }
  recruitable: false
  knows: [dark axe stump, zeta gray, small spaceship]
  questLines: [bomi-the-persimmon-tree, bomi-the-hissing-radio, bomi-the-first-answer]
  arc: bomi-the-fathers-radio
  relationships:
    - { persona: dalja, kind: GETS_RICE_CAKES_FROM }
    - { persona: okja, kind: HAS_HER_FORTUNE_TOLD_BY }
    - { persona: lyra, kind: TALKS_TO }
  giftItemIds: [2001001, 2020005]
  dialogue:
    greetFirst: ["hello! do you want to see my radio? it's my dad's. it doesn't work. i talk to it anyway.", "you're new! i'm Bomi. i know everybody. now i know you."]
    greet: ["hi!", "you came back! i told the radio you would.", "hello hello."]
    idle: ["(holds an old radio up to her ear and listens very hard to nothing)", "(tells the radio something in a whisper, then nods as if it answered)"]
    noWork: ["nothing today. the persimmons aren't ripe. the radio isn't working. it's a waiting day."]
    nothingDue: ["you don't owe me anything! the radio says so."]
    who: ["Bomi. my dad went up Black Mountain for wood eight winters ago and he didn't come down. he left me his radio. he found it on the mountain. i tell it about my day every night. just in case."]
    bye: ["bye! i'll tell the radio you said hello."]
    thanks: ["thank you! i'll tell the radio."]
    smallTalk: ["the dark axe stumps at the bottom of Black Mountain scare the magpies off our persimmon tree. no magpies, no luck. Grandma Okja says so.", "my dad's radio has a picture on the back. a little ship with lights on it. it's not a ship from here. Grandma Okja says it came from the base under the tower. i don't know what's under the tower."]
    speakPlainly: ["plainly: my dad's radio."]
    questOffer.bomi-the-persimmon-tree: ["the dark axe stumps at the bottom of Black Mountain keep chasing the magpies off our persimmon tree. twenty of them. then the magpies can come back. then there's luck."]
    questAccept.bomi-the-persimmon-tree: ["the entrance to Black Mountain, and the corner. they've got axes. they're stumps. it's silly. be careful."]
    questWaiting.bomi-the-persimmon-tree: ["twenty. the magpies are waiting on the roof."]
    questComplete.bomi-the-persimmon-tree: ["the magpies came back! look! that's luck. here. Dalja says the persimmons aren't for giving till they're ripe. so, hot dogs."]
    questOffer.bomi-the-hissing-radio: ["Grandma Okja says my dad's radio isn't from here. it's from the base under the tower. could you take it to someone there who fixes things? and if they want something for it, i'll find it. i promise."]
    questAccept.bomi-the-hissing-radio: ["the base is under Ludibrium's tower, the one with the long stairs. Omega Sector. somebody there fixes things. be careful with it. it's my dad's."]
    questWaiting.bomi-the-hissing-radio: ["did they fix it? does it still hiss?"]
    questComplete.bomi-the-hissing-radio: ["it doesn't hiss! it hums! it's a nice hum. it's like when my dad used to hum. i'm going to tell it about today. thank you. thank you."]
    questOffer.bomi-the-first-answer: ["the lady on the radio lives at the base under the tower. could you go and find her? ask her her name. and ask her if she's real. she sounds real."]
    questAccept.bomi-the-first-answer: ["the base under Ludibrium's tower. she's by the big door in the day and the tunnel door at night. she's always near a radio."]
    questWaiting.bomi-the-first-answer: ["did you find her? is she real?"]
    questComplete.bomi-the-first-answer: ["Lyra! her name's Lyra! and she's real, and she's listening, and she always will be. she's not my dad. that's all right. i'll tell him about her. thank you!"]
    about.dalja: ["Dalja makes rice cakes. she gives me the broken ones. i think she breaks them on purpose."]
    about.okja: ["Grandma Okja tells fortunes. she says mine's good. she says it every day. i think it's getting better."]
    about.lyra: ["i don't know anyone called Lyra."]
    about.gwang: ["Gwang hunts tigers on Black Mountain. he says he looked for my dad. every winter. he still does."]
    aboutUnknown: ["i don't know them. do they like persimmons?"]
    friend.close: ["you can hold the radio. carefully. there. it likes you."]
    friend.best: ["i tell the radio about you every night. you're my favourite part."]
    famed: ["everyone in the village says your name! i told the radio!"]
    defamed: ["the radio says it's not true. i asked it."]
    gift: ["for me? thank you!"]
    gift.favorite: ["oh WOW. that's the best present. i'm going to share it with the radio. not really. it can't eat."]
    gift.again: ["one a day! Grandma Okja says so."]

