    questOffer.seori-white-nisrock: ["the White Nisrock. it wants a steady hand. forty grim phantom watches in the forbidden time. they stop your clock. let them try."]
    questAccept.seori-white-nisrock: ["the forbidden time, behind the phantom watches. breathe slow. aim slower."]
    questWaiting.seori-white-nisrock: ["forty. steady."]
    questComplete.seori-white-nisrock: ["forty. the White Nisrock. seven sixties, every one took. it's the colour of the moon. of course it is."]
    questOffer.seori-dragon-shiner-bow: ["the Dragon Shiner Bow. the best bow there is. two of Thanatos in the forgotten passage, and thirty phantom watches on the way in, so nothing's behind you."]
    questAccept.seori-dragon-shiner-bow: ["the forgotten path to its end. the passage. look up while you wait."]
    questWaiting.seori-dragon-shiner-bow: ["two, and thirty. nothing behind you."]
