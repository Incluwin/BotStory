  giftItemIds: [2000004, 2020004]
  dialogue:
    greetFirst: ["you walk like a hunter. quiet. good. sit.", "a stranger. welcome to the village. mind the mountain. it minds you."]
    greet: ["hm.", "you.", "good hunting?"]
    idle: ["(leans on a long polearm and watches Black Mountain without blinking)", "(winds a cord round a spear haft, tight and even)"]
    noWork: ["nothing today. the mountain's quiet. i don't trust it."]
    nothingDue: ["nothing owed. the trail's even."]
    who: ["Gwang. i hunted tigers on Black Mountain when there were tigers worth hunting. now the tigers are small and i train in Ludibrium's clock tower, up the Helios lift. a hunter keeps his arm or he loses it."]
    bye: ["walk quietly."]
    thanks: ["hm. thanks."]
    smallTalk: ["the dark klocks in the clock tower carry an evil spirit in them. you can hear it when you hit them. i don't like the sound. i hit them anyway.", "Bomi's father went up the mountain for wood eight winters ago. i've looked for him every winter since. i'll look this winter."]
    speakPlainly: ["plainly: a hunter with no tigers left."]
    offer: ["a hundred and ten thousand for a day. a hunter's day starts before light and ends after it. you pay for all of it, and you get all of it."]
    join: ["walk with me. quietly."]
    bench: ["four days. then the mountain calls."]
    leave: ["back to the mountain."]
    refuse.bond: ["i don't hunt beside strangers. strangers make noise."]
    refuse.flags: ["walk the clock tower trail with me first. then ask."]
    refuseOwnErrand: ["walk my trail first."]
    questOffer.gwang-the-tiger-trail: ["walk my trail. the dark klocks on the forgotten path of time, in the clock tower. thirty of them. and on the way back, stand on Tiger Ridge and tell me if you can hear anything. i can't, any more."]
    questAccept.gwang-the-tiger-trail: ["the Helios Tower lift to Ludibrium, then the clock tower. come home by Tiger Ridge."]
    questWaiting.gwang-the-tiger-trail: ["thirty, and the ridge."]
    questComplete.gwang-the-tiger-trail: ["thirty, and you heard the wind. that's all there is now. you walk quietly. good."]
    questOffer.gwang-hellslayer: ["the Hellslayer. a polearm for a hunter. i want it broken in on the spirit vikings on the warped path. thirty of them. they sail on nothing. sink them."]
    questAccept.gwang-hellslayer: ["the warped path of time, the fourth stretch. they come in waves."]
    questWaiting.gwang-hellslayer: ["thirty. let them come."]
    questComplete.gwang-hellslayer: ["thirty. the Hellslayer. seven safe scrolls, every one took. it's longer than your arm. so is your reach now."]
    questOffer.gwang-zedbug: ["the Zedbug. it wants the phantom watches on the forgotten path. forty of them. they stop time. don't let them stop you."]
    questAccept.gwang-zedbug: ["the forgotten path of time, the fourth stretch. keep moving."]
    questWaiting.gwang-zedbug: ["forty. keep moving."]
    questComplete.gwang-zedbug: ["forty. the Zedbug. seven sixties, every one took. that's a hunter's weapon. you're a hunter."]
    questOffer.gwang-dragon-chelbird: ["the Dragon Chelbird. the best polearm i've ever seen. it wants the two keepers of the clock tower. two gatekeepers in the warped passage, two of Thanatos in the forgotten passage."]
    questAccept.gwang-dragon-chelbird: ["both passages, at the ends of both paths. sit still till they come. that's hunting."]
    questWaiting.gwang-dragon-chelbird: ["two and two. patience."]
    questComplete.gwang-dragon-chelbird: ["two and two. the Dragon Chelbird. two tens and five sixties, every one took. take it up the mountain one day. for me."]
    questOffer.gwang-evil-spirits: ["ten evil spirits? the dark klocks again. i burn them. it's quieter after."]
    questAccept.gwang-evil-spirits: ["the forgotten path."]
    questWaiting.gwang-evil-spirits: ["ten."]
    questComplete.gwang-evil-spirits: ["ten. quieter."]
    about.seori: ["Seori shoots the moon off Moon Ridge. i've seen her do it. well. nearly."]
    about.bomi: ["Bomi talks to her father's radio every night. i walked the mountain for him. every winter. i'll walk it this winter."]
    aboutUnknown: ["never hunted with them."]
    friend.close: ["you can walk the mountain with me any time. quietly."]
    friend.best: ["if i ever find a tiger worth the hunt again, you'll be the one i take."]
    famed: ["the village says your name. quietly. that's respect here."]
    defamed: ["hm. talk is loud. the mountain's louder."]
    gift: ["hm. thank you."]
    gift.favorite: ["now that's a hunter's meal. good. thank you."]
    gift.again: ["one a day. i'm a hunter, not a bear."]

