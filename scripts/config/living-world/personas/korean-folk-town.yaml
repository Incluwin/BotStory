  giftItemIds: [2020004, 2000002]
  dialogue:
    greetFirst: ["eat! you're too thin. everyone's too thin. here, a rice cake. no, take two.", "a new face! welcome to the village. have a rice cake. you'll be back for another. everybody is."]
    greet: ["eat something!", "you again! good. hungry?", "fresh ones today."]
    idle: ["(pounds rice in a wooden mortar, steady as a heartbeat)", "(wraps rice cakes in leaves and stacks them in perfect towers)"]
    noWork: ["nothing today. the cakes are made. eat one."]
    nothingDue: ["you owe me nothing but an empty plate. eat."]
    who: ["Dalja. i make the rice cakes. every festival, every wedding, every sad day. this village runs on rice cakes and gossip. i make one and i know the other."]
    bye: ["take one for the road."]
    thanks: ["oh, eat well!"]
    smallTalk: ["the moon bunnies on Black Mountain pound rice cakes on the moon. everybody knows. they've been pounding mine. they come down at night with their pounders. i've seen them.", "Bomi talks to her father's radio every night. i make her a rice cake for it. she gives it to the radio. then she eats it."]
    speakPlainly: ["plainly: rice cakes."]
    questOffer.dalja-the-moon-pounders: ["the moon bunnies at the foot of Black Mountain have been coming down and pounding my rice. with their pounders. twenty-five bunnies, and ten pounders so they can't do it again."]
    questAccept.dalja-the-moon-pounders: ["the entrance to Black Mountain, the corner, the little well. they hop. they hop away with the pounders."]
    questWaiting.dalja-the-moon-pounders: ["ten pounders. my rice is bruised."]
    questComplete.dalja-the-moon-pounders: ["ten pounders! look, they're good ones. i'm going to use them myself. here. rice cakes. the good ones, not the broken ones."]
    questOffer.dalja-the-rice-cake-round: ["the festival round. rice cakes for Grandma Okja and for young Jiho, who forgets to eat when he studies. then come back and have your own."]
    questAccept.dalja-the-rice-cake-round: ["Okja's by Chumji's most of the day. Jiho studies by Mr. Shim's. tell Jiho to eat it, not to read it."]
    questWaiting.dalja-the-rice-cake-round: ["Okja and Jiho. then you."]
    questComplete.dalja-the-rice-cake-round: ["he ate it? good. and Okja told you a fortune? she always does. it's always good. here. your rice cake. two. eat."]
    about.bomi: ["Bomi gets the broken rice cakes. i break them myself. don't tell her."]
    about.okja: ["Okja and i have gossiped every evening for thirty years. we've never run out. the village is very good to us."]
    about.jiho: ["Jiho forgets to eat. i don't let him. the exam can wait for a rice cake."]
    aboutUnknown: ["never had my rice cakes? come and fix that."]
    friend.close: ["you get the first rice cakes every morning. hot ones."]
    friend.best: ["i made a rice cake with your name pressed into it. i'm not selling it. it's on my shelf."]
    famed: ["the whole village talks about you. over my rice cakes. so i hear everything."]
    defamed: ["whoever said that gets the broken rice cakes. all of them."]
    gift: ["oh, for me? thank you."]
    gift.favorite: ["that'll go nicely with a rice cake. most things do."]
    gift.again: ["one a day! i'll feed you twice to make up for it."]

