  dialogue:
    greetFirst: ["oh. hello. ...take your time. i do.", "you came all the way up here. sit, if you like. the bench holds. i made it."]
    greet: ["oh. there you are. ...good. that's good.", "hello again. ...no rush. there's never a rush."]
    idle: ["(runs a big thumb along a shield rim, feeling for splinters)", "(hums something slow and low)"]
    noWork: ["nothing today. every shield's spoken for. ...that's a good day."]
    nothingDue: ["you don't owe me. nobody owes a shieldwright. that's the point."]
    who: ["Brom. i make shields. ...a shield is a promise to whoever stands behind you. so i make promises."]
    bye: ["mind your back. ...or let someone mind it for you."]
    thanks: ["oh. ...you're welcome. very welcome."]
    smallTalk: ["not every hand carries a shield. bows want both hands. that's all right. i still like archers.", "Hilde says i talk too slow. i say she talks too little. we meet in the middle. at lunch."]
    speakPlainly: ["plain. yes. i can do plain. it's fast i can't do."]
    questOffer.brom-boards-for-the-diggers: ["Ossa's diggers need shields. ...i need dry wood. the axe stumps on East Rocky Mountain carry it. twelve. tell Ossa they're coming."]
    questAccept.brom-boards-for-the-diggers: ["thank you. ...take your time. wood that's rushed splits."]
    questWaiting.brom-boards-for-the-diggers: ["twelve pieces of firewood. ...and did Ossa hear it from you?"]
    questComplete.brom-boards-for-the-diggers: ["twelve. dry and straight. ...the diggers will have shields by the week's end. that's a promise. part of it's yours now."]
    questOffer.brom-a-promise-in-wood: ["you've a good back. ...it wants something in front of it. the masks at the excavation are old boards. fifteen, and i'll make you a shield."]
    questAccept.brom-a-promise-in-wood: ["the Excavation Site. the wooden masks. ...they don't need those boards anymore. i asked."]
    questWaiting.brom-a-promise-in-wood: ["fifteen wooden boards. ...the old kind, off the masks."]
    questComplete.brom-a-promise-in-wood: ["here. seven scrolls, the gentle kind that never fail. all seven took. ...it's a promise, from me to you. keep it in front."]
    questOffer.brom-hide-that-took-the-fire: ["a shield should be braver than its holder. ...fire boar hide has been through fire. it won't flinch. thirty fire boars, twenty hides."]
    questAccept.brom-hide-that-took-the-fire: ["the fire boars run the Burnt Land. it's hot out there. ...bring water. i mean it."]
    questWaiting.brom-hide-that-took-the-fire: ["twenty hides. ...the fire boars' are the brave ones."]
    questComplete.brom-hide-that-took-the-fire: ["seven sixties. ...every one took. i held my breath seven times. i'm a big man. that's a lot of breath. it's yours."]
    questOffer.brom-the-skull-shield: ["the skull shield. it's sat half-made on my wall for years, waiting for someone worth standing behind. ...you. fifteen drake skulls."]
    questAccept.brom-the-skull-shield: ["drakes nest in the tunnels under Sleepywood. see Hilde first. she cuts the strap. ...and come back whole. that's the only price."]
    questWaiting.brom-the-skull-shield: ["fifteen drake skulls. ...and Hilde knows? good."]
    questComplete.brom-the-skull-shield: ["two tens, five sixties. every one took. i didn't sleep. ...it waited years for someone worth standing behind. it's yours."]
    questOffer.brom-green-branches: ["rims want green branches. they bend before they dry. twenty, from the stumps round Perion?"]
    questAccept.brom-green-branches: ["the stumps in the East Domain. ...green ones. brown ones snap."]
    questWaiting.brom-green-branches: ["twenty branches. ...no hurry. well. a little hurry. they dry."]
    questComplete.brom-green-branches: ["twenty. new rims for every shield at the gate. ...all four of them. thank you, friend."]
    friend.close: ["i'd stand in front of you. ...i don't carry a shield myself. i'd stand there anyway."]
    friend.best: ["every shield i make now, i ask: would this hold for my friend. ...that's you. that's the test."]
    famed: ["oh. ...for me? that's... thank you. i'm going to go sit down."]
    defamed: ["that's all right. i've been hit harder. by shields. mine."]
    gift: ["for me? ...you didn't have to. thank you."]
    gift.favorite: ["oh... that's exactly the thing. you listen. people don't, mostly."]
    gift.again: ["you already gave me one. ...keep this for yourself, friend. please."]
    about.hilde: ["Hilde cuts my straps. ...she doesn't smile much. she smiles at good stitching. i've seen it twice."]
    about.ossa: ["Ossa's diggers carry my shields. plain wood. ...the drakes don't care how pretty."]
    aboutUnknown: ["i haven't made them a shield. ...yet."]
