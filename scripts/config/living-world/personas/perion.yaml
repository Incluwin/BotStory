    aboutUnknown: ["not on my roster."]

- id: halvard
  name: Halvard
  title: "Quarry Spearman"
  job: SPEARMAN
  level: { min: 31, max: 34 }
  strength: SEASONED
  loadout: perion-spearman-l32
  personality: relaxed-v1
  home:
    town: perion
    routine:
      - { from: 5, to: 17, spot: "venue:lower-square", activity: LINGER }
      - { from: 17, to: 24, activity: SOCIALIZE }
      - { from: 0, to: 5, materialize: false }
  recruitable: true
  contract: halvard-day-rate
  questLines: [halvard-quarry-teeth]
  benchToleranceDays: 30
  paceGap: 2
  dialogue:
    greetFirst: ["big spear, small talk. what do you need?", "you're not from the quarry. everyone from the quarry is dusty."]
    greet: ["hey! quarry's slow, talk to me.", "good to see a face without dust on it."]
    idle: ["(spins a spear like it weighs nothing)"]
    noWork: ["nothing today. want to spar?"]
    nothingDue: ["nah we're good."]
    who: ["Halvard. quarry spearman. i keep the drakes off the diggers. mostly."]
    bye: ["don't fall in a pit!"]
    thanks: ["cheers!"]
    smallTalk: ["a drake's skull is worth more than my week. i've considered a career change."]
    speakPlainly: ["simpler. i'm a spearman, not a scholar."]
    refuse.bond: ["i'd go with you but i don't know you from a drake."]
    offer: ["sure! day rate, though. and prove you can handle the excavation: twenty copper drakes, counted from now."]
    join: ["let's go! spear in front!"]
    bench: ["i'll be at the quarry. take your time, i've got patience."]
    leave: ["good hunt. the quarry'll still be here."]
    refuseOwnErrand: ["ha, that's your job. i'm the hired spear."]
    questOffer.halvard-quarry-teeth: ["drakes have skulls thick enough to make helmets. six drake skulls and the foreman gets off my back."]
    questWaiting.halvard-quarry-teeth: ["six skulls. drake skulls. the big lizards."]
    questComplete.halvard-quarry-teeth: ["six! the foreman owes me. and i owe you. that's how it goes."]
    aboutUnknown: ["dunno them. do they like spears?"]

