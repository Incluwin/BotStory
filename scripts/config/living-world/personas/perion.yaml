  relationships:
    - { persona: garrick, kind: LOST }
  dialogue:
    greetFirst: ["state your business at the gate.", "civilian. stay behind the line."]
    greet: ["you.", "the gate holds. barely."]
    idle: ["(watches the west road without blinking)"]
    noWork: ["the road is quiet. that's when i worry."]
    who: ["Tamsin. captain of what's left of the Perion guard."]
    bye: ["stay inside the walls."]
    thanks: ["do your duty. that's thanks."]
    smallTalk: ["i had twelve guards. i have four. do the arithmetic yourself."]
    questOffer.tamsin-hold-the-gate: ["wild boars at the west domain. thirty. the gate can't hold them and the four of us."]
    questComplete.tamsin-hold-the-gate: ["thirty. the gate holds another week."]
    questOffer.tamsin-the-copper-drakes: ["copper drakes at the excavation. twenty. that's guard work and i've no guard to send."]
    questComplete.tamsin-the-copper-drakes: ["twenty drakes. you'd have made the guard. you'd have left it, too. they all do."]
