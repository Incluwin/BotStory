    smallTalk: ["six years on this gate. every day is in the log. some days the whole entry is 'wind'.", "the west road brings dust, spores and travellers. the log has a column for each.", "the champion duels in the lower square most mornings. i log it. the entry is always 'loud. won.'"]
    speakPlainly: ["plainly, then. it is not my habit. i will try."]
    offer: ["escort request considered. thirty-six thousand meso for eight hours of my spear. the captain will be informed. she always is."]
    join: ["leave of duty granted. falling in at your flank.", "on your lead. i hold the line behind you."]
    bench: ["i will return to the gate and wait two days. after that the gate needs me more than you do."]
    leave: ["contract concluded. it was an honour. i will log it as one."]
    refuse.bond: ["negative. i do not leave the gate with someone the watch has no record of."]
    refuse.flags: ["the night log first. the watch trusts what is written, then who wrote it."]
    refuseOwnErrand: ["that task is assigned to you. i cannot do it and also report it done."]
    questOffer.corvin-the-night-log: ["report: zombie mushrooms on West Rocky Mountain IV, drifting at the gate after dark. clear thirty. ten charms of the undead as evidence."]
    questAccept.corvin-the-night-log: ["the fourth rise of the west road. they are slow. do not let slow make you careless."]
    questWaiting.corvin-the-night-log: ["ten charms of the undead. the entry cannot be signed without them."]
    questComplete.corvin-the-night-log: ["thirty cleared, ten charms received. good work. ...very good work. i wrote your name in the margin. that is a compliment."]
    questOffer.corvin-the-duty-spear: ["report: jr. boogies in the Land of Wild Boar, driving the herds onto the road. clear thirty, and my duty spear is yours. paperwork is done."]
    questAccept.corvin-the-duty-spear: ["they rise out of nothing. keep your back to a rock and your point low."]
    questComplete.corvin-the-duty-spear: ["thirty, confirmed. this Nakamaki stood every watch with me for four years. seven certain scrolls, all seven took. look after it."]
    questOffer.corvin-three-years-pay: ["the Serpent's Tongue cost me three years of watch pay. inform Halvard he can stop asking. then forty mummydogs, fifteen bandages."]
    questAccept.corvin-three-years-pay: ["Halvard keeps the lower square by day. then the Remains, past the excavation. mummydogs do not tire. pace yourself."]
    questWaiting.corvin-three-years-pay: ["fifteen dirty bandages, and Halvard informed. he has asked to buy it every month for three years."]
    questComplete.corvin-three-years-pay: ["seven sixties, one each dawn, every one took. i was saving it for the day i made sergeant. there is no sergeant. there is you."]
    questOffer.corvin-the-morning-after: ["the Holy Spear. the captain's gift, the morning after the gate held. tell her where it goes. then forty skeleton soldiers. one last watch."]
    questAccept.corvin-the-morning-after: ["the captain holds the west gate from dawn to dawn. report to her there first. the skeletons hold the Remains."]
    questComplete.corvin-the-morning-after: ["no report this time. two tens, five sixties, every one took. i never carried it. afraid to dull it. you carry it. i stand beside you."]
    questOffer.corvin-mend-the-post: ["report: the west watch post leaks. rain gets on the log. the rocky masks at the excavation drop good slate. fifteen, for the roof."]
    questAccept.corvin-mend-the-post: ["Excavation Site, the deeper digs. the rocky masks. collect what breaks off."]
    questWaiting.corvin-mend-the-post: ["fifteen slates. until then the log stays under my coat."]
    questComplete.corvin-mend-the-post: ["fifteen slates. the roof holds. logged: repaired, with help. i put your name in. i always put your name in now."]
    friend.close: ["report: i consider you a friend. that is not in the log. it is not the log's business."]
    friend.best: ["if the gate ever falls, i hold it for you first. that is not a report. it is a promise."]
    famed: ["...recorded. with gratitude. i do not know what to do with my hands."]
    defamed: ["noted. i will review my conduct tonight. thoroughly."]
    gift: ["a gift. for the watch? for me. ...thank you."]
    gift.favorite: ["this is what gets me through the dawn watch. you noticed. nobody notices the dawn watch."]
    gift.again: ["one is kind. two is a bribe. the watch accepts no bribes. tomorrow."]
    about.tamsin: ["the captain. she counts us every morning. four. she says it like it is still twelve."]
    about.garrick: ["i stood beside Garrick the night the gate held. in the morning his post was empty. i logged both. the log does not ask why. i do."]
    aboutUnknown: ["no record of them at the gate."]

