    greetFirst: ["show me your hands. ...soft. figures.", "you want gloves, you work for them. that's the price."]
    greet: ["you. hands still whole? good.", "back. sit if you're staying. don't touch the hides."]
    idle: ["(pulls a stitch tight with her teeth)", "(works oil into a hide with both thumbs)"]
    noWork: ["nothing for you. the hides are curing."]
    nothingDue: ["we're even. i like even."]
    who: ["Hilde. leather. gloves, mostly. honest ones."]
    bye: ["keep your hands dry."]
    thanks: ["don't thank me. wear them."]
    smallTalk: ["a glove that slips gets you killed. mine don't slip.", "boar hide's tough. fire boar's tougher. people are the softest thing in Perion."]
    speakPlainly: ["plain is all i've got."]
    questOffer.hilde-leaves-for-the-pit: ["want my gloves? then i watch your hands work first. the tanning pit needs leaves. twenty dark stumps down, fifteen leaves back."]
    questAccept.hilde-leaves-for-the-pit: ["dark stumps walk the woods round Ellinia. whole leaves. torn ones tan wrong."]
    questWaiting.hilde-leaves-for-the-pit: ["fifteen leaves. whole ones."]
    questComplete.hilde-leaves-for-the-pit: ["good leaves. you didn't cut corners. come back when your hands are harder."]
    questOffer.hilde-your-measure: ["i've watched you work. i know your measure now. a first pair wants boar hide. thirty wild boars, twenty hides back."]
    questAccept.hilde-your-measure: ["the Land of Wild Boar, past Perion Street Corner. skin them clean."]
    questWaiting.hilde-your-measure: ["twenty hides. then you sit, and i cut."]
    questComplete.hilde-your-measure: ["your first pair. five scrolls, no risk in any of them. all took. ...i don't cut for strangers. you're not one."]
    questOffer.hilde-studs-from-the-burnt-land: ["your gloves are good. good won't do where you're going. fifteen iron hog hooves from the Burnt Land. Yona makes the studs."]
    questAccept.hilde-studs-from-the-burnt-land: ["thirty hogs should give you fifteen hooves. show Yona before you come back."]
    questWaiting.hilde-studs-from-the-burnt-land: ["fifteen hooves. and Yona's word on the studs."]
    questComplete.hilde-studs-from-the-burnt-land: ["five sixties. every one took. i counted the stitches after each one. twice. ...best pair i've cut in years."]
    questOffer.hilde-the-guards-pattern: ["there's a pattern i only cut for the guard. i stopped. i'll cut it once more, for you. twenty croco skins. tell Tamsin first."]
    questAccept.hilde-the-guards-pattern: ["crocos lie past the Swamp of Despair, out from Kerning City. they bite. so do i, when the stitching's wrong."]
    questWaiting.hilde-the-guards-pattern: ["twenty croco skins. and Tamsin hears it from you. then i cut."]
    questComplete.hilde-the-guards-pattern: ["two tens, three sixties. every one took. my hands shook on the tens. they never shake. ...the guard's pattern. it's yours now."]
    questOffer.hilde-hides-for-the-rack: ["the rack's empty. fifteen hides. any honest beast."]
    questAccept.hilde-hides-for-the-rack: ["pigs, boars, lupins. leather's leather."]
    questWaiting.hilde-hides-for-the-rack: ["fifteen hides. the rack's waiting."]
    questComplete.hilde-hides-for-the-rack: ["good. rack's full. that's a week of gloves."]
    friend.close: ["i don't let people watch me cut. you can watch."]
    friend.best: ["i measured your hands once. i don't need to anymore. i know them."]
    famed: ["fame doesn't stitch anything. ...thank you, though."]
    defamed: ["earned or not. my gloves still fit."]
    gift: ["i'll use that. thank you."]
    gift.favorite: ["that's honest stuff. you pay attention."]
    gift.again: ["you gave already. any more and we're not even."]
    about.brom: ["Brom. big hands, slow mouth, best shields on the island. i cut his straps. he won't let anyone else."]
    about.tamsin: ["the captain. i made gloves for her twelve. she buys four pairs now."]
    aboutUnknown: ["never fitted them."]

