    idle: ["(hammers something that was already flat)"]
    noWork: ["the forge is fed. rare."]
    nothingDue: ["you're paid up."]
    who: ["Yona. i make the steel this town swings. i also fix what it breaks."]
    bye: ["mind the sparks."]
    thanks: ["thank the iron."]
