    questAccept.brunhild-a-seasons-purses: ["past the fire boars, deeper in. iron boars charge in pairs. let them come."]
    questWaiting.brunhild-a-seasons-purses: ["fifteen iron boar plates. i want proof, not a story. i tell the stories."]
    questComplete.brunhild-a-seasons-purses: ["fifteen plates. ha. i bought the Fang for the day i'd grow into it. seven sixties, every one took. you grew first. it's yours."]
    questOffer.brunhild-the-champions-sword: ["Sparta. the prize that came with my title, on my wall ever since. tell Garrick it's leaving. then forty red drakes under Sleepywood."]
    questAccept.brunhild-the-champions-sword: ["Garrick sits up on the ledge like a gargoyle. then the tunnels. red drakes breathe fire. so do i."]
    questComplete.brunhild-the-champions-sword: ["you came out of the fire. ...no joke this time. two tens, five sixties, every one took. i was saving its first swing. it's yours."]
    questOffer.brunhild-teeth-for-the-wall: ["anyone who stands their ground against me gets a fire boar tooth on my wall, name scratched under it. i'm out of teeth. fifteen."]
    questAccept.brunhild-teeth-for-the-wall: ["fire boars, the Burnt Land. they bite. bite back."]
    questWaiting.brunhild-teeth-for-the-wall: ["fifteen fire boar teeth. i count them out loud. everyone hears."]
    questComplete.brunhild-teeth-for-the-wall: ["fifteen. that's fifteen more names on the wall. yours is at the top. i moved it."]
    friend.close: ["you've stood your ground every single time. i've told the whole square. twice."]
    friend.best: ["if anyone asks who the champion of the Burnt Land is, i'll say both of us. i've never shared a title. i'm sharing this one."]
    famed: ["ha. fame, for me? i'll take it. i'll take it loudly."]
    defamed: ["bold. i like bold. say it again in the Burnt Land, with a sword in your hands."]
    gift: ["for me? i'm telling everyone."]
    gift.favorite: ["now that's a fighter's gift. sit down, we'll split it. i insist."]
    gift.again: ["another one? i'm generous, not greedy. tomorrow."]
    about.garrick: ["Garrick. best sword-arm the guard ever had. i put him on his back once. then he quit the guard and climbed a ledge. i'm still waiting."]
    about.corvin: ["Corvin logs every duel i fight in the square. i've read them. 'loud. won.' best reviews in Perion."]
