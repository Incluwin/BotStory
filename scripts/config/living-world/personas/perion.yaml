# Perion cast: the guard that deserted. 8 residents, 2 recruitable (Garrick through his arc, Halvard for meso and a kill proof), 1 arc.
- id: garrick
  name: Garrick
  title: "Deserter of Perion"
  job: FIGHTER
  level: { min: 28, max: 32 }
  strength: VETERAN
  loadout: perion-warrior-l30
  personality: efficient-v1
  home:
    town: perion
    routine:
      - { from: 6, to: 11, spot: "venue:market-approach", activity: LINGER }
      - { from: 11, to: 18, spot: "venue:middle-ledge", activity: SHOW_OFF }
      - { from: 18, to: 24, spot: "rest:2", activity: REST }
      - { from: 0, to: 6, materialize: false }
  recruitable: true
  contract: garrick-blood-debt
  questLines: [garrick-lost-badge, garrick-boar-cull]
  arc: garrick-redemption
  rumors: [perion-campfire-confession]
  benchToleranceDays: 2
  paceGap: 3
  maxLag: 6
  relationships:
    - { persona: yona, kind: OWES }
    - { persona: tamsin, kind: DESERTED }
  dialogue:
    greetFirst: ["what.", "make it quick."]
    greet: ["you again.", "still here."]
    idle: ["(sharpens a blade)", "cold up here."]
    noWork: ["nothing. go bother the guard."]
    nothingDue: ["you owe me nothing. that's how i like people."]
    who: ["Garrick. i was Perion guard. was."]
    bye: ["go on."]
    thanks: ["hm."]
    smallTalk: ["the cliffs don't ask questions. that's why i'm up here."]
    speakPlainly: ["say it straight."]
    refuse.bond: ["i don't know you. i don't fight beside people i don't know."]
    refuse.arc: ["there's a story you haven't heard. the smith knows it."]
    refuse.flags: ["earn it first."]
    offer: ["one condition. a sword worth carrying, the meso for the smith, and thirty fire boars dead first. i want to see you can bleed."]
    join: ["fine. stay out of my swing."]
    bench: ["i don't wait around. two days, then i'm gone."]
    leave: ["that's my debt paid. don't follow me."]
    refuseOwnErrand: ["that one's your errand, not mine."]
    questOffer.garrick-lost-badge: ["lost my unit badge near the boars. bring it and we talk."]
    questWaiting.garrick-lost-badge: ["the badge. not a tooth. the badge."]
    questComplete.garrick-lost-badge: ["...huh. didn't think you'd bother."]
    questOffer.garrick-boar-cull: ["the fire boars are pushing into the domain. forty. and i want to be there, if you're going."]
    questAccept.garrick-boar-cull: ["good. call me when you're at the boars."]
    questComplete.garrick-boar-cull: ["forty. that's a guard's day. i remember it."]
    about.yona: ["Yona. i owe her a sword and an apology. she'll take the sword."]
    about.tamsin: ["the captain. she knows why i left. she won't say. neither will i."]
    aboutUnknown: ["never served with them."]

