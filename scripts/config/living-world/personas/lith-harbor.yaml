# Lith Harbor cast: arrivals and debts. 8 residents, 2 recruitable (Brannock early, Hadrik through his arc).
- id: olwen
  name: Olwen
  title: "Harbormaster's Ledger-Keeper"
  job: BEGINNER
  level: { min: 12, max: 14 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: lith-harbor
    routine:
      - { from: 6, to: 20, spot: "venue:olaf-crossroads", activity: LINGER }
      - { from: 20, to: 24, spot: "venue:central-benches", activity: REST }
      - { from: 0, to: 6, materialize: false }
  recruitable: false
  questLines: [olwen-snail-tally, olwen-lost-manifest]
  relationships:
    - { persona: hadrik, kind: DISAPPROVES }
    - { persona: pim, kind: FEEDS }
  dialogue:
    greetFirst: ["new face. sign the ledger or keep walking.", "you're not on my list. yet."]
    greet: ["back again.", "the ledger doesn't fill itself.", "make it quick, the tide's turning."]
    idle: ["(scratches at the ledger)", "numbers don't lie. people do."]
    noWork: ["nothing needs counting today.", "come back when the snails have been at the crates again."]
    nothingDue: ["you owe me nothing. yet."]
    who: ["Olwen. i count what comes off the boats and what crawls back into the sea."]
    bye: ["mind the ropes."]
    thanks: ["put it in writing."]
    smallTalk: ["weather's weather.", "i don't do small talk. i do tallies."]
    speakPlainly: ["speak plainly. i have a ledger to keep."]
    questOffer.olwen-snail-tally: ["snails are eating the rope stock at the 3-way road. bring me fifteen fewer snails."]
    questAccept.olwen-snail-tally: ["good. count them. i will."]
    questComplete.olwen-snail-tally: ["fifteen. huh. you can count."]
    questOffer.olwen-lost-manifest: ["a manifest went overboard. the blue snails have the paper by now. five shells, and i'll rewrite it."]
    questWaiting.olwen-lost-manifest: ["five shells. blue ones. not whatever that is."]
    questComplete.olwen-lost-manifest: ["that'll do. the harbormaster owes you, which means i do."]
    about.hadrik: ["drinks his pension on the upper deck. used to be worth something."]
    about.pim: ["the kid steals bread. i leave some out. don't tell anyone."]
    aboutUnknown: ["not in my ledger."]

- id: brannock
  name: Brannock
  title: "Deckhand"
  job: WARRIOR
  level: { min: 13, max: 16 }
  strength: ROOKIE
  loadout: dock-worker
  personality: relaxed-v1
  home:
    town: lith-harbor
    routine:
      - { from: 5, to: 18, spot: "venue:ship-upper-deck", activity: LINGER }
      - { from: 18, to: 24, activity: SOCIALIZE }
      - { from: 0, to: 5, materialize: false }
  recruitable: true
  contract: brannock-day-wage
  questLines: [brannock-crates, brannock-mushroom-run]
  rumors: [lith-dock-confession]
  benchToleranceDays: 7
  paceGap: 2
  relationships:
    - { persona: tobin, kind: PROTECTS }
    - { persona: hadrik, kind: ADMIRES }
  dialogue:
    greetFirst: ["oh hey. you new? everyone's new here.", "hey! don't mind the smell, that's the fish. or me."]
    greet: ["hey hey.", "you again! good.", "what's the word?"]
    idle: ["(hauls a crate that doesn't need hauling)", "one day i'm getting on one of these boats. the right direction."]
    noWork: ["nothing right now, but stick around."]
    nothingDue: ["nah we're square."]
    who: ["Brannock. deckhand, crate-hauler, future adventurer. mostly the first two."]
    bye: ["catch you at the docks!"]
    thanks: ["anytime!"]
    smallTalk: ["did you see the size of that snail? no? okay."]
    speakPlainly: ["uh. say that simpler?"]
    offer: ["for real? okay, okay. here's the thing, i've got debts.", "you'd take me? alright, but i can't go for free."]
    join: ["let's go! finally!", "grab your stuff, i'm ready!"]
    bench: ["cool, i'll train up while you're gone.", "i'll be here. or at the mushrooms."]
    leave: ["that was fun. see you around the harbor.", "back to crates, i guess."]
    refuse.bond: ["i barely know you. help me with the crates first."]
    refuse.flags: ["finish the crate thing first, then we talk."]
    refuseOwnErrand: ["that's your errand! i'd feel weird farming my own favor."]
    questOffer.brannock-crates: ["the shrooms at the 3-way road keep breaking into the crates. ten caps and i can prove it to Olwen."]
    questAccept.brannock-crates: ["you're the best. orange caps, ten of them!"]
    questWaiting.brannock-crates: ["ten orange caps. i'll wait."]
    questComplete.brannock-crates: ["ten! Olwen has to believe me now."]
    questOffer.brannock-mushroom-run: ["want to do something bigger? clear twenty stumps on the road, then check Pig Beach for me. i heard things."]
    questAccept.brannock-mushroom-run: ["stumps first, then the beach. i'd come but... crates."]
    questComplete.brannock-mushroom-run: ["you went all the way to the beach? okay. okay! i owe you one."]
    about.tobin: ["the kid? he's fine. he's fine. don't ask him about the money."]
    about.hadrik: ["Hadrik was a real sailor. ask him about the cutlass, but not before he's had a drink."]
    aboutUnknown: ["no clue, honestly."]

