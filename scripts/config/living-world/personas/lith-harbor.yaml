      - { from: 22, to: 5, materialize: false }
  recruitable: true
  contract: ingrid-shore-leave
  questLines: [ingrid-hold-the-line, ingrid-the-pier-arm, ingrid-the-crossing, ingrid-the-nine-dragons, ingrid-salt-and-leather]
  benchToleranceDays: 2
