  giftItemIds: [4011002, 2020015]
  dialogue:
    greetFirst: ["papers? no? fine. keep left on the pier.", "you're in the gangway. step aside, then talk."]
    greet: ["you. good. stand there, out of the way.", "pier's in order. mostly. what do you need?"]
    idle: ["(raps her haft on the planks, counting crates under her breath)", "(watches a ship until it's past the point, then straightens up as if she wasn't)"]
    noWork: ["nothing for you today. the pier's in order. i'd like it to stay that way."]
    nothingDue: ["we're square. i keep it that way."]
    who: ["Ingrid. i hold the harbor pier. every gangway, every rope, every boat in and out. in order."]
    bye: ["keep left. mind the ropes."]
    thanks: ["good work. that's in order."]
    smallTalk: ["the morning boat was four minutes late. i'll be having words.", "i know the name of every ship that's tied up here. that's the job. ...it's mostly the job."]
    speakPlainly: ["short version, please. i'm on watch."]
    offer: ["thirty thousand meso. that pays a relief guard for my pier while i'm gone. eight hours, then i'm back on the planks."]
    join: ["relief's on the pier. lead on. i'll hold the line."]
    bench: ["i'll be on the pier. two days, then i assume you sailed without me."]
    leave: ["shift's over. back to the planks. ...that was a good one."]
    refuse.bond: ["i don't leave my pier for strangers. stand a watch with me first."]
    refuse.flags: ["you haven't held the line yet. boars first."]
    refuseOwnErrand: ["that one's yours. i don't count my own crates."]
    questOffer.ingrid-hold-the-line: ["strangers don't stand my pier. i learned the spear on Perion's wild boars. thirty of them, and ten teeth so i know you counted."]
    questAccept.ingrid-hold-the-line: ["the Land of Wild Boar, past Perion. plant your feet. a boar hits like a loose crate."]
    questWaiting.ingrid-hold-the-line: ["ten boar teeth. i count everything. you'll get used to it."]
    questComplete.ingrid-hold-the-line: ["ten. clean. you held the line. stand on my pier any time. left side, out of the gangway."]
    questOffer.ingrid-the-pier-arm: ["this pole arm has stood every watch i've had. it should see more than planks. fifteen ligator skins for a new grip, and it's yours."]
    questAccept.ingrid-the-pier-arm: ["Swamp of Despair, past Kerning. ligator skin doesn't rot in salt. nothing else lasts a month on this pier."]
    questWaiting.ingrid-the-pier-arm: ["fifteen ligator skins. the pier doesn't wait, and neither do i."]
    questComplete.ingrid-the-pier-arm: ["rewrapped. seven safe scrolls, seven for seven. i counted twice. it stood every watch with me. now it goes where i haven't."]
    questOffer.ingrid-the-crossing: ["i've seen a hundred boats off to Florina Beach. never been on one. you go. give Olwen my name for the ledger, then clear forty lorangs."]
    questAccept.ingrid-the-crossing: ["the boat leaves from my pier. i'll be on it. the pier, i mean. watching."]
    questComplete.ingrid-the-crossing: ["don't tell me how it looked. the Crescent. a year's wages, seven sixties, seven for seven. it never left the pier. now it can."]
    questOffer.ingrid-the-nine-dragons: ["the Nine Dragons. i bought it to sign on with the Merrow. Hadrik sent me back to the pier. tell him it's yours. then tortie shells. fifteen."]
    questAccept.ingrid-the-nine-dragons: ["Hadrik's usually up on the deck. so am i, mornings. we don't talk about it. the torties are on the Hot Sand."]
    questWaiting.ingrid-the-nine-dragons: ["fifteen tortie shells. for the pier gate. officially."]
    questComplete.ingrid-the-nine-dragons: ["two tens, five sixties, seven for seven. never told anyone what it cost. it was meant to go to sea with me. you're close enough."]
    questOffer.ingrid-salt-and-leather: ["salt eats a grip in a week. fifteen leather from the pigs on the beach, and the pier's hafts stay honest."]
    questAccept.ingrid-salt-and-leather: ["fifteen. i'll count them twice."]
    questWaiting.ingrid-salt-and-leather: ["fifteen leather. salt doesn't wait."]
    questComplete.ingrid-salt-and-leather: ["fifteen. rewrapped by sundown. same again next week, if you're around. ...for the hafts."]
    friend.close: ["i don't say this often. i'd trust you with the pier. the pier is most of what i have."]
    friend.best: ["if a ship ever wants a guard and a friend on the same crossing, i know who i'm bringing. i'd go. for you, i'd go."]
    famed: ["in front of the whole dock? ...fine. thank you. move along before i smile."]
    defamed: ["fair or not, i'll stand a better watch. we'll see which of us was wrong."]
    gift: ["for me? that's not on any list i keep. ...thank you."]
    gift.favorite: ["how did you know? ...don't answer that. thank you. really."]
    gift.again: ["one a day. orderly pier, orderly pockets."]
    about.hadrik: ["Hadrik. first mate of the Merrow. i asked to sign on once. he sent me back to the pier. some days i'm grateful."]
    about.yara: ["Yara thinks the east road matters more than my pier. wrong. we've had that argument for six years. i'm winning."]
    aboutUnknown: ["never came off a boat on my watch."]

