  recruitable: true
  contract: hadrik-last-voyage
  questLines: [hadrik-old-cutlass, hadrik-ghosts-of-the-road]
  arc: hadrik-last-voyage
  rumors: [lith-dock-confession]
  benchToleranceDays: 3
  paceGap: 4
  relationships:
    - { persona: tobin, kind: RESENTS }
    - { persona: olwen, kind: RESPECTS }
  dialogue:
    greetFirst: ["what.", "you're standing in my light."]
    greet: ["you again.", "still here?"]
    idle: ["(stares at the horizon)", "(turns a coin over and over)"]
    noWork: ["i've got nothing for you."]
    nothingDue: ["you don't owe me. nobody does. that's the problem."]
    who: ["Hadrik. first mate of the Merrow, once. now i sit."]
    bye: ["go on."]
    thanks: ["hm."]
    smallTalk: ["the sea doesn't care. i like that about it."]
    speakPlainly: ["sailors talk plain. try it."]
    refuse.bond: ["i don't sail with strangers."]
    refuse.arc: ["there's something you don't know about me yet. ask around."]
    refuse.flags: ["you haven't heard the whole story."]
    offer: ["one voyage. one. and i want steel worth carrying."]
    join: ["cast off, then."]
    bench: ["i'll be on the deck. don't take long."]
    leave: ["that was the last one. i mean it this time."]
    refuseOwnErrand: ["a first mate doesn't fetch his own rope."]
    questOffer.hadrik-old-cutlass: ["my cutlass rusted through. the red snails on the road have shells hard enough to whet a new edge. ten of them, and five hundred meso for the smith."]
    questWaiting.hadrik-old-cutlass: ["ten red shells. and the meso."]
    questComplete.hadrik-old-cutlass: ["...huh. you didn't have to. that's the first edge i've held in a year."]
    questOffer.hadrik-ghosts-of-the-road: ["stumps. thirty of them, on the roads out of here. i want to know if i can still count kills."]
    questComplete.hadrik-ghosts-of-the-road: ["thirty. the hands still work."]
    about.tobin: ["don't say that name to me."]
    about.olwen: ["Olwen keeps the harbor honest. more than i did."]
    aboutUnknown: ["never sailed with them."]

