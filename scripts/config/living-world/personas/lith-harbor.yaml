# Lith Harbor cast: arrivals and debts. 8 residents, 2 recruitable (Brannock early, Hadrik through his arc).
- id: olwen
  name: Olwen
  title: "Harbormaster's Ledger-Keeper"
  # Her branch (the companion job errands): a Pirate at Kyrin in Nautilus, then a Gunslinger. Counting is aiming.
  # An Olwen already shaped as a Beginner stays one in town until she is next reshaped (a new recipe or loadout); a new
  # one is shaped a Pirate. Only a companion goes on the errands (JobErrands.path).
  job: GUNSLINGER
  level: { min: 12, max: 14 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: lith-harbor
    routine:
      - { from: 6, to: 20, spot: "venue:olaf-crossroads", activity: LINGER }
      - { from: 20, to: 24, spot: "venue:central-benches", activity: REST }
      - { from: 0, to: 6, materialize: false }
  recruitable: false
  questLines: [olwen-snail-tally, olwen-lost-manifest]
  relationships:
    - { persona: hadrik, kind: DISAPPROVES }
    - { persona: pim, kind: FEEDS }
  dialogue:
    greetFirst: ["new face. sign the ledger or keep walking.", "you're not on my list. yet."]
    greet: ["back again.", "the ledger doesn't fill itself.", "make it quick, the tide's turning."]
    idle: ["(scratches at the ledger)", "numbers don't lie. people do."]
    noWork: ["nothing needs counting today.", "come back when the snails have been at the crates again."]
    nothingDue: ["you owe me nothing. yet."]
    who: ["Olwen. i count what comes off the boats and what crawls back into the sea."]
    bye: ["mind the ropes."]
    thanks: ["put it in writing."]
    smallTalk: ["weather's weather.", "i don't do small talk. i do tallies."]
    speakPlainly: ["speak plainly. i have a ledger to keep."]
    questOffer.olwen-snail-tally: ["snails are eating the rope stock at the 3-way road. bring me fifteen fewer snails."]
    questAccept.olwen-snail-tally: ["good. count them. i will."]
    questComplete.olwen-snail-tally: ["fifteen. huh. you can count."]
    questOffer.olwen-lost-manifest: ["a manifest went overboard. the blue snails have the paper by now. five shells, and i'll rewrite it."]
    questWaiting.olwen-lost-manifest: ["five shells. blue ones. not whatever that is."]
    questComplete.olwen-lost-manifest: ["that'll do. the harbormaster owes you, which means i do."]
    about.hadrik: ["drinks his pension on the upper deck. used to be worth something."]
    about.pim: ["the kid steals bread. i leave some out. don't tell anyone."]
    aboutUnknown: ["not in my ledger."]
    jobErrand: ["{tier} job. {instructor}, {town}. it's been in my book for years under 'someday'. back before the tide turns.", "{instructor} in {town} wants me for my {tier} job. i've written it down so i can't pretend i didn't. back soon."]
    jobBack: ["back. {job} now. write that down. no, i will.", "{job}. there's my own name in somebody else's ledger for once. back."]
    jobThanks: ["thank you. i'll keep good count.", "noted. thank you."]

