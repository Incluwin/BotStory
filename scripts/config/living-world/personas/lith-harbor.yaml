- id: sable
  name: Sable
  title: "Cartographer"
  job: BEGINNER
  level: { min: 18, max: 21 }
  strength: SEASONED
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: lith-harbor
    routine:
      - { from: 8, to: 18, spot: "venue:upper-town-overlook", activity: LINGER }
      - { from: 18, to: 24, spot: "venue:central-benches", activity: SOCIALIZE }
      - { from: 0, to: 8, materialize: false }
  recruitable: false
  questLines: [sable-three-roads, sable-hill-survey]
  dialogue:
    greetFirst: ["you walk like someone who gets lost. good. i can use that."]
    greet: ["ah, the walker.", "where did you go today?"]
    idle: ["(sketches the coastline for the fortieth time)"]
    noWork: ["the map is as full as i can make it from here."]
    who: ["Sable. i draw where things are. from a chair, mostly. that's where you come in."]
    bye: ["watch the road forks."]
    thanks: ["thank the map."]
    smallTalk: ["every road out of here forks. it's a metaphor. or bad planning."]
    questOffer.sable-three-roads: ["walk the 3-way road, then the forest west of Henesys, then the hill beyond it. i need to know they still connect."]
    questComplete.sable-three-roads: ["they connect. i'll update the sheet. take this for the shoes."]
    questOffer.sable-hill-survey: ["there's a beach the pigs have taken. hidden path off the 3-way road. go stand on it so i can draw it."]
    questComplete.sable-hill-survey: ["a beach of pigs. i'll write that down exactly like that."]
    aboutUnknown: ["not on any map of mine."]

- id: hadrik
  name: Hadrik
  title: "Retired First Mate"
  job: FIGHTER
  level: { min: 30, max: 33 }
  strength: VETERAN
  loadout: sailor-cutlass
  personality: efficient-v1
  home:
    town: lith-harbor
