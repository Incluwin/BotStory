  relationships:
    - { persona: tobin, kind: PROTECTS }
    - { persona: hadrik, kind: ADMIRES }
  giftItemIds: [2020004, 2020005]
  dialogue:
    greetFirst: ["oh hey. you new? everyone's new here.", "hey! don't mind the smell, that's the fish. or me."]
    greet: ["hey hey.", "you again! good.", "what's the word?"]
    idle: ["(hauls a crate that doesn't need hauling)", "one day i'm getting on one of these boats. the right direction."]
    noWork: ["nothing right now, but stick around."]
    nothingDue: ["nah we're square."]
    who: ["Brannock. deckhand, crate-hauler, future adventurer. mostly the first two."]
    bye: ["catch you at the docks!"]
    thanks: ["anytime!"]
    smallTalk: ["did you see the size of that snail? no? okay."]
    speakPlainly: ["uh. say that simpler?"]
    offer: ["for real? okay, okay. here's the thing, i've got debts.", "you'd take me? alright, but i can't go for free."]
    join: ["let's go! finally!", "grab your stuff, i'm ready!"]
    bench: ["cool, i'll train up while you're gone.", "i'll be here. or at the mushrooms."]
    leave: ["that was fun. see you around the harbor.", "back to crates, i guess."]
    refuse.bond: ["i barely know you. help me with the crates first."]
    refuse.flags: ["finish the crate thing first, then we talk."]
    refuseOwnErrand: ["that's your errand! i'd feel weird farming my own favor."]
    restock.go: ["oh! potions. be right back, don't leave!", "gotta grab potions real quick, hold on!"]
    restock.back: ["back! got a whole bag of potions.", "okay okay, stocked up. let's go!"]
    restock.broke: ["uh, i'm kinda broke and out of {need}... got any to spare? or some mesos?", "{need} cost money and i have, um, none. could you spare some? mesos work too!"]
    restock.noShop: ["uh oh, no shop out here and i'm low on potions.", "should've bought potions back in town. oops."]
    restock.stillShort: ["oh! that helps. still not enough for {need} though...", "almost! still a little short for {need}."]
    questOffer.brannock-crates: ["the shrooms at the 3-way road keep breaking into the crates. ten caps and i can prove it to Olwen."]
    questAccept.brannock-crates: ["you're the best. orange caps, ten of them!"]
    questWaiting.brannock-crates: ["ten orange caps. i'll wait."]
    questComplete.brannock-crates: ["ten! Olwen has to believe me now."]
    questOffer.brannock-mushroom-run: ["want to do something bigger? clear twenty stumps on the road, then check Pig Beach for me. i heard things."]
    questAccept.brannock-mushroom-run: ["stumps first, then the beach. i'd come but... crates."]
    questComplete.brannock-mushroom-run: ["you went all the way to the beach? okay. okay! i owe you one."]
    about.tobin: ["the kid? he's fine. he's fine. don't ask him about the money."]
    about.hadrik: ["Hadrik was a real sailor. ask him about the cutlass, but not before he's had a drink."]
    aboutUnknown: ["no clue, honestly."]
    questOffer.brannock-a-proper-grip: ["look at your hands. rope burns everywhere. the glover on the pier owes me one, but she needs leather. twenty pieces. the pigs on the beach have plenty."]
    questAccept.brannock-a-proper-grip: ["great! i'll tell her you're coming!"]
    questWaiting.brannock-a-proper-grip: ["leather. twenty. the pigs won't mind. probably."]
    questComplete.brannock-a-proper-grip: ["she stitched them overnight and i did the scrolls myself! well. i asked how first. they're yours!"]
    questOffer.brannock-the-big-snail: ["you know what i've never seen? Mano. the big snail. everyone laughs about it. it's not funny when it's that big. come with me? i want to see it go down. and i... have something for you. for after."]
    questAccept.brannock-the-big-snail: ["yes! okay! i'm ready! i'm mostly ready!"]
    questComplete.brannock-the-big-snail: ["we did it. WE did it! here. my war hammer. i saved a whole season for seven sixties, and every single one took. i was keeping it for the boat. you have it."]
    friend.close: ["you know you're my best mate on this whole dock, right? don't tell Tobin."]
    friend.best: ["when i finally get on a boat, you're coming. that's not a question."]
    famed: ["for me?! nobody ever... thanks!"]
    defamed: ["...oh. okay. sorry, i guess."]
    gift: ["for me? thanks! i'll keep it with my good stuff."]
    gift.favorite: ["FOOD. real food! you're the best. the BEST."]
    gift.again: ["you already gave me something today! save it!"]
    questOffer.brannock-the-old-mace: ["i've hauled with this iron mace since the day i got off the boat. i bought a new one, so this one's yours. help me finish the shift first? thirty orange mushrooms keep knocking crates off the road."]
    questAccept.brannock-the-old-mace: ["thanks! i'll be on the pier!"]
    questComplete.brannock-the-old-mace: ["here. i put seven of the safe scrolls in it, back when i had no money. all seven took. it's done more work than me."]
    questOffer.brannock-one-more-story: ["i'm getting on a boat. for real this time. but i want one more story first. Stumpy, the big stump past Perion. you and me. and after... there's something i want you to have."]
    questAccept.brannock-one-more-story: ["okay. okay! i'm scared. that's fine. let's go."]
    questComplete.brannock-one-more-story: ["this is Jacker. it's the best thing i've ever owned. two tens and five sixties, and every one took. i spent everything i had on it. i'm not taking it on the boat. it stays with my best friend."]

