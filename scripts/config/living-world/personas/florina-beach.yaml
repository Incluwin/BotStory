    speakPlainly: ["plainly: shade, for rent."]
    questOffer.lulu-the-banana-stand: ["the lupins round the look-out shed keep stealing bananas off my shake stand. twenty lupins, and bring back fifteen bananas. they're my bananas."]
    questAccept.lulu-the-banana-stand: ["the look-out shed, and Lorang Lorang. the trees. they'll throw the bananas at you. catch them!"]
    questWaiting.lulu-the-banana-stand: ["fifteen bananas. the blender's ready."]
    questComplete.lulu-the-banana-stand: ["fifteen! shakes are back on! here, and a free shade, any time you like."]
    questOffer.lulu-shells-for-shade: ["i want tortie shell tops for the front row of sunshades. the torties out on the far coves. twenty-five of them, ten shells."]
    questAccept.lulu-shells-for-shade: ["Clang and Lorang, and the Hot Sand. they're slow. they're grumpy. so's the sand."]
    questWaiting.lulu-shells-for-shade: ["ten shells. the front row's waiting."]
    questComplete.lulu-shells-for-shade: ["ten! the front row's going to be the shadiest shade on the beach. here. you've got the best spot. for life."]
    about.teodor: ["Teodor counts my customers when they go in. he counts them when they come out. he counts them when they're asleep under my shades. he's very thorough."]
    about.marisol: ["Marisol's got her own shade. the green one. i don't charge her. she brings me pretty glass."]
    about.tansy: ["Tansy builds her castle right by the shades. i move one every morning so the sun's on her moat. it dries better."]
    aboutUnknown: ["never rented them a shade."]
    friend.close: ["you get the shade by the water. nobody gets the shade by the water."]
    friend.best: ["i painted your name on a sunshade. the yellow one. it's always yours."]
    famed: ["everyone's saying your name under my shades!"]
    defamed: ["ignore them. they've had too much sun."]
    gift: ["aw! for me? thanks!"]
