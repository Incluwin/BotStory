  giftItemIds: [2001001, 2020005]
  dialogue:
    greetFirst: ["shade! you look like you need shade. everyone needs shade. ten meso an hour, first hour free for new faces!", "hi! welcome to Florina! the sun's free. the shade's ten meso."]
    greet: ["hi hi!", "shade today?", "you're back! your sunshade missed you."]
