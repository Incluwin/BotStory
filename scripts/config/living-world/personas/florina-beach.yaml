# Florina Beach cast (Regional Residents wave 4, docs/REGIONAL_RESIDENTS_PLAN.md section 10): 7 Residents, 2 recruitable.
# The beach at the end of the Lith Harbor ferry, its look-out shed and the lorang coves past it. Its beachcomber finds a
# sealed bottle forty years at sea, addressed to the chapel steps in Amoria (arcs/florina-beach.yaml, with
# arcs/amoria.yaml). Two recruits give armour and accessories in the beach's band (37-48): earrings and capes.
- id: marisol
  name: Marisol
  look: { gender: female }
  title: "Beachcomber of the Tide Line"
  job: BEGINNER
  level: { min: 24, max: 26 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: florina-beach
    routine:
      - { from: 6, to: 12, spot: "venue:lower-east-street", activity: STROLL }
      - { from: 12, to: 16, spot: "venue:middle-central-street", activity: LINGER }
      - { from: 16, to: 20, spot: "venue:lower-east-street-2", activity: SOCIALIZE }
      - { from: 20, to: 6, materialize: false }
  recruitable: false
  knows: [lorang, lorang claw, hot sand]
  questLines: [marisol-the-sealed-bottle, marisol-to-the-chapel-steps, marisol-what-the-clangs-dig-up]
  arc: marisol-the-sealed-bottle
  rumors: [florina-the-tide-line]
  relationships:
    - { persona: abel, kind: LEARNED_THE_TIDES_FROM }
    - { persona: tansy, kind: FINDS_SHELLS_FOR }
    - { persona: teodor, kind: IS_COUNTED_BY }
  giftItemIds: [2001001, 2000002]
  dialogue:
    greetFirst: ["oh! hello. mind the jar, it's full of sea glass. the tide brought you in, did it?", "you're new. the beach is new every morning too. that's why i like it."]
    greet: ["hello again.", "you're back! i found a button today. a whole button.", "hi. the tide's out. best time."]
    idle: ["(crouches at the tide line, turns over a shell, and puts it back exactly where it was)", "(holds a piece of green sea glass up to the sun and squints through it)"]
    noWork: ["nothing today. the tide's bringing what it brings. i just pick it up."]
    nothingDue: ["nothing owed. the sea never sends a bill."]
    who: ["Marisol. i comb the beach. glass, rope, buttons, bottles. mostly bottles. the best ones come in at the lorangs' shallows, past the look-out shed. the lorangs don't like sharing."]
    bye: ["mind the tide."]
    thanks: ["oh, thank you."]
    smallTalk: ["the sea gives everything back eventually. Abel says it takes its time. he says it like he's waited.", "i've a shelf of bottles in the look-out shed. none of them had anything in. one day one will."]
    speakPlainly: ["plainly: i pick things up off the sand."]
    questOffer.marisol-the-sealed-bottle: ["something's caught in the lorangs' shallows. green glass, and the cork's still in. i can see it from the rocks. keep the lorangs off me, thirty of them, and i'll wade out and get it."]
    questAccept.marisol-the-sealed-bottle: ["Lorang Lorang, past the look-out shed, and the little cove off it. they pinch. pinch back."]
    questWaiting.marisol-the-sealed-bottle: ["thirty. i've got my boots off already."]
    questComplete.marisol-the-sealed-bottle: ["got it! it's sealed. wax on the cork, a silver gull pressed in the wax, and a letter inside. i can read the outside through the glass. 'Pernille. the chapel steps. Amoria.' ...it's been at sea a long time. here, for your trouble. i need to sit down."]
    questOffer.marisol-to-the-chapel-steps: ["the letter in the bottle. 'Pernille, the chapel steps, Amoria.' it's somebody's. i've never left the beach. would you carry it up to Amoria and find her? then come back and tell me she got it."]
    questAccept.marisol-to-the-chapel-steps: ["Pison's boat to Lith Harbor, up the road to Henesys, and Thomas Swift takes you to Amoria. ask at the chapel. careful with it. it's waited long enough."]
    questWaiting.marisol-to-the-chapel-steps: ["did she get it? was she there?"]
    questComplete.marisol-to-the-chapel-steps: ["you read it to her? on the steps? ...forty years, and somebody was still there to hear it. i always hoped one of my bottles had somebody at the other end. here. thank you. thank you."]
    questOffer.marisol-what-the-clangs-dig-up: ["the clangs on the Hot Sand dig all night. they turn up all sorts. keep thirty of them busy and i'll comb along behind them."]
    questAccept.marisol-what-the-clangs-dig-up: ["the Hot Sand, at the far end of the road. it's hot. the clangs don't mind. you will."]
    questWaiting.marisol-what-the-clangs-dig-up: ["thirty. i've got my bucket."]
    questComplete.marisol-what-the-clangs-dig-up: ["a spoon, two buttons and a ship's nail. a good day. here, you've earned a share. not the nail. i'm keeping the nail."]
    about.abel: ["Abel taught me the tides. he's fished off the look-out shed since before the shed. he says they built it round him."]
    about.tansy: ["Tansy builds a castle every morning and the sea takes it every night. she says that's fine, it means she gets to build another. i bring her shells for the towers."]
    about.teodor: ["Teodor counts me every time i go in the water. even ankle-deep. i've stopped arguing. he writes me down."]
    about.lulu: ["Lulu keeps the green sunshade free for me, for when i've found something good and need to sit down. she won't take a meso for it. she takes sea glass."]
    aboutUnknown: ["never washed up here."]
    friend.close: ["anything good i find, you see it first. well. after me. but then you."]
    friend.best: ["i've put a bottle on the shed shelf with your name on it. it's empty. it's for you to fill. that's how it works."]
    famed: ["people say your name on the beach like a good find."]
    defamed: ["whatever they're saying, the tide'll wash it off. it always does."]
    gift: ["oh! a find! thank you."]
    gift.favorite: ["oh, that's a proper treasure. better than glass."]
    gift.again: ["one a day. the tide only comes in twice, and i'm greedy about both."]

- id: teodor
  name: Teodor
  look: { gender: male }
  title: "Lifeguard Who Counts Them In"
  job: BEGINNER
  level: { min: 30, max: 32 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: florina-beach
    routine:
      - { from: 7, to: 13, spot: "venue:lower-central-street", activity: LINGER }
      - { from: 13, to: 19, spot: "venue:by-pison", activity: LINGER }
      - { from: 19, to: 21, spot: "venue:middle-west-street", activity: REST }
      - { from: 21, to: 7, materialize: false }
  recruitable: false
  knows: [lupin, lupin's banana, lorang]
  questLines: [teodor-the-banana-throwers, teodor-pinched-toes]
  relationships:
    - { persona: marisol, kind: COUNTS }
    - { persona: lulu, kind: WATCHES_THE_CUSTOMERS_OF }
    - { persona: tansy, kind: GUARDS }
  giftItemIds: [2020005, 2000002]
  dialogue:
    greetFirst: ["hello! are you going in? i'll need your name. i count everyone in and everyone out.", "new face. welcome to Florina. if you swim, tell me first. if you don't, tell me anyway. i like to know."]
    greet: ["hello! you're on the list.", "you again. dry today? good.", "hi. thirty-two in, thirty-two out. a good day."]
    idle: ["(counts heads in the water under his breath, frowns, counts again, and relaxes)", "(blows one short note on a whistle at nobody in particular, just to check it still works)"]
    noWork: ["nothing today. everyone's out of the water. that's my favourite number."]
    nothingDue: ["we're square. in and out."]
    who: ["Teodor. lifeguard. i count every swimmer in and every swimmer out. the numbers have matched for nine summers. i'd like to make it ten."]
    bye: ["don't swim out past the buoys!"]
    thanks: ["thank you! noted."]
    smallTalk: ["the lupins in the trees by the look-out shed throw bananas at swimmers. a banana in the ear can put a man under. it nearly did once. i counted him back in. barely.", "the lorangs pinch toes in the shallows. i keep a book of toes. don't ask to see it."]
    speakPlainly: ["plainly: in, out, count."]
    questOffer.teodor-the-banana-throwers: ["the lupins in the trees round the look-out shed are throwing bananas at swimmers again. thirty of them, and the water's safe for the afternoon."]
    questAccept.teodor-the-banana-throwers: ["the look-out shed and Lorang Lorang. the trees. look up. they're above you."]
    questWaiting.teodor-the-banana-throwers: ["thirty. i've had two bananas in the water this morning."]
    questComplete.teodor-the-banana-throwers: ["thirty! not one banana since. in and out, all of them. here. you're on my list. the good list."]
    questOffer.teodor-pinched-toes: ["the lorangs out where the clangs start have been pinching toes. thirty of them, and twelve claws so i can show the swimmers what to watch for."]
    questAccept.teodor-pinched-toes: ["Lorang and Clang, and Clang and Lorang. the red ones. keep your boots on."]
    questWaiting.teodor-pinched-toes: ["thirty, and twelve claws. the toe book's getting thick."]
    questComplete.teodor-pinched-toes: ["twelve claws. i'll nail them to the lifeguard post. 'this is what pinches.' they'll learn. here."]
    about.marisol: ["Marisol goes in ankle-deep forty times a day. i count every one. she says it isn't swimming. it's in the water. it counts."]
    about.lulu: ["Lulu rents the shade. her customers fall asleep under it and burn. i count them too. a different list."]
    about.tansy: ["Tansy's never once gone in past her knees. she's my favourite swimmer. she doesn't swim."]
    about.ronan: ["Ronan swims out to the buoys every morning and back. he's the only one i don't worry about. i count him anyway."]
    aboutUnknown: ["not on my list."]
    friend.close: ["you're on my list for good. even when you're not swimming. that's a first."]
    friend.best: ["if you ever go in the sea anywhere, i'll count you back in. from here. i'll know."]
    famed: ["your name's on everyone's list! the good list!"]
    defamed: ["hm. i'll count that as one complaint. one isn't many."]
    gift: ["oh! thank you!"]
    gift.favorite: ["oh, that's a lifeguard's whole lunch break, that is. thank you!"]
    gift.again: ["one a day. i've got to keep my eyes on the water."]

- id: nerys
  name: Nerys
  look: { gender: female }
  title: "Keeper of the Hot Sand"
  job: BANDIT
  level: { min: 42, max: 44 }
  strength: SEASONED
  loadout: kerning-bandit-l30
  personality: efficient-v1
  home:
    town: florina-beach
    routine:
      - { from: 8, to: 13, materialize: false }
      - { from: 13, to: 18, spot: "venue:lower-east-street", activity: LINGER }
      - { from: 18, to: 23, spot: "venue:upper-east-street", activity: SOCIALIZE }
      - { from: 23, to: 8, materialize: false }
  recruitable: true
  knows: [clang, clang claw, tortie]
  contract: nerys-the-claw-share
  questLines: [nerys-the-hot-sand, nerys-blue-moon, nerys-pansy-earrings, nerys-black-emerald, nerys-clang-claws]
  rumors: [florina-the-hot-sand]
  benchToleranceDays: 3
  paceGap: 2
  relationships:
    - { persona: ronan, kind: ARGUES_WITH }
    - { persona: tansy, kind: CLEARS_THE_SAND_FOR }
  giftItemIds: [2001001, 2000004]
  dialogue:
    greetFirst: ["watch your feet. the sand's hot and the clangs are hotter. who are you?", "new. hm. you've got the look of somebody who'll walk onto the Hot Sand barefoot. don't."]
    greet: ["you.", "back. good. there's sand in my boots. there's always sand in my boots.", "hm. hello."]
    idle: ["(empties a boot of sand, looks at the little pile, and empties it again)", "(flips a dagger end over end and catches it by the handle without looking)"]
    noWork: ["nothing today. the Hot Sand's quiet. i don't trust it."]
    nothingDue: ["we're even. i keep it that way."]
    who: ["Nerys. i keep the clangs off the Hot Sand so the kids can cross to the far water. i used to lift purses in Kerning. now i lift clangs. it pays worse. i sleep better."]
    bye: ["boots on."]
    thanks: ["hm. thanks."]
    smallTalk: ["a clang's claw goes for good money with the jeweller over in Lith. i trade claws for earrings. it's a fair trade. i checked twice. old habits.", "Ronan used to scrub the ferry deck till you could see your face in it. now he's got nothing to scrub. it makes him restless. it makes me tired."]
    speakPlainly: ["plainly: a dagger and a lot of hot sand."]
    offer: ["sixty clangs off the Hot Sand, counted, and twenty thousand. they're my clangs anyway. then i'll walk with you."]
    join: ["fine. boots on. let's go."]
    bench: ["three days. then i'm back on the sand."]
    leave: ["back to the sand. it's missed me. nobody else does."]
    refuse.bond: ["i don't walk with strangers. i was one. i know what they do."]
    refuse.flags: ["clear the clangs off the Hot Sand with me once first. then ask."]
    refuseOwnErrand: ["the sand first. come and clear it with me."]
    questOffer.nerys-the-hot-sand: ["the clangs have dug up the Hot Sand again and the kids can't cross. forty of them, and the path's clear for a week."]
    questAccept.nerys-the-hot-sand: ["the Hot Sand, at the end of the road, past the torties. it burns. so do they."]
    questWaiting.nerys-the-hot-sand: ["forty. the kids are waiting on the dunes."]
    questComplete.nerys-the-hot-sand: ["forty. look at them run. you can walk the sand with me any time."]
    questOffer.nerys-blue-moon: ["Blue Moon earrings, for you. the jeweller in Lith takes lupin dolls for them. don't ask me why. thirty lupins round the look-out shed, ten dolls."]
    questAccept.nerys-blue-moon: ["the look-out shed and Lorang Lorang. the lupins sit in the trees. they throw things."]
    questWaiting.nerys-blue-moon: ["ten dolls. the jeweller's patient. i'm not."]
    questComplete.nerys-blue-moon: ["ten. Blue Moon. every safe scroll took. they suit you. they'd suit me. i didn't keep them. that's growth."]
    questOffer.nerys-pansy-earrings: ["Pansy earrings. the jeweller wants tortie shell for the setting. thirty torties on the far coves, twelve shells."]
    questAccept.nerys-pansy-earrings: ["Clang and Lorang, and the Hot Sand. the torties are slow. they hit hard."]
    questWaiting.nerys-pansy-earrings: ["twelve shells."]
    questComplete.nerys-pansy-earrings: ["twelve. Pansy earrings. sixties, every one took. don't look so surprised. i don't cheat. any more."]
    questOffer.nerys-black-emerald: ["Black Emerald earrings. the best the jeweller's got. he wants clang claws. fifty clangs, fifteen claws. it's a lot of hot sand."]
    questAccept.nerys-black-emerald: ["the clang coves and the Hot Sand. all of it. drink something first."]
    questWaiting.nerys-black-emerald: ["fifteen claws. sand in your boots yet?"]
    questComplete.nerys-black-emerald: ["fifteen. Black Emerald. two tens and the rest sixties, every one took. the best thing i ever traded for, and i'm giving it away. don't tell Kerning."]
    questOffer.nerys-clang-claws: ["ten clang claws? the jeweller always wants more."]
    questAccept.nerys-clang-claws: ["the Hot Sand."]
    questWaiting.nerys-clang-claws: ["ten."]
    questComplete.nerys-clang-claws: ["ten. traded. here's your cut."]
    about.ronan: ["Ronan worked the Florina ferry till they sold her. he's still got a deckhand's arms and nothing to lift. he says i'm lazy. i'm never lazy."]
    about.tansy: ["Tansy crosses the Hot Sand for the wet sand her castle wants. that's why i clear it. don't tell her."]
    about.marisol: ["Marisol combs behind the clangs when they dig. she finds more on the Hot Sand than i ever lifted in Kerning. honestly, too."]
    aboutUnknown: ["never crossed the sand with them."]
    friend.close: ["you get the first claw off any clang. i've never said that to anyone."]
    friend.best: ["i'd walk the Hot Sand barefoot for you. i won't. but i would."]
    famed: ["hm. your name gets around. good."]
    defamed: ["i've been called worse, by better. ignore it."]
    gift: ["hm. thanks."]
    gift.favorite: ["oh. that's a good one. i'll have it on the sand."]
    gift.again: ["one a day. my hands are full of claws."]

- id: ronan
  name: Ronan
  look: { gender: male }
  title: "Deckhand of the Old Ferry"
  job: BRAWLER
  level: { min: 44, max: 46 }
  strength: VETERAN
  loadout: nautilus-pirate-l30
  personality: relaxed-v1
  home:
    town: florina-beach
    routine:
      - { from: 9, to: 14, spot: "venue:by-pison", activity: LINGER }
      - { from: 14, to: 18, spot: "venue:middle-west-street", activity: STROLL }
      - { from: 18, to: 23, spot: "venue:upper-east-street", activity: SOCIALIZE }
      - { from: 23, to: 9, materialize: false }
  recruitable: true
  knows: [lorang, lupin, tortie]
  contract: ronan-the-deck-share
  questLines: [ronan-the-old-landing, ronan-cape-of-warmness, ronan-icarus-cape, ronan-blue-napoleon, ronan-lorang-claws]
  rumors: [florina-the-hot-sand]
  benchToleranceDays: 4
  paceGap: 2
  relationships:
    - { persona: nerys, kind: TEASES }
    - { persona: abel, kind: WAVES_TO }
  giftItemIds: [2020004, 2000005]
  dialogue:
    greetFirst: ["ahoy! well, not ahoy. there's no ship. hello! welcome to Florina!", "a new face! you didn't come over on my ferry. i'd remember. i don't have a ferry. long story."]
    greet: ["hey!", "there you are!", "ahoy. habit."]
    idle: ["(coils a rope that isn't tied to anything, very neatly, and hangs it on his shoulder)", "(hums a sea shanty, reaches the chorus, and booms it out at the gulls)"]
    noWork: ["nothing today. no ferry, no deck, no work. i'm just a big man on a beach."]
    nothingDue: ["we're square, friend. ship-shape."]
    who: ["Ronan. i was deckhand on the Florina ferry. the big one, before Pison's little boat. they sold her. i stayed. the beach doesn't rock. i'm getting used to it."]
    bye: ["fair winds!"]
    thanks: ["ha! thank you!"]
    smallTalk: ["the old ferry landing's by the look-out shed. the lorangs nest under it now. i used to tie up there. now they sit there. snipping.", "Nerys says i can't sit still. i can. i just don't like it. a deckhand only sits when the ship's going down."]
    speakPlainly: ["plainly: a deckhand with no deck."]
    offer: ["forty thousand for the day. that's what the ferry paid a deckhand. i'll work it like a day on deck, sunup to sundown."]
    join: ["cast off! ha! i've missed saying that."]
    bench: ["four days. then i'll go and find a boat that wants me."]
    leave: ["back to the beach, friend. it's been good to be on deck."]
    refuse.bond: ["i don't crew with strangers. you learn a man on deck. we haven't had a deck."]
    refuse.flags: ["help me clear the old ferry landing first. the lorangs by the look-out shed. then ask."]
    refuseOwnErrand: ["that's my landing. we clear it together."]
    questOffer.ronan-the-old-landing: ["the old ferry landing, by the look-out shed. the lorangs have it. thirty of them, and i can sit on my own landing again."]
    questAccept.ronan-the-old-landing: ["the look-out shed, and Lorang Lorang past it. red. snippy. no manners."]
    questWaiting.ronan-the-old-landing: ["thirty. my landing!"]
    questComplete.ronan-the-old-landing: ["thirty! look at it. empty. i'm going to sit on it and look at the sea. you can sit too."]
    questOffer.ronan-cape-of-warmness: ["the old sailmaker in Lith stitches capes out of the ferry's sailcloth. he's soft on lupin's bananas. thirty lupins round the shed, twelve bananas, and he'll make you a Cape of Warmness."]
    questAccept.ronan-cape-of-warmness: ["the look-out shed and Lorang Lorang. the lupins. up in the trees."]
    questWaiting.ronan-cape-of-warmness: ["twelve bananas. the sailmaker's hungry."]
    questComplete.ronan-cape-of-warmness: ["twelve. a Cape of Warmness, out of the old ferry's mainsail. every safe scroll took. that's a cape that's been to sea."]
    questOffer.ronan-icarus-cape: ["the Icarus Cape. the sailmaker wants lorang claws to pin the hem. forty lorangs on the clang coves, fifteen claws."]
    questAccept.ronan-icarus-cape: ["Lorang and Clang, and Clang and Lorang. the clangs are there too. mind them."]
    questWaiting.ronan-icarus-cape: ["fifteen claws."]
    questComplete.ronan-icarus-cape: ["fifteen. the Icarus Cape. sixties, every one took. it flies a bit. don't jump off anything."]
    questOffer.ronan-blue-napoleon: ["the Blue Napoleon. ferry blue. the sailmaker cut it from the last of the old flag. he wants the far coves cleared so he can walk out and see the sea once more. thirty torties and thirty clangs."]
    questAccept.ronan-blue-napoleon: ["Clang and Lorang, and the Hot Sand. all the way out. bring water."]
    questWaiting.ronan-blue-napoleon: ["thirty and thirty. the sailmaker's packed a lunch."]
    questComplete.ronan-blue-napoleon: ["thirty and thirty. the Blue Napoleon. two tens and the rest sixties, every one took. the last of the ferry's flag. wear it like she's still sailing."]
    questOffer.ronan-lorang-claws: ["ten lorang claws? the sailmaker's out of hem pins."]
    questAccept.ronan-lorang-claws: ["Lorang Lorang."]
    questWaiting.ronan-lorang-claws: ["ten."]
    questComplete.ronan-lorang-claws: ["ten! the sailmaker thanks you. so do i."]
    about.nerys: ["Nerys keeps the clangs off the Hot Sand. she says she used to be a thief. she gives everything away. worst thief i ever met."]
    about.abel: ["Abel fished off the shed when the ferry still ran. he waved every morning. i waved back. we've never said a word to each other. it's the best friendship i've got."]
    about.teodor: ["Teodor counts me out to the buoys and back every morning. i've told him i'm a deckhand. he says deckhands drown too. he's not wrong."]
    aboutUnknown: ["never crewed with them."]
    friend.close: ["you're crew. that's the best thing a deckhand can say. you're crew."]
    friend.best: ["if i ever get another deck, there's a berth on it for you. the first one."]
    famed: ["ha! the whole beach is saying your name! i'm saying it loudest!"]
    defamed: ["who said that? i'll have a word. a deckhand's word. it's loud."]
    gift: ["ha! for me? thanks!"]
    gift.favorite: ["ha! that's a deckhand's breakfast! thank you!"]
    gift.again: ["one a day, friend. the beach is watching my belt."]

- id: lulu
  name: Lulu
  look: { gender: female }
  title: "Sunshade Renter of Florina"
  job: BEGINNER
  level: { min: 20, max: 22 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: florina-beach
    routine:
      - { from: 8, to: 13, spot: "venue:lower-central-street", activity: LINGER }
      - { from: 13, to: 18, spot: "venue:middle-central-street", activity: LINGER }
      - { from: 18, to: 21, spot: "venue:by-valen", activity: SOCIALIZE }
      - { from: 21, to: 8, materialize: false }
  recruitable: false
  knows: [lupin's banana, tortie shell, tortie]
  questLines: [lulu-the-banana-stand, lulu-shells-for-shade]
