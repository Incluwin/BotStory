  recruitable: true
  knows: [nightmare, dead scarecrow, twisted jester]
  contract: lucius-the-trap-springs
  questLines: [lucius-the-sweep, lucius-the-scarecrow-chimney, lucius-the-clown-chimney, lucius-the-mirror]
  benchToleranceDays: 2
  paceGap: 3
  relationships:
    - { persona: marigold, kind: WORKS_WITH }
    - { persona: dex, kind: PUTS_UP_WITH }
