    greetFirst: ["bless you. no, you didn't sneeze. i bless everyone who walks up to the house. it's cheaper than the alternative.", "oh, hello! would you like a biscuit? they're blessed. they're also chocolate. the blessing doesn't affect the chocolate."]
    greet: ["hello, dear! blessed and well?", "back again! have a biscuit."]
    idle: ["(sprinkles a few drops from a small flask along the house's front step, humming a hymn slightly off-key)", "(breaks a biscuit in half and leaves one half on the step, as if for someone)"]
    noWork: ["nothing today. the halls are blessed. for now. blessings wear off. like biscuits."]
    nothingDue: ["you owe me nothing, dear. blessings are free. biscuits are a donation."]
    who: ["Marigold. i'm a cleric of the Ellinia temple, sent out to bless the Prendergast house. that was six years ago. it keeps needing blessing. Lucius breaks the things in it. i bless what's left. we're a very good team. he's very loud."]
    bye: ["bless you. go carefully."]
    thanks: ["oh, bless you, dear."]
    smallTalk: ["the voodoos in the library were dolls that someone wished on. wishes go strange in a house like this. i bless them back to dolls. they look relieved.", "i leave half a biscuit on the step every morning. for Sophilia. Cornelius doesn't know. or he does, and he's never said. that's the same thing, in this house."]
    speakPlainly: ["plainly: holy water, biscuits, and a house that keeps needing both."]
    offer: ["twenty-five thousand for the temple. i'll come wherever you need blessing. which is everywhere, dear."]
    join: ["oh, lovely! i'll keep you on your feet. you keep the nasty things off me."]
    bench: ["three days. then the house needs blessing again."]
    leave: ["that's me, dear. the house is calling. it's always calling."]
    refuse.bond: ["i'd love to, dear, but i don't know you yet. let's have a biscuit first. several."]
    refuse.flags: ["have you heard my fee? i tell Lucius every evening by the witch's spot. listen in. it's not a secret. it's barely a fee."]
    refuseOwnErrand: ["my blessing, dear. you can hold the flask."]
    questOffer.marigold-blessing-the-halls: ["the scarecrows in the hallway where am I and the piano rooms are scaring the dolls, which scares the house, which scares Cornelius. thirty of them, dear? then i can bless the halls in peace."]
    questAccept.marigold-blessing-the-halls: ["the house. the hallway where am I, and the piano rooms off it and off this again. the dead scarecrows. they're straw. they burn. not that i'd suggest it."]
    questWaiting.marigold-blessing-the-halls: ["thirty, dear. take a biscuit for strength."]
    questComplete.marigold-blessing-the-halls: ["thirty! lovely. now i can bless in peace. bless you. have two biscuits."]
    questOffer.marigold-a-taru-staff: ["the voodoos in the library and the bedroom off where are you. twenty of them, dear? a Taru pilgrim left me a staff and a spirit feather when she passed through. i've no use for a Taru staff. you might."]
    questAccept.marigold-a-taru-staff: ["the house. the library, and Sophilia's bedroom off the hallway where are you. the voodoos. they're wishes gone wrong. be kind. firmly."]
    questWaiting.marigold-a-taru-staff: ["twenty, dear."]
    questComplete.marigold-a-taru-staff: ["twenty! blessed. here: an Umaru, a Taru spirit feather and some jungle lilies. Corine in New Leaf City wakes the spirit in the staff, if you bring her the rest. tell her Marigold sent you. she'll give you a biscuit. she won't. but tell her."]
    questOffer.marigold-the-witchs-gloves: ["the hoodoos in Sophilia's bedroom and the vanity room. twenty of them, dear. i'll give you two things a merchant left as a donation. Barricade draws mage's gloves from them, i'm told. glittery ones."]
    questAccept.marigold-the-witchs-gloves: ["the house. Sophilia's bedroom and the vanity room off the hallway where are you. the hoodoos. they're the voodoos' cross cousins."]
    questWaiting.marigold-the-witchs-gloves: ["twenty, dear. nearly there."]
    questComplete.marigold-the-witchs-gloves: ["twenty! bless you. here: a LeFay jewel and some pharaoh's wrappings. Barricade in Bigger Ben draws the manual, Spindle in Omega Sector makes the gloves. glittery. very becoming."]
    questOffer.marigold-the-mirror-ghost: ["the mirror ghost, dear. there's one in every vanity room and one in the piano room. one of them, just one, broken and blessed. i've never been brave enough to bless one up close. i've a cloak for whoever does."]
    questAccept.marigold-the-mirror-ghost: ["the vanity room off the first hallway, or the piano room, or the vanity room off where am I. the mirror ghost. don't look into it, dear. look past it. Lucius says so. he's right, for once."]
    questWaiting.marigold-the-mirror-ghost: ["just one, dear. look past it."]
    questComplete.marigold-the-mirror-ghost: ["you broke it! oh, i'll bless it now. there. here, dear. a cloak of corruption. that's a terrible name for a cloak. Adonis in El Nath can make something better of it, i'm told. something about Zakum. i don't ask. i bless."]
    about.lucius: ["Lucius breaks the things in the house. he's very loud about it. i bless what's left. i've been trying to get him to eat a biscuit for six years. he says they're suspicious. they're chocolate."]
    about.mordecai: ["Mordecai keeps the graves. i bless them on Sundays. he digs on Mondays. we've never once been on the ground at the same time. it works."]
    about.winnie: ["Winnie made me a robe with deep pockets. for the holy water and the biscuits. mostly the biscuits."]
    about.cornelius: ["Cornelius wants a party for his sister. i'm going to bless the cake. i'm going to bless it so hard."]
    aboutUnknown: ["i've never blessed them. i'd be happy to."]
    friend.close: ["i've a biscuit set aside for you every day. the good ones. with the extra chocolate."]
    friend.best: ["if i ever go back to the temple, i'll tell them about you. i'll tell them you're blessed. you are."]
    famed: ["everyone's saying lovely things about you, dear. bless them."]
    defamed: ["people are saying hard things, dear. bless them too. they need it more."]
    gift: ["oh, bless you!"]
    gift.favorite: ["oh, that's lovely, dear! that's going in my good pocket."]
    gift.again: ["one a day, dear! bless you anyway."]
