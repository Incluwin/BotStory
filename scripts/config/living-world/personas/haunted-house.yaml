  giftItemIds: [4000399, 2000004]
  dialogue:
    greetFirst: ["don't move. ...there. a nightmare was on your shoulder. it's gone. you're welcome.", "a visitor. you've got the look of somebody who's going into the house. don't. if you do, go in fast and come out faster."]
    greet: ["hey. still breathing? good.", "you again. the house hasn't eaten you. it's trying."]
    idle: ["(checks a dozen coat pockets in turn, counting charms, salt, string and a pair of daggers)", "(stares up at a dark window of the mansion until something behind it seems to look away)"]
    noWork: ["nothing today. the house is resting. that's when it's most dangerous. i'm resting too. that's when i'm most dangerous."]
    nothingDue: ["square."]
    who: ["Lucius. ghost-breaker. the house fills up with things that shouldn't be, and i go in and break them. nightmares, scarecrows, jesters, things in mirrors. Marigold blesses the halls afterwards. i do the before. somebody has to do the before."]
    bye: ["don't walk backwards out of the house. it notices."]
    thanks: ["hm. cheers."]
    smallTalk: ["the nightmares in the third hallway feed on people being scared. stop being scared and they starve. easier said. i've been not-scared for ten years. it's exhausting.", "the chimneys are the worst. three of them. one full of skeletons, one full of scarecrows, one full of clowns. i don't do clowns unless i'm paid. i'm usually paid."]
    speakPlainly: ["plainly: a coat full of pockets, two daggers, and a house that wants me gone."]
    offer: ["twenty thousand, and twenty loaded springs from the jacks. i set traps with them. traps don't care who i'm out with."]
    join: ["fine. stay behind me. no, closer. there."]
    bench: ["two days. then the house fills up again."]
    leave: ["that's me. back to the house. it's missed me. it hasn't."]
    refuse.bond: ["i don't go in with people i don't know. the house finds out what you're scared of. i don't know what you're scared of yet."]
    refuse.flags: ["sweep the third hallway with me first. then ask."]
    refuseOwnErrand: ["my break. you can watch."]
    questOffer.lucius-the-sweep: ["sweep the third hallway with me. the nightmares are thick in this again and where am I. thirty of them. go in not scared. come out not scared. that's the job."]
    questAccept.lucius-the-sweep: ["the house. the hallway this again, and the hallway where am I. the nightmares. they're worse if you flinch. don't flinch."]
    questWaiting.lucius-the-sweep: ["thirty. still not scared?"]
    questComplete.lucius-the-sweep: ["thirty. and you came out walking forwards. good. that's the sweep. every day."]
    questOffer.lucius-the-scarecrow-chimney: ["the scarecrow chimney's packed again. forty dead scarecrows. go up, break them, come down. i'll owe you. i've got a sword on a string from a hero in the city who never came back for it. it's very silly. it's very good."]
    questAccept.lucius-the-scarecrow-chimney: ["the house. the main chimney, off the hallway where are you. the scarecrow one. they're full of straw and spite."]
    questWaiting.lucius-the-scarecrow-chimney: ["forty. it's dusty up there."]
    questComplete.lucius-the-scarecrow-chimney: ["forty. clean. here. Stirge-on-a-String. Stirgeman's. he left it in the foyer chasing a ghoul. i've kept it two years. he's never asked. take it to him to improve. he'll pretend it's new. and some gum. he uses gum for everything."]
    questOffer.lucius-the-clown-chimney: ["the clown chimney. thirty twisted jesters. i'm paid for this one. i'll pay you. not in coin. in two things i took off a smuggler in the forest. Barricade's men want them."]
    questAccept.lucius-the-clown-chimney: ["the main chimney, the clown one. the twisted jesters. they laugh. don't laugh back. it's a trap."]
    questWaiting.lucius-the-clown-chimney: ["thirty. are they laughing?"]
    questComplete.lucius-the-clown-chimney: ["thirty. quiet. good. here. a crystal shard and a naricain jewel. Barricade in Bigger Ben draws a manual from them for crystal throwing-stars. i'd go myself. i don't go to Bigger Ben. too many gears. gears are worse than clowns."]
    questOffer.lucius-the-mirror: ["the thing in the mirrors. the mirror ghosts in the vanity rooms. three of them. they're strong. they show you yourself and then they hit you with it. i've never broken one. you'll be the first. i'll give you everything a ghost-breaker carries."]
    questAccept.lucius-the-mirror: ["the vanity rooms, off the first hallway and the hallway where am I. or the pumpkin vault, if you're mad. the mirror ghosts. don't look into them. look past them."]
    questWaiting.lucius-the-mirror: ["three. don't look into them."]
    questComplete.lucius-the-mirror: ["three? ...you broke three. i've been trying for ten years. here. Ridley's stone, a Book of Rituals, and five of his defence scrolls. that's everything i carry. i'll get more. take it. you've earned the whole coat. i'm keeping the coat."]
    about.marigold: ["Marigold blesses what i've broken. she says my method's 'very loud'. her method's very quiet. the ghosts hate us both. it's a good partnership."]
    about.dex: ["Dex wants to be my apprentice. he's eleven and scared of everything and he stays anyway. that's the whole job. i'm not telling him that."]
    about.barty: ["Barty runs tours. i break the things he points at. he says i'm bad for business. i'm the reason there's business left."]
    aboutUnknown: ["never broke anything near them."]
    friend.close: ["i've put a charm in your pocket. no, the other one. it's not magic. it's salt. salt helps."]
    friend.best: ["if the house ever gets me, the coat's yours. all the pockets. learn what's in them."]
    famed: ["they speak well of you in the forest. the ghosts don't. that's a good sign."]
    defamed: ["they speak ill of you. so do the ghosts. one of those is a compliment."]
    gift: ["hm. thanks."]
    gift.favorite: ["oh. that's useful. that goes in a pocket. a good pocket."]
    gift.again: ["one's plenty. i'm out of pockets."]

