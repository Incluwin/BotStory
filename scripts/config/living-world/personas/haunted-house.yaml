  title: "Boy on a Dare"
  job: BEGINNER
  level: { min: 20, max: 20 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: haunted-house
    routine:
      - { from: 10, to: 14, spot: "venue:beside-nlc-taxi", activity: LINGER }
      - { from: 14, to: 18, spot: "venue:lower-east-street", activity: STROLL }
      - { from: 18, to: 21, spot: "venue:by-witch-malady", activity: SOCIALIZE }
      - { from: 21, to: 10, materialize: false }
  recruitable: false
  knows: [rotting skeleton, haunted house]
  questLines: [dex-the-dare, dex-ask-lucius]
  relationships:
    - { persona: barty, kind: WON_A_BET_OFF }
    - { persona: lucius, kind: ADMIRES }
    - { persona: winnie, kind: GETS_HIS_TROUSERS_MENDED_BY }
  giftItemIds: [4000018, 2022001]
  dialogue:
    greetFirst: ["are you scared? i'm not scared. i've been here a month. on a dare. the dare was one night. i stayed. i'm not scared. are you?", "hey! you came on the taxi too? did Barty try to sell you a ticket? don't buy one. i know the way. i'll show you. for free. for a sandwich."]
    greet: ["hey! still not scared!", "you're back! did you go in the house? did the third hallway say anything to you?"]
    idle: ["(throws a pebble at the house's front door, flinches when it bounces back, and pretends he didn't)", "(scratches another tally mark on the gatepost, counting the nights he's stayed)"]
    noWork: ["nothing today! i'm being brave. it's tiring."]
    nothingDue: ["we're square! you can't owe a kid. that's a rule."]
    who: ["Dex. i'm from New Leaf City. my friends dared me to spend a night in the Prendergast house. i did. then i stayed. the house is cool. Cornelius lets me sleep in the gatehouse. Barty owes me a fortune. i'm going to be a ghost-breaker like Lucius."]
    bye: ["bye! don't look at the windows! okay, look a little!"]
    thanks: ["thanks! you're all right."]
    smallTalk: ["the rotting skeletons in the hallways just fall apart if you hit them. then they put themselves back together. backwards, sometimes. i saw one with its feet on its head. it didn't seem to mind.", "my friends back in the city think i'm dead. i sent them a postcard. it said 'not dead'. they think the house wrote it."]
    speakPlainly: ["plainly: a kid, a dare, and a month of not being scared."]
    questOffer.dex-the-dare: ["dare you. twenty rotting skeletons in the first hallway and the hallway this again. bet you can't. ...bet you can. go on. i'll wait here. bravely."]
    questAccept.dex-the-dare: ["the house! the first hallway, and the hallway this again! the skeletons! they fall apart! it's great! it's a bit horrible! it's great!"]
    questWaiting.dex-the-dare: ["twenty! you're not scared, are you?"]
    questComplete.dex-the-dare: ["twenty! you did it! ...okay, so, there's a skunk. it came out of the swamp bog behind the house a week ago and it follows me everywhere, but it keeps looking at you now. i think it likes brave people. i think it's changed its mind about me. that's fine. take it. it's very nice. it's a bit smelly. it's very nice."]
    questOffer.dex-ask-lucius: ["can you ask Lucius if i can be his apprentice? the ghost-breaker? he says 'no' to me. he says it before i finish asking. he might let you finish."]
    questAccept.dex-ask-lucius: ["Lucius! by the witch's spot in the afternoon and evening. he's got daggers and a coat with a million pockets. he's the coolest person in the forest."]
    questWaiting.dex-ask-lucius: ["did he say yes? did he say maybe? maybe's nearly yes."]
    questComplete.dex-ask-lucius: ["'when you're tall enough to reach the top pocket'? ...that's a yes! that's a later-yes! i'm going to grow! i'm going to grow SO much!"]
    about.lucius: ["Lucius is a ghost-breaker. he goes in the house every day. on purpose. he's not scared of anything. he says he's scared of everything. that's a joke. i think it's a joke."]
    about.barty: ["Barty bet me i couldn't stay a night. i stayed thirty. he pays me in sandwiches. it's going to take him forever."]
    about.winnie: ["Winnie mends my trousers. the house keeps ripping them. she says it's being friendly. it's a weird way to be friendly."]
    about.cornelius: ["Cornelius lets me sleep in the gatehouse. he's sad a lot. not about me. about his sister. i'm going to help with the party. i'm on candles."]
    aboutUnknown: ["never heard of them! are they brave?"]
    friend.close: ["you're the bravest person i know. after me. okay, before me."]
    friend.best: ["when i'm a ghost-breaker, you can be my partner. you can have the top pocket."]
    famed: ["everyone says you're brave! i said it first!"]
    defamed: ["people are saying stuff. i'm not listening. la la la."]
    gift: ["for me? thanks!"]
    gift.favorite: ["whoa! that's the best! i'm keeping it in the gatehouse!"]
    gift.again: ["you already gave me something! i've still got it!"]

- id: lucius
  name: Lucius
  look: { gender: male }
  title: "Ghost-Breaker"
  job: BANDIT
  level: { min: 52, max: 55 }
