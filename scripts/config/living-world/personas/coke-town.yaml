# Coke Town cast (Repack Residents, docs/REPACK_RESIDENTS_PLAN.md section 3.1): 7 Residents, 2 recruitable. Always
# winter, at the end of a hidden street from Henesys; the polar bears Poch, Nell (the Sundry Goods Shop), Lolo and Puch
# keep house there. Marit keeps the key of her brother Ebbe's house, the Empty House at the top of the hill: he cut the
# ice lamps for every window in town and went up the Coke Valley one winter for the year's ice and never came back
# (arcs/coke-town.yaml). Inga gives hats made for the player's class (L35 / L40 / L50); the two recruits give capes
# (Aksel, L50 / L60 / L65) and earrings (Ylva, L50 / L55 / L60).
- id: marit
  name: Marit
  look: { gender: female }
  title: "Keeper of the Empty House's Key"
  job: BEGINNER
  level: { min: 38, max: 40 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: coke-town
    routine:
      - { from: 7, to: 11, spot: "venue:empty-house-in-coke-town-door", activity: LINGER }
      - { from: 11, to: 14, spot: "venue:sundry-goods-shop-door", activity: SOCIALIZE }
      - { from: 14, to: 17, materialize: false }
      - { from: 17, to: 20, spot: "venue:empty-house-in-coke-town-door", activity: LINGER }
      - { from: 20, to: 7, materialize: false }
  recruitable: false
  knows: [Empty House in Coke Town, Forest of Coke Golem, Coke Ice Block]
  questLines: [marit-the-weekly-sweep, marit-the-last-lamp, marit-the-house-lit]
  arc: marit-the-empty-house
  relationships:
    - { persona: inga, kind: SITS_BY_THE_DOOR_WITH }
    - { persona: nils, kind: LENT_A_SLED_TO }
    - { persona: toivo, kind: BRINGS_A_FLASK_TO }
    - { persona: ylva, kind: FINDS_ICE_ON_HER_STEP_FROM }
  giftItemIds: [2020013, 2022001]
  dialogue:
    greetFirst: ["you came in by the Cokebear operator, from Henesys. everybody does, once. stamp your boots. the snow's real.", "a new face in Coke Town. mind the ice on the steps. mind the polar bears. they're very polite. that's not the same as small."]
    greet: ["hello, love.", "you again. stamp your boots.", "(nods) the snow's the same. so am i."]
    idle: ["(takes a key on a string from under her scarf, looks at it, and tucks it back)", "(sweeps the step of the house at the top of the hill with a short broom, though there's no snow on it)"]
    noWork: ["nothing today. the step's swept. it's always swept."]
    nothingDue: ["nothing owed. not between us."]
    who: ["Marit. i keep the key to the Empty House, at the top of the hill. it's my brother Ebbe's. he cut the ice lamps for every window in Coke Town. eleven winters ago he went up the Coke Valley with his sled for the year's ice and never came back. i air his house every week. i don't light his lamp. that's his to do."]
    bye: ["mind the ice."]
    thanks: ["thank you, love."]
    smallTalk: ["every window in town has one of Ebbe's lamps in it. clear ice, a candle inside. nothing melts here. you'd think that would be a comfort.", "Ebbe's window was always the last lit and the darkest in town. i used to tease him. the lamp-maker's house is the dark one. i said it that very morning."]
    speakPlainly: ["plainly: a key, a broom, and a house with nobody in it."]
    questOffer.marit-the-weekly-sweep: ["i air Ebbe's house every week. take the key, go up and open the shutters for me. mind the third step, it's loose. he was going to fix it. then the snails off the Ski Camp's first slopes. twenty-five of them, snails or slimes. they come in under his door and leave trails on the floor."]
    questAccept.marit-the-weekly-sweep: ["up the hill, the house at the very top. then out through the gate on the lower street to the Ski Camp. the first slope and the one off it. they're slow. so am i."]
    questWaiting.marit-the-weekly-sweep: ["the shutters, and twenty-five. and my key back."]
    questComplete.marit-the-weekly-sweep: ["the shutters, and the snails, and my key. thank you. you've the same way with a door he had. firm. he'd have liked you."]
    questOffer.marit-the-last-lamp: ["Aksel found Ebbe's sled up in the Forest of Coke Golem. every lamp for the town done and wrapped, and a space in the box for one more. his own. he'd finished. he should have come home. he went on up. Ylva keeps the watch at the valley's turn. if anybody saw him go by, she did. ask her. and bring me ten blocks of the Ice Golems' ice. the ice he went up for."]
    questAccept.marit-the-last-lamp: ["Ylva's on the east streets, mornings and evenings. then out the east end, all the way up the valley to the turn, past the Yetis on their stumps, to the forest door at the far end. mind them. ten blocks. the clearest there is."]
    questWaiting.marit-the-last-lamp: ["did she see him? ...and the ice. ten blocks."]
    questComplete.marit-the-last-lamp: ["she told him to turn back, and he laughed. he was cutting the clearest lamp in the valley for his own window. for once. because i teased him. ...ten blocks. the clearest ice there is. it's what he went for. thank you, love."]
    questOffer.marit-the-house-lit: ["it's cut. it took eleven tries and most of my temper. it's crooked. it's his. Inga's been knitting something for it, and Toivo carried Ebbe's lamps up the hill every year. go and see them both. then set it in his window. i'll stay down here. i want to see it from the street first."]
    questAccept.marit-the-house-lit: ["Inga's at Nell's door. Toivo's by the Ski Camp gate on the lower street. then up the hill to the house. the window by the door. he always put it there."]
    questWaiting.marit-the-house-lit: ["is it in the window? don't tell me. i'm looking at my boots."]
    questComplete.marit-the-house-lit: ["...there. look. the top of the hill. it's lit. it's crooked and it's lit. eleven winters. every window in Coke Town, and his. i'm going up to sit in it a while. you come too. i'll put the kettle on in his kitchen. our kitchen."]
    about.inga: ["Inga and i have sat by Nell's door every winter for thirty years. she tells me my scarf's on crooked. i tell her her stitches are. we're both right."]
    about.toivo: ["Toivo carried Ebbe's lamps up the hill every year, two at a time, and never dropped one. he teaches skiing now. he still walks like he's carrying something."]
    about.nils: ["Nils has Ebbe's old boy-sled. it was under the stairs in the house. a sled should go fast. so should a boy. i lent him the sled. the fast he had already."]
    about.bartolo: ["Bartolo came down from Henesys for a weekend twenty years ago and never went home. he once asked me, very politely, for the lid off my kettle. i gave it him. i boil water in a pan now."]
    about.aksel: ["Aksel comes down from the Forest of Coke Golem with ice in his beard and doesn't say much. Nell says he's shy. a man that size, shy. i like him."]
    about.ylva: ["Ylva keeps the watch at the valley's turn. every winter she leaves a block of clear ice on my step and doesn't knock."]
    aboutUnknown: ["never had them in for tea. send them round."]
    friend.close: ["sit on Ebbe's step whenever you like. nobody else does. i'd like somebody to."]
    friend.best: ["if i ever light that lamp, you'll be the first to see it. i've decided."]
    famed: ["they say your name down at Nell's. i'm glad. Nell's hard to impress. she's a bear."]
    defamed: ["i've heard. people say things in the cold they'd never say by a fire. i don't believe them."]
    gift: ["oh. thank you, love."]
    gift.favorite: ["oh, that's a proper winter treat. that'll warm the whole afternoon."]
    gift.again: ["one's plenty, love. keep the rest for the walk."]

- id: toivo
  name: Toivo
  look: { gender: male }
  title: "Instructor of the Coke Ski Camp"
  job: FIGHTER
  level: { min: 32, max: 34 }
  strength: SEASONED
  loadout: perion-warrior-l30
  personality: efficient-v1
  home:
    town: coke-town
    routine:
      - { from: 7, to: 10, spot: "venue:lower-central-street", activity: LINGER }
      - { from: 10, to: 16, materialize: false }
      - { from: 16, to: 19, spot: "venue:lower-central-street", activity: SOCIALIZE }
      - { from: 19, to: 21, spot: "venue:by-cokebear-operator", activity: SOCIALIZE }
      - { from: 21, to: 7, materialize: false }
  recruitable: false
  knows: [Coke Ski Camp, Coke Slime, Coke Pig]
  questLines: [toivo-the-bunny-slope, toivo-the-slalom-gates]
  rumors: [coke-the-record-run]
  relationships:
    - { persona: nils, kind: HOLDS_THE_RECORD_AGAINST }
    - { persona: marit, kind: CARRIED_LAMPS_FOR }
    - { persona: inga, kind: WEARS_A_HAT_BY }
  giftItemIds: [2020008, 2020006]
  dialogue:
    greetFirst: ["new? you've got the knees of a beginner. that's fine. everyone does. bend them.", "welcome to Coke Town. the Ski Camp's through the gate on the lower street. first lesson's free. second lesson's also free. nobody gets to a third."]
    greet: ["knees!", "you again. bend them.", "hey. good stance."]
    idle: ["(bends his knees, leans forward, and holds it, as if showing somebody who isn't there)", "(waxes a ski with long, even strokes, then sights along it against the snow)"]
    noWork: ["nothing today. the slopes are clear. lean forward anyway. it's good for you."]
    nothingDue: ["we're square. like a good stance."]
    who: ["Toivo. i teach skiing at the Coke Ski Camp. people come down from Henesys to fight things, and i teach them to stop without a tree. the sword's for the slimes. the skis are for everything else."]
    bye: ["knees bent. always."]
    thanks: ["good. thanks."]
    smallTalk: ["the slimes on the bunny slope sit right where my beginners fall over. i don't know if they sit there because people fall, or people fall because they sit there. i've thought about it a lot.", "i carried Ebbe's lamps up the hill every year. two at a time, one in each arm, knees bent. people ask why i walk like this. that's why."]
    speakPlainly: ["plainly: skis, a sword, and bent knees."]
    questOffer.toivo-the-bunny-slope: ["my beginners keep landing on the Coke Slimes on the Ski Camp's first slopes. the slimes don't mind. the beginners do. twenty-five, please. the first slope and the one off it."]
    questAccept.toivo-the-bunny-slope: ["through the gate on the lower street. the bunny slope's right there. you'll know it by the people lying in the snow."]
    questWaiting.toivo-the-bunny-slope: ["twenty-five. my class is waiting. in a heap."]
    questComplete.toivo-the-bunny-slope: ["twenty-five. look at that. a clean slope. my beginners are falling over nothing now. that's progress. here."]
    questOffer.toivo-the-slalom-gates: ["i'm setting a slalom down the middle of the camp. red flags against snow. the Coke Pigs carry red Coca-Cola cards. thirty pigs, ten cards, and i'll pin them on the gates. you'll see them from the top."]
    questAccept.toivo-the-slalom-gates: ["down the camp to the middle runs, where the pigs are, and the slope off it. they're slow downhill. so are my students."]
    questWaiting.toivo-the-slalom-gates: ["ten cards. the gates are bare."]
    questComplete.toivo-the-slalom-gates: ["ten. red as anything. look at them flap. first one down without missing a gate gets a sausage. it's never anyone. here, for you."]
    about.marit: ["Marit brings me a flask at the Ski Camp gate some mornings. she won't say what's in it. it's always hot, and it's always just what i needed. i don't ask how she knows."]
    about.inga: ["Inga knitted me a hat with earflaps that tie under the chin. i wear it. i look like a dumpling. she says that's the point."]
    about.nils: ["Nils goes down the sled run faster than anybody i've ever taught, and i've never taught him. he says he's going to beat my record. he might. don't tell him."]
    about.bartolo: ["Bartolo walks the camp picking up lids. he's found every lid i've ever dropped. he gives each one back with a little speech about care."]
    about.aksel: ["Aksel's the only man i know who walks up the valley instead of skiing down something. he's got a stance like a wall. i asked him to teach balance at the camp. he said 'no' and then 'thank you', a minute apart."]
    about.ylva: ["Ylva skis like an arrow. straight down, no turns, no brakes. i've given up telling her. she's never fallen."]
    aboutUnknown: ["never had them in a class."]
    friend.close: ["you can have the good skis. the ones by the door. nobody gets the good skis."]
    friend.best: ["if i ever open a proper school, your name goes over the door. second, after mine. it's a big door."]
    famed: ["your name's going round the Ski Camp. good things. even my beginners have heard, and they hear nothing."]
    defamed: ["i've heard. i don't teach rumours. they fall over on their own."]
    gift: ["oh. thanks."]
    gift.favorite: ["now that's a proper lunch for the slopes. thanks."]
    gift.again: ["one a day. i've got to fit in my boots."]

- id: inga
  name: Inga
  look: { gender: female }
  title: "Knitter of the Sundry Goods Shop Door"
  job: BEGINNER
  level: { min: 44, max: 46 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: coke-town
    routine:
      - { from: 8, to: 13, spot: "venue:sundry-goods-shop-door", activity: REST }
      - { from: 13, to: 14, materialize: false }
      - { from: 14, to: 19, spot: "venue:sundry-goods-shop-door", activity: REST }
      - { from: 19, to: 22, spot: "venue:middle-west-street", activity: SOCIALIZE }
      - { from: 22, to: 8, materialize: false }
  recruitable: false
  knows: [Coca-Cola Can, CokePLAY Cube, Igloo Turtle]
  questLines: [inga-buttons-for-the-door, inga-a-hat-for-your-trade, inga-a-warmer-hat, inga-the-warmest-hat]
  rumors: [coke-the-button-war]
  relationships:
    - { persona: marit, kind: SITS_BY_THE_DOOR_WITH }
    - { persona: bartolo, kind: ARGUES_BUTTONS_WITH }
    - { persona: toivo, kind: KNITTED_A_HAT_FOR }
  giftItemIds: [2020016, 2020012]
  dialogue:
    greetFirst: ["sit, sit. you're blue. here, hold this yarn. no, both hands. good.", "a new face! and no hat. in Coke Town. dear me."]
    greet: ["hello, dear.", "you again! where's your hat?", "(waves a knitting needle) hello!"]
    idle: ["(knits very fast without looking down, then looks down, frowns, and pulls back three rows)", "(holds a half-made hat up against the sky to check the colour)"]
    noWork: ["nothing today. i'm knitting. i'm always knitting. it doesn't count as work. tell Nell."]
    nothingDue: ["nothing owed. not a stitch."]
    who: ["Inga. i sit by Nell's door and knit. hats, mostly, and a hat made for your trade when you've earned one, with a lining knitted in so it's warm. Nell sells the honey. i keep the bears' ears warm. Lolo's got three of mine."]
    bye: ["keep your ears in."]
    thanks: ["oh, thank you, dear."]
    smallTalk: ["the polar bears hate hats. Lolo wears mine to be polite. he takes it off round the corner. i know. i've seen.", "i punch buttons out of the cans the Coketumps carry. Bartolo goes pale. he says a can's for keeping. a can's for buttons."]
    speakPlainly: ["plainly: needles, yarn, and nobody leaving here with cold ears."]
    questOffer.inga-buttons-for-the-door: ["i'm out of buttons. the Coketumps on the Ski Camp carry cans, and i punch the buttons out of the tops. twenty Coketumps, twelve cans. don't tell Bartolo. he'll want to look at them first."]
    questAccept.inga-buttons-for-the-door: ["through the gate on the lower street, then down the camp past the mushrooms. the Coketumps are stumps. they fizz. it's the cans."]
    questWaiting.inga-buttons-for-the-door: ["twelve cans. the cardigan's open at the front."]
    questComplete.inga-buttons-for-the-door: ["twelve! lovely tin. i'll get forty buttons out of these, and Bartolo's not seen. thank you, dear. go on, take these."]
    questOffer.inga-a-hat-for-your-trade: ["you've been about Coke Town long enough. you want a hat. a proper one, made for your trade, and i'll knit the lining in. the Coke Pigs down the middle of the camp keep trampling my yarn when i dry it on the line. thirty pigs. and ask Bartolo for one lid, for the crown. he'll make a speech."]
    questAccept.inga-a-hat-for-your-trade: ["down the middle of the camp, where Toivo's put his red flags. the pigs are by the flags. then Bartolo. he's on the west streets, or wherever there's a lid on the ground."]
    questWaiting.inga-a-hat-for-your-trade: ["thirty pigs, and one lid. the lining's ready."]
    questComplete.inga-a-hat-for-your-trade: ["thirty, and he gave you one? a dented one. of course. there, sewn in where it's safe. here's your hat, dear, cut for your trade. safe scrolls in every slot, every one took. ears in."]
    questOffer.inga-a-warmer-hat: ["a warmer hat. the Coke Seals in Coke Valley carry PLAY cubes, soft as anything. i chop them up for the earflaps. thirty seals, fifteen cubes. out the east end of town."]
    questAccept.inga-a-warmer-hat: ["out the east end of the middle street, into the first valley and the Small Alley off it. the seals bark. bark back. they like it."]
    questWaiting.inga-a-warmer-hat: ["fifteen cubes. the earflaps are flat."]
    questComplete.inga-a-warmer-hat: ["fifteen. feel that, squashy. there, a warmer hat, cut for your trade. sixties in every slot, every one took. you'll be warm to the eyebrows."]
    questOffer.inga-the-warmest-hat: ["the warmest hat i've ever made, cut for your trade. a good hat wants blocking, so it keeps its shape. the Igloo Turtles up the valley carry ice blocks, flat and true. thirty-five turtles, fifteen blocks, and i'll block it over them. a hat block. you see? i've waited years to say that."]
    questAccept.inga-the-warmest-hat: ["up the valley past the seals, to the second valley and the third. the turtles are slow. they carry their houses on their backs. so do i, really."]
    questWaiting.inga-the-warmest-hat: ["fifteen blocks. the hat's waiting to be blocked."]
    questComplete.inga-the-warmest-hat: ["fifteen. look how it holds its shape. the warmest hat in Coke Town, cut for your trade. two tens and the rest sixties, every one took. i've never made a better one. don't tell Lolo."]
    about.marit: ["Marit and i have sat by Nell's door every winter for thirty years. she keeps a key on a string round her neck and touches it when she thinks nobody's looking. i'm always looking. i'm knitting. it's the same thing."]
    about.toivo: ["Toivo wears the hat i made him, earflaps tied under his chin. he looks like a dumpling. a dumpling who can ski. it's a good look."]
    about.nils: ["i made Nils a hat with a bobble. a big bobble. so i can see him on the sled run from Nell's door. i can. i always can."]
    about.bartolo: ["Bartolo's been cross with me about buttons for twenty years. he brings me cans anyway. dented ones. he says those aren't collectable. he says it every time."]
    about.aksel: ["Aksel's head is too big for any hat i've made. i'm working on one. it's more of a tent."]
    about.ylva: ["Ylva won't wear a hat. she says it gets in the way of her ears. her ears are always red. i knitted her a band. she wears it in her pocket."]
    aboutUnknown: ["never knitted them anything. send them round. i'll measure their heads."]
    friend.close: ["i'm knitting you something. no, you can't see. sit still. i'm measuring your head with my eyes."]
    friend.best: ["every hat i make, i think: would this keep your ears warm? that's how you know you've a friend. you think about their ears."]
    famed: ["they say your name in Nell's shop. the bears nod. a bear nodding is very high praise."]
    defamed: ["pff. people talk. i knit. one of those keeps you warm."]
    gift: ["oh! thank you, dear."]
    gift.favorite: ["oh, that's just the thing for a long afternoon at the door. thank you."]
    gift.again: ["one's lovely, dear. i've only two hands, and they're busy."]

- id: nils
  name: Nils
  look: { gender: male }
  title: "Boy of the Sled Run"
  job: BEGINNER
  level: { min: 12, max: 14 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: coke-town
    routine:
      - { from: 9, to: 12, spot: "venue:house-of-lolo-door", activity: STROLL }
      - { from: 12, to: 15, materialize: false }
      - { from: 15, to: 19, spot: "venue:lower-central-street", activity: SOCIALIZE }
      - { from: 19, to: 9, materialize: false }
  recruitable: false
  knows: [Coke Mushroom, Coketump, Coke Ski Camp]
  questLines: [nils-the-sled-bell, nils-the-record-run]
  rumors: [coke-the-record-run]
  relationships:
    - { persona: toivo, kind: CHASES_THE_RECORD_OF }
    - { persona: marit, kind: BORROWS_A_SLED_FROM }
    - { persona: bartolo, kind: FINDS_LIDS_FOR }
  giftItemIds: [2001001, 2001002]
  dialogue:
    greetFirst: ["are you new? the sled run's the best thing here. i'm the second best thing here.", "hi! you came on the Cokebear thing! i've never been to Henesys. is it warm? is it boring?"]
    greet: ["hi!", "you came back! want to see the sled?", "hi hi."]
    idle: ["(lies on his back in the snow and makes an angel, then jumps up to look at it)", "(polishes the runners of a small wooden sled with his sleeve)"]
    noWork: ["nothing today! i'm sledding. you can watch."]
    nothingDue: ["we're even! even-steven!"]
    who: ["Nils! i do the sled run down the Ski Camp every day. my sled's the fastest in Coke Town. it was Ebbe's, when he was a boy. Marit lent it me. lent, not given. i'm very careful. mostly."]
    bye: ["watch me go!"]
    thanks: ["thanks! thanks thanks."]
    smallTalk: ["Toivo's record down the sled run is a hundred and four seconds. i'm going to do a hundred and three. one day. soon. tuesday.", "the polar bears let me sit by their stove if i don't touch the honey. i haven't touched the honey. much."]
    speakPlainly: ["plainly: a sled, a hill, and Toivo's record."]
    questOffer.nils-the-sled-bell: ["people don't hear me coming on the sled run. Toivo says i need a bell. i'm making one out of cans on a string. the Coke Mushrooms on the Ski Camp carry cans. twenty mushrooms, ten cans. it'll be very loud."]
    questAccept.nils-the-sled-bell: ["through the gate! the mushrooms are on the slope off the first one, and the next one down. they bounce. don't bounce back."]
    questWaiting.nils-the-sled-bell: ["ten cans! it has to be loud!"]
    questComplete.nils-the-sled-bell: ["ten! listen! ...see? you can hear me from the House of Lolo now. Lolo says that's a problem. Lolo's wrong. here, for you!"]
    questOffer.nils-the-record-run: ["i'm going to beat Toivo's record. but the bottom of the run's full of Coketumps. go all the way down to the end of the Ski Camp and clear twenty out of my way. then tell Toivo to get his watch out."]
    questAccept.nils-the-record-run: ["all the way down the camp to the end of the run. the Coketumps there are big and the Lites are fizzy. then Toivo, at the gate on the lower street."]
    questWaiting.nils-the-record-run: ["did you tell Toivo? is the run clear?"]
    questComplete.nils-the-record-run: ["a hundred and four! the same as Toivo! a tie! Toivo said 'hm.' that's the biggest 'hm' he's ever said. next time a hundred and three. that's for you. a bit. mostly me."]
    about.marit: ["Marit lent me Ebbe's sled. she says if i break it she'll be very quiet at me. that's worse than shouting."]
    about.toivo: ["Toivo says bend your knees. he says it to everybody. he says it to the polar bears. they bend their knees."]
    about.inga: ["Inga made me a hat with a bobble. the bobble's bigger than my head. i can't see where i'm going on the sled run. i go anyway."]
    about.bartolo: ["Bartolo gives me a coin for every lid i find on the sled run. i've found ninety-one. he says i'm his best employee. i'm his only employee."]
    about.aksel: ["Aksel let me hold his axe once. i couldn't. it's that heavy. he said it's lighter when you need it. i think that's a lie for kids."]
    about.ylva: ["Ylva shot an apple off a stick from the other end of the street. a real apple. she ate it after."]
    aboutUnknown: ["don't know them! are they fast?"]
    friend.close: ["you can have a go on the sled. a short go. a short medium go."]
    friend.best: ["when i beat Toivo's record properly, you can be on the camp board too. next to me. i'm saving the space."]
    famed: ["everybody's saying your name! i say it too! loudest!"]
    defamed: ["that's a fib. Marit says people who tell fibs in the cold get frostbite on their tongues."]
    gift: ["for me? thanks!"]
    gift.favorite: ["wow! that's the best one! i'm not sharing it! okay, a bit."]
    gift.again: ["one a day! Marit says. Marit has rules."]

