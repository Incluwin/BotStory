  recruitable: false
  knows: [Coke Bottle Lid, Coca-Cola Light Can, Coke Snail]
  questLines: [bartolo-the-lid-wall, bartolo-the-light-ones]
  rumors: [coke-the-button-war]
  relationships:
    - { persona: inga, kind: ARGUES_BUTTONS_WITH }
    - { persona: nils, kind: PAYS_A_COIN_A_LID_TO }
    - { persona: ylva, kind: KEEPS_A_SHOT_LID_FROM }
  giftItemIds: [2022035, 2020004]
  dialogue:
    greetFirst: ["ah! a visitor! you haven't any lids on you? bottle lids? no? never mind. you will.", "welcome, welcome. Bartolo. i came here for a weekend twenty years ago. the weekend's going very well."]
    greet: ["ah! hello!", "you! any lids?", "my friend. come, come."]
    idle: ["(holds a bottle lid up to the light, turns it, and files it in a small tin with great ceremony)", "(polishes a flattened can with a cloth and stands it on its edge to admire it)"]
    noWork: ["nothing today. the collection is catalogued. it's never catalogued. today it is."]
    nothingDue: ["we're square. i've written it on a lid."]
    who: ["Bartolo. i collect lids and cans. Coke Bottle Lids, the cans, the light cans, the red cards the pigs drop. two thousand and eleven lids at the last count. each one is a little different. you have to look. nobody looks."]
    bye: ["eyes on the ground, my friend. that's where the lids are."]
    thanks: ["grazie. thank you. both."]
    smallTalk: ["the Coke Snails on the first slope carry lids on their backs like little hats. they don't know what they've got.", "the polar bear Pouch lets me keep the collection in the back room of his house. he's stopped asking how big it's getting. so have i."]
    speakPlainly: ["plainly: lids, cans, and a back room full of both."]
    questOffer.bartolo-the-lid-wall: ["the lid wall in my back room has a gap. a big gap. the Coke Snails and Coke Slimes on the Ski Camp's first slopes carry bottle lids. twenty of them, fifteen lids. the snails' lids are better. don't tell the slimes."]
    questAccept.bartolo-the-lid-wall: ["through the gate on the lower street. the first slope, and the one off it. the snails are slow, the slimes are bouncy. the lids are the same."]
    questWaiting.bartolo-the-lid-wall: ["fifteen lids. the gap is staring at me."]
    questComplete.bartolo-the-lid-wall: ["fifteen! look, this one's bent. that's a story, that is. and this one's got a scratch like a smile. thank you. the wall's whole. well. wholer."]
    questOffer.bartolo-the-light-ones: ["the light cans. silver, thinner, lighter. i keep them on their own shelf, by weight. the Coketump Lites carry them, down the far runs of the Ski Camp. twenty-five Lites, twelve light cans."]
    questAccept.bartolo-the-light-ones: ["all the way down the Ski Camp, the side run off the second slope and the end of the run. the Lites fizz when you hit them. that's normal."]
    questWaiting.bartolo-the-light-ones: ["twelve. the shelf is light. lighter than the cans."]
    questComplete.bartolo-the-light-ones: ["twelve. ah. feel that. you can hardly tell you're holding it. that's the whole point of them. on the shelf they go. by weight. here, for your trouble."]
    about.marit: ["Marit gave me the first lid i ever kept in Coke Town. off her kettle. i asked very politely. she's never let me forget it."]
    about.toivo: ["Toivo drops lids on the slopes and i bring them back. he says 'keep it.' i say a lid isn't a gift, it's a responsibility."]
    about.inga: ["Inga punches buttons out of cans. good cans. she says a can's for using. i say a can's for keeping. we've had this argument twenty years. i'm winning."]
    about.nils: ["Nils finds lids on the sled run for a coin each. ninety-one so far. he has an eye. i'm training it."]
    about.aksel: ["Aksel brought me a lid from the Forest of Coke Golem once, frozen in a piece of ice. he put it on the table and went. i've never chipped it out. it's on the shelf, ice and all."]
    about.ylva: ["Ylva shot a lid off a post at a hundred paces for me. it's got a hole through the middle now. best lid i own. i keep it in a velvet box."]
    aboutUnknown: ["never traded a lid with them."]
    friend.close: ["you may choose a lid from the wall. any lid. not that one. any other lid."]
    friend.best: ["when i'm gone, the collection's yours. all two thousand. you'll need a bigger room. sorry."]
    famed: ["your name! i hear it everywhere. like a good lid. everybody wants one."]
    defamed: ["pah. talk is like a bent lid. some people throw it away. i keep it and look at it closely. it's not what they say."]
    gift: ["ah! grazie. thank you."]
    gift.favorite: ["oh, now that's a treat. i'll enjoy it slowly. i might keep the wrapper."]
    gift.again: ["one, my friend. one is a gift. two is a collection, and i have enough of those."]

- id: aksel
  name: Aksel
  look: { gender: male }
  title: "Ice Golem Hunter of the Coke Valley"
  job: CRUSADER
  level: { min: 62, max: 64 }
  strength: VETERAN
  loadout: ice-valley-axe-l60
  personality: efficient-v1
  home:
    town: coke-town
    routine:
