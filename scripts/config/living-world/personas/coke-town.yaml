  questLines: [ylva-the-barking-path, ylva-the-watch, ylva-cubes-for-the-fletching, ylva-the-turn-of-the-valley, ylva-arrows-for-nell]
  rumors: [coke-the-valley-turn]
  benchToleranceDays: 3
