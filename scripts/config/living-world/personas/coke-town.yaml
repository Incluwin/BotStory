  giftItemIds: [2020014, 2020015]
  dialogue:
    greetFirst: ["you came in from Henesys. i saw you from the valley. i see everybody.", "new. you walk loud. that's all right here. the snow eats it."]
    greet: ["hello.", "you. i saw you coming.", "(lifts two fingers off the bow) hello."]
    idle: ["(counts something on her fingers, looking east toward the valley, then starts again)", "(rolls an arrow along her palm to check it's straight, and puts it back)"]
    noWork: ["nothing today. the valley's quiet. i'll go and listen to it anyway."]
    nothingDue: ["even."]
    who: ["Ylva. i keep the watch at the turn of the Coke Valley, where the fourth valley bends up toward the forest. everybody who goes up passes me, and everybody who comes down. i count them. it's what i do."]
    bye: ["come back down."]
    thanks: ["thanks."]
    smallTalk: ["the Play Seals bark at anybody coming up the valley. i think they think it's helping. it's not.", "Aksel stands like a wall and i shoot past him. nine winters and we've never once got in each other's way. that's a long time not to get in each other's way."]
    speakPlainly: ["plainly: a bow, a lookout, and a count."]
    offer: ["twenty-five PLAY cubes off the seals, and twenty-five thousand. the cubes go to Nell for arrows. the mesos go on more arrows. then i'll watch your back like i watch the valley."]
    join: ["go on. i'll be on the high ground."]
    bench: ["three days. then the turn of the valley."]
    leave: ["back to the turn."]
    refuse.bond: ["no. i haven't seen you walk the valley yet."]
    refuse.flags: ["clear the Play Seals off the valley path with me first. and come by the middle east street of an evening, six till nine, and hear what Aksel says about me. then ask."]
    refuseOwnErrand: ["the seals first. walk the path with me."]
    questOffer.ylva-the-barking-path: ["the Play Seals sit on the valley path and bark at anybody coming up. the first valley, and the Small Alley off it. thirty of them. walk the path with me. i'll see how you walk."]
    questAccept.ylva-the-barking-path: ["out the east end of the middle street. the first valley. they'll bark. don't bark back. Inga says bark back. Inga's wrong."]
    questWaiting.ylva-the-barking-path: ["thirty. the path's still barking."]
    questComplete.ylva-the-barking-path: ["thirty. quiet. you walk all right. you look up. most people look at their feet. i'd watch your back."]
    questOffer.ylva-the-watch: ["walk my watch with me. the Igloo Turtles in the second valley, thirty of them. then up into the third valley and stand there a minute, looking up toward the turn. see all of it at once. then come back. i've a pair of earrings that want wearing."]
    questAccept.ylva-the-watch: ["the second valley, past the seals. the turtles carry ice on their backs. then the third valley. stand. look up. that's my watch."]
    questWaiting.ylva-the-watch: ["thirty, and the third valley. don't skip the standing."]
    questComplete.ylva-the-watch: ["you stood. good. you've seen it now, the whole valley at once. the earrings. every safe scroll they'd take, every one took. i bought them in Henesys and never wore them. they catch the light. a watcher shouldn't. you should."]
    questOffer.ylva-cubes-for-the-fletching: ["the Coke Golems in the third valley carry Coca-Cola cubes. Nell cuts them into weights for my fletching. thirty golems, twelve cubes. there's another pair of earrings in it. better."]
    questAccept.ylva-cubes-for-the-fletching: ["the third valley. the golems are sweet and slow and they hit hard. stay out of reach. i do."]
    questWaiting.ylva-cubes-for-the-fletching: ["twelve cubes."]
    questComplete.ylva-cubes-for-the-fletching: ["twelve. Nell will be pleased. she won't show it. the earrings. scrolled at sixty, every one took. they catch the light. so you'll be found."]
    questOffer.ylva-the-turn-of-the-valley: ["the Yetis ride Coketumps round the turn of the valley and knock people into the snow. thirty of them, and ten of the gems they carry. the best earrings i've got. for somebody who's held my turn."]
    questAccept.ylva-the-turn-of-the-valley: ["the fourth valley, the turn. they come fast round the bend. shoot first. ask after. that's not advice for anywhere else."]
    questWaiting.ylva-the-turn-of-the-valley: ["ten gems. the turn's still loud."]
    questComplete.ylva-the-turn-of-the-valley: ["ten. you held the turn. the earrings. two tens and the rest at sixty, every one took. i'll count you up and count you down, every time. you'll always come out right."]
    questOffer.ylva-arrows-for-nell: ["ten PLAY cubes? Nell's out of fletching again."]
    questAccept.ylva-arrows-for-nell: ["the first valley."]
    questWaiting.ylva-arrows-for-nell: ["ten."]
    questComplete.ylva-arrows-for-nell: ["ten. arrows by tonight. thanks."]
    about.marit: ["Marit's brother went up the valley one winter, past my watch, in a storm. i think of him every time the snow comes sideways."]
    about.toivo: ["Toivo tells me to turn when i ski. i don't turn. he's stopped telling me. he still shouts 'knees.'"]
    about.inga: ["Inga knitted me a headband. i keep it in my pocket. my pocket's warm. my ears are cold. it's a fair trade."]
    about.nils: ["Nils asked me to teach him the bow. i said when you can stand still for a minute. he's tried. forty seconds."]
    about.bartolo: ["i shot a lid off a post for Bartolo once. he keeps it in a velvet box. nothing i've done has ever been kept in a velvet box before."]
    about.aksel: ["Aksel hunts the forest above my watch. he comes down past me every evening and i count him. he's always there to count. that's rare."]
    aboutUnknown: ["never counted them up the valley."]
    friend.close: ["i count you up the valley and i count you down. for you i check twice."]
    friend.best: ["if you ever go up the valley in a storm, i'll stand at the turn till you come down. however long. i mean that."]
    famed: ["people say your name in town. i hear it from the turn. the snow carries it."]
    defamed: ["i heard. i don't count what people say. i count who comes home."]
    gift: ["thanks."]
    gift.favorite: ["that's a good one for a long watch. thanks."]
    gift.again: ["one's enough. long watch, small pockets."]
