  recruitable: true
  knows: [Ice Golem, Coke Golem, Yeti and Coketump]
  contract: aksel-the-forest-watch
  questLines: [aksel-the-golem-forest, aksel-the-sled-in-the-ice, aksel-the-third-valley, aksel-the-clear-ice, aksel-the-whole-valley, aksel-ice-for-nell]
  rumors: [coke-the-valley-turn]
  benchToleranceDays: 3
  paceGap: 2
  relationships:
    - { persona: ylva, kind: HUNTS_WITH }
    - { persona: marit, kind: CARRIED_A_SLED_FOR }
    - { persona: nils, kind: IS_FOLLOWED_BY }
  giftItemIds: [2000004, 2020005]
  dialogue:
    greetFirst: ["hm. you're new. stand out of the wind.", "...hello. i'm not good at hello. Aksel."]
    greet: ["hm. hello.", "you.", "(nods)"]
    idle: ["(knocks ice out of his beard with the back of a gauntlet)", "(runs a whetstone along an axe in slow strokes, then tests the edge on a fleck of ice)"]
    noWork: ["nothing today. the golems will keep."]
    nothingDue: ["square."]
    who: ["Aksel. i hunt the Ice Golems in the Forest of Coke Golem, at the top of the valley. i came down from El Nath nine winters ago for the hardest ice there is. i stayed for Nell's cocoa. don't tell anyone that part."]
    bye: ["out of the wind."]
    thanks: ["hm. thanks."]
    smallTalk: ["the Ice Golems grow ice round anything they find. a glove. a branch. a bird, once. it flew off when i broke it out. it didn't say thank you. birds don't.", "the Coke Golems lower down are made of something sweet. they sweat when they're angry. i don't eat it. Nils does."]
    speakPlainly: ["plainly: an axe, a shield, and a lot of ice."]
    offer: ["sixty Ice Golems, counted from today, and thirty thousand. the golems are the proof. the mesos are for Nell. i owe her for cocoa. then i'll walk with you."]
    join: ["go on. i'll take the wind side."]
    bench: ["three days. then the forest."]
    leave: ["back to the forest."]
    refuse.bond: ["no. i don't know your swing yet."]
    refuse.flags: ["come up to the Forest of Coke Golem with me first. thirty Ice Golems. then ask."]
    refuseOwnErrand: ["the forest first. come up with me."]
    questOffer.aksel-the-golem-forest: ["come up to the Forest of Coke Golem. thirty Ice Golems. i'll watch how you hit. it'll tell me more than talking. most things do."]
    questAccept.aksel-the-golem-forest: ["out the east end, up all four valleys. the forest door's at the far end of the turn, past the Yetis. they ride Coketumps. don't stop for them. it's cold in the forest. colder than here. yes. that's possible."]
    questWaiting.aksel-the-golem-forest: ["thirty."]
    questComplete.aksel-the-golem-forest: ["thirty. you hit like you mean it, and then you stop. good. most people don't stop. i'd walk with you."]
    questOffer.aksel-the-sled-in-the-ice: ["there's a golem at the back of the forest bigger than the rest. it's grown round something long, with a curl at the front. i thought it was a branch for years. it's a sled runner. help me thin the others, twenty-five of them, and we'll break it free. then i want Marit to see it. i think it's her brother's."]
    questAccept.aksel-the-sled-in-the-ice: ["the Forest of Coke Golem, past the Yetis at the turn. the big one keeps to the back. we clear the rest, then we take it apart. carefully. then Marit, down in town."]
    questWaiting.aksel-the-sled-in-the-ice: ["twenty-five. then the big one. then Marit."]
    questComplete.aksel-the-sled-in-the-ice: ["she knew it at once. his name burnt in the runner. ...i've walked past that golem nine winters. i should have looked closer, sooner. thank you for coming up."]
    questOffer.aksel-the-third-valley: ["the Coke Golems block the path in the third valley. they're sweet and they're stubborn. thirty of them. there's a cloak in it for you. Nell got it from Henesys for me. too small. everything is."]
    questAccept.aksel-the-third-valley: ["up the valley to the third one. the golems there are brown and they sweat. don't lick your axe."]
    questWaiting.aksel-the-third-valley: ["thirty. the path's still shut."]
    questComplete.aksel-the-third-valley: ["thirty. the path's open. here. a cloak for the wind. every safe scroll it would take, every one took. wear it with the collar up."]
    questOffer.aksel-the-clear-ice: ["the Ice Golems' ice is the clearest there is. thirty of them, and fifteen blocks of it. Nell sends it down to Henesys, and something better comes back. this time, a better cloak. it'll be yours."]
    questAccept.aksel-the-clear-ice: ["the forest at the top, past the Yetis at the turn. keep the blocks out of the sun. there isn't any sun. keep them out of it anyway."]
    questWaiting.aksel-the-clear-ice: ["fifteen blocks."]
    questComplete.aksel-the-clear-ice: ["fifteen. clear as water. here, the cloak. scrolled at sixty, every one took. it keeps the wind off. mine's the same. bigger."]
    questOffer.aksel-the-whole-valley: ["the Yetis at the valley's turn ride Coketumps into anybody coming up the path. thirty of them. then twenty Ice Golems, for the walk home. the best cloak i can get you. it's for somebody who's walked the whole valley with me."]
    questAccept.aksel-the-whole-valley: ["the fourth valley, where it turns, and then the forest above it. the yetis are fast. the stumps they ride are faster. watch the stumps."]
    questWaiting.aksel-the-whole-valley: ["thirty, and twenty. the whole valley."]
    questComplete.aksel-the-whole-valley: ["thirty, and twenty. here. the best cloak i've ever been able to get. two tens and the rest at sixty, every one took. you've walked the whole valley with me. nobody has, before."]
    questOffer.aksel-ice-for-nell: ["ten blocks of golem ice? Nell keeps the honey cold in it."]
    questAccept.aksel-ice-for-nell: ["the forest at the top, past the Yetis. or the turtles lower down, if you're not fussy. Nell's fussy."]
    questWaiting.aksel-ice-for-nell: ["ten."]
    questComplete.aksel-ice-for-nell: ["ten. Nell says thank you. she says it with cocoa."]
    about.marit: ["Marit nods at me in the street. i come down from the forest with ice in my beard and most people cross the road. she nods. i like her."]
    about.toivo: ["Toivo wants me to teach balance at the Ski Camp. i stand still. that's all balance is. he says it's not that simple. it is."]
    about.inga: ["Inga's knitting me a hat. she measures my head with her eyes every time i pass. it's been a year. i think the hat is very big now."]
    about.nils: ["Nils follows me to the valley gate and no further. i told him no further. he's good at no further. he says it out loud, every step."]
    about.bartolo: ["Bartolo wanted a lid from the forest. i found one in a block of ice and brought it down as it was. he cried. i didn't know what to do. i left."]
    about.ylva: ["Ylva watches the valley's turn. if she's there, i don't look behind me. i've never needed to."]
    aboutUnknown: ["never met them."]
    friend.close: ["you can have the wind side. i'll take the other. that's a big thing, for me."]
    friend.best: ["if you're ever up the valley and it goes bad, shout. i'll hear. i always hear. i don't always answer. i'll answer you."]
    famed: ["they say your name at Nell's. good things. i listened."]
    defamed: ["i heard. i don't say much. this time i said something."]
    gift: ["hm. thank you."]
    gift.favorite: ["that'll come up the valley with me. that's a good one. thank you."]
    gift.again: ["one. i've got to carry it up."]

- id: ylva
  name: Ylva
  look: { gender: female }
  title: "Archer of the Coke Valley"
  job: HUNTER
  level: { min: 58, max: 60 }
