  questLines: [mirelle-feathers-for-a-brim, mirelle-the-kentaurus-crest, mirelle-the-cornian-pads, mirelle-the-dragon-crown, mirelle-feather-bundles]
  relationships:
    - { persona: hessa, kind: OLD_FRIEND }
    - { persona: arlo, kind: PUTS_OFF }
  giftItemIds: [4000238, 4000232]
  dialogue:
    greetFirst: ["oh, look at your head. no, don't touch it. it's not your fault. it's whoever made that hat.", "a traveller with a bare head in dragon country. come here. let me look at you."]
    greet: ["hello, love. your hat's crooked. it's always crooked.", "back again. let me see the brim. hm. hm."]
    idle: ["(turns a half-finished hat on one finger, frowning at the brim)", "(pins a long red feather into a hatband, takes it out, pins it again an inch to the left)"]
    noWork: ["nothing on the block today. i'm resting my hands. they don't like it."]
    nothingDue: ["nothing owed, love."]
    who: ["Mirelle. i make hats. for halflings, mostly, and for the big folk who come to fight the dragons' leftovers. a good hat keeps your wits in."]
    bye: ["keep your hat on in the canyon. the wyverns go for heads."]
    thanks: ["oh, you're a love."]
    smallTalk: ["a hat for a halfling is a little hat. a hat for a big adventurer is a little hat on a big head. you'd be surprised how many get that wrong.", "Hessa and i were girls together. i made her a bonnet the year of the fire. she says it still fits. it doesn't. she's lying to be kind."]
    speakPlainly: ["plainly: hats. good ones."]
    questOffer.mirelle-feathers-for-a-brim: ["i need feathers that hold their shape in the wind. the harps in the first sky nest have the stiffest tails in the world. twenty-five harps, fifteen tail feathers?"]
    questAccept.mirelle-feathers-for-a-brim: ["the entrance to the sky nest and the first nest past it. they scream before they dive. you'll hear them."]
    questWaiting.mirelle-feathers-for-a-brim: ["fifteen feathers, love. the stiff ones."]
    questComplete.mirelle-feathers-for-a-brim: ["oh, lovely. look at them stand up. i'll have a brim out of these by morning."]
    questOffer.mirelle-the-kentaurus-crest: ["i'll make you a proper helmet. the red kentaurus carry a little flame in them that never goes out. thirty of them, fifteen flames, and i'll set one in a crest for you."]
    questAccept.mirelle-the-kentaurus-crest: ["the red kentaurus field and the battlefields beside it. they'll set you alight if you let them. don't let them."]
    questWaiting.mirelle-the-kentaurus-crest: ["fifteen flames. the crest's empty and it looks it."]
    questComplete.mirelle-the-kentaurus-crest: ["there. cut to your head, every scroll took. the flame's in the crest. you'll feel it when it's cold out."]
    questOffer.mirelle-the-cornian-pads: ["the next one wants padding, and the green cornians in the burning forest wear the best wooden shoulder pads there are. thirty of them, fifteen pads. i'll line the crown with them."]
    questAccept.mirelle-the-cornian-pads: ["the burning forest, past the dragon forest. it's on fire. it's always on fire. it doesn't seem to mind."]
    questWaiting.mirelle-the-cornian-pads: ["fifteen pads. the crown wants lining."]
    questComplete.mirelle-the-cornian-pads: ["there. fitted to your head, every scroll took. light, isn't it? wood's light. people forget."]
    questOffer.mirelle-the-dragon-crown: ["one more, and it's the best i'll ever make. the skelegons in the nest of the dead dragon were dragons once. thirty of them, fifteen broken horns. i'll make you a crown fit for what they were."]
    questAccept.mirelle-the-dragon-crown: ["the nest of the dead dragon, past the canyon. go with respect. they were somebody's."]
    questWaiting.mirelle-the-dragon-crown: ["fifteen horns. i've cleared the block for it. i've never cleared the block."]
    questComplete.mirelle-the-dragon-crown: ["there. made for you and no one else, two tens and the rest sixties, every one took. the horns are in the crown. wear it like they'd want."]
    questOffer.mirelle-feather-bundles: ["fifteen harp tail feathers, love? i go through them like nothing."]
    questAccept.mirelle-feather-bundles: ["the first sky nest."]
    questWaiting.mirelle-feather-bundles: ["fifteen. stiff ones."]
    questComplete.mirelle-feather-bundles: ["lovely. that's a week of brims."]
    about.hessa: ["Hessa and i have taken tea every week since we were girls. i hold the cup when her hands are full. they're often full."]
    about.arlo: ["Arlo wants a riding cap. with flaps. i've told him when he's taller. i'll make it the day he's taller. i've already cut the felt."]
    about.dovan: ["Dovan does boots. i do hats. between us we've got everyone covered except the middle. the middle can see to itself."]
    aboutUnknown: ["never made them a hat, love. i'd remember the head."]
    friend.close: ["i've got your head measured in my book. that's a list i keep very short."]
    friend.best: ["if i ever make a hat for a dragon rider, it'll be for Arlo. the second one's for you."]
    famed: ["they're talking about you in the store. i said i'd made you a hat. i haven't. i will."]
    defamed: ["they're saying things, love. hold your head up. that's what hats are for."]
    gift: ["oh, thank you, love."]
    gift.favorite: ["oh, that's just what i needed. you've got an eye."]
    gift.again: ["you've given me plenty for one day, love."]

- id: dovan
  name: Dovan
  look: { gender: male }
  title: "Cobbler of Wyvern Hide"
  job: BEGINNER
  level: { min: 38, max: 38 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: leafre
    routine:
      - { from: 7, to: 13, spot: "venue:lower-east-street-2", activity: LINGER }
      - { from: 13, to: 14, spot: "venue:lower-west-street", activity: REST }
      - { from: 14, to: 20, spot: "venue:lower-east-street-2", activity: LINGER }
      - { from: 20, to: 23, spot: "venue:free-market-entrance", activity: SOCIALIZE }
      - { from: 23, to: 7, materialize: false }
  recruitable: false
  knows: [dragon forest, rexton, dark wyvern]
  questLines: [dovan-turtle-soles, dovan-rexton-leather, dovan-wyvern-hobnails, dovan-old-bones, dovan-shell-buckets]
  relationships:
    - { persona: runa, kind: MAKES_BOOTS_FOR }
    - { persona: hessa, kind: MENDED_THE_BASKET_FOR }
  giftItemIds: [4000264, 4000021]
  dialogue:
    greetFirst: ["what size? don't tell me. i'll look. ...as i thought. you've been walking on the wrong boots for years.", "stand still. let me see how you stand. that's a cobbler's hello."]
    greet: ["you're back. how are the feet?", "boots holding? good."]
    idle: ["(taps a row of tiny nails into a boot heel without looking at his hammer)", "(holds a strip of scaly hide up to the light and bends it, listening to it creak)"]
    noWork: ["nothing on the last today. go walk on something. come back when it's worn."]
    nothingDue: ["you owe me nothing."]
    who: ["Dovan. cobbler. turtle shell for soles, rexton for uppers, wyvern for nails. a boot that's walked the canyon road has earned its name."]
    bye: ["walk on the outside of your feet in the canyon. the stones roll."]
    thanks: ["mm. good."]
    smallTalk: ["a halfling wears out a boot a year. an adventurer wears out a boot a month. a dragon never wore a boot in its life and look how far it got.", "Runa's walked off two cliffs in my boots. the boots were fine."]
    speakPlainly: ["plainly: soles, uppers, nails."]
    questOffer.dovan-turtle-soles: ["soles first. the blue dragon turtles at the forest's edge shed shell that's hard as stone and lighter than bark. thirty of them, fifteen cracked shells?"]
    questAccept.dovan-turtle-soles: ["the entrance to the dragon forest and the first stretch in. they're slow. don't stand in front of them anyway."]
    questWaiting.dovan-turtle-soles: ["fifteen shells. i've no soles to speak of."]
    questComplete.dovan-turtle-soles: ["fifteen. good shell. that's a winter of soles."]
    questOffer.dovan-rexton-leather: ["now a proper pair for you. rexton hide, from the second dragon forest. thirty of them, fifteen pieces of leather. i'll cut the uppers to your foot."]
    questAccept.dovan-rexton-leather: ["the second dragon forest. the rextons charge with their heads down. so step sideways."]
    questWaiting.dovan-rexton-leather: ["fifteen hides. the last's waiting."]
    questComplete.dovan-rexton-leather: ["there. cut to your stride, every scroll took. walk in them. ...see? quiet. that's good leather."]
    questOffer.dovan-wyvern-hobnails: ["the next pair wants nails that bite rock. dark wyvern toenails. the canyon's east and west roads. thirty of them, fifteen nails."]
    questAccept.dovan-wyvern-hobnails: ["the canyon roads, east and west. they're the angry ones. you'll know."]
    questWaiting.dovan-wyvern-hobnails: ["fifteen toenails. i've nothing to nail with."]
    questComplete.dovan-wyvern-hobnails: ["there. soled for the canyon, every scroll took. you'll walk up a wall in those. don't."]
    questOffer.dovan-old-bones: ["the last pair. the best i'll make. the skelosaurus in the dead dragon's nest have neck bones you could build a house on. thirty of them, fifteen bones. i'll make the frame."]
    questAccept.dovan-old-bones: ["the nest of the dead dragon, the nest left behind, the peak. they're old and they're angry about it."]
    questWaiting.dovan-old-bones: ["fifteen bones. i've cleared the bench."]
    questComplete.dovan-old-bones: ["there. built to your feet and nobody else's, two tens and the rest sixties, every one took. they'll outlast you. i say that to everyone. this time it's true."]
    questOffer.dovan-shell-buckets: ["fifteen cracked shells? soles don't grow on trees. they grow on turtles."]
    questAccept.dovan-shell-buckets: ["the dragon forest entrance."]
    questWaiting.dovan-shell-buckets: ["fifteen."]
    questComplete.dovan-shell-buckets: ["fifteen. good."]
    about.runa: ["Runa walks through boots like nobody i've met. i've started making hers with spare heels built in. she hasn't noticed. she will."]
    about.hessa: ["i mended Hessa's basket handle. she didn't say what's inside. i didn't ask. some things you carry, you don't explain."]
    about.mirelle: ["Mirelle makes hats. we've agreed never to make each other's things. it's kept us friends forty years."]
    aboutUnknown: ["never seen their feet."]
    friend.close: ["i've got your last on the shelf. the wooden foot. it's next to mine. i don't do that for everyone."]
    friend.best: ["i'll cobble for you till my hands give out. after that, i'll tell you who's good."]
    famed: ["heard good things about you. your boots will be pleased."]
    defamed: ["heard less good things. mind where you walk."]
    gift: ["mm. thanks."]
    gift.favorite: ["oh, that's useful. that's going straight on the bench."]
    gift.again: ["one a day. i'm a simple man."]

- id: elsk
  name: Elsk
  look: { gender: male }
  title: "Porter of the Orbis Ship"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: leafre
    routine:
      - { from: 5, to: 12, spot: "venue:station-entrance", activity: LINGER }
      - { from: 12, to: 14, spot: "venue:lower-central-street-2", activity: REST }
      - { from: 14, to: 21, spot: "venue:station-entrance", activity: LINGER }
      - { from: 21, to: 5, materialize: false }
  recruitable: false
  knows: [leafre, orbis, green hobi]
  questLines: [elsk-a-letter-for-corliss, elsk-fruit-for-the-crossing, elsk-a-charm-for-the-crossing]
  relationships:
    - { persona: corliss, kind: WRITES_TO }
    - { persona: arlo, kind: PUT_UPON_BY }
  giftItemIds: [4000227, 2022001]
  dialogue:
    greetFirst: ["off the Orbis ship? you'll want the village down the steps. or the forest. or the dragons. everyone wants the dragons.", "bags? no bags. good. i carry bags. i don't carry adventurers. i've been asked."]
    greet: ["ship's late.", "you again. ship's late again."]
    idle: ["(counts the crates by the station door, then counts them again)", "(squints at the sky toward Orbis, waiting for a sail)"]
    noWork: ["nothing to carry. the ship's late. it's always late."]
    nothingDue: ["we're square."]
    who: ["Elsk. i carry for the Orbis ship. crates down, crates up. i've carried a lot of things for a lot of people. never an egg. Hessa never let anyone."]
    bye: ["mind the station steps. they're steeper going down."]
    thanks: ["mm. good."]
    smallTalk: ["Corliss in Orbis keeps a ledger of every soul who comes up on the ship. i keep a ledger of every crate. we write each other. we compare.", "the Arlo boy asks me every day if a dragon rider came off the ship. i say no. i mean no. i've stopped saying 'yet'."]
    speakPlainly: ["plainly: crates and a late ship."]
    questOffer.elsk-a-letter-for-corliss: ["i've a letter for Corliss at the Orbis station. the crate counts don't match his passenger counts and one of us is wrong. take it over, would you? ask him to write back."]
    questAccept.elsk-a-letter-for-corliss: ["the ship to Orbis. Corliss stands at the station door. he'll ask your name. he asks everyone."]
    questWaiting.elsk-a-letter-for-corliss: ["did Corliss write back? he always writes back. it takes him a while to be sure."]
    questComplete.elsk-a-letter-for-corliss: ["he's counted a crate as a passenger. a crate of chickens. ...that's fair, actually. i'll let it stand."]
    questOffer.elsk-fruit-for-the-crossing: ["the ship's crew like fruit for the crossing. the rashes in the west forest drop tree fruit the size of your fist. twenty-five of them, fifteen fruit?"]
    questAccept.elsk-fruit-for-the-crossing: ["the west forest and the peach monkey forest. mind the ones that look asleep."]
    questWaiting.elsk-fruit-for-the-crossing: ["fifteen fruit. the crew's getting grumpy."]
    questComplete.elsk-fruit-for-the-crossing: ["fifteen. the crew will sing all the way to Orbis. they sing badly."]
    questOffer.elsk-a-charm-for-the-crossing: ["the sailors want charms against the long drop. the green hobis carry little pin charms. twenty-five hobis, fifteen charms. sailors are superstitious. so am i. don't tell them."]
    questAccept.elsk-a-charm-for-the-crossing: ["the west border and the steep hill. the green ones."]
    questWaiting.elsk-a-charm-for-the-crossing: ["fifteen charms. the sailors keep looking over the side."]
    questComplete.elsk-a-charm-for-the-crossing: ["fifteen. one for every sailor and one for the ship. and one for me."]
    about.corliss: ["Corliss in Orbis. we've written each other nine years. i've never met him. i think i'd know him by his handwriting."]
    about.arlo: ["Arlo. every day. 'did a rider come?' every day i say no. he says that means the first one's still coming. i've no answer to that."]
    about.hessa: ["Hessa asks me who came over on the ship. nobody comes for her. she asks anyway. i've started making someone up. a merchant. a nice one."]
    aboutUnknown: ["never came off my ship."]
    friend.close: ["i'd carry for you. i don't carry for adventurers. i'd carry for you."]
    friend.best: ["if you ever come off that ship and i'm not at the door, something's wrong with me. come and find me."]
    famed: ["heard about you on the ship."]
    defamed: ["heard about you on the ship. not the good bits."]
    gift: ["mm. thanks."]
    gift.favorite: ["oh. that's one for the crossing. good."]
    gift.again: ["one a day. i've a ledger for that too."]
