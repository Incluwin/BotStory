# Aquarium cast (Regional Residents wave 3, docs/REGIONAL_RESIDENTS_PLAN.md section 9): 7 Residents, 2 recruitable.
# Aquarium's town map is a swim map the nav graph cannot walk, so its Residents live in the Center Hall
# (aquarium-hall) and the Department Store (aquarium-store). An old diver has watched a light burning in the Grave of a
# Wrecked Ship for twenty years (arcs/aquarium.yaml); the lantern belongs to a sailor from Singapore's Boat Quay
# (arcs/singapore.yaml). Two recruits carry the third tier of the staff and crossbow lines, earned in the deep sea.
