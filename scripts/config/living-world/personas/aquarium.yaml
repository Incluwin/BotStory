  giftItemIds: [2000004, 2020004]
  dialogue:
    greetFirst: ["sit, sit. you've got the sea in your hair. everybody in Aquarium does. some of us have it in our knees.", "a new face. welcome down. it's wetter than it looks. it looks very wet."]
    greet: ["you.", "sit a minute.", "tide's in. so's my back."]
    idle: ["(polishes the brass faceplate of an old diving helmet resting on his knee)", "(stares at the floor as if he can see straight through it to the deep)"]
    noWork: ["nothing today. the sea's quiet. my knees aren't."]
    nothingDue: ["nothing owed. the sea keeps the accounts."]
    who: ["Delmar. i dove the Aqua Road for forty years. salvage, mostly. wrecks. now my knees won't take the deep, so i sit in the hall and tell the young ones where the good wrecks are. they don't listen. i didn't."]
    bye: ["mind the deep."]
    thanks: ["right. thank you."]
    smallTalk: ["the freezers in the red coral forest have the warmest seal skin on the road. my old suit's patched with it. it still leaks. less.", "there's a wreck at the bottom of the road. the Grave, they call it. the sharks keep it. i went down once. i came up quick."]
    speakPlainly: ["plainly: an old diver with bad knees."]
    questOffer.delmar-the-diving-suit: ["my old diving suit's split at the seams. the freezers in the red coral forest carry seal skin. twenty-five of them, ten skins. i'm not going down in it. i'd just like it whole."]
    questAccept.delmar-the-diving-suit: ["out the hall, down the Aqua Road to the red coral forest. they're cold. that's their name."]
    questWaiting.delmar-the-diving-suit: ["ten skins. the suit's in a heap."]
    questComplete.delmar-the-diving-suit: ["ten. whole again. i'll hang it by the door. here. for the swim."]
    questOffer.delmar-the-glass: ["there's something i've never told anyone. the sparkers on the turban shell hill get in the way of it. twenty of them. then come back to the west sea fork and look down into the deep. tell me what you see."]
    questAccept.delmar-the-glass: ["out to the west sea fork, right outside the hall, and the turban shell hill past it. the hill first. then the fork. look down. right down."]
    questWaiting.delmar-the-glass: ["did you look? what did you see?"]
    questComplete.delmar-the-glass: ["a light. you saw it too. it's been burning in the Grave for twenty years. i thought i'd dreamed it. thank you. i'm not mad. that's a relief, at my age."]
    questOffer.delmar-the-wreck-lantern: ["the light in the Grave is a ship's lantern. i'm sure of it now. the sharks and the cold sharks keep the wreck. twenty sharks, ten cold sharks, and bring the lantern up. i want to know whose it is."]
    questAccept.delmar-the-wreck-lantern: ["the Grave of a Wrecked Ship, at the bottom of the road. the sharks will come. the cold ones come slower. don't stop to look at them."]
    questWaiting.delmar-the-wreck-lantern: ["twenty and ten, and the lantern. it's still lit. i can see it from here. no, i can't. i can."]
    questComplete.delmar-the-wreck-lantern: ["it's still lit. after twenty years. there's a name scratched on the handle. Halim. and a place. Boat Quay. somebody's waiting for this. here. you've earned that and more."]
    about.ambrose: ["Ambrose knows the name of every fish in the sea. i know where they live. we argue about which is more use."]
    about.finn: ["Finn wants to see a shark. i tell him about the Grave. he wants to see a shark more."]
    about.rosnah: ["never heard the name."]
    aboutUnknown: ["never dove with them."]
    friend.close: ["you can borrow my old helmet. don't take it deep. it leaks."]
    friend.best: ["if my knees ever let me down the road again, you're the one i'd dive with."]
    famed: ["the hall talks about you. the fish too, probably."]
    defamed: ["talk. the sea's louder."]
    gift: ["hm. thank you."]
    gift.favorite: ["oh, now. that's a diver's supper."]
    gift.again: ["one a day. i'm old, not a seal."]

