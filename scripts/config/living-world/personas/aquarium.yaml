  recruitable: false
  knows: [seal skin, sparker, shark]
  questLines: [delmar-the-diving-suit, delmar-the-glass, delmar-the-wreck-lantern]
  arc: delmar-the-lantern-in-the-grave
  rumors: [aqua-the-benches]
  relationships:
    - { persona: ambrose, kind: ARGUES_FISH_WITH }
