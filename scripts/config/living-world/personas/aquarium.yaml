    questWaiting.thalia-dragon-staff: ["ten fins. keep your hands warm."]
    questComplete.thalia-dragon-staff: ["ten. the Dragon Staff. seven sixties, every one took. it's cold to hold. it should be."]
    questOffer.thalia-timeless-aeas-hand: ["the Timeless Aeas Hand. the best staff in the world. it wants the deep's own voice. both of Pianus, in the cave at the bottom of the sea. the left one first, then the right."]
