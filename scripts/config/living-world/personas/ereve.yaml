    questOffer.celandine-collar-starch: ["the cadets' collars want starch. the slimes north of Ellinia leave the best squishy liquid for it. twelve, and every collar in Ereve stands up straight."]
    questAccept.celandine-collar-starch: ["the ferry to Ellinia, then the field up north of it. they bounce. don't let them bounce on you."]
    questWaiting.celandine-collar-starch: ["twelve squishy liquids. the collars are drooping as we speak."]
    questComplete.celandine-collar-starch: ["twelve. look at that collar. it stands up by itself. here, and come by when your own collar needs a hand. it does."]
    questOffer.celandine-thread-from-ellinia: ["Mirabel in Ellinia weaves the only blue thread that holds in sea air. she's had my order for a month. go and ask her nicely. she doesn't like being asked any other way."]
    questAccept.celandine-thread-from-ellinia: ["Ellinia, up in the trees. she weaves on the middle tree most of the day. be patient with her. she's worth it."]
    questWaiting.celandine-thread-from-ellinia: ["did Mirabel send the thread? the fifth emblem's waiting on it."]
    questComplete.celandine-thread-from-ellinia: ["she sent it! and a note. 'the blue holds.' that's all. that's all she ever needs to say. here, for the walk."]
    questOffer.celandine-lining-leaves: ["ten leaves from the dark stumps round Ellinia? the review coats want a green lining."]
    questAccept.celandine-lining-leaves: ["the dark stumps north of Ellinia."]
    questWaiting.celandine-lining-leaves: ["ten leaves."]
    questComplete.celandine-lining-leaves: ["ten. the green holds. thank you."]
    about.isaura: ["Isaura's collar has been crooked since the spring. she reads through every fitting. i've pinned her hem while she turned a page."]
    about.fintan: ["Fintan asked for an apron with pockets for eggs. i measured an egg. it was the strangest fitting i've ever done. it fits beautifully."]
    about.caius: ["Caius wants no buttons that catch the light. i sewed them in black. he checked every one of them in a dark cupboard."]
    about.wynn: ["Wynn's on his fourth pair of trousers this season. i've stopped charging him. i've started charging the bridge."]
    about.aldric: ["Aldric's sword arm is an inch longer than the other. i cut his sleeves to match. he's never noticed."]
    about.linnea: ["Linnea wants pockets for arrows. i keep telling her that's a quiver. she says a quiver doesn't have a flap."]
    about.mirabel: ["Mirabel in Ellinia weaves the best thread in Victoria. we've never met. we send each other notes about selvedges."]
    aboutUnknown: ["never measured them."]
    friend.close: ["bring me anything you've torn. i'll mend it before the knights' coats. don't tell Neinheart."]
    friend.best: ["i've stitched a sixth emblem inside your collar. small. nobody else will see it. it's a needle."]
    famed: ["the knights talk about you at their fittings. i hear everything at a fitting."]
    defamed: ["somebody was talking about you at a fitting. i stuck them with a pin. by accident."]
    gift: ["oh, thank you. i'll put it somewhere i won't sew it into anything."]
    gift.favorite: ["oh, now that's a treat. that's a whole hem's worth of happy."]
    gift.again: ["one a day. i can't sew with sticky fingers."]

