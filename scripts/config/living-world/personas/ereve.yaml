  name: Fintan
  look: { gender: male }
  title: "Groom of Kiridu's Hatchery"
  job: BEGINNER
  level: { min: 14, max: 16 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: ereve
    routine:
      - { from: 6, to: 9, spot: "venue:by-shinsoo", activity: LINGER }
      - { from: 9, to: 17, materialize: false }
      - { from: 17, to: 21, spot: "venue:by-shinsoo", activity: SOCIALIZE }
      - { from: 21, to: 6, materialize: false }
  recruitable: false
  knows: [kiridu's hatchery, tiguru, tiv's feather]
  questLines: [fintan-nest-feathers, fintan-the-hatchery-path]
  relationships:
    - { persona: isaura, kind: BORROWS_BOOKS_FROM }
    - { persona: wynn, kind: IS_PESTERED_BY }
  giftItemIds: [2010000, 2010003]
  dialogue:
    greetFirst: ["oh, hello. sorry, there's straw on me. there's always straw on me.", "hello. quietly, if you don't mind. i've got an egg in my coat."]
    greet: ["hello.", "oh, it's you. hello.", "hello. the chicks are well, since you didn't ask. everybody forgets to ask."]
    idle: ["(holds an egg up to the light and turns it very slowly)", "(picks straw out of his sleeve one piece at a time and puts each piece in his pocket)"]
    noWork: ["nothing today. the hatchery's quiet. quiet's good for eggs."]
    nothingDue: ["nothing owed. Kiridu says that about the chicks too. they're square with the world."]
    who: ["Fintan. i groom at Kiridu's hatchery, past the Training Forests. the knights' mounts start as eggs there. somebody has to keep them warm. i'm good at warm."]
    bye: ["walk soft near the nests."]
    thanks: ["oh. thank you."]
    smallTalk: ["the Tivs in the first forest drop the softest feathers in Ereve. the chicks sleep better on them. so would i.", "i come up to Shinsoo every morning and every evening and tell him how the chicks are. he listens. he's the only one who asks."]
    speakPlainly: ["plainly: eggs, and straw."]
    questOffer.fintan-nest-feathers: ["the new nests want lining. Tiv feathers are the softest thing on the island. ten would do. the Tivs are in Training Forest I and Tiv's Forest."]
    questAccept.fintan-nest-feathers: ["Training Forest I. the round ones. they don't mind losing a feather. i asked."]
    questWaiting.fintan-nest-feathers: ["ten feathers. the eggs are patient. i'm less patient."]
    questComplete.fintan-nest-feathers: ["oh, these are soft. the chicks will sleep all night. here. Kiridu says to say thank you properly. thank you properly."]
    questOffer.fintan-the-hatchery-path: ["the Tigurus have come right up to the hatchery door. they frighten the chicks off their feed. twenty Tigurus in the third forest, and then look in on the hatchery for me, would you? tell me it's quiet."]
    questAccept.fintan-the-hatchery-path: ["Training Forest III, and Tiguru's Forest past it. the hatchery's just off the third forest. go in softly."]
    questWaiting.fintan-the-hatchery-path: ["twenty Tigurus, and a look in at the hatchery. is it quiet?"]
    questComplete.fintan-the-hatchery-path: ["quiet? good. the chicks ate everything this morning. Kiridu smiled. he doesn't, much. here, from both of us."]
    about.isaura: ["Isaura lends me books about birds. i read them to the eggs. she says nobody's ever read to an egg before. i think that's sad."]
    about.celandine: ["Celandine made me an apron with pockets the right size for eggs. she measured an egg to do it."]
    about.caius: ["Caius walks past the hatchery at night and never wakes a chick. i don't know how. i wake them breathing."]
    about.wynn: ["Wynn asks me every day when he'll get a mount. i tell him when he's stopped falling off the bridge. he asks again the next day."]
    about.aldric: ["Aldric's loud. the chicks like him anyway. they like loud things that are kind."]
    about.linnea: ["Linnea brings the chicks the feathers she can't fletch. she won't say so. i know her feathers."]
    about.oda: ["the station master at Ellinia shouts at the ferry when it's late. i sent a feather once. it came back stamped."]
    aboutUnknown: ["i don't know them. i mostly know eggs."]
    friend.close: ["you can come into the hatchery any time. the chicks know your step now."]
    friend.best: ["Kiridu let me name a chick. i named it after you. it's very loud. it's my favourite."]
    famed: ["the knights talk about you at the hatchery fence. kindly. the chicks listen too."]
    defamed: ["i heard someone say something about you. i didn't believe it. the chicks didn't either."]
    gift: ["oh. for me? thank you."]
    gift.favorite: ["oh, that's lovely. i'll share it. half for me, half for whoever's hatching."]
    gift.again: ["one a day's plenty. the chicks will think i'm spoiled."]

