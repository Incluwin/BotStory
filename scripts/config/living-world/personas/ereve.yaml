    questOffer.wynn-the-octopus-hold: ["Hawkeye says i need to learn to hold on when something holds on to me. the octopuses on the construction site north of Kerning hold on to everything. twenty-five of them. show me how?"]
    questAccept.wynn-the-octopus-hold: ["the ferry to Ellinia, then across to the construction site north of Kerning City, and the top of it. they wiggle!"]
    questWaiting.wynn-the-octopus-hold: ["twenty-five! they're very wiggly. you can do it."]
    questComplete.wynn-the-octopus-hold: ["twenty-five! okay. so you don't hold on. you let go first. that's the trick? that's the trick! here, my whole week's pocket money. no, take it."]
    questOffer.wynn-kitchen-duty: ["kitchen duty. the knights' cook wants green mushroom caps for the stew. twelve. i can't leave the pot or it boils over. it boils over anyway. please?"]
    questAccept.wynn-kitchen-duty: ["the tree that grew, north of Ellinia, the third one up. or the rocky mountain west of Perion. the green ones. they're grumpy."]
    questWaiting.wynn-kitchen-duty: ["twelve caps. the pot's boiling over. i'm stirring!"]
    questComplete.wynn-kitchen-duty: ["twelve! the stew's saved! the cook nearly smiled. nearly! here. it's not stew. the stew's for the knights."]
    about.caius: ["Caius is the best Night Walker in Ereve. he can walk right past me and i don't even know. i follow him around to learn how. he always knows."]
    about.fintan: ["Fintan says i get a mount when i stop falling off the bridge. i've only fallen off twice this week!"]
    about.celandine: ["Celandine sews my trousers. she says i owe her a bridge. i don't know what that means."]
    about.isaura: ["Isaura looks at me like i owe her a book. i've never borrowed a book! ...should i?"]
    about.aldric: ["Aldric drills by Mihile in the mornings with me. he's so loud. i want to be that loud."]
    about.linnea: ["Linnea laughs when i fall off the bridge. she always checks i'm all right first. then she laughs."]
    aboutUnknown: ["don't know them! should i?"]
    friend.close: ["you can drill with me any morning! i'll show you my thunder. it's mostly noise."]
    friend.best: ["when i get my mount, you can ride it first. after me. no, before me. you first."]
    famed: ["everyone's talking about you! i told them i know you! i do know you!"]
    defamed: ["somebody said a bad thing about you. i punched the air at them. near them. at the air near them."]
    gift: ["for me? thanks!"]
    gift.favorite: ["WHOA. that's better than the stew. don't tell the cook."]
    gift.again: ["one a day! Celandine says i'll split my trousers."]
