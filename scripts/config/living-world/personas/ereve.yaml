  giftItemIds: [2020002, 2010004]
  dialogue:
    greetFirst: ["stand still. no, still. ...there. hello. you're wider in the shoulder than you look.", "hello. that seam is coming apart under your arm. no, the other arm. i can see it from here."]
    greet: ["hello. stand up straight.", "you. your hem's down.", "hello again. hold still a moment."]
    idle: ["(talks around a mouthful of pins, to nobody, and nods at the answer)", "(turns a cadet's coat inside out and frowns at the collar)"]
    noWork: ["nothing today. every coat in Ereve is hemmed. i'll find one that isn't."]
