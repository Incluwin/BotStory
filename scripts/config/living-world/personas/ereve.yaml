    greetFirst: ["hi! are you a knight? you look like a knight. i'm going to be one. a Thunder Breaker. i'm nearly one.", "whoa, a new face! watch this. ...okay, that usually works. hi!"]
    greet: ["hey!", "you're back! i nearly didn't fall off the bridge today.", "hi! did you hear that? that was me. thunder."]
    idle: ["(punches the air in a fast one-two, overbalances, and catches the railing)", "(checks his knuckle stance in a puddle's reflection, adjusts it, and grins)"]
    noWork: ["nothing today! i'm drilling. Hawkeye says drill till the lightning's bored."]
    nothingDue: ["we're even! i think. are we? we are."]
    who: ["Wynn! Thunder Breaker cadet, first rank. Hawkeye says i hit like a storm. he also says i aim like one."]
    bye: ["see you! i'll be louder by then."]
    thanks: ["thanks! really!"]
    smallTalk: ["Hawkeye says a Thunder Breaker should land a punch the way a wave lands on a beach. all at once. i'm still more of a puddle.", "i'm on kitchen duty in the knights' mess again. i don't know what i did. i think it was the bridge."]
