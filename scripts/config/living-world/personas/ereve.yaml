    bye: ["walk quiet."]
    thanks: ["mm. thanks."]
    smallTalk: ["the tree dungeon north of Ellinia is dark all day. the bubblings in it pop if you breathe wrong. it's where i learned to breathe.", "Eckhart says a Night Walker learns from things that see in the dark. the evil eyes first. then the cold ones. then the stars."]
    speakPlainly: ["plainly: a shadow with a watch to keep."]
    offer: ["fifty bubblings in the dark, counted after you ask, and six thousand. then i'm your shadow for a shift."]
    join: ["lead. i'll be behind you. you won't notice."]
    bench: ["three days. then the Empress's watch wants me back."]
    leave: ["back to the watch."]
    refuse.bond: ["i don't walk beside strangers. i walk behind them."]
    refuse.flags: ["walk the dark with me first. the bubblings in the tree dungeon north of Ellinia. then ask."]
    refuseOwnErrand: ["my own drill first. come and walk it."]
    questOffer.caius-the-quiet-step: ["Eckhart's first drill. the bubblings in the tree dungeon north of Ellinia, or in the subway under Kerning. twenty-five of them, and don't let one see you coming."]
    questAccept.caius-the-quiet-step: ["the tree dungeon north of Ellinia, the fifth room down. or the first line of the Kerning subway. both dark. good."]
    questWaiting.caius-the-quiet-step: ["twenty-five. quietly."]
    questComplete.caius-the-quiet-step: ["twenty-five, and i never heard you once. you'll do. here."]
    questOffer.caius-amethyst-earrings: ["a Night Walker's fire is small and doesn't smoke. axe stump firewood burns clean. thirty axe stumps, twelve bundles of their firewood, and i'll owe you."]
    questAccept.caius-amethyst-earrings: ["the tree dungeon north of Ellinia, the sixth room. or the rocky mountain east of Perion. they swing back."]
    questWaiting.caius-amethyst-earrings: ["twelve bundles. a small fire."]
    questComplete.caius-amethyst-earrings: ["twelve. that keeps the watch warm a month. take these. amethyst. they don't catch the light. the safe scrolls, every one took."]
    questOffer.caius-leaf-earrings: ["Eckhart says learn from what sees in the dark. the evil eyes. the tree dungeon's deepest rooms, or the swamp below Sleepywood. thirty of them, ten tails. a tail tells you where an eye was looking."]
    questAccept.caius-leaf-earrings: ["north of Ellinia, down past the horny mushrooms. or Sleepywood's swamp. they see you before you see them. change that."]
    questWaiting.caius-leaf-earrings: ["ten tails."]
    questComplete.caius-leaf-earrings: ["ten. they never saw you. Leaf Earrings. the sixties, every one took. leaves don't shine."]
    questOffer.caius-celestial-earrings: ["the cold eyes in the dungeon under Sleepywood, the third floor down. thirty of them, twelve tails. after the cold ones, the stars. that's the order."]
    questAccept.caius-celestial-earrings: ["Sleepywood, down the dungeon stairs, past the lupins and the zombie lupins. it's cold. it's meant to be."]
    questWaiting.caius-celestial-earrings: ["twelve tails. the stars aren't going anywhere."]
    questComplete.caius-celestial-earrings: ["twelve. Celestial Earrings. two tens and the rest sixties, every one took. under the stars they look like nothing at all. that's the point."]
    questOffer.caius-clean-firewood: ["ten bundles of axe stump firewood? the watch fire's low."]
    questAccept.caius-clean-firewood: ["the tree dungeon's sixth room."]
    questWaiting.caius-clean-firewood: ["ten."]
    questComplete.caius-clean-firewood: ["ten. no smoke. good."]
    about.wynn: ["Wynn follows me around to learn how to walk quietly. he hums while he does it. i haven't told him."]
    about.isaura: ["Isaura and i read in the library at night. she has a lamp. i don't. we don't talk. it's the best company in Ereve."]
    about.fintan: ["Fintan's hatchery is the only place on the island quieter than me. i go past it to listen."]
    about.celandine: ["Celandine sewed my buttons in black and tested them in a cupboard. she's thorough."]
    about.aldric: ["Aldric swings at the air like it insulted him. maybe it did."]
    about.linnea: ["Linnea sees me on the bridges at night. she's the only one who does. she never says anything. good eyes."]
    aboutUnknown: ["never seen them. that means something."]
    friend.close: ["i'll keep your watch, if you're ever on one. you can sleep."]
    friend.best: ["if you ever need to not be seen, come and find me. i'll teach you. i don't teach anyone."]
    famed: ["they say your name in the knights' hall. i was in the corner. nobody noticed. i agreed."]
    defamed: ["i heard what they said. i know where they sleep. ...that was a joke. mostly."]
    gift: ["mm. thanks."]
    gift.favorite: ["...that's good. that's a whole night watch, that is."]
    gift.again: ["one a day. i travel light."]

