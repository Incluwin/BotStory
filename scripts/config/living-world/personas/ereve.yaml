# ---- Wave 4 (docs/REGIONAL_RESIDENTS_PLAN.md section 10): +5 Residents, 1 recruitable (Caius). Isaura, Fintan and
# Celandine are townsfolk and always here; Caius and Wynn follow CYGNUS_ARAN_CAREERS_ENABLED like Aldric and Linnea.
# Isaura keeps the Empress's record of the five heroes, whose last leaf is blank; Rien remembers what it leaves out
# (arcs/ereve.yaml, arcs/rien.yaml).
- id: isaura
  name: Isaura
  look: { gender: female }
  title: "Archivist of the Empress's Library"
  job: BEGINNER
  level: { min: 24, max: 26 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: ereve
    routine:
      - { from: 8, to: 13, spot: "venue:by-cygnus", activity: LINGER }
      - { from: 13, to: 17, spot: "venue:by-shinsoo", activity: LINGER }
      - { from: 17, to: 21, spot: "venue:by-cygnus", activity: SOCIALIZE }
      - { from: 21, to: 8, materialize: false }
  recruitable: false
  knows: [timu, training forest ii, sky ferry]
  questLines: [isaura-the-overdue-books, isaura-the-blank-page, isaura-in-her-words]
  arc: isaura-the-record-of-the-five
  rumors: [ereve-the-five-emblems]
  relationships:
    - { persona: celandine, kind: IS_MEASURED_BY }
    - { persona: fintan, kind: LENDS_BOOKS_TO }
    - { persona: eira, kind: WRITES_DOWN_THE_WORDS_OF }
  giftItemIds: [2010009, 2001002]
  dialogue:
    greetFirst: ["you're new. the library is that way, the bridges are that way, and the Empress is not to be disturbed before nine.", "hello. if you've come for a book, you'll bring it back. everyone says they will."]
    greet: ["hello again.", "you. good. nobody's borrowed anything today.", "hello. mind the ink, it's wet."]
    idle: ["(turns a brittle leaf with the flat of a paper knife, reads it, and turns it back)", "(copies a line from one book into another, letter by careful letter)"]
    noWork: ["nothing today. the shelves are in order. i'll find something out of order by noon."]
    nothingDue: ["nothing owed. your card is clean."]
    who: ["Isaura. i keep the Empress's library. the oldest thing on my shelf is the record of the five, who fought the Black Mage. its last leaf is blank. i've copied every other word of it twice."]
    bye: ["bring it back."]
    thanks: ["noted, with thanks."]
    smallTalk: ["the record of the five says one of them slept in the ice of Snow Island. then the leaf runs out. the copyist must have had a reason. i'd like to know it.", "the cadets read in the Training Forests between drills. they drop the books when the Timus come. i have found books in nests."]
    speakPlainly: ["plainly: a book with its last leaf blank."]
    questOffer.isaura-the-overdue-books: ["the cadets take books into Training Forest II and drop them when the Timus come at them. twenty-five Timus fewer, and the books might come home on their own."]
    questAccept.isaura-the-overdue-books: ["Training Forest II, and Timu's Forest off it. the books will be in the grass. the Timus will be on the books."]
    questWaiting.isaura-the-overdue-books: ["twenty-five Timus. i've three cards overdue already."]
    questComplete.isaura-the-overdue-books: ["the cadets brought back four books this morning. one had a Timu in it. here, for your trouble."]
    questOffer.isaura-the-blank-page: ["the record of the five ends on a blank leaf. before i write a word on it, i want everything Ereve remembers. ask Celandine about her pattern book, and Fintan about the hatchery's egg-book."]
    questAccept.isaura-the-blank-page: ["Celandine sews by the knights all day. Fintan's at the hatchery, but he comes up to Shinsoo in the mornings and the evenings."]
    questWaiting.isaura-the-blank-page: ["what did they say? exactly, please."]
    questComplete.isaura-the-blank-page: ["a polearm on a field of snow, and 'they went by sea, from the island of snow'. both of them point north. Snow Island. somebody there must remember what my leaf doesn't."]
    questOffer.isaura-in-her-words: ["Eira of Rien has heard my copy read, and she says the end is wrong. she won't write it down. she says it has to be heard. go and hear it, and bring it back to me exactly as she says it."]
    questAccept.isaura-in-her-words: ["the sky ferry to Ellinia, across to Lith Harbor, and the boat to Rien. she sits by the library there. take your time with her. she'll take hers."]
    questWaiting.isaura-in-her-words: ["exactly as she said it. i won't change a word."]
    questComplete.isaura-in-her-words: ["...four went down to the shore, and one went up into the ice, and looked back once. there. it's on the leaf. the record of the five has an ending. thank you. thank her."]
    about.celandine: ["Celandine measures everyone who stands still. she measured me in the library once. i was reading. i didn't notice till she'd pinned the hem."]
    about.fintan: ["Fintan borrows books about birds and reads them to the eggs. he says it helps. the eggs have not complained."]
    about.eira: ["Eira? i don't know the name."]
    about.caius: ["Caius reads in the library at night with no lamp. i've asked him how. he says the dark's easier to read than people think."]
    about.wynn: ["Wynn has never returned a book. he's never borrowed one, either. i keep hoping."]
    about.aldric: ["Aldric borrowed a book of sword forms and brought it back with the corners turned down. every corner."]
    about.linnea: ["Linnea asks for books about Orbis. i give her the ones with pictures. she's never been."]
    about.wren: ["Wren keeps the archive in Ellinia's upper tree. we've written to each other for years about bindings. she's wrong about glue."]
    aboutUnknown: ["not in any record of mine."]
    friend.close: ["you can borrow anything on my shelf. even the ones i don't lend."]
    friend.best: ["i've written your name in the margin of the record of the five. small. at the bottom. i hope you don't mind."]
    famed: ["your name's come up in the knights' reports. i've filed it. favourably."]
    defamed: ["i've heard things said about you. hearsay isn't a record. i don't file hearsay."]
    gift: ["oh. thank you. i'll eat it away from the books."]
    gift.favorite: ["oh, that's lovely. that's a whole afternoon of copying with something nice beside it."]
    gift.again: ["one a day, please. crumbs are bad for bindings."]

