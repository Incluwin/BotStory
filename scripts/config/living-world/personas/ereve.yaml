    questAccept.aldric-tiguru-drill: ["Training Forest III. they hit harder than they look."]
    questWaiting.aldric-tiguru-drill: ["twenty Tigurus. report when it's done."]
    questComplete.aldric-tiguru-drill: ["that's the drill done. you'd pass Mihile's exam, i think. take these, you earned them."]
