    refuse.bond: ["i don't know your blade yet. help with the patrol first."]
    refuse.flags: ["the Tiru patrol comes first. then we talk."]
    refuseOwnErrand: ["that's my own patrol. a knight doesn't take pay for his own duty."]
    restock.go: ["potions. back before you miss me.", "let me resupply. a knight doesn't fight dry."]
    restock.back: ["stocked. let's go.", "back, and well supplied."]
    restock.broke: ["i'm out of {need} and out of mesos. could you spare some? either will do.", "{need} cost more than a squire's pay. help a knight out?"]
    restock.noShop: ["no shop out here and i'm low. careless of me.", "should have stocked up in Ereve."]
    restock.stillShort: ["that helps, but i'm still short on {need}.", "almost. a little more for {need}?"]
    questOffer.aldric-tiru-patrol: ["Training Forest II is overrun with Tirus again. twenty-five fewer and Kimu can teach in peace. walk the patrol with me?"]
    questAccept.aldric-tiru-patrol: ["good. Training Forest II, past the bridge. i'll take the report."]
    questWaiting.aldric-tiru-patrol: ["twenty-five Tirus. the forest won't clear itself."]
    questComplete.aldric-tiru-patrol: ["clean work. Kimu owes you a lesson."]
    questOffer.aldric-tiguru-drill: ["Mihile's drill: twenty Tigurus in Training Forest III, then report to me. it's what every squire does before the knighthood exam."]
    questAccept.aldric-tiguru-drill: ["Training Forest III. they hit harder than they look."]
    questWaiting.aldric-tiguru-drill: ["twenty Tigurus. report when it's done."]
    questComplete.aldric-tiguru-drill: ["that's the drill done. you'd pass Mihile's exam, i think. take these, you earned them."]
    about.linnea: ["Linnea watches the sky ferry like it owes her something. best eyes on the island."]
    about.caius: ["Caius keeps the Empress's watch after dark. i've never once heard him coming. Mihile says that's the point. i say it's rude."]
    about.wynn: ["Wynn drills beside me every morning. he hits like a storm and falls off the bridge like one. he'll make a fine knight, if the bridge lets him."]
    about.isaura: ["Isaura lent me a book of sword forms. i turned the corners down. she hasn't forgiven me."]
    aboutUnknown: ["not someone i've trained with."]

