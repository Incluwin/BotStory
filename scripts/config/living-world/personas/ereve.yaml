  dialogue:
    greetFirst: ["a new face on the island. Mihile will want to see your stance.", "welcome to Ereve. mind the wind on the bridges."]
    greet: ["good to see you.", "back from the forests?", "the Empress keeps early hours. so do i."]
    idle: ["(runs through a sword form)", "dawn comes whether you are ready or not.", "(polishes the soul on his blade)"]
    noWork: ["nothing for you today. train anyway."]
    nothingDue: ["we are square, knight to knight."]
    who: ["Aldric. Dawn Warrior, second rank. Mihile says i swing like i'm angry at the air."]
    bye: ["walk in the light."]
    thanks: ["you have my thanks."]
    smallTalk: ["the Tigurus have been bolder this season.", "Neinheart counts everything twice. it's a gift, apparently."]
