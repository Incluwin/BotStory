  look: { gender: male }
  title: "Polearm Wanderer"
  job: ARAN2
  level: { min: 35, max: 38 }
  strength: SEASONED
  loadout: lith-polearm-l30
  personality: relaxed-v1
  home:
    town: rien
    routine:
      - { from: 6, to: 11, spot: "venue:by-giant-polearm", activity: LINGER }
