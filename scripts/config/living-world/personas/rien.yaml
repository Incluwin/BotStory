  name: Eira
  look: { gender: female }
  title: "Rien's Oldest"
  job: BEGINNER
  level: { min: 30, max: 32 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: rien
    routine:
      - { from: 8, to: 12, spot: "venue:library-1st-floor-door", activity: LINGER }
      - { from: 12, to: 16, spot: "venue:by-lilin", activity: SOCIALIZE }
      - { from: 16, to: 20, spot: "venue:lower-west-street", activity: SOCIALIZE }
      - { from: 20, to: 22, spot: "venue:library-1st-floor-door", activity: REST }
      - { from: 22, to: 8, materialize: false }
  recruitable: false
  knows: [murupia, murupia's furball, snow-covered field 2]
  questLines: [eira-the-hearth-shawl, eira-the-copy-from-ereve, eira-on-rien-shelf]
  arc: eira-the-day-they-left
  rumors: [rien-the-old-story]
  relationships:
    - { persona: saga, kind: TELLS_THE_STORY_TO }
    - { persona: isaura, kind: IS_WRITTEN_DOWN_BY }
    - { persona: torvin, kind: FEEDS_SOUP_TO }
  giftItemIds: [2022001, 2010003]
  dialogue:
    greetFirst: ["come here where i can see you, dear. my eyes are older than the snow. ah. a new face. welcome to Rien.", "sit down a moment. everyone in Rien sits with me a moment. it's a rule. i made it."]
    greet: ["there you are, dear.", "hello, dear. sit.", "ah, you. good. my hands are cold. talk to me while they warm."]
    idle: ["(pulls an old patched shawl closer and hums something with no words)", "(watches the snow come down past the library door as if she were counting it)"]
    noWork: ["nothing today, dear. sit with me instead. that's work enough."]
    nothingDue: ["you owe me nothing, dear. a visit now and then."]
    who: ["Eira. i'm the oldest in Rien. my grandmother told me about the day the heroes left, and her grandmother told her, and so on back to the girl who stood on the shore and watched them go. nobody wrote it down. we don't, here. we tell it."]
    bye: ["mind the ice, dear."]
    thanks: ["bless you, dear."]
    smallTalk: ["grandmother said it was a grey morning when they left. she always started there. she said if you get the weather right, the rest follows.", "the Murupias in the second field have the warmest fur on the island. grandmother's shawl is half Murupia by now. the other half is darning."]
    speakPlainly: ["plainly, dear: an old woman with a story."]
    questOffer.eira-the-hearth-shawl: ["my grandmother's shawl is wearing through at the shoulder. the Murupias in Snow-covered Field 2 shed the warmest fur on the island. twelve tufts, dear, and i'll darn it tonight."]
    questAccept.eira-the-hearth-shawl: ["out past the first field, the second one. they're round and they're grumpy. so am i in the mornings."]
    questWaiting.eira-the-hearth-shawl: ["twelve tufts, dear. my shoulder's cold."]
    questComplete.eira-the-hearth-shawl: ["oh, that's soft. that'll last another winter. so will i, now. here, dear. take this. and come and sit with me sometimes."]
    questOffer.eira-the-copy-from-ereve: ["they say the Empress's people in Ereve keep a book about the heroes. grandmother couldn't read, and neither could hers. bring me what it says, dear. i'll tell you whether it's right."]
    questAccept.eira-the-copy-from-ereve: ["the boat to Lith Harbor, across to Ellinia, and the sky ferry to Ereve. ask for whoever keeps the book. somebody always keeps the book."]
    questWaiting.eira-the-copy-from-ereve: ["have you brought what the book says? read it to me slowly, dear."]
    questComplete.eira-the-copy-from-ereve: ["'and the fifth slept in the ice of Snow Island, and the others...' and then nothing? oh, dear. that's not where it stops. that's not where it stops at all. tell her so. tell her to send somebody who'll listen."]
    questOffer.eira-on-rien-shelf: ["Isaura's written grandmother's words into the Empress's book, and she's bound a copy for Rien. go and fetch it, dear. put it in our library, on the first floor, where people can reach it. then come and tell me it's there."]
    questAccept.eira-on-rien-shelf: ["Ereve, by the boat and the ferry. then back here, and in through the library door. the first floor. not up high. people should be able to reach it."]
    questWaiting.eira-on-rien-shelf: ["is it on the shelf, dear? where people can reach it?"]
    questComplete.eira-on-rien-shelf: ["on the shelf. in grandmother's words. written down, after all this time. ...she'd have laughed. she'd have said nobody needs to read it, they only need to be told. and then she'd have gone in to look at it. here, dear. thank you. thank you."]
    about.saga: ["Saga wants to be a hero. she asks for the story every evening and i tell it every evening. one day she'll tell it, and she'll get it right."]
    about.isaura: ["Isaura? i don't know the name, dear."]
    about.torvin: ["Torvin came out of the ice with no memory and a polearm. i fed him soup till he remembered how to smile. he's still working on the rest."]
    about.tove: ["Tove counts the penguins three times a day and gets a different number every time. the penguins move, dear. that's the trouble with penguins."]
    about.ansgar: ["Ansgar tells everybody everything. if you want the whole island to know a thing, tell Ansgar. if you don't, tell me."]
    about.kjeld: ["Kjeld stands at the edge of the Dangerous Forest all day and looks at the trees. his mother did it before him. it's the same trees."]
    about.brynja: ["Brynja looks at the boat the way grandmother said the four looked at the sea. she'll go. they always go, the ones who look like that."]
    aboutUnknown: ["i don't know them, dear. bring them to sit with me."]
    friend.close: ["you sit with me like family now, dear. i'll tell you the parts i don't tell everyone."]
    friend.best: ["when i'm gone, dear, somebody has to tell it. i'd like it to be you. you and Saga."]
    famed: ["the whole island says your name, dear. i say it too. i say it kindly."]
    defamed: ["people talk, dear. i've been talked about for eighty years. it washes off."]
    gift: ["oh, for me? bless you, dear."]
    gift.favorite: ["oh, that's warm in the belly. that's a long winter evening, that is."]
    gift.again: ["one a day, dear. i'm old, not greedy."]

