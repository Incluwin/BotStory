  giftItemIds: [2010001, 2020001]
  dialogue:
    greetFirst: ["you came on the boat? what's it like at the other end? no, wait, tell me later. hello.", "hello. you've been off the island. i can tell. you don't hunch against the wind."]
    greet: ["hey.", "you. good. tell me something about somewhere else.", "back. was the crossing rough?"]
    idle: ["(runs through a polearm combo, faster each time, and ends facing the dock)", "(watches the boat go out past the fields until it's gone, then looks away)"]
    noWork: ["nothing today. i've done my combos. i've looked at the boat. that's my day."]
    nothingDue: ["we're square."]
    who: ["Brynja. born in Rien, raised in the Giant Polearm's shadow. Maha says i fight like the old stories. every Aran in Rien grows up on those stories. i want to see where they went."]
    bye: ["stay warm. wherever."]
    thanks: ["thanks."]
    smallTalk: ["Rien keeps a chest of warm things for anyone who leaves the island. nobody's opened it in a long time. i've got the key.", "i go over to Victoria on the morning boat and come back on the last. i've never stayed the night. i'm working up to it."]
    speakPlainly: ["plainly: i want off this island."]
    offer: ["fifteen thousand for the road, and i'm yours till it ends. i'll keep the cold off your back. Ansgar will have told you."]
    join: ["finally. lead on. i've been keeping up with the boat for years. i'll keep up with you."]
    bench: ["three days. then i'm back to watching the boat."]
    leave: ["back to Rien. that was the best road i've walked."]
    refuse.bond: ["i don't know you yet. walk somewhere with me first."]
    refuse.flags: ["come by Pusla's of an evening and hear what Ansgar and i say about the boat. then ask me."]
    refuseOwnErrand: ["that's my own walk. you don't pay for that."]
    questOffer.brynja-the-first-shore: ["walk the first shore with me. the boat lands at Lith Harbor, and there's a beach of pigs past the three-way road. twenty-five ribbon pigs. i want to fight something that isn't fluff."]
    questAccept.brynja-the-first-shore: ["the boat to Lith Harbor, then the three-way road and the hidden path down to the beach. they've got ribbons. they're still pigs."]
    questWaiting.brynja-the-first-shore: ["twenty-five. not fluff. pigs."]
    questComplete.brynja-the-first-shore: ["twenty-five. you made it look like walking. i'll get there. here. for the boat fare."]
    questOffer.brynja-ice-jeans: ["Rien's chest has a pair of ice jeans in it. warm all the way down. i'll open it for you if you'll walk the hunting grounds past Henesys with me. thirty green mushrooms. they spin at you."]
    questAccept.brynja-ice-jeans: ["the Henesys hunting grounds, the second and the third. the green ones. they spin."]
    questWaiting.brynja-ice-jeans: ["thirty. let them spin."]
    questComplete.brynja-ice-jeans: ["thirty. here. ice jeans, out of Rien's chest. the safe scrolls, every one took. the cold won't find your knees."]
    questOffer.brynja-old-raggedy-cape: ["the next thing in the chest is a cape. old and raggedy and warmer than anything new. the wild boars east of Perion would tear it to bits. thirty of them, and twelve tusks to stitch the toggles."]
    questAccept.brynja-old-raggedy-cape: ["east of Perion, the far end of the rocky mountain, and the land of wild boar off it. they charge. stand to one side."]
    questWaiting.brynja-old-raggedy-cape: ["twelve tusks. the toggles are waiting."]
    questComplete.brynja-old-raggedy-cape: ["twelve. the old raggedy cape, with boar-tusk toggles. the sixties, every one took. it's older than both of us. it'll outlast us too."]
    questOffer.brynja-cape-of-warmness: ["the last thing in Rien's chest. the cape of warmness. it wants a new lining. the jr. wraiths in Kerning's subway wear tablecloths of real wool. thirty of them, twelve cloths."]
    questAccept.brynja-cape-of-warmness: ["Kerning City, down into the subway, the first and second lines. they're little ghosts. they're cold. their tablecloths aren't."]
    questWaiting.brynja-cape-of-warmness: ["twelve cloths. the chest's open."]
    questComplete.brynja-cape-of-warmness: ["twelve. lined. the cape of warmness, the last thing in Rien's chest. two tens and the rest sixties, every one took. wherever you go now, you'll be warm. that's what Rien gives the ones who leave."]
    questOffer.brynja-boar-tusks: ["ten boar tusks? the chest wants toggles again."]
    questAccept.brynja-boar-tusks: ["east of Perion. stand to one side."]
    questWaiting.brynja-boar-tusks: ["ten."]
    questComplete.brynja-boar-tusks: ["ten. good. thanks."]
    about.ansgar: ["Ansgar tells everybody everything. so when i want everybody to know a thing, i say it in front of him."]
    about.saga: ["Saga follows me to the dock every morning. she says she's guarding me. i let her. somebody should."]
    about.eira: ["Eira tells the story of the heroes leaving. i've heard it a hundred times. it's the only story on this island that ends somewhere else."]
    about.torvin: ["Torvin woke up in the ice and walked into Rien. i've lived here my whole life and never walked out. we swap stories. his are shorter."]
    about.tove: ["Tove's penguins follow me to the dock too. i think they want to go. i think they're like me."]
    about.kjeld: ["Kjeld watches the forest. i watch the boat. we stand back to back on the street some evenings and don't say anything."]
    about.ingrid: ["there's a halberdier at Lith Harbor, Ingrid. she spars with me on the dock while the boat turns round. she's never once let me win. i like her."]
    aboutUnknown: ["never met them. i haven't met most people. i'm working on it."]
    friend.close: ["wherever you go, i'll go. you only have to say."]
    friend.best: ["if you ever take me off this island, i'll keep the cold off your back the whole way."]
    famed: ["even on the boat they're talking about you. i made them start again from the beginning."]
    defamed: ["somebody's saying things. Ansgar will tell me who. then i'll have a word."]
    gift: ["oh. thanks."]
    gift.favorite: ["oh, that's good. that's a warm meal for a cold crossing."]
    gift.again: ["one a day. i'll go soft."]
