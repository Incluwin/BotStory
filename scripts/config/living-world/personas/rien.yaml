  giftItemIds: [2001001, 2020002]
  dialogue:
    greetFirst: ["halt! who goes there! ...a hero? are you a hero? you look like one. i'm going to be one.", "hi! do you want to see my polearm? it's a stick. it's a polearm stick."]
    greet: ["hi! hero practice today?", "you're back! i did forty swings!", "hello! i'm guarding the Giant Polearm. from nobody. but still."]
    idle: ["(swings a stick in a careful circle, the way the polearm fighters do, and nearly falls over)", "(stands very straight next to the Giant Polearm, as if to see who's taller)"]
    noWork: ["nothing today! i'm practising. heroes practise. Grandmother Eira says so."]
    nothingDue: ["you don't owe me anything! heroes don't count."]
    who: ["Saga! i'm going to be a hero. like the ones who left. Grandmother Eira tells me about them every night. she's not my grandmother. she's everybody's."]
    bye: ["bye! be heroic!"]
    thanks: ["thank you! that's heroic!"]
    smallTalk: ["one of the heroes stayed. in the ice. so somebody would be here when the dark came back. i'd have stayed. i'm good at waiting. i'm not. but i'd try.", "Torvin lets me copy his stance. he says mine's better. i think he's being nice. i think mine's better."]
    speakPlainly: ["plainly! hero. future hero. hero in training."]
    questOffer.saga-hero-practice: ["show me how a real hero fights? the Murupas in Snow-covered Field 1 are just outside town. fifteen! i'll watch from the gate. i won't go out. Grandmother Eira made me promise."]
    questAccept.saga-hero-practice: ["out the east side of town, the first field. the round blue ones. i'm watching!"]
    questWaiting.saga-hero-practice: ["fifteen! i'm counting! i've counted three!"]
    questComplete.saga-hero-practice: ["fifteen! you didn't even look scared! how do you not look scared? oh. you practise not looking scared. i'm going to practise that. here, this is all my savings."]
    questOffer.saga-the-heroes-names: ["what were the heroes called? nobody knows! Grandmother Eira knows everything. ask her for me? she says i'm too little for that part. you're not little."]
    questAccept.saga-the-heroes-names: ["she sits by the library in the mornings, and by Lilin after lunch, and with me in the evenings."]
    questWaiting.saga-the-heroes-names: ["what did she say? what were they called?"]
    questComplete.saga-the-heroes-names: ["...whoever goes when somebody has to? so anybody could be one? so i could be one! i'm going to be one. here, this is my best snowball. no, it'll melt. here, this is mesos."]
    about.eira: ["Grandmother Eira's not my grandmother. she's everybody's. she tells the best story in the world. it's true, too."]
    about.tove: ["Tove lets me help count the penguins. i'm better at it. i'm not allowed to say that."]
    about.ansgar: ["Ansgar told the whole island i'm going to be a hero. now everybody calls me hero. i love it. don't tell him."]
    about.kjeld: ["Kjeld always catches me going out to the fields. always! i'm getting quicker."]
    about.brynja: ["Brynja's going to leave the island and be a hero somewhere. i'm guarding her till she goes. then i'm going to be her."]
    about.torvin: ["Torvin came out of the ice like the hero who stayed! he says he isn't. he would say that."]
    aboutUnknown: ["i don't know them! are they a hero?"]
    friend.close: ["you can be my hero teacher. you already are. i decided."]
    friend.best: ["when i'm a hero, i'm going to tell everybody you taught me. first thing."]
    famed: ["everybody says you're a hero! i said it first! i did!"]
    defamed: ["someone said a bad thing about you. i told them heroes don't listen to that. then i stuck my tongue out."]
    gift: ["for me? thank you!"]
    gift.favorite: ["WOW. that's a hero's lunch!"]
    gift.again: ["one a day! Grandmother Eira says."]

