    about.brynja: ["Brynja walks down to the dock every morning and the penguins walk with her. i think they want to go too."]
    about.torvin: ["Torvin's polearm is very tall. the penguins think it's a tree. they sit under it."]
    aboutUnknown: ["don't know them! do they like penguins?"]
    friend.close: ["the penguins know your step now. they come when you come. that's a big thing, for penguins."]
    friend.best: ["i named a chick after you. it's the small one. it's always looking at something. like you."]
    famed: ["the whole island's talking about you! the penguins too! well. squawking."]
    defamed: ["somebody said a mean thing about you. the penguins pecked their boots. i didn't stop them."]
