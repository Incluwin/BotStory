  benchToleranceDays: 3
  paceGap: 2
  relationships:
    - { persona: edda, kind: HUMS_WHILE_EDDA_STITCHES }
    - { persona: thorne, kind: TRUSTS }
    - { persona: lumi, kind: KEEPS_THE_PRESENTS_OF }
    - { persona: delphine, kind: HEARD_OF }
  giftItemIds: [2000006, 2020014]
  dialogue:
    greetFirst: ["oh, a traveller from before! come in out of the ash. have you eaten? you look like you haven't eaten since your own century.", "welcome to Henesys Ruins, dear. it's lovely, if you squint. i squint a great deal."]
    greet: ["hello, dear!", "you're back! and in one piece! i'll bless it anyway.", "hello. you look well. i'll take the credit."]
    idle: ["(hums something that might once have been a hymn, badly, and smiles at it)", "(turns a wand over in her hands and sniffs the end of it, puzzled)"]
    noWork: ["nothing today. nobody's hurt and the sun's out. well. it's somewhere."]
    nothingDue: ["nothing owed, dear. not between us."]
    who: ["Seraphine. i heal the watch when they come off the wall, and i pray for the ruins when they don't. people ask who there is to pray to, at the end of days. i tell them the days haven't ended. that's who."]
    bye: ["go with something good."]
    thanks: ["oh, bless you."]
    smallTalk: ["the wand i carry came from a laboratory in a city of your years. it still smells of smoke. somebody burned a great many ideas with it to see which were good. i heal with it. i think she'd laugh.", "the Eyes of Time on your Temple's roads carry glasses with moments in them. i listen to them when i can get them. a wedding. a market. a dog. it reminds me what we're keeping the wall up for."]
    speakPlainly: ["plainly: a wand, a bad hymn, and the watch."]
    offer: ["a hundred and fifty thousand, and i'll come. you've heard what Thorne says of me. that's the bargain, dear."]
    join: ["lead on, dear. i'll stand where i can reach you."]
    bench: ["three days. then the watch will need me. they always do."]
    leave: ["back to the watch."]
    refuse.bond: ["not yet, dear. i like to know whose back i'm blessing."]
    refuse.flags: ["some evening at the east end of the middle west street, where Thorne comes down off his tower, hear what he says about me. then ask, dear."]
    refuseOwnErrand: ["my hearts first, dear. the blue ones."]
    questOffer.seraphine-hearts-that-hold: ["the chief qualm guardians on the Road of Regrets' fourth stretch carry blue hearts. ground fine, they make a salve that won't fade on a wound. twenty-five chiefs, twelve hearts. Edda and i will be grateful for a month."]
    questAccept.seraphine-hearts-that-hold: ["the Temple Keeper's door, Memory Lane, the Frozen Past, then the Road of Regrets to its fourth stretch. the chiefs are slow to anger. so are we, dear. so are we."]
    questWaiting.seraphine-hearts-that-hold: ["twelve hearts. the mortar's out."]
    questComplete.seraphine-hearts-that-hold: ["twelve. look at that blue. it'll hold on a cut for a week. bless you. you'd do for the watch."]
    questOffer.seraphine-reverse-enreal-tear: ["the Eyes of Time on the Road of Regrets crack glasses full of moments. forty Eyes, fifteen glasses, and then sit a minute in the resting spot off the first stretch and say something kind to nobody. then come back. i've a wand that wants a kinder hand than mine."]
    questAccept.seraphine-reverse-enreal-tear: ["the Road of Regrets, any stretch. the Eyes are everywhere. the resting spot is off the first stretch. sit. say it. you'll feel silly. say it anyway."]
    questWaiting.seraphine-reverse-enreal-tear: ["fifteen glasses, and the kind word. did you say it?"]
    questComplete.seraphine-reverse-enreal-tear: ["you said it? good. listen. ...a market, in the morning. somebody laughing. that's what we're for. the Reverse Enreal Tear. every slot at sixty, every one took. heal with it. it likes it."]
    questOffer.seraphine-timeless-enreal-tear: ["Dark Ereve. the forest where the knights' island used to be. the tiru there are thick as moss. thirty-five of them in the Mutant Tiru Forest, then go on to the forked road and stand a minute. somebody prayed there once. i'd like it prayed at again."]
    questAccept.seraphine-timeless-enreal-tear: ["back out to the Gate to the Future, then east into Dark Ereve: the tino forest, the tiru forest, the forked road beyond. stand at the fork. you'll know where."]
    questWaiting.seraphine-timeless-enreal-tear: ["thirty-five, and the fork. take your time at the fork."]
    questComplete.seraphine-timeless-enreal-tear: ["you stood there? thank you. that's one more prayer than it had. the Timeless Enreal Tear. two tens and the rest at sixty, every one took. it's lighter than it looks. most hope is."]
    questOffer.seraphine-dark-spore-hill: ["the singing mushroom forest, west of the ruins. it used to sing. now it hums, and the mushrooms bite. forty of them on the humming trail below Dark Spore Hill. i'd like to hear it sing again. i'd settle for quiet."]
    questAccept.seraphine-dark-spore-hill: ["west out of the square, over Dark Spore Hill and down to the Creepy Humming Forest Trail. hum something. they hate it."]
    questWaiting.seraphine-dark-spore-hill: ["forty. is it quiet yet?"]
    questComplete.seraphine-dark-spore-hill: ["forty. and listen. ...quiet. that's nearly singing. the Timeless Enreal Tear, and this one every slot a ten, every one took. there's no kinder wand in any year. be kind with it."]
    questOffer.seraphine-blue-hearts: ["ten blue hearts, dear? the salve's low."]
    questAccept.seraphine-blue-hearts: ["the Road of Regrets, the fourth stretch."]
    questWaiting.seraphine-blue-hearts: ["ten."]
    questComplete.seraphine-blue-hearts: ["ten. bless you. the watch thanks you."]
    about.edda: ["Edda keeps the sick and i keep them company. she does the stitching. i do the humming. she says the humming slows the stitching. it might."]
    about.dagny: ["Dagny writes names on her arrows. she wrote mine once. she never shot it. i've decided that's a blessing."]
    about.thorne: ["Thorne counts everything. i asked him once how many people he's saved. he said he doesn't count those. he does. he just doesn't say."]
    about.lumi: ["Lumi brings me things from the market. a cup with no handle. a bell with no clapper. she says they're presents. they are."]
    about.delphine: ["Delphine. the wand i carry was made in her laboratory, in your years, a long way back. it smells of smoke. i heal with it. i think she'd laugh."]
    aboutUnknown: ["i don't know them, dear. i'll pray for them anyway."]
    friend.close: ["i bless you every morning now. you don't have to do anything. it's done."]
    friend.best: ["if the days ever do end, i'll stand beside you when they do. i'll hum. you'll hate it."]
    famed: ["they speak well of you, even here. especially here."]
    defamed: ["i heard. i've prayed for whoever said it. that's the worst thing i do to people."]
    gift: ["oh, bless you!"]
    gift.favorite: ["oh, that's just what the watch needs. i'll share it. i won't share it."]
    gift.again: ["one's plenty, dear."]
