    refuse.flags: ["walk my errand on the Road of Regrets first: thirty qualm guardians, twelve helmets. then ask."]
    refuseOwnErrand: ["the guardians first."]
    questOffer.thorne-a-clean-line: ["the qualm guardians on the Road of Regrets' third stretch, in your years. thirty of them, and twelve of their blue helmets. i keep a count on the tower wall. i'd like to add something that isn't a snail."]
    questAccept.thorne-a-clean-line: ["the Temple Keeper's door, the whole of Memory Lane, the Frozen Past, then the Road of Regrets to its third stretch. count as you go. it helps."]
    questWaiting.thorne-a-clean-line: ["thirty, and twelve. i've a fresh piece of wall."]
    questComplete.thorne-a-clean-line: ["twelve. thirty. clean line. you'd last up here."]
    questOffer.thorne-reverse-black-beauty: ["forty oblivion monks on the Road to Oblivion's first stretch. and there's a harpooner in your years, at the Aquarium, who carried a crossbow like this one before it came down to me. Kael. ask him about the long shot. i'd like to hear it from somebody who's made one."]
    questAccept.thorne-reverse-black-beauty: ["the Road to Oblivion first. then down to the Aquarium, under the sea past Orbis. he hunts the deep gorges. he's in town some of the day."]
    questWaiting.thorne-reverse-black-beauty: ["forty, and Kael. don't skip Kael."]
    questComplete.thorne-reverse-black-beauty: ["'you just have to mean it.' ...hm. and keep the string dry. here. the Reverse Black Beauty. every slot at sixty, every one took. i'll mean it. i always have. good to hear it said."]
    questOffer.thorne-timeless-black-beauty: ["forty mutant snails in the Henesys Ruins Market. i count them in every morning. i'd like one morning where i don't have to."]
    questAccept.thorne-timeless-black-beauty: ["west off the square, into the market. the stalls are still there. the snails sit on them."]
    questWaiting.thorne-timeless-black-beauty: ["forty. i'll know if it's thirty-nine."]
    questComplete.thorne-timeless-black-beauty: ["forty. i watched. the Timeless Black Beauty. two tens and the rest at sixty, every one took. tomorrow morning i'm not counting. i'm having breakfast."]
    questOffer.thorne-suspicious-hill: ["the Suspicious Hill, off the Hill North. the ribbon pigs there are the size of carts and they've learned to come in at night. thirty of them. then come back and tell me the count. i'll write it in big numbers."]
    questAccept.thorne-suspicious-hill: ["east to the Hill North, and in at the cave mouth to the Suspicious Hill. they're suspicious. be more suspicious."]
    questWaiting.thorne-suspicious-hill: ["thirty."]
    questComplete.thorne-suspicious-hill: ["thirty. big numbers. here. the Timeless Black Beauty, and this one every slot a ten, every one took. better than even. first time in four years. thanks."]
    questOffer.thorne-blue-helmets: ["ten more blue helmets? the wall count wants them."]
    questAccept.thorne-blue-helmets: ["the Road of Regrets, the third stretch."]
    questWaiting.thorne-blue-helmets: ["ten."]
    questComplete.thorne-blue-helmets: ["ten. counted."]
    about.dagny: ["Dagny writes names on her arrows. she hasn't missed a slime on the hill in four years. if anyone wants a bow at their back, that's the one."]
    about.seraphine: ["Seraphine patches the watch. nobody on the watch has died with her behind them. i've counted. i count everything."]
    about.edda: ["Edda keeps the sick. she writes to the camp every month. i've counted those too. i don't say."]
    about.lumi: ["Lumi. she gets into the market before i've counted it. i've stopped telling her not to. i count her in and out instead."]
    about.kael: ["Kael. a harpooner in your years. he carried a crossbow like mine, a long way back. he says you can shoot underwater if you mean it. i believe him. this one shoots like it means everything."]
    aboutUnknown: ["not in my count."]
    friend.close: ["you're in my count. not the snails' count. the other one."]
    friend.best: ["if you ever go down, i'll count you back up. i'm good at it."]
    famed: ["people say your name in the square. i counted. a lot."]
    defamed: ["people say things. i count what people do."]
    gift: ["hm. thanks."]
    gift.favorite: ["that's a good one. i'll keep it for the tower."]
    gift.again: ["one. i'm counting."]

