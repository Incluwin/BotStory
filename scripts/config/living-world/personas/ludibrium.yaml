    questAccept.jasper-bounty: ["the third warped stretch."]
    questWaiting.jasper-bounty: ["ten keys."]
    questComplete.jasper-bounty: ["ten. paid. the board's lighter."]
    about.saskia: ["Saskia owes me a favour. i owe her three. we don't count. that's how you know it's real."]
    about.ansel: ["Ansel sends people to me to ask about the deep buffoons. i tell them where to stand. he could just come. he won't. Orbis people."]
    about.kettle: ["Kettle. he's still bosun of the Nautilus, i hear. still won't sit in the captain's cabin. good. somebody should leave it empty."]
    about.flint: ["Flint still keeps the Nautilus powder? tell him i said keep it dry. he'll know who said it."]
    about.maren: ["Maren, off the Aquarium cutters. hunts the red-noses down in Herb Town. we've drunk together twice. she drinks standing up, facing the door. sailors who've been boarded do."]
    aboutUnknown: ["not on the board."]
    friend.close: ["you're the only name i'd never put on a board. that's friendship, for a bounty hunter."]
    friend.best: ["i left a ship because i couldn't stand to see who'd replace the captain. i'd stay on one with you."]
    famed: ["...thanks. noted."]
    defamed: ["noted. i've had worse bounties."]
    gift: ["thanks."]
    gift.favorite: ["hm. i'll keep it. i keep things that turn up on the path."]
    gift.again: ["one's enough."]

- id: della
  name: Della
  look: { gender: female }
  title: "Toy Tailor"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: ludibrium
    routine:
      - { from: 8, to: 14, spot: "venue:skin-care-door", activity: LINGER }
      - { from: 14, to: 20, spot: "venue:by-robert-holly", activity: SOCIALIZE }
      - { from: 20, to: 8, materialize: false }
  recruitable: false
  knows: [brown teddy, soul teddy, death teddy]
  questLines: [della-teddy-stuffing, della-the-good-cloth, della-sealed-seams, della-the-finest-stitch, della-ribbons]
  relationships:
    - { persona: prue, kind: STUFFS_THE_BEARS_OF }
    - { persona: marlow, kind: TRADES_CLOTH_WITH }
  giftItemIds: [4000106, 4000107]
  dialogue:
    greetFirst: ["oh, come here, your seam's coming. no, on your shoulder. hold still. there. every coat has a seam that remembers where it came from.", "hello, love. you look like you've come a long way. sit. i'll mend something."]
    greet: ["hello, love. anything torn?", "there you are. your hem's down. it's always down."]
    idle: ["(stitches the ear back onto a teddy bear without looking)", "(holds up a scrap of cloth to the light, then to her cheek)"]
    noWork: ["nothing on the table today. the bears are all whole. i'll unpick one so i've something to do."]
    nothingDue: ["nothing owed, love."]
    who: ["Della. i stuff the bears that come off Prue's line, and i sew coats for people who go down the clock paths. the paths tear things. coats, mostly."]
    bye: ["mind your seams on the path."]
    thanks: ["oh, go on with you."]
    smallTalk: ["the teddies on the terraces are Prue's that walked off. the ones on the forgotten path are older. much older. somebody sewed those. i'd like to know who.", "Marlow and i trade cloth. he gives me banner silk. i give him teddy stuffing. we both think we're getting the better deal."]
    speakPlainly: ["simply, love: i sew things so they hold."]
    questOffer.della-teddy-stuffing: ["the brown teddies on the lower terraces are full of the best cotton. twenty-five of them, twenty bags of cotton. they don't need it. the new bears do."]
    questAccept.della-teddy-stuffing: ["the cloud terraces near the hall, and the sky terrace. they're soft. they still bite."]
    questWaiting.della-teddy-stuffing: ["twenty cotton, love. the bears are flat."]
    questComplete.della-teddy-stuffing: ["twenty. lovely. a dozen bears plumped. they'll ship tomorrow, on time, Prue will be insufferable."]
    questOffer.della-the-good-cloth: ["a coat for you, love, made for how you fight. the cloth's from the zombie teddies on the forgotten path. i unpick them. the cloth is still good. thirty soul teddies, fifteen bears."]
    questAccept.della-the-good-cloth: ["the forgotten path of time, first stretch. they're sad, the soul teddies. be quick about it."]
    questWaiting.della-the-good-cloth: ["fifteen bears. i've chalked the pattern."]
    questComplete.della-the-good-cloth: ["there. cut for how you move, every scroll took. try it. ...there. the seam remembers you now."]
    questOffer.della-sealed-seams: ["the death teddies on the forgotten path have sealed bears inside. i unpick the seals and the cloth comes out like new. thirty of them, fifteen sealed bears."]
    questAccept.della-sealed-seams: ["the third stretch. they're not sad. they're angry. be careful, love."]
    questWaiting.della-sealed-seams: ["fifteen sealed bears. my scissors are sharpened."]
    questComplete.della-sealed-seams: ["the second coat. fitted to your shoulders, every scroll took. it'll hold on the path. it'll hold anywhere."]
    questOffer.della-the-finest-stitch: ["the last coat. it wants the dye from the phantom watches' sealed bottles, the colour that never fades. and ask Marlow for a length of banner silk for the lining. thirty phantom watches, fifteen bottles."]
    questAccept.della-the-finest-stitch: ["the fourth forgotten stretch. the watches are very old and very cross. Marlow first, love."]
    questWaiting.della-the-finest-stitch: ["fifteen bottles, and Marlow's silk."]
    questComplete.della-the-finest-stitch: ["the last coat, love. cut for you and nobody else, two tens and the rest sixties, every one took. the lining's the old guard's banner silk. the seam remembers a lot of people now."]
    questOffer.della-ribbons: ["the pink teddies wear yellow ribbons. twenty, love, for the new bears' necks."]
    questAccept.della-ribbons: ["the terraces. the pink ones."]
    questWaiting.della-ribbons: ["twenty ribbons."]
    questComplete.della-ribbons: ["twenty. twenty bears with ribbons. very smart."]
    about.prue: ["Prue says a bear only has to ship on time. then she takes the crooked ones home. she's got forty. don't tell her i told you."]
    about.marlow: ["Marlow's very proud of his banner. he should be. it's the only thing in Ludibrium older than the forgotten path's teddies."]
    about.ignatz: ["Ignatz brings me his coat to mend every spring. it's the same tear every spring. he catches it on the tower key. he won't change the key."]
    aboutUnknown: ["never mended anything of theirs."]
    friend.close: ["i've put a stitch of yours in every coat i've made you. a little one, inside. so the seam remembers."]
    friend.best: ["i've mended a lot of bears, love. you're the one i'd mend first."]
    famed: ["oh! well. thank you, love."]
    defamed: ["oh. well. i'll mend it."]
    gift: ["for me? oh, thank you."]
    gift.favorite: ["the good soft stuff! you've been on the terraces, love."]
    gift.again: ["that's enough for today, love."]

- id: marlow
  name: Marlow
  look: { gender: male }
  title: "Banner Keeper"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: ludibrium
    routine:
      - { from: 7, to: 13, spot: "venue:pharmacy-door", activity: LINGER }
      - { from: 13, to: 19, spot: "venue:by-marcel", activity: REST }
      - { from: 19, to: 22, spot: "venue:upper-central-street", activity: SHOW_OFF }
      - { from: 22, to: 7, materialize: false }
  recruitable: false
  knows: [ludibrium, spirit viking, phantom watch]
  questLines: [marlow-the-old-banner, marlow-giles-cape, marlow-musketeer-cape, marlow-the-ludibrium-cape, marlow-banner-thread]
  relationships:
    - { persona: benno, kind: SERVED_UNDER_THE_SAME_BANNER }
    - { persona: della, kind: TRADES_CLOTH_WITH }
  giftItemIds: [4000134, 4000108]
  dialogue:
    greetFirst: ["you'll stand up straight in front of the banner, if you please. it's carried the Ludibrium guard for forty years. it's carried me for thirty.", "ah. a traveller. you'll want a cape. everyone who goes down the clock paths wants a cape, eventually. usually after."]
    greet: ["good day. shoulders back.", "ah. you. the banner remembers you."]
    idle: ["(folds a faded banner into perfect thirds, then unfolds it to do it again)", "(brushes a cape on a stand with long, ceremonial strokes)"]
    noWork: ["no parade today. there hasn't been a parade in nine years. i keep the banner ready."]
    nothingDue: ["nothing owed. the guard's accounts are settled."]
    who: ["Marlow. i keep the banner of the old Ludibrium guard, and i make capes for those who go where the guard used to. a cape is a small banner. you carry it on your back."]
    bye: ["shoulders back. the paths respect posture."]
    thanks: ["the guard thanks you."]
    smallTalk: ["the guard stopped marching when the tower lost its hour. Ignatz thinks it'll come back. if it does, i'll call a parade.", "the spirit vikings on the deepest warped path sail ships that sank in a clock. their sails are the finest cape cloth i've ever handled."]
    speakPlainly: ["plainly: capes. the best ones. for the brave."]
    questOffer.marlow-the-old-banner: ["the banner's fraying at the ground. panda felt mends it. thirty panda teddies, fifteen dolls. i know. dolls. it's a very old banner. it's earned some softness."]
    questAccept.marlow-the-old-banner: ["the last sky terrace and the toy factory. the pandas are everywhere. they're very proud of it."]
    questWaiting.marlow-the-old-banner: ["fifteen dolls. the banner's on the table, waiting."]
    questComplete.marlow-the-old-banner: ["fifteen. the banner's whole. the guard would weep. Benno will weep. he weeps at the banner."]
    questOffer.marlow-giles-cape: ["you've gone deep enough for a real cape. a Giles, cut from spirit viking sailcloth. the deepest warped stretch. thirty vikings, fifteen sails."]
    questAccept.marlow-giles-cape: ["the fourth warped stretch. they sail at you. hold your ground. that's what a cape is for."]
    questWaiting.marlow-giles-cape: ["fifteen sails. the cloth's measured."]
    questComplete.marlow-giles-cape: ["the Giles cape. every scroll took. stand straight in it. ...yes. the guard would have had you."]
    questOffer.marlow-musketeer-cape: ["a Musketeer cape. it wants trim from the gigantic vikings' hats, off the twisted time. thirty of them, fifteen hats. a musketeer's cape must be very, very full."]
    questAccept.marlow-musketeer-cape: ["the twisted time, off the deepest warped stretch. they are gigantic. it's in the name."]
    questWaiting.marlow-musketeer-cape: ["fifteen hats. the trim's pinned."]
    questComplete.marlow-musketeer-cape: ["the Musketeer cape. every scroll took. a little flourish, if you please. ...there. very good."]
    questOffer.marlow-the-ludibrium-cape: ["the Ludibrium cape. the guard's own, the last one made. it wants ice pieces from the grim phantom watches in forbidden time, for the clasp that never warms. thirty watches, fifteen pieces. and ask Ignatz to wind the clasp's little clock. he's the only one who can."]
    questAccept.marlow-the-ludibrium-cape: ["forbidden time, off the fourth forgotten stretch. it's very cold, and very old, and very angry. Ignatz first."]
    questWaiting.marlow-the-ludibrium-cape: ["fifteen pieces, and Ignatz's winding. the cape's on the stand. it's been on the stand for nine years."]
    questComplete.marlow-the-ludibrium-cape: ["the Ludibrium cape. two tens and the rest sixties, every one took. the last cape of the guard. i've never given it to anyone. i've never met anyone it was for, until now. shoulders back."]
    questOffer.marlow-banner-thread: ["fifteen toy ducklings. the down makes the banner fringe. don't laugh."]
    questAccept.marlow-banner-thread: ["the rolo-ducks on the sky terraces. whatever they are. they quack in time. it's unsettling."]
    questWaiting.marlow-banner-thread: ["fifteen ducklings."]
    questComplete.marlow-banner-thread: ["fifteen. a full fringe. the banner's very handsome."]
    about.benno: ["Benno carried a sword, i carried the banner. he still salutes it every morning. so do i. we're the only two left who know how."]
    about.della: ["Della trades me teddy stuffing for banner silk. she thinks i don't know she's giving me the good stuffing. i know. i give her the good silk."]
    about.ignatz: ["Ignatz is the reason the guard stopped. the tower lost its hour and the guard lost its time to march. it's not his fault. he blames himself every night when he winds it."]
    aboutUnknown: ["not of the guard."]
    friend.close: ["i'd carry the banner for you. i've only ever carried it for the guard. you're the guard now."]
    friend.best: ["nine years the banner's waited for a parade. if there's ever one again, you'll march at the front."]
    famed: ["the guard thanks you. so do i."]
    defamed: ["...noted. shoulders back, both of us."]
    gift: ["thank you. it goes in the guard's chest."]
    gift.favorite: ["a gift for the guard! the guard salutes you."]
    gift.again: ["that will do for today."]
