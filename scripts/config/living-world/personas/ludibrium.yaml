# Ludibrium cast: broken time. 7 residents, 2 recruitable (Saskia the runner once you have heard her terms at the
# weapon store, Jasper the bounty hunter for a kill proof), 1 arc (Ignatz's lost hour). Ids in quests/ludibrium.yaml.
- id: ignatz
  name: Ignatz
  look: { gender: male }
  title: "Clockwinder"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: ludibrium
    routine:
      - { from: 9, to: 13, spot: "venue:by-marcel", activity: REST }
      - { from: 13, to: 19, spot: "venue:ticketing-place-door", activity: LINGER }
      - { from: 19, to: 23, spot: "venue:lower-central-benches", activity: SOCIALIZE }
      - { from: 23, to: 9, materialize: false }
  recruitable: false
  knows: [path of time, ludibrium, tick-tock]
  questLines: [ignatz-oil-for-the-gears, ignatz-eleven-strikes, ignatz-the-twelfth-strike, ignatz-cogs]
  arc: ignatz-the-lost-hour
  rumors: [ludibrium-the-hour-argument]
  relationships:
    - { persona: prue, kind: ARGUES_WITH }
    - { persona: perrin, kind: SELLS_SCRAP_TO }
    - { persona: saskia, kind: SENDS_ON_ERRANDS }
  giftItemIds: [4000113, 4000115]
  dialogue:
    greetFirst: ["you're early. no. late. no. you're exactly on time and the tower is wrong. it's always the tower.", "listen. hear it? the tower. it's a hair behind. it's been a hair behind for nine years. i wind it every night."]
    greet: ["tick. tock. you.", "good afternoon. it isn't. it's an hour later than that. don't tell the tower."]
    idle: ["(holds a pocket watch to one ear and the tower's chime to the other)", "(winds a tiny key in the air, out of habit)"]
    noWork: ["no winding till dark. i'm resting my wrists. they're very old wrists."]
    nothingDue: ["nothing owed. time's free. that's the trouble with it."]
    who: ["Ignatz. i wind the Ludibrium clock tower every night. somebody has to, or the whole city runs down like a toy."]
    bye: ["don't be late. it's catching."]
    thanks: ["tick. that means thank you. tock means you're welcome."]
    smallTalk: ["the tower lost an hour nine years ago. a crack, they said, in the clockwork under the city. i say the hour went somewhere. hours don't just stop.", "Prue's factory runs on the tower's time. if the tower's wrong, every toy in the world is an hour late. nobody notices. i notice."]
    speakPlainly: ["plainly: the tower's wrong. i'm trying to make it right."]
    questOffer.ignatz-oil-for-the-gears: ["the ticks at the crossroad of time have the best springs in the world inside them. twenty-five ticks, fifteen springs. the tower's gears are thirsty."]
    questAccept.ignatz-oil-for-the-gears: ["the path of time, then the crossroad. the ticks are small. they're very punctual. be more punctual."]
    questWaiting.ignatz-oil-for-the-gears: ["fifteen springs. i can hear the gears asking."]
    questComplete.ignatz-oil-for-the-gears: ["fifteen. lovely. the tower will run a hair less behind tonight. a hair is a lot, in a tower."]
    questOffer.ignatz-eleven-strikes: ["last night the tower struck eleven twice. twice! the tick-tocks keep table clocks in them. thirty tick-tocks, fifteen clocks. i need to hear what time they think it is."]
    questAccept.ignatz-eleven-strikes: ["the crossroad and the whirlpool of time. the tick-tocks are cleverer than the ticks. not much."]
    questWaiting.ignatz-eleven-strikes: ["fifteen clocks. bring them before eleven. either eleven."]
    questComplete.ignatz-eleven-strikes: ["fifteen. and every one says eleven. eleven, eleven, eleven. the hour that's missing is twelve. somebody took midnight."]
    questOffer.ignatz-the-twelfth-strike: ["you heard Prue and me. one hour, i said. stop the line and i'll wind the tower back by hand. she'll stop it if someone nice asks. that's you. then the master chronos in the deep path, thirty, so the old clocks stop pulling the hour backwards while we pull it forwards."]
    questAccept.ignatz-the-twelfth-strike: ["ask Prue. nicely. she'll say yes. she'll say it like a no."]
    questWaiting.ignatz-the-twelfth-strike: ["did Prue stop the line? the master chronos? i've got the key in my hand. i've had it in my hand all day."]
    questComplete.ignatz-the-twelfth-strike: ["listen. listen! ...twelve. it struck twelve. nine years. i'm going to sit down. i'm going to sit down for exactly one hour."]
    questOffer.ignatz-cogs: ["twenty cogs. the chronos carry them. the tower eats cogs like a child eats sweets."]
    questAccept.ignatz-cogs: ["any of the chronos on the path of time."]
    questWaiting.ignatz-cogs: ["twenty cogs."]
    questComplete.ignatz-cogs: ["twenty. a week of winding. thank you."]
    about.prue: ["Prue runs the toy factory on the tower's time and tells me the tower is fine. it isn't fine. her toys are an hour late. she says nobody minds. i mind."]
    about.perrin: ["the Orbis jeweller buys the cases of clocks that stopped. i wrap them for him. it feels like a funeral. he's very respectful."]
    about.saskia: ["Saskia runs my errands on the path of time. she's never late. she says late is a choice. she's wrong. it's a tower."]
    aboutUnknown: ["never set my watch by them."]
    friend.close: ["i've started winding my watch to your visits. it's the only thing in this city that's on time."]
    friend.best: ["nine years i listened for twelve. now i listen for you."]
    famed: ["tick! that's a very good tick."]
    defamed: ["tock. that's a less good tock."]
    gift: ["thank you. it'll go in the tower. everything does."]
    gift.favorite: ["good tight work. you have a winder's eye."]
    gift.again: ["one a day. like winding. too much breaks the spring."]

- id: prue
  name: Prue
  look: { gender: female }
  title: "Factory Forewoman"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: ludibrium
    routine:
      - { from: 7, to: 12, spot: "venue:by-robert-holly", activity: LINGER }
      - { from: 12, to: 16, materialize: false }
      - { from: 16, to: 23, spot: "venue:lower-central-benches", activity: SOCIALIZE }
      - { from: 23, to: 7, materialize: false }
  recruitable: false
  knows: [toy factory, robo, master robo]
  questLines: [prue-the-runaway-robots, prue-mechanical-hearts]
  rumors: [ludibrium-the-hour-argument]
  relationships:
    - { persona: ignatz, kind: ARGUES_WITH }
    - { persona: della, kind: SUPPLIES }
  giftItemIds: [4000111, 4000112]
  dialogue:
    greetFirst: ["you're not a toy and you're not on my line. visitor, then. mind the conveyor.", "factory shift starts at noon. tower time. which is wrong. which i don't care about."]
    greet: ["the line's running. so am i.", "back? good. i've got a robot problem. i always have a robot problem."]
    idle: ["(checks a clipboard, makes a mark, checks it again)", "(winds a little tin soldier and sets it marching across the bench)"]
    noWork: ["the line's clean today. don't touch it."]
    nothingDue: ["nothing owed. the factory doesn't do favours. i do. we're square."]
    who: ["Prue. forewoman at the toy factory. every toy in the world comes off my line. some of them walk off it. that's the robots."]
    bye: ["back to work, both of us."]
    thanks: ["fine. good. back to it."]
    smallTalk: ["the robos in the factory were supposed to stack crates. now they stack themselves on people. it's a design flaw. it's a feature.", "Ignatz thinks the tower's an hour behind. i think Ignatz is an hour behind. we've been saying it at each other for nine years."]
    speakPlainly: ["plainly: robots, toys, a line that doesn't stop."]
    questOffer.prue-the-runaway-robots: ["the robos broke off the line again. twenty-five of them, and fifteen of their batteries back so i can find out which of them did it."]
    questAccept.prue-the-runaway-robots: ["the factory zones past the apparatus room. they'll try to stack on you. don't be stackable."]
    questWaiting.prue-the-runaway-robots: ["fifteen batteries. i'm going to read every one."]
    questComplete.prue-the-runaway-robots: ["fifteen. and it was the same three. it's always the same three. thank you. the line runs."]
    questOffer.prue-mechanical-hearts: ["the master robos run on mechanical hearts. twenty of them down and ten hearts back, and i'll fit the hearts into the toy soldiers. they march better with a heart."]
    questAccept.prue-mechanical-hearts: ["the first zones of both processes. the master ones are bigger. so are their hearts."]
    questWaiting.prue-mechanical-hearts: ["ten hearts. the soldiers are lined up empty."]
    questComplete.prue-mechanical-hearts: ["ten. ten soldiers with hearts. they're marching already. look at them go."]
    about.ignatz: ["Ignatz is the most stubborn man in Ludibrium. second most. i'm first. he's usually right. don't you dare tell him."]
    about.della: ["Della stuffs the bears off my line. she says every bear needs a seam that remembers. i say every bear needs to ship on time. she's better with bears than me."]
    about.benno: ["Benno marched on the terraces for thirty years. now he marches up to my factory gate every morning to tell me the soldiers are sloppy. they are."]
    aboutUnknown: ["not on my line."]
    friend.close: ["you're on my line now. the good end. where the finished things are."]
    friend.best: ["i'd stop the line for you. i've stopped it once in nine years. i'd stop it again."]
    famed: ["...noted. pinned to the board."]
    defamed: ["noted. in red."]
    gift: ["thank you. i'll put it to work."]
    gift.favorite: ["something useful! you're the only person who's ever given me something useful."]
    gift.again: ["one's enough. i can't run a line on gifts."]

- id: benno
  name: Benno
  look: { gender: male }
  title: "Retired Terrace Guard"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: ludibrium
    routine:
      - { from: 8, to: 14, spot: "venue:lower-west-street", activity: LINGER }
      - { from: 14, to: 20, spot: "venue:by-spiegelmann", activity: SOCIALIZE }
      - { from: 20, to: 8, materialize: false }
  recruitable: false
  knows: [cloud terrace, toy trojan]
  questLines: [benno-the-trojan-swords, benno-terrace-patrol]
  relationships:
    - { persona: marlow, kind: SERVED_UNDER_THE_SAME_BANNER }
    - { persona: prue, kind: INSPECTS_THE_SOLDIERS_OF }
  giftItemIds: [4000110, 4000106]
  dialogue:
    greetFirst: ["halt! who goes there! ...sorry. thirty years on the terraces. it doesn't wash out.", "at ease. i'm retired. you're at ease. we're both at ease. left, right."]
    greet: ["at ease!", "you again! fall in. no. stand where you like."]
    idle: ["(marches three steps, turns smartly, marches back)", "(polishes a toy sword that was never sharp)"]
    noWork: ["no patrol today. the terraces will have to defend themselves. they won't."]
    nothingDue: ["nothing owed, soldier. dismissed. not really."]
    who: ["Benno. i guarded the cloud terraces for thirty years, until my knees retired before i did. Marlow kept the banner. i kept the step."]
    bye: ["left, right. left, right. there you go."]
    thanks: ["carry on!"]
    smallTalk: ["the toy trojans on the terraces carry swords. they're toy swords. they still hurt. that's the whole of Ludibrium in one sentence.", "Prue's new soldiers are sloppy. they march like they're late. everyone in this city marches like they're late."]
    speakPlainly: ["plainly, soldier: i used to guard the terraces. now i talk about it."]
    questOffer.benno-the-trojan-swords: ["the toy trojans on the upper terraces stole the old guard's swords. twenty-five trojans, fifteen swords back. they're ours. the swords. not the trojans."]
    questAccept.benno-the-trojan-swords: ["the cloud terraces, three through five. they come at you in a line. break the line."]
    questWaiting.benno-the-trojan-swords: ["fifteen swords, soldier. the rack's empty."]
    questComplete.benno-the-trojan-swords: ["fifteen! the rack's full! the old guard thanks you. the old guard is me."]
    questOffer.benno-terrace-patrol: ["walk the terraces for me. thirty teddies, brown or pink, any. it's not about the teddies. it's about the walking."]
    questAccept.benno-terrace-patrol: ["start at the hall. work up. keep the pace."]
    questWaiting.benno-terrace-patrol: ["thirty. you're not marching. i can tell. march."]
    questComplete.benno-terrace-patrol: ["thirty. patrol complete. that's a good soldier."]
    about.marlow: ["Marlow carried the banner when i carried a sword. he still carries it. it's in his shop. he takes it out on parade days. there aren't parade days any more. he takes it out anyway."]
    about.prue: ["Prue makes soldiers in a factory. we used to make them on the terraces. by marching. hers have hearts in them now. i'll allow it."]
    about.ignatz: ["Ignatz winds the tower. the guard used to march by it. now nobody marches by it. he winds it anyway. good man."]
    aboutUnknown: ["not in the guard. not in my day."]
    friend.close: ["you're in the guard now. honorary. i've written it on the board. the board is a napkin."]
    friend.best: ["thirty years i guarded the terraces. i'd guard you longer."]
    famed: ["ha! a medal! well. as good as."]
    defamed: ["demerit noted, soldier."]
    gift: ["for the guard? thank you!"]
    gift.favorite: ["for the guard's rack or the mending box! either way, thank you!"]
    gift.again: ["that's enough for one day, soldier."]

