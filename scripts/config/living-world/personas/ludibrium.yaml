    questWaiting.jasper-abyss-shooter: ["fifteen clocks. i've cut the sight blanks."]
    questComplete.jasper-abyss-shooter: ["the Abyss Shooter. seven sixties, every one took. look down the sight. you can see the second hand. it's still going."]
    questOffer.jasper-infinitys-wrath: ["the Infinity's Wrath. the best gun i've owned. the ghost pirates on the third warped stretch have a captain's bounty on them. thirty of them, fifteen keys, and the bounty's yours. so's the gun."]
