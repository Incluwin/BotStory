  giftItemIds: [4000114, 2000004]
  dialogue:
    greetFirst: ["you walk like someone with time to spare. nobody in Ludibrium has time to spare. it's broken.", "hi. bye. no, wait. hi. i've got a minute. an actual one."]
    greet: ["you're late. kidding. you're right on time. that's rare here.", "hey. quick. what do you need? i'm between errands. i'm always between errands."]
    idle: ["(bounces on her toes, counting under her breath)", "(spins a throwing star on one finger and catches it without looking)"]
    noWork: ["nothing to run today. i'm going to sit very still and hate it."]
    nothingDue: ["we're square. i don't keep debts. they slow you down."]
    who: ["Saskia. i run errands down the path of time for Ignatz and anyone who pays. the path runs in loops. i run faster than the loops."]
    bye: ["don't stop on the crossroad. things catch up."]
    thanks: ["sure, sure. go."]
    smallTalk: ["late is a choice. i've never chosen it. Ignatz says that's not how towers work. Ignatz walks.", "the chronos on the path carry cogs because they think it'll make them faster. it doesn't. i've checked."]
    speakPlainly: ["plainly: errands. fast ones."]
    offer: ["forty thousand. and you heard what i said at the weapon store, so you know the rest. the runner's cut is a fifth of what we find on the path. i'll take it later. i'm fast, not greedy."]
    join: ["great. try to keep up. i'll wait. a little."]
    bench: ["i'll be on the path. two days and then i'm bored and then i'm gone."]
    leave: ["that was fun! i've got errands. bye!"]
    refuse.bond: ["i don't run with people i don't know. you'd hold me back. no offence. some offence."]
    refuse.flags: ["race me on the path first. and come by the weapon store some evening. Jasper and i have a thing we say. you should hear it first."]
    refuseOwnErrand: ["that's my errand. you can run it with me. i'll win."]
    questOffer.saskia-the-quick-path: ["race me. not really. thirty chronos on the path of time, then touch the whirlpool and come back. i'll know if you dawdled. i always know."]
    questAccept.saskia-the-quick-path: ["path of time two and three. then the whirlpool past lost time. go! you're already late! you're not! go!"]
    questWaiting.saskia-the-quick-path: ["thirty, and the whirlpool. tick tock."]
    questComplete.saskia-the-quick-path: ["not bad! you didn't stop at the crossroad. people always stop at the crossroad."]
    questOffer.saskia-sapphire-gigantic: ["the Sapphire Gigantic. my first real claw. the buffies on the warped path wear hats that shouldn't exist. thirty buffies, fifteen hats. don't ask why i want hats. i want hats."]
    questAccept.saskia-sapphire-gigantic: ["the warped path of time, first stretch. the buffies bounce. bounce first."]
    questWaiting.saskia-sapphire-gigantic: ["fifteen hats. i'm going to wear one. just one."]
    questComplete.saskia-sapphire-gigantic: ["the Sapphire Gigantic. seven safe scrolls, every one took. i threw a million stars with it. throw a million more."]
    questOffer.saskia-blue-scarab: ["the Blue Scarab. faster than the Gigantic. the master soul teddies on the forgotten path have free spirits in them. let them out. thirty teddies, fifteen spirits."]
    questAccept.saskia-blue-scarab: ["the forgotten path of time, first stretch. the soul teddies drift. don't drift with them."]
    questWaiting.saskia-blue-scarab: ["fifteen spirits. they're wriggly. hold tight."]
    questComplete.saskia-blue-scarab: ["the Blue Scarab. seven sixties, every one took. i've never been that lucky. i've never been that slow, either. i waited for every one."]
    questOffer.saskia-black-mamba: ["the Black Mamba. the fastest claw i've ever held. it's in the room off the warped path where the dual ghost pirates spin. thirty of them, fifteen propellers. and tell Ignatz where you're going. he worries. he's slow about it, but he worries."]
    questAccept.saskia-black-mamba: ["unbalanced time, off the third warped stretch. the pirates spin. don't spin. Ignatz first."]
    questWaiting.saskia-black-mamba: ["fifteen propellers. and Ignatz. did you tell him? he'll have stopped his watch to worry."]
    questComplete.saskia-black-mamba: ["the Black Mamba. two tens and five sixties, every one took. i stood still the whole time. me! still! it's yours. run with it."]
    questOffer.saskia-errand-run: ["errand run! twenty-five tick-tocks. Ignatz wants their clocks quiet for an evening. i want to see if you're faster than last time."]
    questAccept.saskia-errand-run: ["the crossroad and the whirlpool. go go go."]
    questWaiting.saskia-errand-run: ["twenty-five!"]
    questComplete.saskia-errand-run: ["twenty-five. faster than last time. barely. i'll take it."]
    about.ignatz: ["Ignatz is the slowest man in Ludibrium and the only one who's never once been late. i don't understand it. i love him for it."]
    about.jasper: ["Jasper hunts ghosts on the warped path for bounties. i run errands past them. we split the difference. it's a long story. it's a fast story."]
    about.prue: ["Prue's line never stops. i respect that. i've never once seen her run, though."]
    aboutUnknown: ["never ran past them."]
    friend.close: ["you're the only person i slow down for. don't make it weird. it's weird."]
    friend.best: ["i've run every path in this city. the one back to you is the only one i walk."]
    famed: ["ooh! thanks! fast fame!"]
    defamed: ["ouch. fast ouch."]
    gift: ["for me? thanks! quick!"]
    gift.favorite: ["for me? useful and quick. i'll take it on the run."]
    gift.again: ["two? no, one's plenty. i travel light."]

