  giftItemIds: [2020005, 2000001]
  dialogue:
    greetFirst: ["oh. hi. sorry, i'm usually asleep about now. i'm Wick. i'm the night.", "you're up early. or late. i can never tell any more. hello."]
    greet: ["hey.", "hi. is it evening yet?", "oh. you. good."]
    idle: ["(trims a lamp wick with a small knife, holds it up, and trims it again)", "(yawns enormously, catches himself, and pretends it was a stretch)"]
    noWork: ["nothing today. i'm resting up for the round. this is resting."]
    nothingDue: ["we're square."]
    who: ["Wick. i walk the dig sites at night with a lamp, so the diggers' tools are still there in the morning. the ghost stumps come out after dark. so do i. we have an understanding. it's mostly me hitting them."]
    bye: ["mind your lamp."]
    thanks: ["thanks. really."]
    smallTalk: ["the smirking ghost stumps follow me on the round. not close. just far enough to smirk. you get used to it. i haven't.", "the masks in the third site turn to watch my lamp go by. Edmund says they're only funeral masks. he's never walked past them at two in the morning."]
    speakPlainly: ["plainly: a lamp, a round, and a claw for the bits that move."]
    offer: ["fifteen thousand. it's for lamp oil. i'll walk with you anywhere, and i'll carry the lamp."]
    join: ["all right. i'll go first. i've got the lamp."]
    bench: ["two days. then i'm back on the round."]
    leave: ["back on the round, then."]
    refuse.bond: ["i don't walk the round with people i don't know. the lamp only lights one."]
    refuse.flags: ["you haven't heard what Nell says about me. come by her cookfire in the evening, six to nine, while i'm eating. i'm the one eating standing up. she always says it."]
    refuseOwnErrand: ["my round first. walk it with me."]
    questOffer.wick-the-night-round: ["walk the round with me. the ghost stumps in the first and second excavation sites, twenty, and ten of the smirking ones in the first. it's easier with two. everything is."]
    questAccept.wick-the-night-round: ["back down the road toward Perion. the first site, then the second. the smirking ones are the ones smirking."]
    questWaiting.wick-the-night-round: ["twenty and ten. keep the lamp on your left."]
    questComplete.wick-the-night-round: ["twenty and ten. you walk quiet. i like that. come by any evening. i'll show you the round in the dark."]
    questOffer.wick-quiet-soles: ["your boots are loud. on the round, loud is how you get smirked at. the wooden masks in the dig sites carry boards, old wood, soft. twenty-five masks, ten boards, and i'll have quiet soles made up for you. for your class."]
    questAccept.wick-quiet-soles: ["the excavation sites, all three. the wooden ones. they sound hollow. they don't hit hollow."]
    questWaiting.wick-quiet-soles: ["ten boards. walk soft till then."]
    questComplete.wick-quiet-soles: ["ten. here. shoes for you. every slot scrolled safe, every one took. go on, walk. ...see? i can't hear you. perfect."]
    questOffer.wick-slate-heels: ["better shoes. the rocky masks in the second and third sites carry slate, and slate heels don't slip on wet stone. thirty masks, fifteen slates."]
    questAccept.wick-slate-heels: ["the second and third sites. the stone ones. they hit like a wall. don't be the wall."]
    questWaiting.wick-slate-heels: ["fifteen slates."]
    questComplete.wick-slate-heels: ["fifteen. your shoes. sixties in every slot, every one took. they grip. you could walk up a tomb wall in those. don't."]
    questOffer.wick-the-whole-round: ["the best shoes i know how to get made. walk the whole round with me, end to end. twenty smirking ghost stumps in the first site, then twenty-five wooden masks and twenty-five rocky masks at the far end of the third. all night. then they're yours."]
    questAccept.wick-the-whole-round: ["the first site, then all the way to the far end of the third. the lamp's yours tonight."]
    questWaiting.wick-the-whole-round: ["the whole round. keep going."]
    questComplete.wick-the-whole-round: ["the whole round. here. two tens and sixties in the rest, every one took. those are a night watchman's shoes. you could walk past Halla in those. nobody walks past Halla."]
    questOffer.wick-lamp-boards: ["ten wooden boards? the watch fire's low."]
    questAccept.wick-lamp-boards: ["the dig sites. the wooden masks."]
    questWaiting.wick-lamp-boards: ["ten."]
    questComplete.wick-lamp-boards: ["ten. the fire's lit. sit a minute."]
    about.nell: ["Nell feeds me before the round. she says sit. i don't sit. she waits. i sit."]
    about.halla: ["Halla taught me to hold the lamp in my off hand. i hold it in my good hand. she sighs. i'm still alive. we call it even."]
    about.edmund: ["Edmund asks me what the masks do at night. i tell him they don't do anything. he writes that down. i wish he wouldn't."]
    aboutUnknown: ["never seen them on the round."]
    friend.close: ["you can walk the round with me any night. i'll give you the good side of the lamp."]
    friend.best: ["i've got a second lamp. it's yours. it's always lit. that's the rule."]
    famed: ["the diggers say your name in the morning. i hear it going to bed. it's a good way to fall asleep."]
    defamed: ["people say things in the dark. you can't see their faces. i don't listen."]
    gift: ["oh. thanks."]
    gift.favorite: ["oh, that's a whole round's worth, that is. thank you."]
    gift.again: ["one a day. i'll fall asleep on the round."]

