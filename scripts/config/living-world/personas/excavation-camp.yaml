# Excavation Site cast (Regional Residents wave 4, docs/REGIONAL_RESIDENTS_PLAN.md section 11): 4 Residents, 2 recruitable.
# The archaeologists' camp at Excavation Site <Camp> (101030104), east of Perion, where Shuang sends guilds down into
# Sharenian. Every Sharenian stone in the tombs has its king's name chiselled off; the camp archaeologist reads the
# chisel marks, Ossa's Perion diggers turn out to have the one stone that kept the name, and it goes back on the camp's
# board after a night at the Remains <Cliff> (arcs/excavation-camp.yaml). Two recruits give armour made for the
# player's class: the tomb-road guard's helmets (L40-60, the Remains <Tomb>) and the night watchman's shoes (L20-30, the
# dig sites back along the road toward Perion).
- id: edmund
  name: Edmund
  look: { gender: male }
  title: "Camp Archaeologist of Sharenian"
  job: BEGINNER
  level: { min: 34, max: 36 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: excavation-camp
    routine:
      - { from: 7, to: 12, spot: "venue:by-shuang", activity: LINGER }
      - { from: 12, to: 18, spot: "venue:upper-west-street", activity: LINGER }
      - { from: 18, to: 23, spot: "venue:middle-central-street", activity: LINGER }
      - { from: 23, to: 7, materialize: false }
  recruitable: false
  knows: [sharenian, wooden mask, rocky mask]
  questLines: [edmund-slate-for-the-board, edmund-the-chisel-marks, edmund-ossas-stone, edmund-the-name-said-aloud]
  arc: edmund-the-buried-name
  rumors: [excav-the-board]
  relationships:
    - { persona: halla, kind: IS_GUARDED_BY }
    - { persona: nell, kind: FORGETS_SUPPER_FOR }
    - { persona: ossa, kind: WRITES_TO }
  giftItemIds: [2020009, 2000002]
  dialogue:
    greetFirst: ["oh! hello. mind the string, it's a grid. everything inside the string is very old. you're new. that's nice.", "a visitor. good. hold this end of the tape. no, the other end. thank you. i'm Edmund."]
    greet: ["hello again. careful of the string.", "you. good. i've found the corner of something.", "hm? oh. hello."]
    idle: ["(brushes the dust off a flat stone with a paintbrush, very slowly, and leans close to read it)", "(pushes his glasses up his nose with the back of a dusty wrist and writes in a small notebook)"]
    noWork: ["nothing today. the dig's resting. so is the dust. mostly."]
    nothingDue: ["nothing owed. we're square, as the surveyors say."]
    who: ["Edmund. i'm the camp's archaeologist. Shuang sends guilds down into Sharenian to fight what's down there. i go down after them and read the walls. every stone in the tombs had a king's name on it, once. somebody chiselled every one of them off."]
    bye: ["mind the string on your way out."]
    thanks: ["thank you. truly."]
    smallTalk: ["the masks out in the dig sites are Sharenian funeral masks. wooden ones for the servants, stone ones for the stewards. nobody ever told them they were buried.", "Shuang wants to know what's past the gate. i want to know what was written on it. we get on. we just don't have the same questions."]
    speakPlainly: ["plainly: old stones, and what they used to say."]
    questOffer.edmund-slate-for-the-board: ["the excavator board beside Shuang is slate. we chalk up everything the dig turns over. the rain washes it and the slate cracks in the cold. the rocky masks in the second and third excavation sites carry slates. twenty masks, ten slates, and i'll have a board again."]
    questAccept.edmund-slate-for-the-board: ["back down the road toward Perion. the second site and the third. the stone masks. they're slow, but they're stone. don't trade blows with them."]
    questWaiting.edmund-slate-for-the-board: ["ten slates. the board's down to chalk dust."]
    questComplete.edmund-slate-for-the-board: ["ten. good slate, too. look, it takes the chalk. here, a pair of the camp's spare glasses. everything looks older through them. that's the point."]
    questOffer.edmund-the-chisel-marks: ["every stone in the tombs had a king's name cut into it, and every one has been chiselled off. i don't want the name. i want the chisel marks. the mummydogs down in the Remains <Tomb> wrap themselves in old linen, and linen takes a rubbing better than paper. fifteen bandages. and go all the way down to the third tomb and look at the big stone yourself."]
    questAccept.edmund-the-chisel-marks: ["on past the camp, the Remains <Tomb>, the first, second and third. the dogs that are only bones don't wear bandages. the other ones do."]
    questWaiting.edmund-the-chisel-marks: ["fifteen bandages. and did you see the big stone?"]
    questComplete.edmund-the-chisel-marks: ["fifteen. look at the rubbings. look. same chisel, same hand, same height on every stone, and nothing else touched. nobody vandalises that carefully. they weren't erasing him. they were hiding him."]
    questOffer.edmund-ossas-stone: ["one hand, one chisel, every stone. a careful man misses one in the end. careful men always do. Ossa runs the diggers in the excavation sites from Perion, and those diggers turn up every loose stone between here and the cliff. ask Ossa if any of them had letters on. the first answer will be no. ask twice."]
    questAccept.edmund-ossas-stone: ["Perion, up the road west. Ossa stands in the square with a schedule, and will tell you to wear a hard hat."]
    questWaiting.edmund-ossas-stone: ["did Ossa have it? was the first answer no?"]
    questComplete.edmund-ossas-stone: ["it's... it's him. the name. the chisel missed one, face-down in the third site, and it's been propping a door in Perion all spring. thank you. i'm not going to read it out. not here. there's a way it should be done."]
    questOffer.edmund-the-name-said-aloud: ["in Sharenian a name went on stone only after somebody had said it aloud where the king's road ends. at night, so the dead could hear it. the road ends at the Remains <Cliff>. i've written the name on this card. take it up there, hold the cliff through the night, and when it's quiet, say it. then come back and we'll cut it into the board. not chalk. cut."]
    questAccept.edmund-the-name-said-aloud: ["past the tombs, past the old camps, to the cliff. stand at the edge. the officer skeletons don't sleep. thirty of them, and then it'll be quiet enough."]
    questWaiting.edmund-the-name-said-aloud: ["have you said it yet? out loud. they have to hear it."]
    questComplete.edmund-the-name-said-aloud: ["you said it? out loud, at the edge? good. good. then hold the chisel with me. there. it's on the board, cut in, the first thing on it the rain can't take. thank you. he has his name back."]
    about.halla: ["Halla keeps the tomb road. she walks in front of me when i go down and won't let me read anything until she's looked at it first. she's usually right. it's usually a mummydog."]
    about.nell: ["Nell feeds me. i forget. she doesn't. she brings the bowl to the string and stands there until it's empty."]
    about.ossa: ["Ossa runs the diggers in the excavation sites from Perion. a letter comes once a month. two lines, both about the drakes."]
    about.wick: ["Wick walks the dig sites at night with a lamp. i asked him if the masks ever take their faces off. he said no. he said it too quickly."]
    aboutUnknown: ["never found them in a dig."]
    friend.close: ["you can step inside the string any time. nobody else is allowed inside the string."]
    friend.best: ["if i ever find anything with your name on it, i'll leave it exactly where it lies and fetch you first."]
    famed: ["people at the camp say your name the way a name ought to be said. clearly, and often."]
    defamed: ["what people say about you isn't carved in anything. it's chalk. it washes."]
    gift: ["oh. thank you. i'll put it somewhere safe. i'll forget where. it'll be very safe."]
    gift.favorite: ["oh, that's a long evening at the board, that is. thank you."]
    gift.again: ["one a day. Nell says i forget to eat. she's right. but one a day."]

