  dialogue:
    greetFirst: ["stop there. ...all right. you can come in. the tomb road's that way. don't go down it alone.", "new face. the tombs are past me. so is everything that comes up out of them."]
    greet: ["you.", "back. good.", "hm. the road's quiet. for now."]
    idle: ["(leans on her spear and watches the tomb road without blinking)", "(rewraps the grip of her spear with a strip of linen and pulls it tight with her teeth)"]
    noWork: ["nothing today. the road's held. it's always held."]
    nothingDue: ["we're even."]
    who: ["Halla. i keep the tomb road. the dogs come up out of the Remains <Tomb> at dusk and i put them back down. nine years. Edmund says that makes me part of the dig. i said i'm not that old. he said nobody is."]
    bye: ["mind the road."]
    thanks: ["good."]
    smallTalk: ["the mummydogs were somebody's dogs once. Sharenian dogs. they still come when you whistle. that's the worst of it.", "Edmund goes down to read the walls and i go down in front of him. he reads. i watch. we've never once agreed on what's interesting."]
    speakPlainly: ["plainly: a road, and a spear across it."]
    offer: ["sixty mummydogs off the road, counted, and twenty-five thousand. then i'll hold the road in front of you instead."]
    join: ["let's go. i'm in front."]
    bench: ["three days. then the road wants me back."]
    leave: ["back to the road."]
    refuse.bond: ["i don't hold the road for strangers. i hold it against them."]
    refuse.flags: ["walk the tomb road with me first. thirty mummydogs in the Remains <Tomb>. then come back and ask."]
    refuseOwnErrand: ["the road first. thirty mummydogs. then ask."]
    questOffer.halla-the-tomb-road: ["walk the road with me. the mummydogs in the Remains <Tomb>, the first three. thirty of them. they come when you whistle. don't whistle."]
    questAccept.halla-the-tomb-road: ["on past the camp. the tombs. they're slow till they're not."]
    questWaiting.halla-the-tomb-road: ["thirty. don't whistle."]
    questComplete.halla-the-tomb-road: ["thirty. you held your ground. come back when you want the road. you know where i am."]
    questOffer.halla-a-helm-for-the-road: ["your head's bare. on my road that's a short career. the skeledogs in the tombs have the hardest bones i've ever broken. thirty of them, fifteen bones, and i'll have a helm made up for you. for your class, not mine."]
    questAccept.halla-a-helm-for-the-road: ["the Remains <Tomb>, the first three. the dogs that are only bones. they don't bark. listen for the rattle."]
    questWaiting.halla-a-helm-for-the-road: ["fifteen bones. keep your head down till then."]
    questComplete.halla-a-helm-for-the-road: ["fifteen. here. a helm for you. seven safe scrolls, every one took. now you've got a head on the road. keep it."]
    questOffer.halla-the-soldiers-ribs: ["a better helm. the skeleton soldiers still stand their posts in the deeper tombs and the old camps past them. thirty soldiers, fifteen ribs. they're for the crest. don't ask."]
    questAccept.halla-the-soldiers-ribs: ["the second and third tombs, and the three camps past the tombs. they stand in rows. break the row."]
    questWaiting.halla-the-soldiers-ribs: ["fifteen ribs."]
    questComplete.halla-the-soldiers-ribs: ["fifteen. your helm. seven sixties, every one took. you look like you belong on the road now."]
    questOffer.halla-the-officers-helm: ["the best helm i can get made. the officer skeletons hold the three camps at the end of my road, behind the soldiers. thirty officers, fifteen pelvic bones. they give the orders. they're the ones you hit first."]
    questAccept.halla-the-officers-helm: ["the old camps past the tombs, the first, second and third. you'll hear the officers shouting. bones don't shout. these do."]
    questWaiting.halla-the-officers-helm: ["fifteen. hit the one giving orders."]
    questComplete.halla-the-officers-helm: ["fifteen. here. two tens and five sixties, every one took. that's an officer's helm. you've earned it. don't tell the officers."]
    questOffer.halla-road-markers: ["ten skeledog bones? the road markers keep walking off."]
    questAccept.halla-road-markers: ["the tombs."]
    questWaiting.halla-road-markers: ["ten."]
    questComplete.halla-road-markers: ["ten. the markers stay put. for a week."]
    about.edmund: ["Edmund reads walls. i stand in front of him while he does it. he'd walk into a mummydog with his nose in a notebook. he has. twice."]
    about.wick: ["Wick takes the night watch on the dig sites. i taught him to hold the lamp in his off hand. he holds it in his good one. he's alive. it's working."]
    about.nell: ["Nell gives me thirds. i've never asked. i'd never refuse."]
    aboutUnknown: ["never came down my road."]
    friend.close: ["you can walk my road any time. i'll hear you coming and i won't throw the spear."]
    friend.best: ["if you ever need a road held, anywhere, send for me. i'll come and stand across it."]
    famed: ["the camp says your name. i heard. i agreed."]
    defamed: ["people talk. it doesn't come down my road."]
    gift: ["hm. thanks."]
    gift.favorite: ["that's a good one. that's a whole night on the road, that is."]
    gift.again: ["one a day. i keep my hands free."]

