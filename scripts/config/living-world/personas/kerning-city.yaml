    questOffer.sadie-clear-the-site: ["octopi all over the construction site. twenty. they get in the concrete."]
    questComplete.sadie-clear-the-site: ["twenty. concrete's pouring. this is the happiest i get."]
    questOffer.sadie-the-b1-problem: ["line 3 basement. stirges and wraiths and something worse. clear twenty stirges and ten jr. wraiths so my crew can get down there."]
    questComplete.sadie-the-b1-problem: ["B1's clear enough to work. you should charge me more."]
    aboutUnknown: ["not on my crew."]

