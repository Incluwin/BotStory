    greet: ["site's a mess. as usual.", "hey. still standing? good."]
    idle: ["(checks a blueprint that has been rained on)"]
    noWork: ["site's clear. i'm going to enjoy this for exactly one hour."]
    nothingDue: ["we're even."]
    who: ["Sadie. foreman of the construction site north of town. also south of town. also under it."]
    bye: ["mind the drop."]
    thanks: ["get back to work. the good kind."]
    smallTalk: ["we dug down to line 3 and found more monsters than rail. story of this city."]
    speakPlainly: ["plainer. i'm covered in dust, not degrees."]
    refuse.bond: ["i hire people i've watched work."]
    offer: ["i'll swing for you. overtime rate, and show me thirty stirges dead so i know you can handle the tunnels."]
