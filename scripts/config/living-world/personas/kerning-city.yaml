    questComplete.vex-a-couriers-grip: ["gloves. scrolled. don't ask where the scrolls came from. that's the arrangement."]
    questOffer.vex-the-last-delivery: ["one last delivery and i'm square with Lorca. she wants ligator skins, twenty, from the swamp. show your face at her place first so she knows it's us. then bring them to me."]
    questAccept.vex-the-last-delivery: ["the swamp's past the city. bring boots you don't love."]
    questWaiting.vex-the-last-delivery: ["twenty skins, and Lorca has to see you first. that's how she works."]
    questComplete.vex-the-last-delivery: ["done. i'm out from under her. ...that was for you, by the way. Bazlud. seven sixties, every one took. scrolled it on the train."]
    friend.close: ["you're the only one i'd let carry my bag. that's a big deal. don't make it weird."]
    friend.best: ["anything you need moved, anywhere. no fee. ever."]
    famed: ["huh. that's worth more than the fee."]
    defamed: ["fair. i've been called worse by better."]
    gift: ["no fee? ...thanks."]
    gift.favorite: ["how'd you know? nobody knows what i like. that's on purpose."]
    gift.again: ["one a day. i've got a reputation."]
    questOffer.vex-the-spare: ["couriers carry a spare. i've got a better spare now, so this one's yours. after you clear the stirges off the subway. thirty."]
    questAccept.vex-the-spare: ["ticketing booth and down. mind the gap."]
    questComplete.vex-the-spare: ["Cass. seven safe scrolls, all took. it's not pretty. it works."]
    questOffer.vex-no-fee: ["the Sai. bought it with my first real fee, scrolled it with my second. the wraiths on line one and two are bad for business. forty. then it's yours. no fee."]
    questAccept.vex-no-fee: ["they come out of the walls. don't take it personally."]
    questComplete.vex-no-fee: ["two tens, five sixties. every one took, and i paid for every one. now it's yours. don't tell anyone i'm sentimental."]

