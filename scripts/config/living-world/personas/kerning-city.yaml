    about.nico: ["the kid's fast. too fast. he'll be me in five years if he's lucky."]
    aboutUnknown: ["haven't carried for them."]
    questOffer.vex-a-couriers-grip: ["you drop things. couriers don't drop things. the jr. wraiths on the line keep grabbing parcels. clear twenty-five and i'll fix your grip."]
