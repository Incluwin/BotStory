    - { persona: lorca, kind: SUPPLIES }
    - { persona: vex, kind: DRESSES }
  giftItemIds: [4000021, 4011004]
  dialogue:
    greetFirst: ["that coat's doing you no favours. i tell everyone that. most of them come back.", "you stand like your shirt itches. it does. i can see it from here."]
    greet: ["you again. still wearing that. brave.", "back. good. stand still, i'm measuring."]
    idle: ["(bites off a thread and squints at the hem)", "(holds a sleeve up to the light and sighs at it)"]
    noWork: ["nothing on the table. the city's dressed. for today."]
    nothingDue: ["you owe me nothing. if you did, you'd have had the bill."]
    who: ["Silas. i dress Kerning. the honest half and the other half. same price."]
    bye: ["mind the hem.", "don't snag it on anything i'll have to fix."]
    thanks: ["don't. just stop slouching in it."]
    smallTalk: ["half this city does things in my coats i'll never hear about. i don't ask. that's the service.", "a good pocket is one nobody knows is there. i've made a lot of good pockets."]
    speakPlainly: ["plainly: it doesn't fit. i'll fix it."]
    questOffer.silas-the-courier-coat: ["Vex wants a coat. couriers ruin coats. ten pieces of leather from the pigs outside town, then go measure him. i won't ask what it's for."]
    questAccept.silas-the-courier-coat: ["L Forest, just outside town. the pigs don't mind giving it up. much."]
    questWaiting.silas-the-courier-coat: ["ten pieces of leather. and Vex's measurements, which he won't bring me himself."]
    questComplete.silas-the-courier-coat: ["good leather. pockets inside the pockets. of course. here, for the legwork."]
    questOffer.silas-first-fitting: ["you've run around in that long enough. i'll make you a top. a proper one. fifteen jr. necki skins. Lorca pays fair for them. i pay fairer."]
    questAccept.silas-first-fitting: ["the neckis are on line two and out in the swamp. they bite. wear something you hate."]
    questWaiting.silas-first-fitting: ["fifteen skins. i don't cut until i have enough. half a top is a vest."]
    questComplete.silas-first-fitting: ["cut for you, not a hanger. safe scrolls in every slot, every one took. it's a start. the next one will be better."]
    questOffer.silas-good-linen: ["jr. wraiths on line one and two drag tablecloths around. best linen in the city. i don't ask where from. twenty, and i'll line you a top."]
    questAccept.silas-good-linen: ["don't let them wrap you in one. it's a bad look."]
    questWaiting.silas-good-linen: ["twenty tablecloths. i'm lining a top, not a napkin."]
    questComplete.silas-good-linen: ["sixties in every slot. i held my breath on each one, and every one took. i don't do that for customers. you stopped being one a while ago."]
    questOffer.silas-the-pattern: ["one pattern i've never sold. Lorca's tried for years. i'm cutting it for you. twenty croco skins, and go tell Lorca. she should hear it."]
    questAccept.silas-the-pattern: ["the crocos are past the ligators, deep in the swamp. Dangerous Croko. the name isn't a joke."]
    questWaiting.silas-the-pattern: ["twenty skins. and Lorca hears it from you, not from me. that part isn't optional."]
    questComplete.silas-the-pattern: ["two tens, sixties in the rest, and every one took. never seen that in my life. i made this pattern for no one. turns out it was for you."]
    questOffer.silas-starch: ["slime goo makes the best starch. collars stand up on their own. fifteen squishy liquids and the whole city looks sharper for a week."]
    questAccept.silas-starch: ["slimes, just outside town. they don't fight much. neither do collars."]
    questWaiting.silas-starch: ["fifteen. a collar with no starch is just a sad neck."]
    questComplete.silas-starch: ["good. Kerning looks respectable for a week. nobody will thank you. i will."]
    friend.close: ["i'd make you anything. i don't say that. i say 'that'll cost you'."]
    friend.best: ["you never pay for a stitch again. keep it quiet. i have a reputation for being expensive."]
    famed: ["hm. fame suits you better than that coat ever did."]
    defamed: ["hm. returned with a complaint. happens. usually the customer's fault."]
    gift: ["for the tailor? nobody brings the tailor anything. thanks."]
    gift.favorite: ["now that i can cut. you've been watching my hands."]
    gift.again: ["one's plenty. i'd only cut it up."]
    about.lorca: ["Lorca sells my coats to people i'd never sell them to. i don't ask. she doesn't tell. best partnership in the city."]
    about.jinx: ["made her a coat once. no label, nothing that shines, sleeves that don't whisper. didn't ask why. i never do."]
    aboutUnknown: ["never had them on my table."]

- id: opal
  name: Opal
  look: { gender: female }
  title: "Jeweler"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: kerning-city
    routine:
      - { from: 10, to: 16, spot: "venue:central-street", activity: SHOW_OFF }
      - { from: 16, to: 23, spot: "venue:central-shop-front", activity: SOCIALIZE }
      - { from: 23, to: 10, materialize: false }
  recruitable: false
  questLines: [opal-whose-earrings, opal-shiny-things, opal-real-sapphire, opal-the-skull-pair, opal-line-one-pearls]
  relationships:
    - { persona: mags, kind: FRIEND }
    - { persona: lorca, kind: RIVAL }
  giftItemIds: [4021004, 4021007]
  dialogue:
    greetFirst: ["oh. bare ears. darling, we can fix that.", "new face. by tomorrow i'll know your name from your earrings."]
    greet: ["you again. lovely. turn your head. hm.", "there you are. i've heard things. come closer."]
    idle: ["(holds an earring up to the light and gasps at it, quietly)", "(whispers something to nobody and laughs)"]
    noWork: ["nothing to set today. plenty to say, though."]
    nothingDue: ["we're even, darling. i keep better books than Lorca."]
    who: ["Opal. i make jewelry. i know everyone in Kerning by what's in their ears. and what isn't."]
    bye: ["don't lose an earring. people will talk. i will.", "bye, darling. come back with gossip."]
    thanks: ["oh, stop. no, go on."]
    smallTalk: ["you can tell the thieves in this city by their earrings. the good ones wear none.", "Sadie bans earrings on the site. safety, she says. i've lost half my customers to a hard hat."]
    speakPlainly: ["plainly? fine. no sparkle. it physically hurts me."]
    questOffer.opal-whose-earrings: ["Mags has a new pair and i didn't make them. go ask her who did. charmingly. then ten slime bubbles, so i can make her a better pair."]
    questAccept.opal-whose-earrings: ["be subtle. she'll know anyway. the slimes are just outside town."]
    questWaiting.opal-whose-earrings: ["ten slime bubbles. and what Mags said, word for word, darling."]
    questComplete.opal-whose-earrings: ["a gift, and she won't say who? then it's someone. oh, that's better than a name. i'll make her a better pair and find out."]
    questOffer.opal-shiny-things: ["stirges steal anything that sparkles. half my stock is in their nests on line one. thin out twenty-five and i'll make your first real pair."]
    questAccept.opal-shiny-things: ["the transfer area and line one. if one of them is glittering, it's mine."]
    questComplete.opal-shiny-things: ["Weighted Earrings, made for your ears and nobody else's. five safe scrolls, all five took. now people will talk about you. nicely."]
    questOffer.opal-real-sapphire: ["i'm setting a real sapphire. for you. i polish with ground boogie horn, every jeweler does. fifteen horns, from the subway depot."]
    questAccept.opal-real-sapphire: ["the depot under line three, B2 and B3. the boogies are small and rude. like Lorca's prices."]
    questWaiting.opal-real-sapphire: ["fifteen horns. a sapphire's only as good as its polish. so is a rumour."]
    questComplete.opal-real-sapphire: ["a real sapphire. five sixties, i didn't breathe once, and every one took. half of Kerning wears my fakes. you wear the truth."]
    questOffer.opal-the-skull-pair: ["skulls. one pair, sketched, never made. too much for anyone but you. twenty drakes, fifteen of their skulls. and let Dario write you down."]
    questAccept.opal-the-skull-pair: ["the drakes are past Sleepywood. the copper ones are friendlier. not by much. Dario's on east street, pretending not to be."]
    questWaiting.opal-the-skull-pair: ["fifteen skulls. and Dario writes you down. i want it on record."]
    questComplete.opal-the-skull-pair: ["two tens, three sixties, every one took. i cried. don't tell anyone. i'll tell everyone. the only pair i'll ever make. yours."]
    questOffer.opal-line-one-pearls: ["bubbling bubbles. i set them like pearls. tourists can't tell. Lorca can. she buys them anyway. fifteen, darling."]
    questAccept.opal-line-one-pearls: ["line one, by the ticket gate. they bounce. you'll manage."]
    questWaiting.opal-line-one-pearls: ["fifteen bubbles. pop one and it doesn't count."]
    questComplete.opal-line-one-pearls: ["lovely. that's a week of pearls. don't tell the tourists."]
    friend.close: ["i've never gossiped about you. not once. do you know what that costs me?"]
    friend.best: ["anything in my case is yours. and every secret in Kerning, you hear first."]
    famed: ["oh, people will talk. good. i'll start."]
    defamed: ["rude. accurate. but rude."]
    gift: ["for me? darling. thank you."]
    gift.favorite: ["oh. oh, look at it. you know exactly what i like. careful, i'll start liking you."]
    gift.again: ["twice in a day, darling? that's not a gift, that's a bribe. ...come back tuesday."]
    about.mags: ["Mags hears everything and says nothing. i hear everything and say everything. we're a matched pair."]
    about.lorca: ["Lorca sells my earrings back to me. i've bought the same sapphire three times. she calls it a coincidence."]
    aboutUnknown: ["never seen their ears. tragic."]
