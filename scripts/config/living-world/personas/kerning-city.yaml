# Kerning City cast: couriers, fences, the sewer. 9 residents, 3 recruitable (Vex for meso, Jinx through a hidden dialogue, Sadie for a kill proof), 2 arcs.
- id: vex
  name: Vex
  title: "Courier"
  job: BANDIT
  level: { min: 26, max: 29 }
  strength: SEASONED
  loadout: kerning-thief-l28
  personality: relaxed-v1
  home:
    town: kerning-city
    routine:
      - { from: 8, to: 20, spot: "venue:central-street", activity: LINGER }
      - { from: 20, to: 24, spot: "venue:subway-sidewalk", activity: SOCIALIZE }
      - { from: 0, to: 8, materialize: false }
  recruitable: true
  contract: vex-courier-fee
  questLines: [vex-the-package, vex-line-one]
  benchToleranceDays: 5
  paceGap: 2
  relationships:
    - { persona: lorca, kind: WORKS_FOR }
    - { persona: nico, kind: MENTORS }
  dialogue:
    greetFirst: ["you look like you need something moved. i move things.", "new in town? keep your hand on your purse. not because of me. mostly."]
    greet: ["hey, you.", "got a job or just saying hi? both's fine."]
    idle: ["(flips a coin, catches it without looking)"]
    noWork: ["nothing to move. weird day."]
    nothingDue: ["we're square. i keep track."]
    who: ["Vex. courier. if it fits in a bag, i've carried it. if it doesn't, i know someone."]
    bye: ["watch your pockets."]
    thanks: ["that's what the fee's for."]
    smallTalk: ["the subway's faster than the road. also full of stirges. tradeoffs."]
    speakPlainly: ["plain words, fast. that's how we talk here."]
    refuse.bond: ["i don't work with people i haven't done a job with."]
    refuse.flags: ["do the package run first. then we talk rates."]
    offer: ["sure, i'll run with you. courier rate, up front."]
    join: ["let's move. keep up."]
    bench: ["i'll be on the street. i've got other deliveries."]
    leave: ["good run. same rate next time."]
    refuseOwnErrand: ["carry my own package? that's not how this works."]
    questOffer.vex-the-package: ["a package for the construction site. it's not heavy. it's not legal either. run it and don't open it."]
    questComplete.vex-the-package: ["you didn't open it. i can tell. good. here's your cut."]
    questOffer.vex-line-one: ["stirges in line one keep eating my deliveries. twenty of them, and i'll owe you."]
    questComplete.vex-line-one: ["twenty. the subway's mine again. for a week."]
    about.lorca: ["Lorca? i deliver for her. i don't ask what. that's the arrangement."]
    about.nico: ["the kid's fast. too fast. he'll be me in five years if he's lucky."]
    aboutUnknown: ["haven't carried for them."]

- id: lorca
  name: Lorca
  look: { gender: female }
  title: "The Fence"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: kerning-city
    routine:
      - { from: 12, to: 24, spot: "venue:west-shop-front", activity: LINGER }
      - { from: 0, to: 12, materialize: false }
  recruitable: false
  knows: [prices]
  questLines: [lorca-a-fair-price, lorca-what-the-sewer-keeps]
  arc: lorca-the-ledger-under-the-floor
  rumors: [kerning-back-room-deal]
  relationships:
    - { persona: vex, kind: EMPLOYS }
    - { persona: jinx, kind: HIDES }
    - { persona: dario, kind: WATCHED_BY }
  dialogue:
    greetFirst: ["i don't know you. that's expensive.", "looking to sell? everything has a price. even the looking."]
    greet: ["you again. good. familiar faces are cheaper."]
    idle: ["(weighs something small in one hand)"]
    noWork: ["nothing moving today. the detective's assistant is watching. hi, Dario."]
    who: ["Lorca. i buy things people found. i sell things people lost. it evens out."]
    bye: ["don't get followed."]
    thanks: ["thank the market."]
    smallTalk: ["everything in this city was somebody else's first."]
    questOffer.lorca-a-fair-price: ["jr. necki skins. eight. the swamp's full of them and the market's empty. i pay fair."]
    questComplete.lorca-a-fair-price: ["eight skins at a fair price. see? honest business."]
    questOffer.lorca-what-the-sewer-keeps: ["something's in the sewer that wasn't there before. ligators guarding it. thin them, twenty, and tell me what you saw."]
    questComplete.lorca-what-the-sewer-keeps: ["a door under the swamp. well. that explains the ledger."]
    about.jinx: ["never heard of her. which is what she pays me to say."]
    about.dario: ["the detective's boy. he thinks he's subtle. it's adorable."]
    aboutUnknown: ["not on my books."]

