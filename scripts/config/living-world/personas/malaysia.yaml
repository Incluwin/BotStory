    defamed: ["children say worse about me. i give them extra homework."]
    gift: ["oh, thank you."]
    gift.favorite: ["oh, lovely. that's my lunch while i mark. thank you."]
    gift.again: ["one a day. i'm a teacher. i set a good example."]

