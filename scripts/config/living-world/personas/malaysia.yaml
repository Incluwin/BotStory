    about.hamid: ["Hamid, the fisherman in the kampung. best ikan bilis on the river. never on time."]
    about.wei: ["Wei, the hawker in Singapore. we argue about tea by letter. Hafiz hands them to Audrey for the CBD flight. it's very important work."]
    aboutUnknown: ["never had a cup at my stall? they will."]
    friend.close: ["you have a stool here. your name's not on it. it's on the bottom. look."]
