    questComplete.awang-the-charmers-flutes: ["ten. hm. this one's cracked. this one's mine from the first year. you can hear it. here. thank you. i'll give them to the school."]
    questOffer.awang-bintang: ["the city showed my horses on its big screen. Zara saw. the lead horse, with the star on her brow: Bintang. i carved her for opening night. she ran first when the park went wild, and the others followed her. she's out there among the Galloperas at the Spooky World's gate. bring her home. thirty of them, and ten tails. hers will have the star burned into it. i burned it myself."]
    questAccept.awang-bintang: ["the far end of the park, past the Viking ship. she won't run from you. she never ran from anyone. only from that night."]
    questWaiting.awang-bintang: ["is she there? is the star on it?"]
    questComplete.awang-bintang: ["...this one. the star. my own iron. Bintang. you brought her home. i'll carve her a new body, the best wood i have. when she stands on the carousel again, the others will come back to her. they always followed her."]
    about.zara: ["Zara. my granddaughter. she wants to be on the city's big screen. i told her the city forgets. she says it doesn't. we'll see who's right."]
    about.lim: ["Lim, in the city. he built the carousel's motor. good motor. we haven't spoken in thirty years. that's my fault and his. mostly his."]
    about.kamal: ["Kamal builds boats next to my shed. he rang the bell at the park every night. he carried the children out, the night it went wild. Zara's mother was one of them."]
    aboutUnknown: ["never carved for them."]
    friend.close: ["you can sit in my shed any day. sweep the shavings if you like. you won't."]
    friend.best: ["i carved you a horse. small. it has your name under its hoof. don't lose it."]
    famed: ["people in the kampung say your name. kindly. that's rare. we don't say much kindly."]
    defamed: ["they talk. the wood doesn't."]
    gift: ["hm. thank you."]
    gift.favorite: ["hm. now that's proper kampung food. sit, we'll share it."]
    gift.again: ["one a day. my teeth aren't what they were."]

