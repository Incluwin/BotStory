  recruitable: false
  knows: [jester scarlion, vikerola, fantasy theme park 3]
  questLines: [lim-the-barrel-ride, lim-the-viking-ship]
  rumors: [kl-the-big-screen]
  relationships:
    - { persona: farah, kind: MENDS_THINGS_FOR }
    - { persona: awang, kind: BUILT_THE_CAROUSEL_WITH }
    - { persona: iskandar, kind: WORKED_THE_PARK_WITH }
  giftItemIds: [2022205, 2022204]
  dialogue:
    greetFirst: ["eh. hello. you need something fixed? phone, radio, clock? i fix. i don't fix hearts. ha. i fix most other things.", "come, come. sit. mind the wires."]
    greet: ["eh, you.", "hello, hello.", "what's broken today?"]
    idle: ["(holds a tiny screw up to the light between two fingers, squints, and sets it in place)", "(winds the key of an old tin carousel on his bench and watches it turn, very slowly)"]
    noWork: ["nothing today. everything is fixed. that never lasts."]
    nothingDue: ["no charge. you didn't break anything."]
    who: ["Lim. i fix radios and phones on the middle street. thirty years ago i built the motors for the Fantasy Theme Park's rides. the carousel was my best one. i still have a tin one on my bench. it still turns."]
    bye: ["go well. don't drop your phone."]
    thanks: ["eh, no problem."]
    smallTalk: ["the Jester Scarlions out at the first park roll the old barrel-ride barrels about. they're still oiled. i oiled them. thirty years. good oil.", "the Viking ship ride swung higher than anything in Asia. now the Vikerolas live in it. they wear the helmets we gave the riders."]
    speakPlainly: ["plainly: i fix things. the park, i couldn't."]
    questOffer.lim-the-barrel-ride: ["the barrel ride. the Jester Scarlions at the first park roll its barrels about. i want to see if my bearings are still good. twenty-five of them, ten barrels."]
    questAccept.lim-the-barrel-ride: ["through the kampung, down Hibiscus Road, the first park. the jesters juggle. duck."]
    questWaiting.lim-the-barrel-ride: ["ten barrels. i'm curious."]
    questComplete.lim-the-barrel-ride: ["ten. look at that. still turning true. thirty years and the bearings are good. here. for your trouble. good work stays good."]
    questOffer.lim-the-viking-ship: ["the Viking ship, at the third park. the best ride i ever built. i want to know if it still swings. go and look at it for me, and the Vikerolas round it, twenty-five. they don't like visitors."]
    questAccept.lim-the-viking-ship: ["all the way through, past the bus and the toy planes. you'll hear it creak. that's a good creak."]
    questWaiting.lim-the-viking-ship: ["does it still swing?"]
    questComplete.lim-the-viking-ship: ["it creaks? still? ...good. good. i'm glad. here. thank you. i don't need to go and see. i'm glad."]
    about.farah: ["Farah from MY Maple TV. always a camera on her shoulder, and always one that needs fixing. every camera she owns has been open on this bench."]
    about.awang: ["Tok Awang, in the kampung. he carved the horses, i built the motor. the best thing either of us ever made, and we made it together. he'd say the same. not out loud."]
    about.iskandar: ["Iskandar was the park's head of security. the night it went wild, he carried children out two at a time. he doesn't talk about it. neither do i."]
    aboutUnknown: ["don't know them. i know their phones, maybe."]
    friend.close: ["anything of yours breaks, bring it. no charge. never."]
    friend.best: ["i made you a little tin carousel. it turns. wind it when you're sad. i do."]
    famed: ["people say your name on the middle street. good things. i listen while i work."]
    defamed: ["talk is cheap. repairs aren't."]
    gift: ["eh, thank you."]
    gift.favorite: ["ah, that's my supper. you know me. thank you."]
    gift.again: ["one a day lah. i'm not a growing boy."]

