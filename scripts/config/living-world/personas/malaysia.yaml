    questAccept.kamal-timeless-bellocce: ["the far end of the park. then the third park on the way home. swing true."]
    questWaiting.kamal-timeless-bellocce: ["sixty and thirty."]
    questComplete.kamal-timeless-bellocce: ["sixty and thirty! the Timeless Bellocce. two tens and five sixties, every one took. that's the last hammer. ring the loudest bell you can find with it."]
    questOffer.kamal-barrel-caulk: ["ten Dented Barrels off the Jester Scarlions? they're soaked through with oil. best caulking on the river."]
    questAccept.kamal-barrel-caulk: ["the first park."]
    questWaiting.kamal-barrel-caulk: ["ten."]
    questComplete.kamal-barrel-caulk: ["ten! these hulls will never leak. ha. thank you."]
    about.rohani: ["Kak Ani. Rohani. the best batik on the river. she teases me every evening. i'd miss it."]
    about.awang: ["Tok Awang carves next to my shed. we don't talk about the park. we talk about wood. it's the same thing."]
    about.iskandar: ["Iskandar, in the city. the park's security chief. the night it went wild, we carried the children out together. he carried two. i carried four. ha. i don't laugh about it."]
    aboutUnknown: ["never built them a boat."]
    friend.close: ["i'll build you a boat. small. it'll float. that's a promise from me, not the boat."]
