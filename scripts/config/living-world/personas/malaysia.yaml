    questComplete.kamal-blue-seal-cushion: ["ha! forty. the Blue Seal Cushion. seven safe scrolls, every one took. it looks soft. it isn't. ask the Vikerolas."]
    questOffer.kamal-dragon-flame: ["the Dragon Flame. a real hammer. it wants the Longest Ride on ByeBye Station, end to end, and fifty Booper Scarlions on the second park after. the long ride first. hold your stomach."]
    questAccept.kamal-dragon-flame: ["the ride's door is on the third park, by the Viking ship. then back to the second. ha."]
    questWaiting.kamal-dragon-flame: ["the ride, then fifty."]
    questComplete.kamal-dragon-flame: ["you rode it and kept your lunch! the Dragon Flame. seven sixties, every one took. it's hot to hold. you'll get used to it."]
