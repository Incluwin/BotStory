    questOffer.awang-the-charmers-flutes: ["the Charmers on the last muddy bank and Hibiscus Road play my flutes. i'd like them back. twenty-five Charmers, ten flutes. i'll tune them properly."]
    questAccept.awang-the-charmers-flutes: ["the muddy bank behind the kampung, or the road in front. they sway. don't sway with them."]
