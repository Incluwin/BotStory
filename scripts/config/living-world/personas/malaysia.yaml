  look: { gender: female }
  title: "Producer for MY Maple TV"
  job: BEGINNER
  level: { min: 44, max: 46 }
  strength: SEASONED
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: kuala-lumpur
