  giftItemIds: [2022208, 2022480]
  dialogue:
    greetFirst: ["careful, the wax is hot. welcome. you came the long way, didn't you. everyone does, to the kampung.", "a visitor. come, look. no touching. the dye's wet."]
    greet: ["hello, hello.", "you. look at this one.", "careful, wet."]
    idle: ["(draws a line of hot wax across stretched cloth with a little copper canting, slow and steady)", "(holds a length of batik up to the light and turns it to see the colours run)"]
    noWork: ["nothing today. the dye's drying. you can't hurry dye."]
    nothingDue: ["nothing owed. you've paid in compliments."]
    who: ["Rohani. Kak Ani to the kampung. i paint batik by Ali's food stall. my mother painted, and hers. thirty years ago the theme park bought every scarf i made for its mascots. then it stopped paying. the mascots still wear them."]
    bye: ["go carefully. you've wax on your sleeve."]
    thanks: ["thank you, dear."]
    smallTalk: ["the Scaredy Scarlions on Hibiscus Road wear my scarves. my batik. the park bought them for the mascot costumes. they're faded. they're still mine.", "the Froscolas in the first park wear little hats i dyed for the frog parade. a hundred hats. i'd know them anywhere."]
    speakPlainly: ["plainly: wax, cloth, and colour."]
    questOffer.rohani-the-batik-scarves: ["the Scaredy Scarlions on Hibiscus Road wear my scarves. i'd like them back. i'll paint them over. twenty-five Scarlions, ten scarves."]
    questAccept.rohani-the-batik-scarves: ["out the front of the kampung, Hibiscus Road, the second stretch. they're scared of you. don't take it personally."]
    questWaiting.rohani-the-batik-scarves: ["ten scarves."]
    questComplete.rohani-the-batik-scarves: ["ten. look, my hibiscus. my mother's border. faded, but mine. i'll paint them over in new colours. here. thank you, dear."]
    questOffer.rohani-the-frog-hats: ["the Froscolas in the first park wear the little hats i dyed for the frog parade. a hundred hats. i'd like ten back, for the school's sports day. twenty-five Froscolas should do it."]
    questAccept.rohani-the-frog-hats: ["down Hibiscus Road to the first park. they hop. you'll hop too, after."]
    questWaiting.rohani-the-frog-hats: ["ten hats. for the little ones."]
    questComplete.rohani-the-frog-hats: ["ten! still bright. i used good dye. Cikgu Meera will give them out for the races. here."]
    about.kamal: ["Kamal. he builds boats and rang the park's bell, and never once has he asked me to paint his sail. i'm waiting."]
    about.cheryl: ["the girl from the city. Cheryl. she wants my batik on her runway. the city's never wanted anything of ours it didn't keep."]
    about.awang: ["Tok Awang carves. he carved the park's horses. we were both paid in promises. he carved anyway. i painted anyway."]
    aboutUnknown: ["never painted for them."]
    friend.close: ["i'll paint you a sarong. any colour. not orange. i don't do orange."]
    friend.best: ["i painted your name in the border of my best length. small. only you'll find it."]
    famed: ["people in the kampung say your name. i hear it over the wax."]
    defamed: ["dye washes out. most things do."]
    gift: ["oh, thank you, dear."]
    gift.favorite: ["oh, that's a lovely thing. i'll have it with tea when the wax cools."]
    gift.again: ["one a day, dear. my hands need to stay steady."]

