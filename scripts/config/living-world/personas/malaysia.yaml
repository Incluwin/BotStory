      - { from: 23, to: 9, materialize: false }
  recruitable: false
  knows: [emo slime, scaredy scarlion, fantasy theme park 1]
  questLines: [farah-the-muddy-banks-footage, farah-the-opening-night, farah-the-carousel-turns]
  arc: farah-the-big-screen
  rumors: [kl-the-big-screen]
  relationships:
    - { persona: lim, kind: BRINGS_BROKEN_THINGS_TO }
    - { persona: ravi, kind: DRINKS_TEH_TARIK_AT_THE_STALL_OF }
    - { persona: awang, kind: HAS_NOT_MET }
  giftItemIds: [2022206, 2022209]
  dialogue:
    greetFirst: ["oh, hello. sorry, i'm framing a shot. you're in it now. that's fine. you look good on camera.", "welcome to the Trend Zone. if you see a camera, smile. it's probably mine."]
    greet: ["hello again.", "you. good. stand in the light.", "hi. we're live in ten. not you. me."]
    idle: ["(holds up two thumbs and two fingers in a square and frames the street through it)", "(scrolls through footage on a small camera, frowning, then smiling, then frowning again)"]
    noWork: ["nothing today. the news is slow. slow news is good news for everyone but me."]
    nothingDue: ["you're square with me. square like a frame."]
    who: ["Farah. i make the evening pieces for MY Maple TV, the big screen in the square. people, places, the city as it is. sometimes the city as it was."]
    bye: ["stay in frame."]
    thanks: ["thank you. that's a wrap."]
    smallTalk: ["the Emo Slimes on the outskirts get into every shot of the river. they sulk at the camera. i think they like it.", "Spinel flies people in from Boat Quay and Audrey brings them from the CBD. half of them stand in the square looking up at my screen. i love that."]
    speakPlainly: ["plainly: a camera and a big screen."]
    questOffer.farah-the-muddy-banks-footage: ["the evening news wants the Outskirts of Muddy Banks at sunset. the river, the mangroves. and no Emo Slimes in the shot. clear twenty and i'll get my sunset."]
    questAccept.farah-the-muddy-banks-footage: ["out the east road from the square. they sulk, then they bounce. mind the bouncing."]
    questWaiting.farah-the-muddy-banks-footage: ["twenty. the light's going."]
    questComplete.farah-the-muddy-banks-footage: ["twenty, and the sun on the water. that's the shot. here. you've a producer's eye. don't tell my producer."]
    questOffer.farah-the-opening-night: ["i found a tape in the station archive. 'Opening Night, Fantasy Theme Park'. thirty years old and chewed half through. Lim on the middle street mends anything. take it to him? then i want the park as it is now: Hibiscus Road and the park gates, for the follow-up."]
    questAccept.farah-the-opening-night: ["Lim first. middle central street, the stall with the radios. then out past the kampung, down Hibiscus Road to the gates. the Scaredy Scarlions are skittish. don't let them in the shot."]
    questWaiting.farah-the-opening-night: ["did Lim say anything? he goes quiet when he looks at old things."]
    questComplete.farah-the-opening-night: ["he mended it. he mended it! and the gates, just as they are. i'll put them side by side. we go out tonight on the big screen. come and watch."]
    questOffer.farah-the-carousel-turns: ["Bintang's home. Lim says the motor will still turn, and Tok Awang says the others will follow her. one night, one turn, and i film it. the road to the carousel has to be clear: Booper Scarlions on the second park, Vikerolas on the third. then ask Tok Awang if we may, and tell Lim we're ready."]
    questAccept.farah-the-carousel-turns: ["the park first. then the kampung: ask him properly. then Lim. i'll have the camera charged."]
    questWaiting.farah-the-carousel-turns: ["is the road clear? did he say yes?"]
    questComplete.farah-the-carousel-turns: ["he said yes. the kampung's children ride free. of course they do. that was always the deal. ...we turn it tonight. thank you. stand where you can see it go round."]
    about.lim: ["Lim mends radios on the middle street. he built half the rides at the Fantasy Theme Park, thirty years ago. ask him about the carousel and he goes quiet."]
    about.ravi: ["Ravi pulls the best teh tarik in the Trend Zone. a metre long, never spills. i've filmed it in slow motion. it's beautiful."]
    about.awang: ["Tok Awang, in the kampung. a woodcarver, they say. Lim talks about him like a man talks about weather."]
    aboutUnknown: ["never had them on camera. yet."]
    friend.close: ["you can stand behind the camera with me any time. it's the best seat in the city."]
    friend.best: ["i put you in the end credits of the evening piece. nobody reads the credits. i read them every night."]
    famed: ["people say your name in the square. i might put you on the big screen."]
    defamed: ["i've heard worse said on air. i cut it."]
    gift: ["oh, thank you."]
    gift.favorite: ["oh, that's lunch between takes. perfect. thank you."]
    gift.again: ["one a day. i'm on camera. i have to fit in the frame."]

