    bye: ["keep to the road."]
    thanks: ["thank you."]
    smallTalk: ["the Galloperas at the Spooky World's gate are the carousel horses. they walked off the night it went wild. they still go round in circles, if you watch.", "Devi spars with me at dawn. she's faster than me. she's never been through a night like that one. i hope she never is."]
    speakPlainly: ["plainly: a gate, and keys to it."]
    offer: ["sixty Galloperas at the Spooky World's gate, counted, and thirty thousand. i don't swear to anyone i haven't watched hold that gate. then i walk beside you, wherever."]
    join: ["lead. i'll watch the back."]
    bench: ["three days. then i go back to the east road."]
    leave: ["the east road, then."]
    refuse.bond: ["i don't walk with strangers. i've walked strangers out of a dark place. that's different."]
    refuse.flags: ["walk to the Spooky World's gate with me once. then ask."]
    refuseOwnErrand: ["the gate first."]
    questOffer.iskandar-the-night-gate: ["walk with me to the Spooky World's gate, at the far end of the park. the Galloperas guard it now. thirty of them. i locked that gate once. i want to see it."]
    questAccept.iskandar-the-night-gate: ["through the kampung, Hibiscus Road, all three parks. the gate's past the Vikerolas. you'll hear the hooves."]
    questWaiting.iskandar-the-night-gate: ["thirty."]
    questComplete.iskandar-the-night-gate: ["thirty, and the gate still standing. ...good. you held it. you can walk with me any time."]
    questOffer.iskandar-the-beheader: ["The Beheader. a heavy blade, honest. a new sword should be swung at something that swings back. the Vikerolas on the third park. forty."]
    questAccept.iskandar-the-beheader: ["the third park. the Viking ship. they'll come at you two at a time. be wider than them."]
    questWaiting.iskandar-the-beheader: ["forty."]
    questComplete.iskandar-the-beheader: ["forty. The Beheader. seven safe scrolls, every one took. honest steel. it'll tell you when you're wrong."]
    questOffer.iskandar-dragon-claymore: ["the Dragon Claymore. it wants the Galloperas, fifty, and fifteen of their tails. Tok Awang will want the tails. he made them."]
    questAccept.iskandar-dragon-claymore: ["the Spooky World's gate. they go round. wait for them to come round."]
    questWaiting.iskandar-dragon-claymore: ["fifty, and the tails."]
    questComplete.iskandar-dragon-claymore: ["the Dragon Claymore. seven sixties, every one took. it has a temper. keep yours."]
    questOffer.iskandar-timeless-nibleheim: ["the Timeless Nibleheim. the best sword i know. it wants the whole park walked back to front, the way i walked it that night: sixty Galloperas at the gate, forty Vikerolas, thirty Booper Scarlions. then home."]
    questAccept.iskandar-timeless-nibleheim: ["start at the back gate. walk out toward the kampung. don't run. i ran. walk."]
    questWaiting.iskandar-timeless-nibleheim: ["the whole park. back to front."]
    questComplete.iskandar-timeless-nibleheim: ["you walked it. the Timeless Nibleheim. two tens and five sixties, every one took. that's the last sword. it's yours. ...thank you. i've wanted someone to walk it out properly for thirty years."]
    questOffer.iskandar-pony-tails: ["ten Wooden Pony Tails off the Galloperas? i take them to the kampung. Tok Awang knows every one."]
    questAccept.iskandar-pony-tails: ["the Spooky World's gate."]
    questWaiting.iskandar-pony-tails: ["ten."]
    questComplete.iskandar-pony-tails: ["ten. he'll name every one. thank you."]
    about.lim: ["Lim built the rides. i guarded them. the night it went wild, he stayed with his motors until the last light went out. braver than he lets on."]
    about.devi: ["Devi. quick spear. she spars with me at dawn and wins on the second pass. i let her think it's the first."]
    about.kamal: ["Kamal, in the kampung. he rang the high-striker at the park every night. the night it went wild he carried children out on his shoulders. four at a time. i carried two."]
    aboutUnknown: ["i don't know them."]
    friend.close: ["you can stand the east road with me. it's quiet. we don't have to talk."]
    friend.best: ["i've given you a key. it opens nothing now. it opened the park's front gate. you're the only one i'd give it to."]
    famed: ["people say your name on the east road. well."]
    defamed: ["talk. the road doesn't care."]
    gift: ["thank you."]
    gift.favorite: ["good. the night's long. thank you."]
    gift.again: ["one a day."]

