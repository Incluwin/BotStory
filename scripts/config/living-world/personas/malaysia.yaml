    greetFirst: ["hm. a visitor. from the city? no. you walked. city people don't walk. sit, then. mind the shavings.", "assalamualaikum. sit. i'm carving. i'm always carving."]
    greet: ["hm. you.", "sit.", "mind the shavings."]
    idle: ["(draws a curl of pale wood off a block with a small curved knife, and blows the dust away)", "(runs a thumb along the grain of a half-carved horse's neck, and nods)"]
    noWork: ["nothing today. the wood's resting. so am i."]
    nothingDue: ["you owe me nothing. good. i don't like owing either."]
    who: ["Awang. Tok Awang, the children say. i carve. boats, doors, spoons. thirty years ago the city paid me to carve forty horses for its carousel, on the land where our rubber trees stood. i carved them well. that was my mistake."]
    bye: ["go on, then."]
    thanks: ["hm. thank you."]
    smallTalk: ["the Charmers on the last muddy bank play serunai. i carved those flutes for the park's snake-charmer show. they took them when the park went wild. they still play my tune. badly.", "the Galloperas at the far end of the park have wooden tails. i know every one. i made them. i don't go and look."]
