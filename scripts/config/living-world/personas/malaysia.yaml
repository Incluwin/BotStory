    famed: ["people say your name at the stall! between sips."]
    defamed: ["gossip is free at my stall. i don't believe all of it."]
    gift: ["for me? aiyo, thank you."]
    gift.favorite: ["aiyo, now that's good food. you sit down and share it with me."]
    gift.again: ["one a day! i'll get fat behind this counter."]

