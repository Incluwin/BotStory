# Malaysia cast (docs/ROUTES_MALAYSIA_PLAN.md section 5): 7 Residents in Kuala Lumpur's Trend Zone (kuala-lumpur) and 7
# in Kampung Village (kampung-village), 4 recruitable. Thirty years ago the city built the Fantasy Theme Park on the
# kampung's old rubber land; Tok Awang carved the forty horses of its carousel, and the kampung's children rode free on
# opening night. Two years later the park went wild and the city closed its gates. A television producer in the Trend
# Zone finds the opening-night tape (arcs/malaysia.yaml). The recruits carry the third regional tier of the two-handed
# sword, spear, one-handed axe and two-handed blunt lines, earned on the park's back roads.

# ---- Kuala Lumpur ----
