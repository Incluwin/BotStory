  giftItemIds: [2000004, 2022476]
  dialogue:
    greetFirst: ["evening. the east road's this way. it's quiet tonight. i'd like it to stay quiet.", "you walk like someone who's been through a gate in a hurry. so do i."]
    greet: ["evening.", "you.", "the road's quiet."]
