  giftItemIds: [2020004, 2000004]
  dialogue:
    greetFirst: ["hello, friend! you look like someone who'd wear a good earring. everyone does, once they've tried.", "welcome to the quay! sit. i'll show you a stone. no charge for looking."]
    greet: ["friend!", "you're back! i've cut a new stone.", "hello hello."]
    idle: ["(holds a small cut stone up to the light and turns it until it throws a bright spot)", "(counts the boats on the river under his breath, then pretends he wasn't)"]
    noWork: ["nothing today. the stones are cut. the boats are counted. don't tell Benedict."]
    nothingDue: ["we're even, friend. clear as a good stone."]
    who: ["Arjun. i cut stones and i hunt for them. the essences off the ghost ship's crew dry into the finest settings in Singapore. i'll set them in earrings for anyone who walks the path with me."]
    bye: ["shine bright, friend."]
    thanks: ["thank you, friend!"]
    smallTalk: ["the selkies on the ghost ship weep blue. dry it out and it's the best setting for a stone you'll ever see. sad, and very beautiful.", "Priscilla in the CBD sews capes. she wants my stones on her clasps. i want her silk on my boxes. we've been haggling for a year."]
    speakPlainly: ["plainly: stones, and a bow for getting them."]
    offer: ["seventy thousand for the day. it goes on my mother's garden, and her garden is very expensive. i'll walk with you all of it."]
    join: ["let's go, friend. i'll keep an eye out for stones."]
    bench: ["three days. then the stones want cutting."]
    leave: ["back to the quay, friend."]
    refuse.bond: ["i don't walk the path with strangers. the path doesn't like it either."]
    refuse.flags: ["walk the mysterious path with me once. then ask."]
    refuseOwnErrand: ["the path first. walk it with me."]
    questOffer.arjun-the-quay-run: ["walk the path with me. the tippos on the mysterious path, red and blue, thirty of each. they're slow. they're very stubborn."]
    questAccept.arjun-the-quay-run: ["the mysterious path, past the quay. the first stretch. they sit in the way."]
    questWaiting.arjun-the-quay-run: ["thirty and thirty, friend."]
    questComplete.arjun-the-quay-run: ["thirty and thirty. you walk the path well. come back any time. i'll have a stone ready."]
    questOffer.arjun-crystal-flower-earrings: ["Crystal Flower Earrings, for you. the setting wants pink, the pac pinkies' essence. thirty of them on the path and the ship's first deck, ten essences."]
    questAccept.arjun-crystal-flower-earrings: ["the mysterious path's second stretch, and the ghost ship's first deck. they're pink. they're angry."]
    questWaiting.arjun-crystal-flower-earrings: ["ten essences. the stones are cut."]
    questComplete.arjun-crystal-flower-earrings: ["ten. Crystal Flower Earrings. five safe scrolls, every one took. look how they throw the light. that's you, that is."]
    questOffer.arjun-gold-drop-earrings: ["Gold Drop Earrings. the setting wants blue. thirty selkie jrs. on the path's third stretch and the ship's fifth deck, ten blue essences. they weep. let them."]
    questAccept.arjun-gold-drop-earrings: ["the third stretch of the path, and the ship's fifth deck. they cry blue. it's sad. it's beautiful."]
    questWaiting.arjun-gold-drop-earrings: ["ten blue. careful, they're slippery."]
    questComplete.arjun-gold-drop-earrings: ["ten. Gold Drop Earrings. five sixties, every one took. they're the colour of the river at night."]
    questOffer.arjun-half-earrings: ["the Half Earrings. the best i've ever set. they want red, from Mr. Anchor on the ghost ship's sixth deck. thirty of them, ten red essences. he's heavy. hit him anyway."]
    questAccept.arjun-half-earrings: ["the ghost ship, all the way down to the sixth deck. he's an anchor. he's angry about it."]
    questWaiting.arjun-half-earrings: ["ten red, friend."]
    questComplete.arjun-half-earrings: ["ten. the Half Earrings. two tens and three sixties, every one took. one half for you, one half for the person you'd give the other half to. you know who."]
    questOffer.arjun-tippo-droppings: ["ten tippo droppings? my mother's garden's hungry again."]
    questAccept.arjun-tippo-droppings: ["the mysterious path."]
    questWaiting.arjun-tippo-droppings: ["ten."]
    questComplete.arjun-tippo-droppings: ["ten. my mother thanks you. so do her tomatoes."]
    about.benedict: ["Benedict let me count boats on the quay steps when i was small. i still count them. he still pretends not to see."]
    about.priscilla: ["Priscilla sews the best capes in the CBD. she wants my stones on her clasps. i want her silk. we haggle. we both win. we never admit it."]
    aboutUnknown: ["never cut a stone for them."]
    friend.close: ["any stone you find, bring it to me. i'll cut it first. free."]
    friend.best: ["i cut a stone the shape of your face. it's terrible. i love it. it's yours."]
    famed: ["people on the quay say your name like a good stone. clear, and worth something."]
    defamed: ["a stone's a stone, whatever they say."]
    gift: ["thank you, friend!"]
    gift.favorite: ["a stone-cutter's lunch! thank you!"]
    gift.again: ["one a day, friend. i've got to keep my hands steady."]

