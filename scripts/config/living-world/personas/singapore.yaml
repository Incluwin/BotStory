# Singapore cast (Regional Residents wave 3, docs/REGIONAL_RESIDENTS_PLAN.md section 9): 7 Residents in CBD
# (singapore-cbd) and Boat Quay Town (boat-quay-town), 2 recruitable. A widow on Boat Quay lights a lantern every night
# for the ghost ship's crew (arcs/singapore.yaml); her husband's lantern lies in Aqua Road's Grave of a Wrecked Ship
# (arcs/aquarium.yaml), and New Leaf City's paper wants her story (Ramona, personas/new-leaf-city.yaml). Singapore's
# fields stop at 68, so its two recruits carry armour: a run of earrings and a run of capes in that band.
- id: rosnah
  name: Rosnah
  look: { gender: female }
  title: "Lantern Keeper of Boat Quay"
  job: BEGINNER
  level: { min: 44, max: 46 }
  strength: SEASONED
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: boat-quay-town
    routine:
      - { from: 10, to: 17, spot: "venue:by-dave-iris", activity: LINGER }
      - { from: 17, to: 23, spot: "venue:lower-east-street", activity: LINGER }
      - { from: 23, to: 10, materialize: false }
  recruitable: false
  knows: [trucker, pac pinky, ghost ship]
  questLines: [rosnah-the-lantern-glass, rosnah-the-ghost-ship, rosnah-the-lantern-home]
  arc: rosnah-the-lanterns
  rumors: [sg-the-quay-lanterns]
  relationships:
    - { persona: siti, kind: AUNT_OF }
    - { persona: benedict, kind: KEEPS_THE_SHIP_RECORDS_WITH }
    - { persona: delmar, kind: NEVER_MET }
  giftItemIds: [2020004, 2000002]
  dialogue:
    greetFirst: ["selamat datang. welcome to Boat Quay. sit by the river. everyone does, in the end.", "hello, dear. you've come a long way. the river's good for long ways."]
    greet: ["hello, dear.", "you came back. good.", "sit a minute."]
    idle: ["(trims the wick of a small paper lantern and shields it from the wind with her hand)", "(watches the river as if she is waiting for a particular boat)"]
    noWork: ["nothing today, dear. the lanterns are made. tonight i'll light them."]
    nothingDue: ["you owe me nothing, dear. light a lantern sometime."]
    who: ["Rosnah. my Halim sailed on the ship that went missing twenty years ago. it waits still, the ghost ship, off the end of the mysterious path, full of lanterns and no crew. every night i light a lantern on the quay for them. so they can see their way home."]
    bye: ["walk safely, dear."]
    thanks: ["terima kasih, dear."]
    smallTalk: ["the truckers out in the suburban area carry headlights. the glass is just right for a lantern. Halim taught me that. he could make a lantern out of anything.", "Benedict keeps the harbour records. he's read me Halim's name off the old crew list so many times. he never minds."]
    speakPlainly: ["plainly: lanterns, for the crew."]
    questOffer.rosnah-the-lantern-glass: ["my lanterns want new glass. the truckers in the suburban area carry headlights, and the glass is just right. twenty-five truckers, ten headlights. Halim taught me that."]
    questAccept.rosnah-the-lantern-glass: ["the suburban area, just past the quay. the second one, off the first. they're big. they don't stop for anyone."]
    questWaiting.rosnah-the-lantern-glass: ["ten headlights, dear. the old glass is cracked."]
    questComplete.rosnah-the-lantern-glass: ["ten. look how they'll shine. Halim would have laughed. lanterns from truck lights. here, dear. for your kindness."]
    questOffer.rosnah-the-ghost-ship: ["i've never been aboard the ghost ship. i'm frightened to. would you go for me? the pac pinkies crowd the first deck. twenty-five of them. then look round. tell me if the lanterns are lit."]
    questAccept.rosnah-the-ghost-ship: ["the mysterious path, past the quay, and on to the ship. it doesn't sail. it waits."]
    questWaiting.rosnah-the-ghost-ship: ["are the lanterns lit, dear? are they?"]
    questComplete.rosnah-the-ghost-ship: ["they're lit. all of them but one. one hook's empty, you say. after twenty years, every other one still burns. they're waiting for somebody. so am i. thank you, dear. thank you for going."]
    questOffer.rosnah-the-lantern-home: ["dear. they say an old diver in Aquarium has Halim's lantern. still lit. i can't swim down there and i can't wait any longer. would you bring it home?"]
    questAccept.rosnah-the-lantern-home: ["Aquarium, at the bottom of the Aqua Road. the Center Hall. an old diver. carry it level, dear. please."]
    questWaiting.rosnah-the-lantern-home: ["is it coming? i've cleared a space for it on the rail."]
    questComplete.rosnah-the-lantern-home: ["oh. it's warm. it's still warm. ...Halim. you're home. ...thank you, dear. help me hang it. on the rail. straight. there."]
    about.siti: ["Siti's my sister's girl. she makes the lantern paper now. better than mine. don't tell her. she'll stop practising."]
    about.benedict: ["Benedict keeps the harbour records. he's kind. he reads me the crew list when i ask."]
    about.delmar: ["i don't know anyone by that name, dear."]
    about.ramona: ["Ramona? a reporter from New Leaf City, they say. she writes about the ghost ship. everyone does, sooner or later."]
    aboutUnknown: ["i don't know them, dear."]
    friend.close: ["you can light a lantern with me on the quay. any night. it helps. i don't know why."]
    friend.best: ["i lit a lantern for you last night. not for the crew. for you. so you'd always find your way back here."]
    famed: ["people on the quay say your name. kindly. that's the best way."]
    defamed: ["the river carries it off, dear."]
    gift: ["oh, thank you, dear."]
    gift.favorite: ["oh, that's lovely, dear. a long evening by the river, sorted."]
    gift.again: ["one a day, dear. i'm not a wishing well."]

- id: siti
  name: Siti
  look: { gender: female }
  title: "Lantern Maker's Apprentice"
  job: BEGINNER
  level: { min: 20, max: 22 }
  strength: ROOKIE
  loadout: beginner-townsfolk
