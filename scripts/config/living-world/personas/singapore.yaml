  recruitable: false
  knows: [biner, batoo, waste paper]
  questLines: [siti-the-lantern-paper, siti-the-lantern-frames]
  rumors: [sg-the-quay-lanterns]
  relationships:
    - { persona: rosnah, kind: NIECE_OF }
    - { persona: wei, kind: EATS_AT_THE_STALL_OF }
  giftItemIds: [2001001, 2020005]
  dialogue:
    greetFirst: ["hi! do you want a lantern? i made it. it's a bit wonky. the next one won't be.", "oh, hello! welcome to the quay. mind the paper. it's drying."]
    greet: ["hi!", "you're back! look, a new lantern!", "hello!"]
    idle: ["(folds a square of paper into a lantern, unfolds it, and folds it again tighter)", "(holds a finished lantern up to the light and checks every seam)"]
    noWork: ["nothing today. the paper's drying. i hate waiting. i'm waiting."]
    nothingDue: ["you're paid up! in lanterns."]
    who: ["Siti. my aunt Rosnah lights a lantern every night for the ghost ship's crew. i make the paper now. my uncle Halim was on that ship. i never met him. i make his lanterns anyway."]
    bye: ["bye! take a lantern!"]
    thanks: ["thank you!"]
    smallTalk: ["the biners on the central way are bins that walk. they carry waste paper. waste paper makes the best lantern paper. nobody believes me. it does.", "the batoos drop broken wings. thin, and strong. they make lantern frames. i've made forty. aunty says forty-one."]
    speakPlainly: ["plainly: lanterns. wonky ones."]
    questOffer.siti-the-lantern-paper: ["aunty's lanterns need paper. the biners on the central way carry waste paper, and it's the best. twenty biners, ten sheets."]
    questAccept.siti-the-lantern-paper: ["the central way, through the suburban area. the first and second stretches. they're bins. they walk. it's strange."]
    questWaiting.siti-the-lantern-paper: ["ten sheets! the frames are waiting."]
    questComplete.siti-the-lantern-paper: ["ten! aunty's going to say they're too good for waste paper. they're not. here, a lantern. it's only a bit wonky."]
    questOffer.siti-the-lantern-frames: ["the frames want broken wings. the batoos on the central way drop them. twenty batoos, ten wings. thin and strong. like aunty."]
    questAccept.siti-the-lantern-frames: ["the central way, the second and third. they flap. they're not good at it."]
    questWaiting.siti-the-lantern-frames: ["ten wings. that's forty-one lanterns."]
    questComplete.siti-the-lantern-frames: ["ten! forty-one! aunty's going to cry. she always does. it's good crying. here. thank you."]
    about.rosnah: ["aunty Rosnah lights a lantern every night for uncle Halim's ship. she says it helps them find their way. i think it helps her."]
    about.wei: ["Wei at the food centre gives me extra noodles. he says i'm too thin. i'm not. i eat them anyway."]
    aboutUnknown: ["i don't know them. do they want a lantern?"]
    friend.close: ["you can have the first lantern of every batch. it's always the wonkiest. it's always the best."]
    friend.best: ["i made a lantern with your name on it. it's the straightest one i've ever made."]
    famed: ["everyone on the quay says your name! i put it on a lantern!"]
    defamed: ["i don't put those on lanterns."]
    gift: ["for me? thank you!"]
    gift.favorite: ["oh WOW. that's lovely. that's going next to the lanterns."]
    gift.again: ["one a day! aunty says."]

- id: benedict
  name: Benedict
  look: { gender: male }
  title: "Harbour Clerk of the Quay"
  job: BEGINNER
  level: { min: 55, max: 57 }
  strength: SEASONED
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: boat-quay-town
    routine:
      - { from: 8, to: 16, spot: "venue:middle-central-street", activity: LINGER }
      - { from: 16, to: 20, spot: "venue:by-ralph-the-wanderer", activity: LINGER }
      - { from: 20, to: 8, materialize: false }
  recruitable: false
  knows: [octobunny, slimy, ink]
  questLines: [benedict-the-ledger-ink, benedict-the-ship-records]
  relationships:
    - { persona: rosnah, kind: READS_THE_CREW_LIST_TO }
    - { persona: arjun, kind: WATCHED_GROW_UP }
  giftItemIds: [2000002, 2001001]
  dialogue:
    greetFirst: ["name? no, sorry, habit. i log everyone who comes up the river. welcome to Boat Quay.", "hello. arrivals are logged, departures are logged, and visitors are welcomed. that's the third column."]
    greet: ["hello.", "you again. logged.", "welcome back."]
    idle: ["(writes a ship's name in a ledger in tidy capitals and blots it carefully)", "(turns the pages of a very old crew list, reading the names under his breath)"]
    noWork: ["nothing today. the river's quiet. the ledger isn't. it never is."]
    nothingDue: ["your line's ruled off. nothing outstanding."]
    who: ["Benedict. i keep the harbour records for Boat Quay. every ship in, every ship out, for thirty years. one ship never came back. i keep that page open."]
    bye: ["safe passage."]
    thanks: ["logged, with thanks."]
    smallTalk: ["the octobunnies on the mysterious path squirt the blackest ink there is. it doesn't fade. i write the ledger in it now. it's the only ink worth a ship's name.", "Rosnah asks me to read her the old crew list. i've read it so many times i know it by heart. i read it from the page anyway. it matters."]
    speakPlainly: ["plainly: the harbour ledger."]
    questOffer.benedict-the-ledger-ink: ["the ledger's ink fades. the octobunnies on the mysterious path squirt ink that doesn't. twenty-five of them, ten pots. a ship's name should last."]
    questAccept.benedict-the-ledger-ink: ["the mysterious path, past the quay. the second stretch. they squirt. step aside."]
    questWaiting.benedict-the-ledger-ink: ["ten pots. the page is waiting."]
    questComplete.benedict-the-ledger-ink: ["ten. black as the deep. i'll write today's ships in it tonight. here. logged, with thanks."]
    questOffer.benedict-the-ship-records: ["the ghost ship's manifest. it's still aboard, i'm sure of it, in the second hold. the slimies on the third stretch of the path and in the ship's second deck guard it. twenty-five of them. go and look. tell me if it's there."]
    questAccept.benedict-the-ship-records: ["the mysterious path to the ship. the second deck. it's dark. take a lantern. take one of Siti's."]
    questWaiting.benedict-the-ship-records: ["twenty-five, and the manifest. is it there?"]
    questComplete.benedict-the-ship-records: ["it's there? and the last line's in Halim's hand? 'boat down to the wreck at the bottom of the Aqua Road. lantern lit. back by dark.' he wrote it to the end. i'll tell Rosnah. gently. here. thank you."]
    about.rosnah: ["Rosnah lights a lantern every night. i read her the crew list when she asks. Halim's name is eleventh. she always stops me at eleven."]
    about.arjun: ["Arjun used to sit on the quay steps and count boats for me. now he counts gems. he still counts boats when he thinks i'm not looking."]
    aboutUnknown: ["not in the harbour ledger."]
    friend.close: ["i've given you a line in the ledger. arrivals, departures, and you."]
    friend.best: ["if you ever sail out, i'll keep your page open. as long as it takes."]
    famed: ["your name's in the ledger more than any ship's."]
    defamed: ["the ledger only takes facts."]
    gift: ["oh. thank you."]
    gift.favorite: ["thank you. a long night with the ledger, improved."]
    gift.again: ["one a day. it's in the harbour rules. i wrote them."]

