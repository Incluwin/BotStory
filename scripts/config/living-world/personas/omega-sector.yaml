# Omega Sector cast (Regional Residents wave 3, docs/REGIONAL_RESIDENTS_PLAN.md section 9): 7 Residents, 2 recruitable.
# The base at the foot of Eos Tower holds the line against the grays of Kulan Field and the machines of Boswell Field.
# Its radio operator hears a child talking on a dead channel every night at nine (arcs/omega-sector.yaml), and the
# child is in Korean Folk Town (arcs/korean-folk-town.yaml). Two recruits carry the third tier of the gun and the
# two-handed axe lines, earned in Ludibrium's clock tower above the base.
- id: lyra
  name: Lyra
  look: { gender: female }
  title: "Radio Operator of the Signal Hut"
  job: BEGINNER
  level: { min: 30, max: 32 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: omega-sector
    routine:
      - { from: 9, to: 14, spot: "venue:hq-entrance", activity: LINGER }
      - { from: 14, to: 19, spot: "venue:by-agent-m", activity: LINGER }
      - { from: 19, to: 23, spot: "venue:tunnel-door", activity: LINGER }
      - { from: 23, to: 9, materialize: false }
  recruitable: false
  knows: [ultra gray, planey, receiving apparatus]
  questLines: [lyra-the-antenna, lyra-the-dead-channel, lyra-the-trace]
  arc: lyra-the-quiet-channel
  relationships:
    - { persona: petra, kind: BORROWS_TOOLS_FROM }
    - { persona: rowan, kind: KEEPS_AN_EYE_ON }
    - { persona: bomi, kind: LISTENS_TO }
  giftItemIds: [2020005, 2000002]
  dialogue:
    greetFirst: ["hello. sorry, one ear's always on the set. what can i do for you?", "you're not on the duty roster. that's fine. nobody reads the duty roster."]
    greet: ["hello again.", "you. good. nothing's come in today.", "hi. keep your voice down, i'm listening."]
    idle: ["(turns a dial a hair to the left, listens, turns it back)", "(writes a single word on a pad, frowns at it, writes it again more neatly)"]
    noWork: ["nothing today. the channels are quiet. that's what you want on a base."]
    nothingDue: ["nothing owed. channel's clear."]
    who: ["Lyra. i run the signal hut. every message in and out of Omega Sector goes past my ear. mostly it's the General asking for tea."]
    bye: ["over and out."]
    thanks: ["copy that. thank you."]
    smallTalk: ["the ultra grays carry receivers. better than ours. i've asked the General for one. he says take one off a gray. so i will.", "the planeys up Eos Tower fly on little controllers. take the controller and they just sit there, buzzing. i feel bad. i take it anyway."]
    speakPlainly: ["plainly: the radio."]
    questOffer.lyra-the-antenna: ["my antenna won't hold a bearing. the planeys on Eos Tower's twenty-first and twenty-fourth floors fly on little controllers. twenty planeys, ten controllers, and i can point it where i like."]
    questAccept.lyra-the-antenna: ["Eos Tower, right above us. take the stairs up. they buzz."]
    questWaiting.lyra-the-antenna: ["ten controllers. the antenna's pointing at the floor."]
    questComplete.lyra-the-antenna: ["ten. look, it holds. i can hear the clock tower from here. here. for the climb."]
    questOffer.lyra-the-dead-channel: ["there's a channel nobody uses. it's dead. it hisses. but at nine, the hiss sounds like somebody talking. i need a gray receiver to hear it properly. the ultra grays out in Kulan Field carry them. twenty-five grays, ten receivers."]
    questAccept.lyra-the-dead-channel: ["Kulan Field, out past the base. the fourth and fifth fields. they're small. they're not friendly."]
    questWaiting.lyra-the-dead-channel: ["ten receivers. it's nearly nine."]
    questComplete.lyra-the-dead-channel: ["ten. i wired them in and i waited till nine. it's a voice. a child. talking to someone who isn't there. i've written down everything she said. here. thank you. i'll be on the set."]
    questOffer.lyra-the-trace: ["the girl's radio listens now. i've traced the signal to Black Mountain, over Korean Folk Town. go and stand on the mountain where it's strongest, the corner above the village, and then find her. ask her if i can talk to her. i don't want to frighten her."]
    questAccept.lyra-the-trace: ["Ludibrium, then the Helios Tower lift down to Korean Folk Town, then up to Black Mountain's corner. she'll be in the village. everybody knows her, i expect."]
    questWaiting.lyra-the-trace: ["did you find her? what did she say?"]
    questComplete.lyra-the-trace: ["she said yes? nine o'clock, every night. persimmons. all right. all right. i'm going to talk to her tonight. thank you. here. thank you."]
    about.petra: ["Petra can fix anything with a motor in it. she fixed my chair once. it didn't have a motor. it does now."]
    about.rowan: ["Rowan's the youngest cadet on the base. he fails every drill. he passes every kindness. i've told the General which one counts."]
    about.bomi: ["Bomi? i don't know anyone called Bomi."]
    about.hettie: ["Hettie keeps the stores. ask her for a pencil and she'll give you a form for a pencil."]
    aboutUnknown: ["never heard them on the radio."]
    friend.close: ["if you're ever out past the base and in trouble, call the signal hut. i'll hear. i always hear."]
    friend.best: ["i keep a channel open for you. nobody else uses it. it's just yours."]
    famed: ["your name's been on the radio. good things. i've logged them."]
    defamed: ["people say things about you on the radio. i log them. i don't believe the log."]
    gift: ["oh. thank you."]
    gift.favorite: ["oh! that's a night shift with something nice in it. thank you."]
    gift.again: ["one a day. i'm on duty."]

