    questAccept.rourke-rock-pieces: ["the warped path."]
    questWaiting.rourke-rock-pieces: ["ten."]
    questComplete.rourke-rock-pieces: ["ten. the jar's full. ha!"]
    about.vesper: ["Vesper holds the Kulan watch. she's the best shot on the base. she beats me at cards. she beats everyone at cards."]
    about.dmitri: ["Dmitri feeds me thirds. nobody else gets thirds. i don't ask why. i'm frightened he'll stop."]
    aboutUnknown: ["never stood in front of them."]
