    questAccept.rowan-the-watch-post: ["Eos Tower, nearly the top. it's a long way up. take the stairs. i always do. the lift scares me."]
    questWaiting.rowan-the-watch-post: ["twenty and twenty, and ten traps. the wires are very chewed."]
    questComplete.rowan-the-watch-post: ["ten traps! i set one already. i caught my own sleeve. it works! thank you, sir. ma'am. thank you."]
    about.vesper: ["Vesper's the best shot on the base. she's teaching me. she's very patient. she breathes out a lot. i think it's at me."]
    about.hettie: ["Hettie has a form for my boots. just my boots. i'm the only one with a form."]
    about.lyra: ["Lyra brings me tea on the night watch. she listens to the radio the whole time. she says it's company."]
    aboutUnknown: ["are they an officer? should i salute?"]
    friend.close: ["you can drill with me any morning. you'll pass. you always pass."]
    friend.best: ["when i pass the morning drill, i'm going to salute you first. not Medin. you."]
