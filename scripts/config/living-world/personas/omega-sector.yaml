  giftItemIds: [2000004, 2020004]
  dialogue:
    greetFirst: ["stand still. ...good. you'd make a terrible target. that's a compliment.", "new face. hands where i can see them. joking. mostly."]
    greet: ["you.", "back. good eyes today?", "hm. hello."]
    idle: ["(sights down an empty street, breathes out slowly, lowers the gun)", "(cleans a gun barrel with a rag, holds it to the light, cleans it again)"]
    noWork: ["nothing today. the watch is quiet."]
    nothingDue: ["even. nothing outstanding."]
    who: ["Vesper. i hold the Kulan watch. if a gray crosses the line, i see it. if it crosses twice, it doesn't. i train up in the clock tower. the base doesn't give me anything worth aiming at."]
    bye: ["watch your line."]
    thanks: ["noted."]
    smallTalk: ["the clock tower over Ludibrium is the best range in the world. the buffoons never stand still. neither do the teddies. it keeps you honest.", "Rourke says an axe is faster than a gun. we argue about it every evening. i've never once let him win."]
    speakPlainly: ["plainly: one gun, one line."]
    offer: ["sixty buffoons off the warped path, counted, and thirty thousand. they're my targets anyway. then i'll watch your back a shift."]
    join: ["let's go. i'll take the ones you don't see."]
    bench: ["three days. then i'm back on the watch."]
    leave: ["back to the line."]
    refuse.bond: ["i don't watch strangers' backs. i watch strangers."]
    refuse.flags: ["come up the clock tower with me once. sight in. then ask."]
    refuseOwnErrand: ["my range first. come and sight in."]
    questOffer.vesper-the-range: ["sight in with me. the buffoons on the warped path of time in the clock tower. thirty of them. don't stop moving. they won't."]
    questAccept.vesper-the-range: ["up Eos Tower, across Ludibrium, into the clock tower. the warped path. you'll hear them giggle."]
    questWaiting.vesper-the-range: ["thirty. keep your line."]
    questComplete.vesper-the-range: ["thirty, and you never stopped moving. good. you can stand behind me any day. not in front. behind."]
    questOffer.vesper-the-peacemaker: ["the Peacemaker. a gun that ends arguments. it wants a strap from the master death teddies in the lost time. thirty of them, fifteen bridles for the strap."]
    questAccept.vesper-the-peacemaker: ["the forgotten path of time, then the lost time behind it. they bite."]
    questWaiting.vesper-the-peacemaker: ["fifteen bridles. the strap's the hard part."]
    questComplete.vesper-the-peacemaker: ["fifteen. the Peacemaker. seven safe scrolls, every one took. it shoots true. so do you."]
    questOffer.vesper-concerto: ["the Concerto. i want it tuned on something that won't be still. thirty grim phantom watches in the forbidden time."]
    questAccept.vesper-concerto: ["past the phantom watches, into the forbidden time. they stop your clock. keep yours running."]
    questWaiting.vesper-concerto: ["thirty. keep your clock running."]
    questComplete.vesper-concerto: ["thirty. the Concerto. seven sixties, every one took. listen to it. that's the sound of a good line."]
    questOffer.vesper-dragonfire-revolver: ["the Dragonfire Revolver. the best gun i've ever seen. it wants the strap off Thanatos. three of them, in the forgotten passage. three straps."]
    questAccept.vesper-dragonfire-revolver: ["the forgotten passage, at the end of the forgotten path. Thanatos takes its time coming back. so can you."]
    questWaiting.vesper-dragonfire-revolver: ["three straps. be patient. it's a sniper's job."]
    questComplete.vesper-dragonfire-revolver: ["three. the Dragonfire Revolver. two tens and five sixties, every one took. it's yours. watch your line."]
    questOffer.vesper-targets: ["ten grandpa clocks? the buffoons' clocks make the best targets. they tick when you hit them."]
    questAccept.vesper-targets: ["the warped path. they giggle."]
    questWaiting.vesper-targets: ["ten."]
    questComplete.vesper-targets: ["ten. the range is full again."]
    about.rourke: ["Rourke carries an axe the size of a door. he's the best man on the base. don't tell him i said so. he'll get louder."]
    about.rowan: ["Rowan can't hit the broad side of a silo. he's getting better. i'm teaching him to breathe."]
    aboutUnknown: ["never had them in my sights."]
    friend.close: ["i'll watch your back on the Kulan line. anybody's who asks nicely. yours without asking."]
    friend.best: ["if you ever need a shot taken, i'll take it. from anywhere. i'll be there."]
    famed: ["people talk about you on the watch. i listen. i agree."]
    defamed: ["noted. i'll keep an eye on whoever said it."]
    gift: ["hm. thank you."]
    gift.favorite: ["that's a good one. i'll eat it on watch. slowly."]
    gift.again: ["one a day. i'm on the line."]

