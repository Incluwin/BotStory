  dialogue:
    greetFirst: ["cadet Rowan, sir! ...or ma'am. or... hello. sorry. i salute everyone. it's safer.", "are you an officer? you look like an officer. i'm going to salute you just in case."]
    greet: ["hello! i mean, sir! hello.", "you're back! i passed a drill today. nearly.", "hi!"]
