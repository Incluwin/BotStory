    thanks: ["thank you, sir!"]
    smallTalk: ["the trixters on Eos Tower's forty-third floor tie my bootlaces together. i don't know how. they're very small.", "Vesper's teaching me to shoot. she says breathe out before you pull. i keep breathing in. i'm going to get it."]
    speakPlainly: ["plainly: a cadet. still."]
    questOffer.rowan-the-first-drill: ["Officer Medin says my drill would pass if i'd ever fought anything. the trixters on Eos Tower's forty-third to forty-fifth floors. twenty-five of them. could you show me how? i'll watch. i'll take notes."]
    questAccept.rowan-the-first-drill: ["Eos Tower, up the stairs. forty-third floor. they tie your laces. watch your laces."]
    questWaiting.rowan-the-first-drill: ["twenty-five. i'm watching. i'm taking notes."]
    questComplete.rowan-the-first-drill: ["twenty-five! i wrote it all down. 'don't stand still. hit them.' that's it? that's it! i'm going to pass tomorrow. here, my ration. you earned it more."]
