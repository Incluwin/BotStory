    questComplete.rourke-colonian-axe: ["thirty! the Colonian Axe. seven safe scrolls, every one took. look at that edge."]
    questOffer.rourke-tavar: ["the Tavar. it wants a hat. a big one. thirty gigantic spirit vikings in the twisted time. they've got the biggest hats in the world."]
    questAccept.rourke-tavar: ["the warped path, the twisted time off the end. they're gigantic. so are you, today."]
    questWaiting.rourke-tavar: ["thirty. big hats, big friend."]
    questComplete.rourke-tavar: ["thirty! the Tavar. seven sixties, every one took. that's an axe for a heavy trooper."]
    questOffer.rourke-dragon-battle-axe: ["the Dragon Battle Axe. it wants the armband off the gatekeeper in the warped passage. three of them. three armbands. they hit back."]
