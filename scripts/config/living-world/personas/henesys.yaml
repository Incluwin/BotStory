    questComplete.gunnar-the-working-axe: ["here. seven of the sure scrolls on it, every one took. i've carried it ten seasons. it knows the work. so do you, now."]
    questOffer.gunnar-the-burnt-land: ["the Burnt Land grew the best timber on the island. iron hogs root up every sapling now. forty hogs, and fifteen of their hooves."]
    questAccept.gunnar-the-burnt-land: ["the hooves go over my shed door. old woodsman's habit. there's something in that shed for you, after."]
    questWaiting.gunnar-the-burnt-land: ["fifteen hooves. iron ones. the hogs won't miss them."]
    questComplete.gunnar-the-burnt-land: ["the Sabretooth. four seasons i saved for it. seven sixties, every one took, and it never felled a tree. it was waiting for you."]
    questOffer.gunnar-the-rising: ["the Rising. i felled the yew for Marrow's bow with it. go tell him it's yours now. then the Forest of Evil: thirty maladies, and Faust."]
    questAccept.gunnar-the-rising: ["Faust tears the old trees in there for sport. one clean swing. that's all he's owed."]
    questComplete.gunnar-the-rising: ["two tens and five sixties on it, every one took, the winter i turned forty. i'll miss the weight of it. it's yours, friend."]
    questOffer.gunnar-handle-wraps: ["every axe in Henesys has a handle i wrapped. i set the wraps with slime, boiled down. fifteen squishy liquids, if you've the time."]
    questAccept.gunnar-handle-wraps: ["the slimes in the forest south of Ellinia. they've plenty. they won't miss it."]
    questWaiting.gunnar-handle-wraps: ["fifteen squishy liquids. a wrap that slips is worse than none."]
    questComplete.gunnar-handle-wraps: ["that's a season of handles. here, for your trouble."]
    friend.close: ["you're good company. like an old tree at your back."]
    friend.best: ["if i ever plant another stand, the first tree's named for you. don't laugh. i mean it."]
    famed: ["well now. that's kind. i'll go red as a maple."]
    defamed: ["hm. thick bark. i'll live."]
    gift: ["kind of you. that'll see me through a season."]
    gift.favorite: ["now that's a proper gift. you've been listening. thank you, friend."]
    gift.again: ["one's plenty. a tree only needs so much rain."]
    about.marrow: ["Marrow. i felled the yew for the bow he still draws. he nods at me like i'm a tree he respects."]
    about.rurik: ["every post on Rurik's fence came off my saw. the boars still get through. that's not the posts' fault."]
    about.sorrel: ["Sorrel buys my oak offcuts for her stocks. she talks about springs the way i talk about trees."]
    aboutUnknown: ["never shared a fire with them."]

