    questAccept.sorrel-springy-horns: ["Pig Park II or the Blue Mushroom Forest. they hop. aim low."]
    questWaiting.sorrel-springy-horns: ["ten caps, with horns. a cap without a horn is just a hat."]
    questComplete.sorrel-springy-horns: ["oh, these are springy. listen. (boing) that's a trigger return if i ever heard one. thank you!"]
    questOffer.sorrel-the-mountain-crossbow: ["you've been such a help. so: my Mountain Crossbow, the one i carry. thirty wild boars on the East Rocky Mountain, ten teeth."]
    questAccept.sorrel-the-mountain-crossbow: ["the teeth are for the trigger. boar teeth don't rust. that's the whole secret. well, half of it."]
    questWaiting.sorrel-the-mountain-crossbow: ["ten teeth. wild boar ones. fire boar teeth crack."]
    questComplete.sorrel-the-mountain-crossbow: ["i rebuilt the trigger three times, then seven of the sure scrolls. every one took, click click click. my everyday bow. now it's yours."]
    questOffer.sorrel-the-heckler: ["the Heckler. a year's bolt money is in its springs. lupins argue with its click. forty lupins in the Monkey Forest, fifteen bananas."]
    questAccept.sorrel-the-heckler: ["they throw the bananas. shoot the banana, then the lupin. that's how i tested it."]
    questWaiting.sorrel-the-heckler: ["fifteen bananas. i'm calibrating. also i'm hungry."]
    questComplete.sorrel-the-heckler: ["the Heckler. seven sixties, and every one took. i nearly fainted at the fourth. a year's bolt money, and i'd spend it again on you."]
    questOffer.sorrel-the-rower: ["the Rower. a Florina fisherman's, traded for a summer of repairs. tell Senna it's leaving me. then forty clangs on the Hot Sand, ten claws."]
    questAccept.sorrel-the-rower: ["clang claws have a tiny perfect hinge. the sea made the best spring on the island and hid it in a crab."]
    questWaiting.sorrel-the-rower: ["ten claws. i'm taking one apart tonight. don't tell anyone."]
    questComplete.sorrel-the-rower: ["two tens and five sixties, every one took. four years i've tried to build its equal and couldn't. it's yours. listen to it click."]
    questOffer.sorrel-fletching-for-bolts: ["bolts need fletching and i'm always out. fifteen stiff feathers? the ribbon pigs at the farm shed them."]
    questAccept.sorrel-fletching-for-bolts: ["the Henesys Pig Farm. don't ask why pigs have feathers. i stopped asking."]
    questWaiting.sorrel-fletching-for-bolts: ["fifteen stiff feathers. stiff ones. floppy ones make bolts sulk."]
    questComplete.sorrel-fletching-for-bolts: ["fifteen. that's a whole crate of bolts. here, for the feathers."]
    friend.close: ["you're my favourite person to build things around. that sounded strange. i meant it nicely."]
    friend.best: ["if i ever build something better than the Rower, you fire it first. that's a promise, wound tight."]
    famed: ["oh! thank you. i'm going to tell my springs."]
    defamed: ["ouch. okay. i'll tighten something up."]
    gift: ["for me? this is going straight into a project. thank you."]
    gift.favorite: ["oh, you know me. exactly the right size. thank you!"]
    gift.again: ["you're too kind. one's plenty, i'm out of drawer space."]
    about.senna: ["Senna and i argue arrows versus bolts every market day. she's wrong, but she's wrong beautifully."]
    about.fenna: ["Fenna says crossbows are cheating. i say a bow is a crossbow that gave up halfway."]
    about.gunnar: ["Gunnar saves me his oak offcuts. best stocks i've ever made. he talks about them like old friends."]
    aboutUnknown: ["never fixed anything for them. yet."]

