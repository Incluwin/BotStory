  dialogue:
    greetFirst: ["you're bleeding. no? you will be. sit.", "hello! let me see your hands. hunters always lie about their hands."]
    greet: ["oh good, you're in one piece.", "hi! anything broken?"]
    idle: ["(sorts bandages by colour for no reason)"]
    noWork: ["everyone's healthy today. i'm suspicious."]
    nothingDue: ["you don't owe me. nobody does. i'm bad at business."]
    who: ["Ilse. i put hunters back together. some of them even say thanks."]
    bye: ["drink water!"]
    thanks: ["that's what i'm here for."]
    smallTalk: ["mushroom caps, believe it or not, make a decent salve."]
    speakPlainly: ["slow down, you'll pull something."]
    refuse.bond: ["i go where i'm needed. i don't know you need me yet."]
    offer: ["i'll come along and keep you standing. i just need the salve stock covered, that's all."]
    join: ["stay in range of me and you'll be fine.", "right behind you. don't be a hero."]
    bench: ["i'll be at the rooftop. don't come back in pieces."]
    leave: ["take care of yourself. i mean it."]
    refuseOwnErrand: ["you gather, i heal. that's the arrangement."]
    questOffer.ilse-herb-run: ["slime bubbles. fifteen. i boil them down for burns. the slimes at the tree don't mind, mostly."]
    questWaiting.ilse-herb-run: ["fifteen bubbles. slime ones."]
    questComplete.ilse-herb-run: ["perfect. here, the first jar's yours."]
    questOffer.ilse-slime-salve: ["orange caps and green caps, ten and ten. the boar-road hunters go through salve like water."]
    questComplete.ilse-slime-salve: ["that's a month of salve. Fenna will never know how close she came to running out."]
    about.dorran: ["Dorran sits on that bench every day. i bring him lunch. he pretends he doesn't notice."]
    aboutUnknown: ["never treated them."]

