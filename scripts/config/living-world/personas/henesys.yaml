    thanks: ["ha. anytime. it clicked, didn't it?"]
    smallTalk: ["the whole trick is the spring. too stiff and it fights you, too soft and it sulks.", "bows are pretty. crossbows are clever. don't tell Fenna i said she isn't clever."]
