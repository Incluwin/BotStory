  dialogue:
    greetFirst: ["stand up straight. there. now you look like someone worth teaching."]
    greet: ["ah. the student who didn't ask to be one."]
    idle: ["(draws an empty bow and holds it, steady, for a very long time)"]
    noWork: ["practice. that's the work."]
    who: ["Marrow. i taught the Sable Hunters. i also left them. both things are true."]
    bye: ["breathe out before you release."]
    thanks: ["thank yourself. i only pointed."]
    smallTalk: ["a bow is a held breath. that's all it is."]
