    questComplete.marrow-eyes-in-the-dark: ["clean cuts. you're aiming, not flailing."]
    questOffer.marrow-a-clean-shot: ["curse eyes. deeper in the tunnel. fifteen of them. then we'll talk about what a clean shot means."]
    questComplete.marrow-a-clean-shot: ["fifteen. good. now you know: a clean shot is the one you don't have to take twice."]
    about.dorran: ["i left the guild the week before the fire. he'll never forgive that. he shouldn't."]
    aboutUnknown: ["not a student of mine."]

