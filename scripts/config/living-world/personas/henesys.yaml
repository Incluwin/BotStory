# Henesys cast: hunters and the guild that failed. 10 residents, 3 recruitable (Fenna, Dorran, Ilse), 2 arcs.
- id: fenna
  name: Fenna
  title: "Hunter of the Boar Road"
  job: HUNTER
  level: { min: 24, max: 27 }
  strength: SEASONED
  loadout: hunter-bowman-l25
  personality: efficient-v1
  home:
    town: henesys
    routine:
      - { from: 5, to: 12, spot: "venue:east-town-benches", activity: LINGER }
      - { from: 12, to: 22, spot: "venue:central-square", activity: SOCIALIZE }
      - { from: 22, to: 5, materialize: false }
  recruitable: true
  contract: fenna-proof-of-aim
  questLines: [fenna-pig-problem, fenna-boar-teeth]
  benchToleranceDays: 5
  paceGap: 2
  relationships:
    - { persona: dorran, kind: RIVALS }
    - { persona: marrow, kind: RESPECTS }
  dialogue:
    greetFirst: ["you hold that weapon like it owes you money.", "hunter? no? you will be."]
    greet: ["back from the road?", "aim's steady today. yours?"]
    idle: ["(checks the fletching on an arrow)", "(watches the treeline)"]
    noWork: ["the road's quiet. suspicious, but quiet."]
    nothingDue: ["you're square with me."]
    who: ["Fenna. i keep the pig road passable. someone has to."]
    bye: ["straight arrows."]
    thanks: ["thank the bow."]
    smallTalk: ["boars are stupid but honest. i respect that."]
    speakPlainly: ["say it like you'd say it to a boar."]
    refuse.bond: ["i don't hunt with people i haven't hunted beside."]
    refuse.flags: ["show me you can shoot first."]
    offer: ["i'll come. but i want proof you won't get me killed: thirty pigs, on your own, and i'll count."]
    join: ["stay behind me and don't step on the boars.", "lead on. i'll watch the treeline."]
    bench: ["i'll be on the road. the pigs never stop."]
    leave: ["good hunt. find me at the benches."]
    refuseOwnErrand: ["you're the one who wanted to hunt. i'm the one who watches."]
    questOffer.fenna-pig-problem: ["pigs on the beach have gotten bold. twenty of them, and ten ribbon pigs. it's not hunting, it's gardening."]
    questComplete.fenna-pig-problem: ["thirty pigs. the beach owes you a nap."]
    questOffer.fenna-boar-teeth: ["wild boars past the crossroads. twelve teeth. mind the fire boars, they aren't a joke."]
    questWaiting.fenna-boar-teeth: ["twelve teeth. wild boar. not fire boar, i can tell."]
    questComplete.fenna-boar-teeth: ["twelve. you didn't come back singed. i noticed."]
    about.dorran: ["Dorran was guild. was. don't bring it up around him unless you want the speech."]
    about.marrow: ["Marrow taught half this town to shoot. the other half didn't listen."]
    aboutUnknown: ["never hunted with them."]

- id: dorran
  name: Dorran
  title: "Last of the Sable Hunters"
  job: FIGHTER
  level: { min: 33, max: 36 }
  strength: VETERAN
  loadout: perion-warrior-l30
  personality: efficient-v1
  home:
    town: henesys
    routine:
      - { from: 9, to: 24, spot: "venue:west-park-benches", activity: LINGER }
      - { from: 0, to: 9, materialize: false }
  recruitable: true
  contract: dorran-guild-debt
  questLines: [dorran-guild-banner, dorran-the-mushmom]
  arc: dorran-sable-guild
  rumors: [henesys-guild-hall-ashes]
  benchToleranceDays: 0
  paceGap: 3
  relationships:
    - { persona: fenna, kind: RIVALS }
    - { persona: ilse, kind: OWES }
    - { persona: marrow, kind: BLAMES }
  dialogue:
    greetFirst: ["the guild's gone. if that's what you're here about.", "no autographs."]
    greet: ["you.", "still here, hm."]
    idle: ["(polishes a guild crest that doesn't shine anymore)"]
    noWork: ["i've got nothing for you. nothing for anyone."]
    nothingDue: ["we're even. that's rare."]
    who: ["Dorran. the Sable Hunters had eleven members. you're looking at one."]
    bye: ["watch the treeline."]
    thanks: ["don't."]
    smallTalk: ["this bench used to be the guild's front step. now it's a bench."]
    speakPlainly: ["speak straight. i'm too old for riddles."]
    refuse.bond: ["i had ten people i trusted. i'm not looking for an eleventh."]
    refuse.arc: ["there's a fire you haven't heard about yet."]
    offer: ["one condition: the crest comes with us, and you carry a real blade for me. then the debt."]
    join: ["for the guild. whatever's left of it."]
    bench: ["i don't wait on benches. i've done enough of that. find me when you're serious."]
    leave: ["that's the last hunt under the crest. keep it."]
    refuseOwnErrand: ["that's guild business. mine."]
    questOffer.dorran-guild-banner: ["the guild banner's in the mushmom's grove. forty green mushrooms stand between it and me. go thin them."]
    questComplete.dorran-guild-banner: ["forty. the grove's quieter. the banner's still there, i can feel it."]
    questOffer.dorran-the-mushmom: ["the mushmom. she took the banner and three hunters. kill her with me. i want to see her fall."]
    questAccept.dorran-the-mushmom: ["finally. i've waited a year for someone to say yes."]
    questComplete.dorran-the-mushmom: ["...she's down. the banner's ours. i don't know what to do with my hands now."]
    about.marrow: ["Marrow was our guildmaster. he left before the fire. draw your own conclusions."]
    about.ilse: ["Ilse patched every one of us. she never sent a bill. i owe her more than meso."]
    about.fenna: ["Fenna shoots better than half the guild did. don't tell her."]
    aboutUnknown: ["not guild."]

