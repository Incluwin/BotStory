  name: Fern
  look: { gender: female }
  title: "Pupil of the Secretary of Magic"
  job: CLERIC
  level: { min: 33, max: 35 }
  strength: SEASONED
  loadout: cleric-l32
  personality: relaxed-v1
  home:
    town: mushroom-castle
    routine:
      - { from: 8, to: 14, spot: "venue:by-secretary-of-domestic-affairs", activity: LINGER }
