  giftItemIds: [2020006, 2020004]
  dialogue:
    greetFirst: ["halt! who goes there? ...a human. forgive me. i'm not used to looking anyone in the eye. Sir Percival, at your service.", "well met, traveller. you'll forgive the salute. the mushrooms don't salute. i do it for all of us."]
    greet: ["well met.", "ah, you. good day.", "at your service."]
    idle: ["(polishes a sword that is already shining, holds it up to check his reflection, and straightens his collar)", "(stands guard very straight beside a mushroom half his height, and nods to it)"]
    noWork: ["nothing today. the forest is patrolled. the towers are watched. i shall polish something."]
    nothingDue: ["we're square, on my honour."]
    who: ["Sir Percival. the only human knight the mushroom guard has ever had. i came looking for a dragon to fight when i was twelve. i found a kingdom that needed a door held. i've held it since."]
    bye: ["fare you well."]
    thanks: ["my thanks."]
    smallTalk: ["the helmet pepes in the towers wear helmets too big for them. the dents are from the mushroom guard's old armoury. i'd know. i put some of them there.", "King Pepe's own tailors made boots for his officers once. good boots. i've the pattern and i've the leather. all i need is the helmets off the pepes for the toe-caps."]
    speakPlainly: ["plainly: a sword, a door, and an oath."]
    offer: ["twenty-five thousand a day. a knight's wage, the Head Security Officer says. i'd do it for less. don't tell him. i'll ride with you wherever the road goes."]
    join: ["on my honour, then. lead on."]
    bench: ["three days. then the guard needs me back."]
    leave: ["back to my post. fare you well."]
    refuse.bond: ["i don't swear my sword to a stranger. forgive me. it's the oath."]
    refuse.flags: ["walk the forest patrol with me first. thirty renegade spores. then ask."]
    refuseOwnErrand: ["the patrol first. walk it with me."]
    questOffer.percival-the-forest-patrol: ["walk the forest patrol with me. the renegade spores in the secluded and isolated forests, and the deep forest past them. thirty of them. they go where they please. they shouldn't."]
    questAccept.percival-the-forest-patrol: ["down past the court, into the trees. they wander. you'll find them."]
    questWaiting.percival-the-forest-patrol: ["thirty. keep to the path."]
    questComplete.percival-the-forest-patrol: ["thirty. a clean patrol. you'd make a fine knight. you'd have to be knighted first. i could ask."]
    questOffer.percival-king-pepe-shoes: ["boots for you, from the King Pepe pattern, cut for your trade. i need the toe-caps: thirty helmet pepes in the towers, and ten of the helmets they drop. the towers are past the thorns, and the thorns open only for the court's Thorn Remover. do the Secretaries' errands first."]
    questAccept.percival-king-pepe-shoes: ["the castle towers, the first ones up the hill, and the security room if you're let in. the thorns let only the court's Thorn Remover by, so the Secretaries' errands first. the pepes wear their helmets low. aim for the dents."]
    questWaiting.percival-king-pepe-shoes: ["ten helmets. the leather's waiting."]
    questComplete.percival-king-pepe-shoes: ["ten. the King Pepe boots, cut for you. safe scrolls in every slot, every one took. a king's tailors made the pattern. a knight cut the leather. you'll walk well."]
    questOffer.percival-the-tower-boots: ["better boots, for the tower stairs, cut for your trade. the royal guard pepes in the high towers shoe their spear-butts with good iron. forty of them, and fifteen broken spears. past the thorns, mind. they open only for the court's Thorn Remover, so do the Secretaries' errands first."]
    questAccept.percival-the-tower-boots: ["the high towers, the fourth, fifth and sixth. the thorns open only for the court's Thorn Remover, so the Secretaries' errands come first. the pepes guard well. we'll guard better."]
    questWaiting.percival-the-tower-boots: ["fifteen spears. the hobnails are waiting."]
    questComplete.percival-the-tower-boots: ["fifteen. tower boots. sixties in every slot, every one took. you'll never slip on a stair again. i never have. well. once."]
    questOffer.percival-the-long-watch: ["the long watch. a knight's boots, the best i can make, cut for your trade. stand the whole watch with me: sixty royal guard pepes and sixty helmet pepes, every tower and the security rooms. then come back and tell me the towers are quiet. the thorns open only for the court's Thorn Remover, so do the Secretaries' errands first."]
    questAccept.percival-the-long-watch: ["all the towers. all of them. past the thorns, which open only for the court's Thorn Remover, so the Secretaries' errands first. it's a long watch. that's why it's called that."]
    questWaiting.percival-the-long-watch: ["sixty and sixty. stand your watch."]
    questComplete.percival-the-long-watch: ["sixty and sixty. a knight's boots, then. two tens and the rest sixties, every one took. walk tall in them. i'll know it's you by the sound."]
    questOffer.percival-helmets-for-the-forge: ["ten destroyed helmets? the forge is cold. they're up in the towers, and the thorns open only for the court's Thorn Remover. the Secretaries' errands first."]
    questAccept.percival-helmets-for-the-forge: ["the towers, past the thorns. they open only for the court's Thorn Remover, so the Secretaries' errands first."]
    questWaiting.percival-helmets-for-the-forge: ["ten."]
    questComplete.percival-helmets-for-the-forge: ["ten. the forge thanks you. so do i."]
    about.primrose: ["Lady Primrose corrects my bow every morning. too low, she says. so i bow lower. it's the only argument i've ever won."]
    about.barley: ["Barley's pigs charged me once. all of them. i stood my ground. they ran into a tree. i've never told anyone it wasn't me."]
    about.fern: ["Fern patches me up after the towers. she says i'm her best practice. i'm not sure that's a compliment."]
    about.wilmot: ["Wilmot feeds me like four mushrooms. i eat like three. the fourth one's for the road."]
    aboutUnknown: ["never crossed swords with them. or shaken hands."]
    friend.close: ["you have my sword. not literally. well. if you need it, literally."]
    friend.best: ["i've had your name put on the guard's roll of honour. it's a short roll. it was just me. now it's us."]
    famed: ["your name is spoken at court with honour. i've made sure of it."]
    defamed: ["name the one who said it. i'll challenge them. politely."]
    gift: ["you honour me."]
    gift.favorite: ["now that's a knight's supper. you've a good eye for what a long watch needs."]
    gift.again: ["one a day, friend. a knight still has to fit in his armour."]

