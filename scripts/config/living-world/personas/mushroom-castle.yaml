      - { from: 19, to: 8, materialize: false }
  recruitable: true
  knows: [poison mushroom, poison mushroom cap, intoxicated pig]
  contract: fern-the-healers-share
  questLines: [fern-the-first-lesson, fern-red-cross-earrings, fern-emerald-earrings, fern-cats-eye, fern-poison-caps]
