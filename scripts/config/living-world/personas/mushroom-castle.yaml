# Mushroom Castle cast (Regional Residents wave 4, docs/REGIONAL_RESIDENTS_PLAN.md section 10): 5 Residents, 2
# recruitable. The Mushroom Kingdom's court keeps to the forest field below the castle; the humans in it came through
# Henesys's Empty House or wandered in. Its baker was ordered to bake a wedding cake nobody wanted and bakes one for the
# kingdom instead, with the caps Brisa still sends him from Henesys (arcs/mushroom-castle.yaml). The stock story
# (Princess Violetta, King Pepe, the Prime Minister's wedding) belongs to the stock quests: every line here holds whether
# or not a given player has climbed the castle. Two recruits give armour in the castle's band: shoes for the player's
# class (Percival, the King Pepe boots first) and earrings (Fern). The profile has four venues, so Residents share them.
- id: wilmot
  name: Wilmot
  look: { gender: male }
  title: "Royal Baker of the Mushroom Kingdom"
  job: BEGINNER
  level: { min: 30, max: 32 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: mushroom-castle
    routine:
      - { from: 4, to: 11, spot: "venue:by-secretary-of-domestic-affairs", activity: LINGER }
      - { from: 11, to: 15, materialize: false }
      - { from: 15, to: 21, spot: "venue:by-secretary-of-domestic-affairs", activity: SOCIALIZE }
      - { from: 21, to: 4, materialize: false }
  recruitable: false
  knows: [renegade spores, mutated spore, castle wall edge]
  questLines: [wilmot-a-cake-for-no-one, wilmot-caps-from-home, wilmot-the-kingdoms-cake]
  arc: wilmot-the-kingdoms-cake
  rumors: [mc-the-kitchen]
  relationships:
    - { persona: primrose, kind: BAKES_FOR }
    - { persona: brisa, kind: GETS_CAPS_FROM }
    - { persona: percival, kind: FEEDS }
  giftItemIds: [2020002, 2020012]
  dialogue:
    greetFirst: ["mind the flour. it gets everywhere. it's in my eyebrows. it's been in my eyebrows thirty years.", "a human! from outside? sit down. i'll get you something warm. we don't get many of us."]
    greet: ["hello! mind the flour.", "you! there's bread.", "come in, come in. the oven's warm."]
    idle: ["(kneads a lump of dough, folds it, turns it, and kneads it again, humming)", "(dusts flour off his apron, which only moves it somewhere else)"]
    noWork: ["nothing today. the bread's proving. you can't hurry bread. i've tried. it sulks."]
    nothingDue: ["nothing owed. take a roll."]
    who: ["Wilmot. royal baker to the Mushroom Kingdom. i came through the Empty House in Henesys when i was nine, chasing a cat. i never found the way back. i never looked very hard. there was a kitchen."]
    bye: ["mind the flour on your way out. it'll follow you anyway."]
    thanks: ["oh, good. thank you."]
    smallTalk: ["the order came down from the Prime Minister's desk: a wedding cake, seven tiers, mutated-spore icing. for a wedding nobody in this kingdom wanted. it's pinned over my oven. i haven't touched it.", "the mushrooms here don't eat cake. they eat sunlight and gossip. i bake anyway. somebody has to remember what a cake is."]
    speakPlainly: ["plainly: bread, and an order i haven't filled."]
    questOffer.wilmot-a-cake-for-no-one: ["that order wants mutated-spore icing. the renegade spores in the forest carry it. go and clear twenty-five of them out, and bring me ten spores. they're going in the oven, every one. that's my answer to the order."]
    questAccept.wilmot-a-cake-for-no-one: ["down past the court, the secluded forest and the isolated one past it. they're the spores that wander. they're rude."]
    questWaiting.wilmot-a-cake-for-no-one: ["ten spores. the oven's hot."]
    questComplete.wilmot-a-cake-for-no-one: ["ten. into the fire. and the order with them. there. no cake. not that cake. not ever. here, take a roll. i feel lighter than a sponge."]
    questOffer.wilmot-caps-from-home: ["somebody in Henesys sends me a basket of caps every spring. Brisa. orange ones, from the field behind the Empty House. i'd like to bake with them this year. would you go and fetch the basket? there's always one waiting."]
    questAccept.wilmot-caps-from-home: ["Henesys. Brisa's in the park, or under a mushroom. one or the other."]
    questWaiting.wilmot-caps-from-home: ["did Brisa have the basket? there's always a basket."]
    questComplete.wilmot-caps-from-home: ["the basket! smell that. that's the field behind the Empty House. that's being nine. ...thank you. i know what i'm going to bake now."]
    questOffer.wilmot-the-kingdoms-cake: ["it's done. not a wedding cake. a cake for the kingdom, with Henesys caps in it. the guards on the castle wall eat last. they always have. clear twenty helmet pepes off the first two towers so nobody steals it on the way, carry it up to the wall, and come and tell me their faces. mind, the thorns up the hill open only for the court's Thorn Remover, so do the Secretaries' errands first."]
    questAccept.wilmot-the-kingdoms-cake: ["up the hill, past the thorns, the first two towers. then out along the wall. the thorns open only for the court's Thorn Remover, so the Secretaries' errands come first. carry it level. it's tall."]
    questWaiting.wilmot-the-kingdoms-cake: ["did they eat it? what did they say? what did their faces do?"]
    questComplete.wilmot-the-kingdoms-cake: ["they ate the lot? the whole thing? ...good. good. that's what cake's for. here. and a slice. i saved you a slice. i always save a slice."]
    about.primrose: ["Primrose comes to the kitchen to taste things she says she won't eat. she eats them. she's waited on the princess since they were both small."]
    about.brisa: ["Brisa sends me caps from Henesys every spring. we've never met. i think Brisa thinks i'm a mushroom."]
    about.percival: ["Percival's the only human in the guard. he eats like three mushrooms. i feed him like four."]
    about.barley: ["Barley's pigs got into my mash years ago. they've never been sober since. he says it's my fault. it's my fault."]
    about.fern: ["Fern practises her healing on my burns. i get a lot of burns. she's getting very good."]
    aboutUnknown: ["never baked for them. send them round."]
    friend.close: ["you can have the end of every loaf. the crusty end. that's the best bit. ask anyone."]
    friend.best: ["i'm going to name a bread after you. not a cake. a bread. bread's for every day. that's better."]
    famed: ["the court talks about you. with crumbs on their chins. that's the best way."]
    defamed: ["hm. whoever said that gets yesterday's bread."]
    gift: ["oh! for me? thank you."]
    gift.favorite: ["oh, a treat somebody else made! i never get treats somebody else made. thank you!"]
    gift.again: ["one a day, thank you. i'll get fat. fatter."]

- id: primrose
  name: Primrose
  look: { gender: female }
  title: "Lady-in-Waiting to Princess Violetta"
  job: BEGINNER
  level: { min: 26, max: 28 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: mushroom-castle
    routine:
      - { from: 9, to: 16, spot: "venue:by-scarrs", activity: LINGER }
      - { from: 16, to: 21, spot: "venue:by-secretary-of-domestic-affairs", activity: SOCIALIZE }
      - { from: 21, to: 9, materialize: false }
  recruitable: false
  knows: [poison mushroom, poison spore, royal guard pepe]
  questLines: [primrose-spores-for-the-dish, primrose-the-pennants]
  rumors: [mc-the-kitchen]
  relationships:
    - { persona: wilmot, kind: TASTES_FOR }
    - { persona: fern, kind: CONFIDES_IN }
    - { persona: percival, kind: CORRECTS_THE_BOW_OF }
  giftItemIds: [2020013, 2020009]
  dialogue:
    greetFirst: ["oh! a visitor. curtsey. no, you don't have to. i have to. it's my whole job.", "welcome to the court. it's mostly a field. we're very proud of the field."]
    greet: ["good day.", "oh, you. good. i need someone to tell things to.", "hello again. curtsey."]
    idle: ["(folds a lace handkerchief into a perfect square, unfolds it, and folds it again)", "(practises a curtsey, wobbles, and looks round to see if anyone saw)"]
    noWork: ["nothing today. the rooms are aired, the linen's folded, the gossip's sorted."]
    nothingDue: ["nothing outstanding. very proper."]
    who: ["Primrose. lady-in-waiting to Princess Violetta, since we were both small enough to hide under the throne. i keep her rooms ready, every morning, whatever's happening up the hill. a princess should always have somewhere to come back to."]
    bye: ["curtsey. off you go."]
    thanks: ["oh, how kind. thank you."]
    smallTalk: ["the vines at the end of the deep forest close up over the road. they open for a poison spore. they eat it, the greedy things. i keep a dish of spores by the door for the messengers.", "the royal guard pepes in the towers fly the castle's gold thread on their pennants. it's our gold. i've embroidered with that thread since i was six. i'd know it anywhere."]
    speakPlainly: ["plainly: the princess's rooms, and everything that goes in them."]
    questOffer.primrose-spores-for-the-dish: ["the spore dish by the door is empty, and a messenger can't get through the vines without one. the poison mushrooms in the forest drop them, one in ten if they're feeling generous. twenty of them, and three spores, please."]
    questAccept.primrose-spores-for-the-dish: ["the forest, down past the court. the purple ones. hold your breath. and don't go through the vines with the spores in your pocket. the vines take one every time you pass."]
    questWaiting.primrose-spores-for-the-dish: ["three spores. the messengers are waiting. they're very patient. they're mushrooms."]
    questComplete.primrose-spores-for-the-dish: ["three! the dish is full. well, three. three's full, for a dish. thank you. very proper."]
    questOffer.primrose-the-pennants: ["the royal guard pepes in the high towers fly pennants on their spears, in our gold thread. twenty of them, and ten broken spears, and i'll unpick the thread for the princess's sleeves. waste not. the towers are past the thorns, and the thorns open only for the court's Thorn Remover, so do the Secretaries' errands first."]
    questAccept.primrose-the-pennants: ["the castle's fourth, fifth and sixth towers, past the thorns. only the court's Thorn Remover gets through those, so the Secretaries' errands first. the pepes stand very straight. they're very rude."]
    questWaiting.primrose-the-pennants: ["ten spears. the needle's threaded."]
    questComplete.primrose-the-pennants: ["ten! look at that thread. still bright. the princess will have gold sleeves by spring. here, for you. curtsey."]
    about.wilmot: ["Wilmot bakes for the whole court. he came through a house in Henesys when he was nine and never went home. i taste everything he makes. i say i won't. then i do."]
    about.fern: ["Fern's the Secretary of Magic's pupil. i tell her everything. she writes some of it down. i don't ask which bits."]
    about.percival: ["Sir Percival is the only human knight in the guard. he bows to me every morning. too low. i've told him. he bows lower."]
    about.barley: ["Barley keeps pigs. drunk pigs. i don't discuss the pigs."]
    aboutUnknown: ["they're not at court. i'd know."]
    friend.close: ["you may come to court whenever you like. i've told the guard. they bow now. well. they try."]
    friend.best: ["i've embroidered your name on a handkerchief, in the gold thread. it's for the princess's own drawer. there's no higher honour. i checked."]
    famed: ["the whole court says your name. i make sure they say it properly."]
    defamed: ["gossip. i'd know. i run it."]
    gift: ["oh! how kind."]
    gift.favorite: ["oh, now that's a proper treat. i shan't share it. not even with the princess. well. a little."]
    gift.again: ["one a day is quite enough. a lady has limits."]

