  giftItemIds: [2000006, 2000003]
  dialogue:
    greetFirst: ["oh! hold still. you've got a scratch. there. gone. sorry. i do that. i'm practising.", "hello! are you hurt? you look hurt. everyone looks a little hurt to me. that's the training."]
    greet: ["hello! hurt anywhere?", "oh, you. hold still. no, you're fine.", "hi. i'm reading. i'm always reading."]
    idle: ["(reads a spell book with her finger under every word, mouthing them)", "(heals a wilting flower, watches it stand up, and writes something down quickly)"]
    noWork: ["nothing today. the Secretary's lesson is about patience. i'm being patient. i'm being so patient."]
    nothingDue: ["nothing owed. you're healed up, too. i checked."]
    who: ["Fern. pupil of the Secretary of Magic. i came from Ellinia to study under a mushroom. everyone laughed. the Secretary knows more about healing than all of Ellinia. i'm not laughing. i'm taking notes."]
    bye: ["don't get hurt. if you do, come back."]
    thanks: ["oh! thank you."]
    smallTalk: ["the poison mushrooms in the forest carry their own antidote in their caps. the Secretary showed me. you'd never think a poison would carry its own cure. that was the first lesson.", "the Secretary says a healer has to know what the wound feels like. i've been poisoned eleven times this month. i'm learning a lot."]
    speakPlainly: ["plainly: healing, and a lot of reading."]
    offer: ["thirty poison mushroom caps for the Secretary's shelves, and ten thousand for my books. then i'll come along and heal you wherever you go."]
    join: ["let's go! i've packed bandages. and a book."]
    bench: ["three days. then i've a lesson."]
    leave: ["back to my books. don't get hurt."]
    refuse.bond: ["i'd love to. but the Secretary says a healer should know who she's healing first."]
    refuse.flags: ["help me with my first lesson first. the poison mushrooms in the forest, and ten of their caps. then ask."]
    refuseOwnErrand: ["my lesson first. come and help."]
    questOffer.fern-the-first-lesson: ["my first lesson. the antidote's in the poison mushroom's own cap. twenty-five of them in the forest, and ten caps, and i'll brew it for the Secretary."]
    questAccept.fern-the-first-lesson: ["the forest past the court. the purple ones. if you get poisoned, come back. i'll practise."]
    questWaiting.fern-the-first-lesson: ["ten caps. the pot's on."]
    questComplete.fern-the-first-lesson: ["ten. it worked! the Secretary nodded. the Secretary never nods. here, for you. and i'll heal you for free. always."]
    questOffer.fern-red-cross-earrings: ["earrings, for you. emeralds. green for healing. i've blessed them. the setting wants mutated spore: twenty renegade spores in the forest, and ten spores."]
    questAccept.fern-red-cross-earrings: ["the forest past the court. the ones that wander. they glow a bit."]
    questWaiting.fern-red-cross-earrings: ["ten spores. the setting's ready."]
    questComplete.fern-red-cross-earrings: ["ten. emerald earrings. safe scrolls in every slot, every one took. green for healing. green for Ellinia. you're a little bit a healer now. that's how it works. i've decided."]
    questOffer.fern-emerald-earrings: ["a cat's eye. better than the emeralds. the Secretary trades me one for every batch of sobering draught, and the draught wants the intoxicated pigs' tails. don't ask. it works. twenty-five pigs on the steep downhill, and ten tails."]
    questAccept.fern-emerald-earrings: ["past the deep forest, through the vines. they open for a poison spore. then down the steep hill. the pigs are very loud."]
    questWaiting.fern-emerald-earrings: ["ten tails. it works. i promise."]
    questComplete.fern-emerald-earrings: ["ten. the draught's bubbling, and the cat's eye is yours. sixties in every slot, every one took. look into it. it looks back. that's how you know it's a good one."]
    questOffer.fern-cats-eye: ["eclipse earrings. the best stones i have. the Secretary says the castle's old magic only settles in a stone when the towers are quiet. quiet them for me: thirty helmet pepes and thirty royal guard pepes. the towers are past the thorns, and the thorns open only for the court's Thorn Remover, so do the Secretaries' errands first."]
    questAccept.fern-cats-eye: ["the castle towers, all the way up, and the security room if they let you in. the Secretaries' errands first: the thorns open only for the court's Thorn Remover. the pepes hit hard. come back. i'll be here."]
    questWaiting.fern-cats-eye: ["thirty and thirty. i can feel the stones warming. nearly."]
    questComplete.fern-cats-eye: ["thirty and thirty. eclipse earrings. two tens and the rest sixties, every one took. dark as the moon crossing the sun. that's the castle's old magic in there. it likes you."]
    questOffer.fern-poison-caps: ["ten poison mushroom caps? the antidote shelf's empty."]
    questAccept.fern-poison-caps: ["the forest."]
    questWaiting.fern-poison-caps: ["ten."]
    questComplete.fern-poison-caps: ["ten. the shelf's full. the Secretary nodded again. twice in a month."]
    about.percival: ["Sir Percival comes back from the towers with a new bruise every day. he's my best practice. i told him that. he looked hurt. then i healed it."]
    about.primrose: ["Primrose tells me everything that happens at court. i write down the useful bits. there aren't many. i write the others down too."]
    about.wilmot: ["Wilmot burns himself on the oven three times a day. i've got very good at burns. i think he does it to help me study. i think he's just clumsy."]
    about.barley: ["Barley's pigs are a medical marvel. they've been drunk for years and never once been ill. the Secretary wants to study them. the pigs don't."]
    aboutUnknown: ["never healed them."]
    friend.close: ["i'll heal you first. before anyone. even Sir Percival. don't tell him."]
