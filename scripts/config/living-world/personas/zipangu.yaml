  dialogue:
    greetFirst: ["hm. a traveller. you carry yourself well. sit, if you like. i don't talk much.", "you came up the road alone. good. most come in threes."]
    greet: ["hm.", "you.", "sit."]
    idle: ["(sits with his sword across his knees, eyes half closed, perfectly still)", "(draws a hand's width of blade, looks at the edge, and sheathes it without a sound)"]
    noWork: ["nothing today. the road is quiet. i don't trust it."]
    nothingDue: ["nothing owed."]
    who: ["Genzo. i have no master. i had one. now i have a gate and a cup of tea every evening that i didn't ask for. it's enough."]
    bye: ["walk well."]
    thanks: ["hm. thank you."]
    smallTalk: ["the bains in the hot spring past the cemetery wear spiked collars. somebody put them there. i'd like to meet them.", "Rin in Showa throws stars like rain. we spar on the road between the towns. she wins more than she should."]
    speakPlainly: ["plainly: a sword and a gate."]
    offer: ["sixty bains at the spa, counted, and thirty thousand. a ronin doesn't swear to a sword he hasn't watched. then i'll walk beside you, wherever."]
    join: ["hm. lead."]
    bench: ["three days. then i go back to the gate."]
    leave: ["the gate, then."]
    refuse.bond: ["i don't walk with people i don't know."]
    refuse.flags: ["come to the hot spring with me once. then ask."]
    refuseOwnErrand: ["the hot spring first."]
    questOffer.genzo-the-hot-spring: ["walk with me to the WanWan spa, past the cemetery. the bains. thirty of them. it's very hot. don't stand in the water."]
    questAccept.genzo-the-hot-spring: ["the road to the cemetery, then the spa. you'll smell it first."]
    questWaiting.genzo-the-hot-spring: ["thirty."]
    questComplete.genzo-the-hot-spring: ["thirty. you didn't stand in the water. good. you can walk with me any time."]
    questOffer.genzo-sparta: ["the Sparta. a plain blade, very good. a new blade should meet something sad before it meets something angry. the dreamy ghosts near the Buddha. thirty of them."]
    questAccept.genzo-sparta: ["Encounter with the Buddha, past the vanished village. the ghosts are sad. be quick with them."]
    questWaiting.genzo-sparta: ["thirty."]
    questComplete.genzo-sparta: ["thirty. the Sparta. seven safe scrolls, every one took. a plain blade. the best kind."]
    questOffer.genzo-dragon-carabella: ["the Dragon Carabella. it wants the black crow by the Buddha to have fallen to it. there's only one black crow. it comes back. slowly."]
    questAccept.genzo-dragon-carabella: ["Encounter with the Buddha. it sits above the ghosts. it's patient. be more patient."]
    questWaiting.genzo-dragon-carabella: ["one crow. wait for it."]
    questComplete.genzo-dragon-carabella: ["the crow's down. the Dragon Carabella. seven sixties, every one took. that blade has a temper. so do you. you'll get on."]
    questOffer.genzo-timeless-executioners: ["the Timeless Executioners. the best sword i know of. it wants the Showa gang's Lady Boss to have stopped. in the hideout's parlor. Konpei takes people in."]
    questAccept.genzo-timeless-executioners: ["Showa Town. Konpei. the hideout, the parlor. she's stronger than the Boss. everyone knows that but the Boss."]
    questWaiting.genzo-timeless-executioners: ["the Lady Boss. take friends."]
    questComplete.genzo-timeless-executioners: ["she's stopped. the Timeless Executioners. two tens and five sixties, every one took. that is the last sword. carry it well."]
    questOffer.genzo-spiky-collars: ["ten spiked collars off the bains? i'm studying who made them."]
    questAccept.genzo-spiky-collars: ["the hot spring."]
    questWaiting.genzo-spiky-collars: ["ten."]
    questComplete.genzo-spiky-collars: ["ten. same smith. hm."]
    about.chiyo: ["Chiyo brings me tea every evening. i said i don't need it. she brings it anyway. i drink it."]
    about.rin: ["Rin, in Showa. she throws stars like rain. she'd beat me if she stopped showing off."]
    aboutUnknown: ["i don't know them."]
    friend.close: ["you can sit at the gate with me. we don't have to talk."]
    friend.best: ["i had a master once. i have someone to walk beside now. it's better."]
    famed: ["people say your name at the gate. well."]
    defamed: ["talk. a sword doesn't."]
    gift: ["hm. thank you."]
    gift.favorite: ["hm. good. the gate's a long night."]
    gift.again: ["one a day."]

