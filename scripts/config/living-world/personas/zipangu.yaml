# Zipangu cast (Regional Residents wave 3, docs/REGIONAL_RESIDENTS_PLAN.md section 9): 4 Residents at the Mushroom
# Shrine (mushroom-shrine) and 3 in Showa Town (showa-town), 2 recruitable. The shrine bell has had no voice since its
# clapper vanished; it sits on the Showa gang Boss's desk in the hideout (arcs/zipangu.yaml). Two recruits carry the
# third tier of the one-handed sword and claw lines, earned in the haunted fields and the Showa hideout.
- id: chiyo
  name: Chiyo
  look: { gender: female }
  title: "Keeper of the Shrine Bell"
  job: BEGINNER
  level: { min: 40, max: 42 }
  strength: SEASONED
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: mushroom-shrine
    routine:
      - { from: 7, to: 17, spot: "venue:by-kino-konoko", activity: LINGER }
      - { from: 17, to: 22, spot: "venue:upper-central-benches", activity: SOCIALIZE }
      - { from: 22, to: 7, materialize: false }
  recruitable: false
  knows: [paper lantern ghost, big cloud fox, crow forest]
  questLines: [chiyo-the-shrine-lanterns, chiyo-the-silent-bell, chiyo-the-bell-rings]
  arc: chiyo-the-shrine-bell
  rumors: [zip-the-ronin-at-the-gate]
  relationships:
    - { persona: genzo, kind: BRINGS_TEA_TO }
    - { persona: isamu, kind: SWEEPS_THE_STEPS_WITH }
    - { persona: daichi, kind: HAS_NOT_MET }
  giftItemIds: [2022023, 2020005]
  dialogue:
    greetFirst: ["welcome to the shrine. you came with Spinel? everyone does. mind the steps. they're older than they look.", "a traveller. please, come up. the shrine's for everyone. even the mushrooms."]
    greet: ["welcome back.", "hello again.", "the steps are swept. come up."]
    idle: ["(sweeps the shrine steps in long, even strokes, though they are already clean)", "(stands at the foot of the bell tower and looks up at it for a while)"]
    noWork: ["nothing today. the shrine's quiet. it's supposed to be."]
    nothingDue: ["nothing owed. the shrine keeps no accounts."]
    who: ["Chiyo. i keep the shrine at Mushroom Shrine, and its bell, and its steps, and anything else nobody else wants to keep. my mother kept it before me."]
    bye: ["walk gently."]
    thanks: ["thank you. truly."]
    smallTalk: ["the paper lantern ghosts in the forest at night carry the old shrine lanterns. nobody knows how they got them. i'd like them back. the ghosts can keep the night.", "Spinel brings travellers from Lith Harbor and takes them home again. if you get lost here, ask her. that's what she's for."]
    speakPlainly: ["plainly: a shrine, a bell, and a lot of sweeping."]
    questOffer.chiyo-the-shrine-lanterns: ["the old shrine lanterns. the paper lantern ghosts carry them in the forest at night. twenty-five ghosts, ten lanterns. they don't drop many. they're fond of them."]
    questAccept.chiyo-the-shrine-lanterns: ["past the crow forest, into the night. A Night in the Forest, they call it. it's always night there."]
    questWaiting.chiyo-the-shrine-lanterns: ["ten lanterns. the steps are dark at night."]
    questComplete.chiyo-the-shrine-lanterns: ["ten. they still have our crest on them. look. i'll hang them on the steps tonight. here. for the walk."]
    questOffer.chiyo-the-silent-bell: ["the shrine bell's had no voice for three years. somebody took the clapper. a boy from Showa was seen on the steps that night. his name's Daichi. would you ask him? kindly. i don't think he's a bad boy. i think he was a frightened one."]
    questAccept.chiyo-the-silent-bell: ["Showa Town, down the road from the shrine. he works near the street market. ask him kindly."]
    questWaiting.chiyo-the-silent-bell: ["did you find him? what did he say?"]
    questComplete.chiyo-the-silent-bell: ["round the street Boss's neck, like a trophy. and Daichi was sent to take it, and he's been sorry ever since. thank you for asking him kindly. i'll think about what to do."]
    questOffer.chiyo-the-bell-rings: ["they say Daichi has the clapper back. back off the Boss's own neck. would you bring it up the steps for him? i don't think he can face the shrine yet. i'd like him to know it's all right."]
    questAccept.chiyo-the-bell-rings: ["Showa Town. tell him i'm not angry. i never was."]
    questWaiting.chiyo-the-bell-rings: ["is it coming? i've swept the steps three times."]
    questComplete.chiyo-the-bell-rings: ["it's whole. listen. no, wait, let me hang it. ...listen. there. there it is. thank you. and tell Daichi to come up the steps. tell him to come and hear it."]
    about.genzo: ["Genzo sits by the gate every night with his sword across his knees. he says he isn't guarding the shrine. i bring him tea anyway."]
    about.isamu: ["Isamu carves the fox masks for the festival. he's carved them for forty years. he still says every one's his worst."]
    about.daichi: ["Daichi? a boy from Showa. i've only heard of him. people say he's trying to be better. that's the hardest thing there is."]
    aboutUnknown: ["i don't know them. the shrine might."]
    friend.close: ["you can sweep the steps with me any morning. it's very good for thinking."]
    friend.best: ["i've written your name on a prayer board and hung it by the bell. it's for safe travels. you travel a lot."]
    famed: ["people say your name on the shrine steps. kindly, always."]
    defamed: ["the shrine hears worse. it forgives most of it."]
    gift: ["oh, thank you."]
    gift.favorite: ["thank you. i'll have it on the steps with my tea."]
    gift.again: ["one a day. the shrine teaches moderation. i'm still learning."]

