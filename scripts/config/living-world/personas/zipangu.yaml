    questWaiting.okiku-the-bath-fire: ["ten flames. the water's going lukewarm. i won't have lukewarm."]
    questComplete.okiku-the-bath-fire: ["ten. hot again. here. and you bathe free on my side. forever."]
    questOffer.okiku-the-charms: ["the leaders on the second street hand out charms to the boys they want. my boy had one. i want every one of them gone. twenty-five leader Bs, ten charms."]
    questAccept.okiku-the-charms: ["Showa Street, the second one. they'll be on the corners. they always are."]
    questWaiting.okiku-the-charms: ["ten charms."]
    questComplete.okiku-the-charms: ["ten. i'll put them in the furnace. here. thank you. that's ten boys they won't have."]
    about.daichi: ["my boy. he ran with the gang two years. he came home. i put him to work. he's a good boy. he always was."]
    about.rin: ["Rin, on my roof. she watches the street. she watches my boy. i chase her off. i leave her tea. both."]
    aboutUnknown: ["never had a bath here? they will."]
    friend.close: ["you bathe free. you know that. tell no one."]
    friend.best: ["you're family now. family gets the hot end of the bath."]
    famed: ["people say your name in the bathhouse. that's where the truth gets told."]
    defamed: ["whatever's said in the bath goes down the drain."]
    gift: ["oh. thank you."]
    gift.favorite: ["now that's a good supper after the last bath."]
    gift.again: ["one a day. i've a bathhouse to run."]

