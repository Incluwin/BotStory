  giftItemIds: [2000004, 2050004]
  dialogue:
    greetFirst: ["halt. ...no. go on. you're from before. i can tell. you stand like somebody who's never had to stand at a door.", "welcome to Twilight Perion, traveller. the door by Claudine goes back to your Temple. i keep it. you're welcome to go through. i'd rather you stayed a while."]
    greet: ["well met.", "you again. good. sit, if your knees let you. mine don't.", "hail."]
    idle: ["(stands beside the door with a mace in one hand and a dented shield on his arm, utterly still)", "(rubs at the dent on the corner of his shield with his thumb, as if it might come out)"]
    noWork: ["nothing today. the door's held. that's the whole of the work."]
    nothingDue: ["we stand square."]
    who: ["Ottmar. paladin, of an order nobody remembers. when the end came to Perion i swore to stand at the last door until the last of us was through. there's always another last of us. so i'm still here. i don't mind. it's a good door."]
    bye: ["go well, and come back through."]
    thanks: ["my thanks."]
    smallTalk: ["the mace i carry was a patrolman's, in a city of your years. an honest weapon. it doesn't do anything clever. it turns up. that's a paladin's whole creed, if you strip it down.", "the memory guardians on your Temple's roads were knights once, people say. they've forgotten what they guard. i think about that more than i'd like. i've not forgotten. not yet."]
    speakPlainly: ["plainly: an oath, a door, and bad knees."]
    offer: ["a hundred thousand, and sixty qualm monks on your Road of Regrets laid down from today, counted. then i'll stand at your door as i stand at this one."]
    join: ["lead. i'll hold behind."]
    bench: ["two days. then the door."]
    leave: ["back to the door."]
    refuse.bond: ["i stand beside those i know. it's no slight."]
    refuse.flags: ["walk the Road of Regrets' first stretch for me first: thirty qualm monks, twelve lengths of blue. then ask."]
    refuseOwnErrand: ["the blue cloth first."]
    questOffer.ottmar-the-first-stretch: ["the qualm monks on the Road of Regrets' first stretch, in your years. thirty, and twelve lengths of their blue cloth. i wrap the shield's grip with it. blue was the colour of my order. nobody else wears it now."]
    questAccept.ottmar-the-first-stretch: ["the Temple Keeper's door, the whole of Memory Lane, the Frozen Past, then the Road of Regrets. the first stretch. the monks carry their regrets. let them."]
    questWaiting.ottmar-the-first-stretch: ["twelve lengths. blue."]
    questComplete.ottmar-the-first-stretch: ["twelve. blue. ...it's good to see the colour. you fought like somebody who'd turn up. i'd stand beside you."]
    questOffer.ottmar-reverse-allargando: ["the memory guardians on Memory Lane's third stretch were knights who forgot. lay forty of them down, kindly. and there's a patrolman in a city of your years whose mace this was. Brody. ask him how he holds a line."]
    questAccept.ottmar-reverse-allargando: ["Memory Lane's third stretch. then New Leaf City, across the sea. he walks the town by day and the haunted road by night. find him by day."]
    questWaiting.ottmar-reverse-allargando: ["forty, and Brody's word."]
    questComplete.ottmar-reverse-allargando: ["'you hold it by turning up. every night. even the dull ones.' ...yes. that's the oath. and he does his paperwork? i don't. i should. here. the Reverse Allargando. every slot at sixty, every one took. turn up with it."]
    questOffer.ottmar-timeless-allargando: ["Henesys Ruins. the market and the park both. forty mutant snails between them. the ruins' folk come to my door when the snails get into their square. i'd like them to come to my door for something else."]
    questAccept.ottmar-timeless-allargando: ["not over the Southern Ridge. round by the doors: the Temple Keeper's door to the Gate to the Future, and in to Henesys Ruins. the market's west of the square, the park off it. forty, between them."]
    questWaiting.ottmar-timeless-allargando: ["forty."]
    questComplete.ottmar-timeless-allargando: ["forty. the Timeless Allargando. two tens and the rest at sixty, every one took. a weapon that turns up. as you did."]
    questOffer.ottmar-the-rocky-road: ["there's a woman in Dark Ereve, Anne, who keeps a vigil in the tiru forest, where the knights' road used to run. a door of her own, of a kind. thirty tiru round her, so she can sit an hour. one door-keeper to another."]
    questAccept.ottmar-the-rocky-road: ["the Temple Keeper's door to the Gate to the Future, then east into Dark Ereve: the tino forest, and the tiru forest beyond it. she'll be standing. we always are."]
    questWaiting.ottmar-the-rocky-road: ["thirty."]
    questComplete.ottmar-the-rocky-road: ["thirty. and she sat? good. an hour's a long time, at a door. the Timeless Allargando, and this one every slot a ten, every one took. no truer mace in any year. you've kept an oath you never swore. that's the best kind."]
    questOffer.ottmar-blue-cloth: ["ten lengths of blue? the grip's worn through."]
    questAccept.ottmar-blue-cloth: ["the Road of Regrets, the first stretch."]
    questWaiting.ottmar-blue-cloth: ["ten."]
    questComplete.ottmar-blue-cloth: ["ten. blue. thank you."]
    about.eskil: ["Eskil was my squire. the worst i ever had. the only one i ever had. he holds the hills now. i couldn't be prouder. i've never told him. he knows."]
    about.brand: ["Brand sings. on the road, at the forge, at my door. i swore an oath to stand here. i didn't swear to listen. i listen anyway."]
    about.heddwyn: ["Heddwyn tells a story about me. the oath, the door. he gets my knees wrong. they're worse."]
    about.ashe: ["Ashe takes the dent out of my shield. i put it back. she's never asked how. i've never told her. it's how we talk."]
    about.brody: ["Brody. a patrolman in a city of your years. this mace was his, once. an honest weapon. he must have been an honest man. it shows in the balance."]
    aboutUnknown: ["never stood a door with them."]
    friend.close: ["you may pass my door without a word. i'll still say one."]
    friend.best: ["if you ever stand at a door you can't hold, send for me. i'll come. it'll be the first time i've left this one. it'll be worth it."]
    famed: ["they speak your name with honour here. as they should."]
    defamed: ["i heard. i don't hold with talk at a door."]
    gift: ["you honour me."]
    gift.favorite: ["now that's a gift fit for a knight at a door. i'm in your debt."]
    gift.again: ["one's enough. a paladin keeps his belt where it is."]
