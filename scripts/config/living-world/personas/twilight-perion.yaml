    questOffer.eskil-the-trainees-hats: ["the trainees on the Road of Regrets' second stretch, in your years. thirty, and twelve of their blue cone hats. i line the spear-rest with the felt. the wood's split."]
    questAccept.eskil-the-trainees-hats: ["the Temple Keeper's door, Memory Lane, the Frozen Past, the Road of Regrets to the second stretch. don't hurry. they don't."]
    questWaiting.eskil-the-trainees-hats: ["twelve."]
    questComplete.eskil-the-trainees-hats: ["twelve. good felt. you walk steady. hm. good."]
    questOffer.eskil-reverse-diesra: ["the middle of the Road of Regrets. twenty trainees on the second stretch, twenty guardians on the third, twenty chiefs on the fourth. walk it end to end without stopping to think. that's what a spear's for."]
    questAccept.eskil-reverse-diesra: ["the Road of Regrets. second, third, fourth stretch, in that order. don't look back. the road's full of people who did."]
    questWaiting.eskil-reverse-diesra: ["twenty, twenty, twenty."]
    questComplete.eskil-reverse-diesra: ["sixty, and you didn't stop. the Reverse Diesra. every slot at sixty, every one took. it reaches. let it."]
    questOffer.eskil-timeless-diesra: ["Dark Ereve, past the Gate to the Future. the tiguru forest at the end of it. thirty-five tiguru. they're the worst of the three. good."]
    questAccept.eskil-timeless-diesra: ["the Gate to the Future, east into Dark Ereve, through the tiru forest to the tiguru forest off it. keep your back to a tree."]
    questWaiting.eskil-timeless-diesra: ["thirty-five."]
    questComplete.eskil-timeless-diesra: ["thirty-five. the Timeless Diesra. two tens and the rest at sixty, every one took. hm. it suits you."]
    questOffer.eskil-the-desolate-hills: ["my hills won't clear. they never will. the ruins' west hill can. Dark Spore Hill, past Henesys Ruins. the mushrooms come down it to the medic's door every night. thirty of them, and the ruins sleep a week. i'd like to know somebody slept a week."]
    questAccept.eskil-the-desolate-hills: ["the Temple Keeper's door to the Gate to the Future, in to Henesys Ruins, and west out of the square to Dark Spore Hill. they bite. you don't."]
    questWaiting.eskil-the-desolate-hills: ["thirty."]
    questComplete.eskil-the-desolate-hills: ["thirty. the ruins will sleep. the Timeless Diesra again, and this one every slot a ten, every one took. there's no longer reach in any year. ...thank you. i mean it. i don't say it."]
    questOffer.eskil-blue-cone-hats: ["ten blue cone hats? the felt's worn."]
    questAccept.eskil-blue-cone-hats: ["the Road of Regrets, the second stretch."]
    questWaiting.eskil-blue-cone-hats: ["ten."]
    questComplete.eskil-blue-cone-hats: ["ten. thanks."]
    about.brand: ["Brand sings on the road. he holds it. nothing off that ridge has once reached the town while he's on it. don't tell him. he'd sing about it."]
    about.ottmar: ["Ottmar keeps the door. he trained me. he says i was the worst squire he ever had. i was the only squire he ever had."]
    about.heddwyn: ["Heddwyn tells stories by the fire. i listen. i nod. it's enough."]
    about.ashe: ["Ashe keeps the fire. she's better at steel than me. i watch her to learn. she knows i watch."]
    about.gwang: ["Gwang. a tiger hunter in your years, under a mountain. this spear was his, once. he'd have hunted here. he'd have hated it. so do i."]
    aboutUnknown: ["no."]
    friend.close: ["i'd walk the hills with you without asking why."]
    friend.best: ["if you ever need a reach you don't have, send for me. i'll come. i won't say anything. i'll come."]
    famed: ["people say your name. hm. good."]
    defamed: ["talk. i don't listen to talk."]
    gift: ["hm. thank you."]
    gift.favorite: ["that's a good one. i'll take it to the hills."]
    gift.again: ["one."]

