# Sleepywood cast: the dungeon's toll. 5 residents, 2 recruitable (Thane the guide via an escort, Orrin the miner via a long chain), 1 arc.
- id: thane
  name: Thane
  look: { gender: male }
  title: "Dungeon Guide"
  job: CRUSADER
  level: { min: 40, max: 43 }
  strength: ELITE
  loadout: sleepywood-guide-l40
  personality: efficient-v1
  home:
    town: sleepywood
    routine:
      - { from: 6, to: 22, spot: "venue:central-camp", activity: LINGER }
      - { from: 22, to: 6, materialize: false }
  recruitable: true
  knows: [ant tunnel, sleepywood]
  contract: thane-guides-fee
  questLines: [thane-the-first-descent, thane-walk-me-down]
  arc: thane-last-descent
  rumors: [sleepywood-toll-of-the-tunnel]
  benchToleranceDays: 4
  paceGap: 4
  relationships:
    - { persona: orrin, kind: SAVED }
    - { persona: wilhelmina, kind: LODGES_WITH }
  dialogue:
    greetFirst: ["the dungeon takes a toll. i collect it up front, in caution.", "you're going down there. everyone who comes here is. sit first."]
    greet: ["still above ground. good.", "traveler."]
    idle: ["(counts the notches on a shield)"]
    noWork: ["the tunnel's quiet. it's lying."]
    nothingDue: ["no toll owed."]
    who: ["Thane. i guide people into the ant tunnel. i guide fewer back. i'm honest about the number."]
    bye: ["watch the third step. there is no third step."]
    thanks: ["thank the shield."]
    smallTalk: ["the dungeon isn't evil. it's just very, very hungry."]
    speakPlainly: ["plain. the tunnel doesn't do nuance."]
    refuse.bond: ["i don't descend with strangers. that's how the notches happen."]
    refuse.flags: ["walk with me once first. then ask."]
    offer: ["the guide's fee, and you walk me down once so i see how you move in the dark."]
    join: ["stay on my left. the shield's on the left."]
    bench: ["i'll be at the camp. the tunnel waits."]
    leave: ["you came back up. that's the whole job."]
    refuseOwnErrand: ["a guide doesn't scout for himself."]
    questOffer.thane-the-first-descent: ["evil eyes in the first tunnel. twenty. if you can't handle the eyes, you can't handle what's behind them."]
    questComplete.thane-the-first-descent: ["twenty eyes. you move well in the dark. rare."]
    questOffer.thane-walk-me-down: ["walk with me to the second tunnel. i'll follow you, not the other way. i want to see how you lead."]
    questAccept.thane-walk-me-down: ["lead, then. i'll be right behind."]
    questComplete.thane-walk-me-down: ["you led. i followed. i can work with that."]
    about.orrin: ["Orrin i carried out of the fourth tunnel. he went back the next week. miners."]
    about.wilhelmina: ["she keeps my room. i keep her guests alive. fair trade."]
    aboutUnknown: ["never guided them."]

- id: orrin
  name: Orrin
  look: { gender: male }
  title: "Tunnel Miner"
  job: PAGE
  level: { min: 36, max: 39 }
  strength: VETERAN
  loadout: perion-warrior-l30
  personality: relaxed-v1
  home:
    town: sleepywood
    routine:
      - { from: 5, to: 20, spot: "venue:west-camp", activity: LINGER }
      - { from: 20, to: 5, materialize: false }
  recruitable: true
  contract: orrin-the-deep-claim
  questLines: [orrin-eyes-and-tails, orrin-the-fourth-tunnel, orrin-what-the-ants-guard]
  rumors: [sleepywood-toll-of-the-tunnel]
  benchToleranceDays: 20
  paceGap: 2
  relationships:
    - { persona: thane, kind: OWES_LIFE }
  dialogue:
    greetFirst: ["there's ore down there. real ore. everyone thinks i'm mad. i'm rich-adjacent."]
    greet: ["hey! any luck below?", "the claim's still mine. mostly."]
    idle: ["(taps a pick against a rock that isn't ore)"]
    noWork: ["the seam's quiet. the ants aren't. tomorrow."]
    nothingDue: ["we're square. i keep a ledger. it's a rock."]
    who: ["Orrin. i mine the ant tunnel. the ants mine me back."]
    bye: ["don't breathe the deep air."]
    thanks: ["ore's on me. figuratively. it's rock."]
    smallTalk: ["the fourth tunnel has a wall that hums. Thane says leave it. Thane's usually right."]
    speakPlainly: ["simpler. i talk to rocks all day."]
    refuse.bond: ["i take partners i've dug beside."]
    refuse.flags: ["finish the claim work first. then we talk shares."]
    offer: ["partners, then. a share of the claim's yours if you cover the deep gear: the meso, and a real shield."]
    join: ["let's dig. metaphorically. also literally."]
    bench: ["i'll be at the claim. bring lamp oil."]
    leave: ["good dig. the seam's still down there."]
    refuseOwnErrand: ["that's my claim. i don't outsource the claim."]
    questOffer.orrin-eyes-and-tails: ["evil eye tails. twelve. i trade them to the shaman for lamp oil. don't ask what he does with them."]
    questComplete.orrin-eyes-and-tails: ["twelve tails. a month of light."]
    questOffer.orrin-the-fourth-tunnel: ["the fourth tunnel. go stand at the humming wall and come back. i need to know it's still humming."]
    questComplete.orrin-the-fourth-tunnel: ["still humming? good. or bad. one of those."]
    questOffer.orrin-what-the-ants-guard: ["curse eyes and cold eyes guard the deep seam. fifteen and ten. then the claim's clear and we're partners."]
    questComplete.orrin-what-the-ants-guard: ["the seam's clear. partners, then. shake. your hand's cold, that's the deep air."]
    about.thane: ["carried me out of the fourth tunnel on his back. i weigh a lot. i'm grateful in proportion."]
    aboutUnknown: ["never dug with them."]

