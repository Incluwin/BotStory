    questAccept.zara-the-claw-round: ["third and fourth floors, area A. up the escalator, left at the shoe shop with the shutters down."]
    questWaiting.zara-the-claw-round: ["thirty. keep your bag closed. they go for bags."]
    questComplete.zara-the-claw-round: ["thirty. no incidents. good round. you can walk with me any night."]
    questOffer.zara-the-uniform-top: ["a top for you, cut for your trade. Tina knows a tailor. the tailor wants the transformed claw machines on the third and fourth floors cleared first, areas C and D. they walk through her window. thirty of them."]
    questAccept.zara-the-uniform-top: ["third and fourth floors, areas C and D. the transformed ones. they're mostly air. hit them anyway."]
    questWaiting.zara-the-uniform-top: ["thirty. the tailor's measuring."]
    questComplete.zara-the-uniform-top: ["thirty. here, from the tailor. safe scrolls in every slot, every one took. it's a uniform now. you're on my round."]
    questOffer.zara-the-night-coat: ["something warmer for the night round, cut for your trade. the female mannequins on the fifth and sixth floors stand in the tailor's light. thirty of them, areas B and C."]
    questAccept.zara-the-night-coat: ["fifth and sixth floors, areas B and C. they pose. they pose with their fists."]
    questWaiting.zara-the-night-coat: ["thirty. the coat's cut."]
    questComplete.zara-the-night-coat: ["thirty. the night coat, cut for you. sixties in every slot, every one took. warm, and it doesn't rustle. a good coat for a round."]
    questOffer.zara-head-of-security: ["head of security wears the best coat in the building. that's me. i've had one made for you as well, for your trade. the male mannequins on the fifth and sixth floors, areas C and D. forty of them, and fifteen fedoras. the tailor wants the felt."]
    questAccept.zara-head-of-security: ["fifth and sixth floors, areas C and D. the big ones in hats. they tip the hat before they hit you."]
    questWaiting.zara-head-of-security: ["fifteen fedoras. the tailor's waiting on the felt."]
    questComplete.zara-head-of-security: ["fifteen. here. two tens and the rest sixties, every one took. that's the best coat in the building now. i'll get over it."]
    questOffer.zara-the-wigs: ["ten wigs off the female mannequins? Tina's asking again."]
    questAccept.zara-the-wigs: ["fifth and sixth floors."]
    questWaiting.zara-the-wigs: ["ten."]
    questComplete.zara-the-wigs: ["ten. Tina says thank you. she says it like it's my fault."]
    about.juno: ["Juno cleans the mall at night. she sees everything i see, an hour later, on her knees. if anything's wrong in this building, she finds the stain."]
    about.felix: ["Felix leaves his music on after closing. i've written him up nine times. i've never once turned it off."]
    about.kiko: ["Kiko hides in the lobby at closing. every night. i find him every night. i let him finish his tea first. that's not in the rules."]
    about.bao: ["Bao was here before the building. i walk past her cart and she hands me a bowl without looking up. i eat it standing. she hates that."]
    aboutUnknown: ["never written them up."]
    friend.close: ["you're on my round. permanent. nobody else is on my round."]
    friend.best: ["i've given you a key. it opens nothing. it's the principle. it's yours."]
    famed: ["your name comes up on my round. no incidents. good ones."]
    defamed: ["i've heard. i don't write up rumours."]
