    questAccept.felix-the-master-tape: ["seventh floor, by June, and the rooms past her if she lets you through. the oldies. they know all the words."]
    questWaiting.felix-the-master-tape: ["fifteen oldies. the press is warm."]
    questComplete.felix-the-master-tape: ["fifteen. the master. two tens and the rest sixties, every one took. that's one of one. like you. sorry. that was a lyric. it's still true."]
    questOffer.felix-restock: ["ten latest hits compilations? the shelf's empty again."]
    questAccept.felix-restock: ["seventh floor, by June."]
    questWaiting.felix-restock: ["ten."]
    questComplete.felix-restock: ["ten. restocked. they'll be gone by friday. they always are."]
    about.kiko: ["Kiko brings me tea and i let him sit in the back with the headphones. he likes the old stuff. kid's got ears."]
    about.zara: ["Zara's written me up nine times for leaving the music on after closing. i've seen her nod along on her round. it's in her report. in pencil."]
    about.bao: ["Bao's cart was here before the mall. i play her the night market songs. she says she doesn't know them. she mouths every word."]
    about.juno: ["Juno cleans the seventh floor at three in the morning. i leave three songs on for her. she's never said. the floor's always very clean round the speakers."]
    aboutUnknown: ["never sold them a record."]
    friend.close: ["you can have anything in the back. the good stuff. just ask."]
    friend.best: ["i've made you a mix. twelve songs. every one of them reminds me of something we did. it's very embarrassing. it's yours."]
    famed: ["people say your name like a song they can't get out of their heads. that's good. mostly."]
    defamed: ["bad reviews. i've had worse. so have the greats."]
    gift: ["oh, nice. thanks."]
    gift.favorite: ["oh, that's a treat. i'll have it with the next record. slowly. with the volume up."]
    gift.again: ["one a day. i've got a shop to run."]

