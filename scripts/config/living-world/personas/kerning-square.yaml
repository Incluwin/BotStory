    questAccept.felix-the-record-floor: ["seventh floor, up past the mannequins. June's at the door. the records are all round her, spinning."]
    questWaiting.felix-the-record-floor: ["thirty. they skip when you hit them. that's normal."]
    questComplete.felix-the-record-floor: ["thirty. quiet up there now. well, quieter. you've got good timing. you'd have made a good drummer."]
    questOffer.felix-the-first-pressing: ["trousers for you, made for your trade. a friend at Big Hit sews the stage clothes. she wants the cherry teas on the first and second floors shut up first. they play a jingle all day. thirty of them."]
    questAccept.felix-the-first-pressing: ["first and second floors, areas A, B and D. the red ones. hum something else while you do it."]
    questWaiting.felix-the-first-pressing: ["thirty. the jingle's still going."]
    questComplete.felix-the-first-pressing: ["thirty. silence. beautiful. here, from the stage seamstress. safe scrolls in every slot, every one took. first pressing. those are the good ones."]
    questOffer.felix-the-b-side: ["the b-side. better than the hit, always. another pair, made for your trade. the seamstress wants the kid mannequins on the fifth and sixth floors off her mood board. thirty of them."]
    questAccept.felix-the-b-side: ["fifth and sixth floors, areas A, B and D. little ones. they dance badly."]
    questWaiting.felix-the-b-side: ["thirty. flip it over."]
    questComplete.felix-the-b-side: ["thirty. the b-side. sixties in every slot, every one took. nobody knows about these. now you do."]
