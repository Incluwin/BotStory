# Kerning Square cast (Regional Residents wave 4, docs/REGIONAL_RESIDENTS_PLAN.md section 10): 5 Residents, 2 recruitable.
# The shopping mall the KerningTrain runs to was poured over Kerning's old night market. One noodle cart never left the
# lobby; its keeper wants the market's walled-in sign seen and its lost bell found (arcs/kerning-square.yaml), and the
# bell is with Sadie, Kerning City's foreman. Two recruits give armour made for the player's class in the mall's band:
# tops (Zara, mall security) and bottoms (Felix, the record-shop clerk).
- id: bao
  name: Bao
  look: { gender: female }
  title: "Noodle Cart of the Old Night Market"
  job: BEGINNER
  level: { min: 40, max: 42 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: kerning-square
    routine:
      - { from: 10, to: 17, spot: "venue:beside-robby-fray", activity: LINGER }
      - { from: 17, to: 22, spot: "venue:by-robby-fray", activity: SOCIALIZE }
      - { from: 22, to: 10, materialize: false }
  recruitable: false
  knows: [mango bubble tea, spirit of rock, kerning square lobby]
  questLines: [bao-the-noodle-cart, bao-the-old-sign, bao-the-poured-floor, bao-the-lobby-corner]
  arc: bao-the-night-market
  rumors: [ksq-the-cart]
  relationships:
    - { persona: kiko, kind: GRANDMOTHER_OF }
    - { persona: juno, kind: LEAVES_A_BOWL_FOR }
    - { persona: sadie, kind: SHOUTED_AT }
  giftItemIds: [2020011, 2020008]
  dialogue:
    greetFirst: ["sit. eat first. then tell me who you are.", "a new face in my lobby. you look thin. everybody looks thin to me."]
    greet: ["eat first.", "you again. good. sit.", "the broth's hot. it's always hot."]
    idle: ["(lifts the lid off a big pot, breathes in the steam, and puts the lid back without stirring)", "(wipes the same corner of the cart three times, then pats it like a dog)"]
    noWork: ["nothing today. the broth's made. the broth makes itself, if you stand next to it long enough."]
    nothingDue: ["you owe me nothing. eat something anyway."]
    who: ["Bao. i've kept this cart forty years. it stood on a street, in a night market, every night, before anybody poured a mall on top of us. they moved the stalls out. i didn't move."]
    bye: ["take a bowl for the road. the bowl comes back."]
    thanks: ["mm. eat."]
    smallTalk: ["when they built the mall they walled the market's sign into the eighth floor. i heard the hammers from down here. red letters. you could read them from the subway steps.", "the market rang a bell at dusk. it went missing the same week as the sign. nobody's rung anything in this lobby since but Thompson's till."]
    speakPlainly: ["plainly: noodles, and a market that used to be here."]
    questOffer.bao-the-noodle-cart: ["the mango teas upstairs drip sweet. boil it down and it makes a sauce you'd sell your shoes for. old market trick. twenty-five of the mango ones on the first and second floors, and ten mango bubbles."]
    questAccept.bao-the-noodle-cart: ["up the escalator, first and second floors, areas B, C and D. they're tea. they bite. don't drink them."]
    questWaiting.bao-the-noodle-cart: ["ten bubbles. the sauce is waiting."]
    questComplete.bao-the-noodle-cart: ["ten. smell that. that's the night market, that is. sit. this bowl's yours."]
    questOffer.bao-the-old-sign: ["the market's sign. they walled it in on the eighth floor, behind the record racks in the first hall. go up. thirty of those singing records off the wall and you can see the crack. look through it. tell me if it's still there."]
    questAccept.bao-the-old-sign: ["up past the mannequins, then the stairs to the seventh and eighth floors. the first hall. the records sing. loudly. the crack's low on the back wall."]
    questWaiting.bao-the-old-sign: ["did you see it? red letters. it's there. tell me it's there."]
    questComplete.bao-the-old-sign: ["still there. red letters, through the crack. 'the night market'. the paint's still red? ...sit down. no, sit. this bowl's on me. all of them are, today."]
    questOffer.bao-the-poured-floor: ["the bell went the same week as the sign. the woman who poured this floor might know where. Sadie, the foreman in Kerning. i shouted at her for a week, back then. go and ask her nicely. nicer than i did."]
    questAccept.bao-the-poured-floor: ["Kerning City, back down the subway. she'll be wherever something's being built. or knocked down."]
    questWaiting.bao-the-poured-floor: ["did she know? the bell?"]
    questComplete.bao-the-poured-floor: ["she kept it? she KEPT it. nineteen years in a site hut. ...i shouted at her for a week. i'm going to send her a bowl. every night. she'll hate it. here. thank you, child."]
    questOffer.bao-the-lobby-corner: ["the sign's up there. the bell's here. Kiko's been telling everyone about the cart. so. one night a week, this corner's a market again. i need twenty of the cherry teas upstairs knocked over, ten cherry bubbles for the ice, and somebody to give Kiko the bell. he's waited his whole life to ring it."]
    questAccept.bao-the-lobby-corner: ["the cherry teas, first and second floors. then the bell to Kiko. then back to me."]
    questWaiting.bao-the-lobby-corner: ["ten cherries for the ice. and the bell to Kiko."]
    questComplete.bao-the-lobby-corner: ["listen. there it goes. dusk, and Kiko's ringing it, and Thompson's come out with a table, and Lala's brought lanterns. it's a market. it's a market again. sit. eat first. then cry, if you want. i am."]
    about.kiko: ["Kiko's my grandson. he sells tea up and down the lobby and tells every customer i'm the best cook in Victoria. he's right. he's still a show-off."]
    about.juno: ["Juno mops the lobby all night. i leave a bowl under the cart for her, and it's on the cart in the morning, clean. eleven years. we nod. that's plenty."]
    about.sadie: ["Sadie poured this floor. i stood in the wet concrete and shouted at her crew. she waited till i'd finished, and then she poured it round me. we don't talk."]
    about.zara: ["Zara walks the mall all night with her hand on her belt. she eats standing up. i've told her. she eats standing up."]
    about.felix: ["Felix sells records on the seventh floor. he plays me the old market songs on his machine. i pretend i don't know the words."]
    aboutUnknown: ["never had a bowl at my cart. send them round."]
    friend.close: ["you've got a stool at my cart. nobody sits on it but you. i'll shout at them."]
    friend.best: ["i'm going to teach you the broth. nobody knows it but me. Kiko's next. you're before Kiko. don't tell him."]
    famed: ["they say your name at the cart. with their mouths full. that's the best way."]
    defamed: ["somebody said that at my cart? they'll get the bottom of the pot."]
    gift: ["for me? mm. thank you."]
    gift.favorite: ["oh, that's a proper late-night meal. somebody's fed you right."]
    gift.again: ["one a day. i'm the one who feeds people."]

