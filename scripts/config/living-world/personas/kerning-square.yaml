    - { persona: kiko, kind: FINDS_THE_COIN_OF }
  giftItemIds: [2020001, 2020005]
  dialogue:
    greetFirst: ["mind the wet floor. it's always wet. i'm always here.", "evening. or morning. at my hours it's the same thing with the lights off."]
    greet: ["evening.", "you. mind the floor.", "hm. still up?"]
    idle: ["(mops a slow figure-eight around a single spot, then stands back to look at it)", "(holds something small up to the light, pockets it, and writes on a tag)"]
    noWork: ["nothing tonight. the floor's clean. it won't last. nothing lasts but floors."]
    nothingDue: ["nothing owed. you left no mess."]
    who: ["Juno. i clean Kerning Square at night. eight floors and a lobby, one mop, and everything people drop. i keep it all. somebody always comes back for it. sometimes it takes years."]
    bye: ["go round the wet bit."]
    thanks: ["mm. thanks."]
    smallTalk: ["the perfume bottles on the third and fourth floors walk about after closing. they spill as they go. the whole floor smells like a wedding. i'm not invited.", "the mannequins on the fifth floor wear whatever gets left behind. i saw a kid mannequin in a bunny suit i was holding for a little girl. she came back for it. i had words with the mannequin."]
    speakPlainly: ["plainly: a mop, and a lost-and-found."]
    questOffer.juno-the-perfume-spills: ["the perfume bottles on the third and fourth floors spill every time they move. break thirty of them and i can mop the lot before morning. there's nothing in them worth keeping. believe me. i've checked."]
    questAccept.juno-the-perfume-spills: ["third and fourth floors. blue, yellow, pink. they don't fight back. they just smell."]
    questWaiting.juno-the-perfume-spills: ["thirty. the floor's still sticky."]
    questComplete.juno-the-perfume-spills: ["thirty. there. a floor you could eat off. don't. here, for your trouble. and for your nose."]
    questOffer.juno-the-lost-and-found: ["the kid mannequins on the fifth and sixth floors wear the bunny suits children leave behind. i've a tag for every one. twenty-five mannequins, ten suits back, and i can hand them over when the children come."]
    questAccept.juno-the-lost-and-found: ["fifth and sixth floors, areas A, B and D. small ones. they skip."]
    questWaiting.juno-the-lost-and-found: ["ten suits. the tags are waiting."]
    questComplete.juno-the-lost-and-found: ["ten. tagged. one of these has been waiting six years. somebody'll come. they always do. here."]
    about.zara: ["Zara walks the mall at night same as me. she checks every door twice. i mop every floor once. between us it's done right."]
    about.bao: ["Bao leaves a bowl under her cart for me every night. i leave it clean on the cart every morning. eleven years. we nod. that's plenty."]
    about.kiko: ["Kiko drops a coin under the escalator about once a week. same coin. i give it back. i think he drops it so i'll give it back."]
    about.felix: ["Felix leaves the record shop playing when he goes home. for me, he says. always the same three songs. i've started to like them. don't tell him."]
    aboutUnknown: ["never found anything of theirs."]
    friend.close: ["anything you lose in this mall, i'll find it. i'll keep it on the top shelf."]
    friend.best: ["i've a tag with your name on it, on the top shelf. nothing on it yet. if you ever leave something behind, i'd want to be the one keeping it."]
    famed: ["people drop your name about the mall. i pick it up. it's in good shape."]
    defamed: ["i've swept worse things than that off the floor."]
    gift: ["oh. thank you."]
    gift.favorite: ["that's the three-in-the-morning kind of food. the best kind. thank you."]
    gift.again: ["one a night. i've got floors to do."]

