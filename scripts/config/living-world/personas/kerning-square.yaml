  relationships:
    - { persona: bao, kind: GRANDSON_OF }
    - { persona: felix, kind: BORROWS_RECORDS_FROM }
    - { persona: zara, kind: HIDES_FROM_AT_CLOSING }
  giftItemIds: [2001001, 2001002]
  dialogue:
    greetFirst: ["tea? tea! cherry, mango, melon. not from upstairs. upstairs it walks around. mine stays in the cup.", "hi! you're new! i know everybody in the lobby. now i know you."]
    greet: ["tea?", "hi! grandma's got the broth on.", "you came back! people come back for grandma. you came back for me. i think."]
    idle: ["(shakes a cup of tea over his head like a maraca, then checks the lid)", "(counts coins into three piles, and then into two)"]
    noWork: ["nothing today! i sold every cup. i'm going to sell the cups next."]
    nothingDue: ["we're even! want tea? free. no, two mesos."]
    who: ["Kiko! i sell tea up and down the lobby. my grandma's Bao, she's got the noodle cart by Robby Fray. she was here before the mall. before the floor, even. she says the floor came later and stood on her."]
    bye: ["come back thirsty!"]
    thanks: ["thanks! grandma says say it twice. thanks!"]
    smallTalk: ["the bubble teas on the first floor are teas that got up and left. i'm not making that up. i'd just turned my back.", "grandma tells me about the night market every night. lanterns, and a bell at dusk, and the whole street out with a bowl. i've heard it four hundred times. i want to hear it again."]
    speakPlainly: ["plainly: tea, and my grandma."]
    questOffer.kiko-the-melon-pearls: ["my melon tea needs real melon bubbles. the melon teas on the first and second floors, area C. twenty-five of them, and ten bubbles. the ones off the wild teas are chewier. it's a secret. now it's ours."]
    questAccept.kiko-the-melon-pearls: ["up the escalator! area C! they're green! they're rude!"]
    questWaiting.kiko-the-melon-pearls: ["ten melon bubbles! they only drop one in five. i know. i counted."]
    questComplete.kiko-the-melon-pearls: ["ten! chewy! here, the first cup's yours. and potions. grandma says give people potions. people get hurt upstairs."]
    questOffer.kiko-the-claw-machine: ["the claw machines on the third and fourth floors walk around now. the jr. pepe ones grabbed my hat. twenty-five of them, area B. i don't need the hat back. i want them to know."]
    questAccept.kiko-the-claw-machine: ["third floor, fourth floor, area B. they've got pepe dolls inside. the dolls look sorry about it."]
    questWaiting.kiko-the-claw-machine: ["twenty-five! for the hat!"]
    questComplete.kiko-the-claw-machine: ["twenty-five! they'll think twice. they can't think. they'll grab twice. here, for you. for the hat."]
    about.bao: ["grandma kept her cart here when everyone else left. she says a market isn't a street, it's people who stay out late together. she stays out latest."]
    about.felix: ["Felix lets me listen to records in the back of his shop if i bring him tea. he's teaching me which ones are good. it's all the old ones."]
    about.zara: ["Zara chases me out of the mall at closing. she always lets me finish the cup first. she's nice. don't tell her i said."]
    about.juno: ["Juno mops at night. she found my lucky coin under the escalator once. she gave it back and said 'lucky for who?'"]
    aboutUnknown: ["never sold them a tea. i will!"]
    friend.close: ["your tea's free now. forever. grandma said so. i'd have said so anyway."]
    friend.best: ["when i'm big i'm having a stall. a real one. you're getting the first cup. i've already decided."]
    famed: ["everybody in the lobby says your name! i say it too. louder."]
    defamed: ["that's not true. grandma says people who say things like that need feeding."]
    gift: ["for me? thank you thank you!"]
    gift.favorite: ["WOW. that's sweeter than my tea. don't tell my tea."]
    gift.again: ["one a day! grandma's rule. she's got lots of rules."]
