  giftItemIds: [4032004, 2000004]
  dialogue:
    greetFirst: ["feet. look at your feet. no, you're fine. you stand like someone who's been hit and got up. that's the first stance. most people never learn it.", "a climber. good. the courtyard's for people who climb. you're early or late for drill. either way, stand there and watch."]
    greet: ["shoulders down. hello.", "you again. good. you're still standing."]
    idle: ["(runs through a long sword form, slow as a tide, then once more at full speed)", "(calls a count across the empty courtyard, as if a line of recruits were in front of her)"]
    noWork: ["nothing today. drill's done. i'm cooling down. i'm always cooling down."]
    nothingDue: ["we're square. stand straighter."]
    who: ["Ragna. drill mistress of the keep. the Masters teach the masters. i teach the people who want to be taught by the Masters. my mother was shield-bearer to the Banner Master. she lost him in the dark past the Sanctum's first door and came out alone, never knowing how far he got. she taught me the first stance. i teach it to everyone."]
    bye: ["shoulders down on the way out."]
    thanks: ["good. noted."]
    smallTalk: ["the windraiders in the tornado corridor are the best drill partners in the keep. they never stop moving. you learn to never stop moving, or you learn to lie down.", "the page watches me drill from behind the barrels. he's got a good stance. he doesn't know it yet. don't tell him yet."]
    speakPlainly: ["plainly: a sword, a courtyard, and a count."]
    offer: ["forty thousand, and twenty pieces of crimson wood. the drill posts are worn to splinters. you pay the posts, i'll come."]
    join: ["fine. i lead the line. keep up or keep out of the way."]
    bench: ["two days. then i've a courtyard to drill."]
    leave: ["drill's called. i'm going back to the posts."]
    refuse.bond: ["i don't march with people whose stance i haven't seen."]
    refuse.flags: ["come to drill first. then ask."]
    refuseOwnErrand: ["my drill. you can stand in the line."]
    questOffer.ragna-the-drill: ["drill. the real kind. the windraiders in the tornado corridor never stand still. forty of them. if you're still standing after, you've learned more than a month in my courtyard."]
    questAccept.ragna-the-drill: ["the tornado corridor, off the Hall of Mastery. the windraiders. they'll come at you from the side. turn with them."]
    questWaiting.ragna-the-drill: ["forty. keep moving."]
    questComplete.ragna-the-drill: ["forty. and still standing. good. that's the drill. now you know how the courtyard feels."]
    questOffer.ragna-stonetooth: ["Stonetooth. the first great sword my mother gave me. it wants a new grip, ten pieces of crimson wood off the crimson trees, the heart of the tree. and clear thirty firebrands out of the inferno chamber. they've been burning the posts."]
    questAccept.ragna-stonetooth: ["the inferno chamber, off the Hall of Mastery. the firebrands. they're hot. don't stand where they've been. then the crimson trees on the lower ascent or the path of strength for the wood."]
    questWaiting.ragna-stonetooth: ["thirty firebrands, and ten pieces of wood. the posts are smouldering."]
    questComplete.ragna-stonetooth: ["thirty. the posts'll mend. Stonetooth. seven safe scrolls, every one took. it bites. let it."]
    questOffer.ragna-dragon-claymore: ["the Claymore. a dragon blade. the nightshadows in the caverns of honour and valour carry a darkness that tempers steel. thirty of them, and walk the cavern of fortitude end to end. my mother did it before every hard fight."]
    questAccept.ragna-dragon-claymore: ["the nightshadows in the cavern of honour, off the path of strength, or valour, off the upper ascent. then fortitude, end to end. don't hurry fortitude."]
    questWaiting.ragna-dragon-claymore: ["thirty, and fortitude. walk it all."]
    questComplete.ragna-dragon-claymore: ["you walked it. ...good. Dragon Claymore. seven sixties, every one took. my mother would have liked you. she didn't like anyone."]
    questOffer.ragna-reverse-nibleheim: ["the Nibleheim. reverse. my best. go into the Inner Sanctum with a party, the way she did, and come out. that's all. come out. then it's yours."]
    questAccept.ragna-reverse-nibleheim: ["the Hall to the Inner Sanctum. Jack takes parties in. clear it to the Council Hall. and come back. that's the part that matters."]
    questWaiting.ragna-reverse-nibleheim: ["the Sanctum. and back. i'll be at the posts."]
    questComplete.ragna-reverse-nibleheim: ["you came out. ...good. that's what she did. Reverse Nibleheim. two tens and five sixties, every one took. carry it out of every place you walk into."]
    questOffer.ragna-the-sanctum-again: ["into the Sanctum again? the statue in the Council Hall keeps a jawbone in its fist. the Bosshunter smiths want them. clear it and bring one back."]
    questAccept.ragna-the-sanctum-again: ["the Hall to the Inner Sanctum. with a party."]
    questWaiting.ragna-the-sanctum-again: ["the Council Hall."]
    questComplete.ragna-the-sanctum-again: ["back again. here's your jawbone. Barricade'll know what to do with it."]
    about.ivor: ["Ivor holds the gate. i hit harder. he blocks better. we've sparred four hundred times. it's two hundred each. he says it's two hundred and one."]
    about.wat: ["Wat. the page. he watches me drill from behind the barrels. he's got my mother's stance. he doesn't know it. i'm going to tell him at dawn tomorrow."]
    about.aldwin: ["Aldwin was the Banner Master's squire. my mother carried the shield. Aldwin carried the flagpole when it was too heavy for Leofric's other hand. they're the only two who knew him. now it's only Aldwin."]
    aboutUnknown: ["never seen them drill."]
    friend.close: ["you've a place in the line now. front row. don't make me regret it."]
    friend.best: ["if i ever go into the Sanctum again, you're the one at my back."]
    famed: ["the keep speaks well of you. stand up straighter. you've earned it."]
    defamed: ["the keep speaks ill of you. shoulders down. let it pass."]
    gift: ["oh. thanks."]
    gift.favorite: ["oh, that's useful. that's going in my kit. by the whetstone."]
    gift.again: ["one a day. i've a kit, not a cart."]

- id: fennick
  name: Fennick
  look: { gender: male }
  title: "Scout of the Upper Ascent"
  job: HERMIT
  level: { min: 100, max: 103 }
  strength: ELITE
  loadout: masteria-claw-l100
  personality: relaxed-v1
  home:
    town: crimsonwood-keep
    routine:
      - { from: 9, to: 13, materialize: false }
      - { from: 13, to: 17, spot: "venue:lower-east-street", activity: REST }
      - { from: 17, to: 20, spot: "venue:upper-east-street", activity: SOCIALIZE }
      - { from: 20, to: 9, materialize: false }
  recruitable: true
  knows: [nightshadow, elderwraith, crimsonwood mountain]
  contract: fennick-the-scouts-price
  questLines: [fennick-the-caverns, fennick-red-craven, fennick-dragon-green-sleve, fennick-reverse-lampion]
  benchToleranceDays: 2
  paceGap: 2
  relationships:
    - { persona: ivor, kind: STANDS_WATCH_WITH }
    - { persona: quentin, kind: BRINGS_ASH_TO }
    - { persona: ragna, kind: TEASES }
  giftItemIds: [4032011, 2000006]
  dialogue:
    greetFirst: ["don't look round. no, don't. there's a nightshadow on the third rock up. it's asleep. i'd like it to stay asleep. hello.", "a new face on the mountain. i saw you from the upper ascent an hour ago. you climb well. you stop too often to look at the view. so do i."]
    greet: ["hey. i've been up the ascent. it's still there.", "you again. good. i was getting tired of talking to rocks."]
    idle: ["(flips a throwing star end over end across his knuckles without looking at it)", "(sketches a quick map in the dirt with the point of a claw, then scuffs it out)"]
    noWork: ["nothing today. i scouted. the mountain's being quiet. that's worse than loud."]
    nothingDue: ["we're square. i keep count. i keep count of everything."]
    who: ["Fennick. i scout the upper ascent and the caverns for the keep. where the nightshadows are thick, where the firebrands have moved to, which cavern's caved in this week. Ivor holds the gate. i tell him what's coming at it. he says thank you by not saying anything."]
    bye: ["watch the ledges on the way down. they watch you."]
    thanks: ["oh, cheers."]
    smallTalk: ["six caverns off the ascent and the paths. fear, pain, shame, honour, fortitude, valour. and a seventh nobody's named, because nobody's come back out to name it. i'm going to name it. i've got a list.", "Quentin wants elder ashes for Ridley's ink. i bring him a pocketful when i'm passing. he pays in sandwiches. Hulda's sandwiches. it's the best trade on the mountain."]
    speakPlainly: ["plainly: a claw, a map in my head, and seven holes in a mountain."]
    offer: ["fifty thousand. i'm good. i'm worth it. ask Ivor. he'll say nothing. that means yes."]
    join: ["right. i'll take the flank. you won't see me. that's the point."]
    bench: ["two days. then the mountain's moved something and i need to know what."]
    leave: ["that's me. the ascent's calling."]
    refuse.bond: ["i don't scout for people i haven't scouted."]
    refuse.flags: ["hear my price first. i say it at the gate at sundown. Ivor knows it. ask him."]
    refuseOwnErrand: ["my map. you can carry it."]
    questOffer.fennick-the-caverns: ["walk the caverns with me. the windraiders have got into the cavern of shame. thirty of them. then look into the cavern of honour and the cavern of valour so you know the way i know it. i found something old in valour. i'll show you."]
    questAccept.fennick-the-caverns: ["the cavern of shame, off the path of peril. the windraiders. then honour, off the path of strength, and valour, off the upper ascent. look round. properly."]
    questWaiting.fennick-the-caverns: ["thirty, honour and valour. look round them. properly."]
    questComplete.fennick-the-caverns: ["thirty, and you looked. good. here. this was in valour, under a rockfall. an old gi, rolled tight. Barricade's smiths call them Ancient pieces. i call it a heavy thing i've carried for a week. it's yours."]
    questOffer.fennick-red-craven: ["Red Craven. a claw i've had my eye on. it wants a nightshadow's darkness for the edge. thirty of them out of the cavern of valour. they're thick in there."]
    questAccept.fennick-red-craven: ["the cavern of valour, off the upper ascent. the nightshadows. hit first."]
    questWaiting.fennick-red-craven: ["thirty."]
    questComplete.fennick-red-craven: ["thirty. sharp. Red Craven. seven safe scrolls, every one took. it throws true. so do you."]
    questOffer.fennick-dragon-green-sleve: ["the Green Sleve. a dragon claw. it wants a windraider's speed in the wrist. forty windraiders off the lower ascent, and twenty firebrands out of the cavern of fear. fast ones first, hot ones second."]
    questAccept.fennick-dragon-green-sleve: ["the lower ascent for the windraiders. the cavern of fear for the firebrands. fear's not as bad as its name. pain is."]
    questWaiting.fennick-dragon-green-sleve: ["forty and twenty. fast, then hot."]
    questComplete.fennick-dragon-green-sleve: ["fast and hot. ...lovely. Dragon Green Sleve. seven sixties, every one took. it'll want to move. let it."]
    questOffer.fennick-reverse-lampion: ["the Lampion. reverse. my best. there's a cavern nobody's named. i think it's behind the elderwraiths on the path of strength. clear ten of them. walk the path to the top. tell me what you see."]
    questAccept.fennick-reverse-lampion: ["the path of strength, above the lower ascent. the elderwraiths. there aren't many. there's never many. that's why it's slow."]
    questWaiting.fennick-reverse-lampion: ["ten. and what you saw at the top."]
    questComplete.fennick-reverse-lampion: ["a crack in the rock with cold air coming out of it? ...that's it. that's the seventh cavern. i'm naming it after you. don't argue. Reverse Lampion. two tens and five sixties, every one took. it's the best thing i own. it was."]
    about.ivor: ["Ivor. the gate. he says six words a day. i say six hundred. between us it's an average conversation."]
    about.quentin: ["Quentin copies Ridley's books. i bring him ash. he pays in sandwiches. he's the only man on the mountain who reads slower than i scout."]
    about.ragna: ["Ragna. the drill. she says i stand like a coat on a peg. i say she stands like the peg. it's been going on for years."]
    aboutUnknown: ["never scouted them."]
    friend.close: ["there's a ledge on the upper ascent nobody knows about. i've shown it to you. that's the most secret thing i own."]
    friend.best: ["the seventh cavern's got your name on it. i'll carve it myself."]
    famed: ["you've a good name on the mountain. i hear it on the ledges."]
    defamed: ["you've a bad name on the mountain. the ledges talk. they're rocks. what do they know."]
    gift: ["oh, cheers."]
    gift.favorite: ["oh, nice. that's going in a pocket. the inside one."]
    gift.again: ["one's plenty. i've only got so many pockets."]
