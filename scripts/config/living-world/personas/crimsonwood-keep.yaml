  loadout: masteria-spear-l100
  personality: efficient-v1
  home:
    town: crimsonwood-keep
    routine:
      - { from: 6, to: 12, spot: "venue:upper-east-street", activity: LINGER }
      - { from: 12, to: 17, materialize: false }
      - { from: 17, to: 21, spot: "venue:upper-east-street", activity: LINGER }
      - { from: 21, to: 6, materialize: false }
  recruitable: true
  knows: [stormbreaker, crimson guardian, nightshadow]
  contract: ivor-the-gate-proof
  questLines: [ivor-the-gate-watch, ivor-pinaka, ivor-dragon-faltizan, ivor-reverse-alchupiz, ivor-crimson-hearts]
  benchToleranceDays: 3
  paceGap: 3
  relationships:
    - { persona: fennick, kind: STANDS_WATCH_WITH }
    - { persona: hulda, kind: FED_BY }
    - { persona: wat, kind: WATCHED_BY }
  giftItemIds: [4032012, 2000004]
  dialogue:
    greetFirst: ["halt. ...you walked past the guardians. they're mine to worry about, not you. go on in.", "a climber. you've the look of someone who fought the whole way up. good. the keep likes that look."]
    greet: ["hm. you again.", "evening. the gate's held."]
    idle: ["(stands with a spear grounded, looking down the mountain road, not moving for a long while)", "(turns a dark red stone over in a gauntleted hand, then tucks it away)"]
    noWork: ["nothing today. the gate."]
    nothingDue: ["square."]
    who: ["Ivor. i hold the keep gate. the crimson guardians walk the road outside it. they're the keep's, and they'll still kill you. i stand between the guardians and the people they'd kill. it's a short job to explain."]
    bye: ["the road's steep. don't run it."]
    thanks: ["hm. good."]
    smallTalk: ["the stormbreakers come down off the upper ascent in the storms and try the gate. they never get through. they keep trying. i respect that.", "Hulda sends supper out to the gate. i eat it. i don't go in. if i go in, i'll sit down. if i sit down, i'll stay sat."]
    speakPlainly: ["plainly: a gate, a spear, and a long road."]
    offer: ["thirty thousand. and show me you can fight up here. sixty stormbreakers. then i'll walk with you."]
    join: ["fine. i'll take the front. stay off my spear side."]
    bench: ["three days. then the gate wants me back."]
    leave: ["that'll do. back to the gate."]
    refuse.bond: ["i don't leave the gate for strangers."]
    refuse.flags: ["stand a watch with me first. then ask."]
    refuseOwnErrand: ["my gate. you can stand next to it."]
    questOffer.ivor-the-gate-watch: ["stand a watch with me. the stormbreakers have been at the stormhall again, and they come out on the lower ascent in twos. forty of them, then walk the road to the keep gate so you know what i see every morning."]
    questAccept.ivor-the-gate-watch: ["the stormhall, off the Hall of Mastery, or the lower ascent below the gate. the stormbreakers. then the road outside the gate. don't stop to chat with the guardians."]
    questWaiting.ivor-the-gate-watch: ["forty, and the road. the watch isn't stood till you've looked at it."]
    questComplete.ivor-the-gate-watch: ["good. that's the watch. every day. twice. now you know why i don't come in for supper."]
    questOffer.ivor-pinaka: ["Pinaka. a spear i've wanted since i was a boy on the lower ascent. it wants a balance weight. the nightshadows in the wrath of night carry darkness like iron. thirty of them. then i'll fit it and it's yours."]
    questAccept.ivor-pinaka: ["the wrath of night, off the Hall of Mastery. the nightshadows. they hit hard and they hit in the dark. light helps. so does hitting first."]
    questWaiting.ivor-pinaka: ["thirty. the weight's waiting."]
    questComplete.ivor-pinaka: ["thirty. ...it balances. Pinaka. seven safe scrolls, every one took. you'll feel it in the wrist. that's the balance."]
    questOffer.ivor-dragon-faltizan: ["Faltizan. a dragon spear. the head wants crimson hearts, six of them, from the guardians at my own gate. kill thirty guardians. i won't watch. i'll know."]
    questAccept.ivor-dragon-faltizan: ["the road outside the keep gate, or eternal vigilance inside. the crimson guardians. they're the keep's own. they'll understand. or they won't. they'll be dead."]
    questWaiting.ivor-dragon-faltizan: ["six hearts. it's not easy. it isn't meant to be."]
    questComplete.ivor-dragon-faltizan: ["six. ...they're still warm. Dragon Faltizan. seven sixties, every one took. that's my gate in that spear. carry it like it's my gate."]
    questOffer.ivor-reverse-alchupiz: ["Alchupiz. the reverse one. my best. there's a thing called Bigfoot in the forest below that's trodden three of Hulda's supply sleds flat, and the headless horseman rides the same paths. one of each. then the Alchupiz."]
    questAccept.ivor-reverse-alchupiz: ["the Phantom Forest. Bigfoot walks the twisted paths and the evil rising. the horseman rides the crossroads and the hidden evil. they keep their own hours. wait for them."]
    questWaiting.ivor-reverse-alchupiz: ["Bigfoot, and the horseman. both. take your time. they take theirs."]
    questComplete.ivor-reverse-alchupiz: ["both. ...Hulda'll have her sleds back. Reverse Alchupiz. two tens and five sixties, every one took. i've never given anyone my best. i've never had a reason."]
    questOffer.ivor-crimson-hearts: ["eight crimson hearts from the guardians? the gate wants a new seal each season."]
    questAccept.ivor-crimson-hearts: ["the road outside the gate, or eternal vigilance."]
    questWaiting.ivor-crimson-hearts: ["eight."]
    questComplete.ivor-crimson-hearts: ["eight. the gate's sealed. good."]
    about.fennick: ["Fennick scouts the upper ascent. he talks more than he should. he sees more than anyone. it's a fair trade."]
    about.hulda: ["Hulda sends supper to the gate. every night. i eat every bite. she knows."]
    about.wat: ["the page. he stood next to me a whole hour once. didn't fidget. that's harder than it looks."]
    about.ragna: ["Ragna drills the courtyard. she hits harder than i do. i block better. we've never settled it."]
    aboutUnknown: ["never come past my gate."]
    friend.close: ["you can come through my gate any hour. i'll know your step."]
    friend.best: ["if i ever leave the gate, it'll be to walk with you. nobody else."]
    famed: ["they speak well of you. even at the gate. that's a long way out."]
    defamed: ["they speak ill of you. at the gate. i've heard worse said of better."]
    gift: ["hm. thanks."]
    gift.favorite: ["oh. that's useful. that goes in my kit."]
    gift.again: ["one. that'll do."]

- id: ragna
  name: Ragna
