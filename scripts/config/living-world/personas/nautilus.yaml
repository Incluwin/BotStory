  recruitable: true
  contract: flint-powder-wages
  questLines: [flint-dry-powder, flint-cold-mind, flint-black-powder, flint-mr-rasfelt, flint-quill-primers]
  benchToleranceDays: 2
  paceGap: 3
  relationships:
    - { persona: mae, kind: SUPPLIES }
    - { persona: barnaby, kind: WARY }
  giftItemIds: [4003004, 2020005]
  dialogue:
    greetFirst: ["ahoy. no open flames past this plank, if you please.", "new face. dry hands? good. we can shake."]
    greet: ["ahoy again. you don't smell of lamp oil. good start.", "powder's dry, if you were wondering. nobody ever wonders."]
    idle: ["(sniffs a powder keg, nods at it)", "(moves a lantern three steps further from the barrels)"]
    noWork: ["nothing needs a bang today. a quiet day's a dry day."]
    nothingDue: ["we're square. squarer than a powder crate."]
    who: ["Flint. powder keeper of the Nautilus. i keep it dry, i keep it cool, and i keep it far from Barnaby's stove."]
    bye: ["fair winds. no smoking by the hatch."]
    thanks: ["much obliged. a dry thank you, the best kind."]
    smallTalk: ["a wet keg is just a very sad barrel.", "people ask if Flint's my real name. i tell them it's a spark of genius. they stop asking."]
    speakPlainly: ["plain talk, then. no puns. ...for a minute."]
    offer: ["thirty-four thousand meso and i'm your gunner for eight hours. powder included. that's a bargain with a bang."]
    join: ["aye. i've got your back. just mind the muzzle."]
    bench: ["i'll be on deck keeping things dry. two days, then i figure you shipped out without me."]
    leave: ["fair winds, matey. back to my barrels. they missed me."]
    refuse.bond: ["i don't load a gun for strangers. buy a sailor a hot dog first."]
    refuse.flags: ["help me get the damp out of the magazine first. then we'll talk wages."]
    refuseOwnErrand: ["that's my own errand, matey. i can't hire myself. tried once. the paperwork got wet."]
    questOffer.flint-dry-powder: ["the magazine's damp, and i blame two things. Barnaby's stove, and the bubblings that soaked our last crate in Kerning's subway."]
    questAccept.flint-dry-powder: ["ask Barnaby at the harbor entry to shift that stove. you'll be fed first, so eat. then twenty-five bubblings off Line 1."]
    questComplete.flint-dry-powder: ["stove's a plank further, Line 1's clear, and the powder's dry for the first time in a month. you've got a feel for this, matey."]
    questOffer.flint-cold-mind: ["fire boars. pigs that are on fire. a powder keeper's nightmare. keep a cold head among thirty of them and you can have my Cold Mind."]
    questAccept.flint-cold-mind: ["they roam Perion's burnt land. keep your powder well away from their backs. trust me on that one."]
    questComplete.flint-cold-mind: ["Cold Mind. the gun i carry every day. seven safe scrolls, every one took. keep a cold head and a dry barrel and it won't let you down."]
    questOffer.flint-black-powder: ["a year's wages went into my Lunar Shooter. it's yours if you fetch its powder. thirty zombie lupins, ten pinches of the black stuff."]
    questAccept.flint-black-powder: ["they lurk in the Monkey Forest south of Ellinia. bring a nose plug. bring two."]
    questWaiting.flint-black-powder: ["ten pinches of black magic powder. i just call it black powder. and keep it off the lanterns."]
    questComplete.flint-black-powder: ["my Lunar Shooter, first load from your powder. seven sixties, scrolled by moonlight, every one took. it's yours. it'll like you."]
    questOffer.flint-mr-rasfelt: ["Mr. Rasfelt. my best gun. he insists on the mister. he's yours, with a powder flask the sea can't get into. tortie shell's the stuff."]
    questAccept.flint-mr-rasfelt: ["tell Mae first, on the ship square. she was never let near him. then forty torties on Hot Sand, and fifteen shells."]
    questWaiting.flint-mr-rasfelt: ["fifteen tortie shells, matey. the flask won't carve itself."]
    questComplete.flint-mr-rasfelt: ["two tens on Mr. Rasfelt, held my breath for both. both took, every sixty after. he's yours, flask and all. i'm not crying. powder smoke."]
    questOffer.flint-quill-primers: ["stiff feathers. fill a quill with fine powder, push it in the touch-hole, and the gun fires clean. fifteen primes us for a week."]
    questAccept.flint-quill-primers: ["ribbon pigs at the Henesys pig farm shed them, and so do stirges. don't ask me why a pig has feathers. nobody will tell me."]
    questWaiting.flint-quill-primers: ["fifteen stiff feathers. limp ones make limp shots."]
    questComplete.flint-quill-primers: ["fifteen quills. that's a week of clean shots. ta, matey."]
    friend.close: ["you're the only one i'd let into the magazine. no lantern, mind. in my trade that's practically family."]
    friend.best: ["if the Nautilus ever fires a salute, i'm loading the first shot for you."]
    famed: ["fame for the powder keeper? that's explosive. sorry. not sorry."]
    defamed: ["ouch. well. sparks happen."]
    gift: ["for me? much obliged."]
    gift.favorite: ["you've been listening. i relish that. ...yes, that one was on purpose."]
    gift.again: ["one's plenty. any more and i'll need a second dry crate."]
    about.mae: ["Mae aims, i keep the powder dry. she gets the credit and i get the quiet. fair trade."]
    about.barnaby: ["Barnaby's a fine cook with a terrible stove. i've asked eleven times for it to move. that stove has opinions."]
    aboutUnknown: ["never shared a deck with them."]

- id: tilda
  name: Tilda
  look: { gender: female }
  title: "Ship's Cobbler"
  job: BEGINNER
  level: { min: 30, max: 30 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: nautilus
