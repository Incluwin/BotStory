  recruitable: false
  questLines: [tilda-a-last-for-your-feet, tilda-swamp-soles, tilda-heel-irons, tilda-the-captains-pair, tilda-sole-leather]
  relationships:
    - { persona: pike, kind: MOTHERS }
    - { persona: kettle, kind: SUPPLIES }
  giftItemIds: [4000021, 2022001]
  dialogue:
    greetFirst: ["oh, look at those boots. sit. no, sit. let me see.", "salt's eaten your soles, love. you've been walking on hope."]
    greet: ["there you are. feet dry?", "back again. let's see those heels. hm. could be worse."]
    idle: ["(taps a heel onto a boot with three quick knocks)", "(scrubs a deck plank nobody asked her to scrub)"]
    noWork: ["nothing on the last today. go and put your feet up. i mean it."]
    nothingDue: ["you owe me nothing but dry socks."]
    who: ["Tilda. ship's cobbler. i keep this crew's feet whole and this deck from killing them."]
    bye: ["mind the wet planks. and change your socks."]
    thanks: ["oh, go on."]
    smallTalk: ["a sailor's only as good as their feet. Kettle won't say it, but he's thought it.", "half this crew goes barefoot on a wet deck. the other half listens to me."]
    speakPlainly: ["plainly, then. your boots are a disgrace and i'm going to fix them."]
    questOffer.tilda-a-last-for-your-feet: ["every pair i make starts on a last, a wooden foot shaped like yours. wooden masks carry good board. ten boards, love."]
    questAccept.tilda-a-last-for-your-feet: ["they haunt the excavation site near Perion. twenty masks should shake ten boards loose. mind your ankles on the rocks."]
    questWaiting.tilda-a-last-for-your-feet: ["ten wooden boards. not slate. that's the rocky masks, and nobody carves slate."]
    questComplete.tilda-a-last-for-your-feet: ["ten good boards. sit down, shoes off. ...there. that's your foot, in wood. everything i make you starts here now."]
    questOffer.tilda-swamp-soles: ["now i've got your last, you need proper boots. ligator skin never drinks water. fifteen skins and i'll make you a pair."]
    questAccept.tilda-swamp-soles: ["ligators sit in the Swamp of Despair past Kerning. lovely name. wear your old boots, you'll ruin them anyway."]
    questWaiting.tilda-swamp-soles: ["fifteen ligator skins, love. your boots are waiting on you."]
    questComplete.tilda-swamp-soles: ["there. made on your last, every slot scrolled with the safe ones, every one took. dry them by the stove, not on it."]
    questOffer.tilda-heel-irons: ["your heels wear down crooked. i can tell from here. iron hog hooves make good heel irons. fifteen, and a better pair for you."]
    questAccept.tilda-heel-irons: ["the hogs are in Perion's burnt land. thirty should do it. they're heavy, so mind your toes."]
    questWaiting.tilda-heel-irons: ["fifteen metal hooves, love. heel irons don't grow on trees. they grow on hogs."]
    questComplete.tilda-heel-irons: ["iron heels and a sole that'll outlast the ship. every scroll a sixty, every one took. i sat up all night biting my nails. worth it."]
    questOffer.tilda-the-captains-pair: ["i've made one pair of dragon skin boots in my life. for the captain. the second pair is yours. fifteen dragon skins."]
    questAccept.tilda-the-captains-pair: ["tell Kettle first, on the east deck. he'll pretend not to care. then thirty red drakes, down past Sleepywood."]
    questWaiting.tilda-the-captains-pair: ["fifteen dragon skins, love. red drakes. and did you tell Kettle?"]
    questComplete.tilda-the-captains-pair: ["two tens. i couldn't watch, so Barnaby did. both took, and every sixty after. the captain's pair walked away from us. these walk with you."]
    questOffer.tilda-sole-leather: ["this crew wears through soles faster than Barnaby goes through onions. fifteen pieces of leather, love?"]
    questAccept.tilda-sole-leather: ["the pigs on the road to Henesys have plenty. bring it back dry."]
    questWaiting.tilda-sole-leather: ["fifteen pieces of leather. the crew's walking on socks."]
    questComplete.tilda-sole-leather: ["fifteen. that's a week of soles. sit down, have some porridge."]
    friend.close: ["i've got your measure now, heel to toe. i don't keep a last for just anyone."]
    friend.best: ["you're crew, love. i don't care whose ship you sail. you're crew."]
    famed: ["oh, stop. ...no, don't stop."]
    defamed: ["well. someone got out of the wrong side of the hammock."]
    gift: ["for me? you shouldn't have. you should've bought socks."]
    gift.favorite: ["oh, you remembered what i like. nobody on this ship remembers what i like."]
    gift.again: ["one's plenty. save your meso for boots."]
    about.kettle: ["Kettle sends me everyone who slips on his deck. he slipped first, mind. i was there."]
    about.pike: ["that boy has two pairs of shoes and holes in both. i patch them, he makes new holes. it's a system."]
    aboutUnknown: ["never measured their feet."]
