# Nautilus cast: a crew that lost its captain. 6 residents, 1 recruitable (Kettle, for a special item), 1 arc.
- id: kettle
  name: Kettle
  look: { gender: male }
  spouse: mae
  title: "Bosun Without a Captain"
  job: BRAWLER
  level: { min: 30, max: 33 }
  strength: VETERAN
  loadout: nautilus-pirate-l30
  personality: efficient-v1
  home:
