  questLines: [kettle-deck-drill, kettle-what-the-tide-took, kettle-deck-boots, kettle-the-deckhands-knuckles, kettle-the-king-of-the-beach, kettle-the-captains-hands]
  arc: kettle-new-captain
  rumors: [nautilus-empty-cabin]
  benchToleranceDays: 6
  paceGap: 3
  relationships:
    - { persona: mae, kind: TRUSTS }
    - { persona: pike, kind: SCOLDS }
  giftItemIds: [2022003, 2022002]
  dialogue:
    greetFirst: ["you're on my deck. state your rank.", "no rank? then swab."]
    greet: ["sailor.", "deck's clean. for now."]
    idle: ["(coils a rope that was already coiled)"]
    noWork: ["ship's shipshape. that's the job."]
    nothingDue: ["ledger's clean."]
    who: ["Kettle. bosun of the Nautilus. the captain's cabin has been empty a year. i keep the deck anyway."]
    bye: ["mind the gangway."]
    thanks: ["aye."]
    smallTalk: ["a ship without a captain is a very large raft."]
    speakPlainly: ["plain speech. we're sailors."]
    refuse.bond: ["i don't take orders from passengers."]
    refuse.arc: ["there's a cabin you haven't seen inside yet."]
    refuse.flags: ["bring me something that says you belong on a deck."]
    offer: ["a captain's token. that's the price. something a captain would carry. show me, and i'll take a berth with you."]
    join: ["aye. lead. i'll keep the deck."]
    bench: ["i'll be on the deck. it doesn't clean itself."]
    leave: ["fair winds. the deck's waiting."]
    refuseOwnErrand: ["a bosun doesn't run his own drills."]
    questOffer.kettle-deck-drill: ["lorangs on the beach below. they climb the hull. twenty of them and i'll believe you can hold a deck."]
    questComplete.kettle-deck-drill: ["twenty. you'd pass drill."]
    questOffer.kettle-what-the-tide-took: ["the tide took the captain's chest. torties nest where it went down. ten tortie shells, and whatever's under them."]
    questComplete.kettle-what-the-tide-took: ["ten shells and no chest. the sea keeps what it takes. still. thank you."]
    about.mae: ["Mae keeps the guns. she'd have been captain if she wanted it. she doesn't. she wanted me. still can't work out why."]
    spouse.parted: ["{name} and i are finished. the sea keeps what it takes."]
    about.pike: ["the cabin boy. good hands, bad ideas."]
    aboutUnknown: ["not crew."]
    questOffer.kettle-deck-boots: ["you slide on a wet deck like a landsman. Tilda at the dock makes grip soles from lorang claws. twenty."]
    questAccept.kettle-deck-boots: ["the lorangs are down the beach. they pinch."]
    questWaiting.kettle-deck-boots: ["twenty claws, sailor."]
    questComplete.kettle-deck-boots: ["deck boots. i scrolled them on the night watch. now you're a sailor. mostly."]
    questOffer.kettle-the-king-of-the-beach: ["King Clang. the big one on the beach. the old captain took it down every season to show the crew it could be done. nobody has since. you and me, aye?"]
    questAccept.kettle-the-king-of-the-beach: ["aye. bring potions. bring more."]
    questComplete.kettle-the-king-of-the-beach: ["the crew saw. they'll talk about it for a year. my own Fury Claw: seven sixties, every one took. the captain's way was to arm whoever stood beside him. i'm keeping his way."]
    friend.close: ["you've got a berth on this ship as long as i keep the deck."]
    friend.best: ["if this ship ever gets a captain again, i know who i'd want."]
    famed: ["aye. thank you."]
    defamed: ["a storm passes. so will you."]
    gift: ["aye, thanks."]
    gift.favorite: ["proper galley food. you've been talking to Barnaby."]
    gift.again: ["one a day, sailor. the hold's only so big."]
    questOffer.kettle-the-deckhands-knuckles: ["these were my knuckles when i was a deckhand. Neozard. thirty lorangs down the beach and they're yours."]
    questAccept.kettle-the-deckhands-knuckles: ["aye. mind the pincers."]
    questComplete.kettle-the-deckhands-knuckles: ["seven of the safe scrolls, every one took. a deckhand's knuckles. keep them dry."]
    questOffer.kettle-the-captains-hands: ["the captain's own knuckles. Psycho Claw. two tens and the rest sixties, a year's pay. ask Mae. then forty clangs, and twenty claws for the crew's memorial."]
    questAccept.kettle-the-captains-hands: ["the clangs are past the lorangs. they hit harder."]
    questWaiting.kettle-the-captains-hands: ["twenty claws, sailor. for the memorial."]
    questComplete.kettle-the-captains-hands: ["every scroll took for him, and they'll hit for you. the ship has a captain again, as far as i'm concerned."]

