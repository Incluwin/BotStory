# Nautilus cast: a crew that lost its captain. 6 residents, 1 recruitable (Kettle, for a special item), 1 arc.
- id: kettle
  name: Kettle
  title: "Bosun Without a Captain"
  job: BRAWLER
  level: { min: 30, max: 33 }
  strength: VETERAN
  loadout: nautilus-pirate-l30
  personality: efficient-v1
  home:
    town: nautilus
    routine:
      - { from: 6, to: 22, spot: "venue:east-deck", activity: LINGER }
      - { from: 22, to: 6, materialize: false }
  recruitable: true
  contract: kettle-a-captains-token
  questLines: [kettle-deck-drill, kettle-what-the-tide-took]
  arc: kettle-new-captain
  rumors: [nautilus-empty-cabin]
  benchToleranceDays: 6
  paceGap: 3
  relationships:
    - { persona: mae, kind: TRUSTS }
    - { persona: pike, kind: SCOLDS }
  dialogue:
    greetFirst: ["you're on my deck. state your rank.", "no rank? then swab."]
    greet: ["sailor.", "deck's clean. for now."]
    idle: ["(coils a rope that was already coiled)"]
    noWork: ["ship's shipshape. that's the job."]
    nothingDue: ["ledger's clean."]
    who: ["Kettle. bosun of the Nautilus. the captain's cabin has been empty a year. i keep the deck anyway."]
    bye: ["mind the gangway."]
    thanks: ["aye."]
    smallTalk: ["a ship without a captain is a very large raft."]
    speakPlainly: ["plain speech. we're sailors."]
    refuse.bond: ["i don't take orders from passengers."]
    refuse.arc: ["there's a cabin you haven't seen inside yet."]
    refuse.flags: ["bring me something that says you belong on a deck."]
    offer: ["a captain's token. that's the price. something a captain would carry. show me, and i'll take a berth with you."]
    join: ["aye. lead. i'll keep the deck."]
    bench: ["i'll be on the deck. it doesn't clean itself."]
    leave: ["fair winds. the deck's waiting."]
    refuseOwnErrand: ["a bosun doesn't run his own drills."]
    questOffer.kettle-deck-drill: ["lorangs on the beach below. they climb the hull. twenty of them and i'll believe you can hold a deck."]
    questComplete.kettle-deck-drill: ["twenty. you'd pass drill."]
    questOffer.kettle-what-the-tide-took: ["the tide took the captain's chest. torties nest where it went down. ten tortie shells, and whatever's under them."]
    questComplete.kettle-what-the-tide-took: ["ten shells and no chest. the sea keeps what it takes. still. thank you."]
    about.mae: ["Mae keeps the guns. she'd have been captain if she wanted it. she doesn't."]
    about.pike: ["the cabin boy. good hands, bad ideas."]
    aboutUnknown: ["not crew."]

- id: mae
  name: Mae
  title: "Gunner"
  job: GUNSLINGER
  level: { min: 28, max: 31 }
  strength: SEASONED
  loadout: nautilus-gunslinger-l28
  personality: efficient-v1
  home:
    town: nautilus
    routine:
      - { from: 7, to: 21, spot: "venue:ship-square", activity: LINGER }
      - { from: 21, to: 7, materialize: false }
  recruitable: false
  questLines: [mae-powder-and-shot]
  rumors: [nautilus-empty-cabin]
  dialogue:
    greetFirst: ["don't touch the guns.", "you can look. looking's free."]
    greet: ["gunner's here. what do you need?"]
    idle: ["(oils a barrel that gleams)"]
    noWork: ["powder's dry, shot's counted. good day."]
    who: ["Mae. gunner. i keep the Nautilus armed and Kettle from doing anything stupid."]
    bye: ["keep your powder dry."]
    thanks: ["aye."]
    smallTalk: ["a captain's job is to point. a gunner's job is to hit. i know which is harder."]
    questOffer.mae-powder-and-shot: ["clangs on the shore. their claws make good shot. fifteen claws."]
    questComplete.mae-powder-and-shot: ["fifteen. that's a broadside."]
    about.kettle: ["Kettle runs the ship. he just won't call himself captain."]
    aboutUnknown: ["not on the gun deck."]

- id: pike
  name: Pike
  title: "Cabin Boy"
  job: BEGINNER
  level: { min: 10, max: 12 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: nautilus
    routine:
      - { from: 6, to: 20, activity: STROLL }
      - { from: 20, to: 24, spot: "venue:cabin-approach", activity: LINGER }
      - { from: 0, to: 6, materialize: false }
  recruitable: false
  questLines: [pike-the-captains-door]
  rumors: [nautilus-empty-cabin]
  dialogue:
    greetFirst: ["are you the new captain? no? oh. everyone asks me that. i mean i ask everyone."]
    greet: ["hi! still no captain."]
    idle: ["(polishes a door handle nobody uses)"]
    noWork: ["nothing today. want to see the cabin? you can't. but want to?"]
    who: ["Pike. cabin boy. i keep the cabin. it keeps nobody."]
    bye: ["bye!"]
    thanks: ["aye aye!"]
    smallTalk: ["Kettle says the captain's coming back. Mae says nothing. i believe Mae."]
    questOffer.pike-the-captains-door: ["the captain's door is stuck. salt. bring me five clang claws to scrape it and i'll let you look inside."]
    questComplete.pike-the-captains-door: ["it opens! it's... empty. it's really empty. i knew that. i knew that."]
    about.kettle: ["Kettle's the captain. he just won't say it. everyone knows."]
    aboutUnknown: ["never sailed with them!"]

