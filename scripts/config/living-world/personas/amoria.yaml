  giftItemIds: [2020003, 2000002]
  dialogue:
    greetFirst: ["ah. a new face. a new story. would you like a line? i've got a spare.", "hello, stranger. 'and the road brought them to Amoria.' ...no. i'll work on it."]
    greet: ["ah, you.", "hello, muse. no, that's too much. hello.", "back again. good. i'm stuck on a rhyme."]
    idle: ["(writes a line on a scrap, reads it under his breath, crosses it out, and writes it again exactly the same)", "(stares at the cathedral with a pen in his teeth, then scribbles furiously)"]
    noWork: ["nothing today. no weddings till the weekend. i'm writing for nobody. it's harder."]
    nothingDue: ["you owe me nothing. a word, perhaps. a good one."]
    who: ["Valentin. i write vows for people who can't find their own. couples bring me a feeling and i give it back to them in words. i've written four hundred forevers. i've never written my own. there's never been a reason."]
    bye: ["go well. go poetically."]
    thanks: ["you're too kind. truly. i'd write it down, but i'd ruin it."]
    smallTalk: ["vows look truer in blue ink. i grind blue snail shells for it. don't laugh. couples have cried over snail shells and never known.", "Victoria sends me her cathedral couples. High Priest John reads my words aloud at the altar. he reads them better than i write them. i've never told him."]
    speakPlainly: ["plainly: other people's words. mine, really."]
    questOffer.valentin-blue-ink: ["i'm out of blue ink. vows look truer in blue. fifteen blue snail shells from the purple plains, and i can grind a week's worth."]
    questAccept.valentin-blue-ink: ["out the east gate past Bonnie, the purple plains. blue snails. they're small. so's ink, until it isn't."]
    questWaiting.valentin-blue-ink: ["fifteen shells. there's a couple coming on saturday."]
    questComplete.valentin-blue-ink: ["fifteen! blue ink by tonight. i'll write saturday's vows in it. here, with a line of thanks: 'thank you.' ...i'm saving the good lines for saturday."]
    questOffer.valentin-a-new-quill: ["my quill's split. i need a stiff feather. the lupins in Monkey Forest, by Ellinia, carry them. twenty lupins, five feathers. they don't drop them easily."]
    questAccept.valentin-a-new-quill: ["Henesys first, by Thomas Swift. then the road towards Ellinia, and the forest where the lupins live. look up. the feathers are in the trees with them."]
    questWaiting.valentin-a-new-quill: ["five feathers. i'm writing with a twig. it shows."]
    questComplete.valentin-a-new-quill: ["five! a new quill. i'll cut it tonight. the first thing i write with it, i'll keep. maybe it'll be my own. here."]
    about.pernille: ["Pernille corrects my vows. she's never been married. she's always right. i don't know how."]
    about.clotilde: ["Clotilde asks for the vows before the wedding so she can sweeten the cake to match. it's the only review i trust."]
    about.ines: ["Ines listens while she polishes. she's my best audience. she never says anything. her rings shine more, i'm told."]
    about.liesel: ["Liesel wrote her own vows. three lines. i read them over her shoulder and had to sit down. i've written four hundred. none of mine were that good."]
    aboutUnknown: ["never written for them."]
    friend.close: ["i've written a line for you. i'll read it to you one day. not yet. it isn't finished."]
    friend.best: ["if you ever need vows, i'll write them. no charge. no edits. well. a few edits."]
    famed: ["people keep saying your name. it scans beautifully. i may use it."]
    defamed: ["bad reviews. i've had worse. i've written worse."]
    gift: ["oh! for me? thank you."]
    gift.favorite: ["oh, that's lovely. that's an afternoon of good writing, that is."]
    gift.again: ["one a day. any more and i'll write you an ode, and nobody wants that."]
