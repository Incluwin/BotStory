    questAccept.casse-my-first-wand: ["they're everywhere around the tree. you can't miss them. they can't miss you either."]
    questComplete.casse-my-first-wand: ["seven of the safe scrolls and all seven worked, which NEVER happens to me. it's yours!"]
    questOffer.casse-what-ice-remembers: ["this is Cromi. i've never let anyone hold it. one last study first: forty cold eyes and twenty of their tails. then it's yours. ask Lioren, he knows what it means."]
    questAccept.casse-what-ice-remembers: ["the cold eyes are down in the sleepy dungeon. dress warm. ha."]
    questWaiting.casse-what-ice-remembers: ["twenty cold eye tails! the study isn't done without them."]
    questComplete.casse-what-ice-remembers: ["Cromi. two tens, five sixties, and every single one took. i don't know what i'll study without it. you, maybe. that's a joke. mostly."]

