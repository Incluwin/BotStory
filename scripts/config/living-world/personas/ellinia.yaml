  relationships:
    - { persona: lioren, kind: HIDES_FROM }
    - { persona: casse, kind: TEACHES }
  dialogue:
    greetFirst: ["quiet. the pages can hear you.", "you're dripping on the floor of a library."]
    greet: ["ah. you.", "back for another page?"]
    idle: ["(reshelves a book that was already shelved)"]
    noWork: ["the archive is in order. for once. go away."]
    nothingDue: ["you owe the archive nothing. the archive owes you nothing. balanced."]
    who: ["Wren. i keep the upper archive. i keep what's in it, too."]
    bye: ["mind the ladder."]
    thanks: ["put it in the margin."]
