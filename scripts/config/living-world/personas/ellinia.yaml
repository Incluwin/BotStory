    questAccept.mirabel-the-lining: ["lines one and two of the subway. wash your hands after. i'll wash the cloth."]
    questWaiting.mirabel-the-lining: ["twenty tablecloths. i won't ask what they were doing with them."]
    questComplete.mirabel-the-lining: ["lined with what the wraiths carried. i'm not thinking about it. sixties, every scroll, and every one took. i sat up all night with it."]
    questOffer.mirabel-thread-that-holds: ["the last one should outlast us both. thirty copper drakes, fifteen dragon skins. tell Isolde first. she always asks what i'm making."]
    questAccept.mirabel-thread-that-holds: ["the drakes nest in the hunting ground past Sleepywood. Isolde will tell you to be careful. listen to her."]
    questWaiting.mirabel-thread-that-holds: ["fifteen dragon skins. the loom's been quiet without you. i didn't expect to notice that."]
    questComplete.mirabel-thread-that-holds: ["two tens and sixties for the rest, and every one took. i held my breath for each. it was always going to be yours."]
    questOffer.mirabel-leaves-for-the-vat: ["the dye vat's low. twenty leaves from the dark stumps around the tree. theirs is the only green that doesn't fade."]
    questAccept.mirabel-leaves-for-the-vat: ["the dark stumps are in the forests north and south of town. they don't like being picked."]
    questWaiting.mirabel-leaves-for-the-vat: ["twenty leaves. the vat's going pale while it waits."]
    questComplete.mirabel-leaves-for-the-vat: ["twenty. the vat will hold another week. ...you could stay while it steeps. if you want."]
    friend.close: ["i've started saving the good thread for you. i didn't decide to. i just noticed i was doing it."]
    friend.best: ["i used to weave with the door shut. now i leave it open, in case it's you."]
    famed: ["for me? ...i don't know where to put my hands. thank you."]
    defamed: ["oh. all right. i'll unpick whatever i did."]
    gift: ["for me? you didn't have to. i'm glad you did."]
    gift.favorite: ["you remembered. i'll be thinking about this all evening."]
    gift.again: ["you already brought me something today. i'm still holding it."]
    about.isolde: ["Isolde wears out her robes kneeling beside people. i mend the knees and don't say anything. she knows."]
    about.wren: ["i thread Wren's bindings. she says they're adequate. from Wren, that's a love letter."]
    aboutUnknown: ["i haven't measured them. i don't think we've met."]
