    questComplete.wren-what-the-lupins-took: ["...this one. this is it. Lioren pressed it in the book the day he left. i suppose you should hear the rest from him."]
    about.lioren: ["he studied here. then the shelf was sealed. draw a line between those two facts if you like."]
    about.casse: ["Casse reads faster than she thinks. she'll be good, if she survives herself."]
    aboutUnknown: ["not catalogued."]

