    questOffer.casse-a-cold-shelf: ["Wren won't let me near the sealed shelf. but she said if the archive was safe from slimes she'd think about it. forty slimes, on the tree levels. please?"]
    questComplete.casse-a-cold-shelf: ["forty! she said she'd think about it. that's basically a yes with Wren."]
    about.wren: ["she's strict but she leaves tea out. don't tell her i know."]
    about.lioren: ["he's not scary. he's just sad and on fire a little."]
    aboutUnknown: ["haven't met them! do they like ice?"]
    questOffer.casse-frozen-earrings: ["okay don't laugh. i froze a pair of earrings and they came out PRETTY. but the frost needs something cold and dead to hold onto. charms of the undead, from zombie mushrooms. fifteen!"]
    questAccept.casse-frozen-earrings: ["yay! don't let them touch you, they're gross."]
    questWaiting.casse-frozen-earrings: ["fifteen charms! the frost is getting impatient. so am i."]
    questComplete.casse-frozen-earrings: ["earrings! scrolled! by me! okay, Wren helped with the scrolls. a little. a lot."]
    questOffer.casse-the-coldest-thing: ["i figured out the coldest thing in Victoria. it's a cursed doll. don't ask how i know. ten of them, from the zombie lupins. thirty lupins should do it. then my wizard wand is yours. my REAL one."]
    questAccept.casse-the-coldest-thing: ["stay warm! ironic, i know."]
    questWaiting.casse-the-coldest-thing: ["ten cursed dolls! they're cold, you'll know them."]
    questComplete.casse-the-coldest-thing: ["my Wizard Wand. seven sixties, every one took. i did them in the cold room. ice remembers. so will you, every time you use it."]
    friend.close: ["you're my favorite person who isn't a book. Wren doesn't count, she IS a book."]
    friend.best: ["i'm naming my first real spell after you. it's going to be cold. that's a compliment."]
    famed: ["for ME? oh my gosh. okay. okay! thank you!"]
    defamed: ["oh. ...that's cold. and not the good kind."]
    gift: ["aw, you got me something!"]
    gift.favorite: ["you remembered what i like! how did you even remember?!"]
    gift.again: ["you already gave me something today! i'm still happy about that one!"]
