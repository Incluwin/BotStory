    about.pell: ["Pell sets snares for lupins and mostly catches Pell. i've stopped charging. it felt like a tax."]
    about.bram: ["Bram would sooner splint a branch than an arm. i've splinted both for Bram. the branch complained less."]
    aboutUnknown: ["never patched them. lucky them."]

