    questAccept.mirabel-measured-for-you: ["the fairies float in the north tree dungeon. their tentacles unravel into thread finer than anything i can buy."]
    questWaiting.mirabel-measured-for-you: ["fifteen tentacles. i've set the loom for you already. it's waiting too."]
    questComplete.mirabel-measured-for-you: ["here. cut for you, for how you move. the safe scrolls, all of them, and every one took. i checked each seam twice. three times."]
