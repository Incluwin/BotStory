    noWork: ["nothing today. i'm training. i'm always training."]
    nothingDue: ["we're even! i think."]
    who: ["Xiaobo! i train on the practice field. i'm going to beat Suyin. she's beaten me two hundred and eleven times. i keep count. she doesn't."]
    bye: ["chin down! that's what she says. chin down!"]
    thanks: ["thanks! i'll pay you back when i'm champion."]
    smallTalk: ["Suyin says i get up faster every time. that means i'm getting better at falling. that's not the part i wanted to get better at.", "Meiwen says i need to learn to lose properly. i've lost two hundred and eleven times. how many more properly?"]
    speakPlainly: ["plainly: i want to win. once."]
    questOffer.xiaobo-necki-flowers: ["my mother likes the flowers the red serpents wear. i want to bring her some, but i'm not allowed past the sky forest yet. twenty-five red serpents, fifteen flowers? please?"]
    questAccept.xiaobo-necki-flowers: ["the snake area and where the sky forest ends. the red ones. they have the flowers. the blue ones have hats. hats are no good for mothers."]
    questWaiting.xiaobo-necki-flowers: ["fifteen flowers! she's waiting. she doesn't know she's waiting."]
    questComplete.xiaobo-necki-flowers: ["fifteen! she'll cry. she cries at flowers. thank you!"]
    questOffer.xiaobo-a-yellow-belt: ["Suyin says i can't wear a belt till i've earned one. the grizzlies in the wild bear area wear yellow belts. i don't know why. twenty-five grizzlies, fifteen belts? i'll only wear one. the rest i'll practise tying."]
    questAccept.xiaobo-a-yellow-belt: ["the wild bear areas, the first and second. the grizzlies. they hug. don't let them."]
    questWaiting.xiaobo-a-yellow-belt: ["fifteen belts! i've been practising the knot on a rope."]
    questComplete.xiaobo-a-yellow-belt: ["fifteen! i'm wearing one! ...it's too big. it's perfect."]
    questOffer.xiaobo-ask-suyin: ["would you ask Suyin what i'm doing wrong? she won't tell me. she just knocks me down. she might tell you."]
    questAccept.xiaobo-ask-suyin: ["she's on the lower west street in the evenings. she'll ask you to spar. say no. trust me."]
    questWaiting.xiaobo-ask-suyin: ["did she say? what did she say?"]
    questComplete.xiaobo-ask-suyin: ["'nothing'? i'm doing nothing wrong? ...then why do i keep losing? 'because she's better'? ...oh. that's fair. that's annoying. that's fair."]
    about.suyin: ["Suyin's the best fighter in Mu Lung. i'm going to beat her. she's going to let me, she says, over her dead body. so not soon."]
    about.meiwen: ["Meiwen's very old and very strict. she said my stance was 'a beginning'. that's the nicest thing she's ever said to anyone."]
    about.fengzi: ["Fengzi made me gloves like Suyin's! smaller. i sleep in them."]
    aboutUnknown: ["are they a fighter?"]
    friend.close: ["you're my second favourite fighter. after Suyin. don't tell her she's first."]
    friend.best: ["when i beat Suyin, you're the first person i'm telling. after Suyin. she'll know first. she'll be on the ground."]
    famed: ["everyone's talking about you! are you better than Suyin?"]
    defamed: ["people are saying stuff about you. i don't care. are you better than Suyin?"]
