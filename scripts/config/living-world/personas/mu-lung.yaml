    idle: ["(stretches a glove over a carved wooden hand, then pulls it off and stretches it again)", "(threads a long needle through dark leather without looking at it, talking quietly to himself)"]
    noWork: ["nothing on the wooden hand today. go hit something and come back with sore knuckles."]
    nothingDue: ["you owe me nothing."]
    who: ["Fengzi. i make gloves. every fighter in Mu Lung's hands have been through mine. i cut them on wooden hands carved from the practice dummies. a glove should know what it's for."]
    bye: ["keep your knuckles warm."]
    thanks: ["mm. good."]
    smallTalk: ["Suyin goes through a pair of wraps a week. i've started making them thicker without telling her. she's started hitting harder without telling me.", "the forms are in the hands as much as the feet. Meiwen says so. i make gloves, so i agree."]
    speakPlainly: ["plainly: gloves that know the forms."]
    questOffer.fengzi-practice-wood: ["i carve my wooden hands from the dummies on the practice field. the wooden ones, not the straw. twenty-five dummies, fifteen wooden dolls?"]
    questAccept.fengzi-practice-wood: ["the practice fields, the easy and the normal. the wooden dummies. thank them. they've been hit a lot."]
    questWaiting.fengzi-practice-wood: ["fifteen dolls. my wooden hands are cracking."]
    questComplete.fengzi-practice-wood: ["fifteen. good grain. that's a year of hands."]
    questOffer.fengzi-kentaurus-marrow: ["now a proper pair for you. the blue kentaurus near Leafre carry a marrow that keeps leather supple in any cold. thirty of them, fifteen marrows. i'll cure the leather in it."]
    questAccept.fengzi-kentaurus-marrow: ["the blue kentaurus field and the battlefields beside it. they hit cold. so will your hands, after."]
    questWaiting.fengzi-kentaurus-marrow: ["fifteen marrows. the leather's stiff without them."]
    questComplete.fengzi-kentaurus-marrow: ["there. cut to your hands, every scroll took. flex. ...see? they move like they're yours."]
    questOffer.fengzi-wyvern-gill: ["the next pair want to be thin, thin as skin. the blue wyverns' gills tan into the finest leather i know. thirty blue wyverns, fifteen gills."]
    questAccept.fengzi-wyvern-gill: ["the canyon's crossroad and the blue wyverns' nest. they come at you from above. look up."]
    questWaiting.fengzi-wyvern-gill: ["fifteen gills. i've the needles out."]
    questComplete.fengzi-wyvern-gill: ["there. fitted to your fingers, every scroll took. you'll forget you're wearing them. don't."]
    questOffer.fengzi-skull-plates: ["one more. the best i'll make. the dark cornians in the burning forest wear skull shoulder pads hard as iron. thirty of them, fifteen pads. i'll cut the knuckle plates from them."]
    questAccept.fengzi-skull-plates: ["the burning forest, the forest that disappeared, the hidden tomb. the dark ones. they don't miss."]
    questWaiting.fengzi-skull-plates: ["fifteen pads. the wooden hand's waiting."]
    questComplete.fengzi-skull-plates: ["there. made for your hands and no one else's, two tens and the rest sixties, every one took. hit something you've been afraid of."]
    questOffer.fengzi-wood-for-the-forms: ["fifteen wooden dolls from the practice field? the hands keep cracking."]
    questAccept.fengzi-wood-for-the-forms: ["the practice fields."]
    questWaiting.fengzi-wood-for-the-forms: ["fifteen."]
    questComplete.fengzi-wood-for-the-forms: ["fifteen. good."]
    about.suyin: ["i wrap Suyin's hands every week. she never says thank you. she always comes back. that's thank you."]
    about.meiwen: ["Meiwen and i have argued about the second form for thirty years. she's right. i'll never say so."]
    about.xiaobo: ["the Xiaobo boy asked for gloves like Suyin's. i made him a smaller pair. he hasn't taken them off."]
    aboutUnknown: ["never seen their hands."]
    friend.close: ["i've a wooden hand carved to your size on the shelf now. i don't do that for everyone."]
    friend.best: ["when i stop making gloves, i'll give you the wooden hands. all of them. you'll know who to give them to."]
    famed: ["heard you've been busy with those hands."]
    defamed: ["heard you've been busy with those hands. the wrong way."]
    gift: ["mm. thanks."]
    gift.favorite: ["oh, that's useful. straight onto the bench."]
    gift.again: ["one a day. my bench is small."]

- id: lai
  name: Lai
  look: { gender: female }
  title: "Peach Farmer"
  job: BEGINNER
  level: { min: 28, max: 28 }
