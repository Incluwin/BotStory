    questWaiting.suyin-beia-crash: ["fifteen dolls. i'm keeping count."]
    questComplete.suyin-beia-crash: ["fifteen. that's every loss since spring. Beia Crash. seven safe scrolls, every one took. hit something with it. something big."]
