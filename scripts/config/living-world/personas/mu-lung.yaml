    greetFirst: ["came up the sky road? good. that's my road. nothing came at you? good. that's my work.", "stop. ...fine. you're not a porky. go on."]
    greet: ["road's clear.", "you again. the road's still clear. i'd like you to notice."]
    idle: ["(sets the butt of a long polearm down and leans on it, watching the road out of town)", "(sweeps a polearm through a slow wide arc, stops it a finger's width from a post, and nods)"]
    noWork: ["nothing on the road today. go train. the practice field's free."]
    nothingDue: ["we're square."]
    who: ["Baojun. i keep the sky road between the forest and the town. the porkies come up it every spring. i send them back down it every spring."]
    bye: ["keep to the middle of the road. the edges are where things wait."]
    thanks: ["good."]
    smallTalk: ["the black porkies carry needle pouches. i've never found out what they sew. i don't want to know.", "Suyin and i spar every week. she's faster. i'm longer. we've agreed it's a draw. it isn't."]
    speakPlainly: ["plainly: a road, a pole, and porkies."]
    offer: ["sixty black porkies off the road, counted, and twenty-five thousand for the toll i'm not collecting while i'm with you. then i walk with you a shift."]
    join: ["fine. i'll keep your flank. stay out of my reach."]
    bench: ["three days on the bench and i go back to the road. the road doesn't keep itself."]
    leave: ["shift's done. the road's waiting."]
    refuse.bond: ["i don't leave the road with someone i don't know."]
    refuse.flags: ["clear the sky road with me once. then ask, and i'll likely say yes."]
    refuseOwnErrand: ["my road. walk it with me. not for me."]
    questOffer.baojun-the-sky-road: ["the black porkies are up the sky road again. thirty of them, then walk on to where the sky forest ends so you know how far my road runs."]
    questAccept.baojun-the-sky-road: ["the sky forest train and the deep sky forest. then on to the end, past the snakes. don't stop for the snakes."]
    questWaiting.baojun-the-sky-road: ["thirty, and the end of the road. both."]
    questComplete.baojun-the-sky-road: ["good. now you know the road. it's longer than it looks."]
    questOffer.baojun-skylar: ["Skylar. my first polearm. the reindeer on the peach farms drop their horns in the fields. thirty reindeer, fifteen broken horns. i ring the haft with horn. it's how my teacher did it."]
    questAccept.baojun-skylar: ["the three peach farms. the reindeer kick. so do the monkeys. you won't be bored."]
    questWaiting.baojun-skylar: ["fifteen horns. the haft's bare."]
    questComplete.baojun-skylar: ["fifteen. Skylar, ringed in horn. seven safe scrolls, every one took. it's light at the end. use the end."]
    questOffer.baojun-gold-dragon: ["the Gold Dragon. the red-nose pirates in the dens on the Herb Town road paint their mark on everything they take. thirty of the kru, fifteen marks. i want to burn them. then the polearm's yours."]
    questAccept.baojun-gold-dragon: ["Herb Town, then the old swamp, then the pirate dens. the first and second. kru fight dirty. so should you."]
    questWaiting.baojun-gold-dragon: ["fifteen marks. the fire's laid."]
    questComplete.baojun-gold-dragon: ["fifteen. they'll burn nicely. the Gold Dragon. seven sixties, every one took. that doesn't happen. it happened."]
    questOffer.baojun-eclipse: ["the Eclipse. i've never used it. it wants something dark. the dark rashes in the forests under Leafre shed a curse powder that turns light. thirty of them, fifteen powders. i'll black the blade."]
    questAccept.baojun-eclipse: ["Leafre. the west border and the peach monkey forest there. the dark ones. they're slow until they aren't."]
    questWaiting.baojun-eclipse: ["fifteen powders. the blade's waiting to go dark."]
    questComplete.baojun-eclipse: ["fifteen. black as a moonless road. the Eclipse. two tens and five sixties, every one took. i'll go back to The Nine Dragons. the Eclipse is yours."]
    questOffer.baojun-needle-tally: ["fifteen needle pouches off the black porkies? i count them so i know how many came up the road."]
    questAccept.baojun-needle-tally: ["the sky forest."]
    questWaiting.baojun-needle-tally: ["fifteen."]
    questComplete.baojun-needle-tally: ["fifteen pouches. the sky road's swept for now."]
    about.suyin: ["Suyin hits harder than anyone in Mu Lung. she says i hit from too far away. i say that's the point of a polearm."]
    about.lai: ["Lai's carts come up my road every morning. i walk the first stretch with her. she gives me a peach. i'd walk it anyway."]
    about.meiwen: ["Meiwen taught me to stand. i've stood ever since. i've never sat down on duty. she'd know."]
    aboutUnknown: ["never came up my road."]
    friend.close: ["you can walk my road any time. no toll. don't tell anyone."]
    friend.best: ["if i ever leave the road, it'll be to walk somewhere with you."]
    famed: ["heard good things. the road agrees."]
    defamed: ["heard bad things. walk carefully on my road."]
    gift: ["thanks."]
    gift.favorite: ["oh. that's a road gift. useful. thank you."]
    gift.again: ["one a day."]

