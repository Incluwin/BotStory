  giftItemIds: [4000282, 2022001]
  dialogue:
    greetFirst: ["peach? no, they're not for you. well. one. don't tell the monkeys.", "you smell of the road. here. peach. it fixes that."]
    greet: ["peach season. it's always peach season if you're a monkey.", "hello! the farm's still standing. mostly."]
    idle: ["(polishes a peach on her sleeve and holds it up to the light, checking it for monkey teeth)", "(ties the neck of a fat sack of peaches with a quick double knot)"]
    noWork: ["nothing today. the monkeys are resting. so am i."]
    nothingDue: ["we're even. have a peach anyway."]
    who: ["Lai. i farm peaches past the sky forest. the peach monkeys farm them too, from the other direction. we've been at war for twenty years. i'm winning by one peach."]
    bye: ["watch your pockets on the farm. the monkeys check."]
    thanks: ["oh, have a peach!"]
    smallTalk: ["a peach monkey will eat a peach and plant the seed and then come back in five years to steal the fruit. that's patience. i've a grudging respect.", "Baojun walks me to the farm every morning. he says it's his road. it's my farm. we're both very territorial."]
    speakPlainly: ["plainly: peaches, monkeys, me in between."]
    questOffer.lai-thimbles-for-the-sacks: ["my sacks want sewing and i've worn through every thimble i own. the red porkies in the sky forest carry little thimbles. twenty-five of them, fifteen thimbles?"]
    questAccept.lai-thimbles-for-the-sacks: ["the entrance to the sky forest and the train. the red ones. they're prickly. so's my sewing."]
    questWaiting.lai-thimbles-for-the-sacks: ["fifteen thimbles. my thumbs are suffering."]
    questComplete.lai-thimbles-for-the-sacks: ["fifteen! my thumbs thank you. here. peach."]
    questOffer.lai-the-peach-thieves: ["the monkeys have taken the whole east row. thirty of them, and fifteen peach seeds back so i can plant the row again. that's how you win. you plant faster."]
    questAccept.lai-the-peach-thieves: ["the three peach farms. they throw the stones. duck."]
    questWaiting.lai-the-peach-thieves: ["fifteen seeds. the east row's bare."]
    questComplete.lai-the-peach-thieves: ["fifteen! the row's back in by spring. i'm winning by sixteen peaches now."]
    questOffer.lai-peaches-for-sookja: ["Sookja in Herb Town buys my peaches for her tea house. i owe her a crate and my cart's lost a wheel. would you tell her it's coming? she worries. tea people worry."]
    questAccept.lai-peaches-for-sookja: ["Herb Town, down the road. Sookja keeps the tea house. she'll offer you tea. say yes. it's good tea."]
    questWaiting.lai-peaches-for-sookja: ["did Sookja say it's all right? she always says it's all right. i like to hear it anyway."]
    questComplete.lai-peaches-for-sookja: ["she said take my time? ...she always says that. i'll take a little. not all of it."]
    about.baojun: ["Baojun walks me to the farm every morning. i give him a peach. he pretends he wasn't going that way anyway."]
    about.qing: ["Qing's library has no books in it. i bring him peaches. he says thank you like i've returned something. maybe i have."]
    about.sookja: ["Sookja makes peach tea from my peaches. it's better than my peaches. i've told her. she doesn't believe me."]
    aboutUnknown: ["never bought a peach from me."]
    friend.close: ["you can have peaches whenever you like. that's not nothing. the monkeys would kill for that."]
    friend.best: ["if i ever plant a new row, i'll name it after you. it'll be the best row."]
    famed: ["they're saying good things! have a peach!"]
    defamed: ["they're saying bad things. have a peach anyway."]
    gift: ["oh, thank you!"]
    gift.favorite: ["oh, you know just what i like! peach for you, peach for you!"]
    gift.again: ["you've given me plenty today!"]

