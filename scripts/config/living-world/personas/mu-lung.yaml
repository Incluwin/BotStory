# Mu Lung cast: the town of forms. 7 residents, 2 recruitable (Baojun the road guard for a kill proof, Suyin the
# brawler once you have heard her answer the dojo boy), 1 arc (Meiwen's Book of Forms, whose last page went to Herb
# Town thirty years ago and comes back with Oksun's root). Ids in quests/mu-lung.yaml.
- id: meiwen
  name: Meiwen
  look: { gender: female }
  title: "Teacher of the Forms"
  job: BEGINNER
  level: { min: 45, max: 45 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: efficient-v1
  home:
    town: mu-lung
    routine:
      - { from: 5, to: 11, spot: "venue:middle-central-street", activity: LINGER }
      - { from: 11, to: 13, spot: "venue:by-mr-do", activity: REST }
      - { from: 13, to: 18, spot: "venue:middle-west-street", activity: SOCIALIZE }
      - { from: 18, to: 21, spot: "venue:lower-central-street", activity: SOCIALIZE }
      - { from: 21, to: 5, materialize: false }
  recruitable: false
  knows: [mu lung, foggy forest, sage cat]
  questLines: [meiwen-the-first-pages, meiwen-the-library-card, meiwen-the-seventh-form, meiwen-paper-for-the-binding]
  arc: meiwen-the-book-of-forms
  rumors: [mu-lung-the-borrowed-page]
  relationships:
    - { persona: qing, kind: OLD_PUPIL }
    - { persona: suyin, kind: TAUGHT }
    - { persona: oksun, kind: NEVER_MET }
  giftItemIds: [4000298, 2022001]
  dialogue:
    greetFirst: ["feet apart. no, further. there. now you're standing in Mu Lung. before, you were only visiting.", "you walk like someone who's never been taught to fall. sit. we'll fix that another day."]
    greet: ["feet.", "morning or evening, the forms don't care which."]
    idle: ["(moves slowly through a stance, one hand open, one closed, and holds it longer than seems possible)", "(turns the brittle pages of a thin book with great care, counting under her breath)"]
    noWork: ["nothing today. practise standing still. it's harder than it sounds."]
    nothingDue: ["you owe me nothing but posture."]
    who: ["Meiwen. i've taught the forms for forty years. seven of them, once. six, these thirty years: the seventh walked off with the library and i've taught around the hole ever since."]
    bye: ["walk from the hips. you'll get further."]
    thanks: ["mm. good."]
    smallTalk: ["the book ghosts in the foggy forest are the library's books. they walked out one winter and never came back. a book that walks is still a book. i still want mine.", "a form is a sentence your body says. six sentences make a paragraph. seven make a story. i've only ever had a paragraph."]
    speakPlainly: ["plainly: six forms, one missing, one old woman counting pages."]
    questOffer.meiwen-the-first-pages: ["the Book of Forms walked into the foggy forest with the others. the ghosts shed old paper when you strike them. thirty of them, fifteen pages, and i'll see which forms come back."]
    questAccept.meiwen-the-first-pages: ["the foggy forest past the peach farm, and the virtuous forest past that. strike cleanly. they're books. they deserve a clean edge."]
    questWaiting.meiwen-the-first-pages: ["fifteen pages. i've cleared the table for them."]
    questComplete.meiwen-the-first-pages: ["...the first form. the second, the third. the fourth, twice. the fifth, the sixth. no seventh. there was always going to be no seventh. i hoped anyway. that's allowed."]
    questOffer.meiwen-the-library-card: ["Qing keeps the library's old cards. if the seventh form was ever borrowed, his card would say who. thin out the sage cats in the goblin forest first, thirty of them. they sit on the pages and won't let him look. then ask him."]
    questAccept.meiwen-the-library-card: ["the virtuous forest and the goblin forests. the cats think they're scholars. they're cats. then Qing, in town."]
    questWaiting.meiwen-the-library-card: ["thirty cats, and Qing's card. he'll take his time. he enjoys taking his time."]
    questComplete.meiwen-the-library-card: ["borrowed. thirty years ago. by an herbalist from Herb Town. ...it was lent. it wasn't lost. it was lent. that's a different word. i'll have to think about which one i've been grieving."]
    questOffer.meiwen-the-seventh-form: ["you heard Qing and me. Oksun in Herb Town has my page, wrapped around a root. her root's dug now, i'm told. go to her. ask for the paper. say please. say it from the hips."]
    questAccept.meiwen-the-seventh-form: ["Herb Town, down the road from the peach farms. Oksun. she's old. so am i. be patient with both of us."]
    questWaiting.meiwen-the-seventh-form: ["the seventh form. i've cleared the floor. i've never cleared the floor."]
    questComplete.meiwen-the-seventh-form: ["...the seventh form. 'stand where you were.' that's the whole of it. four words. forty years. i'm going to sit down. then i'm going to stand up. then i'm going to teach it."]
    questOffer.meiwen-paper-for-the-binding: ["the old pages want backing. fifteen sheets of old paper from the book ghosts?"]
    questAccept.meiwen-paper-for-the-binding: ["the foggy forest."]
    questWaiting.meiwen-paper-for-the-binding: ["fifteen sheets."]
    questComplete.meiwen-paper-for-the-binding: ["fifteen. the binding holds another year."]
    about.qing: ["Qing was my worst pupil. he read about the forms instead of doing them. now he keeps the library. he's very good at it. i've never told him."]
    about.suyin: ["Suyin was my best pupil. she does the forms faster than they're meant to be done. they still work. i've stopped arguing."]
    about.xiaobo: ["Xiaobo wants to beat Suyin. he will, one day, if he learns to lose to her properly first."]
    about.oksun: ["Oksun. an herbalist in Herb Town. we've never met. i'm told she grows things slowly. i'd like her."]
    aboutUnknown: ["not one of mine."]
    friend.close: ["your stance has improved. that's the warmest thing i know how to say."]
    friend.best: ["if i taught one more student before i stop, i'd want it to be you. i won't, but i'd want it."]
    famed: ["they speak well of you. stand like you know it."]
    defamed: ["they speak ill of you. stand like it doesn't matter. it only matters a little."]
    gift: ["thank you. that's kind."]
    gift.favorite: ["oh. that's thoughtful. you've been paying attention. that's the first form, really."]
    gift.again: ["one is a gift. two is a habit."]

