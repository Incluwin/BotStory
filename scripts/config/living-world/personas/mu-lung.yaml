      - { from: 22, to: 8, materialize: false }
  recruitable: false
  knows: [virtuous forest, blue flower serpent, straw target dummy]
  questLines: [qing-snake-leather-bindings, qing-straw-for-the-shelves, qing-the-overdue-books]
  rumors: [mu-lung-the-borrowed-page]
  relationships:
    - { persona: meiwen, kind: OLD_TEACHER }
    - { persona: lai, kind: NEIGHBOUR }
  giftItemIds: [4000281, 2000002]
  dialogue:
    greetFirst: ["a reader? you have the look. no? a fighter, then. we have fighters. what we lack is readers.", "welcome. the library's out. all of it. it walked into the forest. i keep the cards."]
    greet: ["hello again. no returns today.", "ah. you. any books follow you home?"]
    idle: ["(flips through a little box of yellowed cards, frowning at the handwriting)", "(reads a single card very slowly, then puts it back in exactly the same place)"]
    noWork: ["nothing to shelve. there's never anything to shelve. that's rather the problem."]
    nothingDue: ["no fines. you're square."]
    who: ["Qing. i keep the Mu Lung library. what's left of it. the books became ghosts thirty years ago and walked into the foggy forest. i kept the cards. every book that ever left has a card. i'm still waiting for some to come back."]
    bye: ["return what you borrow. that's all i ask of anyone."]
    thanks: ["oh, you're very welcome."]
    smallTalk: ["the book ghosts aren't angry. they're overdue. there's a difference. an angry book bites. an overdue book just won't come home.", "Meiwen says i was her worst pupil. she's right. i was too busy reading about falling to fall properly."]
    speakPlainly: ["plainly: cards, ghosts, and a library with no books in it."]
    questOffer.qing-snake-leather-bindings: ["the card boxes want new hinges. the flower serpents past the sky forest have good soft leather. twenty-five serpents, fifteen pieces of snake leather?"]
    questAccept.qing-snake-leather-bindings: ["the snake area, and where the sky forest ends. the blue ones. they don't bite unless you're slow. i'm slow."]
    questWaiting.qing-snake-leather-bindings: ["fifteen pieces. the hinges are held on with string."]
    questComplete.qing-snake-leather-bindings: ["fifteen. lovely. the boxes will open and close like they mean it."]
    questOffer.qing-straw-for-the-shelves: ["i keep the empty shelves packed with straw so they don't forget their shape. the straw dummies in the practice field are stuffed with the best of it. twenty-five dummies, fifteen straw dolls?"]
    questAccept.qing-straw-for-the-shelves: ["the practice fields, the beginner's and the easy one. the dummies don't hit back. they just stand there. it's oddly sad."]
    questWaiting.qing-straw-for-the-shelves: ["fifteen dolls. the shelves are sagging."]
    questComplete.qing-straw-for-the-shelves: ["fifteen. the shelves remember they're shelves. thank you."]
    questOffer.qing-the-overdue-books: ["the overdue ones go deepest. twenty-five book ghosts in the virtuous forest, then walk on to the second goblin forest and look for any that went further. just look. i want to know where they go."]
    questAccept.qing-the-overdue-books: ["the virtuous forest, the first goblin forest, then the second. tell me if you see a book with a red spine. that's the one i miss."]
    questWaiting.qing-the-overdue-books: ["twenty-five, and the second goblin forest. any red spines?"]
    questComplete.qing-the-overdue-books: ["no red spine? ...well. it's somewhere. books always are."]
    about.meiwen: ["Meiwen taught me the forms. i was terrible. she taught me anyway. i've never thanked her properly. i've written it on a card. i haven't given her the card."]
    about.lai: ["Lai brings me peaches. i lend her nothing, because there's nothing to lend. she brings them anyway."]
    about.oksun: ["Oksun of Herb Town. there's a card with her name on it. i've read it more than i've read anything else this year."]
    aboutUnknown: ["no card for them."]
    friend.close: ["i've made you a card. it says 'returns things'. it's the highest thing i can write on a card."]
    friend.best: ["if the library ever comes home, you're the first one i'm lending to. anything you like."]
    famed: ["you're being talked about. i've noted it. on a card."]
    defamed: ["people are saying things. i've noted it. in pencil."]
    gift: ["oh, thank you."]
    gift.favorite: ["oh, that's useful. that's going straight into the card box."]
    gift.again: ["one a day is plenty. i'd only have to make another card."]

