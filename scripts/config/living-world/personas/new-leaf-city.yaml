    friend.best: ["there's a stretch of jungle on my map with your name on it. i didn't ask. i don't ask."]
    famed: ["people want to walk the survey because you did. the jungle's never been so busy."]
    defamed: ["the jungle doesn't care. neither do i."]
    gift: ["oh. thank you."]
    gift.favorite: ["that's trail food. that's exactly right for the cliffs."]
    gift.again: ["tomorrow. i've got a pack to carry."]

