    questAccept.duke-sparring: ["the lower ascent and the caverns."]
    questWaiting.duke-sparring: ["ten."]
    questComplete.duke-sparring: ["ten. the door holds."]
    about.dolores: ["Dolores feeds me six eggs every morning. i've never paid for the sixth. she's never charged."]
    about.brody: ["Brody spars with me on his days off. he takes the left. he always takes the left. i let him."]
    aboutUnknown: ["never been in the ring with them."]
    friend.close: ["you can use the gym any time. the bag's yours. hit it like it owes you."]
    friend.best: ["i'll be in your corner. any fight, any day. that's a promise, champ."]
    famed: ["people come to the gym asking about you. i tell them you train here. you do now."]
    defamed: ["people are throwing punches at your name. let them. you've got a chin."]
    gift: ["thanks, champ."]
    gift.favorite: ["breakfast of champions. that's me. thanks, champ."]
    gift.again: ["one a day, champ. i'm watching my weight. i'm not."]

- id: odette
  name: Odette
  look: { gender: female }
  title: "Keeper of the Spirit Pens"
  job: BEGINNER
  level: { min: 16, max: 18 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: new-leaf-city
    routine:
      - { from: 8, to: 15, spot: "venue:beside-rob", activity: LINGER }
      - { from: 15, to: 19, spot: "venue:upper-west-street", activity: LINGER }
      - { from: 19, to: 8, materialize: false }
  recruitable: false
  knows: [killa bee, stormbreaker, jungle juice]
  questLines: [odette-the-spirit-pens, odette-a-spirit-for-you, odette-the-taru-feather]
  relationships:
    - { persona: gwen, kind: GETS_SEED_FROM }
    - { persona: benji, kind: SHOWS_THE_SPIRITS_TO }
    - { persona: cosmo, kind: HUMOURS }
  giftItemIds: [2020005, 2001001]
  dialogue:
    greetFirst: ["shh, you'll wake them. ...too late. that one's awake. say hello.", "hello! mind your feet. the spirits don't come out till they like you."]
    greet: ["hello again.", "they remember you. i think. one of them sneezed.", "you're back. good. Kuma's been sulking."]
    idle: ["(holds out an open hand very still, as if something small is about to land on it)", "(scatters a pinch of seed along the street and counts something nobody else can see)"]
    noWork: ["nothing today. the spirits are asleep. i'm going to sit very quietly."]
    nothingDue: ["nothing owed. the spirits keep count. they say so."]
    who: ["Odette. i keep the spirit pens for Corine. little Masteria spirits: Akha, Xaru, Kuma, Maku, Umaru. Corine wakes them into weapons. i keep them fed till they're ready to go."]
    bye: ["walk softly."]
    thanks: ["they say thank you too. you can't hear it."]
    smallTalk: ["the killa bees in the MesoGears soul corridor steal the spirits' honey. every jar. i don't know what bees want with honey. more honey, i suppose.", "the Taru painted their faces before a hunt and sewed feathers into their capes. Corine says the spirits remember the Taru. i think they miss them."]
    speakPlainly: ["plainly: little spirits, and a lot of seed."]
    questOffer.odette-the-spirit-pens: ["the killa bees in the MesoGears soul corridor came up the stairs and took the spirits' honey. all of it. twenty-five bees, and they might stay down there where they belong."]
    questAccept.odette-the-spirit-pens: ["MesoGears, through the big door in the Town Center. the soul corridor's long. the bees are in all of it."]
    questWaiting.odette-the-spirit-pens: ["twenty-five. the spirits are hungry. they're being very brave about it."]
    questComplete.odette-the-spirit-pens: ["the bees have gone back down. the spirits are eating. listen. well, you can't. i can. here, Jungle Juice. the Taru drank it before a long walk. it's mostly fruit."]
    questOffer.odette-a-spirit-for-you: ["one of the spirits keeps following you up the street. it's chosen. that doesn't happen. Corine says it wants to see the jungle before it picks a shape. carry it out to the jungle valley and the Krakian basin, and let it look. then bring it back to me."]
    questAccept.odette-a-spirit-for-you: ["you won't feel it. it's on your shoulder. the jungle's past the Town Center. go slowly. it's looking."]
    questWaiting.odette-a-spirit-for-you: ["the valley and the basin. it wants to see both."]
    questComplete.odette-a-spirit-for-you: ["it's picked. Corine woke it for you the moment you came back. it's small. it'll grow if you're kind to it, and if Corine's in a good mood. look after it."]
    questOffer.odette-the-taru-feather: ["Corine's got a Taru cape on her frame, the old kind, with a spirit feather sewn in the collar. it wants a warrior. the stormbreakers on Crimsonwood's upper ascent keep scattering the old Taru roosts. thirty of them, and the cape's yours to give."]
    questAccept.odette-the-taru-feather: ["the cab to the Haunted House, through the forest, up Crimsonwood Mountain. the upper ascent. it's windy. hold on to your hat."]
    questWaiting.odette-the-taru-feather: ["thirty. the roosts are empty till they're gone. keep a space in your bag for what i'm giving you."]
    questComplete.odette-the-taru-feather: ["the roosts are full again. here. the cape, and the feather that was left over. it's a warrior's cape. if you don't stand at the front, give it to someone who does. the Taru would."]
    about.gwen: ["Gwen gives me the seed her flowers don't want. the spirits want it. everybody's happy."]
    about.benji: ["Benji tries to see the spirits. he squints. they like him for trying. one of them sat on his head."]
    about.cosmo: ["Cosmo says Stirgeman's got a spirit too. he hasn't. i didn't tell him."]
    aboutUnknown: ["the spirits don't know them either."]
    friend.close: ["you can feed them, if you like. slowly. there. they like you."]
    friend.best: ["the spirit that chose you comes back to the pens every night and sleeps in your spot. i've stopped calling it a coincidence."]
    famed: ["the spirits perk up when people say your name. people say it a lot."]
    defamed: ["the spirits don't listen to talk. neither do i."]
    gift: ["oh, thank you."]
    gift.favorite: ["oh, that's lovely. i'll share it. they'll get the crumbs. they always get the crumbs."]
    gift.again: ["tomorrow. they're watching. they get jealous."]

- id: cosmo
  name: Cosmo
  look: { gender: male }
  title: "Stirgeman's Sidekick, Unofficial"
  job: BEGINNER
  level: { min: 13, max: 14 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: new-leaf-city
    routine:
      - { from: 9, to: 13, spot: "venue:middle-west-street-2", activity: SOCIALIZE }
      - { from: 13, to: 18, spot: "venue:middle-west-street-2", activity: LINGER }
      - { from: 18, to: 9, materialize: false }
  recruitable: false
  knows: [rotting skeleton, glutton ghoul, stirge signal]
  questLines: [cosmo-the-stirge-signal, cosmo-the-stirgeman-kit, cosmo-the-utility-pants]
  relationships:
    - { persona: brody, kind: SIGNALS }
    - { persona: benji, kind: RIVALS }
    - { persona: odette, kind: BELIEVES }
  giftItemIds: [2001001, 2020005]
  dialogue:
    greetFirst: ["halt, citizen! ...sorry. that's how Stirgeman says hello. hello!", "are you a hero? you look like a hero. Stirgeman's a hero. i'm his sidekick. he doesn't know yet."]
    greet: ["citizen!", "you're back! any villains?", "hi! i've been on patrol. it's very quiet. suspicious."]
    idle: ["(adjusts a cape made out of a tablecloth, then strikes a pose at nobody)", "(peers round a lamp post toward the Town Center as if he's keeping watch on someone)"]
    noWork: ["no missions today. the city's safe. for now."]
    nothingDue: ["all square, sidekick to sidekick!"]
    who: ["Cosmo. i'm Stirgeman's sidekick. he stands in the Town Center being a hero and i stand near him being a sidekick. he hasn't said yes. he hasn't said no."]
    bye: ["stay vigilant!"]
    thanks: ["all in a day's work, citizen."]
    smallTalk: ["Stirgeman has a signal. you light it and he comes. i lit mine and Officer Brody came. that's nearly the same.", "Ridley wrote the scroll Stirgeman uses for defence. he's up in Crimsonwood Keep. i've read the scroll nine times. it's mostly about standing up straight."]
    speakPlainly: ["plainly: a sidekick. unofficial."]
    questOffer.cosmo-the-stirge-signal: ["mission! the rotting skeletons in the Haunted House hallways rattle so loud nobody in the city could hear a signal if i lit one. twenty-five of them, citizen. for justice. and quiet."]
    questAccept.cosmo-the-stirge-signal: ["the NLC Taxi to the Haunted House. the hallways go on and on. so do the skeletons."]
    questWaiting.cosmo-the-stirge-signal: ["twenty-five. i can still hear them from here. i think."]
    questComplete.cosmo-the-stirge-signal: ["it's quiet! here, your cab fare back, and signals and Ridley's defence scrolls from my emergency box. every sidekick has one. you're a sidekick now. sorry. it's catching."]
    questOffer.cosmo-the-stirgeman-kit: ["i'm making a Stirgeman kit. a real one. a cape and a Stirge-on-a-String, just like his. the cape needs stretch. the glutton ghouls in the Haunted House carry stretchy stuff around. ten pieces. you get the first kit. you've earned it."]
    questAccept.cosmo-the-stirgeman-kit: ["the NLC Taxi to the Haunted House. the ghouls are in the foyer. they're hungry. don't be food."]
    questWaiting.cosmo-the-stirgeman-kit: ["ten stretchy bits. the cape's very floppy."]
    questComplete.cosmo-the-stirgeman-kit: ["it stretches! here. the first Stirgeman kit, the cape and the string. and a Ridley's stone and a fuel cell from the box, because heroes need spares. wear it. stand up straight."]
    questOffer.cosmo-the-utility-pants: ["Stirgeman's utility pants. lots of pockets. i made a pair for a grown-up. the psycho jack boxes in the Haunted House toy rooms keep popping up and pinching the pockets. twenty of them, and the pants are yours."]
    questAccept.cosmo-the-utility-pants: ["the Haunted House again. the toy rooms. they pop. you jump. everybody jumps."]
    questWaiting.cosmo-the-utility-pants: ["twenty. the pockets are in danger."]
    questComplete.cosmo-the-utility-pants: ["the pockets are safe! here. they're yours. there's a biscuit in the left one. i'm sorry. it's old."]
    about.brody: ["Officer Brody came when i lit my signal. he said not to light it again. i've lit it twice since. he came both times."]
    about.odette: ["Odette has invisible spirits. i can't see them. i believe her. heroes believe people."]
    about.benji: ["Benji's my rival. he wants to be an explorer. i want to be a hero. we're going to be the best two people in the city."]
    aboutUnknown: ["are they a villain? they might be a villain."]
    friend.close: ["you can be my sidekick's sidekick. that's a very high rank. it's the highest."]
    friend.best: ["i've told Stirgeman about you. he didn't say anything. heroes don't. i could tell he was impressed."]
    famed: ["the whole city's talking about you. like a hero. like a real one."]
    defamed: ["people say you're a villain. i don't believe them. villains don't come back to talk to sidekicks."]
    gift: ["for me? thanks, citizen!"]
    gift.favorite: ["WOW. that's going in the emergency box. no, i'm having it now. emergencies can wait."]
    gift.again: ["one a day! sidekick rules."]

- id: gideon
  name: Gideon
  look: { gender: male }
  title: "Bosshunter of the West Benches"
  job: FIGHTER
  level: { min: 58, max: 60 }
  strength: VETERAN
  loadout: perion-2h-sword-l38
  personality: efficient-v1
  home:
    town: new-leaf-city
    routine:
      - { from: 10, to: 17, spot: "venue:middle-west-benches", activity: REST }
      - { from: 17, to: 23, spot: "venue:lower-east-street", activity: LINGER }
      - { from: 23, to: 10, materialize: false }
  recruitable: false
  knows: [gryphon, firebomb, twisted jester]
  questLines: [gideon-the-trophy-wall, gideon-the-ancient-helm, gideon-the-ancient-gi]
  rumors: [nlc-the-old-crews]
  relationships:
    - { persona: mabel, kind: RODE_AFTER }
    - { persona: sabine, kind: ARGUES_WITH }
    - { persona: hollis, kind: TELLS_THE_OLD_TRAILS_TO }
  giftItemIds: [2000004, 2020004]
  dialogue:
    greetFirst: ["sit if you're sitting. stand if you're standing. don't hover.", "a young one with a sword arm. Barricade's crews took them younger. sit down."]
    greet: ["back from somewhere. good.", "sit.", "the bench is free."]
    idle: ["(turns an old crest over in his hands and rubs the dust off it with his thumb)", "(sharpens a notched sword he plainly hasn't used in years, slowly, for something to do)"]
    noWork: ["nothing today. the trophies aren't going anywhere. neither am i."]
    nothingDue: ["nothing owed."]
    who: ["Gideon. bosshunter. i rode with John Barricade's second crew. we went after the big things in Masteria and brought back pieces. the pieces are in a crate under these benches. the stories are in Mabel."]
    bye: ["watch the high ground."]
    thanks: ["good. thank you."]
    smallTalk: ["the typhons nest on the Path of Peril, up Crimsonwood Mountain. i took a crest off one once. i've still got it. i've still got the scar.", "the old Masterian armies left their armour all over the mountain. a helm, greaves, a gi so fine you'd swear it was new. we hung it on a wall. the wall burned down. the armour didn't."]
    speakPlainly: ["plainly: an old bosshunter and a crate of trophies."]
    questOffer.gideon-the-trophy-wall: ["i'm opening the trophy crate. it wants a proper hunt first, the way we did it. twenty-five gryphons on the highlands. then ask Mabel if she still remembers our old wall. she will."]
    questAccept.gideon-the-trophy-wall: ["the jungle road, all the way up to the highlands. gryphons come at you from above. look up."]
    questWaiting.gideon-the-trophy-wall: ["twenty-five, and what Mabel said."]
    questComplete.gideon-the-trophy-wall: ["she remembers. of course she does. here. the first two out of the crate, the Typhon's crest and the stone tiger's head, and Barricade's ginger ale. we drank it after every hunt. it's flat. it was always flat."]
    questOffer.gideon-the-ancient-helm: ["the old armour's coming out of the crate. the helm, the armour, the greaves. clear the MesoGears fire chamber for me first, forty firebombs. that's where i keep the crate. i want it the way it was."]
    questAccept.gideon-the-ancient-helm: ["MesoGears, down to the fire chamber. the firebombs go off. step through it."]
    questWaiting.gideon-the-ancient-helm: ["forty. then the armour comes out."]
    questComplete.gideon-the-ancient-helm: ["forty. the chamber's the way i left it. here. i'm not hanging them. i'm giving them to you. a wall's for people who've stopped. you haven't."]
    questOffer.gideon-the-ancient-gi: ["the rest of the set. the faceguard, the gi, the boots, and the crystal shard and the jewel we found with them. the twisted jesters in the Haunted House toy room and piano room took my last crew's map. thirty of them. i want to know the map's gone for good."]
    questAccept.gideon-the-ancient-gi: ["the cab to the Haunted House. the toy room and the piano room. they laugh. don't laugh back."]
    questWaiting.gideon-the-ancient-gi: ["thirty. the map's in there somewhere."]
    questComplete.gideon-the-ancient-gi: ["no map? then it's gone. good. that's the last of the crate. take it. Barricade said the pieces were for whoever went out next. that's you. it was always going to be somebody."]
    about.mabel: ["Mabel was on Barricade's first crew. i was on his second. she says the second was easier. it wasn't. she knows."]
    about.sabine: ["Sabine walked to Zakum's door with Adonis. i went after the big things in Masteria. we argue about whose was bigger. it's mine. it was hers."]
    about.hollis: ["Hollis surveys the jungle we used to hunt. he asks me where the old trails went. i tell him. he writes it down. somebody should."]
    aboutUnknown: ["never hunted with them."]
    friend.close: ["you can sit on the benches with the old crew. there's two of us. it's a crew."]
    friend.best: ["if Barricade were still riding out, i'd tell him to take you. i'd tell him to put you in front."]
    famed: ["they're telling stories about you on the benches. Mabel's telling them. they're getting bigger."]
    defamed: ["hunters get talked about. let them."]
    gift: ["hm. thanks."]
    gift.favorite: ["good. thank you. hunters eat when they can."]
    gift.again: ["enough. i'm old, not hungry."]

- id: sabine
  name: Sabine
  look: { gender: female }
  title: "Healer of Adonis's Expedition"
  job: PRIEST
  level: { min: 72, max: 74 }
  strength: VETERAN
  loadout: orbis-wand-l58
  personality: relaxed-v1
  home:
    town: new-leaf-city
    routine:
      - { from: 11, to: 17, spot: "venue:upper-west-street-2", activity: LINGER }
      - { from: 17, to: 22, spot: "venue:lower-east-street", activity: SOCIALIZE }
      - { from: 22, to: 11, materialize: false }
  recruitable: false
  knows: [miner zombie, jr. yeti, dead mine i]
  questLines: [sabine-the-dead-mine-stories, sabine-the-cloak-of-corruption]
  rumors: [nlc-the-old-crews]
  relationships:
    - { persona: gideon, kind: ARGUES_WITH }
    - { persona: mabel, kind: ARGUES_WITH }
    - { persona: brody, kind: PATCHES_UP }
  giftItemIds: [2020004, 2000002]
  dialogue:
    greetFirst: ["hello. you look tired. everyone looks tired to me. it's a healer's habit.", "a new face. sit down. New Leaf City has the best benches in the world. i've checked."]
    greet: ["hello, dear.", "you're back. any cuts? let me see.", "come and sit a minute."]
    idle: ["(sits with her eyes shut and her hands folded, perfectly still)", "(polishes a plain old miner's lamp until it shines, then sets it down unlit)"]
    noWork: ["nothing today. i'm sitting down. i earned it in a mine."]
    nothingDue: ["we're square, dear."]
    who: ["Sabine. i was a healer on Adonis's expedition, down through El Nath's dead mine to Zakum's door. it's cold down there and dark all the time. now i live where it's warm and i sit in the sun. i don't apologize for it."]
    bye: ["mind your health."]
    thanks: ["bless you."]
    smallTalk: ["Adonis still recruits in El Nath. he asked me back. i said i'd think about it. i've been thinking about it for six years, in the sun.", "the miner zombies in the dead mine still swing their picks at the dark. they don't know they've stopped being miners. i read their names out when we passed. somebody in El Nath keeps the roll."]
    speakPlainly: ["plainly: a healer, retired, in the sun."]
    questOffer.sabine-the-dead-mine-stories: ["Gideon thinks his hunts were bigger than our expedition. go and ask him what the biggest thing he ever hunted was. then go down to the MesoGears ice chamber and fight thirty jr. yetis, so you know what cold is. then come and tell me who's right."]
    questAccept.sabine-the-dead-mine-stories: ["Gideon's on the west benches most of the day. the ice chamber's at the bottom of MesoGears. wrap up."]
    questWaiting.sabine-the-dead-mine-stories: ["Gideon, then the cold. then me. and keep a space in your bag, dear."]
    questComplete.sabine-the-dead-mine-stories: ["a typhon. he always says a typhon. and you've been cold now, a little. i was right. here, from the expedition. the blade was a warrior's, Adonis's spare. if you're not a warrior, give it to one. the ankh and the denari were for luck. they worked. i'm here."]
    questOffer.sabine-the-cloak-of-corruption: ["i want to send the miners in El Nath's dead mine some peace. the miner zombies in the deep galleries still swing their picks at the dark. forty of them. and find whoever keeps the roll of the mine in El Nath, and tell them Sabine read the names. they'll know."]
    questAccept.sabine-the-cloak-of-corruption: ["El Nath, then down to the dead mine, the third and fourth galleries. the roll's kept somewhere in town. ask."]
    questWaiting.sabine-the-cloak-of-corruption: ["forty, and the roll. take a lamp."]
    questComplete.sabine-the-cloak-of-corruption: ["thank you. here. the cloak i wore at Zakum's door. corrupted, they call it. it's only dark. so was the mine. and these, the wrappings and Ridley's book, from Adonis's packs. he never asked for them back. he won't."]
    about.gideon: ["Gideon hunted the big things in Masteria. i walked to Zakum's door. we sit on the lower east street and argue. it's the best part of my week."]
    about.mabel: ["Mabel was on the first crew into Masteria. she's the only person i know who's been colder than me. she says the jungle was worse. she's wrong. it's lovely, arguing."]
    about.brody: ["Officer Brody comes to me with his bruises. he gets a lot of bruises. he says it's paperwork."]
    aboutUnknown: ["i never healed them."]
    friend.close: ["you can come to me with any cut. any time. i'll tut. you'll be fine."]
    friend.best: ["if Adonis ever asks me back, i'll say yes if you're going. that's the only way i'd go."]
    famed: ["people say your name in the sun now. that's the best place for it."]
    defamed: ["let them talk, dear. it doesn't heal anything."]
    gift: ["oh, thank you, dear."]
    gift.favorite: ["oh, that's lovely. that's a sunny-afternoon thing, that is. thank you."]
    gift.again: ["one a day, dear. healers have rules."]
