    greetFirst: ["shh. no, you can talk. the Professor's thinking. he's always thinking. talk quietly.", "hello. are you here about the archive? nobody's ever here about the archive. you're very welcome."]
    greet: ["hello.", "you again. good. i've catalogued something.", "the Professor says hello. he doesn't. i do."]
