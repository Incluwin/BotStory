    greetFirst: ["Ramona, Leaf Ledger. you're new. new's a story. hold still while i decide if you're a good one.", "hi. don't mind the notebook. i write down everything. it's a condition."]
    greet: ["you again. good, i need a quote.", "anything happen to you today? anything at all?", "hey. off the record, i'm tired."]
