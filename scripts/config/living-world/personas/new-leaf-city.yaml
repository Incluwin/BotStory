    questAccept.ramona-the-ghost-ship-story: ["Kerning's airport, then Boat Quay Town. be kind to Rosnah. she's been asked before, badly."]
    questWaiting.ramona-the-ghost-ship-story: ["Rosnah, then the ship. i've already written the headline."]
    questComplete.ramona-the-ghost-ship-story: ["she talked. and the ship's real. 'the ship that waits for its crew'. that's the best headline i've ever written. i'm not changing it. thank you."]
    about.monty: ["Monty runs the card club. i've written it up for years. he cuts every one out and pins it to his crate. that's the nicest thing anyone's done with my paper."]
    about.priya: ["Priya's my best source. she's never told me anything. she just looks at a door, and then i go and look behind the door."]
