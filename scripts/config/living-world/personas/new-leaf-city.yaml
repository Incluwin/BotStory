    questOffer.monty-the-blueprints: ["Fergus can forge the pieces if he has the drawings. Foxwit's are in his archive, Theodora keeps them. Barricade's notes for the artifacts got pawned. Ezra on the lower east street has them, i'd bet the deck. ask both. and the killa bees in the MesoGears soul corridor chew through paper. thirty of them, so nothing chews the drawings on the way back."]
    questAccept.monty-the-blueprints: ["Theodora's by Foxwit most days. Ezra's on the lower east street. the soul corridor's down in MesoGears, past John Barricade."]
    questWaiting.monty-the-blueprints: ["Theodora, Ezra, thirty bees. then we've got a tournament."]
    questComplete.monty-the-blueprints: ["the drawings. real ones. i'm not crying. it's the dust off Ezra's shop. these were Barricade's too. take them. the club owes you."]
    questOffer.monty-cup-night: ["the Leaf Cup. tonight. the table's set, the drawings are at the forge, Benji wants to play. go tell Benji he's in, and tell Ramona to bring her camera. then come back and deal the first hand."]
