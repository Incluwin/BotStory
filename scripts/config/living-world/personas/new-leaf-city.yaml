    questAccept.priya-the-patrol-report: ["Brody's on the street most mornings, by the Mayor's office. he'll pretend he's busy."]
    questWaiting.priya-the-patrol-report: ["the report. any report. he can tell it to you."]
    questComplete.priya-the-patrol-report: ["'all quiet, ghosts at the Haunted House as usual'. that's the report. it's the same every week. it's still a report. thank you."]
