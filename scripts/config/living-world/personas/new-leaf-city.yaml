    questOffer.theodora-the-catalogue: ["the boomers in the jungle clearing and the jungle valley swallowed a box of the Professor's notes. their cores are the only part that doesn't explode. thirty boomers, ten cores. some of the notes might be in there."]
    questAccept.theodora-the-catalogue: ["the jungle, past the Town Center. they go off when they're cross. they're usually cross."]
    questWaiting.theodora-the-catalogue: ["ten cores. i'm prepared to be disappointed."]
    questComplete.theodora-the-catalogue: ["ten cores, and three notes inside. three! one's a recipe for soup. it's still a note. and these were in the box with them, the Professor's samples. dark matter and zeta residue. he'd want them used. thank you."]
    questOffer.theodora-the-zeta-cape: ["the Zeta Cape drawing is in the Haunted House library. the Professor lent it to someone in that house years ago. the voodoos and hoodoos guard the library and the bedrooms. twenty voodoos, ten hoodoos, and the drawing comes home."]
    questAccept.theodora-the-zeta-cape: ["the cab to the Haunted House, then up to the bedrooms and the library. they're dolls. they're not dolls."]
    questWaiting.theodora-the-zeta-cape: ["twenty and ten. the drawing's been gone eleven years."]
    questComplete.theodora-the-zeta-cape: ["the drawing. the Zeta Cape. Fergus made it up for me the moment i asked, and i asked the moment i had it. here. the first one ever made. it's yours. and the Professor's blinking dingbat, from the same drawer. it blinks. nobody knows why."]
    about.fergus: ["Fergus borrows the Professor's drawings. he brings them back cleaner than he took them. he denies it."]
    about.bijou: ["i sell Bijou a sketch now and then. the Professor knows. he says it's good for the sketches to be loved."]
    about.delphine: ["Delphine is the Professor's other assistant. she's brilliant and she's on fire about half the time. literally."]
    aboutUnknown: ["not in the archive."]
    friend.close: ["you can read the archive any time. touch nothing. read everything."]
    friend.best: ["i've started a file for you. it's very thick. it's all good."]
    famed: ["the Professor asked who you were. i had a file ready."]
    defamed: ["there's a file on you. it's mixed. files usually are."]
    gift: ["oh. thank you."]
    gift.favorite: ["oh, that's lovely. that's a long night with the archive, that is."]
    gift.again: ["one a day. the archive has rules. i wrote them."]

