    questAccept.hollis-the-sirius-cloak: ["the cliffs, then the highlands. look up. they dive."]
    questWaiting.hollis-the-sirius-cloak: ["thirty. i'm holding the cloak open."]
    questComplete.hollis-the-sirius-cloak: ["thirty. listen. you can't hear the wind in it. that's the Sirius Cloak. Theodora gave me Foxwit's pattern for it years ago. it was always meant for whoever walked the survey with me."]
    questOffer.hollis-barricades-kit: ["Barricade's expedition kit. Fergus can forge it from the drawings if i bring the leather. jr. yeti pelts, from the MesoGears ice chamber. thirty yetis, twenty pelts. whatever you fight with, the kit has one for you."]
    questAccept.hollis-barricades-kit: ["MesoGears, the ice chamber. the pelts are thick. it's cold. that's how."]
    questWaiting.hollis-barricades-kit: ["twenty pelts. Fergus is waiting with his arms folded."]
    questComplete.hollis-barricades-kit: ["twenty. Fergus forged the kit in a night. Tiger's Fang for a swordsman, Winkel for a bow, Neva for a claw, Glitter Gloves for a mage, Stormcaster for a pirate. this is yours. it fits your hand. Barricade drew it that way."]
    questOffer.hollis-the-markers: ["twenty electrophants knocked my markers over again. it's every week."]
    questAccept.hollis-the-markers: ["the jungle basin and the slopes."]
    questWaiting.hollis-the-markers: ["twenty."]
    questComplete.hollis-the-markers: ["twenty. the markers are up."]
