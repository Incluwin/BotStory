    questWaiting.bijou-window-cards: ["ten cards. the window's bare."]
    questComplete.bijou-window-cards: ["ten. look at the window now. precious. here."]
    questOffer.bijou-the-crystal-leaf: ["the Crystal Leaf Earrings. the crystal's in the electrophants' socket adapters, in the contacts. the Krakian jungle basin and the mountain slopes. twenty-five electrophants, ten adapters."]
    questAccept.bijou-the-crystal-leaf: ["the jungle basin and the slopes. they spark. stand back."]
    questWaiting.bijou-the-crystal-leaf: ["ten adapters. i've got the leaves cut."]
    questComplete.bijou-the-crystal-leaf: ["ten. there. the leaves catch the light like they're still on the tree. Barricade's leaves. yours."]
    questOffer.bijou-the-dark-shards: ["a leprechaun stole my best shard. the Dark Shards need it. thirty leprechauns at the bent tree, the haunted hill and the swamp bog, and look on the haunted hill. that's where they hide the shiny things."]
    questAccept.bijou-the-dark-shards: ["the cab to the Haunted House, out into Phantom Forest. the haunted hill. they giggle. it's horrible."]
    questWaiting.bijou-the-dark-shards: ["thirty, and the hill. my shard."]
    questComplete.bijou-the-dark-shards: ["my shard. they had it the whole time. thirty leprechauns for one stone. worth it. the Dark Shards. Foxwit's pair. wear them."]
    about.clementine: ["Clementine and i share a window. hats above, earrings below. people look up, then down. it works."]
    about.theodora: ["Theodora sells me Foxwit's old sketches. she pretends she shouldn't. she shouldn't."]
    aboutUnknown: ["never pierced them."]
