    bye: ["if anything happens, tell me first."]
    thanks: ["noted. i mean that literally."]
    smallTalk: ["Icebyrd Slimm says the city's open to everyone. i asked him for a quote on that. he gave me four. he likes quotes.", "the best story going is the ghost ship in Singapore. a ship full of lanterns that waits without a crew. one day i'll have written all of it."]
