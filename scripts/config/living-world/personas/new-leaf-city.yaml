    questWaiting.ramona-the-front-page: ["Priya and Mabel. two quotes. one front page."]
    questComplete.ramona-the-front-page: ["'Mayor plans subway to nowhere' and 'explorer's crew once ate a boot'. that's a front page. here. you're a stringer now. it pays badly."]
