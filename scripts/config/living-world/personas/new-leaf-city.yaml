    questWaiting.mabel-the-camp-stove: ["ten pieces. blue fire. it's the only kind i miss."]
    questComplete.mabel-the-camp-stove: ["ten. listen to it crackle. blue. just like the old camp. thank you, dear."]
    questOffer.mabel-the-mountain: ["we turned back at the lower ascent of Crimsonwood Mountain. forty years ago. go and stand where we turned back. and the crimson trees up there, twenty of them, so it's a little less frightening than it was for us."]
    questAccept.mabel-the-mountain: ["through Phantom Forest, up onto the mountain. the lower ascent. tell me what you see."]
    questWaiting.mabel-the-mountain: ["did you stand there? what does it look like now?"]
