    about.hollis: ["Hollis surveys the jungle. i told him the jungle can't be surveyed. he's been trying for six years. i'm proud of him."]
    about.dolores: ["Dolores saves me a stool. i pay her in stories. she says it's a fair rate. it isn't, in her favour."]
    about.ramona: ["Ramona writes down everything i say. i've started saying better things."]
    aboutUnknown: ["never met them on the road."]
    friend.close: ["you can borrow my maps. bring them back. they're the only ones."]
    friend.best: ["if i'd had you on that crew, we'd have climbed the mountain."]
