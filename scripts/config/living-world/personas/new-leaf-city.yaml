# New Leaf City cast (Regional Residents wave 3, docs/REGIONAL_RESIDENTS_PLAN.md section 9): 25 Residents, 7 recruitable.
# Leaf Street's card club wants its first city tournament, and the only prizes worth playing for are the pieces John
# Barricade and Professor Foxwit drew up for Masteria (the MapleStory iTCG gear). The makers in town forge them as
# friendship gear; the club's arc hands out Barricade's four artifacts. Four recruits carry the third weapon tier of
# the mace, dagger, wand and knuckle lines (Phantom Forest and Crimsonwood, by the NLC Taxi); three carry iTCG pieces.
# Four more keep one iTCG set each: Odette (Set 3, the spirit weapons), Cosmo (Set 4, Stirgeman's kit), Gideon (Set 2,
# the Ancient armour and the bosshunters' trophies) and Sabine (Set 5, the Zakum expedition). Fergus forges the Glimmer
# Man's Versal weapons, Theodora and Fergus hand out Set 1's materials, and Benji the Starter Set's Red Relaxer.
# Light tie: Ramona's paper runs Singapore's ghost-ship story (personas/singapore.yaml).
