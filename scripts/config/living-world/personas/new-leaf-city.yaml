    questWaiting.priya-the-mesogears-survey: ["the lobby and the ice chamber. two lines on a form."]
    questComplete.priya-the-mesogears-survey: ["both still there. the Mayor will be relieved. he'll want to cut a ribbon. here, your fee, from the city."]
