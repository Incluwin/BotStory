    questWaiting.monty-cup-night: ["Benji, Ramona, then you. the cards are waiting."]
    questComplete.monty-cup-night: ["first hand dealt. the Leaf Cup. on Leaf Street. i ran a card club for eleven years with nothing on the table. tonight there's a table, and a crowd, and you dealt. thank you."]
    about.ramona: ["Ramona writes for the Leaf Ledger. she's written about the club twice. both times the headline was 'Club Has No Prizes'. accurate."]
    about.benji: ["Benji's the best player on Leaf Street and he's eleven. he's going to be the first person to win something at my club. i've decided."]
