  recruitable: true
  knows: [Ancient Golem, Spirit Zone Limbo, Eye of Time]
  contract: vidar-the-powder-share
  questLines: [vidar-the-eyes-of-time, vidar-reverse-blindness, vidar-timeless-blindness, vidar-spirit-zone-limbo, vidar-hourglasses]
  rumors: [camp-the-scouts-fire]
  benchToleranceDays: 3
  paceGap: 2
  relationships:
    - { persona: yrsa, kind: VOUCHES_FOR }
    - { persona: kasper, kind: LETS_CLEAN_HIS_GUN }
    - { persona: ama, kind: EATS_THREE_BOWLS_FROM }
    - { persona: vesper, kind: HEARD_OF }
  giftItemIds: [2000004, 2020015]
  dialogue:
    greetFirst: ["ho! a face from before! came on Cobie's road? smart. the masks would've had you. i'm bored. talk to me.", "welcome to the camp, traveller. careful where you stand. that's my gun-cleaning spot. Kasper's in it."]
    greet: ["ho!", "you again! good. the golems are dull company.", "hello! got any news from before? any at all?"]
    idle: ["(spins a pistol on one finger, catches it, and pretends that was the plan)", "(squints east toward the golems through a cracked spyglass, and then the other way, for fairness)"]
    noWork: ["nothing today! the golems are napping. so am i, nearly."]
    nothingDue: ["square! like a good powder charge."]
    who: ["Vidar. i keep the east watch, out past the camp to the Spirit Zone Limbo, where the golems stand about pretending to be hills. i shoot them when they stop pretending. Yrsa does the west. she's better. don't tell her."]
    bye: ["keep your powder dry!"]
    thanks: ["ho, thanks!"]
    smallTalk: ["the gun i carry was a marksman's, on a base in your years. she held a watch, like me. somebody kept it oiled a long, long time before it came to me. i keep it oiled. it's the least i can do.", "the Eyes of Time on your Temple's roads crack little hourglasses. i grind them for powder. time-glass powder. it doesn't make the shot faster. it makes it feel faster. that's half of it."]
    speakPlainly: ["plainly: one gun, one watch, a great many golems."]
    offer: ["a hundred thousand, and thirty cracked hourglasses for my powder. then i'm yours. loud, mind. i'm always loud."]
    join: ["ho! let's go! i'll be behind you making noise. it's a strategy."]
    bench: ["three days, then the east watch wants me back. the golems miss me."]
    leave: ["back to the watch!"]
    refuse.bond: ["not yet. i like to know who i'm shooting past."]
    refuse.flags: ["walk Memory Lane for me first: forty Eyes of Time, fifteen hourglasses. then ask."]
    refuseOwnErrand: ["the hourglasses first! come on."]
    questOffer.vidar-the-eyes-of-time: ["the Eyes of Time on Memory Lane, in your years. forty of them, any stretch, and fifteen of their cracked hourglasses. i grind them for powder. don't ask. it works."]
    questAccept.vidar-the-eyes-of-time: ["the Temple Keeper's door, the Past of the Verdure, and Memory Lane. the Eyes are on every stretch. they blink at you. ignore it."]
    questWaiting.vidar-the-eyes-of-time: ["forty, and fifteen glasses!"]
    questComplete.vidar-the-eyes-of-time: ["fifteen! ho, listen to them. somebody's moments. i'll grind them gently. you shoot straight, friend from before. i'd shoot past you."]
    questOffer.vidar-reverse-blindness: ["the chief guardians on the Road of Regrets' fourth stretch. thirty of them. and there's a marksman on a base in your years whose gun this was. Vesper. ask her about the long shot. i've been guessing for years."]
    questAccept.vidar-reverse-blindness: ["the Road of Regrets, the fourth stretch. then Omega Sector, the base under the tower. she holds the Kulan watch. she'll see you before you see her."]
    questWaiting.vidar-reverse-blindness: ["thirty, and Vesper's word!"]
    questComplete.vidar-reverse-blindness: ["'don't wait for it to be still. it won't be.' ...ho. that's it. that's what i've been doing wrong. and i'm right about axemen? i knew it. here. the Reverse Blindness. every slot at sixty, every one took. don't wait for things to be still."]
    questOffer.vidar-timeless-blindness: ["Dark Ereve, past the Gate to the Future. twenty tino in the tino forest, twenty tiguru at the far end. bring noise. it's the only way to do Dark Ereve."]
    questAccept.vidar-timeless-blindness: ["the Gate to the Future, east into the tino forest, then on through the tiru forest to the tiguru. make noise. they come to you. it saves walking."]
    questWaiting.vidar-timeless-blindness: ["twenty tino, twenty tiguru! was it loud?"]
    questComplete.vidar-timeless-blindness: ["forty! and loud, i bet. the Timeless Blindness. two tens and the rest at sixty, every one took. heavy, isn't it? that's the good kind of heavy."]
    questOffer.vidar-spirit-zone-limbo: ["the golems out east don't fall. not for you, not for me. the slimes on the Hill North of Henesys Ruins do. thirty of them. one fight you can win, before the end of days. there's an archer on the ruins' wall who'll watch you do it. wave at her."]
    questAccept.vidar-spirit-zone-limbo: ["the Temple Keeper's door to the Gate to the Future, in to Henesys Ruins, and east out of the square onto the hill. the archer's Dagny, i'm told. she'll see you."]
    questWaiting.vidar-spirit-zone-limbo: ["thirty! did you wave?"]
    questComplete.vidar-spirit-zone-limbo: ["thirty! and you waved, i bet. a fight you can win, won. the Timeless Blindness, and this one every slot a ten, every one took. there's no better gun in any year. ho. i'm going to fire it at the sky. once. for luck."]
    questOffer.vidar-hourglasses: ["ten hourglasses? the powder's low."]
    questAccept.vidar-hourglasses: ["Memory Lane. any stretch."]
    questWaiting.vidar-hourglasses: ["ten!"]
    questComplete.vidar-hourglasses: ["ten! ho, thanks!"]
    about.yrsa: ["Yrsa scouts the west road. she's the best scout alive. anyone who walks behind Yrsa gets where they're going and never once hears a mask. i'd say that to anyone. i do. she hates it."]
    about.kasper: ["Kasper cleans my gun. he's the best gun-cleaner in the camp. he's the only one. don't tell him that part."]
    about.ama: ["Ama makes the stew. i eat three bowls and say the second was best. it's never the second. it's always the third."]
    about.heddwyn: ["Heddwyn tells stories at the fire when he comes over. i've heard the boar one forty times. i laugh every time. it's a good boar."]
    about.vesper: ["Vesper. a marksman in your years, on a base under a tower. this gun was hers, once. somebody kept it oiled a long, long time before me. i'd like to think it was her."]
    aboutUnknown: ["never shot past them."]
    friend.close: ["you can stand in my gun-cleaning spot. tell Kasper i said."]
    friend.best: ["if you're ever on a watch you can't hold, fire twice at the sky. i'll hear it. i'll come loud."]
    famed: ["ho! they're saying your name at the fire! loud! good!"]
    defamed: ["somebody said something. i fired at the sky. they stopped."]
    gift: ["ho! thanks!"]
    gift.favorite: ["ho! now that's the good stuff. straight into the watch kit."]
    gift.again: ["one's plenty, friend!"]
