  giftItemIds: [2000005, 2050004]
  dialogue:
    greetFirst: ["you came on Cobie's road. good. the other way's got masks on it. sit.", "from before. quiet, please. the masks hear well."]
    greet: ["you.", "hm.", "back. good."]
    idle: ["(sits so still on the edge of the camp that the eye slides right past her, and then she is somewhere else)", "(turns a short dagger over and over across her knuckles, watching the road south)"]
    noWork: ["nothing."]
    nothingDue: ["even."]
    who: ["Yrsa. i scout ahead of Cobie's road between the camp and Twilight Perion: the rocky roads, the excavation site, the masks. Cobie takes people the safe way. i'm why it's safe."]
    bye: ["quiet, now."]
    thanks: ["hm."]
    smallTalk: ["the dagger i carry was a hustler's, in a city of your years. he sold maps. honest ones, mostly. the dagger's honest. it goes where i put it.", "the masks in the excavation site were masks, once. in your years they're wood, and stone. here they look at you. don't look back."]
    speakPlainly: ["plainly: a road, and nobody on it but me."]
    offer: ["a hundred and thirty thousand. you've walked my road, and you've heard Vidar on me. that's what you're paying for. then i'm at your back."]
    join: ["go. i'm behind you. you won't see me. that's right."]
    bench: ["three days. then the road."]
    leave: ["back to the road."]
    refuse.bond: ["no. i don't know your step yet."]
    refuse.flags: ["walk my road first: the three Pasts and the first stretch of Oblivion. and some evening on the middle east street, hear what Vidar says of me. then ask."]
    refuseOwnErrand: ["my road first."]
    questOffer.yrsa-the-three-pasts: ["scout for me, in your years. stand in each of the Temple's three Pasts: the Verdure, the Frozen, the Burning. then twenty oblivion monks on the first stretch of the Road to Oblivion. a scout looks first. then she cuts."]
    questAccept.yrsa-the-three-pasts: ["the Temple Keeper's door. the Past of the Verdure, then Memory Lane to the Frozen Past, the Road of Regrets to the Burning Past, and the first stretch beyond. look at each. then cut."]
    questWaiting.yrsa-the-three-pasts: ["three Pasts. twenty monks."]
    questComplete.yrsa-the-three-pasts: ["you looked first. good. most people don't. you'd do on my road."]
    questOffer.yrsa-reverse-killic: ["the chief guardians on Memory Lane's fourth stretch carry green hearts. thirty chiefs, fifteen hearts. i rub the hilt with the green. it keeps the grip quiet. a quiet grip's a quiet cut."]
    questAccept.yrsa-reverse-killic: ["Memory Lane, the fourth stretch. the chiefs are loud. be the other thing."]
    questWaiting.yrsa-reverse-killic: ["fifteen."]
    questComplete.yrsa-reverse-killic: ["fifteen. quiet. the Reverse Killic. every slot at sixty, every one took. it doesn't make a sound. neither should you."]
    questOffer.yrsa-timeless-killic: ["Dark Ereve, past the Gate to the Future. twenty tiru in the tiru forest, twenty tiguru in the tiguru forest. in and out. nobody sees you."]
    questAccept.yrsa-timeless-killic: ["the Gate to the Future, east into Dark Ereve. the tiru forest, then the tiguru forest off it. in and out."]
    questWaiting.yrsa-timeless-killic: ["twenty, twenty."]
    questComplete.yrsa-timeless-killic: ["forty, and i didn't hear about it. good. the Timeless Killic. two tens and the rest at sixty, every one took. hm. you'll do."]
    questOffer.yrsa-the-excavation-site: ["my road's worst stretch won't clear. not yet. not by you. the forest past the Gate to the Future will: the tino forest, where travellers from before stray in when they miss the ruins. thirty tino. so the next one walks in quiet."]
    questAccept.yrsa-the-excavation-site: ["the Temple Keeper's door to the Gate to the Future, then east into the Mutant Tino Forest. they swarm. don't stand still. cut."]
    questWaiting.yrsa-the-excavation-site: ["thirty."]
    questComplete.yrsa-the-excavation-site: ["thirty. the next one walks in quiet. the Timeless Killic, and this one every slot a ten, every one took. no quieter blade in any year. ...thank you. i mean it."]
    questOffer.yrsa-red-cone-hats: ["ten red cone hats? the hilt wraps."]
    questAccept.yrsa-red-cone-hats: ["the Road to Oblivion, the second stretch."]
    questWaiting.yrsa-red-cone-hats: ["ten."]
    questComplete.yrsa-red-cone-hats: ["ten. thanks."]
    about.vidar: ["Vidar makes a lot of noise for a scout. he's the best shot i know. i'd never say it where he could hear."]
    about.kasper: ["Kasper. i taught him the hiding holes. i told him if he's ever caught i never met him. he knows i'm lying."]
    about.ama: ["Ama saves me a bowl. i eat it standing. she doesn't mind. she knows why."]
    about.heddwyn: ["Heddwyn comes over on Cobie's road for Ama's suppers. i scout ahead. he talks the whole way. i don't mind. the masks don't like it. good."]
    about.vance: ["Vance. a hustler in a city of your years, they say. this dagger was his, once. he sold honest maps. it's an honest blade."]
    aboutUnknown: ["no."]
    friend.close: ["i'd walk you anywhere on my road. quietly."]
    friend.best: ["if you're ever on a road you can't see the end of, i'll scout it. you won't see me. i'll be there."]
    famed: ["people say your name at the fire. hm."]
    defamed: ["talk."]
    gift: ["hm. thanks."]
    gift.favorite: ["that's a good one. i'll take it on the road."]
    gift.again: ["one."]

- id: vidar
  name: Vidar
  look: { gender: male }
  title: "Gunner of the East Watch"
  job: CORSAIR
  level: { min: 170, max: 172 }
  strength: ELITE
  loadout: future-gun-l110
  personality: relaxed-v1
  home:
    town: tribal-refugee-camp
    routine:
      - { from: 6, to: 11, spot: "venue:lower-east-street", activity: LINGER }
      - { from: 11, to: 18, materialize: false }
      - { from: 18, to: 23, spot: "venue:middle-east-street", activity: SOCIALIZE }
