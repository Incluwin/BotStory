# Tribal Refugee Camp cast (Repack Residents, docs/REPACK_RESIDENTS_PLAN.md section 3.3): 4 Residents, 2 recruitable, at
# the camp north of the Forsaken Excavation Site, past Twilight Perion; Cobie 2142112 takes travellers the safe way
# between Twilight Perion and the camp (quests/tribal-refugee-camp.yaml header). The camp carries the middle of both Future
# threads: its cook is the sister Edda writes to from Henesys Ruins (arcs/henesys-ruins.yaml), its runner put a year of
# her answers through the wrong door, and the cook lights the old fire for Heddwyn's last story (arcs/twilight-perion.yaml).
# The camp's scouts carry the fourth weapon tier: Vance's dagger and Vesper's gun continued with the Reverse and Timeless
# pieces.
- id: ama
  name: Ama
  look: { gender: female }
  title: "Cook of the Refugee Camp"
  job: BEGINNER
  level: { min: 50, max: 52 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: tribal-refugee-camp
    routine:
      - { from: 5, to: 10, spot: "venue:by-ayan", activity: LINGER }
      - { from: 10, to: 12, spot: "venue:middle-central-street", activity: REST }
      - { from: 12, to: 16, spot: "venue:by-ayan", activity: LINGER }
      - { from: 16, to: 17, materialize: false }
      - { from: 17, to: 21, spot: "venue:by-blackbull", activity: SOCIALIZE }
      - { from: 21, to: 5, materialize: false }
  recruitable: false
  knows: [Orange Mushroom, Orange Mushroom Cap, Tribal Refugee Camp]
  questLines: [ama-mushrooms-from-before, ama-a-supper-for-the-story]
  rumors: [camp-the-supper]
  relationships:
    - { persona: edda, kind: SISTER_OF }
    - { persona: kasper, kind: FEEDS }
    - { persona: heddwyn, kind: COOKS_FOR }
    - { persona: yrsa, kind: SAVES_A_BOWL_FOR }
  giftItemIds: [2001002, 2022003]
  dialogue:
    greetFirst: ["you made it to the camp! sit. eat. no, eat first. then talk.", "from before? you look it. here. stew. it's thin. it's hot. those are the two things a stew has to be."]
    greet: ["sit! eat!", "you again! good. there's stew.", "hello, love. bowl?"]
    idle: ["(stirs an enormous pot with a paddle, tastes, frowns, and adds a pinch of something from her apron)", "(counts bowls on a plank, comes up two short, and sighs in Kasper's general direction)"]
    noWork: ["nothing today. the pot's on. the pot's always on."]
    nothingDue: ["you're square, love. eat something anyway."]
    who: ["Ama. i cook for the camp. when Henesys fell, half of us went east to the tribe's camp out here, and somebody had to feed everybody, so it was me. it was always going to be me. my sister Edda stayed in the ruins to keep the sick. we write every month. she writes three lines. i write four pages. that's us."]
    bye: ["take a bowl for the road!"]
    thanks: ["oh, you're a love."]
    smallTalk: ["the mushrooms round here bite. i won't cook a thing that bites back. your years had mushrooms you could just eat, i'm told. orange ones. caps like hats.", "Heddwyn comes over from Twilight Perion on Cobie's road for my suppers and stays too late. i let him. the children sit round him like he's the fire."]
    speakPlainly: ["plainly: a pot, a camp, and a sister who writes three lines."]
    questOffer.ama-mushrooms-from-before: ["your years had orange mushrooms that didn't bite. twenty caps. i'll make a soup the camp hasn't had since Henesys. no. longer. since never."]
    questAccept.ama-mushrooms-from-before: ["the orange mushrooms in your years. round the old Henesys, the real one, i'm told. twenty caps. don't let them bite you. they won't. that's the point."]
    questWaiting.ama-mushrooms-from-before: ["twenty caps. the pot's waiting."]
    questComplete.ama-mushrooms-from-before: ["twenty! they don't even twitch. look at that. a mushroom that just lies there and lets you cook it. the camp's having soup tonight. you're having two bowls."]
    questOffer.ama-a-supper-for-the-story: ["i'm making a supper by the old fire tonight, the storytelling fire from Perion, and the camp wants a story with it. a proper one, the way it was. Heddwyn tells them best. go and ask him to come. tell him it's the old fire. he'll know."]
    questAccept.ama-a-supper-for-the-story: ["Cobie will take you back to Twilight Perion, the safe way. Heddwyn will be by Christopher of an evening, or by the old tribe's stones in the morning. tell him the old fire. then come and tell me."]
    questWaiting.ama-a-supper-for-the-story: ["is he coming? he's coming. tell me he's coming."]
    questComplete.ama-a-supper-for-the-story: ["he'll come? and stay too late. good. the old fire's lit tonight. the children will sit round it like it's the first time. for some of them it always is."]
    about.edda: ["my sister. she keeps the sick in Henesys Ruins. we write every month. she writes like she's taking a pulse: three lines, to the point. i write like i cook: too much, and you'll be glad of it."]
    about.kasper: ["Kasper runs the camp's letters. he's fast. he's twelve. he's sure about everything. he's right about half of it. that's good going, at twelve."]
    about.yrsa: ["Yrsa scouts the road. she eats standing up and says thank you with her eyes. i save her a bowl. she always comes for it."]
    about.vidar: ["Vidar scouts east, toward the golems. he eats three bowls and tells me the second was the best. it's never the second. he's being kind."]
    about.heddwyn: ["Heddwyn comes over for my suppers and stays too late. i let him. his stories are better than my stew. don't tell him i said so."]
    aboutUnknown: ["never fed them. send them by."]
    friend.close: ["you've your own bowl now. it's the one with the chip. i'll know if anyone else uses it."]
    friend.best: ["if you're ever hungry, anywhere, in any year, think of my pot. it won't feed you. it'll help."]
    famed: ["the camp talks about you over supper. good things. the stew's better for it."]
    defamed: ["somebody said something about you. i gave them the thin end of the pot."]
    gift: ["oh, for me? you're a love."]
    gift.favorite: ["oh, that's a proper treat. i'll put it in the pot. no. i'll eat it myself. just this once."]
    gift.again: ["one's plenty, love. i'm the one who's meant to feed you."]

- id: kasper
  name: Kasper
  look: { gender: male }
  title: "Runner of the Refugee Camp"
  job: BEGINNER
  level: { min: 44, max: 46 }
  strength: ROOKIE
  loadout: beginner-townsfolk
  personality: relaxed-v1
  home:
    town: tribal-refugee-camp
    routine:
      - { from: 7, to: 10, spot: "venue:by-cobie", activity: STROLL }
      - { from: 10, to: 16, materialize: false }
      - { from: 16, to: 19, spot: "venue:middle-west-street", activity: LINGER }
      - { from: 19, to: 21, spot: "venue:by-blackbull", activity: SOCIALIZE }
      - { from: 21, to: 7, materialize: false }
  recruitable: false
  knows: [Twilight Perion, Henesys Ruins, Pillaging Iron Boar]
  questLines: [kasper-the-fast-way, kasper-the-door-goes-everywhere]
  rumors: [camp-the-supper]
  relationships:
    - { persona: ama, kind: IS_FED_BY }
    - { persona: heddwyn, kind: KEEPS_THE_TALLY_FOR }
    - { persona: yrsa, kind: LEARNED_THE_HIDING_HOLES_FROM }
    - { persona: vidar, kind: CLEANS_THE_GUN_OF }
  giftItemIds: [2001002, 2020017]
  dialogue:
    greetFirst: ["you're from before! i can tell. you've got clean everything. race you to the fire! no? fine.", "hello! i'm the fastest thing on the road. the boars are faster. i'm the fastest thing that isn't a boar."]
    greet: ["hi!", "you're back! did you run? you should run. everything's faster running.", "hello! i've been to Twilight Perion and back since breakfast. probably."]
    idle: ["(runs a lap of the camp for no reason, arrives back out of breath, and looks pleased)", "(makes a mark on a stick with a knife, counts the marks, and makes another)"]
    noWork: ["nothing today. nothing to run. i'm running anyway."]
    nothingDue: ["we're even! i'd race you for it but we're even."]
    who: ["Kasper. i run the camp's letters to Twilight Perion and back. Cobie's road is the safe way. Cobie's slow. i run ahead and wait for him in the hiding holes. the masks don't see me. the boars... we don't talk about the boars."]
    bye: ["run!"]
    thanks: ["thanks! that's a good one!"]
    smallTalk: ["Heddwyn says every story is his last. i keep the tally on a stick. it's a long stick. i'm saving room.", "Yrsa scouted Cobie's road with me once, all the way to Twilight Perion, and didn't say one word. i said all of them. it was the best walk ever."]
    speakPlainly: ["plainly: legs, and letters."]
    questOffer.kasper-the-fast-way: ["i bet you can't get to Henesys Ruins and back before i count to a thousand. not over the ridge. nobody goes over the ridge. the long way, through the doors. i'm not allowed through the doors, Ama says. so you go. i'll count. i can count really fast."]
    questAccept.kasper-the-fast-way: ["Cobie to Twilight Perion. Claudine's door to the temple in your years. the Temple Keeper's door to the Gate to the Future, and in to the ruins. touch the ruins, and all the way back. go!"]
    questWaiting.kasper-the-fast-way: ["...four hundred and twelve, four hundred and thirteen... you're not back yet! that means you're not back!"]
    questComplete.kasper-the-fast-way: ["you're back! through two doors and back? that's... a lot of counting. i'd have been faster. probably. definitely. fine, you're quite fast. for somebody from before. what are the ruins like? no. don't tell me. i'll see them one day."]
    questOffer.kasper-the-door-goes-everywhere: ["Edda says Ama never answers? Ama answers every month! i run them myself! the road west is all stumps, so i take them to the door by Claudine in Twilight Perion and put them through. Claudine says it goes everywhere. so where do they go? go and see!"]
    questAccept.kasper-the-door-goes-everywhere: ["Cobie to Twilight Perion, then the door by Claudine. it comes out at a temple, in your years. three doors, she says. somebody there must have them. ask everybody. and come back and tell me!"]
    questWaiting.kasper-the-door-goes-everywhere: ["did you find them? all of them? i ran fast every time. every single time."]
    questComplete.kasper-the-door-goes-everywhere: ["twelve! all of them! a man in the past kept them in a drawer? under 'not yet'? ...i sent Ama's letters into the past. i'm going to be in so much trouble. i'll keep them in my shirt till somebody's going west who won't get eaten. you, maybe."]
    about.ama: ["Ama feeds everybody. she fed me before she knew my name. she still calls me 'you'. she means it nicely."]
    about.edda: ["Edda in the ruins? Ama's sister. i've never met her. i've carried her name a hundred times. she writes very small."]
    about.yrsa: ["Yrsa's the best scout in the world. she taught me the hiding holes. she says if i ever get caught she'll pretend she never met me. she won't."]
    about.vidar: ["Vidar's got a gun that goes BANG. he lets me clean it. he says i'm the best gun-cleaner in the camp. i'm the only gun-cleaner in the camp."]
    about.heddwyn: ["Heddwyn tells the best stories. he says every one's his last. i keep the tally on a stick. he doesn't like the stick."]
    aboutUnknown: ["never raced them. are they fast?"]
    friend.close: ["you can have the second-best hiding hole. i'm keeping the best one."]
    friend.best: ["if you ever need anything run anywhere, i'll run it. even past the boars. well. round the boars."]
    famed: ["everybody knows your name! i run it about with the letters. that's how."]
    defamed: ["somebody said something about you. i ran away from them. that's what i do with people i don't like."]
    gift: ["for me? thanks!"]
    gift.favorite: ["that's the best thing! i'm eating it running!"]
    gift.again: ["one! Ama says i'll be sick! i won't! one."]

