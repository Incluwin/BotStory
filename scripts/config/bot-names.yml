    syllable_seeds:
      prefixes: [zy, vael, thor, kae, zel, mor, rav, nex, syl, dra, kry, vor, xan, zer, ae, bel]
      middles:  [en, or, ar, eth, yn, ax, is, an, ir, ul, ev, ith]
      suffixes: [loth, ryn, vex, tho, eth, zar, wop, ynn, ath, ex, oth, ael, iel]

    gamer_phrases:
      - OneShot
      - MobFarmer
      - CritKing
