  style_weights:
    dictionary_word: 30
    adjective_noun:  20
    decorated:       16
    leetspeak:       14
    syllable_gen:    10
    gamer_phrase:    10

  persona_bias:
    WarriorGear:     { adjective_noun: 8,  gamer_phrase: 5,  dictionary_word: 3 }
    MagicianGear:    { syllable_gen:   8,  dictionary_word: 5, leetspeak:     3 }
    ArcherGear:      { dictionary_word: 5, adjective_noun: 5, syllable_gen:  3 }
    ThiefGear:       { decorated:      7,  leetspeak:      5, syllable_gen:  3 }
    PirateGear:      { gamer_phrase:   5,  adjective_noun: 5, decorated:     3 }
    ScrollMerchant:  { syllable_gen:   8,  dictionary_word: 3 }
    RareSpecialist:  { decorated:      7,  adjective_noun: 5 }
    NPCVendor:       { gamer_phrase:   8,  dictionary_word: 5 }
    BulkVendor:      { gamer_phrase:   10, dictionary_word: 5 }
    AccessoryVendor: { dictionary_word: 8, syllable_gen:    3 }
    Generalist:      {}

  post_processing:
    suffix_digit_probability: 0.40
    suffix_digit_range: [1, 999]
    case_variation:
      lowercase: 0.20
      uppercase: 0.10
      mixed:     0.70

  constraints:
    min_length: 4
    max_length: 13
    allowed_regex: "^[A-Za-z0-9]+$"
    profanity_wordlist: scripts/config/wordlists/profanity.txt
    restricted_names:
      - GM
      - Admin
      - CM
      - Tester
      - Moderator
      - Staff
      - Server
      - Bot
      - System
      - Support
      - Help
      - Info
      - MapleGM
      - MapleStory
      - AdminBot
    real_player_collision_check: true
    existing_bot_collision_check: true

  generation:
    max_regeneration_attempts: 20
    distribution_tolerance_pct: 2
