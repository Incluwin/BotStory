# Set-effects configuration. Loaded by server.set.SetItemManager on startup.
#
# Thresholds are cumulative: a player at 3pc gets 2pc bonus + 3pc bonus.
# 'allStats' applies to each of STR / DEX / INT / LUK simultaneously.
#
# Tier 4 Timeless (L120) numbers verbatim from PLAN.md; KuroMS-mirror.
# Reverse items are listed as set members because they count toward the same Timeless set
# (Reverse is a cosmetic/color variant in KMS canon).
#
# Currently wired to combat math: allStats / watk / matk / hp / mp.
# Recorded but not yet applied: wdef / mdef / acc / avoid / speed / jump / bossDamagePct / finalDamagePct.
# (v83 handles these client-side; adding them needs a combat-path hook.)

