# PvP reference numbers (docs/PVP_PLAN.md section 2, step 2), read by server.pvp.PvpReference at first use.
# Source: `!pvp calibrate` on the live server 2026-11-08 20:40 server time (logs/pvp/reference-20261109-0140.yaml),
# 240 loaded characters at Lv 30+.
#
# h_ref is left out on purpose: the per-band medians outside Lv 50-109 came from one or two classes (40s: 1,564 from
# magicians and thieves; 120s: 8,332 from warriors and magicians), so PvpReference uses its fit, 34 x L^1.11, which
# tracks the solid bands (50s-100s) within about 7%. Add an `h_ref:` section only from a band with n >= 20 and all five
# classes.
#
# The rates below come from practice duels (V2), not the V0 damage meter (after 71 minutes it had 19 rows from one or
# two characters each). Source: `!pvp rates` on the fifth practice run, 2026-11-09 11:19-11:50, build 1e2e2b18b
# (full-rate bots, key repeat, whole start, combo orbs and Aran combo on duel hits), 87 duels, 174 rows; the file is
# logs/pvp/rates-1794242870770.yaml beside logs/pvp/duels.csv. The four earlier runs are not used: each ran with a bot
# handicap that run five no longer has (docs/PVP_PLAN.md V2), and a rate tuned to a handicapped bot would make players
# of that job hit too hard.
#
# A job path and band's own d_job rate comes first, then its class's class_dps_per_base x its gear_base median, then
# dps_per_base. d_job rows are only those with n >= 5 fighters; rows with fewer stay on the class rate until more
# practice duels come in. No Bishop (23-12) or Lv 100+ row has five yet.
dps_per_base:     # the V0 priors, now only for a class with no measured rate
  physical: 4.6
  magic: 80
class_dps_per_base:   # class (1 warrior .. 5 pirate) -> measured median raw dps per point of gear base
