# Per-item per-SMT absolute prices (BOT_ECONOMY.md § Price-table shape).
# Sparse: only items that need explicit SMT-tier prices. Missing entries fall back to
# NPC_sell x 4 (recorded as clamp_floor_count and flagged by invariant 8).
#
# After seed migration, this file seeds the bot_item_prices DB table; the DB becomes
# authoritative. Editing this file post-seed only matters on re-migration.
#
# Rule of thumb: at each SMT, aim for ~30-60% of the p75 player's typical liquid meso
# on aspirational items (R3+), 5-20% on staples (R1-R2).

